<style>/* The AI Engineer from Zero look: a field-guide book. Index on the left, one reading column,
   contents on the right on wide screens. Light by default on a near-white page; a near-black night
   theme is one toggle away. Blue is the one accent; teal, amber, rose and plum only mark callouts. */
:root {
  color-scheme: light;
  --ink: #fcfcfb;        /* page */
  --panel: #ffffff;      /* cards, raised surfaces */
  --well: #f5f6f8;       /* code blocks, inputs */
  --tint: #eef1f5;       /* inline code, quiet fills */
  --rule: #e2e5eb;
  --rule-2: #eceff3;
  --fg: #23262e;
  --mute: #575b66;
  --faint: #8b909b;
  --ember: #1f5fc4;      /* the accent */
  --ember-ink: #ffffff;
  --soft: rgba(31, 95, 196, 0.08);
  --gold: #1a4a96;       /* deep blue for emphasis text */
  --teal: #0f7a6a;
  --amber: #995a05;
  --plum: #4b55b8;
  --rose: #ab3450;
  --ok: #1d7a4c;
  --bad: #b5303a;
  --mark-off: rgba(35, 38, 46, 0.16);
  /* code, in GitHub's light theme */
  --gh-fg: #1f2328; --gh-bg: #f6f8fa; --gh-file: #ffffff; --gh-border: #d1d9e0; --gh-inline: rgba(129, 139, 152, 0.12);
  --gh-kw: #cf222e; --gh-str: #0a3069; --gh-com: #59636e; --gh-const: #0550ae; --gh-ent: #6639ba; --gh-var: #953800;
  /* older names the page still uses */
  --run: var(--ember); --link: var(--ember); --hold: var(--ember); --hold-ink: var(--gold);
  --display: "Instrument Serif", "CMU Serif", Georgia, serif;
  --read: "Newsreader", "CMU Serif", Georgia, serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --fig: "CMU Serif", "Latin Modern Roman", Georgia, serif;
  --top: 54px;
  --side: 272px;
  --read-w: 40em;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  /* night: near-black neutral greys, the same blue accent */
  --ink: #0a0a0b; --panel: #141415; --well: #101011; --tint: #1d1d1f; --rule: #2a2a2d; --rule-2: #1f1f21;
  --fg: #ececee; --mute: #a6a6ad; --faint: #717177;
  --ember: #5b9bff; --ember-ink: #050608; --soft: rgba(91, 155, 255, 0.12); --gold: #8ec5ff;
  --teal: #3fc7b3; --amber: #f2b85b; --plum: #a7b4ff; --rose: #f2839a; --ok: #5ccf96; --bad: #f07a86;
  --mark-off: rgba(236, 236, 238, 0.16);
  --gh-fg: #f0f6fc; --gh-bg: #151b23; --gh-file: #0d1117; --gh-border: #3d444d; --gh-inline: rgba(101, 108, 118, 0.2);
  --gh-kw: #ff7b72; --gh-str: #a5d6ff; --gh-com: #9198a1; --gh-const: #79c0ff; --gh-ent: #d2a8ff; --gh-var: #ffa657;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font: 400 20px/1.46 var(--read); font-feature-settings: "kern", "liga"; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--ink); }
::selection { background: color-mix(in srgb, var(--ember) 30%, transparent); }
a { color: var(--ember); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--ember) 45%, transparent); }
a:hover { text-decoration-color: var(--ember); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 4px; }
code, pre, kbd { font-family: var(--mono); }
p code, li code, td code, dd code, h2 code, h3 code, .q code, .opt code, .why code, .goal code, .front code, .crumb code, .tag code {
  font-family: var(--mono); font-size: 0.8em; padding: 0.2em 0.4em; border-radius: 6px; background: var(--gh-inline); color: var(--gh-fg); white-space: break-spaces;
}
h1, h2, h3 { font-family: var(--display); font-weight: 400; letter-spacing: 0; text-wrap: balance; margin: 0; line-height: 1.08; }
h1 em, h1 i, h2 em { font-style: italic; }
.label { font: 600 13px/1.35 var(--body); letter-spacing: 0; text-transform: none; color: var(--mute); }
.mute { color: var(--mute); }
.tnum { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- frame ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--top);
  display: flex; align-items: center; gap: 10px;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--ink) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px 6px; min-width: 0; color: var(--fg); }
.brand b { font: 400 21px/1 var(--display); white-space: nowrap; }
.brand i { font-family: var(--display); color: var(--gold); }
.iconbtn { background: none; border: 1px solid transparent; border-radius: 9px; padding: 7px; cursor: pointer; color: var(--mute); display: grid; place-items: center; }
.iconbtn:hover { color: var(--fg); border-color: var(--rule); }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 7px; font: 600 13px/1 var(--body); border: 1px solid var(--rule); border-radius: 999px; padding: 7px 12px; background: transparent; cursor: pointer; color: var(--mute); white-space: nowrap; }
.chip:hover { border-color: var(--faint); color: var(--fg); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ember); }
.chip.quiet .dot { background: var(--mark-off); }
.hide-sm { display: inline-flex; }
.switch { position: relative; width: 40px; height: 22px; flex: none; border: 0; padding: 0; background: none; cursor: pointer; }
.switch .tr { position: absolute; inset: 0; border-radius: 999px; border: 1px solid var(--rule); background: var(--panel); }
.switch .kn { position: absolute; top: 4px; left: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); transition: transform 0.2s; }
:root[data-theme="dark"] .switch .kn { transform: translateX(18px); }

.side { position: fixed; left: 0; bottom: 0; top: calc(env(safe-area-inset-top, 0px) + var(--top)); width: var(--side); border-right: 1px solid var(--rule); background: var(--ink); overflow-y: auto; padding: 12px 0 40px; padding-left: max(0px, env(safe-area-inset-left, 0px)); scrollbar-width: none; transition: transform .3s ease; z-index: 40; }
.side::-webkit-scrollbar { display: none; }
.side.closed { transform: translateX(-100%); }
.main { margin-left: var(--side); transition: margin .3s ease; min-width: 0; }
.main.wide { margin-left: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 32px 96px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1024px) { .wrap { padding-left: max(44px, env(safe-area-inset-left, 0px)); padding-right: max(36px, env(safe-area-inset-right, 0px)); } }
.scrim { display: none; }
@media (max-width: 1023px) {
  .side { top: 0; z-index: 80; width: min(88vw, 340px); padding-top: calc(env(safe-area-inset-top, 0px) + 10px); }
  .side:not(.closed) { box-shadow: 0 0 40px rgba(0, 0, 0, 0.25); }
  .main { margin-left: 0; }
  .scrim.on { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 70; }
}
@media (max-width: 560px) { .hide-sm { display: none; } .brand b { font-size: 19px; } }

.nav { display: grid; gap: 1px; padding: 0 8px; }
.nav button { display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; border-left: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--fg); font: 400 15.5px/1.35 var(--read); width: 100%; }
.nav button:hover { border-left-color: var(--rule); }
.nav button.on { border-left-color: var(--ember); font-weight: 600; }
.nav .count { margin-left: auto; font: 600 12px var(--body); color: var(--faint); }
.navsec { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 12px; }
.navsec > .label { padding: 0 20px 8px; display: block; }
.trk { border-bottom: 1px solid var(--rule); }
.trk > button { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 8px; align-items: start; text-align: left; width: 100%; background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--fg); }
.trk .tn { font: 400 12px/1.9 var(--mono); color: var(--faint); }
.trk .tt { font: 400 17px/1.2 var(--display); }
.trk .draft { grid-column: 2; }
.trk ul { list-style: none; margin: 0 0 8px; padding: 0 8px 0 30px; }
.trk li button { display: flex; gap: 9px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid transparent; padding: 5px 10px; cursor: pointer; font: 400 15px/1.35 var(--read); color: var(--mute); }
.trk li button:hover { color: var(--fg); border-left-color: var(--rule); }
.trk li button.on { color: var(--fg); font-weight: 600; border-left-color: var(--ember); }
.trk li .cell { flex: none; transform: translateY(-1px); }
.field.filter { margin: 4px 20px 6px; width: calc(100% - 40px); font-size: 15px; }

/* progress marks: filled = done, ringed = next, faint = later */
.draft { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.cell { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--mark-off); border: 0; flex: none; }
.cell.done { background: var(--ember); }
.cell.here { background: var(--ember); box-shadow: 0 0 0 2px var(--ink), 0 0 0 3.2px var(--ember); }
.cell.lg { width: 11px; height: 11px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent; background: var(--ember); color: var(--ember-ink); font: 600 15px var(--body); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { filter: brightness(1.06); text-decoration: none; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--rule); font-weight: 500; }
.btn.ghost:hover { border-color: var(--mute); }
.btn.hold { background: var(--ember); color: var(--ember-ink); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 14px; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { width: 100%; background: var(--panel); color: var(--fg); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; font: 17px/1.5 var(--read); resize: vertical; }
.field:focus { outline: none; border-color: var(--mute); }
select.field { width: auto; font: 14px var(--body); height: 34px; padding: 0 10px; border-radius: 9px; }
.linkish { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 20px 22px; }
.hair { border: 0; border-top: 1px solid var(--rule); margin: 0; }

/* ---------- prose ---------- */
.prose { max-width: var(--read-w); }
.prose > * { margin: 0 0 0.9em; }
.prose > *:last-child { margin-bottom: 0; }
.prose ul { list-style: disc outside; padding-left: 1.5em; }
.prose ol { list-style: decimal outside; padding-left: 1.5em; }
.prose li { margin: 0.35em 0; padding-left: 0.2em; }
.prose ul li::marker { content: "\2022  "; color: var(--ember); font-size: 1.15em; }
.prose ol li::marker { font-family: var(--read); font-weight: 600; color: var(--ember); font-variant-numeric: lining-nums; }
.prose strong { font-weight: 600; color: var(--fg); }
.prose h3, .prose h4 { font: 600 20px/1.3 var(--read); margin-top: 1.3em; }
.tablewrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); }
.tablewrap table { border-collapse: collapse; width: 100%; font: 15px/1.45 var(--body); }
.tablewrap th, .tablewrap td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tablewrap th { font-weight: 600; font-size: 13px; color: var(--mute); background: var(--well); }
.tablewrap tr:last-child td { border-bottom: 0; }

/* ---------- code: GitHub's look (markdown blocks on a grey panel, files with a header bar) ---------- */
pre.code, .codebox pre { margin: 0; background: var(--gh-bg); color: var(--gh-fg); border: 0; border-radius: 6px; padding: 16px; overflow-x: auto; font: 400 14px/1.5 var(--mono); tab-size: 4; max-width: 100%; }
.prose pre.code { margin: 0 0 1em; }
.codebox { border: 1px solid var(--gh-border); border-radius: 6px; overflow: hidden; background: var(--gh-file); min-width: 0; }
.codebox .bar { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--gh-border); font: 600 13px var(--body); color: var(--gh-fg); background: var(--gh-bg); }
.codebox .bar .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 13px var(--mono); }
.codebox .bar .label { font-size: 12px; font-weight: 500; color: var(--gh-com); }
.codebox pre { background: var(--gh-file); border-radius: 0; }
.codebox .run { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-top: 1px solid var(--gh-border); font: 13px/1.4 var(--mono); color: var(--gh-com); background: var(--gh-bg); }
.codebox .run code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; color: var(--gh-fg); }
.copy { font: 500 12px var(--body); background: var(--gh-file); border: 1px solid var(--gh-border); border-radius: 6px; padding: 3px 10px; cursor: pointer; color: var(--gh-fg); }
.copy:hover { background: var(--gh-bg); }
code, pre, kbd, .codebox, .sim ol { font-variant-ligatures: none; }
/* Pygments token classes mapped to GitHub's syntax roles */
.k, .kd, .kn, .kr, .kp, .kt, .ow { color: var(--gh-kw); }
.kc, .m, .mi, .mf, .mh, .il, .mb, .mo, .nb, .bp, .no { color: var(--gh-const); }
.s, .s1, .s2, .sb, .sc, .se, .sa, .sh, .sx, .si, .sd, .dl, .sr { color: var(--gh-str); }
.c, .c1, .cm, .cs, .ch, .cp, .cpf { color: var(--gh-com); }
.nf, .fm, .nc, .ne { color: var(--gh-ent); }
.nd, .nl { color: var(--gh-var); }
.n, .nn, .na, .nv, .o, .p, .w { color: inherit; }
.gp { color: var(--gh-com); user-select: none; }
.err { color: inherit; background: none; }

/* Java/Kotlin pairs: html[data-code] is java, kotlin or both */
.pair { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); min-width: 0; margin: 0 0 1em; max-width: 100%; }
.pair:last-child { margin-bottom: 0; }
.pi { display: grid; gap: 4px; min-width: 0; }
.pi .lg { font: 600 12.5px var(--body); color: var(--mute); }
.pi[data-lang="java"] .lg { color: var(--ember); }
.pi[data-lang="kotlin"] .lg { color: var(--plum); }
.pi pre.code { margin: 0; }
.pairbar { display: inline-flex; justify-self: start; gap: 2px; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; }
.pairbar button { border: 0; background: none; padding: 3px 11px; border-radius: 999px; cursor: pointer; font: 500 12.5px var(--body); color: var(--mute); }
.pairbar button:hover { color: var(--fg); }
:root[data-code="java"] .pairbar [data-lang="java"], :root[data-code="kotlin"] .pairbar [data-lang="kotlin"], :root[data-code="both"] .pairbar [data-lang="both"], :root:not([data-code]) .pairbar [data-lang="both"] { background: var(--ember); color: var(--ember-ink); }
:root[data-code="java"] .pair > .pi[data-lang="kotlin"], :root[data-code="kotlin"] .pair > .pi[data-lang="java"] { display: none; }
.cmp { container-type: inline-size; display: grid; gap: 12px; }
@container (min-width: 900px) {
  :root[data-code="both"] .pair.cols2, :root:not([data-code]) .pair.cols2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .pair.cols2 > .pairbar { grid-column: 1 / -1; }
}

/* ---------- home ---------- */
.hero { display: grid; gap: 22px; margin-bottom: 44px; }
.hero h1 { font-size: clamp(46px, 7vw, 68px); line-height: 1.02; }
.hero h1 i { color: var(--gold); }
.hero p { font-size: 20.5px; color: var(--mute); max-width: 42em; margin: 0; }
.plate-wrap { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 18px 0; overflow-x: auto; }
.plate-svg { display: block; width: 100%; max-width: 860px; height: auto; }
.plate-svg .wk { font: 12px var(--mono); fill: var(--faint); }
.plate-svg circle { cursor: pointer; }
.plate-legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font: 14px var(--body); color: var(--mute); align-items: center; }
.plate-legend span { display: inline-flex; gap: 8px; align-items: center; }
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
.pulse { animation: pulse 1.8s ease-in-out infinite; }

.today { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); margin-bottom: 52px; }
@media (min-width: 900px) { .today { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, .9fr); } }
.step { display: grid; gap: 10px; align-content: start; }
.step .n { font: 600 13px var(--body); color: var(--mute); display: flex; gap: 8px; align-items: center; }
.step h3 { font-size: 30px; }
.step.now { border-color: color-mix(in srgb, var(--ember) 45%, var(--rule)); box-shadow: 0 0 0 3px var(--soft); }
.stat { font: 400 44px/1 var(--display); }
.stat small { font: 600 13px var(--body); color: var(--faint); margin-left: 8px; }

.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 16px; flex-wrap: wrap; }
.sechead h2 { font-size: 36px; }
.tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; margin-bottom: 52px; }
.tcard { text-align: left; cursor: pointer; display: grid; gap: 10px; align-content: start; color: var(--fg); transition: border-color .15s; font: inherit; }
.tcard:hover { border-color: var(--mute); }
.tcard h3 { font-size: 26px; }
.tcard p { margin: 0; font-size: 17px; color: var(--mute); line-height: 1.45; }
.tcard .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 600 13px var(--body); color: var(--faint); }
.how { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.how div { border-top: 1px solid var(--rule); padding-top: 12px; }
.how b { display: block; font: 400 24px/1.2 var(--display); margin-bottom: 4px; }
.how span { color: var(--mute); font-size: 17.5px; }

/* ---------- lesson ---------- */
.lgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 52px; }
@media (min-width: 1280px) { .lgrid { grid-template-columns: minmax(0, 1fr) 232px; } }
.lgrid > article { min-width: 0; max-width: 900px; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top) + 26px); align-self: start; display: none; max-height: calc(100vh - 120px); overflow-y: auto; font-family: var(--body); }
@media (min-width: 1280px) { .toc { display: block; } }
.toc ul { list-style: none; margin: 10px 0 0; padding: 0; border-left: 1px solid var(--rule); }
.toc li button { display: flex; gap: 8px; background: none; border: 0; text-align: left; cursor: pointer; padding: 6px 0 6px 14px; margin-left: -1px; border-left: 2px solid transparent; font: 14px/1.35 var(--body); color: var(--mute); width: 100%; }
.toc li button:hover { color: var(--fg); }
.toc li.on button { color: var(--fg); border-left-color: var(--ember); }
.toc li button .label { color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
.toc li.on button .label { color: var(--ember); }
.lhead { display: grid; gap: 14px; margin-bottom: 30px; max-width: 900px; }
.crumb { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.crumb > .label:first-child { font: 600 13px var(--body); padding: 4px 11px; border-radius: 999px; background: var(--soft); color: var(--ember) !important; }
.crumb button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--mute); font: italic 17px var(--read); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.crumb button:hover { color: var(--fg); }
.crumb .label { font: italic 400 17px var(--read); color: var(--mute); }
.lhead h1 { font-size: clamp(40px, 5vw, 58px); line-height: 1.02; max-width: 20ch; }
.goal { font-size: 20.5px; line-height: 1.5; color: var(--mute); margin: 0; max-width: 42em; }
.donebar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.done-pill { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; font: 600 14px var(--body); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 55%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.lsec { padding-top: 0; margin-top: 76px; scroll-margin-top: calc(var(--top) + 16px); display: grid; gap: 18px; }
.lsec:first-of-type { margin-top: 46px; }
.shead { display: flex; gap: 14px; align-items: center; }
.shead .sn { font: 400 23px var(--display); color: var(--ember); width: 42px; height: 42px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; flex: none; font-variant-numeric: lining-nums; }
.shead h2 { font-size: 34px; line-height: 1.1; }
.block { margin-top: 84px; scroll-margin-top: calc(var(--top) + 16px); display: grid; gap: 16px; }
.block > h2 { font-size: 36px; }
.block > .label { margin-bottom: -8px; }

.call { border-radius: 14px; padding: 14px 18px; border: 1px solid transparent; max-width: none; }
.call > .label { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font: 600 17px var(--read); }
.call .prose { font-size: 18.5px; max-width: none; }
.call.analogy { background: color-mix(in srgb, var(--teal) 7%, transparent); border-color: color-mix(in srgb, var(--teal) 26%, transparent); }
.call.analogy > .label { color: var(--teal); }
.call.world { background: color-mix(in srgb, var(--amber) 7%, transparent); border-color: color-mix(in srgb, var(--amber) 26%, transparent); }
.call.world > .label { color: var(--amber); }
.call.mistake { background: color-mix(in srgb, var(--rose) 6%, transparent); border-color: color-mix(in srgb, var(--rose) 26%, transparent); }
.call.mistake > .label { color: var(--rose); }

.tryit { border-radius: 14px; padding: 14px 18px; display: grid; gap: 10px; background: color-mix(in srgb, var(--teal) 6%, transparent); border: 1px solid color-mix(in srgb, var(--teal) 28%, transparent); }
.tryit .th { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font: 600 17px var(--read); }
.tryit .th > .label { color: var(--teal); font: 600 17px var(--read); }
.tryit .th b { font: 600 17px var(--read); color: var(--fg); }
.tryit .mins { margin-left: auto; font: italic 15px var(--read); color: var(--faint); }
.tryit ol { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-size: 18px; line-height: 1.42; }
.tryit ol li::marker { color: var(--teal); font-weight: 600; }
.tryit > .label { font-weight: 400; color: var(--faint); }
.expect { border-top: 1px dashed color-mix(in srgb, var(--teal) 35%, transparent); padding-top: 8px; }
.expect .prose { font-size: 17px; }
details.reveal > summary { cursor: pointer; font: 600 15.5px var(--read); color: var(--teal); list-style: none; }
details.reveal > summary::-webkit-details-marker { display: none; }
details.reveal > summary::before { content: "+ "; }
details.reveal[open] > summary::before { content: "\2212  "; }

/* figures sit on a black stage with the Manim palette, in both themes */
figure.fig { margin: 0; display: grid; gap: 0; }
.fig .svg { overflow-x: auto; border: 1px solid #1d2026; border-radius: 14px; padding: 18px; background: #000; }
.fig svg { display: block; width: 100%; min-width: 480px; max-width: 700px; height: auto; margin: 0 auto; font-family: var(--fig); }
.fig figcaption { font: italic 16px/1.45 var(--read); color: var(--mute); margin-top: 10px; }
.fig figcaption b { font-style: normal; font-weight: 600; color: var(--fg); margin-right: 6px; }
svg .box { fill: transparent; stroke: #ffffff; stroke-opacity: 0.85; stroke-width: 1.6; }
svg .box-a { fill: rgba(88, 196, 221, 0.14); stroke: #58c4dd; stroke-width: 1.8; }
svg .box-b { fill: rgba(247, 217, 111, 0.13); stroke: #f7d96f; stroke-width: 1.8; }
svg .box-ok { fill: rgba(131, 193, 103, 0.14); stroke: #83c167; stroke-width: 1.8; }
svg .box-bad { fill: rgba(252, 98, 85, 0.14); stroke: #fc6255; stroke-width: 1.8; }
svg .box-dim { fill: rgba(252, 98, 85, 0.06); stroke: #fc6255; stroke-width: 1.2; stroke-dasharray: 5 5; }
.fig svg text { fill: #ffffff; font-family: var(--fig); font-size: 14px; }
.fig svg .t { fill: #ffffff; }
.fig svg .t-s { font-size: 12.5px; }
.fig svg .t-m { fill: #b8b8b8; font-style: italic; }
.fig svg .t-a { fill: #58c4dd; }
.fig svg .t-b { fill: #f7d96f; }
.fig svg .t-ok { fill: #83c167; }
.fig svg .t-bad { fill: #fc6255; }
.fig svg .t-code { font-family: var(--mono); font-size: 13.5px; }
.fig svg .t-s.t-code { font-size: 12px; }
svg .ln, svg .ln-d, svg .ln-a, svg .ln-bad { fill: none; stroke: #ffffff; stroke-opacity: 0.8; stroke-width: 1.6; stroke-linecap: round; }
svg .ln-d { stroke: #888888; stroke-opacity: 1; stroke-width: 1.4; stroke-dasharray: 5 5; }
svg .ln-a { stroke: #58c4dd; stroke-opacity: 1; }
svg .ln-bad { stroke: #fc6255; stroke-opacity: 1; }
svg .arrowhead { fill: #ffffff; fill-opacity: 0.85; }

/* interleaving simulator */
.sim { border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; background: var(--panel); }
.sim .simh { padding: 14px 18px; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
.sim .simh b { font: 400 24px/1.2 var(--display); }
.sim .state { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 12px 18px; border-bottom: 1px solid var(--rule); font: 15px var(--mono); background: var(--well); }
.sim .state span b { color: var(--ember); font-weight: 400; }
.sim .threads { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.sim .th { padding: 12px 14px; border-right: 1px solid var(--rule); display: grid; gap: 8px; align-content: start; min-width: 0; }
.sim .th:last-child { border-right: 0; }
.sim .th .tname { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 600 15px var(--body); }
.sim ol { list-style: none; margin: 0; padding: 0; font: 14px/1.5 var(--mono); }
.sim ol li { padding: 3px 8px; border-radius: 6px; color: var(--faint); white-space: pre-wrap; overflow-wrap: anywhere; }
.sim ol li.ran { color: var(--mute); }
.sim ol li.next { background: var(--soft); color: var(--fg); box-shadow: inset 2px 0 0 var(--ember); }
.sim .regs { font: 13px var(--mono); color: var(--mute); min-height: 1.4em; }
.sim .msg { padding: 12px 18px; border-top: 1px solid var(--rule); font-size: 17px; min-height: 48px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.sim .msg.win { background: color-mix(in srgb, var(--amber) 9%, transparent); }
.sim .msg.dead { background: color-mix(in srgb, var(--rose) 9%, transparent); }
.sim .log { padding: 0 18px 12px; font: 12.5px/1.6 var(--mono); color: var(--faint); }
.sim .label { color: var(--faint); }

/* worked example */
.worked { list-style: none; margin: 0; padding: 0; display: grid; }
.worked li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; }
.worked .wn { display: flex; flex-direction: column; align-items: center; }
.worked .wn span { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--ember); color: var(--ember); display: grid; place-items: center; font: 500 13px var(--body); }
.worked .wn i { flex: 1; width: 1px; background: var(--rule); margin: 4px 0; }
.worked .wb { padding-bottom: 22px; display: grid; gap: 10px; min-width: 0; }

/* lab */
.lab { border: 1px solid var(--rule); border-top: 2px solid var(--ember); border-radius: 16px; padding: 20px 22px; display: grid; gap: 14px; background: var(--panel); }
.lab h3 { font-size: 30px; }
.lab .files { display: grid; gap: 4px; font: 13.5px/1.5 var(--mono); color: var(--mute); }
.lab .files span { overflow-wrap: anywhere; }
.lab ol { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; }
.lab ol li::marker { color: var(--ember); font-weight: 600; }
.hint { border-left: 2px solid var(--amber); padding: 2px 0 2px 12px; font-size: 18px; }
.hint .label { color: var(--amber); margin-right: 8px; }

/* quiz */
.quiz { display: grid; gap: 18px; }
.qcard { border: 1px solid var(--rule); border-radius: 16px; padding: 18px 20px; display: grid; gap: 12px; background: var(--panel); }
.qcard .qn { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.qcard .q { font-size: 19px; font-weight: 600; }
.qcard .q pre { font-weight: 400; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: baseline; text-align: left; border: 1px solid var(--rule); background: transparent; border-radius: 10px; padding: 11px 12px; cursor: pointer; font: 17.5px/1.45 var(--read); color: var(--fg); }
.opt:hover:not([disabled]) { border-color: var(--mute); }
.opt[disabled] { cursor: default; }
.opt .key { font: 500 13px var(--mono); color: var(--mute); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, transparent); }
.opt.right .key { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, transparent); }
.opt.wrong .key { color: var(--bad); }
.why { font-size: 17px; color: var(--mute); border-top: 1px dashed var(--rule); padding-top: 10px; }
.why b { color: var(--fg); }
.tag { font: 600 12px var(--body); border-radius: 999px; padding: 3px 10px; color: var(--mute); background: var(--tint); border: 0; }
.tag.from { background: var(--soft); color: var(--ember); }
.score { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; border: 1px solid var(--rule); border-radius: 16px; padding: 16px 20px; background: var(--panel); }
.score b { font: 400 32px var(--display); }

.recap { border: 1px solid var(--rule); border-radius: 16px; padding: 18px 22px; background: var(--panel); }
.recap ul { margin: 8px 0 0; padding-left: 1.3em; display: grid; gap: 6px; }
.terms { display: grid; gap: 0 32px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); margin: 0; }
.terms div { border-top: 1px solid var(--rule); padding: 10px 0; }
.terms dt { font-weight: 600; }
.terms dd { margin: 2px 0 0; color: var(--mute); font-size: 17px; line-height: 1.45; }
.cards-preview { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.cards-preview div { border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; font-size: 16px; line-height: 1.4; color: var(--mute); background: var(--panel); }
.refs { display: grid; gap: 6px; font: 16px/1.45 var(--body); border-top: 1px dashed var(--rule); padding-top: 10px; }
.refs a { color: var(--fg); text-decoration-color: var(--rule); overflow-wrap: anywhere; }
.refs a:hover { text-decoration-color: var(--ember); }
.refs .kind { font: 600 11.5px var(--body); padding: 2px 8px; border-radius: 6px; background: var(--soft); color: var(--ember); margin-right: 8px; text-transform: capitalize; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; border-top: 1px solid var(--rule); padding-top: 22px; margin-top: 64px; }
.pager button { background: none; border: 0; cursor: pointer; text-align: left; padding: 0; display: grid; gap: 4px; color: var(--fg); }
.pager button.nx { text-align: right; justify-items: end; }
.pager b { font: 400 23px/1.2 var(--display); }
.pending { max-width: 60ch; }

/* ---------- review ---------- */
.rv { max-width: 760px; display: grid; gap: 18px; }
.rv h1 { font-size: 50px; }
.flash { border: 1px solid var(--rule); border-radius: 16px; background: var(--panel); padding: 26px 26px 22px; display: grid; gap: 16px; min-height: 260px; align-content: start; }
.flash .front { font: 400 29px/1.25 var(--display); }
.flash .front code { font-size: .7em; }
.flash .back { border-top: 1px dashed var(--rule); padding-top: 16px; font-size: 19px; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grades button { display: grid; gap: 2px; justify-items: center; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--rule); background: var(--panel); cursor: pointer; font: 600 15px var(--body); color: var(--fg); }
.grades button small { font: 500 12px var(--body); color: var(--faint); }
.grades button:hover { border-color: var(--mute); }
.grades .g1 { border-color: color-mix(in srgb, var(--bad) 50%, var(--rule)); }
.grades .g3 { border-color: color-mix(in srgb, var(--ember) 60%, var(--rule)); }
.meter { height: 6px; background: var(--tint); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ember); }

/* ---------- plan ---------- */
.weeks { display: grid; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.wk { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; border: 1px solid transparent; }
.wk.cur { border-color: color-mix(in srgb, var(--ember) 45%, var(--rule)); background: var(--soft); }
.wk .label { width: 62px; flex: none; }
.wkcells { display: flex; gap: 7px; align-items: center; }
.wkcells .cell { cursor: pointer; padding: 0; }
.wkcells .cell:hover { outline: 2px solid var(--rule); outline-offset: 2px; }
.plan-list { display: grid; }
.plan-list .pr { display: grid; grid-template-columns: 96px 14px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--rule); font-size: 17px; }
.plan-list .pr .d { font: 500 13px var(--body); color: var(--faint); }
.plan-list .pr button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--fg); font: inherit; }
.plan-list .pr button .label { font-weight: 400; }
.plan-list .ptrack { padding: 22px 4px 6px; font: 400 24px var(--display); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 14px; }

/* ---------- focus timer ---------- */
.timer { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 55; width: min(320px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12); font-family: var(--body); }
.timer .tt { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.timer .big { font: 400 36px/1 var(--display); font-variant-numeric: tabular-nums; }
.phases { display: grid; gap: 3px; }
.phases div { display: grid; gap: 4px; }
.phases i { height: 6px; border-radius: 99px; background: var(--tint); overflow: hidden; display: block; }
.phases i b { display: block; height: 100%; background: var(--faint); }
.phases div.cur i b { background: var(--ember); }
.phases span { font: 600 11.5px var(--body); color: var(--faint); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); background: var(--panel); color: var(--fg); border: 1px solid var(--rule); padding: 10px 16px; border-radius: 12px; font: 15px var(--body); z-index: 90; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12); max-width: calc(100vw - 32px); }
.empty { border: 1px dashed var(--rule); border-radius: 16px; padding: 24px; color: var(--mute); }
.sheet { margin-bottom: 48px; }
.sheet h2 { font-size: 34px; margin-bottom: 12px; }

/* grids that hold code never grow past their column */
.lsec, .block, .tryit, .lab, .quiz, .qcard, .rv, .flash, .step, .lhead, .cmp, .call, .tcard, .score > div { grid-template-columns: minmax(0, 1fr); min-width: 0; }
.tryit .label, .crumb .label { overflow-wrap: anywhere; }
</style>

<script type="application/json" id="course">{"title":"JVM Workbench","tagline":"Concurrency, the JVM runtime, generics and design patterns in Java and Kotlin, one focused session a day.","repo":"https://github.com/arunav-bhattacharya/jvm-workbench","tracks":[{"id":"conc","lab":"concurrency","title":"Threads and the bugs they cause","short":"Threads, races, locks, deadlock, atomics, concurrent collections and synchronizers.","lessons":["conc-01","conc-02","conc-03","conc-04","conc-05","conc-06","conc-07","conc-08","conc-09","conc-10","conc-11","conc-12","conc-13"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"jmm","lab":"jmm","title":"The Java Memory Model","short":"Visibility, reordering, happens-before, volatile, safe publication and VarHandles.","lessons":["jmm-01","jmm-02","jmm-03","jmm-04","jmm-05","jmm-06"],"intro":"<p>By the end of this track you can explain why one thread may never see another thread's write, name the happens-before edge that makes a read safe, and choose between <code>volatile<\/code>, an atomic and a lock for any shared field. You can publish objects so other threads see them whole, write lazy initialization that builds exactly once, and read VarHandle memory modes and jcstress results without guessing. This is the theory under every concurrent class you use, and the reason \"it passed on my machine\" means so little.<\/p>\n<p>You need the first track: threads, race conditions, <code>synchronized<\/code> and atomics. Install JDK 25. The memory model has not changed since Java 5 (JSR-133), so everything here holds from JDK 21 to JDK 27; when a lesson mentions a newer feature, it says which JDK.<\/p>\n<p>The labs live in <code>labs/jmm<\/code>, one package per lesson (<code>workbench.jmm.l01<\/code> to <code>l06<\/code>). They are in Java, and every code sample and Try-it demo also comes in Kotlin. Memory-model bugs rarely show up on demand, so the tests check code that is deterministic once it's right: a loop that must stop, an initializer that must run exactly once under contention, a handoff that must deliver every item. Generous time limits make a broken version fail instead of hanging the build. Run <code>./gradlew :jmm:test --tests 'workbench.jmm.lNN.*'<\/code> from <code>labs/<\/code> until it passes, and <code>./gradlew :jmm:solutionTest<\/code> to run the same tests on the reference answers. Lesson 6 shows how to go further with jcstress, which runs outside Gradle.<\/p>","cheatsheet":"<h2>The one rule<\/h2>\n<p>A write is guaranteed visible to a read in another thread only if the write <strong>happens-before<\/strong> the read. Without an edge you have a data race: stale values that may never update, writes that seem to arrive out of order, and torn <code>long<\/code> and <code>double<\/code> values.<\/p>\n<h2>The edges you use<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>The writer does<\/th>\n<th>The reader does<\/th>\n<th>Edge?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>anything, then leaves <code>synchronized (m)<\/code><\/td>\n<td>enters <code>synchronized (m)<\/code> on the same <code>m<\/code><\/td>\n<td>yes<\/td>\n<\/tr>\n<tr>\n<td>anything, then writes volatile <code>v<\/code><\/td>\n<td>reads the same <code>v<\/code> and sees that write<\/td>\n<td>yes<\/td>\n<\/tr>\n<tr>\n<td><code>t.start()<\/code><\/td>\n<td>anything inside <code>t<\/code><\/td>\n<td>yes<\/td>\n<\/tr>\n<tr>\n<td>anything inside <code>t<\/code><\/td>\n<td><code>t.join()<\/code> returns<\/td>\n<td>yes<\/td>\n<\/tr>\n<tr>\n<td>puts into a concurrent collection<\/td>\n<td>a <code>get<\/code> or <code>take<\/code> that returns it<\/td>\n<td>yes<\/td>\n<\/tr>\n<tr>\n<td><code>executor.submit(task)<\/code><\/td>\n<td>the task runs<\/td>\n<td>yes<\/td>\n<\/tr>\n<tr>\n<td>the task of a <code>Future<\/code><\/td>\n<td><code>future.get()<\/code> returns<\/td>\n<td>yes<\/td>\n<\/tr>\n<tr>\n<td><code>latch.countDown()<\/code>, <code>semaphore.release()<\/code>, <code>lock.unlock()<\/code><\/td>\n<td><code>latch.await()<\/code>, <code>acquire()<\/code>, <code>lock()<\/code> returns<\/td>\n<td>yes<\/td>\n<\/tr>\n<tr>\n<td><code>Thread.sleep<\/code>, a different lock, a different volatile field<\/td>\n<td>anything<\/td>\n<td><strong>no<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Edges chain: if A happens-before B and B happens-before C, then A happens-before C. That's how a plain field written before a volatile write reaches the reader of that volatile.<\/p>\n<h2>Pick the tool for a shared field<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>One writer, readers want the latest value (stop flag, status, config version)<\/td>\n<td><code>volatile<\/code> / <code>@Volatile<\/code><\/td>\n<\/tr>\n<tr>\n<td>Many writers update one number (<code>count++<\/code>, <code>balance += x<\/code>)<\/td>\n<td><code>AtomicLong<\/code>, <code>LongAdder<\/code>, <code>ConcurrentHashMap.merge<\/code><\/td>\n<\/tr>\n<tr>\n<td>Several fields must change together<\/td>\n<td>a lock, or one immutable object behind a volatile reference<\/td>\n<\/tr>\n<tr>\n<td>A whole object replaced at runtime (rate card, issuer config)<\/td>\n<td>immutable snapshot published with one volatile write<\/td>\n<\/tr>\n<tr>\n<td>One value per key, built once<\/td>\n<td><code>computeIfAbsent<\/code> (not Kotlin's <code>getOrPut<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>\"First writer wins\"<\/td>\n<td><code>compareAndSet<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>volatile<\/code> gives visibility, ordering of the plain writes before it, one order of all volatile accesses, and atomic 64-bit reads and writes. It does not make <code>v++<\/code> atomic, does not protect the object it points to, and does nothing for a thread that doesn't read it.<\/p>\n<h2>Safe publication and immutability<\/h2>\n<p>Publish through one of: a static initializer; a volatile field or <code>AtomicReference<\/code>; a final field of a properly constructed object; a lock or a <code>java.util.concurrent<\/code> handoff. An immutable object (final class, final fields, mutable inputs copied, nothing mutable handed out, no escaping <code>this<\/code>) is safe through any race. Never let <code>this<\/code> escape a constructor: register listeners and start threads afterwards, in a factory, a <code>start()<\/code> method or <code>@PostConstruct<\/code>.<\/p>\n<div class=\"pair\"><div class=\"pairbar\" role=\"group\" aria-label=\"Code language\"><button data-act=\"lang\" data-lang=\"java\">Java<\/button><button data-act=\"lang\" data-lang=\"kotlin\">Kotlin<\/button><button data-act=\"lang\" data-lang=\"both\">Both<\/button><\/div><div class=\"pi\" data-lang=\"java\"><span class=\"lg\">Java<\/span><pre class=\"code\" data-lang=\"java\"><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">record<\/span> <span class=\"nc\">IssuerConfig<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">baseUrl<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Duration<\/span><span class=\"w\"> <\/span><span class=\"n\">timeout<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{}<\/span><span class=\"w\">   <\/span><span class=\"c1\">// immutable<\/span>\n\n<span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">volatile<\/span><span class=\"w\"> <\/span><span class=\"n\">IssuerConfig<\/span><span class=\"w\"> <\/span><span class=\"n\">config<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">IssuerConfig<\/span><span class=\"p\">(<\/span><span class=\"s\">\"https://issuer.example\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofMillis<\/span><span class=\"p\">(<\/span><span class=\"mi\">800<\/span><span class=\"p\">));<\/span>\n<span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">refresh<\/span><span class=\"p\">(<\/span><span class=\"n\">Settings<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">config<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">IssuerConfig<\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">baseUrl<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">timeout<\/span><span class=\"p\">());<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">   <\/span><span class=\"c1\">// one volatile write<\/span>\n<span class=\"n\">IssuerConfig<\/span><span class=\"w\"> <\/span><span class=\"nf\">current<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">config<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">                                           <\/span><span class=\"c1\">// one consistent snapshot<\/span>\n<\/code><\/pre><\/div><div class=\"pi\" data-lang=\"kotlin\"><span class=\"lg\">Kotlin<\/span><pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"kd\">data<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">IssuerConfig<\/span><span class=\"p\">(<\/span><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">baseUrl<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"kt\">String<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">timeout<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">Duration<\/span><span class=\"p\">)<\/span><span class=\"w\">   <\/span><span class=\"c1\">// immutable<\/span>\n\n<span class=\"nd\">@Volatile<\/span><span class=\"w\"> <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">var<\/span><span class=\"w\"> <\/span><span class=\"nv\">config<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">IssuerConfig<\/span><span class=\"p\">(<\/span><span class=\"s\">\"https://issuer.example\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofMillis<\/span><span class=\"p\">(<\/span><span class=\"m\">800<\/span><span class=\"p\">))<\/span>\n<span class=\"kd\">fun<\/span><span class=\"w\"> <\/span><span class=\"nf\">refresh<\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">Settings<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">config<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">IssuerConfig<\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">baseUrl<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">timeout<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">   <\/span><span class=\"c1\">// one volatile write<\/span>\n<span class=\"kd\">fun<\/span><span class=\"w\"> <\/span><span class=\"nf\">current<\/span><span class=\"p\">():<\/span><span class=\"w\"> <\/span><span class=\"n\">IssuerConfig<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">config<\/span><span class=\"w\">                                       <\/span><span class=\"c1\">// one consistent snapshot<\/span>\n<\/code><\/pre><\/div><\/div>\n<h2>Lazy initialization<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Need<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Every request needs it anyway<\/td>\n<td>build it eagerly at startup<\/td>\n<\/tr>\n<tr>\n<td>One per JVM, construction can't fail<\/td>\n<td>holder class idiom, enum, Kotlin <code>object<\/code><\/td>\n<\/tr>\n<tr>\n<td>Per instance, or must retry after a failure<\/td>\n<td>double-checked locking on a volatile field, Kotlin <code>by lazy<\/code><\/td>\n<\/tr>\n<tr>\n<td>One per key<\/td>\n<td><code>computeIfAbsent<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"pair\"><div class=\"pairbar\" role=\"group\" aria-label=\"Code language\"><button data-act=\"lang\" data-lang=\"java\">Java<\/button><button data-act=\"lang\" data-lang=\"kotlin\">Kotlin<\/button><button data-act=\"lang\" data-lang=\"both\">Both<\/button><\/div><div class=\"pi\" data-lang=\"java\"><span class=\"lg\">Java<\/span><pre class=\"code\" data-lang=\"java\"><code><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">Holder<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">BinTable<\/span><span class=\"w\"> <\/span><span class=\"n\">INSTANCE<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">BinTable<\/span><span class=\"p\">();<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"n\">BinTable<\/span><span class=\"w\"> <\/span><span class=\"nf\">instance<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">Holder<\/span><span class=\"p\">.<\/span><span class=\"na\">INSTANCE<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">      <\/span><span class=\"c1\">// the JVM's class-init lock does the work<\/span>\n\n<span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">volatile<\/span><span class=\"w\"> <\/span><span class=\"n\">SigningKey<\/span><span class=\"w\"> <\/span><span class=\"n\">key<\/span><span class=\"p\">;<\/span><span class=\"w\">                             <\/span><span class=\"c1\">// volatile is not optional<\/span>\n<span class=\"n\">SigningKey<\/span><span class=\"w\"> <\/span><span class=\"nf\">key<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">SigningKey<\/span><span class=\"w\"> <\/span><span class=\"n\">k<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">key<\/span><span class=\"p\">;<\/span><span class=\"w\">                                      <\/span><span class=\"c1\">// one volatile read on the fast path<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">k<\/span><span class=\"w\"> <\/span><span class=\"o\">!=<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">k<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">synchronized<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"k\">this<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">key<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">key<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">vault<\/span><span class=\"p\">.<\/span><span class=\"na\">fetch<\/span><span class=\"p\">(<\/span><span class=\"s\">\"issuer-signing-key\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">key<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div><div class=\"pi\" data-lang=\"kotlin\"><span class=\"lg\">Kotlin<\/span><pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"kd\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">BinTable<\/span><span class=\"w\"> <\/span><span class=\"n\">private<\/span><span class=\"w\"> <\/span><span class=\"k\">constructor<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">object<\/span><span class=\"w\"> <\/span><span class=\"nc\">Holder<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">INSTANCE<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">BinTable<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">companion<\/span><span class=\"w\"> <\/span><span class=\"kd\">object<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"kd\">fun<\/span><span class=\"w\"> <\/span><span class=\"nf\">instance<\/span><span class=\"p\">():<\/span><span class=\"w\"> <\/span><span class=\"n\">BinTable<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Holder<\/span><span class=\"p\">.<\/span><span class=\"na\">INSTANCE<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">key<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">SigningKey<\/span><span class=\"w\"> <\/span><span class=\"k\">by<\/span><span class=\"w\"> <\/span><span class=\"n\">lazy<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">vault<\/span><span class=\"p\">.<\/span><span class=\"na\">fetch<\/span><span class=\"p\">(<\/span><span class=\"s\">\"issuer-signing-key\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">   <\/span><span class=\"c1\">// SYNCHRONIZED: a volatile DCL<\/span>\n<\/code><\/pre><\/div><\/div>\n<p>Kotlin modes: <code>SYNCHRONIZED<\/code> (default, runs once, others wait, retries if it throws), <code>PUBLICATION<\/code> (may run on several threads, one result wins: only for cheap, side-effect-free work), <code>NONE<\/code> (one thread only). A holder whose initializer throws never retries: later calls get <code>NoClassDefFoundError<\/code>.<\/p>\n<h2>VarHandle access modes<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Methods<\/th>\n<th>Adds<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>plain<\/td>\n<td><code>get<\/code>, <code>set<\/code><\/td>\n<td>nothing across threads<\/td>\n<\/tr>\n<tr>\n<td>opaque<\/td>\n<td><code>getOpaque<\/code>, <code>setOpaque<\/code><\/td>\n<td>each access really happens; untorn; eventually visible<\/td>\n<\/tr>\n<tr>\n<td>acquire/release<\/td>\n<td><code>getAcquire<\/code>, <code>setRelease<\/code><\/td>\n<td>writes before the release are seen after the matching acquire<\/td>\n<\/tr>\n<tr>\n<td>volatile<\/td>\n<td><code>getVolatile<\/code>, <code>setVolatile<\/code><\/td>\n<td>one total order of all volatile accesses<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>compareAndSet<\/code> and <code>getAndAdd<\/code> have volatile semantics. Release/acquire does not forbid the store-buffering result (each thread writes its own flag, both read the other's as 0); only volatile does. <code>AtomicReference<\/code> and friends offer the same modes without a lookup. In app code use <code>volatile<\/code>, the <code>Atomic<\/code> classes and <code>java.util.concurrent<\/code>. Test any lock-free code with jcstress, on ARM if you can, because x86 hides many ordering bugs.<\/p>","recap":["The JIT may read a plain field once for a whole loop, and the CPU's store buffer lets a later read overtake an earlier write. Neither is a bug: the memory model allows both.","A read is guaranteed to see a write only through a happens-before edge: the same lock, the same volatile field, start, join, or a java.util.concurrent handoff. Sleep is not an edge.","volatile gives visibility and ordering for one variable, not atomic read-modify-write. Use atomics or LongAdder for counters, a lock or an immutable snapshot for several fields.","Publishing an object is a write that can race. Publish through a volatile field, a static initializer, a final field or a j.u.c handoff, and prefer immutable objects, which survive any race.","Final fields are seen as the constructor left them, but only if <code>this<\/code> didn't escape the constructor. Wire objects up after construction.","Double-checked locking needs a volatile field. For statics the holder idiom is simpler; in Kotlin, <code>by lazy<\/code> is the same DCL. A failed holder never retries.","VarHandle modes form a ladder: plain, opaque, acquire/release, volatile. Release/acquire hands data from one writer through one variable; only volatile gives one total order.","Tests can't prove the absence of reordering. Write code that is correct by the rules, and use jcstress, ideally on ARM, for anything lock-free."],"quiz":[{"q":"A worker runs <code>while (!stopped) { pollOnce(); }<\/code>, where <code>pollOnce<\/code> is small enough for the JIT to inline and <code>stopped<\/code> is a plain boolean that another thread sets. In production the worker sometimes never stops. Why, and what's the fix?","options":["A CPU cache keeps the old value forever; call <code>System.gc()<\/code> to flush it","The JIT may read <code>stopped<\/code> once and loop forever; make the field volatile","Add <code>Thread.sleep(10)<\/code> to the loop, because sleeping forces a fresh read","Use an AtomicBoolean, because boolean writes can tear"],"answer":1,"why":"Caches are coherent; the compiler is the problem. With no edge, the JIT may hoist the read out of the loop. A volatile read can't be hoisted. Sleep has no synchronization semantics, and a boolean can't tear.","from":"jmm-01"},{"q":"In which case is the reader guaranteed to see <code>x = 42<\/code>?","options":["The writer sets <code>x<\/code>, then writes volatile <code>a<\/code>; the reader reads volatile <code>b<\/code>, then <code>x<\/code>","The writer sets <code>x<\/code> inside <code>synchronized (lockA)<\/code>; the reader reads <code>x<\/code> inside <code>synchronized (lockB)<\/code>","The writer sets <code>x<\/code>, then sleeps 100 ms; the reader sleeps 200 ms, then reads <code>x<\/code>","The writer sets <code>x<\/code>, then calls <code>latch.countDown()<\/code>; the reader returns from <code>latch.await()<\/code> and reads <code>x<\/code>"],"answer":3,"why":"countDown happens-before a successful await on the same latch, and the write to x comes before countDown in program order. The other options use different variables, different locks, or sleep, which creates no edge at all.","from":"jmm-02"},{"q":"Fifty request threads increment and decrement <code>volatile int inFlight<\/code>. The dashboard drifts further from the truth every hour. What's the fix?","options":["Use an AtomicInteger (<code>incrementAndGet<\/code>, <code>decrementAndGet<\/code>)","Make it <code>volatile long<\/code> so it can't overflow","Add <code>Thread.yield()<\/code> after each update","Read it inside a synchronized block on the dashboard side"],"answer":0,"why":"<code>inFlight++<\/code> is a read, an add and a write. volatile makes each one visible but doesn't stop two threads from reading the same value, so updates get lost. An atomic does the whole update as one step.","from":"jmm-03"},{"q":"A config version number is written only by one refresher thread and read by every request thread. What is enough?","options":["A lock around every read and write","An AtomicLong updated with compareAndSet","A volatile long","A plain long, because writes are rare"],"answer":2,"why":"With a single writer there is no read-modify-write race, so the only problem is visibility, and that's what volatile solves. It also makes the 64-bit write atomic. A lock and CAS work but buy nothing here; a plain long has no edge at all.","from":"jmm-03"},{"q":"<code>record RateCard(String currency, Map&lt;String, Long&gt; fees)<\/code> stores the caller's HashMap as it is. Is a RateCard safe to share between threads?","options":["Yes: record fields are final","Not quite: the reference is final, but the caller can still change the HashMap; copy it with <code>Map.copyOf<\/code> in a compact constructor","No: records can't be shared between threads","Yes, as long as it's published through a volatile field"],"answer":1,"why":"Final fields freeze what the constructor stored, which is a reference to someone else's mutable map. Later changes through the caller's reference are ordinary racy writes. A defensive copy makes the record truly immutable.","from":"jmm-04"},{"q":"A Kafka listener's constructor calls <code>container.register(this)<\/code> and then sets its <code>deserializer<\/code> field. What can happen?","options":["Nothing: a constructor always runs to the end before anyone can use the object","The compiler rejects <code>this<\/code> as an argument inside a constructor","The container can deliver a record before <code>deserializer<\/code> is set, and the listener throws a NullPointerException","Nothing, as long as <code>deserializer<\/code> is final"],"answer":2,"why":"<code>this<\/code> escaped before the constructor finished, so another thread (or a callback on the same thread) can use a half-built object. Final doesn't help: its promise starts when the constructor returns. Register after construction.","from":"jmm-04"},{"q":"Which of these lazy initializers can hand a caller a half-built object?","options":["Double-checked locking on a plain (non-volatile) field","The holder class idiom","Kotlin <code>by lazy<\/code> with the default mode","<code>ConcurrentHashMap.computeIfAbsent<\/code>"],"answer":0,"why":"The lock-free first check reads the field with no edge to the write, so the reference can become visible before the constructor's writes. The holder relies on class-initialization locking, <code>by lazy<\/code> uses a volatile field, and computeIfAbsent publishes through the map.","from":"jmm-05"},{"q":"A static holder builds an issuer client whose constructor connects over the network. The issuer is down when the first request arrives. What do later calls get once the issuer is back?","options":["A fresh attempt: the holder retries on the next call","The half-built client from the first attempt","null","<code>NoClassDefFoundError<\/code> on every call until the JVM restarts"],"answer":3,"why":"If a static initializer throws, the class is marked as failed and is never initialized again. The first caller gets ExceptionInInitializerError and everyone after it NoClassDefFoundError. Use a volatile DCL or Kotlin <code>lazy<\/code>, which retry, for anything that can fail.","from":"jmm-05"},{"q":"Two threads each set their own flag with <code>setRelease<\/code>, then read the other's flag with <code>getAcquire<\/code>. Can both read false?","options":["No: release/acquire keeps each write before the read that follows it","Yes, even on x86; volatile accesses would forbid it","Only on ARM","Only if the flags are long fields"],"answer":1,"why":"Release keeps earlier accesses before the write, but a later read of a different variable may still pass it, and x86's store buffer does exactly that. Only volatile's single total order forbids both reading false.","from":"jmm-06"},{"q":"Many threads may try to record \"the first failure reason\", and only the first one should stick. Which tool fits?","options":["A plain String field","<code>setRelease<\/code> through a VarHandle","<code>compareAndSet(null, reason)<\/code> on an AtomicReference or a VarHandle","A volatile String set with <code>if (reason == null) reason = r;<\/code>"],"answer":2,"why":"First writer wins is a read-modify-write, so it needs one atomic step. compareAndSet succeeds for exactly one caller and has volatile semantics. The volatile check-then-set is a race between the check and the set, and setRelease is just a write.","from":"jmm-06"}]},{"id":"exec","lab":"executors","title":"Thread pools and executors","short":"ExecutorService, ThreadPoolExecutor internals, sizing, futures, CompletableFuture and ForkJoin.","lessons":["exec-01","exec-02","exec-03","exec-04","exec-05","exec-06","exec-07","exec-08","exec-09"],"intro":"<p>By the end of this track you can choose and configure a thread pool on purpose: predict where <code>ThreadPoolExecutor<\/code> puts each task, size a pool from measured wait and compute times with Little's law, and cap it at what the database or the issuer can take. You can cancel work that respects interruption, schedule periodic jobs that survive a failure, compose asynchronous calls with <code>CompletableFuture<\/code> (parallel lookups, per-call timeouts, fallbacks, fan-out), split CPU work with <code>ForkJoinPool<\/code> and parallel streams without starving the JVM, and run all of it in production with named threads, visible failures, carried request context, the right metrics and a clean shutdown.<\/p>\n<p>You need the first track (threads, race conditions, <code>synchronized<\/code>, interruption), and the memory model track helps. Install JDK 25. The labs compile with release 21, so they run on JDK 21 or later; where JDK 25 changed something, such as the default executor of <code>CompletableFuture<\/code> or <code>ForkJoinPool<\/code> gaining scheduling, the lesson says so and keeps that code out of the labs.<\/p>\n<p>The labs live in <code>labs/executors<\/code>, one package per lesson (<code>workbench.executors.l01<\/code> to <code>l09<\/code>). They are in Java, and every code sample and Try-it demo also comes in Kotlin. Concurrency tests never rely on tight timing: they use latches, barriers, max-concurrency counters, virtual time and generous timeouts, so a broken solution fails (or times out after a few seconds) instead of hanging the build. Run <code>./gradlew :executors:test --tests 'workbench.executors.lNN.*'<\/code> from <code>labs/<\/code> until it passes, <code>./gradlew :executors:solutionTest<\/code> to see the reference answers pass the same tests, and <code>./gradlew :executors:demo -Pmain=&lt;class&gt;<\/code> for the demos.<\/p>","cheatsheet":"<h2>Lifecycle<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Call<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>execute(r)<\/code><\/td>\n<td>runs <code>r<\/code>; an exception kills the worker and reaches its <code>UncaughtExceptionHandler<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>submit(c)<\/code><\/td>\n<td>returns a <code>Future<\/code>; an exception is stored in it and nothing is printed<\/td>\n<\/tr>\n<tr>\n<td><code>shutdown()<\/code><\/td>\n<td>rejects new tasks, lets queued and running ones finish, returns at once<\/td>\n<\/tr>\n<tr>\n<td><code>shutdownNow()<\/code><\/td>\n<td>also interrupts running tasks and returns the ones that never started<\/td>\n<\/tr>\n<tr>\n<td><code>awaitTermination(t, unit)<\/code><\/td>\n<td>waits until terminated or the timeout passes; returns a boolean<\/td>\n<\/tr>\n<tr>\n<td><code>close()<\/code> (JDK 19+)<\/td>\n<td><code>shutdown()<\/code>, then waits with no timeout; works with try-with-resources<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>ThreadPoolExecutor: where a task goes<\/h2>\n<ol>\n<li>Fewer than <code>corePoolSize<\/code> threads: start a new thread.<\/li>\n<li>Otherwise: offer it to the queue.<\/li>\n<li>Queue full: start a thread if below <code>maximumPoolSize<\/code>.<\/li>\n<li>Otherwise: reject.<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Queue<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>LinkedBlockingQueue()<\/code> (fixed pool)<\/td>\n<td>unbounded: max is dead code, overload hides as memory and latency<\/td>\n<\/tr>\n<tr>\n<td><code>SynchronousQueue<\/code> (cached pool)<\/td>\n<td>no queue: every burst becomes threads, up to max<\/td>\n<\/tr>\n<tr>\n<td><code>ArrayBlockingQueue(n)<\/code><\/td>\n<td>bounded: a full queue grows the pool, then rejects. Pushes back.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Rejection: <code>AbortPolicy<\/code> throws (default), <code>CallerRunsPolicy<\/code> makes the submitter run it (back-pressure), <code>DiscardPolicy<\/code> and <code>DiscardOldestPolicy<\/code> lose work silently. <code>keepAliveTime<\/code> retires threads above core; <code>allowCoreThreadTimeOut(true)<\/code> retires core threads too.<\/p>\n<h2>Sizing<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Work<\/th>\n<th>Threads<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CPU-bound<\/td>\n<td>about <code>availableProcessors()<\/code><\/td>\n<\/tr>\n<tr>\n<td>Waits on I/O<\/td>\n<td>cores x target utilization x (1 + wait / compute)<\/td>\n<\/tr>\n<tr>\n<td>Any<\/td>\n<td>Little's law: in flight = arrival rate x time in system<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The smallest limit downstream (a 20-connection DB pool, an issuer's rate limit) is the real ceiling. Give each dependency its own pool or semaphore: a bulkhead.<\/p>\n<h2>Futures, cancellation and interruption<\/h2>\n<ul>\n<li><code>get()<\/code> throws <code>ExecutionException<\/code> (cause inside), <code>CancellationException<\/code> or <code>InterruptedException<\/code>; <code>get(t, unit)<\/code> adds <code>TimeoutException<\/code> and ends only your wait.<\/li>\n<li><code>cancel(true)<\/code> on a <code>FutureTask<\/code> interrupts the worker. The task stops only if it blocks interruptibly or checks the flag.<\/li>\n<li>Catching <code>InterruptedException<\/code> clears the flag: rethrow it, or call <code>Thread.currentThread().interrupt()<\/code>.<\/li>\n<li>JDK 19: <code>state()<\/code>, <code>resultNow()<\/code>, <code>exceptionNow()<\/code>. <code>invokeAll<\/code> waits for all; <code>invokeAny<\/code> returns the first success and cancels the rest.<\/li>\n<\/ul>\n<h2>Scheduling<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>Next run starts<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>schedule(task, d, unit)<\/code><\/td>\n<td>once, after <code>d<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>scheduleAtFixedRate<\/code><\/td>\n<td>at <code>initialDelay + n x period<\/code>; late runs catch up back to back<\/td>\n<\/tr>\n<tr>\n<td><code>scheduleWithFixedDelay<\/code><\/td>\n<td><code>delay<\/code> after the previous run ends<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Runs of one task never overlap. One uncaught exception suppresses every later run, silently: catch <code>RuntimeException<\/code> inside the task. JDK 25: <code>ForkJoinPool<\/code> implements <code>ScheduledExecutorService<\/code> and adds <code>submitWithTimeout<\/code>.<\/p>\n<h2>CompletableFuture<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>You have<\/th>\n<th>Method<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>T -&gt; U<\/code><\/td>\n<td><code>thenApply<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>T -&gt; CompletableFuture&lt;U&gt;<\/code><\/td>\n<td><code>thenCompose<\/code><\/td>\n<\/tr>\n<tr>\n<td>two futures, <code>(T, U) -&gt; V<\/code><\/td>\n<td><code>thenCombine<\/code><\/td>\n<\/tr>\n<tr>\n<td>failure -&gt; value / future<\/td>\n<td><code>exceptionally<\/code> / <code>exceptionallyCompose<\/code> (JDK 12)<\/td>\n<\/tr>\n<tr>\n<td>both outcomes -&gt; new result<\/td>\n<td><code>handle<\/code><\/td>\n<\/tr>\n<tr>\n<td>both outcomes, observe only<\/td>\n<td><code>whenComplete<\/code><\/td>\n<\/tr>\n<tr>\n<td>a deadline<\/td>\n<td><code>orTimeout<\/code> (fails) / <code>completeOnTimeout<\/code> (default value), JDK 9<\/td>\n<\/tr>\n<tr>\n<td>many futures<\/td>\n<td><code>allOf<\/code> (waits for all, fails if any failed) / <code>anyOf<\/code> (first to complete, even a failure)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>No executor means <code>ForkJoinPool.commonPool()<\/code>. Up to JDK 24, a common pool with parallelism below 2 meant a new thread per task; JDK 25 always uses the common pool. Pass an executor for anything that blocks.<\/li>\n<li>A plain stage runs on the thread that completes the previous stage, or on the caller if it's already done. <code>xxxAsync(fn, executor)<\/code> moves it.<\/li>\n<li>Start independent calls before combining them, or they run one after the other.<\/li>\n<li>Exceptions thrown in a stage arrive wrapped in <code>CompletionException<\/code>; <code>completeExceptionally<\/code> and <code>orTimeout<\/code> store them raw. Unwrap before testing the type.<\/li>\n<li><code>orTimeout<\/code> and <code>cancel(true)<\/code> don't stop the task. Give the client its own timeout.<\/li>\n<li>Block once, at the edge, with a timeout. Never <code>join()<\/code> an unfinished future inside a stage.<\/li>\n<\/ul>\n<h2>ForkJoinPool and parallel streams<\/h2>\n<ul>\n<li><code>compute()<\/code>: below the threshold, loop; else split, <code>left.fork()<\/code>, <code>right.compute()<\/code>, then <code>left.join()<\/code>.<\/li>\n<li>Each worker owns a deque (push and pop at the top); idle workers steal the oldest task from the bottom.<\/li>\n<li>Common pool: <code>availableProcessors() - 1<\/code> workers plus the caller, shared by parallel streams and default async tasks.<\/li>\n<li>In parallel streams: no shared mutable state, <code>toList()<\/code> keeps order, small or cheap inputs are faster sequential.<\/li>\n<li>Never block in the common pool. Put I/O on an executor built for waiting; <code>ManagedBlocker<\/code> is a patch.<\/li>\n<\/ul>\n<h2>Production checklist<\/h2>\n<ul>\n<li>Name threads: <code>Thread.ofPlatform().name(\"ledger-\", 0).factory()<\/code> (JDK 21+).<\/li>\n<li>Report failures from both <code>execute<\/code> and <code>submit<\/code> in one wrapper, with the request id; don't rethrow.<\/li>\n<li>Carry <code>ThreadLocal<\/code> context (MDC, tracing): capture at submission, install in the worker, restore in <code>finally<\/code>.<\/li>\n<li>Watch queue size, active count against max, rejections (count them in the handler) and time in queue.<\/li>\n<li>No task may block on another task in the same bounded pool: compose, inline, or use a separate pool per stage.<\/li>\n<li>Shut down in order: stop intake, then pools upstream first, all within one deadline inside the grace period; log what <code>shutdownNow()<\/code> returns.<\/li>\n<\/ul>","recap":["A pool is a queue and a few reused threads. <code>shutdown()<\/code> only starts the stop; <code>awaitTermination<\/code> or <code>close()<\/code> waits. <code>submit<\/code> hides exceptions in the <code>Future<\/code>.","<code>ThreadPoolExecutor<\/code> starts core threads, then queues, then grows to max only when the queue is full, then rejects. An unbounded queue makes max useless.","Size CPU pools to the cores and I/O pools by cores x utilization x (1 + W/C), check with Little's law, and cap by the smallest downstream limit.","<code>cancel(true)<\/code> and <code>shutdownNow()<\/code> only interrupt. Tasks must cooperate, and code that catches <code>InterruptedException<\/code> must rethrow it or restore the flag.","Periodic tasks never overlap, fixed rate catches up while fixed delay doesn't, and one uncaught exception silently ends the schedule.","<code>CompletableFuture<\/code>: start independent calls first, combine with <code>thenCombine<\/code>, flatten with <code>thenCompose<\/code>, and pass an executor for anything that blocks.","Failures skip stages until a handler and often arrive wrapped in <code>CompletionException<\/code>. Timeouts and cancel end the wait, not the work. Give each fan-out call its own deadline and fallback.","ForkJoin is for CPU work: fork one half, compute the other, then join. Parallel streams share the common pool with the whole JVM, so never block in them.","In production: named threads, one wrapper that reports every failure with its request id and carries context, metrics on queue and rejections, no task waiting on its own pool, and an ordered shutdown."],"quiz":[{"q":"On JDK 21, <code>try (ExecutorService pool = Executors.newFixedThreadPool(4)) { pool.submit(this::exportLedger); }<\/code>. What happens at the closing brace?","options":["Nothing: the pool keeps running until the JVM exits","<code>close()<\/code> calls <code>shutdown()<\/code> and waits for the export to finish","<code>close()<\/code> calls <code>shutdownNow()<\/code> and interrupts
