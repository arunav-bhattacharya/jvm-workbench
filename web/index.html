the export","It doesn't compile, because ExecutorService isn't AutoCloseable"],"answer":1,"why":"Since JDK 19, <code>ExecutorService<\/code> is <code>AutoCloseable<\/code>. <code>close()<\/code> shuts the pool down and waits, with no timeout, for submitted tasks to finish. It only falls back to <code>shutdownNow()<\/code> if the waiting thread is interrupted.","from":"exec-01"},{"q":"<code>new ThreadPoolExecutor(4, 32, 60, SECONDS, new LinkedBlockingQueue&lt;&gt;())<\/code> gets a burst of 1,000 slow tasks. How many threads does it run?","options":["32, the maximum","4, and 996 tasks wait in the queue","1,000, one per task","4, and 996 tasks are rejected"],"answer":1,"why":"The pool grows past core only when the queue refuses a task, and an unbounded <code>LinkedBlockingQueue<\/code> never refuses. The maximum of 32 is never reached, and nothing is rejected until memory runs out.","from":"exec-02"},{"q":"An 8-core service spends 20 ms of CPU and 180 ms waiting on the database per request, and you want about 80% CPU. The database pool has 40 connections. How many threads should the request pool have?","options":["8, one per core","64, from 8 x 0.8 x (1 + 180/20)","About 40: the formula says 64, but only 40 can talk to the database at once","200, to be safe under bursts"],"answer":2,"why":"The formula gives 64 threads to keep the CPU at 80%, but every request needs a connection, and only 40 exist. Threads 41 to 64 would just wait for a connection. The smallest limit on the path is the real ceiling.","from":"exec-03"},{"q":"A task loops over 10 million ledger rows and never blocks or checks the interrupt flag. You call <code>future.cancel(true)<\/code>. What happens?","options":["The thread is stopped at once","<code>cancel<\/code> returns false because the task is running","<code>cancel<\/code> returns true and the future reports cancelled, but the loop runs to the end","The task gets an <code>InterruptedException<\/code> at the next loop iteration"],"answer":2,"why":"<code>cancel(true)<\/code> only sets the interrupt flag. A task that never blocks interruptibly and never checks <code>isInterrupted()<\/code> doesn't notice. The <code>Future<\/code> is marked cancelled either way, so its result is lost even though the work finishes.","from":"exec-04"},{"q":"An FX refresher runs with <code>scheduleWithFixedDelay(this::refresh, 0, 30, SECONDS)<\/code>. At 03:12 the provider returns a 502 and <code>refresh<\/code> throws. What do you see at 09:00?","options":["The rate from 03:11, and no log line about the failure","A fresh rate: the scheduler retried 30 seconds later","A stack trace in the logs every 30 seconds since 03:12","The scheduler shut down and the service failed its health check"],"answer":0,"why":"An exception that escapes a periodic task suppresses every later run, and it is stored in the <code>ScheduledFuture<\/code> that nobody reads. Catch <code>RuntimeException<\/code> inside the task and expose the age of the last success on a health endpoint.","from":"exec-05"},{"q":"<code>price()<\/code> and <code>rate()<\/code> each block for 200 ms. Which version takes about 200 ms in total?","options":["<code>supplyAsync(() -&gt; price(), io).thenCombine(supplyAsync(() -&gt; rate(), io), BigDecimal::multiply)<\/code>","<code>supplyAsync(() -&gt; price(), io).thenCompose(p -&gt; supplyAsync(() -&gt; rate(), io).thenApply(p::multiply))<\/code>","<code>supplyAsync(() -&gt; price().multiply(rate()), io)<\/code>","<code>supplyAsync(() -&gt; price(), io).thenApplyAsync(p -&gt; p.multiply(rate()), io)<\/code>"],"answer":0,"why":"Only the first starts both calls before waiting for either. The others are asynchronous too, but each calls <code>rate()<\/code> after <code>price()<\/code> has returned, so they take about 400 ms.","from":"exec-06"},{"q":"A quote call has <code>orTimeout(300, MILLISECONDS)<\/code>, and the provider hangs for 30 seconds. What happens to the call's thread on the <code>io<\/code> pool?","options":["It is interrupted at 300 ms and returns to the pool","It stays busy for the full 30 seconds; only the future completed at 300 ms","The pool replaces it with a new thread","It is cancelled before the call starts"],"answer":1,"why":"<code>orTimeout<\/code> completes the future with <code>TimeoutException<\/code> and never touches the task. Under load, abandoned calls fill the pool. Set a client-side timeout no longer than the future's deadline.","from":"exec-07"},{"q":"A Quarkus service enriches payments with <code>payments.parallelStream().map(p -&gt; enrich(p, binService.lookup(p.bin()))).toList()<\/code>, and each lookup takes 50 ms. Unrelated <code>CompletableFuture<\/code> timeouts start appearing elsewhere in the service. Why?","options":["Parallel streams use virtual threads, which pin on the lookup","The stream's <code>toList()<\/code> locks the list while the futures run","The common pool rejects tasks when the stream is busy","The lookups block the common pool's workers, and executor-less <code>CompletableFuture<\/code> tasks need the same pool"],"answer":3,"why":"Parallel streams and default async <code>CompletableFuture<\/code> tasks share <code>ForkJoinPool.commonPool()<\/code>, which has cores minus one workers. Blocking lookups hold those workers, so everything else queues behind them. Move the lookups to an IO executor.","from":"exec-08"},{"q":"A request thread sets the MDC <code>requestId<\/code> and submits a ledger write to a pool whose tasks, through a wrapper, run with the submitter's MDC. The wrapper restores the worker's MDC in <code>finally<\/code>. Which problem does that <code>finally<\/code> prevent?","options":["The submitting thread losing its own MDC","A later task on the same worker logging with this request's id","The task's exceptions being swallowed","Deadlock between the request thread and the worker"],"answer":1,"why":"Pool threads are reused. Without the restore, the worker keeps <code>req-42<\/code> in its MDC, and the next task on that thread, possibly from another request or none at all, logs under the wrong id. The submitting thread's MDC is never touched by the worker.","from":"exec-09"},{"q":"Pick the tool for each job on JDK 25: (1) total fees over 20 million rows in memory, (2) 2,000 concurrent calls to a card-issuer API, (3) a heartbeat to the issuer every 30 seconds.","options":["(1) a parallel stream or ForkJoinPool; (2) virtual threads or a bounded IO pool, capped by a semaphore at the issuer's limit; (3) a ScheduledExecutorService with fixed rate","(1) virtual threads; (2) a parallel stream; (3) a loop with <code>Thread.sleep(30_000)<\/code> on the common pool","All three on one <code>newFixedThreadPool(200)<\/code>","(1) a single-thread executor; (2) <code>supplyAsync<\/code> without an executor; (3) <code>java.util.Timer<\/code>"],"answer":0,"why":"CPU work over in-memory data splits well across the cores. Thousands of blocking calls want cheap threads, limited by what the issuer accepts, not by a pool size. A heartbeat is a timetable, which is what fixed rate is for, on its own scheduler. Sleeping in the common pool, executor-less <code>supplyAsync<\/code> for I/O and <code>Timer<\/code> are each a bug from this track.","from":null}]},{"id":"vt","lab":"vthreads","title":"Virtual threads","short":"Project Loom from the inside: carriers, pinning, structured concurrency and scoped values.","lessons":["vt-01","vt-02","vt-03","vt-04","vt-05","vt-06"],"intro":"<p>By the end of this track you can explain what a virtual thread is and what happens when it blocks, run blocking code with one virtual thread per task, cap what reaches a database or partner API with a shared <code>Semaphore<\/code>, find and fix the traps (pinning, <code>ThreadLocal<\/code> caches, CPU-bound work), and move a real pool-based service to virtual threads while measuring that it worked. You also meet the two Loom features around them: structured concurrency, still preview, and scoped values, final in JDK 25.<\/p>\n<p>You need the basics from the first track (starting, joining and interrupting threads, locks and semaphores) and from the executors track (<code>ExecutorService<\/code>, <code>Future<\/code>, and sizing a pool with Little's law). Install JDK 25, the current LTS. JDK 24 removed most pinning, and the advice changes with it, so the lessons always say which JDK a fact applies to.<\/p>\n<p>The labs live in <code>labs/vthreads<\/code>, one package per lesson (<code>workbench.vthreads.l01<\/code> to <code>l06<\/code>). They compile for JDK 21 and use only final JDK 21 APIs, so they run on 21 and on 25. Lessons 1 to 5 have Java labs, and lesson 6 is in Kotlin. Run <code>./gradlew :vthreads:test --tests 'workbench.vthreads.lNN.*'<\/code> from <code>labs/<\/code> until it passes, and use <code>solutionTest<\/code> to check the reference answers. The Try-it demos run with <code>./gradlew :vthreads:demo -Pmain=...<\/code>. Lesson 5's preview demos live in <code>labs/vthreads/preview/<\/code> and run outside Gradle on JDK 25.<\/p>","cheatsheet":"<h2>Versions<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>JDK 21 (LTS)<\/th>\n<th>JDK 24<\/th>\n<th>JDK 25 (LTS)<\/th>\n<th>JDK 26 and 27<\/th>\n<th>JDK 28<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Virtual threads<\/td>\n<td>final (JEP 444)<\/td>\n<td><code>synchronized<\/code> no longer pins (JEP 491)<\/td>\n<td>final, with the fix<\/td>\n<td>final<\/td>\n<td>final<\/td>\n<\/tr>\n<tr>\n<td>Scoped values<\/td>\n<td>preview<\/td>\n<td>preview<\/td>\n<td><strong>final<\/strong> (JEP 506)<\/td>\n<td>final<\/td>\n<td>final<\/td>\n<\/tr>\n<tr>\n<td>Structured concurrency<\/td>\n<td>preview, old subclass API<\/td>\n<td>preview<\/td>\n<td>preview, <code>open()<\/code> + <code>Joiner<\/code> (JEP 505)<\/td>\n<td>preview (JEP 525, JEP 533)<\/td>\n<td>final (JEP 543)<\/td>\n<\/tr>\n<tr>\n<td>Pinning check<\/td>\n<td><code>-Djdk.tracePinnedThreads<\/code> or JFR<\/td>\n<td>JFR only (the property was removed)<\/td>\n<td>JFR only<\/td>\n<td>JFR only<\/td>\n<td>JFR only<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Starting virtual threads<\/h2>\n<div class=\"pair\"><div class=\"pairbar\" role=\"group\" aria-label=\"Code language\"><button data-act=\"lang\" data-lang=\"java\">Java<\/button><button data-act=\"lang\" data-lang=\"kotlin\">Kotlin<\/button><button data-act=\"lang\" data-lang=\"both\">Both<\/button><\/div><div class=\"pi\" data-lang=\"java\"><span class=\"lg\">Java<\/span><pre class=\"code\" data-lang=\"java\"><code><span class=\"n\">Thread<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Thread<\/span><span class=\"p\">.<\/span><span class=\"na\">ofVirtual<\/span><span class=\"p\">().<\/span><span class=\"na\">name<\/span><span class=\"p\">(<\/span><span class=\"s\">\"auth-\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">).<\/span><span class=\"na\">start<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">settle<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">));<\/span><span class=\"w\">     <\/span><span class=\"c1\">// one named thread<\/span>\n<span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">ExecutorService<\/span><span class=\"w\"> <\/span><span class=\"n\">perTask<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Executors<\/span><span class=\"p\">.<\/span><span class=\"na\">newVirtualThreadPerTaskExecutor<\/span><span class=\"p\">())<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Future<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Receipt<\/span><span class=\"o\">&gt;&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">fs<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">batch<\/span><span class=\"p\">.<\/span><span class=\"na\">stream<\/span><span class=\"p\">().<\/span><span class=\"na\">map<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">perTask<\/span><span class=\"p\">.<\/span><span class=\"na\">submit<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">issuer<\/span><span class=\"p\">.<\/span><span class=\"na\">authorize<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">))).<\/span><span class=\"na\">toList<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">Future<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Receipt<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">f<\/span><span class=\"w\"> <\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">fs<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">receipts<\/span><span class=\"p\">.<\/span><span class=\"na\">add<\/span><span class=\"p\">(<\/span><span class=\"n\">f<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">());<\/span><span class=\"w\">                      <\/span><span class=\"c1\">// fork all, then join<\/span>\n<span class=\"p\">}<\/span><span class=\"w\">                                                                            <\/span><span class=\"c1\">// close() waits for every task<\/span>\n<\/code><\/pre><\/div><div class=\"pi\" data-lang=\"kotlin\"><span class=\"lg\">Kotlin<\/span><pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">t<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Thread<\/span><span class=\"p\">.<\/span><span class=\"na\">ofVirtual<\/span><span class=\"p\">().<\/span><span class=\"na\">name<\/span><span class=\"p\">(<\/span><span class=\"s\">\"auth-\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"m\">0<\/span><span class=\"p\">).<\/span><span class=\"na\">start<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">settle<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">             <\/span><span class=\"c1\">// one named thread<\/span>\n<span class=\"n\">Executors<\/span><span class=\"p\">.<\/span><span class=\"na\">newVirtualThreadPerTaskExecutor<\/span><span class=\"p\">().<\/span><span class=\"na\">use<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">perTask<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">fs<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">batch<\/span><span class=\"p\">.<\/span><span class=\"na\">map<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">perTask<\/span><span class=\"p\">.<\/span><span class=\"na\">submit<\/span><span class=\"p\">(<\/span><span class=\"n\">Callable<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">issuer<\/span><span class=\"p\">.<\/span><span class=\"na\">authorize<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">})<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">fs<\/span><span class=\"p\">.<\/span><span class=\"na\">map<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"nb\">it<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">                                                      <\/span><span class=\"c1\">// fork all, then join<\/span>\n<span class=\"p\">}<\/span><span class=\"w\">                                                                            <\/span><span class=\"c1\">// close() waits for every task<\/span>\n<\/code><\/pre><\/div><\/div>\n<p>Never pool virtual threads. One task, one new virtual thread.<\/p>\n<h2>Limiting a downstream<\/h2>\n<div class=\"pair\"><div class=\"pairbar\" role=\"group\" aria-label=\"Code language\"><button data-act=\"lang\" data-lang=\"java\">Java<\/button><button data-act=\"lang\" data-lang=\"kotlin\">Kotlin<\/button><button data-act=\"lang\" data-lang=\"both\">Both<\/button><\/div><div class=\"pi\" data-lang=\"java\"><span class=\"lg\">Java<\/span><pre class=\"code\" data-lang=\"java\"><code><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">Semaphore<\/span><span class=\"w\"> <\/span><span class=\"n\">issuerLimit<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Semaphore<\/span><span class=\"p\">(<\/span><span class=\"mi\">20<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kc\">true<\/span><span class=\"p\">);<\/span><span class=\"w\">   <\/span><span class=\"c1\">// one per downstream, shared by all callers<\/span>\n\n<span class=\"n\">Auth<\/span><span class=\"w\"> <\/span><span class=\"nf\">authorize<\/span><span class=\"p\">(<\/span><span class=\"n\">Payment<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"kd\">throws<\/span><span class=\"w\"> <\/span><span class=\"n\">InterruptedException<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">issuerLimit<\/span><span class=\"p\">.<\/span><span class=\"na\">acquire<\/span><span class=\"p\">();<\/span><span class=\"w\">                                       <\/span><span class=\"c1\">// outside the try<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">http<\/span><span class=\"p\">.<\/span><span class=\"na\">authorize<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">);<\/span><span class=\"w\">                                <\/span><span class=\"c1\">// only the call that needs the limit<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">finally<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">issuerLimit<\/span><span class=\"p\">.<\/span><span class=\"na\">release<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div><div class=\"pi\" data-lang=\"kotlin\"><span class=\"lg\">Kotlin<\/span><pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">issuerLimit<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Semaphore<\/span><span class=\"p\">(<\/span><span class=\"m\">20<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kc\">true<\/span><span class=\"p\">)<\/span><span class=\"w\">                    <\/span><span class=\"c1\">// one per downstream, shared by all callers<\/span>\n\n<span class=\"kd\">fun<\/span><span class=\"w\"> <\/span><span class=\"nf\">authorize<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">Payment<\/span><span class=\"p\">):<\/span><span class=\"w\"> <\/span><span class=\"n\">Auth<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">issuerLimit<\/span><span class=\"p\">.<\/span><span class=\"na\">acquire<\/span><span class=\"p\">()<\/span><span class=\"w\">                                        <\/span><span class=\"c1\">// outside the try<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">http<\/span><span class=\"p\">.<\/span><span class=\"na\">authorize<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">)<\/span><span class=\"w\">                                 <\/span><span class=\"c1\">// only the call that needs the limit<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">finally<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">issuerLimit<\/span><span class=\"p\">.<\/span><span class=\"na\">release<\/span><span class=\"p\">()<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div><\/div>\n<p>Use <code>tryAcquire(200, MILLISECONDS)<\/code> to fail fast with a 503 instead of waiting forever.<\/p>\n<h2>Little's law<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>Formula<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>How many in flight?<\/td>\n<td>rate × time<\/td>\n<td>400/s × 0.12 s = 48<\/td>\n<\/tr>\n<tr>\n<td>How many threads did the old pool need?<\/td>\n<td>rate × time per request<\/td>\n<td>200/s × 0.335 s = 67<\/td>\n<\/tr>\n<tr>\n<td>Most a limit can serve<\/td>\n<td>permits / time each permit is held<\/td>\n<td>10 / 0.02 s = 500/s<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>What a blocking call does to the carrier<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Call<\/th>\n<th>On JDK 21<\/th>\n<th>On JDK 25<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>Thread.sleep<\/code>, socket I/O, <code>LockSupport.park<\/code>, locks, queues, futures<\/td>\n<td>unmounts<\/td>\n<td>unmounts<\/td>\n<\/tr>\n<tr>\n<td>Blocking inside <code>synchronized<\/code> or <code>Object.wait()<\/code><\/td>\n<td><strong>pins<\/strong><\/td>\n<td>unmounts<\/td>\n<\/tr>\n<tr>\n<td>Blocking inside a class initializer, or under a native frame<\/td>\n<td>pins<\/td>\n<td><strong>pins<\/strong><\/td>\n<\/tr>\n<tr>\n<td>File I/O<\/td>\n<td>captures the carrier; the scheduler adds a temporary one<\/td>\n<td>same<\/td>\n<\/tr>\n<tr>\n<td>Pure CPU work<\/td>\n<td>keeps the carrier until it blocks (no time slicing)<\/td>\n<td>same<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Traps<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Trap<\/th>\n<th>What you see<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>synchronized<\/code> around I/O on JDK 21 to 23<\/td>\n<td>p99 jumps, CPU low, carriers all busy<\/td>\n<td>JDK 25, or <code>ReentrantLock<\/code><\/td>\n<\/tr>\n<tr>\n<td>Slow <code>static {}<\/code> or Kotlin <code>object<\/code> init<\/td>\n<td>one long pin per class<\/td>\n<td>load at startup or lazily, not in <code>&lt;clinit&gt;<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ThreadLocal<\/code> used as a cache<\/td>\n<td>one object per request, more GC<\/td>\n<td>share an immutable object (<code>DateTimeFormatter<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>CPU-heavy step on a virtual thread<\/td>\n<td>other requests stall behind it<\/td>\n<td>a bounded platform pool for CPU work<\/td>\n<\/tr>\n<tr>\n<td>The old pool was your database limit<\/td>\n<td>pool timeouts after the switch<\/td>\n<td>a <code>Semaphore<\/code> sized to the pool, around DB calls only<\/td>\n<\/tr>\n<tr>\n<td>Bigger connection pool \"to match\"<\/td>\n<td>a slower database, session limits hit<\/td>\n<td>keep the pool small; queue in the service<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Finding problems<\/h2>\n<pre class=\"code\" data-lang=\"bash\"><code>java<span class=\"w\"> <\/span>-XX:StartFlightRecording<span class=\"o\">=<\/span><span class=\"nv\">filename<\/span><span class=\"o\">=<\/span>rec.jfr,settings<span class=\"o\">=<\/span>profile<span class=\"w\"> <\/span>-jar<span class=\"w\"> <\/span>service.jar\njfr<span class=\"w\"> <\/span>print<span class=\"w\"> <\/span>--events<span class=\"w\"> <\/span>jdk.VirtualThreadPinned<span class=\"w\"> <\/span>rec.jfr<span class=\"w\">                  <\/span><span class=\"c1\"># pins over 20 ms, with stacks<\/span>\njcmd<span class=\"w\"> <\/span>&lt;pid&gt;<span class=\"w\"> <\/span>Thread.dump_to_file<span class=\"w\"> <\/span>-format<span class=\"o\">=<\/span>json<span class=\"w\"> <\/span>threads.json<span class=\"w\">            <\/span><span class=\"c1\"># every virtual thread, grouped<\/span>\n<\/code><\/pre>\n<p>After the switch, ignore the thread count. Watch requests in flight, each semaphore's queue length, and the pool's pending connections. A growing queue with flat throughput marks the saturated downstream.<\/p>\n<h2>Structured concurrency (JDK 25, preview) and scoped values (JDK 25, final)<\/h2>\n<div class=\"pair\"><div class=\"pairbar\" role=\"group\" aria-label=\"Code language\"><button data-act=\"lang\" data-lang=\"java\">Java<\/button><button data-act=\"lang\" data-lang=\"kotlin\">Kotlin<\/button><button data-act=\"lang\" data-lang=\"both\">Both<\/button><\/div><div class=\"pi\" data-lang=\"java\"><span class=\"lg\">Java<\/span><pre class=\"code\" data-lang=\"java\"><code><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">ScopedValue<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">TENANT<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">ScopedValue<\/span><span class=\"p\">.<\/span><span class=\"na\">newInstance<\/span><span class=\"p\">();<\/span>\n\n<span class=\"n\">Quote<\/span><span class=\"w\"> <\/span><span class=\"nf\">quote<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"kd\">throws<\/span><span class=\"w\"> <\/span><span class=\"n\">InterruptedException<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kd\">var<\/span><span class=\"w\"> <\/span><span class=\"n\">scope<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">StructuredTaskScope<\/span><span class=\"p\">.<\/span><span class=\"na\">open<\/span><span class=\"p\">())<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">                  <\/span><span class=\"c1\">// fail fast by default<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Subtask<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Customer<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">customer<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">scope<\/span><span class=\"p\">.<\/span><span class=\"na\">fork<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">crm<\/span><span class=\"p\">.<\/span><span class=\"na\">find<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Subtask<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Limit<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">limit<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">scope<\/span><span class=\"p\">.<\/span><span class=\"na\">fork<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">limits<\/span><span class=\"p\">.<\/span><span class=\"na\">check<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">));<\/span><span class=\"w\">   <\/span><span class=\"c1\">// forks can read TENANT<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">scope<\/span><span class=\"p\">.<\/span><span class=\"na\">join<\/span><span class=\"p\">();<\/span><span class=\"w\">                                               <\/span><span class=\"c1\">// JDK 25: FailedException; JDK 27: ExecutionException<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Quote<\/span><span class=\"p\">(<\/span><span class=\"n\">customer<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">limit<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span><span class=\"w\">                                                               <\/span><span class=\"c1\">// close(): no subtask left running<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"c1\">// caller: ScopedValue.where(TENANT, \"bank-a\").call(() -&gt; quote(id));   // call() may throw<\/span>\n<\/code><\/pre><\/div><div class=\"pi\" data-lang=\"kotlin\"><span class=\"lg\">Kotlin<\/span><pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">TENANT<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">ScopedValue<\/span><span class=\"o\">&lt;<\/span><span class=\"kt\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">ScopedValue<\/span><span class=\"p\">.<\/span><span class=\"na\">newInstance<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kd\">fun<\/span><span class=\"w\"> <\/span><span class=\"nf\">quote<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"kt\">String<\/span><span class=\"p\">):<\/span><span class=\"w\"> <\/span><span class=\"n\">Quote<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">StructuredTaskScope<\/span><span class=\"p\">.<\/span><span class=\"na\">open<\/span><span class=\"o\">&lt;<\/span><span class=\"kt\">Any<\/span><span class=\"o\">&gt;<\/span><span class=\"p\">().<\/span><span class=\"na\">use<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">scope<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\">                  <\/span><span class=\"c1\">// fail fast by default<\/span>\n<span class=\"w\">        <\/span><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">customer<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">scope<\/span><span class=\"p\">.<\/span><span class=\"na\">fork<\/span><span class=\"p\">(<\/span><span class=\"n\">Callable<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">crm<\/span><span class=\"p\">.<\/span><span class=\"na\">find<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">})<\/span>\n<span class=\"w\">        <\/span><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">limit<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">scope<\/span><span class=\"p\">.<\/span><span class=\"na\">fork<\/span><span class=\"p\">(<\/span><span class=\"n\">Callable<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">limits<\/span><span class=\"p\">.<\/span><span class=\"na\">check<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">})<\/span><span class=\"w\">       <\/span><span class=\"c1\">// forks can read TENANT<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">scope<\/span><span class=\"p\">.<\/span><span class=\"na\">join<\/span><span class=\"p\">()<\/span><span class=\"w\">                                                <\/span><span class=\"c1\">// JDK 25: FailedException; JDK 27: ExecutionException<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Quote<\/span><span class=\"p\">(<\/span><span class=\"n\">customer<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">limit<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">())<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span><span class=\"w\">                                                               <\/span><span class=\"c1\">// close(): no subtask left running<\/span>\n<span class=\"c1\">// caller: ScopedValue.where(TENANT, \"bank-a\").run(Runnable { quote(id) })<\/span>\n<\/code><\/pre><\/div><\/div>\n<p>Preview code needs <code>--enable-preview<\/code> and the matching JDK. In Kotlin coroutine code, use <code>coroutineScope<\/code> and a coroutine context element instead.<\/p>\n<h2>Frameworks<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Framework<\/th>\n<th>Switch<\/th>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Quarkus<\/td>\n<td><code>@RunOnVirtualThread<\/code> on an endpoint, class or <code>@Incoming<\/code> method<\/td>\n<td>no global switch; <code>quarkus.thread-pool.max-threads<\/code> no longer caps those endpoints<\/td>\n<\/tr>\n<tr>\n<td>Spring Boot 3.2+<\/td>\n<td><code>spring.threads.virtual.enabled=true<\/code><\/td>\n<td>the web server and Spring's task executors use virtual threads<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Neither adds downstream limits. Those are your semaphores.<\/p>\n<h2>Migration checklist<\/h2>\n<ol>\n<li>Run JDK 25.<\/li>\n<li>Replace pools that run blocking work with one virtual thread per task.<\/li>\n<li>Write down every limit the old pool gave you as a shared semaphore.<\/li>\n<li>Keep connection pools small, sized from the database and multiplied by pods.<\/li>\n<li>Replace <code>ThreadLocal<\/code> caches; move context to arguments or scoped values.<\/li>\n<li>Keep CPU-heavy work on a bounded platform pool.<\/li>\n<li>Put a deadline on every wait, then measure before and after with the same load test.<\/li>\n<\/ol>","recap":["A platform thread is an OS thread, so a server gets thousands, not millions. Little's law (in flight = rate × time) says how many a blocking service needs.","A virtual thread is a <code>Thread<\/code> that unmounts from its carrier at blocking calls. Its stack waits on the heap, and a few carriers (one per core) run all of them.","Virtual threads give scale, not speed: one request is no faster, and CPU-bound work gains nothing because there is no time slicing.","Use one new virtual thread per task, usually through <code>newVirtualThreadPerTaskExecutor()<\/code> in try-with-resources. Never pool them.","Limit a scarce downstream with one shared <code>Semaphore<\/code>, held only around its calls, sized from what the downstream allows.","On JDK 21 to 23, blocking inside <code>synchronized<\/code> pins the carrier. JDK 24 fixed it; on JDK 25 class initializers and native frames still pin. Find pins with JFR's <code>jdk.VirtualThreadPinned<\/code>.","<code>ThreadLocal<\/code> caches become one object per task. Share immutable objects, and move request context to arguments or scoped values (final in JDK 25).","Structured concurrency ties subtasks to a block, cancels siblings on failure and waits for all of them. <code>StructuredTaskScope<\/code> is preview until JDK 28.","Migrating means writing down the limits the old pool gave you, keeping connection pools small, and measuring in-flight requests and queue lengths, not thread counts."],"quiz":[{"q":"An endpoint receives 1,500 requests per second, and each one spends 200 ms waiting on a partner API. With one thread per request, about how many threads are busy at once?","options":["About 8","About 300","About 1,500","About 7,500"],"answer":1,"why":"Little's law: in flight = 1,500/s × 0.2 s = 300. With thread-per-request, that's also the number of threads. 7,500 multiplies by 5 instead of 0.2, and 1,500 forgets the time.","from":null},{"q":"Which workload gains the most from moving to virtual threads?","options":["8,000 concurrent requests that each wait 150 ms on HTTP and database calls","Resizing 10,000 images on an 8-core machine","A parallel stream that sums a large array","One batch job that reads a single large file from start to end"],"answer":0,"why":"Virtual threads help when many tasks spend most of their time blocked. Image resizing and summing are CPU-bound, so at most one virtual thread per core computes at once, the same as a pool. A single sequential job has nothing to overlap.","from":null},{"q":"A virtual thread prints <code>Thread.currentThread()<\/code> before and after <code>Thread.sleep(10)<\/code>. What can differ between the two lines?","options":["The thread id, because a new virtual thread continues the work","Nothing can differ: a virtual thread stays on one carrier for life","The carrier worker shown after the <code>@<\/code>; the virtual thread itself is the same","The second print never happens, because <code>sleep<\/code> throws on a virtual thread"],"answer":2,"why":"<code>currentThread()<\/code> always returns the virtual thread, so its id stays the same. The sleep unmounts it, and when it wakes, any free carrier can mount it, so the <code>ForkJoinPool-1-worker-N<\/code> part of <code>toString()<\/code> can change.","from":null},{"q":"10,000 virtual threads must call a fraud API that allows 50 concurrent calls. Which design is right?","options":["<code>Executors.newFixedThreadPool(50, Thread.ofVirtual().factory())<\/code> for all request handling","A <code>new Semaphore(50)<\/code> created inside each request handler","No limit: virtual threads are cheap, so the API copes","One <code>Semaphore(50)<\/code> shared by all requests, held only around the fraud call"],"answer":3,"why":"The limit belongs to the fraud API, so one shared semaphore guards just that call. A pool of virtual threads caps the whole request and is the anti-pattern from lesson 3. A semaphore per request gives each request its own 50 permits, which limits nothing.","from":null},{"q":"On JDK 25, which of these still pins a virtual thread to its carrier?","options":["Blocking on a socket read inside a <code>synchronized<\/code> block","Blocking inside a class's static initializer","Waiting in <code>ReentrantLock.lock()<\/code>","Waiting in <code>BlockingQueue.take()<\/code>"],"answer":1,"why":"JDK 24 (JEP 491) stopped <code>synchronized<\/code> from pinning, and <code>java.util.concurrent<\/code> locks and queues always parked properly. Class initializers run through VM frames, so blocking inside one still pins on JDK 25.","from":null},{"q":"You want to prove that a JDK 25 service has no pinning under load. What do you use?","options":["<code>-Djdk.tracePinnedThreads=full<\/code>, and check that nothing is printed","<code>jstack &lt;pid&gt;<\/code>, looking for blocked carriers","A JFR recording with <code>jdk.VirtualThreadPinned<\/code>, printed with <code>jfr print<\/code>","<code>Thread.getAllStackTraces()<\/code> from a debug endpoint"],"answer":2,"why":"The JFR event is on by default with a 20 ms threshold and records the stack. <code>-Djdk.tracePinnedThreads<\/code> was removed in JDK 24, so its silence proves nothing. <code>jstack<\/code> and <code>getAllStackTraces()<\/code> don't show parked virtual threads.","from":null},{"q":"Which statement about JDK 25 is true?","options":["Scoped values are final; <code>StructuredTaskScope<\/code> is still a preview API","Both scoped values and <code>StructuredTaskScope<\/code> are final","<code>StructuredTaskScope<\/code> is final; scoped values are still preview","Both are still preview and need <code>--enable-preview<\/code>"],"answer":0,"why":"JEP 506 made scoped values final in JDK 25. Structured concurrency stays in preview through JDK 25, 26 and 27, and JEP 543 makes it final in JDK 28.","from":null},{"q":"Inside <code>ScopedValue.where(TENANT, \"bank-a\").run(...)<\/code>, code starts <code>Thread.ofVirtual().start(task)<\/code>. What does <code>TENANT.isBound()<\/code> return inside <code>task<\/code>?","options":["<code>true<\/code>, because virtual threads inherit their creator's scoped values","<code>true<\/code>, but only while <code>run()<\/code> is still active","It throws <code>IllegalStateException<\/code>","<code>false<\/code>, because only <code>StructuredTaskScope<\/code> forks inherit the binding"],"answer":3,"why":"A thread you start yourself could outlive the <code>run()<\/code> call, so it gets no binding. Only subtasks forked in a <code>StructuredTaskScope<\/code>, which must end before the scope does, see the parent's scoped values.","from":null},{"q":"A hand-built fail-fast scope cancels a slow sibling with <code>future.cancel(true)<\/code> and then calls <code>close()<\/code> on its <code>newVirtualThreadPerTaskExecutor()<\/code>. On JDK 21, what is the problem?","options":["<code>cancel(true)<\/code> doesn't interrupt virtual threads","<code>close()<\/code> can return while the cancelled task is still running its <code>finally<\/code> block","<code>close()<\/code> waits forever, because a cancelled task never finishes","Nothing: this is exactly how <code>StructuredTaskScope<\/code> works inside"],"answer":1,"why":"<code>cancel(true)<\/code> interrupts the thread but marks the future done at once, and the JDK 21 executor counts the task as finished when its future is done. So <code>close()<\/code> stops waiting while cleanup still runs. <code>shutdownNow()<\/code> interrupts without completing the futures.","from":null},{"q":"A service ran on a fixed pool of 20 threads with a 20-connection database pool. After moving to one virtual thread per request, the pool times out at every peak. What is the right fix?","options":["Raise the connection pool to 2,000 connections","Go back to the fixed pool of 20 threads for all request handling","Add a shared <code>Semaphore(20)<\/code> around the database calls only, with a <code>tryAcquire<\/code> deadline","Raise the pool's connection timeout to several minutes"],"answer":2,"why":"The fixed pool was an unwritten limit on the database. The semaphore puts it back where it belongs, without capping the calls that never needed it, and gives you a visible queue and a deadline. A huge pool overloads the database, and a long timeout turns overload into very slow requests.","from":null}]},{"id":"gen","lab":"generics","title":"Kotlin generics, properly","short":"Variance from first principles: out, in, projections, star projection, reified, KClass, and Java side by side.","lessons":["gen-01","gen-02","gen-03","gen-04","gen-05","gen-06","gen-07","gen-08","gen-09","gen-10","gen-11"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"rx","lab":"reactive","title":"Reactive programming","short":"Reactive Streams, Project Reactor, operators, schedulers, backpressure and testing.","lessons":["rx-01","rx-02","rx-03","rx-04","rx-05","rx-06","rx-07","rx-08"],"intro":"<p>By the end of this track you can read and write Project Reactor code with a clear picture of what runs when, on which thread, and how fast. You can explain the Reactive Streams contract and its demand signal, build lazy <code>Mono<\/code> and <code>Flux<\/code> pipelines, pick the right flattening and combining operators, make a remote call survive failures with timeouts, filtered backoff and fallbacks, move blocking calls off the wrong threads, choose a loss policy for sources that can't slow down, share one source between many subscribers, and test all of it in milliseconds with <code>StepVerifier<\/code> and virtual time. The last lesson says plainly when you shouldn't use Reactor at all.<\/p>\n<p>You need the first track (threads, races, <code>synchronized<\/code>), the executors track (pools, <code>CompletableFuture<\/code>, Little's law) and the virtual threads track, because this one keeps comparing against them. Install JDK 25. The labs use Reactor 3.8.8 and reactor-test 3.8.8 and compile with release 21, so they run on JDK 21 or later.<\/p>\n<p>The labs live in <code>labs/reactive<\/code>, one package per lesson (<code>workbench.reactive.l01<\/code> to <code>l08<\/code>). They are in Java, and every code sample and Try-it demo also comes in Kotlin, with Kotlin <code>Flow<\/code> and coroutine counterparts where they exist. Timing tests use virtual time, latches and max-concurrency counters rather than sleeps. Run <code>./gradlew :reactive:test --tests 'workbench.reactive.lNN.*'<\/code> from <code>labs/<\/code> until it passes, use <code>solutionTest<\/code> to check the reference answers, and run the demos with <code>./gradlew :reactive:demo -Pmain=...<\/code>.<\/p>","cheatsheet":"<h2>The contract<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Signal<\/th>\n<th>Direction<\/th>\n<th>Rule<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>onSubscribe(s)<\/code><\/td>\n<td>publisher to subscriber<\/td>\n<td>always first, exactly once<\/td>\n<\/tr>\n<tr>\n<td><code>request(n)<\/code><\/td>\n<td>subscriber to publisher<\/td>\n<td>demand; the publisher never sends more than requested<\/td>\n<\/tr>\n<tr>\n<td><code>onNext(item)<\/code><\/td>\n<td>publisher to subscriber<\/td>\n<td>zero or more, never <code>null<\/code>, one at a time<\/td>\n<\/tr>\n<tr>\n<td><code>onError(e)<\/code> or <code>onComplete()<\/code><\/td>\n<td>publisher to subscriber<\/td>\n<td>at most one, and nothing after it<\/td>\n<\/tr>\n<tr>\n<td><code>cancel()<\/code><\/td>\n<td>subscriber to publisher<\/td>\n<td>the only way a subscriber stops the stream<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>java.util.concurrent.Flow<\/code> is the same four interfaces in the JDK. <code>Flux<\/code> is 0 to N items, <code>Mono<\/code> is 0 or 1.<\/p>\n<h2>Nothing happens until you subscribe<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>You write<\/th>\n<th>The work runs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>Mono.just(call())<\/code><\/td>\n<td>once, at assembly, before anyone subscribes<\/td>\n<\/tr>\n<tr>\n<td><code>Mono.fromCallable(() -&gt; call())<\/code><\/td>\n<td>once per subscription<\/td>\n<\/tr>\n<tr>\n<td><code>Mono.defer(() -&gt; client.call())<\/code><\/td>\n<td>once per subscription; <code>client.call()<\/code> returns a publisher<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A cold publisher does its work again for each subscriber. <code>retry<\/code> re-subscribes, so it needs a lazy source.<\/p>\n<h2>Picking an operator<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>You want<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a synchronous change per item<\/td>\n<td><code>map<\/code>, <code>filter<\/code><\/td>\n<\/tr>\n<tr>\n<td>async calls, any order, capped<\/td>\n<td><code>flatMap(call, n)<\/code> (default n is 256)<\/td>\n<\/tr>\n<tr>\n<td>async calls, one at a time, in order<\/td>\n<td><code>concatMap(call)<\/code><\/td>\n<\/tr>\n<tr>\n<td>async calls, concurrent, in input order<\/td>\n<td><code>flatMapSequential(call, n)<\/code><\/td>\n<\/tr>\n<tr>\n<td>only the latest request matters<\/td>\n<td><code>switchMap(call)<\/code><\/td>\n<\/tr>\n<tr>\n<td>one result from several independent calls<\/td>\n<td><code>Mono.zip(a, b, c)<\/code>, with <code>switchIfEmpty<\/code> or <code>defaultIfEmpty<\/code> on each<\/td>\n<\/tr>\n<tr>\n<td>two live streams interleaved / one after the other<\/td>\n<td><code>Flux.merge<\/code> / <code>Flux.concat<\/code><\/td>\n<\/tr>\n<tr>\n<td>a value recomputed when any input changes<\/td>\n<td><code>Flux.combineLatest<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Source <code>3, 1, 2<\/code>, item i takes i x 100 ms: <code>flatMap<\/code> gives <code>1, 2, 3<\/code> at 300 ms, <code>concatMap<\/code> gives <code>3, 1, 2<\/code> at 600 ms, <code>flatMapSequential<\/code> gives <code>3, 1, 2<\/code> at 300 ms.<\/p>\n<h2>Errors, retries, timeouts<\/h2>\n<div class=\"pair\"><div class=\"pairbar\" role=\"group\" aria-label=\"Code language\"><button data-act=\"lang\" data-lang=\"java\">Java<\/button><button data-act=\"lang\" data-lang=\"kotlin\">Kotlin<\/button><button data-act=\"lang\" data-lang=\"both\">Both<\/button><\/div><div class=\"pi\" data-lang=\"java\"><span class=\"lg\">Java<\/span><pre class=\"code\" data-lang=\"java\"><code><span class=\"n\">Mono<\/span><span class=\"p\">.<\/span><span class=\"na\">defer<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">issuer<\/span><span class=\"p\">.<\/span><span class=\"na\">authorize<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">))<\/span><span class=\"w\">                  <\/span><span class=\"c1\">// a fresh call per attempt<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">timeout<\/span><span class=\"p\">(<\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofMillis<\/span><span class=\"p\">(<\/span><span class=\"mi\">500<\/span><span class=\"p\">))<\/span><span class=\"w\">                  <\/span><span class=\"c1\">// per attempt<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">retryWhen<\/span><span class=\"p\">(<\/span><span class=\"n\">Retry<\/span><span class=\"p\">.<\/span><span class=\"na\">backoff<\/span><span class=\"p\">(<\/span><span class=\"mi\">3<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofMillis<\/span><span class=\"p\">(<\/span><span class=\"mi\">100<\/span><span class=\"p\">))<\/span><span class=\"w\">   <\/span><span class=\"c1\">// 4 attempts: 0, 100, 300, 700 ms<\/span>\n<span class=\"w\">                <\/span><span class=\"p\">.<\/span><span class=\"na\">filter<\/span><span class=\"p\">(<\/span><span class=\"n\">e<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"w\"> <\/span><span class=\"k\">instanceof<\/span><span class=\"w\"> <\/span><span class=\"n\">IssuerUnavailableException<\/span><span class=\"w\"> <\/span><span class=\"o\">||<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"w\"> <\/span><span class=\"k\">instanceof<\/span><span class=\"w\"> <\/span><span class=\"n\">TimeoutException<\/span><span class=\"p\">))<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">onErrorResume<\/span><span class=\"p\">(<\/span><span class=\"n\">Exceptions<\/span><span class=\"p\">::<\/span><span class=\"n\">isRetryExhausted<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">Mono<\/span><span class=\"p\">.<\/span><span class=\"na\">just<\/span><span class=\"p\">(<\/span><span class=\"s\">\"PENDING:\"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">));<\/span>\n<\/code><\/pre><\/div><div class=\"pi\" data-lang=\"kotlin\"><span class=\"lg\">Kotlin<\/span><pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">Mono<\/span><span class=\"p\">.<\/span><span class=\"na\">defer<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">issuer<\/span><span class=\"p\">.<\/span><span class=\"na\">authorize<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">                       <\/span><span class=\"c1\">// a fresh call per attempt<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">.<\/span><span class=\"na\">timeout<\/span><span class=\"p\">(<\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofMillis<\/span><span class=\"p\">(<\/span><span class=\"m\">500<\/span><span class=\"p\">))<\/span><span class=\"w\">                      <\/span><span class=\"c1\">// per attempt<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">.<\/span><span class=\"na\">retryWhen<\/span><span class=\"p\">(<\/span><span class=\"n\">Retry<\/span><span class=\"p\">.<\/span><span class=\"na\">backoff<\/span><span class=\"p\">(<\/span><span class=\"m\">3<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofMillis<\/span><span class=\"p\">(<\/span><span class=\"m\">100<\/span><span class=\"p\">))<\/span><span class=\"w\">   <\/span><span class=\"c1\">// 4 attempts: 0, 100, 300, 700 ms<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">filter<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"w\"> <\/span><span class=\"k\">is<\/span><span class=\"w\"> <\/span><span class=\"n\">IssuerUnavailableException<\/span><span class=\"w\"> <\/span><span class=\"o\">||<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"w\"> <\/span><span class=\"k\">is<\/span><span class=\"w\"> <\/span><span class=\"n\">TimeoutException<\/span><span class=\"w\"> <\/span><span class=\"p\">})<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">.<\/span><span class=\"na\">onErrorResume<\/span><span class=\"p\">(<\/span><span class=\"n\">Exceptions<\/span><span class=\"o\">::<\/span><span class=\"n\">isRetryExhausted<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">Mono<\/span><span class=\"p\">.<\/span><span class=\"na\">just<\/span><span class=\"p\">(<\/span><span class=\"s\">\"PENDING:<\/span><span class=\"si\">$<\/span><span class=\"n\">id<\/span><span class=\"s\">\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<\/code><\/pre><\/div><\/div>\n<p>Errors are terminal. <code>retry(n)<\/code> makes n + 1 immediate attempts and rethrows the original error; <code>Retry.backoff<\/code> ends with <code>RetryExhaustedException<\/code> (jitter 0.5 by default). Skip a bad item inside a per-item <code>Mono<\/code>, not with <code>onErrorContinue<\/code>.<\/p>\n<h2>Threads<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Scheduler<\/th>\n<th>Threads<\/th>\n<th>For<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>none<\/td>\n<td>the thread that subscribed, or the one that delivered the item<\/td>\n<td>most operators<\/td>\n<\/tr>\n<tr>\n<td><code>Schedulers.parallel()<\/code><\/td>\n<td>one per core<\/td>\n<td>CPU work and timers; never block<\/td>\n<\/tr>\n<tr>\n<td><code>Schedulers.single()<\/code><\/td>\n<td>one<\/td>\n<td>cheap serial work<\/td>\n<\/tr>\n<tr>\n<td><code>Schedulers.boundedElastic()<\/code><\/td>\n<td>up to 10 x cores, then a queue of 100,000<\/td>\n<td>blocking calls<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>publishOn<\/code> moves the operators after it. <code>subscribeOn<\/code> moves the source, wherever it is written; the one nearest the source wins. Wrap blocking calls as <code>Mono.fromCallable(...).subscribeOn(boundedElastic())<\/code>, with <code>subscribeOn<\/code> on each inner Mono. <code>block()<\/code> throws on <code>parallel<\/code> and <code>single<\/code> threads. <code>-Dreactor.schedulers.defaultBoundedElasticOnVirtualThreads=true<\/code> (Reactor 3.6+, JDK 21+) runs boundedElastic on virtual threads.<\/p>\n<h2>Backpressure<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Between you and the source<\/th>\n<th>The source sees<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>subscribe(consumer)<\/code> or <code>block()<\/code> alone<\/td>\n<td><code>Long.MAX_VALUE<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>take(3)<\/code><\/td>\n<td><code>3<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>limitRate(10)<\/code><\/td>\n<td><code>10, 8, 8, ...<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>flatMap(call, 4)<\/code><\/td>\n<td><code>4, 1, 1, ...<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>For a source that can't slow down, choose: <code>onBackpressureBuffer(n)<\/code> (keep n, then fail loudly), <code>onBackpressureDrop(onDropped)<\/code>, <code>onBackpressureLatest()<\/code>, <code>onBackpressureError()<\/code>. All of them request unbounded upstream. Never use <code>onBackpressureBuffer()<\/code> without a size. <code>Flux.create<\/code> buffers without limit by default.<\/p>\n<h2>Sharing and Sinks<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Operator<\/th>\n<th>A late subscriber gets<\/th>\n<th>Disconnects<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>share()<\/code> = <code>publish().refCount()<\/code><\/td>\n<td>only new items<\/td>\n<td>when the last one leaves<\/td>\n<\/tr>\n<tr>\n<td><code>replay(n).refCount()<\/code><\/td>\n<td>the last n, then new ones<\/td>\n<td>when the last one leaves<\/td>\n<\/tr>\n<tr>\n<td><code>publish().autoConnect(n)<\/code><\/td>\n<td>only new items<\/td>\n<td>never<\/td>\n<\/tr>\n<tr>\n<td><code>cache()<\/code><\/td>\n<td>everything<\/td>\n<td>never<\/td>\n<\/tr>\n<tr>\n<td><code>Mono.cache(ttl)<\/code><\/td>\n<td>the value until it expires<\/td>\n<td>not applicable<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>Sinks.many().multicast().directBestEffort()<\/code> for a live hub that survives having no subscribers; <code>onBackpressureBuffer()<\/code> buffers but shuts down when its last subscriber leaves. From several threads, use <code>emitNext(item, Sinks.EmitFailureHandler.busyLooping(Duration.ofSeconds(1)))<\/code>; a bare <code>tryEmitNext<\/code> can return <code>FAIL_NON_SERIALIZED<\/code> and lose the item.<\/p>\n<h2>Testing and debugging<\/h2>\n<div class=\"pair\"><div class=\"pairbar\" role=\"group\" aria-label=\"Code language\"><button data-act=\"lang\" data-lang=\"java\">Java<\/button><button data-act=\"lang\" data-lang=\"kotlin\">Kotlin<\/button><button data-act=\"lang\" data-lang=\"both\">Both<\/button><\/div><div class=\"pi\" data-lang=\"java\"><span class=\"lg\">Java<\/span><pre class=\"code\" data-lang=\"java\"><code><span class=\"n\">StepVerifier<\/span><span class=\"p\">.<\/span><span class=\"na\">withVirtualTime<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">poller<\/span><span class=\"p\">.<\/span><span class=\"na\">awaitFinal<\/span><span class=\"p\">(<\/span><span class=\"s\">\"p-1\"<\/span><span class=\"p\">))<\/span><span class=\"w\">   <\/span><span class=\"c1\">// build it inside the supplier<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">expectSubscription<\/span><span class=\"p\">()<\/span><span class=\"w\">                                    <\/span><span class=\"c1\">// before expectNoEvent<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">expectNoEvent<\/span><span class=\"p\">(<\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofSeconds<\/span><span class=\"p\">(<\/span><span class=\"mi\">90<\/span><span class=\"p\">))<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">expectNext<\/span><span class=\"p\">(<\/span><span class=\"n\">SETTLED<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">expectComplete<\/span><span class=\"p\">()<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">verify<\/span><span class=\"p\">(<\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofSeconds<\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">));<\/span><span class=\"w\">                          <\/span><span class=\"c1\">// nothing runs without verify()<\/span>\n<\/code><\/pre><\/div><div class=\"pi\" data-lang=\"kotlin\"><span class=\"lg\">Kotlin<\/span><pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">StepVerifier<\/span><span class=\"p\">.<\/span><span class=\"na\">withVirtualTime<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">poller<\/span><span class=\"p\">.<\/span><span class=\"na\">awaitFinal<\/span><span class=\"p\">(<\/span><span class=\"s\">\"p-1\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">       <\/span><span class=\"c1\">// build it inside the supplier<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">.<\/span><span class=\"na\">expectSubscription<\/span><span class=\"p\">()<\/span><span class=\"w\">                                        <\/span><span class=\"c1\">// before expectNoEvent<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">.<\/span><span class=\"na\">expectNoEvent<\/span><span class=\"p\">(<\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofSeconds<\/span><span class=\"p\">(<\/span><span class=\"m\">90<\/span><span class=\"p\">))<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">.<\/span><span class=\"na\">expectNext<\/span><span class=\"p\">(<\/span><span class=\"n\">SETTLED<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">.<\/span><span class=\"na\">expectComplete<\/span><span class=\"p\">()<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">.<\/span><span class=\"na\">verify<\/span><span class=\"p\">(<\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofSeconds<\/span><span class=\"p\">(<\/span><span class=\"m\">1<\/span><span class=\"p\">))<\/span><span class=\"w\">                               <\/span><span class=\"c1\">// nothing runs without verify()<\/span>\n<\/code><\/pre><\/div><\/div>\n<p><code>TestPublisher<\/code> drives a source by hand; <code>PublisherProbe<\/code> proves a branch ran. <code>checkpoint(\"name\")<\/code> labels errors cheaply, <code>log()<\/code> prints every signal, <code>Hooks.onOperatorDebug()<\/code> is a costly last resort.<\/p>\n<h2>When to use it<\/h2>\n<p>Request and response over JDBC or other blocking clients: virtual threads and plain code. Streams, demand, cancellation, loss policies, and many calls composed with timeouts and retries: Reactor. Kotlin: coroutines and <code>Flow<\/code>, bridged by <code>kotlinx-coroutines-reactor<\/code>.<\/p>","recap":["Reactive Streams is a contract of four interfaces: the subscriber asks for <code>n<\/code> items, the publisher never sends more, and <code>onError<\/code> or <code>onComplete<\/code> ends the stream for good.","Assembly builds a recipe; subscription runs it, once per subscriber for a cold publisher. <code>Mono.just(call())<\/code> runs the call at assembly; <code>fromCallable<\/code> and <code>defer<\/code> run it per subscription.","<code>flatMap<\/code> runs inners concurrently in completion order (256 at a time by default), <code>concatMap<\/code> one at a time in order, <code>flatMapSequential<\/code> concurrently in order, <code>switchMap<\/code> keeps only the latest.","<code>Mono.zip<\/code> completes empty, silently, when one source is empty. Say what empty means on each source.","For remote calls: a lazy source, a per-attempt <code>timeout<\/code>, <code>retryWhen(Retry.backoff(...).filter(...))<\/code> (3 retries means 4 attempts), and a fallback for exhausted retries.","Code runs on the thread that delivered the signal. <code>publishOn<\/code> moves what follows, <code>subscribeOn<\/code> moves the source; blocking calls go on <code>boundedElastic<\/code>, with <code>subscribeOn<\/code> on each inner.","<code>limitRate<\/code> reshapes demand. For sources that can't slow down, pick a loss policy; <code>onBackpressureBuffer()<\/code> with no size only hides the backlog.","<code>share<\/code>, <code>replay(n).refCount()<\/code> and <code>cache<\/code> differ in what late subscribers get and when they disconnect. Sinks need a retrying emit when several threads push.","Test with <code>StepVerifier<\/code> and virtual time: always <code>verify()<\/code> with a timeout, and build the publisher inside the supplier.","Use Reactor for streams and composed concurrency; for request and response over blocking libraries, virtual threads and imperative code are simpler."],"quiz":[{"q":"A <code>Flow.Subscriber<\/code> calls <code>request(2)<\/code> in <code>onSubscribe<\/code> and never requests again. Its publisher has 100 items ready. What does the subscriber receive?","options":["All 100 items, because the publisher pushes what it has","2 items, then nothing until it requests more","2 items, then <code>onComplete<\/code>","2 items, then <code>onError<\/code>, because the rest were not requested"],"answer":1,"why":"Rule 1.1: a publisher sends no more <code>onNext<\/code> signals than were requested. A publisher that still has items to deliver doesn't complete; it waits for more demand. A stream with unmet demand simply stalls, which is what to look for when a pipeline hangs.","from":null},{"q":"<code>Mono&lt;Receipt&gt; r = Mono.just(chargeCard(payment));<\/code> is built, but nothing ever subscribes to <code>r<\/code>. How many times is the card charged?","options":["Never: nothing happens until you subscribe","Once","Once per subscriber, so zero","It depends on the scheduler"],"answer":1,"why":"<code>Mono.just<\/code> takes a value, so Java evaluates <code>chargeCard(payment)<\/code> before <code>just<\/code> is even called: the charge happens at assembly. \"Nothing happens until you subscribe\" is true of the work inside operators and <code>fromCallable<\/code>, not of arguments you compute yourself.","from":null},{"q":"Source <code>3, 1, 2<\/code>; each item i is turned into a call that takes i x 100 ms. What does <code>concatMap<\/code> emit, and when is it done?","options":["<code>1, 2, 3<\/code>, done at 300 ms","<code>3, 1, 2<\/code>, done at 300 ms","<code>3, 1, 2<\/code>, done at 600 ms","<code>1, 2, 3<\/code>, done at 600 ms"],"answer":2,"why":"<code>concatMap<\/code> runs one call at a time in source order, so it takes 300 + 100 + 200 = 600 ms. <code>flatMap<\/code> would give <code>1, 2, 3<\/code> at 300 ms (completion order), and <code>flatMapSequential<\/code> <code>3, 1, 2<\/code> at 300 ms (concurrent, but reordered).","from":null},{"q":"A merchant search box sends a lookup on every keystroke. Results of an older query must never overwrite newer ones. Which operator fits?","options":["<code>flatMap<\/code>","<code>concatMap<\/code>","<code>switchMap<\/code>","<code>flatMapSequential<\/code>"],"answer":2,"why":"<code>switchMap<\/code> cancels the previous lookup as soon as a new keystroke arrives, so only the latest query can produce results. <code>flatMap<\/code> lets a slow old query land after a newer one; <code>concatMap<\/code> and <code>flatMapSequential<\/code> would wait for every old query in order.","from":null},{"q":"<code>Mono.zip(fxRate, fee, limit)<\/code>: <code>limit<\/code> completes empty because the customer has no limit configured. What does the zip do?","options":["Fails with <code>NoSuchElementException<\/code>","Emits a tuple with <code>null<\/code> for the limit","Waits for a limit that never comes","Completes empty, with no error, and cancels the other calls"],"answer":3,"why":"An empty source gives the zip nothing to combine, so it completes empty at once and cancels the rest. Nothing is logged. Put <code>switchIfEmpty(Mono.error(...))<\/code> or <code>defaultIfEmpty(...)<\/code> on each source that can be empty.","from":null},{"q":"<code>Mono.defer(() -&gt; issuer.authorize(id)).retryWhen(Retry.backoff(3, Duration.ofMillis(100)).jitter(0))<\/code> against an issuer that always fails. What happens?","options":["3 calls, then the issuer's exception","4 calls at 0, 100, 300 and 700 ms, then <code>RetryExhaustedException<\/code> with the issuer's exception as its cause","4 calls 100 ms apart, then the issuer's exception","An endless loop of calls"],"answer":1,"why":"The 3 counts retries, so there are 4 attempts, with waits of 100, 200 and 400 ms. When the retries run out, <code>Retry.backoff<\/code> signals <code>RetryExhaustedException<\/code> (\"Retries exhausted: 3/3\"). Plain <code>retry(3)<\/code> would also make 4 attempts, with no waits, and rethrow the original error.","from":null},{"q":"<code>Flux.fromIterable(ids).flatMap(id -&gt; Mono.fromCallable(() -&gt; dao.load(id))).subscribeOn(Schedulers.boundedElastic())<\/code> loads 50 rows, 20 ms each, with a blocking DAO. About how long does it take?","options":["About 20 ms: flatMap runs them all at once","About 1 second: all 50 run in turn on one thread","About 250 ms: one thread per core","It fails: blocking is not allowed on boundedElastic"],"answer":1,"why":"<code>subscribeOn<\/code> on the outer Flux puts the whole subscription on one boundedElastic thread, and each <code>fromCallable<\/code> runs synchronously when <code>flatMap<\/code> subscribes to it, on that same thread. Put <code>subscribeOn(boundedElastic())<\/code> on each inner Mono, and cap the fan-out with <code>flatMap<\/code>'s concurrency.","from":null},{"q":"A WebSocket of audit events can't slow down. No event may be lost silently, and bursts of a few hundred are normal. Which line fits?","options":["<code>events.onBackpressureBuffer()<\/code>","<code>events.onBackpressureLatest()<\/code>","<code>events.onBackpressureBuffer(1_000, e -&gt; log.error(\"overflow at {}\", e.id()))<\/code>","<code>events.limitRate(100)<\/code>"],"answer":2,"why":"A bounded buffer absorbs the bursts, and if the consumer falls further behind, it cancels the source, logs the overflowing event and fails, so the gap is visible. The unbounded buffer hides the backlog until memory runs out, <code>onBackpressureLatest<\/code> drops events silently, and <code>limitRate<\/code> changes requests that this source ignores.","from":null},{"q":"Twelve dashboards share one FX provider connection. A dashboard that opens late must show the current rate at once, and the connection must close when nobody watches. Which operator fits?","options":["<code>rates.replay(1).refCount()<\/code>","<code>rates.share()<\/code>","<code>rates.cache()<\/code>","<code>rates.publish().autoConnect(1)<\/code>"],"answer":0,"why":"<code>replay(1)<\/code> hands a late subscriber the latest rate, and <code>refCount()<\/code> cancels the upstream when the last subscriber leaves. <code>share()<\/code> makes a late dashboard wait for the next tick; <code>cache()<\/code> and <code>autoConnect<\/code> never disconnect, and <code>cache()<\/code> keeps every rate forever.","from":null},{"q":"A test builds <code>Mono&lt;Status&gt; poll = poller.awaitFinal(\"p-1\");<\/code> in <code>@BeforeEach<\/code>, then runs <code>StepVerifier.withVirtualTime(() -&gt; poll).thenAwait(Duration.ofMinutes(5))...verify(Duration.ofSeconds(1))<\/code>. It fails with \"VerifySubscriber timed out\". Why?","options":["Virtual time doesn't work with <code>Mono<\/code>","<code>thenAwait<\/code> must be replaced with <code>Thread.sleep<\/code>","<code>verify<\/code> needs a longer timeout, such as 5 minutes","The Mono was assembled before virtual time was installed, so its timers use the real clock"],"answer":3,"why":"Operators such as <code>interval<\/code>, <code>delay<\/code> and <code>timeout<\/code> pick their scheduler at assembly. Built in <code>@BeforeEach<\/code>, the poller's timers run on the real <code>parallel<\/code> scheduler, and advancing the virtual clock does nothing. Call <code>poller.awaitFinal(\"p-1\")<\/code> inside the supplier. A 5-minute real timeout would just make the test slow.","from":null}]},{"id":"co","lab":"coroutines","title":"Kotlin coroutines","short":"Suspend functions, structured concurrency, dispatchers, cancellation, Flow and channels.","lessons":["co-01","co-02","co-03","co-04","co-05","co-06","co-07","co-08","co-09","co-10","co-11"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"pat","lab":"patterns","title":"Design patterns in Java and Kotlin","short":"Creational, structural and behavioral patterns, what Kotlin makes unnecessary, and concurrency patterns.","lessons":["pat-01","pat-02","pat-03","pat-04","pat-05","pat-06","pat-07","pat-08","pat-09","pat-10","pat-11"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"mem","lab":"memory","title":"Memory and garbage collection","short":"Heap, stacks and object layout, allocation, references, G1, ZGC and Shenandoah, GC logs, and hunting leaks.","lessons":["mem-01","mem-02","mem-03","mem-04","mem-05","mem-06","mem-07"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"perf","lab":"performance","title":"JIT, profiling and benchmarking","short":"Tiered compilation, inlining and deoptimization, JMH, false sharing, JFR, async-profiler and flame graphs.","lessons":["perf-01","perf-02","perf-03","perf-04","perf-05","perf-06","perf-07"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"cls","lab":"bytecode","title":"Class loading, bytecode and dynamic proxies","short":"Class loaders and initialization, reading bytecode, invokedynamic, JDK and generated proxies, the ClassFile API and agents.","lessons":["cls-01","cls-02","cls-03","cls-04","cls-05","cls-06","cls-07"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"io","lab":"nio","title":"NIO and event loops","short":"Blocking vs non-blocking IO, buffers, channels and selectors, Netty and Vert.x event loops, and zero-copy.","lessons":["io-01","io-02","io-03","io-04","io-05"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"boot","lab":"startup","title":"Startup and footprint","short":"Why the JVM starts slowly, class data sharing, Project Leyden's AOT cache, GraalVM native image and CRaC.","lessons":["boot-01","boot-02","boot-03","boot-04"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"kt","lab":"kotlin","title":"Advanced Kotlin","short":"Inline functions, value classes, delegation, type-safe DSLs, contracts, context parameters and compiler plugins.","lessons":["kt-01","kt-02","kt-03","kt-04","kt-05","kt-06"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"dop","lab":"modernjava","title":"Modern Java data modeling","short":"Records, sealed types, pattern matching and data-oriented programming, and where Project Valhalla is heading.","lessons":["dop-01","dop-02","dop-03","dop-04"],"intro":"","cheatsheet":"","recap":[],"quiz":[]}],"lessons":{"conc-01":{"id":"conc-01","track":"conc","n":1,"title":"Threads from zero","ready":true,"minutes":35,"goal":"By the end you can say what a thread is and what it costs, start threads with <code>start()<\/code> and wait for them with <code>join()<\/code>, and split a job across several workers.","quiz":[{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"n\">Thread<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Thread<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"n\">Thread<\/span><span class=\"p\">.<\/span><span class=\"na\">currentThread<\/span><span class=\"p\">().<\/span><span class=\"na\">getName<\/span><span class=\"p\">()),<\/span><span class=\"w\"> <\/span><span class=\"s\">\"audit\"<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">t<\/span><span class=\"p\">.<\/span><span class=\"na\">run<\/span><span class=\"p\">();<\/span>\n<\/code><\/pre>","options":["audit","main","Thread-0","Nothing, because the thread was never started"],"answer":1,"why":"<code>run()<\/code> is an ordinary method call, so the lambda runs on the calling thread, which is <code>main<\/code>. No new thread exists. It would print <code>audit<\/code> only with <code>t.start()<\/code>. It does print something, because <code>run()<\/code> executes the code, just on the wrong thread.","from":null},{"q":"A batch job scores transactions with a fraud model. It is pure CPU work, with no I/O. The pod has 4 cores. Which thread count gives about the best throughput?","options":["1","4","64","400"],"answer":1,"why":"With pure CPU work, each core can run one thread at a time. Four threads keep all four cores busy. More threads only take turns on the same cores and add context-switch overhead. Large counts like 400 make sense only when most threads spend their time waiting.","from":null},{"q":"A worker thread throws a <code>NullPointerException<\/code> out of its <code>run()<\/code> method. What happens to <code>main<\/code>, which started it?","options":["<code>main<\/code> gets the NullPointerException at its next line","The JVM shuts down","<code>main<\/code> carries on. The worker ends and its stack trace is printed to standard error","<code>main<\/code> gets it when it calls <code>join()<\/code>"],"answer":2,"why":"An uncaught exception ends only the thread that threw it. The default handler prints the stack trace, and nobody else is told. <code>join()<\/code> simply returns once the worker has ended. Carrying exceptions back to the caller is a job for <code>Future<\/code>, in the executors track.","from":null},{"q":"<p>What is wrong with this loop?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">Runnable<\/span><span class=\"w\"> <\/span><span class=\"n\">job<\/span><span class=\"w\"> <\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">jobs<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/
