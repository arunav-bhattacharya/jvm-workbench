<style>@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-400.woff2) format('woff2')}@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-400i.woff2) format('woff2')}@font-face{font-family:'Newsreader';font-style:normal;font-weight:400;font-display:swap;size-adjust:98%;src:url(/fonts/newsreader-400.woff2) format('woff2')}@font-face{font-family:'Newsreader';font-style:italic;font-weight:400;font-display:swap;size-adjust:98%;src:url(/fonts/newsreader-400i.woff2) format('woff2')}@font-face{font-family:'Newsreader';font-style:normal;font-weight:600;font-display:swap;size-adjust:98%;src:url(/fonts/newsreader-600.woff2) format('woff2')}@font-face{font-family:'Newsreader';font-style:italic;font-weight:600;font-display:swap;size-adjust:98%;src:url(/fonts/newsreader-600i.woff2) format('woff2')}@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/inter-400.woff2) format('woff2')}@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/inter-500.woff2) format('woff2')}@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/inter-600.woff2) format('woff2')}@font-face{font-family:'CMU Serif';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/cmu-serif-400.woff2) format('woff2')}@font-face{font-family:'CMU Serif';font-style:italic;font-weight:400;font-display:swap;src:url(/fonts/cmu-serif-400i.woff2) format('woff2')}</style>
<style>/* The AI Engineer from Zero look: a field-guide book. Index on the left, one reading column,
   contents on the right on wide screens. Light by default on a near-white page; a near-black night
   theme is one toggle away. Blue is the one accent; teal, amber, rose and plum only mark callouts. */
:root {
  color-scheme: light;
  --ink: #fcfcfb;        /* page */
  --panel: #ffffff;      /* cards, raised surfaces */
  --well: #f5f6f8;       /* code blocks, inputs */
  --tint: #eef1f5;       /* inline code, quiet fills */
  --rule: #e2e5eb;
  --rule-2: #eceff3;
  --fg: #23262e;
  --mute: #575b66;
  --faint: #8b909b;
  --ember: #1f5fc4;      /* the accent */
  --ember-ink: #ffffff;
  --soft: rgba(31, 95, 196, 0.08);
  --gold: #1a4a96;       /* deep blue for emphasis text */
  --teal: #0f7a6a;
  --amber: #995a05;
  --plum: #4b55b8;
  --rose: #ab3450;
  --ok: #1d7a4c;
  --bad: #b5303a;
  --mark-off: rgba(35, 38, 46, 0.16);
  /* code, in GitHub's light theme */
  --gh-fg: #1f2328; --gh-bg: #f6f8fa; --gh-file: #ffffff; --gh-border: #d1d9e0; --gh-inline: rgba(129, 139, 152, 0.12);
  --gh-kw: #cf222e; --gh-str: #0a3069; --gh-com: #59636e; --gh-const: #0550ae; --gh-ent: #6639ba; --gh-var: #953800;
  /* older names the page still uses */
  --run: var(--ember); --link: var(--ember); --hold: var(--ember); --hold-ink: var(--gold);
  --display: "Instrument Serif", "CMU Serif", Georgia, serif;
  --read: "Newsreader", "CMU Serif", Georgia, serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --fig: "CMU Serif", "Latin Modern Roman", Georgia, serif;
  --top: 54px;
  --side: 272px;
  --read-w: 40em;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  /* night: near-black neutral greys, the same blue accent */
  --ink: #0a0a0b; --panel: #141415; --well: #101011; --tint: #1d1d1f; --rule: #2a2a2d; --rule-2: #1f1f21;
  --fg: #ececee; --mute: #a6a6ad; --faint: #717177;
  --ember: #5b9bff; --ember-ink: #050608; --soft: rgba(91, 155, 255, 0.12); --gold: #8ec5ff;
  --teal: #3fc7b3; --amber: #f2b85b; --plum: #a7b4ff; --rose: #f2839a; --ok: #5ccf96; --bad: #f07a86;
  --mark-off: rgba(236, 236, 238, 0.16);
  --gh-fg: #f0f6fc; --gh-bg: #151b23; --gh-file: #0d1117; --gh-border: #3d444d; --gh-inline: rgba(101, 108, 118, 0.2);
  --gh-kw: #ff7b72; --gh-str: #a5d6ff; --gh-com: #9198a1; --gh-const: #79c0ff; --gh-ent: #d2a8ff; --gh-var: #ffa657;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font: 400 20px/1.46 var(--read); font-feature-settings: "kern", "liga"; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--ink); }
::selection { background: color-mix(in srgb, var(--ember) 30%, transparent); }
a { color: var(--ember); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--ember) 45%, transparent); }
a:hover { text-decoration-color: var(--ember); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 4px; }
code, pre, kbd { font-family: var(--mono); }
p code, li code, td code, dd code, h2 code, h3 code, .q code, .opt code, .why code, .goal code, .front code, .crumb code, .tag code {
  font-family: var(--mono); font-size: 0.8em; padding: 0.2em 0.4em; border-radius: 6px; background: var(--gh-inline); color: var(--gh-fg); white-space: break-spaces;
}
h1, h2, h3 { font-family: var(--display); font-weight: 400; letter-spacing: 0; text-wrap: balance; margin: 0; line-height: 1.08; }
h1 em, h1 i, h2 em { font-style: italic; }
.label { font: 600 13px/1.35 var(--body); letter-spacing: 0; text-transform: none; color: var(--mute); }
.mute { color: var(--mute); }
.tnum { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- frame ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--top);
  display: flex; align-items: center; gap: 10px;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--ink) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px 6px; min-width: 0; color: var(--fg); }
.brand b { font: 400 21px/1 var(--display); white-space: nowrap; }
.brand i { font-family: var(--display); color: var(--gold); }
.iconbtn { background: none; border: 1px solid transparent; border-radius: 9px; padding: 7px; cursor: pointer; color: var(--mute); display: grid; place-items: center; }
.iconbtn:hover { color: var(--fg); border-color: var(--rule); }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 7px; font: 600 13px/1 var(--body); border: 1px solid var(--rule); border-radius: 999px; padding: 7px 12px; background: transparent; cursor: pointer; color: var(--mute); white-space: nowrap; }
.chip:hover { border-color: var(--faint); color: var(--fg); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ember); }
.chip.quiet .dot { background: var(--mark-off); }
.hide-sm { display: inline-flex; }
.switch { position: relative; width: 40px; height: 22px; flex: none; border: 0; padding: 0; background: none; cursor: pointer; }
.switch .tr { position: absolute; inset: 0; border-radius: 999px; border: 1px solid var(--rule); background: var(--panel); }
.switch .kn { position: absolute; top: 4px; left: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); transition: transform 0.2s; }
:root[data-theme="dark"] .switch .kn { transform: translateX(18px); }

.side { position: fixed; left: 0; bottom: 0; top: calc(env(safe-area-inset-top, 0px) + var(--top)); width: var(--side); border-right: 1px solid var(--rule); background: var(--ink); overflow-y: auto; padding: 12px 0 40px; padding-left: max(0px, env(safe-area-inset-left, 0px)); scrollbar-width: none; transition: transform .3s ease; z-index: 40; }
.side::-webkit-scrollbar { display: none; }
.side.closed { transform: translateX(-100%); }
.main { margin-left: var(--side); transition: margin .3s ease; min-width: 0; }
.main.wide { margin-left: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 32px 96px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1024px) { .wrap { padding-left: max(44px, env(safe-area-inset-left, 0px)); padding-right: max(36px, env(safe-area-inset-right, 0px)); } }
.scrim { display: none; }
@media (max-width: 1023px) {
  .side { top: 0; z-index: 80; width: min(88vw, 340px); padding-top: calc(env(safe-area-inset-top, 0px) + 10px); }
  .side:not(.closed) { box-shadow: 0 0 40px rgba(0, 0, 0, 0.25); }
  .main { margin-left: 0; }
  .scrim.on { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 70; }
}
@media (max-width: 560px) { .hide-sm { display: none; } .brand b { font-size: 19px; } }

.nav { display: grid; gap: 1px; padding: 0 8px; }
.nav button { display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; border-left: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--fg); font: 400 15.5px/1.35 var(--read); width: 100%; }
.nav button:hover { border-left-color: var(--rule); }
.nav button.on { border-left-color: var(--ember); font-weight: 600; }
.nav .count { margin-left: auto; font: 600 12px var(--body); color: var(--faint); }
.navsec { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 12px; }
.navsec > .label { padding: 0 20px 8px; display: block; }
.trk { border-bottom: 1px solid var(--rule); }
.trk > button { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 8px; align-items: start; text-align: left; width: 100%; background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--fg); }
.trk .tn { font: 400 12px/1.9 var(--mono); color: var(--faint); }
.trk .tt { font: 400 17px/1.2 var(--display); }
.trk .draft { grid-column: 2; }
.trk ul { list-style: none; margin: 0 0 8px; padding: 0 8px 0 30px; }
.trk li button { display: flex; gap: 9px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid transparent; padding: 5px 10px; cursor: pointer; font: 400 15px/1.35 var(--read); color: var(--mute); }
.trk li button:hover { color: var(--fg); border-left-color: var(--rule); }
.trk li button.on { color: var(--fg); font-weight: 600; border-left-color: var(--ember); }
.trk li .cell { flex: none; transform: translateY(-1px); }
.field.filter { margin: 4px 20px 6px; width: calc(100% - 40px); font-size: 15px; }

/* progress marks: filled = done, ringed = next, faint = later */
.draft { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.cell { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--mark-off); border: 0; flex: none; }
.cell.done { background: var(--ember); }
.cell.here { background: var(--ember); box-shadow: 0 0 0 2px var(--ink), 0 0 0 3.2px var(--ember); }
.cell.lg { width: 11px; height: 11px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent; background: var(--ember); color: var(--ember-ink); font: 600 15px var(--body); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { filter: brightness(1.06); text-decoration: none; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--rule); font-weight: 500; }
.btn.ghost:hover { border-color: var(--mute); }
.btn.hold { background: var(--ember); color: var(--ember-ink); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 14px; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { width: 100%; background: var(--panel); color: var(--fg); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; font: 17px/1.5 var(--read); resize: vertical; }
.field:focus { outline: none; border-color: var(--mute); }
select.field { width: auto; font: 14px var(--body); height: 34px; padding: 0 10px; border-radius: 9px; }
.linkish { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 20px 22px; }
.hair { border: 0; border-top: 1px solid var(--rule); margin: 0; }

/* ---------- prose ---------- */
.prose { max-width: var(--read-w); }
.prose > * { margin: 0 0 0.9em; }
.prose > *:last-child { margin-bottom: 0; }
.prose ul { list-style: disc outside; padding-left: 1.5em; }
.prose ol { list-style: decimal outside; padding-left: 1.5em; }
.prose li { margin: 0.35em 0; padding-left: 0.2em; }
.prose ul li::marker { content: "\2022  "; color: var(--ember); font-size: 1.15em; }
.prose ol li::marker { font-family: var(--read); font-weight: 600; color: var(--ember); font-variant-numeric: lining-nums; }
.prose strong { font-weight: 600; color: var(--fg); }
.prose h3, .prose h4 { font: 600 20px/1.3 var(--read); margin-top: 1.3em; }
.tablewrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); }
.tablewrap table { border-collapse: collapse; width: 100%; font: 15px/1.45 var(--body); }
.tablewrap th, .tablewrap td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tablewrap th { font-weight: 600; font-size: 13px; color: var(--mute); background: var(--well); }
.tablewrap tr:last-child td { border-bottom: 0; }

/* ---------- code: GitHub's look (markdown blocks on a grey panel, files with a header bar) ---------- */
pre.code, .codebox pre { margin: 0; background: var(--gh-bg); color: var(--gh-fg); border: 0; border-radius: 6px; padding: 16px; overflow-x: auto; font: 400 14px/1.5 var(--mono); tab-size: 4; max-width: 100%; }
.prose pre.code { margin: 0 0 1em; }
.codebox { border: 1px solid var(--gh-border); border-radius: 6px; overflow: hidden; background: var(--gh-file); min-width: 0; }
.codebox .bar { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--gh-border); font: 600 13px var(--body); color: var(--gh-fg); background: var(--gh-bg); }
.codebox .bar .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 13px var(--mono); }
.codebox .bar .label { font-size: 12px; font-weight: 500; color: var(--gh-com); }
.codebox pre { background: var(--gh-file); border-radius: 0; }
.codebox .run { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-top: 1px solid var(--gh-border); font: 13px/1.4 var(--mono); color: var(--gh-com); background: var(--gh-bg); }
.codebox .run code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; color: var(--gh-fg); }
.copy { font: 500 12px var(--body); background: var(--gh-file); border: 1px solid var(--gh-border); border-radius: 6px; padding: 3px 10px; cursor: pointer; color: var(--gh-fg); }
.copy:hover { background: var(--gh-bg); }
code, pre, kbd, .codebox, .sim ol { font-variant-ligatures: none; }
/* Pygments token classes mapped to GitHub's syntax roles */
.k, .kd, .kn, .kr, .kp, .kt, .ow { color: var(--gh-kw); }
.kc, .m, .mi, .mf, .mh, .il, .mb, .mo, .nb, .bp, .no { color: var(--gh-const); }
.s, .s1, .s2, .sb, .sc, .se, .sa, .sh, .sx, .si, .sd, .dl, .sr { color: var(--gh-str); }
.c, .c1, .cm, .cs, .ch, .cp, .cpf { color: var(--gh-com); }
.nf, .fm, .nc, .ne { color: var(--gh-ent); }
.nd, .nl { color: var(--gh-var); }
.n, .nn, .na, .nv, .o, .p, .w { color: inherit; }
.gp { color: var(--gh-com); user-select: none; }
.err { color: inherit; background: none; }

/* Java/Kotlin pairs: html[data-code] is java, kotlin or both */
.pair { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); min-width: 0; margin: 0 0 1em; max-width: 100%; }
.pair:last-child { margin-bottom: 0; }
.pi { display: grid; gap: 4px; min-width: 0; }
.pi .lg { font: 600 12.5px var(--body); color: var(--mute); }
.pi[data-lang="java"] .lg { color: var(--ember); }
.pi[data-lang="kotlin"] .lg { color: var(--plum); }
.pi pre.code { margin: 0; }
.pairbar { display: inline-flex; justify-self: start; gap: 2px; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; }
.pairbar button { border: 0; background: none; padding: 3px 11px; border-radius: 999px; cursor: pointer; font: 500 12.5px var(--body); color: var(--mute); }
.pairbar button:hover { color: var(--fg); }
:root[data-code="java"] .pairbar [data-lang="java"], :root[data-code="kotlin"] .pairbar [data-lang="kotlin"], :root[data-code="both"] .pairbar [data-lang="both"], :root:not([data-code]) .pairbar [data-lang="both"] { background: var(--ember); color: var(--ember-ink); }
:root[data-code="java"] .pair > .pi[data-lang="kotlin"], :root[data-code="kotlin"] .pair > .pi[data-lang="java"] { display: none; }
.cmp { container-type: inline-size; display: grid; gap: 12px; }
@container (min-width: 900px) {
  :root[data-code="both"] .pair.cols2, :root:not([data-code]) .pair.cols2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .pair.cols2 > .pairbar { grid-column: 1 / -1; }
}

/* ---------- home ---------- */
.hero { display: grid; gap: 22px; margin-bottom: 44px; }
.hero h1 { font-size: clamp(46px, 7vw, 68px); line-height: 1.02; }
.hero h1 i { color: var(--gold); }
.hero p { font-size: 20.5px; color: var(--mute); max-width: 42em; margin: 0; }
.plate-wrap { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 18px 0; overflow-x: auto; }
.plate-svg { display: block; width: 100%; max-width: 860px; height: auto; }
.plate-svg .wk { font: 12px var(--mono); fill: var(--faint); }
.plate-svg circle { cursor: pointer; }
.plate-legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font: 14px var(--body); color: var(--mute); align-items: center; }
.plate-legend span { display: inline-flex; gap: 8px; align-items: center; }
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
.pulse { animation: pulse 1.8s ease-in-out infinite; }

.today { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); margin-bottom: 52px; }
@media (min-width: 900px) { .today { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, .9fr); } }
.step { display: grid; gap: 10px; align-content: start; }
.step .n { font: 600 13px var(--body); color: var(--mute); display: flex; gap: 8px; align-items: center; }
.step h3 { font-size: 30px; }
.step.now { border-color: color-mix(in srgb, var(--ember) 45%, var(--rule)); box-shadow: 0 0 0 3px var(--soft); }
.stat { font: 400 44px/1 var(--display); }
.stat small { font: 600 13px var(--body); color: var(--faint); margin-left: 8px; }

.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 16px; flex-wrap: wrap; }
.sechead h2 { font-size: 36px; }
.tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; margin-bottom: 52px; }
.tcard { text-align: left; cursor: pointer; display: grid; gap: 10px; align-content: start; color: var(--fg); transition: border-color .15s; font: inherit; }
.tcard:hover { border-color: var(--mute); }
.tcard h3 { font-size: 26px; }
.tcard p { margin: 0; font-size: 17px; color: var(--mute); line-height: 1.45; }
.tcard .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 600 13px var(--body); color: var(--faint); }
.how { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.how div { border-top: 1px solid var(--rule); padding-top: 12px; }
.how b { display: block; font: 400 24px/1.2 var(--display); margin-bottom: 4px; }
.how span { color: var(--mute); font-size: 17.5px; }

/* ---------- lesson ---------- */
.lgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 52px; }
@media (min-width: 1280px) { .lgrid { grid-template-columns: minmax(0, 1fr) 232px; } }
.lgrid > article { min-width: 0; max-width: 900px; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top) + 26px); align-self: start; display: none; max-height: calc(100vh - 120px); overflow-y: auto; font-family: var(--body); }
@media (min-width: 1280px) { .toc { display: block; } }
.toc ul { list-style: none; margin: 10px 0 0; padding: 0; border-left: 1px solid var(--rule); }
.toc li button { display: flex; gap: 8px; background: none; border: 0; text-align: left; cursor: pointer; padding: 6px 0 6px 14px; margin-left: -1px; border-left: 2px solid transparent; font: 14px/1.35 var(--body); color: var(--mute); width: 100%; }
.toc li button:hover { color: var(--fg); }
.toc li.on button { color: var(--fg); border-left-color: var(--ember); }
.toc li button .label { color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
.toc li.on button .label { color: var(--ember); }
.lhead { display: grid; gap: 14px; margin-bottom: 30px; max-width: 900px; }
.crumb { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.crumb > .label:first-child { font: 600 13px var(--body); padding: 4px 11px; border-radius: 999px; background: var(--soft); color: var(--ember) !important; }
.crumb button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--mute); font: italic 17px var(--read); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.crumb button:hover { color: var(--fg); }
.crumb .label { font: italic 400 17px var(--read); color: var(--mute); }
.lhead h1 { font-size: clamp(40px, 5vw, 58px); line-height: 1.02; max-width: 20ch; }
.goal { font-size: 20.5px; line-height: 1.5; color: var(--mute); margin: 0; max-width: 42em; }
.donebar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.done-pill { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; font: 600 14px var(--body); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 55%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.lsec { padding-top: 0; margin-top: 76px; scroll-margin-top: calc(var(--top) + 16px); display: grid; gap: 18px; }
.lsec:first-of-type { margin-top: 46px; }
.shead { display: flex; gap: 14px; align-items: center; }
.shead .sn { font: 400 23px var(--display); color: var(--ember); width: 42px; height: 42px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; flex: none; font-variant-numeric: lining-nums; }
.shead h2 { font-size: 34px; line-height: 1.1; }
.block { margin-top: 84px; scroll-margin-top: calc(var(--top) + 16px); display: grid; gap: 16px; }
.block > h2 { font-size: 36px; }
.block > .label { margin-bottom: -8px; }

.call { border-radius: 14px; padding: 14px 18px; border: 1px solid transparent; max-width: none; }
.call > .label { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font: 600 17px var(--read); }
.call .prose { font-size: 18.5px; max-width: none; }
.call.analogy { background: color-mix(in srgb, var(--teal) 7%, transparent); border-color: color-mix(in srgb, var(--teal) 26%, transparent); }
.call.analogy > .label { color: var(--teal); }
.call.world { background: color-mix(in srgb, var(--amber) 7%, transparent); border-color: color-mix(in srgb, var(--amber) 26%, transparent); }
.call.world > .label { color: var(--amber); }
.call.mistake { background: color-mix(in srgb, var(--rose) 6%, transparent); border-color: color-mix(in srgb, var(--rose) 26%, transparent); }
.call.mistake > .label { color: var(--rose); }

.tryit { border-radius: 14px; padding: 14px 18px; display: grid; gap: 10px; background: color-mix(in srgb, var(--teal) 6%, transparent); border: 1px solid color-mix(in srgb, var(--teal) 28%, transparent); }
.tryit .th { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font: 600 17px var(--read); }
.tryit .th > .label { color: var(--teal); font: 600 17px var(--read); }
.tryit .th b { font: 600 17px var(--read); color: var(--fg); }
.tryit .mins { margin-left: auto; font: italic 15px var(--read); color: var(--faint); }
.tryit ol { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-size: 18px; line-height: 1.42; }
.tryit ol li::marker { color: var(--teal); font-weight: 600; }
.tryit > .label { font-weight: 400; color: var(--faint); }
.expect { border-top: 1px dashed color-mix(in srgb, var(--teal) 35%, transparent); padding-top: 8px; }
.expect .prose { font-size: 17px; }
details.reveal > summary { cursor: pointer; font: 600 15.5px var(--read); color: var(--teal); list-style: none; }
details.reveal > summary::-webkit-details-marker { display: none; }
details.reveal > summary::before { content: "+ "; }
details.reveal[open] > summary::before { content: "\2212  "; }

/* figures sit on a black stage with the Manim palette, in both themes */
figure.fig { margin: 0; display: grid; gap: 0; }
.fig .svg { overflow-x: auto; border: 1px solid #1d2026; border-radius: 14px; padding: 18px; background: #000; }
.fig svg { display: block; width: 100%; min-width: 480px; max-width: 700px; height: auto; margin: 0 auto; font-family: var(--fig); }
.fig figcaption { font: italic 16px/1.45 var(--read); color: var(--mute); margin-top: 10px; }
.fig figcaption b { font-style: normal; font-weight: 600; color: var(--fg); margin-right: 6px; }
svg .box { fill: transparent; stroke: #ffffff; stroke-opacity: 0.85; stroke-width: 1.6; }
svg .box-a { fill: rgba(88, 196, 221, 0.14); stroke: #58c4dd; stroke-width: 1.8; }
svg .box-b { fill: rgba(247, 217, 111, 0.13); stroke: #f7d96f; stroke-width: 1.8; }
svg .box-ok { fill: rgba(131, 193, 103, 0.14); stroke: #83c167; stroke-width: 1.8; }
svg .box-bad { fill: rgba(252, 98, 85, 0.14); stroke: #fc6255; stroke-width: 1.8; }
svg .box-dim { fill: rgba(252, 98, 85, 0.06); stroke: #fc6255; stroke-width: 1.2; stroke-dasharray: 5 5; }
.fig svg text { fill: #ffffff; font-family: var(--fig); font-size: 14px; }
.fig svg .t { fill: #ffffff; }
.fig svg .t-s { font-size: 12.5px; }
.fig svg .t-m { fill: #b8b8b8; font-style: italic; }
.fig svg .t-a { fill: #58c4dd; }
.fig svg .t-b { fill: #f7d96f; }
.fig svg .t-ok { fill: #83c167; }
.fig svg .t-bad { fill: #fc6255; }
.fig svg .t-code { font-family: var(--mono); font-size: 13.5px; }
.fig svg .t-s.t-code { font-size: 12px; }
svg .ln, svg .ln-d, svg .ln-a, svg .ln-bad { fill: none; stroke: #ffffff; stroke-opacity: 0.8; stroke-width: 1.6; stroke-linecap: round; }
svg .ln-d { stroke: #888888; stroke-opacity: 1; stroke-width: 1.4; stroke-dasharray: 5 5; }
svg .ln-a { stroke: #58c4dd; stroke-opacity: 1; }
svg .ln-bad { stroke: #fc6255; stroke-opacity: 1; }
svg .arrowhead { fill: #ffffff; fill-opacity: 0.85; }

/* interleaving simulator */
.sim { border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; background: var(--panel); }
.sim .simh { padding: 14px 18px; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
.sim .simh b { font: 400 24px/1.2 var(--display); }
.sim .state { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 12px 18px; border-bottom: 1px solid var(--rule); font: 15px var(--mono); background: var(--well); }
.sim .state span b { color: var(--ember); font-weight: 400; }
.sim .threads { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.sim .th { padding: 12px 14px; border-right: 1px solid var(--rule); display: grid; gap: 8px; align-content: start; min-width: 0; }
.sim .th:last-child { border-right: 0; }
.sim .th .tname { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 600 15px var(--body); }
.sim ol { list-style: none; margin: 0; padding: 0; font: 14px/1.5 var(--mono); }
.sim ol li { padding: 3px 8px; border-radius: 6px; color: var(--faint); white-space: pre-wrap; overflow-wrap: anywhere; }
.sim ol li.ran { color: var(--mute); }
.sim ol li.next { background: var(--soft); color: var(--fg); box-shadow: inset 2px 0 0 var(--ember); }
.sim .regs { font: 13px var(--mono); color: var(--mute); min-height: 1.4em; }
.sim .msg { padding: 12px 18px; border-top: 1px solid var(--rule); font-size: 17px; min-height: 48px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.sim .msg.win { background: color-mix(in srgb, var(--amber) 9%, transparent); }
.sim .msg.dead { background: color-mix(in srgb, var(--rose) 9%, transparent); }
.sim .log { padding: 0 18px 12px; font: 12.5px/1.6 var(--mono); color: var(--faint); }
.sim .label { color: var(--faint); }

/* worked example */
.worked { list-style: none; margin: 0; padding: 0; display: grid; }
.worked li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; }
.worked .wn { display: flex; flex-direction: column; align-items: center; }
.worked .wn span { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--ember); color: var(--ember); display: grid; place-items: center; font: 500 13px var(--body); }
.worked .wn i { flex: 1; width: 1px; background: var(--rule); margin: 4px 0; }
.worked .wb { padding-bottom: 22px; display: grid; gap: 10px; min-width: 0; }

/* lab */
.lab { border: 1px solid var(--rule); border-top: 2px solid var(--ember); border-radius: 16px; padding: 20px 22px; display: grid; gap: 14px; background: var(--panel); }
.lab h3 { font-size: 30px; }
.lab .files { display: grid; gap: 4px; font: 13.5px/1.5 var(--mono); color: var(--mute); }
.lab .files span { overflow-wrap: anywhere; }
.lab ol { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; }
.lab ol li::marker { color: var(--ember); font-weight: 600; }
.hint { border-left: 2px solid var(--amber); padding: 2px 0 2px 12px; font-size: 18px; }
.hint .label { color: var(--amber); margin-right: 8px; }

/* quiz */
.quiz { display: grid; gap: 18px; }
.qcard { border: 1px solid var(--rule); border-radius: 16px; padding: 18px 20px; display: grid; gap: 12px; background: var(--panel); }
.qcard .qn { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.qcard .q { font-size: 19px; font-weight: 600; }
.qcard .q pre { font-weight: 400; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: baseline; text-align: left; border: 1px solid var(--rule); background: transparent; border-radius: 10px; padding: 11px 12px; cursor: pointer; font: 17.5px/1.45 var(--read); color: var(--fg); }
.opt:hover:not([disabled]) { border-color: var(--mute); }
.opt[disabled] { cursor: default; }
.opt .key { font: 500 13px var(--mono); color: var(--mute); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, transparent); }
.opt.right .key { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, transparent); }
.opt.wrong .key { color: var(--bad); }
.why { font-size: 17px; color: var(--mute); border-top: 1px dashed var(--rule); padding-top: 10px; }
.why b { color: var(--fg); }
.tag { font: 600 12px var(--body); border-radius: 999px; padding: 3px 10px; color: var(--mute); background: var(--tint); border: 0; }
.tag.from { background: var(--soft); color: var(--ember); }
.score { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; border: 1px solid var(--rule); border-radius: 16px; padding: 16px 20px; background: var(--panel); }
.score b { font: 400 32px var(--display); }

.recap { border: 1px solid var(--rule); border-radius: 16px; padding: 18px 22px; background: var(--panel); }
.recap ul { margin: 8px 0 0; padding-left: 1.3em; display: grid; gap: 6px; }
.terms { display: grid; gap: 0 32px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); margin: 0; }
.terms div { border-top: 1px solid var(--rule); padding: 10px 0; }
.terms dt { font-weight: 600; }
.terms dd { margin: 2px 0 0; color: var(--mute); font-size: 17px; line-height: 1.45; }
.cards-preview { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.cards-preview div { border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; font-size: 16px; line-height: 1.4; color: var(--mute); background: var(--panel); }
.refs { display: grid; gap: 6px; font: 16px/1.45 var(--body); border-top: 1px dashed var(--rule); padding-top: 10px; }
.refs a { color: var(--fg); text-decoration-color: var(--rule); overflow-wrap: anywhere; }
.refs a:hover { text-decoration-color: var(--ember); }
.refs .kind { font: 600 11.5px var(--body); padding: 2px 8px; border-radius: 6px; background: var(--soft); color: var(--ember); margin-right: 8px; text-transform: capitalize; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; border-top: 1px solid var(--rule); padding-top: 22px; margin-top: 64px; }
.pager button { background: none; border: 0; cursor: pointer; text-align: left; padding: 0; display: grid; gap: 4px; color: var(--fg); }
.pager button.nx { text-align: right; justify-items: end; }
.pager b { font: 400 23px/1.2 var(--display); }
.pending { max-width: 60ch; }

/* ---------- review ---------- */
.rv { max-width: 760px; display: grid; gap: 18px; }
.rv h1 { font-size: 50px; }
.flash { border: 1px solid var(--rule); border-radius: 16px; background: var(--panel); padding: 26px 26px 22px; display: grid; gap: 16px; min-height: 260px; align-content: start; }
.flash .front { font: 400 29px/1.25 var(--display); }
.flash .front code { font-size: .7em; }
.flash .back { border-top: 1px dashed var(--rule); padding-top: 16px; font-size: 19px; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grades button { display: grid; gap: 2px; justify-items: center; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--rule); background: var(--panel); cursor: pointer; font: 600 15px var(--body); color: var(--fg); }
.grades button small { font: 500 12px var(--body); color: var(--faint); }
.grades button:hover { border-color: var(--mute); }
.grades .g1 { border-color: color-mix(in srgb, var(--bad) 50%, var(--rule)); }
.grades .g3 { border-color: color-mix(in srgb, var(--ember) 60%, var(--rule)); }
.meter { height: 6px; background: var(--tint); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ember); }

/* ---------- plan ---------- */
.weeks { display: grid; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.wk { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; border: 1px solid transparent; }
.wk.cur { border-color: color-mix(in srgb, var(--ember) 45%, var(--rule)); background: var(--soft); }
.wk .label { width: 62px; flex: none; }
.wkcells { display: flex; gap: 7px; align-items: center; }
.wkcells .cell { cursor: pointer; padding: 0; }
.wkcells .cell:hover { outline: 2px solid var(--rule); outline-offset: 2px; }
.plan-list { display: grid; }
.plan-list .pr { display: grid; grid-template-columns: 96px 14px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--rule); font-size: 17px; }
.plan-list .pr .d { font: 500 13px var(--body); color: var(--faint); }
.plan-list .pr button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--fg); font: inherit; }
.plan-list .pr button .label { font-weight: 400; }
.plan-list .ptrack { padding: 22px 4px 6px; font: 400 24px var(--display); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 14px; }

/* ---------- focus timer ---------- */
.timer { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 55; width: min(320px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12); font-family: var(--body); }
.timer .tt { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.timer .big { font: 400 36px/1 var(--display); font-variant-numeric: tabular-nums; }
.phases { display: grid; gap: 3px; }
.phases div { display: grid; gap: 4px; }
.phases i { height: 6px; border-radius: 99px; background: var(--tint); overflow: hidden; display: block; }
.phases i b { display: block; height: 100%; background: var(--faint); }
.phases div.cur i b { background: var(--ember); }
.phases span { font: 600 11.5px var(--body); color: var(--faint); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); background: var(--panel); color: var(--fg); border: 1px solid var(--rule); padding: 10px 16px; border-radius: 12px; font: 15px var(--body); z-index: 90; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12); max-width: calc(100vw - 32px); }
.empty { border: 1px dashed var(--rule); border-radius: 16px; padding: 24px; color: var(--mute); }
.sheet { margin-bottom: 48px; }
.sheet h2 { font-size: 34px; margin-bottom: 12px; }

/* grids that hold code never grow past their column */
.lsec, .block, .tryit, .lab, .quiz, .qcard, .rv, .flash, .step, .lhead, .cmp, .call, .tcard, .score > div { grid-template-columns: minmax(0, 1fr); min-width: 0; }
.tryit .label, .crumb .label { overflow-wrap: anywhere; }
</style>

<script type="application/json" id="course">{"title":"JVM Workbench","tagline":"Concurrency, generics and design patterns in Java and Kotlin, one focused session a day.","repo":"https://github.com/arunav-bhattacharya/jvm-workbench","tracks":[{"id":"conc","lab":"concurrency","title":"Threads and the bugs they cause","short":"Threads, races, locks, deadlock, atomics, concurrent collections and synchronizers.","lessons":["conc-01","conc-02","conc-03","conc-04","conc-05","conc-06","conc-07","conc-08","conc-09","conc-10","conc-11","conc-12","conc-13"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"jmm","lab":"jmm","title":"The Java Memory Model","short":"Visibility, reordering, happens-before, volatile, safe publication and VarHandles.","lessons":["jmm-01","jmm-02","jmm-03","jmm-04","jmm-05","jmm-06"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"exec","lab":"executors","title":"Thread pools and executors","short":"ExecutorService, ThreadPoolExecutor internals, sizing, futures, CompletableFuture and ForkJoin.","lessons":["exec-01","exec-02","exec-03","exec-04","exec-05","exec-06","exec-07","exec-08","exec-09"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"vt","lab":"vthreads","title":"Virtual threads","short":"Project Loom from the inside: carriers, pinning, structured concurrency and scoped values.","lessons":["vt-01","vt-02","vt-03","vt-04","vt-05","vt-06"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"gen","lab":"generics","title":"Kotlin generics, properly","short":"Variance from first principles: out, in, projections, star projection, reified, KClass, and Java side by side.","lessons":["gen-01","gen-02","gen-03","gen-04","gen-05","gen-06","gen-07","gen-08","gen-09","gen-10","gen-11"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"rx","lab":"reactive","title":"Reactive programming","short":"Reactive Streams, Project Reactor, operators, schedulers, backpressure and testing.","lessons":["rx-01","rx-02","rx-03","rx-04","rx-05","rx-06","rx-07","rx-08"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"co","lab":"coroutines","title":"Kotlin coroutines","short":"Suspend functions, structured concurrency, dispatchers, cancellation, Flow and channels.","lessons":["co-01","co-02","co-03","co-04","co-05","co-06","co-07","co-08","co-09","co-10","co-11"],"intro":"","cheatsheet":"","recap":[],"quiz":[]},{"id":"pat","lab":"patterns","title":"Design patterns in Java and Kotlin","short":"Creational, structural and behavioral patterns, what Kotlin makes unnecessary, and concurrency patterns.","lessons":["pat-01","pat-02","pat-03","pat-04","pat-05","pat-06","pat-07","pat-08","pat-09","pat-10","pat-11"],"intro":"","cheatsheet":"","recap":[],"quiz":[]}],"lessons":{"conc-01":{"id":"conc-01","track":"conc","n":1,"title":"Threads from zero","ready":true,"minutes":35,"goal":"By the end you can say what a thread is and what it costs, start threads with <code>start()<\/code> and wait for them with <code>join()<\/code>, and split a job across several workers.","quiz":[{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"n\">Thread<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Thread<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"n\">Thread<\/span><span class=\"p\">.<\/span><span class=\"na\">currentThread<\/span><span class=\"p\">().<\/span><span class=\"na\">getName<\/span><span class=\"p\">()),<\/span><span class=\"w\"> <\/span><span class=\"s\">\"audit\"<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">t<\/span><span class=\"p\">.<\/span><span class=\"na\">run<\/span><span class=\"p\">();<\/span>\n<\/code><\/pre>","options":["audit","main","Thread-0","Nothing, because the thread was never started"],"answer":1,"why":"<code>run()<\/code> is an ordinary method call, so the lambda runs on the calling thread, which is <code>main<\/code>. No new thread exists. It would print <code>audit<\/code> only with <code>t.start()<\/code>. It does print something, because <code>run()<\/code> executes the code, just on the wrong thread.","from":null},{"q":"A batch job scores transactions with a fraud model. It is pure CPU work, with no I/O. The pod has 4 cores. Which thread count gives about the best throughput?","options":["1","4","64","400"],"answer":1,"why":"With pure CPU work, each core can run one thread at a time. Four threads keep all four cores busy. More threads only take turns on the same cores and add context-switch overhead. Large counts like 400 make sense only when most threads spend their time waiting.","from":null},{"q":"A worker thread throws a <code>NullPointerException<\/code> out of its <code>run()<\/code> method. What happens to <code>main<\/code>, which started it?","options":["<code>main<\/code> gets the NullPointerException at its next line","The JVM shuts down","<code>main<\/code> carries on. The worker ends and its stack trace is printed to standard error","<code>main<\/code> gets it when it calls <code>join()<\/code>"],"answer":2,"why":"An uncaught exception ends only the thread that threw it. The default handler prints the stack trace, and nobody else is told. <code>join()<\/code> simply returns once the worker has ended. Carrying exceptions back to the caller is a job for <code>Future<\/code>, in the executors track.","from":null},{"q":"<p>What is wrong with this loop?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">Runnable<\/span><span class=\"w\"> <\/span><span class=\"n\">job<\/span><span class=\"w\"> <\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">jobs<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">Thread<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Thread<\/span><span class=\"p\">(<\/span><span class=\"n\">job<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">t<\/span><span class=\"p\">.<\/span><span class=\"na\">start<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">t<\/span><span class=\"p\">.<\/span><span class=\"na\">join<\/span><span class=\"p\">();<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>","options":["Nothing. It runs the jobs in parallel","It runs the jobs one at a time, because each join waits before the next thread starts","It deadlocks on the second job","<code>join()<\/code> must be called before <code>start()<\/code>"],"answer":1,"why":"Each <code>join()<\/code> blocks until that thread ends, so the next thread starts only after the previous one is done. You pay for threads and get sequential execution. Start all threads in one loop, then join them in a second loop.","from":null},{"q":"A Kafka consumer service handles 12 partitions with 12 threads on a 2-core pod. Each record waits about 50 ms on Oracle. Which statement is true?","options":["It is concurrent: 12 records are in progress, at most 2 threads run at any instant, and most are waiting anyway","It is parallel: all 12 threads run at the same instant","It cannot work, because threads must not outnumber cores","It is neither concurrent nor parallel"],"answer":0,"why":"Twelve tasks in progress at once is concurrency. With 2 cores, at most 2 threads run at the same instant, which is the parallel part. Because each thread spends most of its time waiting on the database, 12 threads on 2 cores is a sensible setup. The rule of one thread per core is for CPU-bound work.","from":null}],"cards":[{"front":"What do threads in one process share, and what does each thread have of its own?","back":"<p>They share the heap: objects and static fields. Each thread has its own stack: local variables, parameters and the calls in progress.<\/p>"},{"front":"What happens if you call <code>t.run()<\/code> instead of <code>t.start()<\/code>?","back":"<p>The code runs on the current thread, like any method call. No new thread is created, and nothing warns you.<\/p>"},{"front":"Concurrency vs parallelism, in one line each.","back":"<p>Concurrency: several tasks in progress at the same time (works on one core). Parallelism: several tasks running at the same instant on different cores.<\/p>"},{"front":"When does the JVM exit?","back":"<p>When the last non-daemon thread ends, or when something calls <code>System.exit<\/code>. Returning from <code>main<\/code> ends only the main thread.<\/p>"},{"front":"How much stack does the JVM reserve for a platform thread on 64-bit Linux by default?","back":"<p>1 MB (<code>ThreadStackSize = 1024<\/code> KB). It is reserved address space, committed as the stack grows. Change it with <code>-Xss<\/code>.<\/p>"},{"front":"What happens when you call <code>start()<\/code> twice on the same Thread?","back":"<p>The second call throws <code>IllegalThreadStateException<\/code>. A thread runs at most once.<\/p>"},{"front":"A worker thread throws an uncaught exception. Who finds out?","back":"<p>Only that thread dies. The default handler prints the stack trace to standard error. The starting thread is not told.<\/p>"}],"terms":[{"term":"Process","plain":"A running program with its own memory, such as one JVM."},{"term":"Thread","plain":"One path of execution inside a process, with its own stack, sharing the process heap."},{"term":"Heap","plain":"The memory where objects and static fields live. Every thread can reach it."},{"term":"Core","plain":"A piece of the CPU that runs one thread at a time."},{"term":"Context switch","plain":"The OS pausing one thread and resuming another on the same core."},{"term":"Concurrency","plain":"Several tasks in progress at once, taking turns or not."},{"term":"Parallelism","plain":"Several tasks running at the same instant on different cores."},{"term":"Platform thread","plain":"A Java thread backed one-to-one by an operating system thread."}],"remote":true},"conc-02":{"id":"conc-02","track":"conc","n":2,"title":"A thread's life: start, join, sleep, interrupt","ready":true,"minutes":35,"goal":"By the end you can read a thread's state, wait for a thread with <code>join()<\/code> instead of <code>sleep()<\/code>, and write a worker that stops cleanly when interrupted without losing the interrupt.","quiz":[{"q":"A thread is stuck inside <code>ReentrantLock.lock()<\/code>, waiting for another thread to release it. What does <code>getState()<\/code> return?","options":["BLOCKED","WAITING","RUNNABLE","TIMED_WAITING"],"answer":1,"why":"<code>ReentrantLock<\/code> makes waiting threads park with <code>LockSupport.park()<\/code>, and a parked thread is WAITING. BLOCKED is reserved for threads trying to enter a <code>synchronized<\/code> block or method. That difference matters when you scan a thread dump for contention.","from":null},{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"n\">Thread<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Thread<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">Thread<\/span><span class=\"p\">.<\/span><span class=\"na\">sleep<\/span><span class=\"p\">(<\/span><span class=\"mi\">5_000<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">catch<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">InterruptedException<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"n\">Thread<\/span><span class=\"p\">.<\/span><span class=\"na\">currentThread<\/span><span class=\"p\">().<\/span><span class=\"na\">isInterrupted<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">});<\/span>\n<span class=\"n\">t<\/span><span class=\"p\">.<\/span><span class=\"na\">start<\/span><span class=\"p\">();<\/span>\n<span class=\"n\">t<\/span><span class=\"p\">.<\/span><span class=\"na\">interrupt<\/span><span class=\"p\">();<\/span>\n<\/code><\/pre>","options":["true","Nothing: the thread sleeps for 5 s and ends","false","It depends on whether interrupt() runs before sleep() starts"],"answer":2,"why":"If the interrupt arrives during the sleep, <code>sleep<\/code> throws and clears the flag. If it arrives before the sleep starts, <code>sleep<\/code> sees the flag, clears it and throws at once. Either way the catch block sees <code>false<\/code>. Timing changes when the exception comes, not what the flag says.","from":null},{"q":"A Kafka consumer loop wraps its back-off in <code>try { Thread.sleep(500); } catch (InterruptedException e) { log.warn(\"interrupted\"); }<\/code> and keeps looping. What goes wrong at shutdown?","options":["Nothing, because the exception was logged","The consumer stops, but its last batch is processed twice","The JVM throws IllegalMonitorStateException","<code>shutdownNow()<\/code> interrupts it, the catch clears the request, and the loop keeps running until the process is killed"],"answer":3,"why":"<code>shutdownNow()<\/code> stops tasks by interrupting them. The <code>InterruptedException<\/code> cleared the flag, and the catch block didn't restore it, so the loop never learns it should stop. Logging doesn't count as handling. Restore the flag and leave the loop.","from":null},{"q":"A daemon thread writes audit lines to a file and closes the file in a <code>finally<\/code> block. The last non-daemon thread ends. What happens to the daemon thread?","options":["The JVM waits for it to finish the current line","The JVM exits, the daemon stops where it is, and its finally block does not run","The JVM interrupts it and waits for the finally block","It becomes a non-daemon thread and keeps the JVM alive"],"answer":1,"why":"The JVM does not wait for daemon threads and does not unwind their stacks when it exits, so <code>finally<\/code> blocks don't run. Audit output can be lost or truncated. Work that must complete belongs on a non-daemon thread that you stop with an interrupt and join.","from":null},{"q":"From Threads from zero: a loop starts each thread and joins it in the same iteration, <code>t.start(); t.join();<\/code>, for four threads. While the loop runs, how many of those four threads are alive at the same time?","options":["At most one","All four","Two: the current one and the next","None, because join() stops them"],"answer":0,"why":"Each <code>join()<\/code> blocks the loop until that thread is TERMINATED, and only then does the next iteration start a new thread. So at most one of the four is ever alive. The fix is to start all four first and join them in a second loop.","from":"conc-01"}],"cards":[{"front":"A thread waits to enter a <code>synchronized<\/code> block another thread holds. What state is it in?","back":"<p>BLOCKED.<\/p>"},{"front":"A thread waits in <code>ReentrantLock.lock()<\/code>. What state is it in?","back":"<p>WAITING (or TIMED_WAITING for a timed tryLock). Explicit locks park the thread; BLOCKED is only for monitors.<\/p>"},{"front":"Besides waiting, what does <code>t.join()<\/code> guarantee?","back":"<p>Everything <code>t<\/code> wrote before it ended is visible to the thread whose <code>join()<\/code> returned. <code>sleep()<\/code> gives no such guarantee.<\/p>"},{"front":"What happens to the interrupt flag when <code>sleep()<\/code> throws <code>InterruptedException<\/code>?","back":"<p>It is cleared before the exception is thrown. Inside the catch block, <code>isInterrupted()<\/code> returns false.<\/p>"},{"front":"What are the two correct ways to handle a caught <code>InterruptedException<\/code>?","back":"<p>Rethrow it (declare <code>throws InterruptedException<\/code>), or restore the flag with <code>Thread.currentThread().interrupt()<\/code> and stop what you're doing.<\/p>"},{"front":"<code>isInterrupted()<\/code> vs <code>Thread.interrupted()<\/code>?","back":"<p><code>isInterrupted()<\/code> only reads the flag. The static <code>Thread.interrupted()<\/code> reads it and clears it.<\/p>"},{"front":"What is the status of <code>Thread.stop()<\/code> on JDK 26?","back":"<p>Removed. It always threw <code>UnsupportedOperationException<\/code> from JDK 20, and old binaries that call it get <code>NoSuchMethodError<\/code> on 26+.<\/p>"}],"terms":[{"term":"Thread state","plain":"What a thread is doing right now, one of the six values of <code>Thread.State<\/code>."},{"term":"join","plain":"Wait for a thread to end. Afterwards you see everything it wrote."},{"term":"Interrupt flag","plain":"A per-thread boolean that <code>interrupt()<\/code> sets to ask the thread to stop."},{"term":"InterruptedException","plain":"Thrown by blocking calls when the thread is interrupted. The flag is cleared when it is thrown."},{"term":"Daemon thread","plain":"A thread the JVM does not wait for at exit. It can stop mid-work."},{"term":"Cooperative cancellation","plain":"Stopping a thread by asking it, and letting it check and clean up itself."}],"remote":true},"conc-03":{"id":"conc-03","track":"conc","n":3,"title":"Race conditions: why count++ lies","ready":true,"minutes":35,"goal":"By the end you can spot the two shapes of race condition (read-modify-write and check-then-act) in real code, and fix each with one atomic step.","quiz":[{"q":"Two request threads run <code>account.balance = account.balance - amount;<\/code> on the same account at the same time. What can go wrong?","options":["Nothing, because one Java statement runs atomically","One of the two debits can be lost, because both read the same starting balance","The JVM throws an IllegalStateException","The balance always goes negative"],"answer":1,"why":"It's read-modify-write. If both threads read 100 and debit 10, both write 90. One debit vanished. Java statements are not atomic just because they fit on one line.","from":null},{"q":"<code>counts<\/code> is a <code>ConcurrentHashMap&lt;String, Integer&gt;<\/code>. Many threads run <code>counts.put(k, counts.getOrDefault(k, 0) + 1)<\/code>. What is the smallest correct fix?","options":["Make the map field <code>volatile<\/code>","Wrap the map with <code>Collections.synchronizedMap<\/code>","Use <code>counts.merge(k, 1, Integer::sum)<\/code>","Switch to a <code>HashMap<\/code>"],"answer":2,"why":"<code>merge<\/code> reads, computes and writes in one atomic operation on that key. <code>volatile<\/code> on the field only affects the reference to the map, and a synchronized wrapper still makes each call atomic on its own, leaving the gap between <code>get<\/code> and <code>put<\/code>.","from":null},{"q":"A test runs 2 threads that each call <code>hit()<\/code> 1,000 times, and checks the total is 2,000. It passed 100 runs in a row. What does that tell you?","options":["The counter is thread-safe","Very little: the threads probably never overlapped","The JIT fixed the race","The test should use 1 thread instead"],"answer":1,"why":"A thread can finish 1,000 increments before the second thread starts. With no overlap, a racy counter gives the right answer. Use more threads, more iterations and a start latch so they run at the same time.","from":null},{"q":"A cache does <code>if (cache.get(id) == null) cache.put(id, loadFromDb(id));<\/code> on a <code>ConcurrentHashMap<\/code>. Two threads ask for the same missing <code>id<\/code> together. What happens?","options":["Both may call <code>loadFromDb<\/code>, and the second <code>put<\/code> replaces the first value","The second thread blocks until the first one finishes","The map throws ConcurrentModificationException","Only one thread can call <code>get<\/code> at a time, so it is safe"],"answer":0,"why":"It's check-then-act. Both see <code>null<\/code>, both load, both put. You pay for two database calls and callers may hold different objects. <code>computeIfAbsent(id, this::loadFromDb)<\/code> runs the loader at most once per key.","from":null},{"q":"From the last lesson: <code>main<\/code> starts thread <code>t<\/code>, which sets <code>result = 42<\/code>. When can <code>main<\/code> safely read <code>result<\/code>?","options":["Right after <code>t.start()<\/code> returns","After <code>t.join()<\/code> returns","After <code>Thread.sleep(100)<\/code>","Any time, because <code>int<\/code> writes are atomic"],"answer":1,"why":"<code>join<\/code> waits for <code>t<\/code> to finish, and everything <code>t<\/code> wrote before it ended is visible to the thread whose <code>join<\/code> returned. <code>sleep<\/code> only makes it likely, not guaranteed. An atomic write still says nothing about when another thread sees it.","from":"conc-02"}],"cards":[{"front":"What is a race condition?","back":"<p>A bug where the result depends on the timing or interleaving of threads. It usually gives wrong results silently, not an exception.<\/p>"},{"front":"Why is <code>count++<\/code> not atomic?","back":"<p>It runs as three steps: read <code>count<\/code>, add one, write it back. Another thread can run between them, so two increments can produce one.<\/p>"},{"front":"Name the two shapes of race condition.","back":"<p>Read-modify-write (<code>count++<\/code>, <code>balance -= x<\/code>) and check-then-act (<code>if (!map.containsKey(k)) map.put(k, v)<\/code>).<\/p>"},{"front":"Is <code>if (!chm.containsKey(k)) chm.put(k, v)<\/code> safe on a ConcurrentHashMap?","back":"<p>No. Each call is atomic, but another thread can put between them. Use <code>chm.putIfAbsent(k, v)<\/code>.<\/p>"},{"front":"Atomic fix for <code>map.put(k, map.get(k) + 1)<\/code> on a ConcurrentHashMap?","back":"<p><code>map.merge(k, 1, Integer::sum)<\/code><\/p>"},{"front":"Why does a 2-thread x 1,000-iteration race test usually pass on broken code?","back":"<p>The first thread often finishes before the second starts, so they never overlap. Use a start latch and many iterations.<\/p>"}],"terms":[{"term":"Race condition","plain":"A bug where the result depends on which thread runs when."},{"term":"Lost update","plain":"Two threads read the same old value and both write, so one change disappears."},{"term":"Read-modify-write","plain":"Read a value, compute a new one from it, write it back. Unsafe on shared data unless done atomically."},{"term":"Check-then-act","plain":"Test a condition, then act on it, assuming it still holds. Unsafe if another thread can act in between."},{"term":"Atomic","plain":"Happens as one indivisible step. Other threads see it either not started or fully done."},{"term":"Critical section","plain":"A piece of code that only one thread at a time may run, because it touches shared state."}],"remote":true},"conc-04":{"id":"conc-04","track":"conc","n":4,"title":"synchronized and intrinsic locks","ready":true,"minutes":35,"goal":"By the end you can protect shared state with <code>synchronized<\/code>, choose a safe lock object, and keep slow or foreign code out of your critical sections.","quiz":[{"q":"<p>Which line is the bug?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"kd\">class<\/span> <span class=\"nc\">FeeCounter<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">feesCents<\/span><span class=\"p\">;<\/span><span class=\"w\">                    <\/span><span class=\"c1\">// line 2<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">synchronized<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">add<\/span><span class=\"p\">(<\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">cents<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">        <\/span><span class=\"c1\">// line 3<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">feesCents<\/span><span class=\"w\"> <\/span><span class=\"o\">+=<\/span><span class=\"w\"> <\/span><span class=\"n\">cents<\/span><span class=\"p\">;<\/span><span class=\"w\">                           <\/span><span class=\"c1\">// line 4<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>\n<p>The service creates one <code>FeeCounter<\/code> per Kafka partition.<\/p>","options":["Line 2: static fields cannot be locked","Line 4: <code>+=<\/code> is not allowed inside synchronized","Line 3: it locks <code>this<\/code>, but the state is static, so different instances don't exclude each other","There is no bug, because the method is synchronized"],"answer":2,"why":"Each instance locks its own monitor, while all instances share <code>feesCents<\/code>. Two partitions' counters run <code>+=<\/code> at the same time and lose updates. Static state needs one static lock: <code>private static final Object LOCK<\/code>, or a <code>static synchronized<\/code> method.","from":null},{"q":"A thread inside <code>synchronized void withdraw()<\/code> calls <code>canCover()<\/code>, which is also <code>synchronized<\/code> on the same object. What happens?","options":["It enters at once, because the monitor is reentrant","It deadlocks waiting for itself","It throws IllegalMonitorStateException","It waits until withdraw() returns"],"answer":0,"why":"Java monitors are reentrant. The JVM sees that the current thread already owns the monitor and increments the hold count. Without reentrancy every synchronized method that calls another one on the same object would hang.","from":null},{"q":"Which of these is the safest object to lock on for a class's internal state?","options":["<code>\"ledger-lock\"<\/code>, a string literal","<code>Integer.valueOf(1)<\/code>","<code>this<\/code>, on a public class that callers also hold references to","<code>private final Object lock = new Object()<\/code>"],"answer":3,"why":"A private final object can't be locked by anyone else and can't change. String literals are interned and shared JVM-wide. Small <code>Integer<\/code> values are cached and shared, and javac warns about locking on them. <code>this<\/code> works, but any caller can lock it too and stall your methods.","from":null},{"q":"<code>publish()<\/code> is <code>synchronized<\/code> and calls each listener inside the lock. One listener makes a 2-second HTTP call. What do other threads notice?","options":["Nothing, since each listener runs on its own thread","Every thread that needs the same lock, even just to read a rate, waits up to 2 seconds","The HTTP call is cancelled because of the lock","The JVM detects the slow call and releases the lock"],"answer":1,"why":"Listeners run on the publishing thread, inside its critical section. Anyone who needs that monitor queues behind the HTTP call. Copy the listener list under the lock, release it, then notify.","from":null},{"q":"From Race conditions: why count++ lies: <code>setBalance()<\/code> is <code>synchronized<\/code>, but <code>getBalance()<\/code> is a plain getter with no lock. Is the class thread-safe?","options":["Yes: only writes need a lock","Yes, if the field is a <code>long<\/code>","No: a reader that skips the lock gets no visibility promise and can see a stale value","No, but only on 32-bit JVMs"],"answer":2,"why":"Visibility comes from unlocking and locking the same monitor. A reader that never takes the lock has no happens-before edge to the writer, so it may keep seeing an old balance. Guard reads with the same lock, or use a <code>volatile<\/code> field or an atomic for a single value.","from":"conc-03"}],"cards":[{"front":"What two guarantees does <code>synchronized<\/code> give?","back":"<p>Mutual exclusion (one thread at a time per monitor) and visibility (writes made before releasing a monitor are seen by the next thread that locks it).<\/p>"},{"front":"What does a <code>synchronized<\/code> instance method lock? A <code>static synchronized<\/code> method?","back":"<p>The instance, <code>this<\/code>. The static one locks the class object, for example <code>Ledger.class<\/code>.<\/p>"},{"front":"What does it mean that Java monitors are reentrant?","back":"<p>A thread that already holds a monitor can enter it again without waiting. The JVM counts the holds and frees the monitor when the count is back to zero.<\/p>"},{"front":"Why is <code>synchronized (count)<\/code> on an <code>Integer<\/code> field broken?","back":"<p><code>count++<\/code> replaces the field with a new <code>Integer<\/code>, so threads lock different objects. Small values are also cached and shared JVM-wide. javac warns <code>[synchronization]<\/code>.<\/p>"},{"front":"Why never lock on a string literal?","back":"<p>Literals are interned: every <code>\"lock\"<\/code> in the JVM is the same object, so unrelated code shares your lock.<\/p>"},{"front":"What does <code>synchronized (new Object()) { ... }<\/code> protect?","back":"<p>Nothing. Each call locks a fresh object no other thread can see, so there is no exclusion and no visibility.<\/p>"},{"front":"What should you do before calling listeners or callbacks from a locked method?","back":"<p>Update your state and copy what you need (for example <code>List.copyOf(listeners)<\/code>) under the lock, release it, then call them.<\/p>"}],"terms":[{"term":"Monitor (intrinsic lock)","plain":"The lock every Java object has, taken and released by <code>synchronized<\/code>."},{"term":"Mutual exclusion","plain":"Only one thread at a time can run the code guarded by a lock."},{"term":"Visibility","plain":"Whether one thread is guaranteed to see what another thread wrote."},{"term":"Reentrant","plain":"A thread can take a lock it already holds without waiting for itself."},{"term":"Critical section","plain":"The code that runs while a lock is held."},{"term":"Alien method","plain":"Code you don't control, such as a listener or callback, which can block or call back in."},{"term":"Value-based class","plain":"A class like <code>Integer<\/code> whose instances may be shared or cached, so its identity is not yours to lock on."}],"remote":true},"conc-05":{"id":"conc-05","track":"conc","n":5,"title":"wait, notify and guarded blocks","ready":true,"minutes":35,"goal":"By the end you can write a guarded block with <code>wait()<\/code> in a <code>while<\/code> loop, choose between <code>notify()<\/code> and <code>notifyAll()<\/code>, and build a bounded buffer from scratch.","quiz":[{"q":"<p>What happens when this runs on its own?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"n\">Object<\/span><span class=\"w\"> <\/span><span class=\"n\">lock<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Object<\/span><span class=\"p\">();<\/span>\n<span class=\"n\">lock<\/span><span class=\"p\">.<\/span><span class=\"na\">notifyAll<\/span><span class=\"p\">();<\/span>\n<\/code><\/pre>","options":["Nothing, since nobody is waiting","It wakes every thread in the JVM that is waiting on any lock","It throws IllegalMonitorStateException, because the thread doesn't hold lock's monitor","It blocks until some thread waits on lock"],"answer":2,"why":"<code>wait<\/code>, <code>notify<\/code> and <code>notifyAll<\/code> require the caller to own the object's monitor, so they must run inside <code>synchronized (lock)<\/code>. It doesn't matter that nobody is waiting. The check comes first.","from":null},{"q":"A thread wakes up from <code>lock.wait()<\/code> because another thread called <code>notifyAll()<\/code>. When does it run the line after <code>wait()<\/code>?","options":["Immediately, in parallel with the notifier","After it gets the monitor back, which is at the earliest when the notifier leaves its synchronized block","Only after every other woken thread has finished","Never: it has to call wait() again"],"answer":1,"why":"<code>notifyAll()<\/code> doesn't release the lock. The woken threads move back to competing for the monitor, and <code>wait()<\/code> returns only once this thread owns it again. Other woken threads may get it first and change the state, which is why the condition must be re-checked.","from":null},{"q":"A one-slot buffer has 2 producers and 2 consumers, and both <code>put<\/code> and <code>take<\/code> call <code>notify()<\/code>. Each <code>wait()<\/code> is correctly inside a <code>while<\/code>. What can happen?","options":["Nothing bad, because the while loops make it safe","Two consumers take the same item","IllegalMonitorStateException","All four threads end up waiting with nobody left to notify them"],"answer":3,"why":"The <code>while<\/code> loops protect against acting on a false condition, not against lost signals. If a consumer's <code>notify()<\/code> wakes the other consumer instead of a producer, that wake-up is wasted, and soon every thread waits. <code>notifyAll()<\/code>, or one <code>Condition<\/code> per kind of waiter, fixes it.","from":null},{"q":"A worker calls <code>lock.wait()<\/code> with no condition, \"until the report is done\". The reporting thread calls <code>lock.notifyAll()<\/code> when it finishes. Sometimes the worker waits forever. Why?","options":["notifyAll() only wakes threads that started waiting before it was called, so an early report is a lost wake-up","wait() without a timeout is not allowed","notifyAll() needs a second call to wake a thread","The worker must call notify() itself"],"answer":0,"why":"A notification wakes only threads that are already waiting. If the report finishes first, the signal goes nowhere, and the worker then waits for a signal that already happened. Wait for a state: <code>while (!done) lock.wait();<\/code>, with <code>done = true<\/code> set before <code>notifyAll()<\/code>.","from":null},{"q":"From A thread's life: a consumer is parked inside <code>lock.wait()<\/code> and another thread interrupts it. Which is true?","options":["wait() returns normally and the interrupt flag stays set","wait() throws InterruptedException at once, without retaking the monitor","Nothing happens until someone calls notify()","wait() retakes the monitor, then throws InterruptedException with the interrupt flag cleared"],"answer":3,"why":"Like <code>sleep<\/code>, <code>wait<\/code> reacts to an interrupt by throwing <code>InterruptedException<\/code> and clearing the flag. It retakes the monitor first, so your catch or finally block still runs inside the synchronized block. Restore the flag or let the exception propagate.","from":"conc-02"}],"cards":[{"front":"What three things does <code>lock.wait()<\/code> do?","back":"<p>It releases lock's monitor, parks the thread in the wait set (WAITING), and retakes the monitor before it returns.<\/p>"},{"front":"Why must <code>wait()<\/code> always sit inside <code>while (!condition)<\/code>?","back":"<p>Spurious wakeups are allowed, and another thread may change the state between the notify and the moment you get the lock back.<\/p>"},{"front":"What happens if you call <code>wait()<\/code> or <code>notify()<\/code> without holding that object's monitor?","back":"<p><code>IllegalMonitorStateException<\/code>, at once.<\/p>"},{"front":"Does <code>notifyAll()<\/code> release the lock?","back":"<p>No. The woken threads compete for the monitor after the notifier leaves its synchronized block.<\/p>"},{"front":"When is <code>notify()<\/code> safe to use instead of <code>notifyAll()<\/code>?","back":"<p>Only when every waiter waits for the same condition and each change lets at most one waiter proceed.<\/p>"},{"front":"What is a lost wake-up?","back":"<p>A notify that happens before anyone waits. If the waiter has no condition to check, it then waits forever. Fix: wait for a state field, set before notifying.<\/p>"}],"terms":[{"term":"Guarded block","plain":"Code that waits, under a lock, until a condition holds: <code>while (!cond) lock.wait();<\/code>."},{"term":"Wait set","plain":"The threads parked in <code>wait()<\/code> on one monitor, waiting to be notified."},{"term":"Spurious wakeup","plain":"A return from <code>wait()<\/code> with no notify, interrupt or timeout. Allowed by the spec."},{"term":"notifyAll","plain":"Wake every thread in the monitor's wait set. They then compete for the lock."},{"term":"Lost wake-up","plain":"A signal sent before anyone waits for it, so the waiter never hears it."},{"term":"Backpressure","plain":"Making a fast producer wait when the consumer can't keep up, instead of buffering without limit."}],"remote":true},"conc-06":{"id":"conc-06","track":"conc","n":6,"title":"Deadlock, livelock and starvation","ready":true,"minutes":38,"goal":"By the end you can explain the four conditions for deadlock, remove one with lock ordering or timed <code>tryLock<\/code>, tell deadlock from livelock and starvation, and find a deadlock in a thread dump.","quiz":[{"q":"Which change makes <code>transfer(from, to)<\/code> safe from deadlock when transfers run in both directions?","options":["Mark the field that holds each balance <code>volatile<\/code>","Always lock the account with the lower id first, then the other","Add <code>Thread.sleep(1)<\/code> between the two locks","Make <code>transfer<\/code> a <code>synchronized<\/code> instance method on each account"],"answer":1,"why":"One global order means no thread can hold the second lock while waiting for the first, so circular wait can't happen. <code>volatile<\/code> doesn't affect locking. A sleep just changes the odds. A <code>synchronized<\/code> method on the source account is still \"lock <code>from<\/code>, then <code>to<\/code>\", the same broken order.","from":null},{"q":"Two threads use <code>tryLock<\/code> with a fixed 5 ms sleep between attempts. A thread dump shows both RUNNABLE or TIMED_WAITING, their stacks change between dumps, and no deadlock is reported. Nothing has completed in a minute. What is this?","options":["A deadlock that the JVM failed to detect","Starvation of one thread","Livelock: they keep retrying in lockstep and both keep failing","A GC pause"],"answer":2,"why":"The threads are active, they release and retake locks, and neither makes progress. That is livelock. With fixed sleeps they stay in step. A random back-off breaks the symmetry. It isn't deadlock, because nobody waits forever on a held lock, and it isn't starvation, because nobody else is progressing either.","from":null},{"q":"A service stops answering. You suspect a lock cycle. Which tool tells you for sure?","options":["A JFR recording, filtered on the jdk.Deadlock event","The GC log","Restarting the pod and watching whether it happens again","<code>jcmd &lt;pid&gt; Thread.print<\/code>, which prints \"Found one Java-level deadlock\" with the threads and locks involved"],"answer":3,"why":"The thread dump's deadlock detector finds cycles on monitors and on <code>ReentrantLock<\/code>, and names who holds what. JFR has no deadlock event. Restarting destroys the evidence. Take the dump first.","from":null},{"q":"A report thread needs a <code>ReentrantLock<\/code> for 50 ms once a minute. Request threads take the same lock thousands of times a second and grab it again the moment they release it. The report sometimes waits for minutes. What is this, and what is one fix?","options":["Starvation; a fair lock, <code>new ReentrantLock(true)<\/code>, gives the longest waiter the next turn","Deadlock; order the locks","Livelock; add random back-off","A race condition; make the field volatile"],"answer":0,"why":"Everyone else makes progress and one thread never gets its turn: that is starvation. A non-fair lock lets a running thread barge back in ahead of waiters. A fair lock queues them in order, at some cost in throughput. Making the request path hold the lock for less time also helps.","from":null},{"q":"From wait, notify and guarded blocks: a one-slot buffer using <code>notify()<\/code> stalls with all four threads WAITING. Will <code>jcmd Thread.print<\/code> report a Java-level deadlock?","options":["Yes, every stall is reported as a deadlock","No: no thread holds the monitor, they are all waiting for a notification that will never come","Yes, but only with the -l flag","No, because jcmd can't see WAITING threads"],"answer":1,"why":"The deadlock detector looks for threads blocked on locks held by each other. Threads in <code>wait()<\/code> hold nothing, and the monitor is free. They are stuck because a signal was lost, not because of a lock cycle, so the dump shows four WAITING threads and no deadlock section.","from":"conc-05"}],"cards":[{"front":"Deadlock condition 1: what is mutual exclusion?","back":"<p>A resourc
