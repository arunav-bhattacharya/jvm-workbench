blish<\/code> so <code>ready<\/code> is set first"],"answer":1,"why":"The loop reads <code>ready<\/code>, so that is the read the JIT must not hoist. Because <code>rates<\/code> is written before the volatile write and read after the volatile read sees <code>true<\/code>, the reader also sees the map. Making only <code>rates<\/code> volatile still lets the loop on <code>ready<\/code> spin forever, and swapping the lines would let a reader see <code>ready == true<\/code> with <code>rates<\/code> still null.","from":null},{"q":"From the threads track: <code>count<\/code> is a <code>volatile int<\/code>, and two threads each run <code>count++<\/code> a million times. What does <code>count<\/code> usually hold at the end?","options":["Exactly 2,000,000, because volatile makes every access go to memory","Less than 2,000,000, because <code>count++<\/code> is still a read, an add and a write","Exactly 1,000,000, because each thread overwrites the other","It doesn't compile: <code>++<\/code> isn't allowed on a volatile field"],"answer":1,"why":"<code>volatile<\/code> makes each read and each write visible, but it doesn't merge them into one step. Two threads can still read the same value and both write value + 1. Visibility and atomicity are different problems; lesson 3 of this track takes them apart.","from":"conc-03"}],"cards":[{"front":"Why can <code>while (!stop) {}<\/code> spin forever when <code>stop<\/code> is a plain boolean?","back":"<p>The JIT may read <code>stop<\/code> once, keep it in a register and compile the loop to <code>while (true)<\/code>. Nothing tells it another thread writes the field.<\/p>"},{"front":"The stop-flag hang disappears under <code>java -Xint<\/code>. What does that prove?","back":"<p>The hang is a compiler effect. The interpreter reads the field on every pass; caches are the same in both runs.<\/p>"},{"front":"Can a CPU cache hold a stale value forever while another core writes it?","back":"<p>No. Caches are coherent: a write invalidates or updates other cores' copies, usually within nanoseconds.<\/p>"},{"front":"What is a store buffer?","back":"<p>A small queue where a core parks its writes on the way to the cache. The core's later reads can complete before those writes are visible to other cores.<\/p>"},{"front":"Thread A: <code>x = 1; r1 = y;<\/code> Thread B: <code>y = 1; r2 = x;<\/code> Plain ints, both start at 0. Can <code>r1 == 0 &amp;&amp; r2 == 0<\/code>?","back":"<p>Yes, through store buffers or JIT reordering. With both fields volatile, no.<\/p>"},{"front":"Does adding <code>Thread.sleep<\/code> or a log line to a spin loop fix a plain stop flag?","back":"<p>No. It hides the bug on today's HotSpot because the JIT re-reads after calls it can't see into. The JMM promises nothing. Use <code>volatile<\/code>.<\/p>"},{"front":"What is the as-if-serial rule?","back":"<p>Compilers and CPUs may reorder or remove work as long as a single thread running alone can't tell the difference.<\/p>"}],"terms":[{"term":"Visibility","plain":"Whether and when a write by one thread can be seen by a read in another thread."},{"term":"Hoisting","plain":"The JIT moving a read out of a loop because it believes the value can't change inside the loop."},{"term":"Store buffer","plain":"A per-core queue of pending writes. It lets the core keep running before its writes reach the cache."},{"term":"Cache coherence","plain":"The hardware protocol that keeps every core's cache in agreement about each memory location."},{"term":"As-if-serial","plain":"Optimizers may change anything a single thread can't observe."},{"term":"Data race","plain":"Two threads access the same variable, at least one writes, and no synchronization orders the two accesses."},{"term":"volatile","plain":"A field modifier: reads and writes go to memory in order, and they link threads in the memory model."}],"remote":true},"jmm-02":{"id":"jmm-02","track":"jmm","n":2,"title":"Happens-before, the rules that matter","ready":true,"minutes":35,"goal":"By the end you can name the happens-before edge that makes a read see a write, spot a data race where no edge exists, and fix it with the right lock, volatile field, join or java.util.concurrent handoff.","quiz":[{"q":"<code>setStatus<\/code> writes inside <code>synchronized (paymentLock)<\/code>. <code>getStatus<\/code> reads inside <code>synchronized (auditLock)<\/code>. Is the getter guaranteed to see the latest status?","options":["Yes, because both methods are synchronized","No: the edge exists only between releasing a monitor and a later acquire of the same monitor","Yes, because entering any synchronized block refreshes all fields from memory","No, because a field can't be read inside a synchronized block"],"answer":1,"why":"Two different monitors give no edge. The idea that any <code>synchronized<\/code> block refreshes everything comes from thinking of locks as memory barriers. The JMM only promises the edge for the same monitor, and the JIT is allowed to optimize accordingly.","from":null},{"q":"T1 runs <code>x = 1; v = 1;<\/code> where <code>v<\/code> is volatile and <code>x<\/code> is plain. T2 reads <code>v<\/code> and gets 0, then reads <code>x<\/code>. What can T2 see for <code>x<\/code>?","options":["Always 0, because T1 hasn't written <code>v<\/code> yet","Always 1, because volatile flushes every earlier write","Either 0 or 1: T2's read of <code>v<\/code> didn't see the write, so no edge covers <code>x<\/code>","It throws, because reading a plain field next to a volatile is illegal"],"answer":2,"why":"The volatile edge forms only when the read sees the write. T2 saw 0, so it has no edge to T1's writes, and its read of <code>x<\/code> races with <code>x = 1<\/code>. T1 may well have already written <code>x<\/code>, which is why option 1 is wrong too.","from":null},{"q":"<code>main<\/code> fills a plain <code>HashMap<\/code> with 10,000 entries, then calls <code>executor.submit(() -&gt; lookup(map))<\/code> and never touches the map again. Is the task's read safe?","options":["Yes: submitting to an executor happens-before the task starts, and nobody writes after that","No, because <code>HashMap<\/code> is not thread-safe","Only if the map field is volatile","Only if you switch to <code>ConcurrentHashMap<\/code>"],"answer":0,"why":"<code>HashMap<\/code> is unsafe for concurrent writes, but here all writes come before the handoff and none after. The submit edge makes them visible to the task. Volatile or <code>ConcurrentHashMap<\/code> would add cost and no safety.","from":null},{"q":"A worker thread writes <code>result<\/code>. Which of these does NOT give <code>main<\/code> a happens-before edge to that write?","options":["<code>worker.join()<\/code> returns","<code>future.get()<\/code> returns, where the worker is the future's task","<code>latch.await()<\/code> returns, after the worker wrote and then called <code>latch.countDown()<\/code>","<code>Thread.sleep(1_000)<\/code> returns"],"answer":3,"why":"<code>join<\/code>, <code>Future.get<\/code> and the latch are all documented edges. <code>sleep<\/code> only passes time. The worker may not be done, and even if it is, a read after a sleep still races with its write.","from":null},{"q":"From lesson 1 of this track: you add <code>Thread.onSpinWait()<\/code> to a spin loop on a plain flag, and the loop starts noticing the flag. In memory model terms, what changed?","options":["The loop now has a happens-before edge to the writer","Nothing: there is still no edge, HotSpot just happens to re-read the field","<code>onSpinWait<\/code> makes the next read volatile","<code>onSpinWait<\/code> flushes the writer's store buffer"],"answer":1,"why":"<code>onSpinWait<\/code> is a hint to the CPU, with no synchronization effect in the JMM. HotSpot happens to re-read the field after it today. The program still has a data race on the flag, and only a volatile, a lock or another real edge fixes it.","from":"jmm-01"}],"cards":[{"front":"When is a write in one thread guaranteed visible to a read in another?","back":"<p>Only when the write happens-before the read.<\/p>"},{"front":"State the monitor rule of happens-before.","back":"<p>Releasing a lock happens-before every later acquisition of the same lock.<\/p>"},{"front":"T1 writes inside <code>synchronized (a)<\/code>. T2 reads inside <code>synchronized (b)<\/code>. Is there an edge?","back":"<p>No. The edge needs the same monitor on both sides.<\/p>"},{"front":"State the volatile rule of happens-before.","back":"<p>A write to a volatile field happens-before every read of that same field that sees it (or a later write).<\/p>"},{"front":"What does <code>Thread.start()<\/code> guarantee to the new thread?","back":"<p>Everything the parent did before calling <code>start()<\/code> is visible to the new thread. Writes after <code>start()<\/code> are not covered.<\/p>"},{"front":"Is <code>Thread.sleep(100)<\/code> a happens-before edge?","back":"<p>No. Use <code>join()<\/code>, <code>Future.get()<\/code> or a latch.<\/p>"},{"front":"What is a data race?","back":"<p>Two threads access the same variable, at least one access is a write, and no happens-before edge orders them.<\/p>"}],"terms":[{"term":"Happens-before","plain":"The memory model's ordering between two actions. If a write happens-before a read, the read sees it."},{"term":"Program order","plain":"The order of actions within one thread, as the code is written."},{"term":"Release","plain":"The sending end of an edge: leaving a lock, writing a volatile, <code>countDown()<\/code>, <code>put<\/code> into a concurrent queue."},{"term":"Acquire","plain":"The receiving end of an edge: entering a lock, reading a volatile, <code>await()<\/code>, <code>take<\/code> from a concurrent queue."},{"term":"Data race","plain":"Conflicting accesses to one variable from two threads with no happens-before edge between them."},{"term":"DRF-SC","plain":"The JMM promise: a program free of data races behaves as if its threads were interleaved one action at a time."},{"term":"Piggybacking","plain":"Relying on transitivity so one volatile or lock edge also publishes the plain writes made before it."}],"remote":true},"jmm-03":{"id":"jmm-03","track":"jmm","n":3,"title":"volatile: what it gives you and what it doesn't","ready":true,"minutes":35,"goal":"By the end you can say exactly what volatile guarantees, show why it doesn't make count++ safe, and choose between volatile, an atomic and a lock for any shared field.","quiz":[{"q":"Many request threads run <code>balance += amount<\/code> on a <code>volatile long balance<\/code>. What can go wrong?","options":["Two threads can read the same balance and both write, so one amount is lost","Nothing: volatile makes the whole statement atomic","The 64-bit write can tear into two halves","Readers may never see the new balance"],"answer":0,"why":"<code>+=<\/code> is read, add, write. Volatile makes each step visible and ordered but leaves the gap between them. Tearing is ruled out because the field is volatile, and visibility is fine, which is what makes the bug easy to miss.","from":null},{"q":"Which of these fields is correctly protected by <code>volatile<\/code> alone?","options":["A request counter that every request thread increments","A reference to an immutable <code>RateTable<\/code> that one scheduler thread replaces every minute","<code>limit<\/code> and <code>spent<\/code>, which are checked together before every authorization","A <code>volatile ArrayList&lt;Fee&gt;<\/code> that several threads add fees to"],"answer":1,"why":"One writer, a whole-object replace, and readers that need only the latest reference: that's exactly volatile's job. The counter needs an atomic, the pair needs a lock, and the volatile list protects only the reference while <code>ArrayList.add<\/code> races.","from":null},{"q":"In <code>HalfVolatileDemo<\/code> only <code>x<\/code> is volatile. Why do both threads still sometimes read 0?","options":["The volatile write to <code>x<\/code> is lost","Volatile only works between two volatile fields of the same object","Thread B's plain write to <code>y<\/code> can wait in its store buffer while B reads <code>x<\/code>, so B's own pair of accesses is not ordered","The demo's barrier lets the threads run different trials"],"answer":2,"why":"Each thread's write-then-read must be ordered for the outcome to be ruled out. Thread A's volatile write is followed by a store-buffer drain, but thread B wrote a plain field, so nothing stops B's read from passing its own write. Make both fields volatile and the count drops to 0.","from":null},{"q":"A class has <code>private volatile long[] balances<\/code>. Thread A runs <code>balances[3] = 500<\/code>. Thread B later reads <code>balances[3]<\/code>. What is guaranteed?","options":["B sees 500, because the array is volatile","B sees 500 or 0, but never a torn value","B sees 500 once A releases the array","Nothing about the element: only the array reference is volatile, so this is a plain write and a plain read"],"answer":3,"why":"Element accesses of a volatile array are plain accesses. There's no edge from A's write to B's read, and a plain <code>long<\/code> element may even tear under the JLS. Use <code>AtomicLongArray<\/code> when elements are shared.","from":null},{"q":"From lesson 2 of this track: T1 sets a plain <code>fee = 25<\/code> and then the volatile <code>ready = true<\/code>. T2 sees <code>ready == true<\/code> and then reads <code>fee<\/code>. Why must T2 see 25?","options":["Because <code>fee<\/code> is an <code>int<\/code>, and int writes are atomic","Program order, then the volatile write-to-read edge, then program order again: the edges chain, so the write of <code>fee<\/code> happens-before its read","Because volatile writes flush all CPU caches","It doesn't have to; T2 may see 0"],"answer":1,"why":"This is piggybacking on the volatile. The write of <code>fee<\/code> comes before the release in T1's program order, and the read comes after the acquire in T2's. Atomicity only rules out half-written values; it says nothing about which value you see.","from":"jmm-02"}],"cards":[{"front":"What does a volatile field guarantee?","back":"<p>Visibility of the latest write, release/acquire ordering around each access, and a single order of all volatile accesses that every thread agrees on.<\/p>"},{"front":"Is <code>count++<\/code> on a volatile int atomic?","back":"<p>No. It's still a read, an add and a write. Use <code>AtomicInteger.incrementAndGet()<\/code> or <code>LongAdder<\/code>.<\/p>"},{"front":"When is volatile alone enough for a field?","back":"<p>When one thread writes it (or writes don't depend on the current value), and the field isn't part of a rule with other fields.<\/p>"},{"front":"Two fields must change together under one rule. Volatile, atomic or lock?","back":"<p>A lock, taken around every read and write of both fields.<\/p>"},{"front":"Can a write to a non-volatile <code>long<\/code> tear?","back":"<p>The JLS allows it to be split into two 32-bit writes. A volatile <code>long<\/code> or <code>double<\/code> is always written and read atomically.<\/p>"},{"front":"<code>volatile List&lt;Fee&gt; fees;<\/code> Is <code>fees.add(f)<\/code> from two threads safe?","back":"<p>No. Volatile covers the reference only. Replace the whole list with an immutable copy instead, or use a concurrent collection.<\/p>"},{"front":"Are the elements of a <code>volatile long[]<\/code> volatile?","back":"<p>No, only the array reference. Use <code>AtomicLongArray<\/code> for volatile element access.<\/p>"}],"terms":[{"term":"Visibility","plain":"Whether a read in one thread sees a write from another."},{"term":"Atomicity","plain":"An operation happens as one indivisible step that no other thread can split."},{"term":"Read-modify-write","plain":"Read a value, compute a new one from it, write it back. Needs an atomic or a lock when shared."},{"term":"Torn read","plain":"Seeing half of one write and half of another, possible for non-volatile long and double under the JLS."},{"term":"Single writer","plain":"A field that only one thread ever writes. Volatile is enough for it."},{"term":"Snapshot publication","plain":"Building a new immutable object and publishing it with one volatile write, instead of mutating the old one."},{"term":"LongAdder","plain":"A counter that spreads increments over several cells. Fast under contention; its sum is not a snapshot."}],"remote":true},"jmm-04":{"id":"jmm-04","track":"jmm","n":4,"title":"Safe publication, final fields and escaping this","ready":true,"minutes":35,"goal":"By the end you can publish an object so other threads see it whole, build immutable classes that are safe to share through any race, and keep this from escaping a constructor.","quiz":[{"q":"<code>registry.current<\/code> is a plain field. The loader stores a <code>RateCard<\/code> whose fields are all <code>final<\/code>. What can a request thread that reads <code>registry.current<\/code> see?","options":["null, or a RateCard with correct field values; it may also keep seeing null for a long time","A RateCard whose currency is still null","Always the latest RateCard, because its fields are final","A ClassCastException, because the object is half-built"],"answer":0,"why":"Final fields guarantee that whoever sees the reference sees the constructed values. They don't make the reference visible, so the reader can see null, an older card, or the new one, but never a half-built one. Option 3 is the common confusion between the two guarantees.","from":null},{"q":"Which of these publishes a new <code>RateCard<\/code> safely to request threads that call <code>current()<\/code>?","options":["A plain field, with <code>publish<\/code> marked <code>synchronized<\/code> and <code>current()<\/code> unsynchronized","A <code>volatile<\/code> field","A <code>HashMap<\/code> field that <code>publish<\/code> puts the card into","A plain field, written after <code>Thread.sleep(100)<\/code>"],"answer":1,"why":"The volatile write in <code>publish<\/code> pairs with the volatile read in <code>current()<\/code>. The half-synchronized version has no acquire on the read side, a plain HashMap creates no edge, and a sleep is not an edge.","from":null},{"q":"A constructor sets all its final fields and then, as its last line, calls <code>bus.register(this)<\/code>. Is that safe?","options":["Yes, all the fields are already set","Yes, final fields make any publication safe","No: the final-field promise starts when the constructor returns, so the bus's threads get no such promise, and a subclass constructor hasn't run yet","No, <code>register<\/code> can't accept <code>this<\/code> inside a constructor"],"answer":2,"why":"The freeze happens at the end of the constructor, and <code>this<\/code> left before that. In practice it often works, which is why the bug survives review. Register from a factory method or <code>@PostConstruct<\/code> instead.","from":null},{"q":"A final class has <code>private final List&lt;Fee&gt; fees;<\/code>, set with <code>this.fees = fees;<\/code> from the caller's <code>ArrayList<\/code>, and no setters. Is it safe to share between threads?","options":["Yes, the field is final","Yes, as long as it is published through a volatile field","No, because <code>List<\/code> is an interface","No: the caller still holds the <code>ArrayList<\/code> and can change it after the constructor, racing with every reader"],"answer":3,"why":"Final freezes the reference and the list's state at the end of the constructor. Later changes through the caller's reference are ordinary racy writes to an ArrayList. Copy it with <code>List.copyOf<\/code> in the constructor.","from":null},{"q":"From lesson 3 of this track: a field is <code>volatile Map&lt;String, Rule&gt; rules<\/code>. A refresher thread calls <code>rules.put(k, v)<\/code> on the existing <code>HashMap<\/code>, and request threads call <code>rules.get(k)<\/code>. Is it safe?","options":["Yes, the field is volatile","No: <code>put<\/code> is not a volatile write, it changes a HashMap that isn't safe for concurrent use","Yes, if the map has fewer than 16 entries","Only on x86"],"answer":1,"why":"Volatile covers the reference. <code>put<\/code> never writes the field, so there's no edge, and HashMap can corrupt itself under concurrent access. Build a new map and assign it with one volatile write, or use a ConcurrentHashMap.","from":"jmm-03"}],"cards":[{"front":"An object is published through a plain field. What can a reader that sees the reference observe?","back":"<p>Default values (0, false, null) in its non-final fields, because the reference may become visible before the constructor's writes.<\/p>"},{"front":"What do final fields guarantee?","back":"<p>A thread that sees the reference after the constructor finished sees the final fields, and what they point to, as the constructor left them, even through a data race.<\/p>"},{"front":"Do final fields make the reference to the object visible to other threads?","back":"<p>No. You still need a safe publication channel, such as a volatile field, for readers to see the reference at all.<\/p>"},{"front":"Name a safe publication idiom that needs no volatile and no lock.","back":"<p>A static initializer, such as <code>static final RateCard DEFAULT = new RateCard(...)<\/code>. Class initialization runs under a JVM lock.<\/p>"},{"front":"A constructor calls <code>bus.register(this)<\/code>. What's the fix?","back":"<p>Make the constructor only assign fields, and register in a static factory or <code>@PostConstruct<\/code>, after construction.<\/p>"},{"front":"What does a Kotlin <code>val<\/code> compile to?","back":"<p>A private final backing field (plus a getter). A <code>var<\/code> gives a non-final field.<\/p>"},{"front":"Is <code>this.fees = fees;<\/code> enough for an immutable class with a list?","back":"<p>No. Copy it (<code>List.copyOf(fees)<\/code>), or the caller can still change the list under your readers.<\/p>"}],"terms":[{"term":"Publication","plain":"Making a reference to an object reachable from another thread."},{"term":"Safe publication","plain":"Publishing so the reader gets the reference and the object's state together, through a happens-before edge or final fields."},{"term":"Partially constructed object","plain":"An object a thread can see before the constructor's writes are visible to it."},{"term":"Freeze","plain":"The end of a constructor, after which final fields carry the JMM's special visibility promise."},{"term":"Immutable object","plain":"Final class, final fields, copied inputs, nothing mutable handed out, no escaping this."},{"term":"Escaping this","plain":"A constructor letting other code get a reference to the object before the constructor has finished."},{"term":"Defensive copy","plain":"Copying a mutable input or output so outside code can't change your object's state."}],"remote":true},"jmm-05":{"id":"jmm-05","track":"jmm","n":5,"title":"Lazy init done right: double-checked locking and holders","ready":true,"minutes":35,"goal":"By the end you can explain why double-checked locking without volatile is broken, write a correct lazy value with a volatile DCL, the holder class idiom and Kotlin's lazy, and pick the simplest one that fits.","quiz":[{"q":"A double-checked singleton has a volatile field. A teammate removes <code>volatile<\/code> because \"the write already happens inside synchronized\", and CI stays green. What do you tell them?","options":["That's fine: leaving the synchronized block publishes the object to every thread","A thread on the lock-free fast path has no edge to that write, so it can get a half-built object; CI's x86 machines just rarely show it","It can now build two instances","It will deadlock under contention"],"answer":1,"why":"Releasing a lock creates an edge only to threads that later take the same lock. The fast path takes no lock, so only a volatile read gives it an edge. The second check still prevents two builds, so option 3 is wrong, and the bug simply doesn't show on most x86 runs.","from":null},{"q":"A Quarkus bean needs its own <code>HttpClient<\/code>, built on first use. Building it fails when the issuer's DNS is down, and the next request should try again. Which idiom fits?","options":["The holder class idiom","An enum singleton","Double-checked locking on a volatile field, or Kotlin <code>by lazy<\/code>","<code>by lazy(LazyThreadSafetyMode.NONE)<\/code>"],"answer":2,"why":"The holder and the enum are static, one per JVM, and a failed class initialization is permanent: later calls get NoClassDefFoundError. DCL stores nothing when the initializer throws, so the next call tries again, and Kotlin's <code>lazy<\/code> documents the same retry. NONE is unsafe on a bean that many request threads share.","from":null},{"q":"<code>Rates<\/code> has <code>static final Rates INSTANCE = new Rates();<\/code>, a constructor that prints <code>built<\/code>, and a static method <code>currency()<\/code> that returns \"EUR\". <code>main<\/code> prints <code>start<\/code>, then prints <code>Rates.currency()<\/code>. What is the output?","options":["start, built, EUR","start, EUR, and <code>built<\/code> only when INSTANCE is first read","built, start, EUR, because static fields are set when the JVM starts","start, EUR, built"],"answer":0,"why":"Calling a static method is an active use, so the JVM initializes <code>Rates<\/code> first, and that runs <code>new Rates()<\/code>. Class initialization is lazy per class, not per field. A holder class is how you make the instance wait for its own first use.","from":null},{"q":"A shared Kotlin object has <code>val pool by lazy(LazyThreadSafetyMode.PUBLICATION) { ConnectionPool(size = 20) }<\/code>. A burst of requests arrives right after startup. What can happen?","options":["Nothing bad: PUBLICATION means the pool is published safely, so it's built once","Different callers keep using different pools","The callers deadlock","Several threads can each open a pool of 20 connections; one pool is kept and the others are dropped without being closed"],"answer":3,"why":"PUBLICATION lets the initializer run on several threads at once and keeps one result, so everyone does end up with the same pool (option 2 is wrong). The extra pools were still created, and their connections leak. Anything with side effects belongs in the default SYNCHRONIZED mode.","from":null},{"q":"From lesson 4 of this track: a DCL singleton without volatile, but every field of the singleton is <code>final<\/code>. What can a thread on the fast path see?","options":["null, which sends it to the slow path, or the complete object; the code is still fragile, because one non-final field added later breaks it","A half-built object, just like the non-final case","Always null, so every call takes the lock","Two different instances"],"answer":0,"why":"Final fields are seen as the constructor left them, even through a data race, so the race on the reference is benign. jcstress <code>Singleton_07<\/code> shows no failures with final fields and failures without them. Relying on that is brittle; add volatile.","from":"jmm-04"}],"cards":[{"front":"Why is double-checked locking without volatile broken?","back":"<p>The fast path reads the field without the lock, so it has no happens-before edge to the write. A thread can see the reference before the constructor's writes and use a half-built object.<\/p>"},{"front":"What one change makes double-checked locking correct?","back":"<p>Declare the field <code>volatile<\/code> (<code>@Volatile<\/code> in Kotlin). The volatile write publishes the finished object; the volatile read on the fast path sees it whole.<\/p>"},{"front":"In the holder class idiom, what does the locking?","back":"<p>The JVM's class initialization. <code>Holder<\/code> is initialized once, under a JVM lock, the first time <code>Holder.INSTANCE<\/code> is read.<\/p>"},{"front":"A holder's initializer throws on the first call. What does the second call get?","back":"<p><code>NoClassDefFoundError: Could not initialize class ...$Holder<\/code>. Class initialization never retries; only a JVM restart does.<\/p>"},{"front":"What does <code>val x by lazy { ... }<\/code> compile to, and which mode does it use?","back":"<p>A <code>private final kotlin.Lazy x$delegate<\/code> field. The default mode is SYNCHRONIZED: double-checked locking on a volatile field.<\/p>"},{"front":"LazyThreadSafetyMode.PUBLICATION vs SYNCHRONIZED?","back":"<p>PUBLICATION may run the initializer on several threads at once and keeps one result. SYNCHRONIZED runs it once while the other callers wait.<\/p>"},{"front":"Kotlin <code>concurrentMap.getOrPut(k) { connect() }<\/code>: can <code>connect()<\/code> run twice for one key?","back":"<p>Yes. It never replaces a value, but the lambda may run on two threads. <code>computeIfAbsent<\/code> runs it at most once per absent key.<\/p>"}],"terms":[{"term":"Lazy initialization","plain":"Building a value on first use instead of at startup."},{"term":"Double-checked locking","plain":"Check without a lock, then lock and check again before building. Correct only with a volatile field."},{"term":"Holder class idiom","plain":"Keep the instance in a private nested class, so the JVM builds it on the first call, once, under its class-initialization lock."},{"term":"Class initialization","plain":"The JVM running a class's static initializer once, before the class's first active use."},{"term":"Enum singleton","plain":"A one-constant enum used as a singleton; serialization and reflection can't make a second one."},{"term":"Sentinel","plain":"A private marker object meaning \"not set yet\", so a real null result can be cached too."},{"term":"LazyThreadSafetyMode","plain":"Kotlin's choice for <code>lazy<\/code>: SYNCHRONIZED (once, others wait), PUBLICATION (maybe many runs, one result), NONE (one thread only)."}],"remote":true},"jmm-06":{"id":"jmm-06","track":"jmm","n":6,"title":"VarHandles and memory ordering modes","ready":true,"minutes":35,"goal":"By the end you can name the four access modes and what each one promises, write a release/acquire handoff and a compareAndSet flag with a VarHandle, and explain why app code almost never needs them and why only jcstress can test them.","quiz":[{"q":"A shutdown hook sets a flag once. A hot loop on another thread checks the flag and only needs to stop eventually; the flag guards no other data. What is the weakest mode that is guaranteed to work?","options":["Plain","Opaque","Acquire/release","Volatile"],"answer":1,"why":"Opaque guarantees each read really happens, so the loop eventually sees the write (jcstress BasicJMM_04 forbids a stuck opaque spin). Plain may be read once for the whole loop. Acquire/release and volatile also work but promise more than this loop needs. In app code you'd still write volatile, because it's one keyword and costs nothing extra on an x86 read.","from":null},{"q":"Writer: <code>report.total = t; READY.setRelease(this, true);<\/code>. Reader: <code>if ((boolean) READY.getOpaque(this)) use(report.total);<\/code>. What can the reader see?","options":["The flag as true, but an old <code>total<\/code>: a release only helps a reader that acquires","Always the new total, because the writer used release","A WrongMethodTypeException, because the modes don't match","Never the flag as true, because opaque reads can't see release writes"],"answer":0,"why":"The ordering is a pair: release on the writer's side, acquire on the reader's. An opaque read sees the flag eventually, but nothing stops the reader's read of <code>total<\/code> from happening before it. Modes may be mixed without an exception (option 3), and opaque reads do see the value (option 4).","from":null},{"q":"Two settlement workers decide who runs the nightly batch: each does <code>MINE.setRelease(this, true)<\/code>, then reads the other's flag with <code>getAcquire<\/code>, and runs the batch if it reads false. What's wrong?","options":["Nothing: release/acquire orders the write before the read","It only fails on ARM","It throws, because each VarHandle may only be used by one thread","Both workers can read false and both run the batch, even on x86; this shape needs volatile, or better one compareAndSet or a database lock"],"answer":3,"why":"This is store buffering. Release keeps earlier accesses before the write but doesn't stop the later read of a different variable from passing it, and x86's store buffer does exactly that. Volatile forbids it through its single total order. In a real service, use one shared variable with compareAndSet, or a lock in the database both workers share.","from":null},{"q":"Where do VarHandle access modes belong?","options":["On every hot volatile field in a Quarkus service","Instead of synchronized in request handlers","In low-level building blocks like queues, after a profiler shows the cost, with jcstress tests","Nowhere: they were deprecated with sun.misc.Unsafe"],"answer":2,"why":"VarHandles are the supported replacement for Unsafe, not deprecated with it (option 4). They only pay off in code that hands over millions of values a second, and they need jcstress because unit tests can't see reorderings. A request handler gets nothing from them that volatile, an Atomic class or a lock doesn't give it more clearly.","from":null},{"q":"From lesson 3 of this track: many threads run <code>balance += amount<\/code> on a <code>volatile long balance<\/code>. Someone suggests <code>BALANCE.getAndAdd(this, amount)<\/code> through a VarHandle instead. Does that fix it?","options":["No, a VarHandle has the same problem as volatile","Yes: getAndAdd is one atomic read-modify-write, like AtomicLong.getAndAdd","Only if a setRelease follows it","Only on 64-bit JVMs"],"answer":1,"why":"Volatile makes each read and each write visible, but <code>+=<\/code> is still a read and a write with a gap between them, so updates get lost. <code>getAndAdd<\/code> is a single atomic update with volatile semantics. In app code an <code>AtomicLong<\/code> or a <code>LongAdder<\/code> says the same thing more plainly.","from":"jmm-03"}],"cards":[{"front":"What does a VarHandle let you choose that a volatile field doesn't?","back":"<p>The memory mode of each access (plain, opaque, acquire/release, volatile) on a plain field, plus atomic updates such as compareAndSet.<\/p>"},{"front":"What does opaque mode add over plain?","back":"<p>Each access really happens, untorn and in order for that variable, so a spinning reader eventually sees a new value. It orders no other variables.<\/p>"},{"front":"A release write and an acquire read of the same variable: what does the reader get?","back":"<p>If its acquire read sees the released value, it also sees every write the writer made before the release.<\/p>"},{"front":"What does volatile add on top of acquire/release?","back":"<p>One total order of all volatile accesses. That forbids the store-buffering result where two threads both read the other's variable as 0.<\/p>"},{"front":"What memory semantics does <code>VarHandle.compareAndSet<\/code> have?","back":"<p>Volatile: it reads the witness value as getVolatile and, on success, writes as setVolatile.<\/p>"},{"front":"Why keep a VarHandle in a <code>static final<\/code> field?","back":"<p>The JIT treats a static final as a constant, so each call compiles down to a load or store plus the barrier its mode needs.<\/p>"},{"front":"Why can't a passing JUnit test show that release/acquire code is correct?","back":"<p>It shows one machine didn't produce a bad outcome that time. jcstress runs the actors millions of times and fails on any forbidden outcome; x86 can't show many ARM bugs.<\/p>"}],"terms":[{"term":"VarHandle","plain":"A typed handle to a field or array element whose methods read and write it in a chosen memory mode (JDK 9)."},{"term":"Access mode","plain":"The memory rules for one read or write: plain, opaque, acquire/release or volatile."},{"term":"Opaque","plain":"A mode where each access really happens, untorn and in order for that variable, with no ordering of other variables."},{"term":"Acquire and release","plain":"A paired mode: writes before the release are visible to a thread whose acquire read sees the released value."},{"term":"Signature-polymorphic method","plain":"A method whose real signature comes from the call site's argument types and result cast, like VarHandle.get."},{"term":"Store buffering","plain":"Each thread writes one variable, then reads the other's; both may read the old value unless the accesses are volatile."},{"term":"jcstress","plain":"The OpenJDK harness that runs concurrent actors millions of times and checks every outcome against acceptable and forbidden ones."}],"remote":true},"exec-01":{"id":"exec-01","track":"exec","n":1,"title":"Why pools: Executor, ExecutorService and shutdown","ready":true,"minutes":35,"goal":"By the end you can say what a thread pool saves you, pick execute or submit on purpose, and shut a pool down without losing work or hanging the JVM.","quiz":[{"q":"A Kafka handler does <code>pool.submit(() -&gt; ledger.post(entry))<\/code> and never keeps the <code>Future<\/code>. <code>post<\/code> throws a <code>SQLException<\/code> wrapped in a <code>RuntimeException<\/code>. What shows up in the logs?","options":["A stack trace from the default UncaughtExceptionHandler","Nothing at all","A RejectedExecutionException on the next submit","A warning that the pool lost a worker"],"answer":1,"why":"<code>submit<\/code> wraps the task in a <code>FutureTask<\/code>, which catches the exception and stores it in the <code>Future<\/code>. Nobody calls <code>get()<\/code>, so nobody sees it. The stack trace from the default handler is what you'd get with <code>execute<\/code>, which is why that option is tempting.","from":null},{"q":"<code>main<\/code> creates <code>Executors.newFixedThreadPool(2)<\/code>, runs three tasks that finish quickly, and returns without calling <code>shutdown()<\/code>. What happens to the JVM?","options":["It exits when <code>main<\/code> returns","It exits once the three tasks are done","It keeps running, because the two idle worker threads are not daemon threads","It throws IllegalStateException because the pool was never shut down"],"answer":2,"why":"The JVM exits when the last non-daemon thread ends. The pool's workers are non-daemon and wait in <code>take()<\/code> for more work forever. A cached pool would let the JVM exit after 60 idle seconds, because its idle threads time out.","from":null},{"q":"A pool runs a task with a loop <code>while (true) { score(next()); }<\/code> that never checks the interrupt flag and never blocks. You call <code>shutdownNow()<\/code> and then <code>awaitTermination(5, SECONDS)<\/code>. What does <code>awaitTermination<\/code> return?","options":["true, because shutdownNow stops the threads","true, because the task is removed from the queue","It throws InterruptedException","false, because the interrupt is only a request and this task ignores it"],"answer":3,"why":"<code>shutdownNow<\/code> calls <code>interrupt()<\/code> on the workers. That sets a flag and wakes blocking calls. A loop that never checks the flag and never blocks runs on, so the pool cannot terminate and the wait times out with <code>false<\/code>.","from":null},{"q":"Which code waits until every submitted task has finished, with no timeout, on JDK 21?","options":["<code>pool.shutdown();<\/code>","<code>try (pool) { ... }<\/code> (try-with-resources, which calls <code>close()<\/code>)","<code>pool.shutdownNow();<\/code>","<code>pool.isTerminated();<\/code>"],"answer":1,"why":"<code>close()<\/code> (JDK 19+) calls <code>shutdown()<\/code> and then waits until the pool has terminated. <code>shutdown()<\/code> and <code>shutdownNow()<\/code> return at once, and <code>isTerminated()<\/code> only reports the state.","from":null},{"q":"From \"Race conditions: why count++ lies\": four tasks on a fixed pool each run <code>total += amount<\/code> 100,000 times on a shared <code>long<\/code> field. What is <code>total<\/code> after <code>close()<\/code> returns?","options":["Exactly 400,000 times <code>amount<\/code>, because the pool runs tasks one after another","Often less, because the four workers run at the same time and lose updates","Exactly right, because each task runs on a single thread","Unknown, because the pool throws ConcurrentModificationException"],"answer":1,"why":"A pool of four runs four tasks at once on four threads, so <code>total += amount<\/code> is the same read-modify-write race as before. The pool changes who creates the threads, not the rules for shared state. Use a <code>LongAdder<\/code>, an <code>AtomicLong<\/code>, or give each task its own subtotal.","from":"conc-03"}],"cards":[{"front":"Does <code>shutdown()<\/code> wait for running tasks to finish?","back":"<p>No. It rejects new tasks and returns at once. Queued and running tasks carry on. Wait with <code>awaitTermination<\/code> or <code>close()<\/code>.<\/p>"},{"front":"What does <code>shutdownNow()<\/code> return?","back":"<p>A <code>List&lt;Runnable&gt;<\/code> of the queued tasks that never started. It also interrupts the threads running tasks.<\/p>"},{"front":"A task sent with <code>submit()<\/code> throws. Where does the exception go?","back":"<p>Into the <code>Future<\/code>. Nothing is printed. <code>get()<\/code> throws <code>ExecutionException<\/code> with it as the cause.<\/p>"},{"front":"A task sent with <code>execute()<\/code> throws. What happens?","back":"<p>The worker thread dies, its <code>UncaughtExceptionHandler<\/code> runs (by default it prints the stack trace), and the pool starts a replacement.<\/p>"},{"front":"What does <code>ExecutorService.close()<\/code> do (JDK 19+)?","back":"<p><code>shutdown()<\/code>, then waits with no timeout until every task is done. If interrupted while waiting, it calls <code>shutdownNow()<\/code>, keeps waiting, then restores the interrupt flag.<\/p>"},{"front":"Why can a forgotten <code>newFixedThreadPool<\/code> keep the JVM running after <code>main<\/code> returns?","back":"<p>Its worker threads are non-daemon and wait for new tasks forever.<\/p>"}],"terms":[{"term":"Thread pool","plain":"A set of threads created once that run many tasks, taking them from a queue."},{"term":"Executor","plain":"Anything that can run a <code>Runnable<\/code>. It has one method, <code>execute<\/code>."},{"term":"ExecutorService","plain":"An Executor that also returns Futures and can be shut down and waited for."},{"term":"Future","plain":"A handle to a task's result that you can wait on, check or cancel."},{"term":"Poison pill","plain":"A marker item put in a queue to tell the consumer that takes it to stop."},{"term":"Daemon thread","plain":"A thread that does not keep the JVM alive. Pool threads usually are not daemon threads."},{"term":"Graceful shutdown","plain":"Stop taking new work, let accepted work finish within a deadline, then release resources."}],"remote":true},"exec-02":{"id":"exec-02","track":"exec","n":2,"title":"Inside ThreadPoolExecutor: core, max, queue, rejection","ready":true,"minutes":35,"goal":"By the end you can predict where every task in a burst goes (a core thread, the queue, an extra thread, or the rejection handler) and configure a ThreadPoolExecutor that pushes back instead of growing without limit.","quiz":[{"q":"<code>new ThreadPoolExecutor(2, 4, 60, SECONDS, new ArrayBlockingQueue&lt;&gt;(10))<\/code> receives 8 tasks that each block for a minute. Where are they?","options":["4 running, 4 queued","2 running, 6 queued","4 running, 2 queued, 2 rejected","8 running"],"answer":1,"why":"Tasks 1 and 2 start core threads. The other 6 fit in a queue of 10, so the queue never refuses and the pool never grows. The tempting answer, 4 running, assumes the pool uses its max before queuing. It is the other way round.","from":null},{"q":"A batch job reads 2 million ledger rows and submits one task per 1,000 rows. You want it to run no faster than the pool can keep up, without losing a batch and without a retry loop. Which handler fits?","options":["<code>AbortPolicy<\/code>","<code>DiscardOldestPolicy<\/code>","<code>CallerRunsPolicy<\/code>","<code>DiscardPolicy<\/code>"],"answer":2,"why":"<code>CallerRunsPolicy<\/code> makes the reading thread run the overflow batch itself, so it stops reading while it works. That is back-pressure, and nothing is lost. <code>AbortPolicy<\/code> would make you write the retry loop, and both discard policies lose batches without telling anyone.","from":null},{"q":"A pool uses <code>DiscardPolicy<\/code>. A request thread calls <code>pool.submit(task).get()<\/code> while the pool is saturated. What happens?","options":["<code>get()<\/code> throws RejectedExecutionException","<code>get()<\/code> returns null","<code>get()<\/code> throws CancellationException","<code>get()<\/code> blocks forever, because the dropped task never runs and its Future never completes"],"answer":3,"why":"<code>DiscardPolicy<\/code> drops the <code>FutureTask<\/code> without running or cancelling it. Nothing will ever complete that <code>Future<\/code>, so <code>get()<\/code> without a timeout waits forever. This is why the Javadoc suggests cancelling dropped tasks in a custom handler.","from":null},{"q":"A pool with core 4, max 16 and a bounded queue grew to 16 threads during a spike an hour ago. Traffic is quiet now. With default settings, how many threads does it have?","options":["4, because idle threads above core retired after keepAliveTime","16, because threads are never removed","0, because idle threads retire","1, the minimum"],"answer":0,"why":"Keep-alive applies to threads above core, so the pool shrinks back to 4. It only goes to 0 if you call <code>allowCoreThreadTimeOut(true)<\/code>.","from":null},{"q":"From \"Why pools: Executor, ExecutorService and shutdown\": a producer thread keeps calling <code>execute<\/code> on a <code>ThreadPoolExecutor<\/code> with the default handler after another thread has called <code>shutdown()<\/code>. What does the producer see?","options":["The tasks run, because shutdown() lets queued work finish","A RejectedExecutionException from each execute call","Nothing: the tasks are silently dropped","An IllegalStateException"],"answer":1,"why":"After <code>shutdown()<\/code>, new tasks go to the rejection handler, and the default <code>AbortPolicy<\/code> throws <code>RejectedExecutionException<\/code>. Only tasks that were already queued still run. With a discard policy or <code>CallerRunsPolicy<\/code> they would be dropped silently instead.","from":"exec-01"}],"cards":[{"front":"In what order does <code>ThreadPoolExecutor.execute<\/code> try its options?","back":"<p>Start a thread if below core; else queue; if the queue refuses, start a thread if below max; else reject.<\/p>"},{"front":"Why does <code>newFixedThreadPool(8)<\/code> never run more than 8 threads, whatever max you set?","back":"<p>Its <code>LinkedBlockingQueue<\/code> is unbounded, so the queue never refuses a task, and the pool only grows past core when the queue refuses.<\/p>"},{"front":"What queue does <code>newCachedThreadPool()<\/code> use, and what is the risk?","back":"<p>A <code>SynchronousQueue<\/code> (no capacity) with max <code>Integer.MAX_VALUE<\/code>, so every task that finds no idle thread gets a new thread. Threads grow without limit.<\/p>"},{"front":"What does <code>CallerRunsPolicy<\/code> do with an overflow task?","back":"<p>The thread that called <code>execute<\/code> runs it, which slows that producer down. After shutdown it drops the task.<\/p>"},{"front":"A pool with <code>DiscardPolicy<\/code> drops a task sent with <code>submit<\/code>. What happens to <code>future.get()<\/code>?","back":"<p>It blocks forever. The task never runs, so its Future never completes.<\/p>"},{"front":"What does <code>keepAliveTime<\/code> apply to by default?","back":"<p>Only to threads above <code>corePoolSize<\/code>. Call <code>allowCoreThreadTimeOut(true)<\/code> to let core threads retire too.<\/p>"},{"front":"When does a new extra thread pick up a queued task first?","back":"<p>It doesn't. A thread started by rule 3 runs the task that triggered it, so later tasks can overtake queued ones.<\/p>"}],"terms":[{"term":"corePoolSize","plain":"The number of threads the pool keeps, even when idle."},{"term":"maximumPoolSize","plain":"The most threads the pool may run, reached only when the queue is full."},{"term":"Work queue","plain":"The BlockingQueue where tasks wait for a free thread."},{"term":"Direct handoff","plain":"A SynchronousQueue: no storage, a task passes straight to an idle thread or not at all."},{"term":"RejectedExecutionHandler","plain":"The callback that decides what happens to a task the pool cannot take."},{"term":"Back-pressure","plain":"Slowing the producer down when the consumer can't keep up, instead of piling up work."},{"term":"Keep-alive time","plain":"How long an idle thread above core waits before it exits."}],"remote":true},"exec-03":{"id":"exec-03","track":"exec","n":3,"title":"Sizing a pool: CPU-bound, IO-bound and Little's law","ready":true,"minutes":35,"goal":"By the end you can size a pool from measurements: one thread per core for CPU work, Goetz's formula for work that waits, Little's law for traffic, and the smallest downstream limit as the ceiling.","quiz":[{"q":"A fraud-scoring job is pure CPU and runs on a pod with an 8-CPU limit. Someone raises its pool from 8 to 32 threads. What happens to throughput?","options":["It roughly quadruples","About the same, or a little worse from context switching","It doubles","It deadlocks"],"answer":1,"why":"Eight CPUs can run eight threads at a time. The other 24 threads only take turns on the same CPUs. For work that waits, more threads help; for pure computation they don't.","from":null},{"q":"A refunds endpoint receives 300 requests a second, and each takes 400 ms. How many requests are in flight on average?","options":["75","750","120","40"],"answer":2,"why":"L = λ x W = 300 x 0.4 = 120. Dividing 300 by 4, or multiplying by 2.5, are the tempting slips. Write the units down: requests per second times seconds gives requests.","from":null},{"q":"A service runs on 4 cores, aims for full CPU use, and each task computes for 10 ms and then waits 90 ms. What does Goetz's formula give?","options":["40","4","36","400"],"answer":0,"why":"4 x 1.0 x (1 + 90/10) = 4 x 10 = 40. The tempting 36 comes from using W/C alone instead of 1 + W/C; the 1 accounts for the time each task spends on the CPU.","from":null},{"q":"Authorizations, refunds and balance lookups share one pool of 64 threads. When the card issuer slows down, balance lookups, which never call the issuer, start timing out. What is the best fix?","options":["Double the pool to 128 threads","Switch the pool to an unbounded queue","Use CallerRunsPolicy","Put issuer calls behind their own limit (a bulkhead), so they can't use every thread"],"answer":3,"why":"Slow issuer calls fill every shared thread, so unrelated work starves. A bulkhead caps how many threads issuer calls may hold. Doubling the pool only delays the problem: Little's law fills 128 threads as surely as 64 when each call takes 3 s.","from":null},{"q":"From \"Inside ThreadPoolExecutor: core, max, queue, rejection\": a pool is <code>new ThreadPoolExecutor(20, 200, 60, SECONDS, new LinkedBlockingQueue&lt;&gt;())<\/code>. Traffic is 400 requests a second at 250 ms each. What happens?","options":["It grows to 200 threads, which is plenty","It stays at 20 threads, finishes at most 80 a second, and the queue grows without limit","It grows to exactly the 100 threads Little's law asks for","It rejects the excess requests"],"answer":1,"why":"With an unbounded queue the pool never grows past core, so 20 threads at 250 ms finish 20 / 0.25 = 80 a second. Little's law needs 100 in flight. The other 320 a second pile up in the queue, which never refuses, so nothing is ever rejected either.","from":"exec-02"}],"cards":[{"front":"How many threads for a pool doing pure CPU work?","back":"<p>About one per core: <code>Runtime.getRuntime().availableProcessors()<\/code> (Goetz suggests one more).<\/p>"},{"front":"Goetz's pool-size formula for tasks that wait?","back":"<p>threads = cores x target utilization x (1 + wait time / compute time).<\/p>"},{"front":"State Little's law.","back":"<p>L = λ x W: requests in flight = arrival rate x average time in the system.<\/p>"},{"front":"50 threads, each request holds a thread for 250 ms. Maximum throughput?","back":"<p>50 / 0.25 = 200 requests per second.<\/p>"},{"front":"Why don't threads beyond the database pool size speed up database-bound requests?","back":"<p>Each request needs a connection. The extra threads just wait in line for one.<\/p>"},{"front":"What is a bulkhead?","back":"<p>A separate concurrency limit per dependency (its own pool or a Semaphore), so one slow dependency can't take every thread.<\/p>"},{"front":"What does <code>availableProcessors()<\/code> return in a pod with a 2-CPU limit?","back":"<ol start=\"2\">\n<li>The JVM reads the container's CPU limit, not the host's core count.<\/li>\n<\/ol>"}],"terms":[{"term":"CPU-bound","plain":"Work limited by computation. More threads than cores don't help."},{"term":"I/O-bound","plain":"Work that mostly waits on the network or disk, so one core can serve many such tasks."},{"term":"Little's law","plain":"Requests in flight equal arrival rate times time spent in the system."},{"term":"Throughput","plain":"Work finished per unit of time, such as requests per second."},{"term":"Latency","plain":"How long one request takes from arrival to completion."},{"term":"Bulkhead","plain":"A per-dependency limit that keeps one slow dependency from using all the threads."},{"term":"Wait/compute ratio","plain":"How long a task waits divided by how long it computes. It decides how many threads one core can feed."}],"remote":true},"exec-04":{"id":"exec-04","track":"exec","n":4,"title":"Callable, Future, cancellation and interruption","ready":true,"minutes":35,"goal":"By the end you can wait for a task with a deadline, cancel it in a way that actually stops it, and handle InterruptedException so a stop request is never lost.","quiz":[{"q":"A task calls a ledger API that posts a debit. The caller's <code>get(500, MILLISECONDS)<\/code> throws <code>TimeoutException<\/code> and the caller does nothing else. What happens to the debit?","options":["It is cancelled automatically when get() times out","It may well still be posted, because the task keeps running","It is rolled back by the executor","The task receives the TimeoutException and stops"],"answer":1,"why":"The timeout is only about the caller's wait. The task has no idea anyone gave up, so it carries on and posts the debit. Only <code>cancel(true)<\/code> sends it a signal, and even that is just an interrupt.","from":null},{"q":"A worker runs <code>while (!Thread.currentThread().isInterrupted()) { work(); try { Thread.sleep(100); } catch (InterruptedException e) { log.warn(\"interrupted\"); } }<\/code>. The pool calls <code>shutdownNow()<\/code> while the worker sleeps. What happens?","options":["The worker stops at the next loop check","The worker throws and the pool replaces it","The worker logs a warning and keeps looping, because the exception cleared the flag","shutdownNow() waits until the worker finishes"],"answer":2,"why":"<code>sleep<\/code> clears the interrupt flag when it throws. The catch only logs, so the <code>while<\/code> check sees a clear flag and loops forever. Restore the flag in the catch, or <code>return<\/code> from it.","from":null},{"q":"You call <code>cancel(true)<\/code> on a task that is in a long CPU loop and never checks the interrupt flag. What do you see?","options":["<code>isCancelled()<\/code> is true at once, and the loop runs to the end anyway","<code>isCancelled()<\/code> stays false until the loop ends","The thread is stopped immediately","<code>cancel<\/code> returns false because the task is running"],"answer":0,"why":"The Future moves to CANCELLED as soon as <code>cancel<\/code> succeeds, and <code>cancel<\/code> returns true for a running task. The interrupt sets a flag the loop never reads, so the work continues. Java can't stop a thread from outside.","from":null},{"q":"You ask three FX-rate providers for EUR/USD and want the first successful answer, ignoring providers that fail, with the slower ones cancelled. Which tool fits?","options":["Submit each one and call <code>get()<\/code> on them in order","<code>invokeAll<\/code>, then pick the first SUCCESS","A single-thread executor, so they run one at a time","<code>invokeAny<\/code>"],"answer":3,"why":"<code>invokeAny<\/code> returns the first task that completes successfully and cancels the rest. <code>invokeAll<\/code> waits for every provider, so you pay for the slowest. Calling <code>get()<\/code> in order waits for the first provider even if the third is faster.","from":null},{"q":"From \"A thread's life: start, join, sleep, interrupt\": thread <code>t<\/code> is in <code>Thread.sleep(10_000)<\/code>. Another thread calls <code>t.interrupt()<\/code>. Inside <code>t<\/code>'s catch block, what does <code>Thread.currentThread().isInterrupted()<\/code> return?","options":["true, because the thread was just interrupted","false, because throwing InterruptedException cleared the flag","It throws IllegalThreadStateException","true until sleep's 10 seconds are up"],"answer":1,"why":"Blocking methods clear the interrupt flag when they throw <code>InterruptedException<\/code>. That's why a catch block that neither rethrows nor calls <code>Thread.currentThread().interrupt()<\/code> loses the stop request.","from":"conc-02"}],"cards":[{"front":"What does <code>cancel(true)<\/code> do to a task that is already running?","back":"<p>It calls <code>interrupt()<\/code> on the task's thread. The task stops only if it responds to the interrupt.<\/p>"},{"front":"You call <code>cancel(true)<\/code> and the task ignores the interrupt. What does <code>isCancelled()<\/code> return?","back":"<p><code>true<\/code>, immediately, even though the task keeps running to the end.<\/p>"},{"front":"Does <code>future.get(timeout)<\/code> stop the task when it throws <code>TimeoutException<\/code>?","back":"<p>No. It only ends your wait. Call <code>cancel(true)<\/code> if the work should stop.<\/p>"},{"front":"What happens to the interrupt flag when <code>sleep<\/code> throws <code>InterruptedException<\/code>?","back":"<p>It is cleared. Rethrow the exception or restore the flag with <code>Thread.currentThread().interrupt()<\/code>.<\/p>"},{"front":"What does <code>invokeAny(tasks)<\/code> return?","back":"<p>The result of the first task that succeeds. It cancels the others, and throws <code>ExecutionException<\/code> only if all fail.<\/p>"},{"front":"What does <code>resultNow()<\/code> do on a future that failed?","back":"<p>Throws <code>IllegalStateException<\/code>. Check <code>state()<\/code> first, or use <code>exceptionNow()<\/code> for FAILED.<\/p>"}],"terms":[{"term":"Callable","plain":"A task that returns a value and may throw a checked exception."},{"term":"Future","plain":"A handle to a task's result: wait for it, check its state, or cancel it."},{"term":"Interrupt","plain":"A request to a thread to stop what it is doing. It sets a flag and wakes blocking calls."},{"term":"Interrupt flag","plain":"The per-thread boolean that <code>interrupt()<\/code> sets and <code>InterruptedException<\/code> clears."},{"term":"Cooperative cancellation","plain":"Cancellation that works only if the task checks for it and stops itself."},{"term":"invokeAny","plain":"Run several tasks and return the first successful result, cancelling the rest."}],"remote":true},"exec-05":{"id":"exec-05","track":"exec","n":5,"title":"Scheduled executors: fixed rate vs fixed delay","ready":true,"minutes":35,"goal":"By the end you can pick between schedule, fixed rate and fixed delay, predict when each run starts, and keep a periodic task alive when one run throws.","quiz":[{"q":"A task scheduled with <code>scheduleAtFixedRate(task, 0, 1, SECONDS)<\/code> takes 3 seconds every time. What happens?","options":["Three copies run at once, one starting each second","Each run starts as soon as the previous one ends, so it runs back to back","The scheduler skips the missed slots and waits for the next whole second","The scheduler throws RejectedExecutionException"],"answer":1,"why":"Executions of one periodic task never overlap. Every run is overdue by the time the last one ends, so it starts immediately, and the task runs continuously. Missed slots are not skipped; they are run late.","from":null},{"q":"<code>scheduleWithFixedDelay(task, 0, 10, SECONDS)<\/code> runs a task that always takes 2 seconds. When do the first three runs start?","options":["0, 10 and 20 seconds","0, 2 and 12 seconds","0, 8 and 16 seconds","0, 12 and 24 seconds"],"answer":3,"why":"The delay is measured from the end of each run: run 1 ends at 2 s, so run 2 starts at 12 s, ends at 14 s, and run 3 starts at 24 s. 0, 10, 20 is what fixed rate would give.","from":null},{"q":"A periodic cache refresh throws a NullPointerException on its 40th run. Nothing catches it. What do you observe?","options":["It stops for good, nothing is logged, and its future reports isDone() = true","It logs the exception and runs again next period","The scheduler thread dies and is replaced, and the task keeps running","The scheduler shuts down"],"answer":0,"why":"Later executions are suppressed and the exception is stored in the <code>ScheduledFuture<\/code>. Nothing is printed, which is the dangerous part. The scheduler and its other tasks carry on as if nothing happened.","from":null},{"q":"A single-thread scheduler runs a 30-second heartbeat and a report job that sometimes takes 2 minutes. The issuer complains about missing heartbeats. What is the right fix?","options":["Raise the scheduler's maximum pool size","Switch the heartbeat to fixed delay","Give the report job its own scheduler, or have its scheduled task hand the work to another pool","Wrap the heartbeat in a try/catch"],"answer":2,"why":"With one thread, the heartbeat can't run while the report is running. Maximum pool size does nothing on a <code>ScheduledThreadPoolExecutor<\/code>, and fixed delay or a try/catch don't free the thread. Separate the slow job from the time-sensitive one.","from":null},{"q":"From \"Callable, Future, cancellation and interruption\": a periodic task is in the middle of a run when you call <code>cancel(false)<\/code> on its <code>ScheduledFuture<\/code>. What happens?","options":["The run in progress is interrupted and no more runs happen","The run in progress finishes, and no more runs happen","Nothing, because cancel(false) only affects tasks that have not started","The run in progress finishes, and the schedule continues"],"answer":1,"why":"<code>cancel(false)<\/code> does not interrupt a running task, so the current run completes. Cancelling still marks the future cancelled, so the scheduler never queues the next run. <code>cancel(true)<\/code> would also interrupt the current run.","from":"exec-04"}],"cards":[{"front":"<code>scheduleAtFixedRate<\/code> vs <code>scheduleWithFixedDelay<\/code>: what is the period measured from?","back":"<p>Fixed rate: from a timetable fixed at the start (initialDelay + n x period). Fixed delay: from the end of the previous run.<\/p>"},{"front":"A periodic task throws once, uncaught. What happens to later runs?","back":"<p>They are suppressed forever. Nothing is logged; the exception is in the ScheduledFuture.<\/p>"},{"front":"Can two runs of the same periodic task overlap?","back":"<p>No. A late run waits for the previous one to finish, on any number of threads.<\/p>"},{"front":"Why does <code>maximumPoolSize<\/code> do nothing on a ScheduledThreadPoolExecutor?","back":"<p>It is a fixed pool of core threads with an unbounded delay queue, so it never grows past core.<\/p>"},{"front":"What did JDK 25 add to ForkJoinPool for scheduling?","back":"<p>It implements ScheduledExecutorService (schedule, fixed rate, fixed delay) and adds <code>submitWithTimeout<\/code>.<\/p>"},{"front":"Why avoid <code>java.util.Timer<\/code>?","back":"<p>One thread for all tasks, and one task that throws kills that thread and cancels every task on the Timer.<\/p>"}],"terms":[{"term":"ScheduledExecutorService","plain":"An executor that can run tasks after a delay or periodically."},{"term":"Fixed rate","plain":"Runs due at fixed times (start + n x period), caught up after a late run."},{"term":"Fixed delay","plain":"A fixed gap between the end of one run and the start of the next."},{"term":"ScheduledFuture","plain":"The handle for a scheduled task: cancel it, check isDone, read its remaining delay."},{"term":"Suppressed execution","plain":"A periodic run that never happens because an earlier run threw."},{"term":"Delay queue","plain":"A queue ordered by due time that releases each task only when it comes due."}],"remote":true},"exec-06":{"id":"exec-06","track":"exec","n":6,"title":"CompletableFuture: composing async steps","ready":true,"minutes":35,"goal":"By the end you can build a non-blocking pipeline with supplyAsync, thenApply, thenCompose and thenCombine, say which thread runs each step, and keep blocking calls off the common pool.","quiz":[{"q":"<code>cards.findAsync(token)<\/code> returns <code>CompletableFuture&lt;Card&gt;<\/code> and <code>issuer.authorizeAsync(card)<\/code> returns <code>CompletableFuture&lt;Auth&gt;<\/code>. What is the type of <code>cards.findAsync(token).thenApply(issuer::authorizeAsync)<\/code>?","options":["<code>CompletableFuture&lt;Auth&gt;<\/code>","<code>CompletableFuture&lt;CompletableFuture&lt;Auth&gt;&gt;<\/code>","<code>Auth<\/code>","It doesn't compile"],"answer":1,"why":"<code>thenApply<\/code> wraps whatever the function returns, and this function returns a future. You get a future of a future, and nothing waits for the inner one. <code>thenCompose<\/code> flattens it to <code>CompletableFuture&lt;Auth&gt;<\/code>.","from":null},{"q":"<code>price()<\/code> and <code>rate()<\/code> each block for 200 ms. Which version finishes in about 200 ms?","options":["<code>supplyAsync(() -&gt; price(), io).thenCompose(p -&gt; supplyAsync(() -&gt; rate(), io).thenApply(p::multiply))<\/code>","<code>supplyAsync(() -&gt; price().multiply(rate()), io)<\/code>","<code>supplyAsync(() -&gt; price(), io).thenApply(p -&gt; p.multiply(rate()))<\/code>","<code>supplyAsync(() -&gt; price(), io).thenCombine(supplyAsync(() -&gt; rate(), io), BigDecimal::multiply)<\/code>"],"answer":3,"why":"Only the last one starts both calls before waiting for either. The other three are all asynchronous, but each runs <code>rate()<\/code> after <code>price()<\/code> has returned, so they take about 400 ms. Being async is not the same as running in parallel.","from":null},{"q":"Future <code>f<\/code> has already completed. Request thread <code>http-7<\/code> calls <code>f.thenApply(this::render)<\/code>. Which thread runs <code>render<\/code>?","options":["<code>http-7<\/code>, right away","A common pool worker","The thread that completed <code>f<\/code>","A new thread"],"answer":0,"why":"When the previous stage is already complete, a plain <code>thenApply<\/code> runs the function at once on the calling thread. The thread that completed <code>f<\/code> finished its work earlier and plays no part. Only <code>thenApplyAsync<\/code> would hand it to a pool.","from":null},{"q":"A service on JDK 21 runs in a container with 2 CPUs. It calls <code>supplyAsync(() -&gt; blockingLookup())<\/code> with no executor, 300 times a second. What happens?","options":["The lookups queue up behind a single common pool thread","They run on virtual threads","They run on the calling threads","Each lookup gets a new platform thread, with no upper limit"],"answer":3,"why":"With 2 CPUs the common pool's parallelism is 1, and before JDK 25 <code>CompletableFuture<\/code> didn't use the common pool when its parallelism was below 2. It created a thread per task instead. Option A is what JDK 25 does with the same code. Neither is acceptable for blocking work: pass an executor.","from":null},{"q":"From \"Sizing a pool\": a checkout runs the price call (100 ms) and the FX call (100 ms) side by side on <code>io<\/code>, and you get 200 checkouts a second. How many <code>io<\/code> threads are busy on average?","options":["20","40","200","400"],"answer":1,"why":"Little's law: L = lambda x W. Each checkout holds two <code>io<\/code> threads for 0.1 s, so the pool sees 400 calls a second x 0.1 s = 40 busy threads. Running the calls side by side cuts latency; it doesn't cut the number of threads you need. Size the pool above 40, and check that the downstreams accept that many calls.","from":"exec-03"}],"cards":[{"front":"<code>thenApply<\/code> vs <code>thenCompose<\/code>?","back":"<p><code>thenApply<\/code> maps with a plain function (<code>T -&gt; U<\/code>). <code>thenCompose<\/code> flattens a function that returns a future (<code>T -&gt; CompletableFuture&lt;U&gt;<\/code>), like <code>flatMap<\/code>.<\/p>"},{"front":"What does <code>a.thenCombine(b, fn)<\/code> do?","back":"<p>Waits until both <code>a<\/code> and <code>b<\/code> complete, then applies <code>fn(aResult, bResult)<\/code>. It starts nothing: <code>a<\/code> and <code>b<\/code> must already be running to overlap.<\/p>"},{"front":"Which executor does <code>supplyAsync(task)<\/code> use on JDK 25?","back":"<p><code>ForkJoinPool.commonPool()<\/code>, always. Up to JDK 24 it used a new thread per task when the common pool's parallelism was below 2.<\/p>"},{"front":"Which thread runs a plain <code>thenApply<\/code> step?","back":"<p>The thread that completes the previous stage, or the calling thread if that stage is already complete.<\/p>"},{"front":"<code>join()<\/code> vs <code>get()<\/code> on a failed CompletableFuture?","back":"<p><code>get()<\/code> throws checked <code>ExecutionException<\/code>, <code>join()<\/code> throws unchecked <code>CompletionException<\/code>. Both carry the failure as the cause.<\/p>"},{"front":"Why pass an executor to <code>supplyAsync<\/code> for blocking calls?","back":"<p>Without one, the calls hold common pool threads, which every parallel stream and default-executor future in the JVM shares.<\/p>"}],"terms":[{"term":"CompletableFuture","plain":"A Future you can complete by hand and attach further steps to."},{"term":"Stage","plain":"One step in a pipeline: a future plus the function that produces it from earlier results."},{"term":"thenCompose","plain":"Attach a step that returns another future, and get one flat future back."},{"term":"thenCombine","plain":"Wait for two futures and merge their results with a function."},{"term":"Default async executor","plain":"Where async methods run when you pass no executor: the common ForkJoinPool."},{"term":"Common pool","plain":"One ForkJoinPool per JVM, with cores minus one threads, shared by parallel streams and default async tasks."}],"remote":true},"exec-07":{"id":"exec-07","track":"exec","n":7,"title":"CompletableFuture: errors, timeouts and fan-out","ready":true,"minutes":35,"goal":"By the end you can recover from a failure at the right stage, unwrap CompletionException, give each call its own timeout, and fan out to several providers without one bad answer failing the whole request.","quiz":[{"q":"Each step prints its letter: <code>supplyAsync(fails, io).thenApply(A).whenComplete(B).exceptionally(C).thenAccept(D)<\/code>, and the supplier throws. What prints?","options":["A, B, C, D","B, C, D","C, D","B and C, then the pipeline fails"],"answer":1,"why":"<code>A<\/code> is skipped because its input failed. <code>whenComplete<\/code> runs on failure too but passes the failure on, so <code>C<\/code> runs and recovers, and <code>D<\/code> runs with the fallback value. Recovery in <code>exceptionally<\/code> makes everything after it see a success.","from":null},{"q":"<code>supplyAsync(() -&gt; { throw new IllegalStateException(\"502\"); }, io).exceptionally(ex -&gt; ...)<\/code>. What is the class of <code>ex<\/code>?","options":["<code>ExecutionException<\/code>","<code>IllegalStateException<\/code>","<code>RuntimeException<\/code>","<code>CompletionException<\/code>, with the <code>IllegalStateException<\/code> as its cause"],"answer":3,"why":"The exception was thrown inside a stage, so the future stores it wrapped in a <code>CompletionException<\/code>. <code>ExecutionException<\/code> is what <code>get()<\/code> throws at the blocking edge. You would get the raw <code>IllegalStateException<\/code> only if someone had called <code>completeExceptionally<\/code> with it.","from":null},{"q":"Quote calls run on a fixed pool of 20 threads with <code>orTimeout(300, MILLISECONDS)<\/code>. A provider hangs for 30 s, and 100 requests arrive in one second. What happens?","options":["The first 20 time out at 300 ms but keep their threads; later calls queue behind them, so they time out too, even to healthy providers","Every request times out at 300 ms and the pool stays free","<code>orTimeout<\/code> interrupts the hung calls, so the threads come back at 300 ms","The pool rejects the 21st request"],"answer":0,"why":"<code>orTimeout<\/code> completes the future but never touches the task, so each hung call holds its thread for 30 s. A fixed pool has an unbounded queue, so nothing is rejected: new calls just wait behind the hung ones until their own deadlines pass. A client-side timeout and a per-provider limit prevent it.","from":null},{"q":"You want a metric for every FX call, tagged success or failure, without changing what the caller receives. Which method fits?","options":["<code>exceptionally<\/code>","<code>handle<\/code>","<code>whenComplete<\/code>","<code>thenAccept<\/code>"],"answer":2,"why":"<code>whenComplete<\/code> sees both outcomes and passes the original one on. <code>handle<\/code> sees both too, but you'd have to rebuild the outcome yourself (rethrowing the failure), which is easy to get wrong. <code>exceptionally<\/code> misses successes and <code>thenAccept<\/code> misses failures.","from":null},{"q":"From \"Callable, Future, cancellation and interruption\": the same blocking call, sleeping in <code>Thread.sleep<\/code>, runs twice: once via <code>executor.submit(task)<\/code> and once via <code>CompletableFuture.supplyAsync(task, executor)<\/code>. You call <code>cancel(true)<\/code> on both futures. What happens?","options":["Both calls are interrupted","Only the <code>submit<\/code> call is interrupted; the <code>CompletableFuture<\/code> one keeps sleeping","Only the <code>CompletableFuture<\/code> call is interrupted","Neither, because <code>cancel<\/code> only affects tasks that haven't started"],"answer":1,"why":"<code>submit<\/code> returns a <code>FutureTask<\/code>, whose <code>cancel(true)<\/code> interrupts the worker thread. <code>CompletableFuture.cancel<\/code> ignores the flag: it completes the future with <code>CancellationException<\/code> and leaves the task alone. Both futures report <code>isCancelled() == true<\/code>.","from":"exec-04"}],"cards":[{"front":"Which CompletableFuture handler sees a failure but can't change the outcome?","back":"<p><code>whenComplete<\/code>. It passes the original result or failure on. <code>exceptionally<\/code> and <code>handle<\/code> can replace it.<\/p>"},{"front":"A handler on a failed <code>supplyAsync<\/code> future: which exception does it get?","back":"<p>A <code>CompletionException<\/code>, with the exception the task threw as <code>getCause()<\/code>.<\/p>"},{"front":"Does <code>orTimeout<\/code> stop the task?","back":"<p>No. It completes the future with <code>TimeoutException<\/code> and the task keeps running, holding its thread.<\/p>"},{"front":"Does <code>cancel(true)<\/code> interrupt a CompletableFuture's task?","back":"<p>No. The flag has no effect. The future completes with <code>CancellationException<\/code>; the task runs on.<\/p>"},{"front":"One of three futures fails at 50 ms, the slowest takes 300 ms. When does <code>allOf<\/code> complete?","back":"<p>At 300 ms, exceptionally. <code>allOf<\/code> waits for all of them; it doesn't fail fast.<\/p>"},{"front":"What does <code>anyOf<\/code> give you if the fastest future fails?","back":"<p>A failure. <code>anyOf<\/code> completes like the first future to complete, success or failure.<\/p>"},{"front":"When do you use <code>exceptionallyCompose<\/code> instead of <code>exceptionally<\/code>?","back":"<p>When the fallback is itself a future, such as a call to a backup provider (JDK 12+).<\/p>"}],"terms":[{"term":"CompletionException","plain":"The unchecked wrapper CompletableFuture puts around an exception thrown inside a stage."},{"term":"exceptionally","plain":"Runs only on failure and replaces it with a value."},{"term":"handle","plain":"Runs on success or failure and returns a new result either way."},{"term":"whenComplete","plain":"Runs on success or failure to observe; passes the outcome on unchanged."},{"term":"orTimeout","plain":"Fails the future with TimeoutException if it isn't done in time. The work keeps running."},{"term":"completeOnTimeout","plain":"Completes the future with a default value if it isn't done in time."},{"term":"allOf / anyOf","plain":"Combine many futures: wait for all of them, or take the first to complete."}],"remote":true},"exec-08":{"id":"exec-08","track":"exec","n":8,"title":"ForkJoinPool, work stealing and parallel streams","ready":true,"minutes":35,"goal":"By the end you can write a RecursiveTask that really runs in parallel, explain how work stealing keeps the workers busy, and say when a parallel stream helps and when it starves the whole JVM.","quiz":[{"q":"Which <code>compute()<\/code> body lets the two halves run at the same time?","options":["<code>left.fork(); long l = left.join(); return l + right.compute();<\/code>","<code>return left.compute() + right.compute();<\/code>","<code>left.fork(); long r = right.compute(); return left.join() + r;<\/code>","<code>long r = right.compute(); left.fork(); return left.join() + r;<\/code>"],"answer":2,"why":"Only the third one makes the left half stealable and then keeps this thread busy with the right half while a thief can run the left. The first and last both wait for one half before the other is available, and the second never forks at all. All four give the right answer, which is why the bug is easy to miss.","from":null},{"q":"An 8-core pod runs <code>cardIds.parallelStream().map(issuer::lookup).toList()<\/code>, and each lookup takes 120 ms. What is the biggest risk?","options":["None: parallel streams run on virtual threads","The lookups occupy the common pool's 7 workers, so other parallel streams and executor-less <code>CompletableFuture<\/code> tasks in the JVM wait behind them","The stream silently falls back to running sequentially because the calls block","It throws, because blocking isn't allowed in a <code>ForkJoinPool<\/code>"],"answer":1,"why":"Parallel streams use the common pool's platform workers, which the whole JVM shares, and the pool can't tell that a worker is blocked. Nothing throws and nothing falls back: everything else that needs the common pool just waits. Run the lookups on an IO executor instead.","from":null},{"q":"<code>List&lt;String&gt; ids = new ArrayList&lt;&gt;(); payments.parallelStream().forEach(p -&gt; ids.add(p.id()));<\/code> runs over 100,000 payments. What do you get, most of the time?","options":["Fewer than 100,000 ids, or an <code>ArrayIndexOutOfBoundsException<\/code>","All 100,000 ids, in the original order","All 100,000 ids, in a scrambled order","A <code>ConcurrentModificationException<\/code>, every time"],"answer":0,"why":"Several threads call <code>add<\/code> on one <code>ArrayList<\/code>, which isn't thread-safe: writes race on the size and the backing ar
