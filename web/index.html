e can be held by only one thread at a time. Every lock has it.<\/p>"},{"front":"Deadlock condition 2: what is hold and wait?","back":"<p>A thread holds one resource while waiting for another.<\/p>"},{"front":"Deadlock condition 3: what is no preemption?","back":"<p>Nobody can take a resource away from the thread that holds it; only the holder can release it.<\/p>"},{"front":"Deadlock condition 4: what is circular wait?","back":"<p>A cycle of threads, each waiting for a resource the next one holds: T1 waits for T2, T2 waits for T1.<\/p>"},{"front":"How does a global lock order prevent deadlock?","back":"<p>Every thread takes locks in the same order (for example lower id first), so no cycle can form. It breaks circular wait.<\/p>"},{"front":"Deadlock vs livelock vs starvation, in one line each.","back":"<p>Deadlock: threads wait forever for each other. Livelock: threads stay busy reacting to each other and make no progress. Starvation: others progress, one thread never gets a turn.<\/p>"},{"front":"What does <code>jcmd &lt;pid&gt; Thread.print<\/code> print when it finds a lock cycle?","back":"<p><code>Found one Java-level deadlock:<\/code>, then each thread, the lock it waits for and who holds it, then their stacks, ending with <code>Found 1 deadlock.<\/code><\/p>"}],"terms":[{"term":"Deadlock","plain":"Threads that each wait for a resource another one holds, so none can ever proceed."},{"term":"Livelock","plain":"Threads that keep reacting to each other, busy but making no progress."},{"term":"Starvation","plain":"One thread never gets the resource it needs while others keep getting it."},{"term":"Lock ordering","plain":"A rule that every thread takes locks in the same global order."},{"term":"Wait-for graph","plain":"A picture of which thread waits for which. A cycle in it is a deadlock."},{"term":"Thread dump","plain":"A snapshot of every thread's state and stack, from <code>jcmd Thread.print<\/code> or <code>jstack<\/code>."}],"remote":true},"conc-07":{"id":"conc-07","track":"conc","n":7,"title":"Explicit locks: ReentrantLock, Condition, ReadWriteLock","ready":true,"minutes":38,"goal":"By the end you can use <code>ReentrantLock<\/code> safely (try/finally, <code>tryLock<\/code>, <code>lockInterruptibly<\/code>), give each kind of waiter its own <code>Condition<\/code>, and use a read-write lock without the upgrade deadlock.","quiz":[{"q":"A request handler needs the ledger lock, but must answer 503 if it can't get the lock within 50 ms. Which tool fits?","options":["<code>synchronized (ledger)<\/code>","<code>ledger.lockInterruptibly()<\/code>","<code>ledger.tryLock(50, TimeUnit.MILLISECONDS)<\/code>","A <code>volatile boolean busy<\/code> flag checked before <code>lock()<\/code>"],"answer":2,"why":"<code>tryLock<\/code> with a timeout waits at most 50 ms and returns <code>false<\/code> if the lock is still taken. <code>lockInterruptibly<\/code> waits without a limit unless someone interrupts the thread. <code>synchronized<\/code> can't time out at all. A <code>volatile<\/code> flag checked before locking is check-then-act: the lock can be taken between the check and the <code>lock()<\/code> call.","from":null},{"q":"Kotlin code: <code>rw.read { if (cache[k] == null) rw.write { cache[k] = load(k) } }<\/code>. Two threads ask for the same missing key. What can happen?","options":["Both hang, because a read lock can't be upgraded","<code>load(k)<\/code> can run twice, because <code>write { }<\/code> releases the read lock before it takes the write lock","Nothing bad: <code>write { }<\/code> upgrades atomically","It throws <code>IllegalMonitorStateException<\/code>"],"answer":1,"why":"Kotlin's <code>write<\/code> releases this thread's read locks, takes the write lock, and restores the read locks after. Both threads can see <code>null<\/code>, both release, and each then loads in turn. It doesn't hang, but it isn't atomic. Re-check inside <code>write<\/code>, for example with <code>getOrPut<\/code>.","from":null},{"q":"From wait, notify and guarded blocks: a teammate merges <code>notFull<\/code> and <code>notEmpty<\/code> into one <code>Condition changed<\/code>, but keeps <code>changed.signal()<\/code> in both <code>put<\/code> and <code>take<\/code>. With several producers and consumers, what can happen?","options":["Nothing changes: <code>signal()<\/code> always wakes the right kind of thread","Items are lost","It throws, because two methods can't share one Condition","Everything can stall: a <code>signal()<\/code> meant for a consumer can wake a producer, which waits again, and no one signals the consumers"],"answer":3,"why":"With one queue for both kinds of waiter, <code>signal()<\/code> may pick the wrong kind. That thread re-checks, waits again, and the signal is gone. It is the same lost wake-up that made the one-monitor buffer need <code>notifyAll()<\/code>. With one condition, use <code>signalAll()<\/code>; with two, <code>signal()<\/code> is fine.","from":"conc-05"},{"q":"With <code>StampedLock<\/code>, you call <code>tryOptimisticRead()<\/code> and copy <code>bid<\/code> and <code>ask<\/code> into locals. What must happen before you use them?","options":["Call <code>validate(stamp)<\/code>; if it returns false, read them again under <code>readLock()<\/code>","Nothing: the stamp guarantees a consistent read","Call <code>unlockRead(stamp)<\/code>","Call <code>tryConvertToWriteLock(stamp)<\/code>"],"answer":0,"why":"An optimistic read takes no lock, so a writer can change the fields while you copy them. <code>validate<\/code> tells you whether a writer got in since the stamp. Only after it returns <code>true<\/code> are the copies known to be consistent. There is nothing to release, because nothing was locked.","from":null},{"q":"A dump shows 40 worker threads <code>WAITING (parking)<\/code> in <code>ReentrantLock.lock()<\/code>. <code>Thread.print -l<\/code> says the lock is owned by <code>kafka-consumer-3<\/code>, whose stack shows it idle inside <code>poll()<\/code>. What is the most likely bug?","options":["A deadlock between the workers","The lock is unfair, so the workers are starving","A code path in the consumer took the lock and left without <code>unlock()<\/code>, for example on an exception with no <code>finally<\/code>","<code>poll()<\/code> holds the lock internally"],"answer":2,"why":"The owner isn't waiting for anything you'd expect, and it isn't in the critical section. It has moved on while still holding the lock, which happens when an exception or an early return skips the release. An unfair lock would still hand over now and then, and a deadlock needs the owner to wait for a lock too.","from":null}],"cards":[{"front":"Where do <code>lock()<\/code> and <code>unlock()<\/code> go relative to <code>try<\/code>/<code>finally<\/code>?","back":"<p><code>lock()<\/code> on the line right before <code>try<\/code>. <code>unlock()<\/code> as the first statement of <code>finally<\/code>. In Kotlin, <code>lock.withLock { }<\/code> does both.<\/p>"},{"front":"What does <code>lock.tryLock(50, MILLISECONDS)<\/code> do when another thread holds the lock?","back":"<p>It waits up to 50 ms. It returns <code>true<\/code> (and you hold the lock) if it got it in time, <code>false<\/code> otherwise. It throws <code>InterruptedException<\/code> if interrupted while waiting.<\/p>"},{"front":"A thread waits in <code>lockInterruptibly()<\/code> and another thread interrupts it. What happens? And for a thread waiting to enter <code>synchronized<\/code>?","back":"<p><code>lockInterruptibly()<\/code> gives up at once with <code>InterruptedException<\/code>. The <code>synchronized<\/code> waiter keeps waiting until it gets the monitor; it only sees its interrupt flag afterwards.<\/p>"},{"front":"Why can a bounded buffer with <code>notFull<\/code> and <code>notEmpty<\/code> conditions use <code>signal()<\/code> instead of <code>signalAll()<\/code>?","back":"<p>Each condition has only one kind of waiter, and one change (one item in, or one slot free) lets exactly one of them proceed.<\/p>"},{"front":"A thread holding the read lock of a <code>ReentrantReadWriteLock<\/code> calls <code>writeLock().lock()<\/code>. What happens?","back":"<p>It waits forever. The write lock waits for every reader to leave, including this thread. Release the read lock first, then re-check under the write lock.<\/p>"},{"front":"After <code>long s = lock.tryOptimisticRead()<\/code> and copying fields into locals, what must you do?","back":"<p>Call <code>lock.validate(s)<\/code>. If it returns false, a writer got in: read the fields again under <code>lock.readLock()<\/code>.<\/p>"},{"front":"In Kotlin, what does <code>rw.write { }<\/code> do when called inside <code>rw.read { }<\/code>?","back":"<p>It releases this thread's read locks, takes the write lock, and restores the read locks afterwards. It doesn't hang, but it isn't atomic: re-check inside the block.<\/p>"}],"terms":[{"term":"ReentrantLock","plain":"An explicit lock with the same rules as <code>synchronized<\/code>, plus <code>tryLock<\/code>, timeouts, interruptible waits, fairness and conditions."},{"term":"Hold count","plain":"How many times the owning thread has taken a reentrant lock. It must release it as many times."},{"term":"Condition","plain":"A wait queue tied to a lock. <code>await()<\/code> releases the lock and waits; <code>signal()<\/code> wakes one waiter."},{"term":"Fair lock","plain":"A lock that hands over to the longest-waiting thread instead of letting new arrivals barge in."},{"term":"Read-write lock","plain":"A pair of locks: many threads may hold the read lock together; the write lock is exclusive."},{"term":"Lock upgrade","plain":"Going from a read lock to a write lock while still holding the read lock. <code>ReentrantReadWriteLock<\/code> hangs if you try."},{"term":"Optimistic read","plain":"A <code>StampedLock<\/code> read that takes no lock and checks afterwards, with <code>validate<\/code>, that no writer got in."}],"remote":true},"conc-08":{"id":"conc-08","track":"conc","n":8,"title":"Atomics and compare-and-set","ready":false},"conc-09":{"id":"conc-09","track":"conc","n":9,"title":"Concurrent collections","ready":false},"conc-10":{"id":"conc-10","track":"conc","n":10,"title":"Synchronizers: latch, barrier, semaphore, phaser","ready":false},"conc-11":{"id":"conc-11","track":"conc","n":11,"title":"Don't share: immutability, confinement, ThreadLocal","ready":false},"conc-12":{"id":"conc-12","track":"conc","n":12,"title":"Classic problems: producer-consumer, philosophers, readers-writers","ready":false},"conc-13":{"id":"conc-13","track":"conc","n":13,"title":"Testing and debugging concurrent code","ready":false},"jmm-01":{"id":"jmm-01","track":"jmm","n":1,"title":"Why your loop never stops: caches and reordering","ready":true,"minutes":35,"goal":"By the end you can explain why a plain stop flag can hang a loop forever, tell a compiler effect from a CPU effect, and fix the bug with volatile.","quiz":[{"q":"A health checker runs <code>while (!done) { Thread.sleep(10); }<\/code> on a plain <code>boolean done<\/code>. It has worked in production for two years. Is it correct?","options":["Yes, because <code>Thread.sleep<\/code> flushes the CPU caches","Yes, because the loop body is not empty","No. The JMM lets the read of <code>done<\/code> happen once; HotSpot re-reads after <code>sleep<\/code> today, but nothing promises it","No, because <code>Thread.sleep<\/code> inside a loop always throws InterruptedException"],"answer":2,"why":"<code>sleep<\/code> has no synchronization effect in the JMM. HotSpot happens to re-read the field after a call it can't see into, which is why the loop works today. Caches don't need flushing (they are coherent), and the body being non-empty is not a rule anywhere. Make <code>done<\/code> volatile.","from":null},{"q":"<code>ReorderDemo<\/code> still shows both threads reading 0 when you run it with <code>-Xint<\/code>. What causes those outcomes?","options":["The JIT reordering the write and the read","Each core's store buffer: the read runs before the core's own write is visible to the other core","<code>javac<\/code> reordering the two statements","The garbage collector moving the objects between the write and the read"],"answer":1,"why":"<code>-Xint<\/code> disables the JIT, so compiler reordering is ruled out, and <code>javac<\/code> keeps statement order. What's left is the hardware: a write waits in the store buffer while the next read goes ahead. A volatile write drains the buffer first, which is why the volatile count is 0.","from":null},{"q":"A stop-flag loop hangs with the JIT on and stops under <code>-Xint<\/code>. What is the best explanation?","options":["The worker's CPU cache never receives the new value","The compiled loop read the field once and keeps using a register copy","The interpreter runs on a single core, so there is no second cache","The main thread's write is still sitting in its store buffer"],"answer":1,"why":"Caches and store buffers are identical in both runs, so they can't explain the difference. Only the JIT changes. C2 hoisted the read out of the loop, which as-if-serial allows for a plain field. A store buffer drains in nanoseconds, so it can't cause a hang.","from":null},{"q":"<code>FxRateBoard<\/code> writes <code>rates = map; ready = true;<\/code> and readers spin <code>while (!ready) {}<\/code> and then return <code>rates<\/code>. Which change makes it correct?","options":["Make <code>rates<\/code> volatile and leave <code>ready<\/code> plain","Make <code>ready<\/code> volatile and leave <code>rates<\/code> plain","Add <code>Thread.onSpinWait()<\/code> inside the loop","Swap the two lines in <code>publish<\/code> so <code>ready<\/code> is set first"],"answer":1,"why":"The loop reads <code>ready<\/code>, so that is the read the JIT must not hoist. Because <code>rates<\/code> is written before the volatile write and read after the volatile read sees <code>true<\/code>, the reader also sees the map. Making only <code>rates<\/code> volatile still lets the loop on <code>ready<\/code> spin forever, and swapping the lines would let a reader see <code>ready == true<\/code> with <code>rates<\/code> still null.","from":null},{"q":"From the threads track: <code>count<\/code> is a <code>volatile int<\/code>, and two threads each run <code>count++<\/code> a million times. What does <code>count<\/code> usually hold at the end?","options":["Exactly 2,000,000, because volatile makes every access go to memory","Less than 2,000,000, because <code>count++<\/code> is still a read, an add and a write","Exactly 1,000,000, because each thread overwrites the other","It doesn't compile: <code>++<\/code> isn't allowed on a volatile field"],"answer":1,"why":"<code>volatile<\/code> makes each read and each write visible, but it doesn't merge them into one step. Two threads can still read the same value and both write value + 1. Visibility and atomicity are different problems; lesson 3 of this track takes them apart.","from":"conc-03"}],"cards":[{"front":"Why can <code>while (!stop) {}<\/code> spin forever when <code>stop<\/code> is a plain boolean?","back":"<p>The JIT may read <code>stop<\/code> once, keep it in a register and compile the loop to <code>while (true)<\/code>. Nothing tells it another thread writes the field.<\/p>"},{"front":"The stop-flag hang disappears under <code>java -Xint<\/code>. What does that prove?","back":"<p>The hang is a compiler effect. The interpreter reads the field on every pass; caches are the same in both runs.<\/p>"},{"front":"Can a CPU cache hold a stale value forever while another core writes it?","back":"<p>No. Caches are coherent: a write invalidates or updates other cores' copies, usually within nanoseconds.<\/p>"},{"front":"What is a store buffer?","back":"<p>A small queue where a core parks its writes on the way to the cache. The core's later reads can complete before those writes are visible to other cores.<\/p>"},{"front":"Thread A: <code>x = 1; r1 = y;<\/code> Thread B: <code>y = 1; r2 = x;<\/code> Plain ints, both start at 0. Can <code>r1 == 0 &amp;&amp; r2 == 0<\/code>?","back":"<p>Yes, through store buffers or JIT reordering. With both fields volatile, no.<\/p>"},{"front":"Does adding <code>Thread.sleep<\/code> or a log line to a spin loop fix a plain stop flag?","back":"<p>No. It hides the bug on today's HotSpot because the JIT re-reads after calls it can't see into. The JMM promises nothing. Use <code>volatile<\/code>.<\/p>"},{"front":"What is the as-if-serial rule?","back":"<p>Compilers and CPUs may reorder or remove work as long as a single thread running alone can't tell the difference.<\/p>"}],"terms":[{"term":"Visibility","plain":"Whether and when a write by one thread can be seen by a read in another thread."},{"term":"Hoisting","plain":"The JIT moving a read out of a loop because it believes the value can't change inside the loop."},{"term":"Store buffer","plain":"A per-core queue of pending writes. It lets the core keep running before its writes reach the cache."},{"term":"Cache coherence","plain":"The hardware protocol that keeps every core's cache in agreement about each memory location."},{"term":"As-if-serial","plain":"Optimizers may change anything a single thread can't observe."},{"term":"Data race","plain":"Two threads access the same variable, at least one writes, and no synchronization orders the two accesses."},{"term":"volatile","plain":"A field modifier: reads and writes go to memory in order, and they link threads in the memory model."}],"remote":true},"jmm-02":{"id":"jmm-02","track":"jmm","n":2,"title":"Happens-before, the rules that matter","ready":true,"minutes":35,"goal":"By the end you can name the happens-before edge that makes a read see a write, spot a data race where no edge exists, and fix it with the right lock, volatile field, join or java.util.concurrent handoff.","quiz":[{"q":"<code>setStatus<\/code> writes inside <code>synchronized (paymentLock)<\/code>. <code>getStatus<\/code> reads inside <code>synchronized (auditLock)<\/code>. Is the getter guaranteed to see the latest status?","options":["Yes, because both methods are synchronized","No: the edge exists only between releasing a monitor and a later acquire of the same monitor","Yes, because entering any synchronized block refreshes all fields from memory","No, because a field can't be read inside a synchronized block"],"answer":1,"why":"Two different monitors give no edge. The idea that any <code>synchronized<\/code> block refreshes everything comes from thinking of locks as memory barriers. The JMM only promises the edge for the same monitor, and the JIT is allowed to optimize accordingly.","from":null},{"q":"T1 runs <code>x = 1; v = 1;<\/code> where <code>v<\/code> is volatile and <code>x<\/code> is plain. T2 reads <code>v<\/code> and gets 0, then reads <code>x<\/code>. What can T2 see for <code>x<\/code>?","options":["Always 0, because T1 hasn't written <code>v<\/code> yet","Always 1, because volatile flushes every earlier write","Either 0 or 1: T2's read of <code>v<\/code> didn't see the write, so no edge covers <code>x<\/code>","It throws, because reading a plain field next to a volatile is illegal"],"answer":2,"why":"The volatile edge forms only when the read sees the write. T2 saw 0, so it has no edge to T1's writes, and its read of <code>x<\/code> races with <code>x = 1<\/code>. T1 may well have already written <code>x<\/code>, which is why option 1 is wrong too.","from":null},{"q":"<code>main<\/code> fills a plain <code>HashMap<\/code> with 10,000 entries, then calls <code>executor.submit(() -&gt; lookup(map))<\/code> and never touches the map again. Is the task's read safe?","options":["Yes: submitting to an executor happens-before the task starts, and nobody writes after that","No, because <code>HashMap<\/code> is not thread-safe","Only if the map field is volatile","Only if you switch to <code>ConcurrentHashMap<\/code>"],"answer":0,"why":"<code>HashMap<\/code> is unsafe for concurrent writes, but here all writes come before the handoff and none after. The submit edge makes them visible to the task. Volatile or <code>ConcurrentHashMap<\/code> would add cost and no safety.","from":null},{"q":"A worker thread writes <code>result<\/code>. Which of these does NOT give <code>main<\/code> a happens-before edge to that write?","options":["<code>worker.join()<\/code> returns","<code>future.get()<\/code> returns, where the worker is the future's task","<code>latch.await()<\/code> returns, after the worker wrote and then called <code>latch.countDown()<\/code>","<code>Thread.sleep(1_000)<\/code> returns"],"answer":3,"why":"<code>join<\/code>, <code>Future.get<\/code> and the latch are all documented edges. <code>sleep<\/code> only passes time. The worker may not be done, and even if it is, a read after a sleep still races with its write.","from":null},{"q":"From lesson 1 of this track: you add <code>Thread.onSpinWait()<\/code> to a spin loop on a plain flag, and the loop starts noticing the flag. In memory model terms, what changed?","options":["The loop now has a happens-before edge to the writer","Nothing: there is still no edge, HotSpot just happens to re-read the field","<code>onSpinWait<\/code> makes the next read volatile","<code>onSpinWait<\/code> flushes the writer's store buffer"],"answer":1,"why":"<code>onSpinWait<\/code> is a hint to the CPU, with no synchronization effect in the JMM. HotSpot happens to re-read the field after it today. The program still has a data race on the flag, and only a volatile, a lock or another real edge fixes it.","from":"jmm-01"}],"cards":[{"front":"When is a write in one thread guaranteed visible to a read in another?","back":"<p>Only when the write happens-before the read.<\/p>"},{"front":"State the monitor rule of happens-before.","back":"<p>Releasing a lock happens-before every later acquisition of the same lock.<\/p>"},{"front":"T1 writes inside <code>synchronized (a)<\/code>. T2 reads inside <code>synchronized (b)<\/code>. Is there an edge?","back":"<p>No. The edge needs the same monitor on both sides.<\/p>"},{"front":"State the volatile rule of happens-before.","back":"<p>A write to a volatile field happens-before every read of that same field that sees it (or a later write).<\/p>"},{"front":"What does <code>Thread.start()<\/code> guarantee to the new thread?","back":"<p>Everything the parent did before calling <code>start()<\/code> is visible to the new thread. Writes after <code>start()<\/code> are not covered.<\/p>"},{"front":"Is <code>Thread.sleep(100)<\/code> a happens-before edge?","back":"<p>No. Use <code>join()<\/code>, <code>Future.get()<\/code> or a latch.<\/p>"},{"front":"What is a data race?","back":"<p>Two threads access the same variable, at least one access is a write, and no happens-before edge orders them.<\/p>"}],"terms":[{"term":"Happens-before","plain":"The memory model's ordering between two actions. If a write happens-before a read, the read sees it."},{"term":"Program order","plain":"The order of actions within one thread, as the code is written."},{"term":"Release","plain":"The sending end of an edge: leaving a lock, writing a volatile, <code>countDown()<\/code>, <code>put<\/code> into a concurrent queue."},{"term":"Acquire","plain":"The receiving end of an edge: entering a lock, reading a volatile, <code>await()<\/code>, <code>take<\/code> from a concurrent queue."},{"term":"Data race","plain":"Conflicting accesses to one variable from two threads with no happens-before edge between them."},{"term":"DRF-SC","plain":"The JMM promise: a program free of data races behaves as if its threads were interleaved one action at a time."},{"term":"Piggybacking","plain":"Relying on transitivity so one volatile or lock edge also publishes the plain writes made before it."}],"remote":true},"jmm-03":{"id":"jmm-03","track":"jmm","n":3,"title":"volatile: what it gives you and what it doesn't","ready":true,"minutes":35,"goal":"By the end you can say exactly what volatile guarantees, show why it doesn't make count++ safe, and choose between volatile, an atomic and a lock for any shared field.","quiz":[{"q":"Many request threads run <code>balance += amount<\/code> on a <code>volatile long balance<\/code>. What can go wrong?","options":["Two threads can read the same balance and both write, so one amount is lost","Nothing: volatile makes the whole statement atomic","The 64-bit write can tear into two halves","Readers may never see the new balance"],"answer":0,"why":"<code>+=<\/code> is read, add, write. Volatile makes each step visible and ordered but leaves the gap between them. Tearing is ruled out because the field is volatile, and visibility is fine, which is what makes the bug easy to miss.","from":null},{"q":"Which of these fields is correctly protected by <code>volatile<\/code> alone?","options":["A request counter that every request thread increments","A reference to an immutable <code>RateTable<\/code> that one scheduler thread replaces every minute","<code>limit<\/code> and <code>spent<\/code>, which are checked together before every authorization","A <code>volatile ArrayList&lt;Fee&gt;<\/code> that several threads add fees to"],"answer":1,"why":"One writer, a whole-object replace, and readers that need only the latest reference: that's exactly volatile's job. The counter needs an atomic, the pair needs a lock, and the volatile list protects only the reference while <code>ArrayList.add<\/code> races.","from":null},{"q":"In <code>HalfVolatileDemo<\/code> only <code>x<\/code> is volatile. Why do both threads still sometimes read 0?","options":["The volatile write to <code>x<\/code> is lost","Volatile only works between two volatile fields of the same object","Thread B's plain write to <code>y<\/code> can wait in its store buffer while B reads <code>x<\/code>, so B's own pair of accesses is not ordered","The demo's barrier lets the threads run different trials"],"answer":2,"why":"Each thread's write-then-read must be ordered for the outcome to be ruled out. Thread A's volatile write is followed by a store-buffer drain, but thread B wrote a plain field, so nothing stops B's read from passing its own write. Make both fields volatile and the count drops to 0.","from":null},{"q":"A class has <code>private volatile long[] balances<\/code>. Thread A runs <code>balances[3] = 500<\/code>. Thread B later reads <code>balances[3]<\/code>. What is guaranteed?","options":["B sees 500, because the array is volatile","B sees 500 or 0, but never a torn value","B sees 500 once A releases the array","Nothing about the element: only the array reference is volatile, so this is a plain write and a plain read"],"answer":3,"why":"Element accesses of a volatile array are plain accesses. There's no edge from A's write to B's read, and a plain <code>long<\/code> element may even tear under the JLS. Use <code>AtomicLongArray<\/code> when elements are shared.","from":null},{"q":"From lesson 2 of this track: T1 sets a plain <code>fee = 25<\/code> and then the volatile <code>ready = true<\/code>. T2 sees <code>ready == true<\/code> and then reads <code>fee<\/code>. Why must T2 see 25?","options":["Because <code>fee<\/code> is an <code>int<\/code>, and int writes are atomic","Program order, then the volatile write-to-read edge, then program order again: the edges chain, so the write of <code>fee<\/code> happens-before its read","Because volatile writes flush all CPU caches","It doesn't have to; T2 may see 0"],"answer":1,"why":"This is piggybacking on the volatile. The write of <code>fee<\/code> comes before the release in T1's program order, and the read comes after the acquire in T2's. Atomicity only rules out half-written values; it says nothing about which value you see.","from":"jmm-02"}],"cards":[{"front":"What does a volatile field guarantee?","back":"<p>Visibility of the latest write, release/acquire ordering around each access, and a single order of all volatile accesses that every thread agrees on.<\/p>"},{"front":"Is <code>count++<\/code> on a volatile int atomic?","back":"<p>No. It's still a read, an add and a write. Use <code>AtomicInteger.incrementAndGet()<\/code> or <code>LongAdder<\/code>.<\/p>"},{"front":"When is volatile alone enough for a field?","back":"<p>When one thread writes it (or writes don't depend on the current value), and the field isn't part of a rule with other fields.<\/p>"},{"front":"Two fields must change together under one rule. Volatile, atomic or lock?","back":"<p>A lock, taken around every read and write of both fields.<\/p>"},{"front":"Can a write to a non-volatile <code>long<\/code> tear?","back":"<p>The JLS allows it to be split into two 32-bit writes. A volatile <code>long<\/code> or <code>double<\/code> is always written and read atomically.<\/p>"},{"front":"<code>volatile List&lt;Fee&gt; fees;<\/code> Is <code>fees.add(f)<\/code> from two threads safe?","back":"<p>No. Volatile covers the reference only. Replace the whole list with an immutable copy instead, or use a concurrent collection.<\/p>"},{"front":"Are the elements of a <code>volatile long[]<\/code> volatile?","back":"<p>No, only the array reference. Use <code>AtomicLongArray<\/code> for volatile element access.<\/p>"}],"terms":[{"term":"Visibility","plain":"Whether a read in one thread sees a write from another."},{"term":"Atomicity","plain":"An operation happens as one indivisible step that no other thread can split."},{"term":"Read-modify-write","plain":"Read a value, compute a new one from it, write it back. Needs an atomic or a lock when shared."},{"term":"Torn read","plain":"Seeing half of one write and half of another, possible for non-volatile long and double under the JLS."},{"term":"Single writer","plain":"A field that only one thread ever writes. Volatile is enough for it."},{"term":"Snapshot publication","plain":"Building a new immutable object and publishing it with one volatile write, instead of mutating the old one."},{"term":"LongAdder","plain":"A counter that spreads increments over several cells. Fast under contention; its sum is not a snapshot."}],"remote":true},"jmm-04":{"id":"jmm-04","track":"jmm","n":4,"title":"Safe publication, final fields and escaping this","ready":true,"minutes":35,"goal":"By the end you can publish an object so other threads see it whole, build immutable classes that are safe to share through any race, and keep this from escaping a constructor.","quiz":[{"q":"<code>registry.current<\/code> is a plain field. The loader stores a <code>RateCard<\/code> whose fields are all <code>final<\/code>. What can a request thread that reads <code>registry.current<\/code> see?","options":["null, or a RateCard with correct field values; it may also keep seeing null for a long time","A RateCard whose currency is still null","Always the latest RateCard, because its fields are final","A ClassCastException, because the object is half-built"],"answer":0,"why":"Final fields guarantee that whoever sees the reference sees the constructed values. They don't make the reference visible, so the reader can see null, an older card, or the new one, but never a half-built one. Option 3 is the common confusion between the two guarantees.","from":null},{"q":"Which of these publishes a new <code>RateCard<\/code> safely to request threads that call <code>current()<\/code>?","options":["A plain field, with <code>publish<\/code> marked <code>synchronized<\/code> and <code>current()<\/code> unsynchronized","A <code>volatile<\/code> field","A <code>HashMap<\/code> field that <code>publish<\/code> puts the card into","A plain field, written after <code>Thread.sleep(100)<\/code>"],"answer":1,"why":"The volatile write in <code>publish<\/code> pairs with the volatile read in <code>current()<\/code>. The half-synchronized version has no acquire on the read side, a plain HashMap creates no edge, and a sleep is not an edge.","from":null},{"q":"A constructor sets all its final fields and then, as its last line, calls <code>bus.register(this)<\/code>. Is that safe?","options":["Yes, all the fields are already set","Yes, final fields make any publication safe","No: the final-field promise starts when the constructor returns, so the bus's threads get no such promise, and a subclass constructor hasn't run yet","No, <code>register<\/code> can't accept <code>this<\/code> inside a constructor"],"answer":2,"why":"The freeze happens at the end of the constructor, and <code>this<\/code> left before that. In practice it often works, which is why the bug survives review. Register from a factory method or <code>@PostConstruct<\/code> instead.","from":null},{"q":"A final class has <code>private final List&lt;Fee&gt; fees;<\/code>, set with <code>this.fees = fees;<\/code> from the caller's <code>ArrayList<\/code>, and no setters. Is it safe to share between threads?","options":["Yes, the field is final","Yes, as long as it is published through a volatile field","No, because <code>List<\/code> is an interface","No: the caller still holds the <code>ArrayList<\/code> and can change it after the constructor, racing with every reader"],"answer":3,"why":"Final freezes the reference and the list's state at the end of the constructor. Later changes through the caller's reference are ordinary racy writes to an ArrayList. Copy it with <code>List.copyOf<\/code> in the constructor.","from":null},{"q":"From lesson 3 of this track: a field is <code>volatile Map&lt;String, Rule&gt; rules<\/code>. A refresher thread calls <code>rules.put(k, v)<\/code> on the existing <code>HashMap<\/code>, and request threads call <code>rules.get(k)<\/code>. Is it safe?","options":["Yes, the field is volatile","No: <code>put<\/code> is not a volatile write, it changes a HashMap that isn't safe for concurrent use","Yes, if the map has fewer than 16 entries","Only on x86"],"answer":1,"why":"Volatile covers the reference. <code>put<\/code> never writes the field, so there's no edge, and HashMap can corrupt itself under concurrent access. Build a new map and assign it with one volatile write, or use a ConcurrentHashMap.","from":"jmm-03"}],"cards":[{"front":"An object is published through a plain field. What can a reader that sees the reference observe?","back":"<p>Default values (0, false, null) in its non-final fields, because the reference may become visible before the constructor's writes.<\/p>"},{"front":"What do final fields guarantee?","back":"<p>A thread that sees the reference after the constructor finished sees the final fields, and what they point to, as the constructor left them, even through a data race.<\/p>"},{"front":"Do final fields make the reference to the object visible to other threads?","back":"<p>No. You still need a safe publication channel, such as a volatile field, for readers to see the reference at all.<\/p>"},{"front":"Name a safe publication idiom that needs no volatile and no lock.","back":"<p>A static initializer, such as <code>static final RateCard DEFAULT = new RateCard(...)<\/code>. Class initialization runs under a JVM lock.<\/p>"},{"front":"A constructor calls <code>bus.register(this)<\/code>. What's the fix?","back":"<p>Make the constructor only assign fields, and register in a static factory or <code>@PostConstruct<\/code>, after construction.<\/p>"},{"front":"What does a Kotlin <code>val<\/code> compile to?","back":"<p>A private final backing field (plus a getter). A <code>var<\/code> gives a non-final field.<\/p>"},{"front":"Is <code>this.fees = fees;<\/code> enough for an immutable class with a list?","back":"<p>No. Copy it (<code>List.copyOf(fees)<\/code>), or the caller can still change the list under your readers.<\/p>"}],"terms":[{"term":"Publication","plain":"Making a reference to an object reachable from another thread."},{"term":"Safe publication","plain":"Publishing so the reader gets the reference and the object's state together, through a happens-before edge or final fields."},{"term":"Partially constructed object","plain":"An object a thread can see before the constructor's writes are visible to it."},{"term":"Freeze","plain":"The end of a constructor, after which final fields carry the JMM's special visibility promise."},{"term":"Immutable object","plain":"Final class, final fields, copied inputs, nothing mutable handed out, no escaping this."},{"term":"Escaping this","plain":"A constructor letting other code get a reference to the object before the constructor has finished."},{"term":"Defensive copy","plain":"Copying a mutable input or output so outside code can't change your object's state."}],"remote":true},"jmm-05":{"id":"jmm-05","track":"jmm","n":5,"title":"Lazy init done right: double-checked locking and holders","ready":true,"minutes":35,"goal":"By the end you can explain why double-checked locking without volatile is broken, write a correct lazy value with a volatile DCL, the holder class idiom and Kotlin's lazy, and pick the simplest one that fits.","quiz":[{"q":"A double-checked singleton has a volatile field. A teammate removes <code>volatile<\/code> because \"the write already happens inside synchronized\", and CI stays green. What do you tell them?","options":["That's fine: leaving the synchronized block publishes the object to every thread","A thread on the lock-free fast path has no edge to that write, so it can get a half-built object; CI's x86 machines just rarely show it","It can now build two instances","It will deadlock under contention"],"answer":1,"why":"Releasing a lock creates an edge only to threads that later take the same lock. The fast path takes no lock, so only a volatile read gives it an edge. The second check still prevents two builds, so option 3 is wrong, and the bug simply doesn't show on most x86 runs.","from":null},{"q":"A Quarkus bean needs its own <code>HttpClient<\/code>, built on first use. Building it fails when the issuer's DNS is down, and the next request should try again. Which idiom fits?","options":["The holder class idiom","An enum singleton","Double-checked locking on a volatile field, or Kotlin <code>by lazy<\/code>","<code>by lazy(LazyThreadSafetyMode.NONE)<\/code>"],"answer":2,"why":"The holder and the enum are static, one per JVM, and a failed class initialization is permanent: later calls get NoClassDefFoundError. DCL stores nothing when the initializer throws, so the next call tries again, and Kotlin's <code>lazy<\/code> documents the same retry. NONE is unsafe on a bean that many request threads share.","from":null},{"q":"<code>Rates<\/code> has <code>static final Rates INSTANCE = new Rates();<\/code>, a constructor that prints <code>built<\/code>, and a static method <code>currency()<\/code> that returns \"EUR\". <code>main<\/code> prints <code>start<\/code>, then prints <code>Rates.currency()<\/code>. What is the output?","options":["start, built, EUR","start, EUR, and <code>built<\/code> only when INSTANCE is first read","built, start, EUR, because static fields are set when the JVM starts","start, EUR, built"],"answer":0,"why":"Calling a static method is an active use, so the JVM initializes <code>Rates<\/code> first, and that runs <code>new Rates()<\/code>. Class initialization is lazy per class, not per field. A holder class is how you make the instance wait for its own first use.","from":null},{"q":"A shared Kotlin object has <code>val pool by lazy(LazyThreadSafetyMode.PUBLICATION) { ConnectionPool(size = 20) }<\/code>. A burst of requests arrives right after startup. What can happen?","options":["Nothing bad: PUBLICATION means the pool is published safely, so it's built once","Different callers keep using different pools","The callers deadlock","Several threads can each open a pool of 20 connections; one pool is kept and the others are dropped without being closed"],"answer":3,"why":"PUBLICATION lets the initializer run on several threads at once and keeps one result, so everyone does end up with the same pool (option 2 is wrong). The extra pools were still created, and their connections leak. Anything with side effects belongs in the default SYNCHRONIZED mode.","from":null},{"q":"From lesson 4 of this track: a DCL singleton without volatile, but every field of the singleton is <code>final<\/code>. What can a thread on the fast path see?","options":["null, which sends it to the slow path, or the complete object; the code is still fragile, because one non-final field added later breaks it","A half-built object, just like the non-final case","Always null, so every call takes the lock","Two different instances"],"answer":0,"why":"Final fields are seen as the constructor left them, even through a data race, so the race on the reference is benign. jcstress <code>Singleton_07<\/code> shows no failures with final fields and failures without them. Relying on that is brittle; add volatile.","from":"jmm-04"}],"cards":[{"front":"Why is double-checked locking without volatile broken?","back":"<p>The fast path reads the field without the lock, so it has no happens-before edge to the write. A thread can see the reference before the constructor's writes and use a half-built object.<\/p>"},{"front":"What one change makes double-checked locking correct?","back":"<p>Declare the field <code>volatile<\/code> (<code>@Volatile<\/code> in Kotlin). The volatile write publishes the finished object; the volatile read on the fast path sees it whole.<\/p>"},{"front":"In the holder class idiom, what does the locking?","back":"<p>The JVM's class initialization. <code>Holder<\/code> is initialized once, under a JVM lock, the first time <code>Holder.INSTANCE<\/code> is read.<\/p>"},{"front":"A holder's initializer throws on the first call. What does the second call get?","back":"<p><code>NoClassDefFoundError: Could not initialize class ...$Holder<\/code>. Class initialization never retries; only a JVM restart does.<\/p>"},{"front":"What does <code>val x by lazy { ... }<\/code> compile to, and which mode does it use?","back":"<p>A <code>private final kotlin.Lazy x$delegate<\/code> field. The default mode is SYNCHRONIZED: double-checked locking on a volatile field.<\/p>"},{"front":"LazyThreadSafetyMode.PUBLICATION vs SYNCHRONIZED?","back":"<p>PUBLICATION may run the initializer on several threads at once and keeps one result. SYNCHRONIZED runs it once while the other callers wait.<\/p>"},{"front":"Kotlin <code>concurrentMap.getOrPut(k) { connect() }<\/code>: can <code>connect()<\/code> run twice for one key?","back":"<p>Yes. It never replaces a value, but the lambda may run on two threads. <code>computeIfAbsent<\/code> runs it at most once per absent key.<\/p>"}],"terms":[{"term":"Lazy initialization","plain":"Building a value on first use instead of at startup."},{"term":"Double-checked locking","plain":"Check without a lock, then lock and check again before building. Correct only with a volatile field."},{"term":"Holder class idiom","plain":"Keep the instance in a private nested class, so the JVM builds it on the first call, once, under its class-initialization lock."},{"term":"Class initialization","plain":"The JVM running a class's static initializer once, before the class's first active use."},{"term":"Enum singleton","plain":"A one-constant enum used as a singleton; serialization and reflection can't make a second one."},{"term":"Sentinel","plain":"A private marker object meaning \"not set yet\", so a real null result can be cached too."},{"term":"LazyThreadSafetyMode","plain":"Kotlin's choice for <code>lazy<\/code>: SYNCHRONIZED (once, others wait), PUBLICATION (maybe many runs, one result), NONE (one thread only)."}],"remote":true},"jmm-06":{"id":"jmm-06","track":"jmm","n":6,"title":"VarHandles and memory ordering modes","ready":false},"exec-01":{"id":"exec-01","track":"exec","n":1,"title":"Why pools: Executor, ExecutorService and shutdown","ready":true,"minutes":35,"goal":"By the end you can say what a thread pool saves you, pick execute or submit on purpose, and shut a pool down without losing work or hanging the JVM.","quiz":[{"q":"A Kafka handler does <code>pool.submit(() -&gt; ledger.post(entry))<\/code> and never keeps the <code>Future<\/code>. <code>post<\/code> throws a <code>SQLException<\/code> wrapped in a <code>RuntimeException<\/code>. What shows up in the logs?","options":["A stack trace from the default UncaughtExceptionHandler","Nothing at all","A RejectedExecutionException on the next submit","A warning that the pool lost a worker"],"answer":1,"why":"<code>submit<\/code> wraps the task in a <code>FutureTask<\/code>, which catches the exception and stores it in the <code>Future<\/code>. Nobody calls <code>get()<\/code>, so nobody sees it. The stack trace from the default handler is what you'd get with <code>execute<\/code>, which is why that option is tempting.","from":null},{"q":"<code>main<\/code> creates <code>Executors.newFixedThreadPool(2)<\/code>, runs three tasks that finish quickly, and returns without calling <code>shutdown()<\/code>. What happens to the JVM?","options":["It exits when <code>main<\/code> returns","It exits once the three tasks are done","It keeps running, because the two idle worker threads are not daemon threads","It throws IllegalStateException because the pool was never shut down"],"answer":2,"why":"The JVM exits when the last non-daemon thread ends. The pool's workers are non-daemon and wait in <code>take()<\/code> for more work forever. A cached pool would let the JVM exit after 60 idle seconds, because its idle threads time out.","from":null},{"q":"A pool runs a task with a loop <code>while (true) { score(next()); }<\/code> that never checks the interrupt flag and never blocks. You call <code>shutdownNow()<\/code> and then <code>awaitTermination(5, SECONDS)<\/code>. What does <code>awaitTermination<\/code> return?","options":["true, because shutdownNow stops the threads","true, because the task is removed from the queue","It throws InterruptedException","false, because the interrupt is only a request and this task ignores it"],"answer":3,"why":"<code>shutdownNow<\/code> calls <code>interrupt()<\/code> on the workers. That sets a flag and wakes blocking calls. A loop that never checks the flag and never blocks runs on, so the pool cannot terminate and the wait times out with <code>false<\/code>.","from":null},{"q":"Which code waits until every submitted task has finished, with no timeout, on JDK 21?","options":["<code>pool.shutdown();<\/code>","<code>try (pool) { ... }<\/code> (try-with-resources, which calls <code>close()<\/code>)","<code>pool.shutdownNow();<\/code>","<code>pool.isTerminated();<\/code>"],"answer":1,"why":"<code>close()<\/code> (JDK 19+) calls <code>shutdown()<\/code> and then waits until the pool has terminated. <code>shutdown()<\/code> and <code>shutdownNow()<\/code> return at once, and <code>isTerminated()<\/code> only reports the state.","from":null},{"q":"From \"Race conditions: why count++ lies\": four tasks on a fixed pool each run <code>total += amount<\/code> 100,000 times on a shared <code>long<\/code> field. What is <code>total<\/code> after <code>close()<\/code> returns?","options":["Exactly 400,000 times <code>amount<\/code>, because the pool runs tasks one after another","Often less, because the four workers run at the same time and lose updates","Exactly right, because each task runs on a single thread","Unknown, because the pool throws ConcurrentModificationException"],"answer":1,"why":"A pool of four runs four tasks at once on four threads, so <code>total += amount<\/code> is the same read-modify-write race as before. The pool changes who creates the threads, not the rules for shared state. Use a <code>LongAdder<\/code>, an <code>AtomicLong<\/code>, or give each task its own subtotal.","from":"conc-03"}],"cards":[{"front":"Does <code>shutdown()<\/code> wait for running tasks to finish?","back":"<p>No. It rejects new tasks and returns at once. Queued and running tasks carry on. Wait with <code>awaitTermination<\/code> or <code>close()<\/code>.<\/p>"},{"front":"What does <code>shutdownNow()<\/code> return?","back":"<p>A <code>List&lt;Runnable&gt;<\/code> of the queued tasks that never started. It also interrupts the threads running tasks.<\/p>"},{"front":"A task sent with <code>submit()<\/code> throws. Where does the exception go?","back":"<p>Into the <code>Future<\/code>. Nothing is printed. <code>get()<\/code> throws <code>ExecutionException<\/code> with it as the cause.<\/p>"},{"front":"A task sent with <code>execute()<\/code> throws. What happens?","back":"<p>The worker thread dies, its <code>UncaughtExceptionHandler<\/code> runs (by default it prints the stack trace), and the pool starts a replacement.<\/p>"},{"front":"What does <code>ExecutorService.close()<\/code> do (JDK 19+)?","back":"<p><code>shutdown()<\/code>, then waits with no timeout until every task is done. If interrupted while waiting, it calls <code>shutdownNow()<\/code>, keeps waiting, then restores the interrupt flag.<\/p>"},{"front":"Why can a forgotten <code>newFixedThreadPool<\/code> keep the JVM running after <code>main<\/code> returns?","back":"<p>Its worker threads are non-daemon and wait for new tasks forever.<\/p>"}],"terms":[{"term":"Thread pool","plain":"A set of threads created once that run many tasks, taking them from a queue."},{"term":"Executor","plain":"Anything that can run a <code>Runnable<\/code>. It has one method, <code>execute<\/code>."},{"term":"ExecutorService","plain":"An Executor that also returns Futures and can be shut down and waited for."},{"term":"Future","plain":"A handle to a task's result that you can wait on, check or cancel."},{"term":"Poison pill","plain":"A marker item put in a queue to tell the consumer that takes it to stop."},{"term":"Daemon thread","plain":"A thread that does not keep the JVM alive. Pool threads usually are not daemon threads."},{"term":"Graceful shutdown","plain":"Stop taking new work, let accepted work finish within a deadline, then release resources."}],"remote":true},"exec-02":{"id":"exec-02","track":"exec","n":2,"title":"Inside ThreadPoolExecutor: core, max, queue, rejection","ready":true,"minutes":35,"goal":"By the end you can predict where every task in a burst goes (a core thread, the queue, an extra thread, or the rejection handler) and configure a ThreadPoolExecutor that pushes back instead of growing without limit.","quiz":[{"q":"<code>new ThreadPoolExecutor(2, 4, 60, SECONDS, new ArrayBlockingQueue&lt;&gt;(10))<\/code> receives 8 tasks that each block for a minute. Where are they?","options":["4 running, 4 queued","2 running, 6 queued","4 running, 2 queued, 2 rejected","8 running"],"answer":1,"why":"Tasks 1 and 2 start core threads. The other 6 fit in a queue of 10, so the queue never refuses and the pool never grows. The tempting answer, 4 running, assumes the pool uses its max before queuing. It is the other way round.","from":null},{"q":"A batch job reads 2 million ledger rows and submits one task per 1,000 rows. You want it to run no faster than the pool can keep up, without losing a batch and without a retry loop. Which handler fits?","options":["<code>AbortPolicy<\/code>","<code>DiscardOldestPolicy<\/code>","<code>CallerRunsPolicy<\/code>","<code>DiscardPolicy<\/code>"],"answer":2,"why":"<code>CallerRunsPolicy<\/code> makes the reading thread run the overflow batch itself, so it stops reading while it works. That is back-pressure, and nothing is lost. <code>AbortPolicy<\/code> would make you write the retry loop, and both discard policies lose batches without telling anyone.","from":null},{"q":"A pool uses <code>DiscardPolicy<\/code>. A request thread calls <code>pool.submit(task).get()<\/code> while the pool is saturated. What happens?","options":["<code>get()<\/code> throws RejectedExecutionException","<code>get()<\/code> returns null","<code>get()<\/code> throws CancellationException","<code>get()<\/code> blocks forever, because the dropped task never runs and its Future never completes"],"answer":3,"why":"<code>DiscardPolicy<\/code> drops the <code>FutureTask<\/code> without running or cancelling it. Nothing will ever complete that <code>Future<\/code>, so <code>get()<\/code> without a timeout waits forever. This is why the Javadoc suggests cancelling dropped tasks in a custom handler.","from":null},{"q":"A pool with core 4, max 16 and a bounded queue grew to 16 threads during a spike an hour ago. Traffic is quiet now. With default settings, how many threads does it have?","options":["4, because idle threads above core retired after keepAliveTime","16, because threads are never removed","0, because idle threads retire","1, the minimum"],"answer":0,"why":"Keep-alive applies to threads above core, so the pool shrinks back to 4. It only goes to 0 if you call <code>allowCoreThreadTimeOut(true)<\/code>.","from":null},{"q":"From \"Why pools: Executor, ExecutorService and shutdown\": a producer thread keeps calling <code>execute<\/code> on a <code>ThreadPoolExecutor<\/code> with the default handler after another thread has called <code>shutdown()<\/code>. What does the producer see?","options":["The tasks run, because shutdown() lets queued work finish","A RejectedExecutionException from each execute call","Nothing: the tasks are silently dropped","An IllegalStateException"],"answer":1,"why":"After <code>shutdown()<\/code>, new tasks go to the rejection handler, and the default <code>AbortPolicy<\/code> throws <code>RejectedExecutionException<\/code>. Only tasks that were already queued still run. With a discard policy or <code>CallerRunsPolicy<\/code> they would be dropped silently instead.","from":"exec-01"}],"cards":[{"front":"In what order does <code>ThreadPoolExecutor.execute<\/code> try its options?","back":"<p>Start a thread if below core; else queue; if the queue refuses, start a thread if below max; else reject.<\/p>"},{"front":"Why does <code>newFixedThreadPool(8)<\/code> never run more than 8 threads, whatever max you set?","back":"<p>Its <code>LinkedBlockingQueue<\/code> is unbounded, so the queue never refuses a task, and the pool only grows past core when the queue refuses.<\/p>"},{"front":"What queue does <code>newCachedThreadPool()<\/code> use, and what is the risk?","back":"<p>A <code>SynchronousQueue<\/code> (no capacity) with max <code>Integer.MAX_VALUE<\/code>, so every task that finds no idle thread gets a new thread. Threads grow without limit.<\/p>"},{"front":"What does <code>CallerRunsPolicy<\/code> do with an overflow task?","back":"<p>The thread that called <code>execute<\/code> runs it, which slows that producer down. After shutdown it drops the task.<\/p>"},{"front":"A pool with <code>DiscardPolicy<\/code> drops a task sent with <code>submit<\/code>. What happens to <code>future.get()<\/code>?","back":"<p>It blocks forever. The task never runs, so its Future never completes.<\/p>"},{"front":"What does <code>keepAliveTime<\/code> apply to by default?","back":"<p>Only to threads above <code>corePoolSize<\/code>. Call <code>allowCoreThreadTimeOut(true)<\/code> to let core threads retire too.<\/p>"},{"front":"When does a new extra thread pick up a queued task first?","back":"<p>It doesn't. A thread started by rule 3 runs the task that triggered it, so later tasks can overtake queued ones.<\/p>"}],"terms":[{"term":"corePoolSize","plain":"The number of threads the pool keeps, even when idle."},{"term":"maximumPoolSize","plain":"The most threads the pool may run, reached only when the queue is full."},{"term":"Work queue","plain":"The BlockingQueue where tasks wait for a free thread."},{"term":"Direct handoff","plain":"A SynchronousQueue: no storage, a task passes straight to an idle thread or not at all."},{"term":"RejectedExecutionHandler","plain":"The callback that decides what happens to a task the pool cannot take."},{"term":"Back-pressure","plain":"Slowing the producer down when the consumer can't keep up, instead of piling up work."},{"term":"Keep-alive time","plain":"How long an idle thread above core waits before it exits."}],"remote":true},"exec-03":{"id":"exec-03","track":"exec","n":3,"title":"Sizing a pool: CPU-bound, IO-bound and Little's law","ready":true,"minutes":35,"goal":"By the end you can size a pool from measurements: one thread per core for CPU work, Goetz's formula for work that waits, Little's law for traffic, and the smallest downstream limit as the ceiling.","quiz":[{"q":"A fraud-scoring job is pure CPU and runs on a pod with an 8-CPU limit. Someone raises its pool from 8 to 32 threads. What happens to throughput?","options":["It roughly quadruples","About the same, or a little worse from context switching","It doubles","It deadlocks"],"answer":1,"why":"Eight CPUs can run eight threads at a time. The other 24 threads only take turns on the same CPUs. For work that waits, more threads help; for pure computation they don't.","from":null},{"q":"A refunds endpoint receives 300 requests a second, and each takes 400 ms. How many requests are in flight on average?","options":["75","750","120","40"],"answer":2,"why":"L = λ x W = 300 x 0.4 = 120. Dividing 300 by 4, or multiplying by 2.5, are the tempting slips. Write the units down: requests per second times seconds gives requests.","from":null},{"q":"A service runs on 4 cores, aims for full CPU use, and each task computes for 10 ms and then waits 90 ms. What does Goetz's formula give?","options":["40","4","36","400"],"answer":0,"why":"4 x 1.0 x (1 + 90/10) = 4 x 10 = 40. The tempting 36 comes from using W/C alone instead of 1 + W/C; the 1 accounts for the time each task spends on the CPU.","from":null},{"q":"Authorizations, refunds and balance lookups share one pool of 64 threads. When the card issuer slows down, balance lookups, which never call the issuer, start timing out. What is the best fix?","options":["Double the pool to 128 threads","Switch the pool to an unbounded queue","Use CallerRunsPolicy","Put issuer calls behind their own limit (a bulkhead), so they can't use every thread"],"answer":3,"why":"Slow issuer calls fill every shared thread, so unrelated work starves. A bulkhead caps how many threads issuer calls may hold. Doubling the pool only delays the problem: Little's law fills 128 threads as surely as 64 when each call takes 3 s.","from":null},{"q":"From \"Inside ThreadPoolExecutor: core, max, queue, rejection\": a pool is <code>new ThreadPoolExecutor(20, 200, 60, SECONDS, new LinkedBlockingQueue&lt;&gt;())<\/code>. Traffic is 400 requests a second at 250 ms each. What happens?","options":["It grows to 200 threads, which is plenty","It stays at 20 threads, finishes at most 80 a second, and the queue grows without limit","It grows to exactly the 100 threads Little's law asks for","It rejects the excess requests"],"answer":1,"why":"With an unbounded queue the pool never grows past core, so 20 threads at 250 ms finish 20 / 0.25 = 80 a second. Little's law needs 100 in flight. The other 320 a second pile up in the queue, which never refuses, so nothing is ever rejected either.","from":"exec-02"}],"cards":[{"front":"How many threads for a pool doing pure CPU work?","back":"<p>About one per core: <code>Runtime.getRuntime().availableProcessors()<\/code> (Goetz suggests one more).<\/p>"},{"front":"Goetz's pool-size formula for tasks that wait?","back":"<p>threads = cores x target utilization x (1 + wait time / compute time).<\/p>"},{"front":"State Little's law.","back":"<p>L = λ x W: requests in flight = arrival rate x average time in the system.<\/p>"},{"front":"50 threads, each request holds a thread for 250 ms. Maximum throughput?","back":"<p>50 / 0.25 = 200 requests per second.<\/p>"},{"front":"Why don't threads beyond the database pool size speed up database-bound requests?","back":"<p>Each request needs a connection. The extra threads just wait in line for one.<\/p>"},{"front":"What is a bulkhead?","back":"<p>A separate concurrency limit per dependency (its own pool or a Semaphore), so one slow dependency can't take every thread.<\/p>"},{"front":"What does <code>availableProcessors()<\/code> return in a pod with a 2-CPU limit?","back":"<ol start=\"2\">\n<li>The JVM reads the container's CPU limit, not the host's core count.<\/li>\n<\/ol>"}],"terms":[{"term":"CPU-bound","plain":"Work limited by computation. More threads than cores don't help."},{"term":"I/O-bound","plain":"Work that mostly waits on the network or disk, so one core can serve many such tasks."},{"term":"Little's law","plain":"Requests in flight equal arrival rate times time spent in the system."},{"term":"Throughput","plain":"Work finished per unit of time, such as requests per second."},{"term":"Latency","plain":"How long one request takes from arrival to completion."},{"term":"Bulkhead","plain":"A per-dependency limit that keeps one slow dependency from using all the threads."},{"term":"Wait/compute ratio","plain":"How long a task waits divided by how long it computes. It decides how many threads one core can feed."}],"remote":true},"exec-04":{"id":"exec-04","track":"exec","n":4,"title":"Callable, Future, cancellation and interruption","ready":true,"minutes":35,"goal":"By the end you can wait for a task with a deadline, cancel it in a way that actually stops it, and handle InterruptedException so a stop request is never lost.","quiz":[{"q":"A task calls a ledger API that posts a debit. The caller's <code>get(500, MILLISECONDS)<\/code> throws <code>TimeoutException<\/code> and the caller does nothing else. What happens to the debit?","options":["It is cancelled automatically when get() times out","It may well still be posted, because the task keeps running","It is rolled back by the executor","The task receives the TimeoutException and stops"],"answer":1,"why":"The timeout is only about the caller's wait. The task has no idea anyone gave up, so it carries on and posts the debit. Only <code>cancel(true)<\/code> sends it a signal, and even that is just an interrupt.","from":null},{"q":"A worker runs <code>while (!Thread.currentThread().isInterrupted()) { work(); try { Thread.sleep(100); } catch (InterruptedException e) { log.warn(\"interrupted\"); } }<\/code>. The pool calls <code>shutdownNow()<\/code> while the worker sleeps. What happens?","options":["The worker stops at the next loop check","The worker throws and the pool replaces it","The worker logs a warning and keeps looping, because the exception cleared the flag","shutdownNow() waits until the worker finishes"],"answer":2,"why":"<code>sleep<\/code> clears the interrupt flag when it throws. The catch only logs, so the <code>while<\/code> check sees a clear flag and loops forever. Restore the flag in the catch, or <code>return<\/code> from it.","from":null},{"q":"You call <code>cancel(true)<\/code> on a task that is in a long CPU loop and never checks the interrupt flag. What do you see?","options":["<code>isCancelled()<\/code> is true at once, and the loop runs to the end anyway","<code>isCancelled()<\/code> stays false until the loop ends","The thread is stopped immediately","<code>cancel<\/code> returns false because the task is running"],"answer":0,"why":"The Future moves to CANCELLED as soon as <code>cancel<\/code> succeeds, and <code>cancel<\/code> returns true for a running task. The interrupt sets a flag the loop never reads, so the work continues. Java can't stop a thread from outside.","from":null},{"q":"You ask three FX-rate providers for EUR/USD and want the first successful answer, ignoring providers that fail, with the slower ones cancelled. Which tool fits?","options":["Submit each one and call <code>get()<\/code> on them in order","<code>invokeAll<\/code>, then pick the first SUCCESS","A single-thread executor, so they run one at a time","<code>invokeAny<\/code>"],"answer":3,"why":"<code>invokeAny<\/code> returns the first task that completes successfully and cancels the rest. <code>invokeAll<\/code> waits for every provider, so you pay for the slowest. Calling <code>get()<\/code> in order waits for the first provider even if the third is faster.","from":null},{"q":"From \"A thread's life: start, join, sleep, interrupt\": thread <code>t<\/code> is in <code>Thread.sleep(10_000)<\/code>. Another thread calls <code>t.interrupt()<\/code>. Inside <code>t<\/code>'s catch block, what does <code>Thread.currentThread().isInterrupted()<\/code> return?","options":["true, because the thread was just interrupted","false, because throwing InterruptedException cleared the flag","It throws IllegalThreadStateException","true until sleep's 10 seconds are up"],"answer":1,"why":"Blocking methods clear the interrupt flag when they throw <code>InterruptedException<\/code>. That's why a catch block that neither rethrows nor calls <code>Thread.currentThread().interrupt()<\/code> loses the stop request.","from":"conc-02"}],"cards":[{"front":"What does <code>cancel(true)<\/code> do to a task that is already running?","back":"<p>It calls <code>interrupt()<\/code> on the task's thread. The task stops only if it responds to the interrupt.<\/p>"},{"front":"You call <code>cancel(true)<\/code> and the task ignores the interrupt. What does <code>isCancelled()<\/code> return?","back":"<p><code>true<\/code>, immediately, even though the task keeps running to the end.<\/p>"},{"front":"Does <code>future.get(timeout)<\/code> stop the task when it throws <code>TimeoutException<\/code>?","back":"<p>No. It only ends your wait. Call <code>cancel(true)<\/code> if the work should stop.<\/p>"},{"front":"What happens to the interrupt flag when <code>sleep<\/code> throws <code>InterruptedException<\/code>?","back":"<p>It is cleared. Rethrow the exception or restore the flag with <code>Thread.currentThread().interrupt()<\/code>.<\/p>"},{"front":"What does <code>invokeAny(tasks)<\/code> return?","back":"<p>The result of the first task that succeeds. It cancels the others, and throws <code>ExecutionException<\/code> only if all fail.<\/p>"},{"front":"What does <code>resultNow()<\/code> do on a future that failed?","back":"<p>Throws <code>IllegalStateException<\/code>. Check <code>state()<\/code> first, or use <code>exceptionNow()<\/code> for FAILED.<\/p>"}],"terms":[{"term":"Callable","plain":"A task that returns a value and may throw a checked exception."},{"term":"Future","plain":"A handle to a task's result: wait for it, check its state, or cancel it."},{"term":"Interrupt","plain":"A request to a thread to stop what it is doing. It sets a flag and wakes blocking calls."},{"term":"Interrupt flag","plain":"The per-thread boolean that <code>interrupt()<\/code> sets and <code>InterruptedException<\/code> clears."},{"term":"Cooperative cancellation","plain":"Cancellation that works only if the task checks for it and stops itself."},{"term":"invokeAny","plain":"Run several tasks and return the first successful result, cancelling the rest."}],"remote":true},"exec-05":{"id":"exec-05","track":"exec","n":5,"title":"Scheduled executors: fixed rate vs fixed delay","ready":true,"minutes":35,"goal":"By the end you can pick between schedule, fixed rate and fixed delay, predict when each run starts, and keep a periodic task alive when one run throws.","quiz":[{"q":"A task scheduled with <code>scheduleAtFixedRate(task, 0, 1, SECONDS)<\/code> takes 3 seconds every time. What happens?","options":["Three copies run at once, one starting each second","Each run starts as soon as the previous one ends, so it runs back to back","The scheduler skips the missed slots and waits for the next whole second","The scheduler throws RejectedExecutionException"],"answer":1,"why":"Executions of one periodic task never overlap. Every run is overdue by the time the last one ends, so it starts immediately, and the task runs continuously. Missed slots are not skipped; they are run late.","from":null},{"q":"<code>scheduleWithFixedDelay(task, 0, 10, SECONDS)<\/code> runs a task that always takes 2 seconds. When do the first three runs start?","options":["0, 10 and 20 seconds","0, 2 and 12 seconds","0, 8 and 16 seconds","0, 12 and 24 seconds"],"answer":3,"why":"The delay is measured from the end of each run: run 1 ends at 2 s, so run 2 starts at 12 s, ends at 14 s, and run 3 starts at 24 s. 0, 10, 20 is what fixed rate would give.","from":null},{"q":"A periodic cache refresh throws a NullPointerException on its 40th run. Nothing catches it. What do you observe?","options":["It stops for good, nothing is logged, and its future reports isDone() = true","It logs the exception and runs again next period","The scheduler thread dies and is replaced, and the task keeps running","The scheduler shuts down"],"answer":0,"why":"Later executions are suppressed and the exception is stored in the <code>ScheduledFuture<\/code>. Nothing is printed, which is the dangerous part. The scheduler and its other tasks carry on as if nothing happened.","from":null},{"q":"A single-thread scheduler runs a 30-second heartbeat and a report job that sometimes takes 2 minutes. The issuer complains about missing heartbeats. What is the right fix?","options":["Raise the scheduler's maximum pool size","Switch the heartbeat to fixed delay","Give the report job its own scheduler, or have its scheduled task hand the work to another pool","Wrap the heartbeat in a try/catch"],"answer":2,"why":"With one thread, the heartbeat can't run while the report is running. Maximum pool size does nothing on a <code>ScheduledThreadPoolExecutor<\/code>, and fixed delay or a try/catch don't free the thread. Separate the slow job from the time-sensitive one.","from":null},{"q":"From \"Callable, Future, cancellation and interruption\": a periodic task is in the middle of a run when you call <code>cancel(false)<\/code> on its <code>ScheduledFuture<\/code>. What happens?","options":["The run in progress is interrupted and no more runs happen","The run in progress finishes, and no more runs happen","Nothing, because cancel(false) only affects tasks that have not started","The run in progress finishes, and the schedule continues"],"answer":1,"why":"<code>cancel(false)<\/code> does not interrupt a running task, so the current run completes. Cancelling still marks the future cancelled, so the scheduler never queues the next run. <code>cancel(true)<\/code> would also interrupt the current run.","from":"exec-04"}],"cards":[{"front":"<code>scheduleAtFixedRate<\/code> vs <code>scheduleWithFixedDelay<\/code>: what is the period measured from?","back":"<p>Fixed rate: from a timetable fixed at the start (initialDelay + n x period). Fixed delay: from the end of the previous run.<\/p>"},{"front":"A periodic task throws once, uncaught. What happens to later runs?","back":"<p>They are suppressed forever. Nothing is logged; the exception is in the ScheduledFuture.<\/p>"},{"front":"Can two runs of the same periodic task overlap?","back":"<p>No. A late run waits for the previous one to finish, on any number of threads.<\/p>"},{"front":"Why does <code>maximumPoolSize<\/code> do nothing on a ScheduledThreadPoolExecutor?","back":"<p>It is a fixed pool of core threads with an unbounded delay queue, so it never grows past core.<\/p>"},{"front":"What did JDK 25 add to ForkJoinPool for scheduling?","back":"<p>It implements ScheduledExecutorService (schedule, fixed rate, fixed delay) and adds <code>submitWithTimeout<\/code>.<\/p>"},{"front":"Why avoid <code>java.util.Timer<\/code>?","back":"<p>One thread for all tasks, and one task that throws kills that thread and cancels every task on the Timer.<\/p>"}],"terms":[{"term":"ScheduledExecutorService","plain":"An executor that can run tasks after a delay or periodically."},{"term":"Fixed rate","plain":"Runs due at fixed times (start + n x period), caught up after a late run."},{"term":"Fixed delay","plain":"A fixed gap between the end of one run and the start of the next."},{"term":"ScheduledFuture","plain":"The handle for a scheduled task: cancel it, check isDone, read its remaining delay."},{"term":"Suppressed execution","plain":"A periodic run that never happens because an earlier run threw."},{"term":"Delay queue","plain":"A queue ordered by due time that releases each task only when it comes due."}],"remote":true},"exec-06":{"id":"exec-06","track":"exec","n":6,"title":"CompletableFuture: composing async steps","ready":true,"minutes":35,"goal":"By the end you can build a non-blocking pipeline with supplyAsync, thenApply, thenCompose and thenCombine, say which thread runs each step, and keep blocking calls off the common pool.","quiz":[{"q":"<code>cards.findAsync(token)<\/code> returns <code>CompletableFuture&lt;Card&gt;<\/code> and <code>issuer.authorizeAsync(card)<\/code> returns <code>CompletableFuture&lt;Auth&gt;<\/code>. What is the type of <code>cards.findAsync(token).thenApply(issuer::authorizeAsync)<\/code>?","options":["<code>CompletableFuture&lt;Auth&gt;<\/code>","<code>CompletableFuture&lt;CompletableFuture&lt;Auth&gt;&gt;<\/code>","<code>Auth<\/code>","It doesn't compile"],"answer":1,"why":"<code>thenApply<\/code> wraps whatever the function returns, and this function returns a future. You get a future of a future, and nothing waits for the inner one. <code>thenCompose<\/code> flattens it to <code>CompletableFuture&lt;Auth&gt;<\/code>.","from":null},{"q":"<code>price()<\/code> and <code>rate()<\/code> each block for 200 ms. Which version finishes in about 200 ms?","options":["<code>supplyAsync(() -&gt; price(), io).thenCompose(p -&gt; supplyAsync(() -&gt; rate(), io).thenApply(p::multiply))<\/code>","<code>supplyAsync(() -&gt; price().multiply(rate()), io)<\/code>","<code>supplyAsync(() -&gt; price(), io).thenApply(p -&gt; p.multiply(rate()))<\/code>","<code>supplyAsync(() -&gt; price(), io).thenCombine(supplyAsync(() -&gt; rate(), io), BigDecimal::multiply)<\/code>"],"answer":3,"why":"Only the last one starts both calls before waiting for either. The other three are all asynchronous, but each runs <code>rate()<\/code> after <code>price()<\/code> has returned, so they take about 400 ms. Being async is not the same as running in parallel.","from":null},{"q":"Future <code>f<\/code> has already completed. Request thread <code>http-7<\/code> calls <code>f.thenApply(this::render)<\/code>. Which thread runs <code>render<\/code>?","options":["<code>http-7<\/code>, right away","A common pool worker","The thread that completed <code>f<\/code>","A new thread"],"answer":0,"why":"When the previous stage is already complete, a plain <code>thenApply<\/code> runs the function at once on the calling thread. The thread that completed <code>f<\/code> finished its work earlier and plays no part. Only <code>thenApplyAsync<\/code> would hand it to a pool.","from":null},{"q":"A service on JDK 21 runs in a container with 2 CPUs. It calls <code>supplyAsync(() -&gt; blockingLookup())<\/code> with no executor, 300 times a second. What happens?","options":["The lookups queue up behind a single common pool thread","They run on virtual threads","They run on the calling threads","Each lookup gets a new platform thread, with no upper limit"],"answer":3,"why":"With 2 CPUs the common pool's parallelism is 1, and before JDK 25 <code>CompletableFuture<\/code> didn't use the common pool when its parallelism was below 2. It created a thread per task instead. Option A is what JDK 25 does with the same code. Neither is acceptable for blocking work: pass an executor.","from":null},{"q":"From \"Sizing a pool\": a checkout runs the price call (100 ms) and the FX call (100 ms) side by side on <code>io<\/code>, and you get 200 checkouts a second. How many <code>io<\/code> threads are busy on average?","options":["20","40","200","400"],"answer":1,"why":"Little's law: L = lambda x W. Each checkout holds two <code>io<\/code> threads for 0.1 s, so the pool sees 400 calls a second x 0.1 s = 40 busy threads. Running the calls side by side cuts latency; it doesn't cut the number of threads you need. Size the pool above 40, and check that the downstreams accept that many calls.","from":"exec-03"}],"cards":[{"front":"<code>thenApply<\/code> vs <code>thenCompose<\/code>?","back":"<p><code>thenApply<\/code> maps with a plain function (<code>T -&gt; U<\/code>). <code>thenCompose<\/code> flattens a function that returns a future (<code>T -&gt; CompletableFuture&lt;U&gt;<\/code>), like <code>flatMap<\/code>.<\/p>"},{"front":"What does <code>a.thenCombine(b, fn)<\/code> do?","back":"<p>Waits until both <code>a<\/code> and <code>b<\/code> complete, then applies <code>fn(aResult, bResult)<\/code>. It starts nothing: <code>a<\/code> and <code>b<\/code> must already be running to overlap.<\/p>"},{"front":"Which executor does <code>supplyAsync(task)<\/code> use on JDK 25?","back":"<p><code>ForkJoinPool.commonPool()<\/code>, always. Up to JDK 24 it used a new thread per task when the common pool's parallelism was below 2.<\/p>"},{"front":"Which thread runs a plain <code>thenApply<\/code> step?","back":"<p>The thread that completes the previous stage, or the calling thread if that stage is already complete.<\/p>"},{"front":"<code>join()<\/code> vs <code>get()<\/code> on a failed CompletableFuture?","back":"<p><code>get()<\/code> throws checked <code>ExecutionException<\/code>, <code>join()<\/code> throws unchecked <code>CompletionException<\/code>. Both carry the failure as the cause.<\/p>"},{"front":"Why pass an executor to <code>supplyAsync<\/code> for blocking calls?","back":"<p>Without one, the calls hold common pool threads, which every parallel stream and default-executor future in the JVM shares.<\/p>"}],"terms":[{"term":"CompletableFuture","plain":"A Future you can complete by hand and attach further steps to."},{"term":"Stage","plain":"One step in a pipeline: a future plus the function that produces it from earlier results."},{"term":"thenCompose","plain":"Attach a step that returns another future, and get one flat future back."},{"term":"thenCombine","plain":"Wait for two futures and merge their results with a function."},{"term":"Default async executor","plain":"Where async methods run when you pass no executor: the common ForkJoinPool."},{"term":"Common pool","plain":"One ForkJoinPool per JVM, with cores minus one threads, shared by parallel streams and default async tasks."}],"remote":true},"exec-07":{"id":"exec-07","track":"exec","n":7,"title":"CompletableFuture: errors, timeouts and fan-out","ready":false},"exec-08":{"id":"exec-08","track":"exec","n":8,"title":"ForkJoinPool, work stealing and parallel streams","ready":false},"exec-09":{"id":"exec-09","track":"exec","n":9,"title":"Pools in production: names, errors, context, shutdown","ready":false},"vt-01":{"id":"vt-01","track":"vt","n":1,"title":"The thread-per-request wall","ready":true,"minutes":35,"goal":"By the end you can use Little's law to say how many threads a blocking service needs, explain why platform threads cap its throughput, and say what virtual threads change and what they don't.","quiz":[{"q":"A service receives 3,000 requests per second and each one takes 50 ms. How many requests are in flight on average?","options":["60","150","600","3,000"],"answer":1,"why":"L = λ × W = 3,000/s × 0.05 s = 150. Dividing instead of multiplying gives 60, a common slip. The 3,000 figure is a rate per second, not a count of requests in flight at one moment.","from":null},{"q":"A 200-thread pool serves 1,000 requests per second at 200 ms each. The card issuer slows down and each request now takes 2 s. CPU drops to 3%. What is the most the service can finish per second now?","options":["Still 1,000, since the CPU is idle","500","100","20"],"answer":2,"why":"λ max = threads / W = 200 / 2 s = 100 requests per second. Idle CPU doesn't help: the limit is threads held while waiting, not computation. That is why one slow dependency can take down a thread-per-request service.","from":null},{"q":"You move a blocking handler from a 200-thread pool to one virtual thread per request. At low traffic, how does one request's latency change? It spends 120 ms waiting on the issuer.","options":["About the same: it still waits 120 ms for the issuer","It drops to a few milliseconds, because virtual threads don't really bl
