ray, so ids get lost or the array index runs past the end. <code>ConcurrentModificationException<\/code> comes from iterating while modifying, not from this race. <code>payments.parallelStream().map(Payment::id).toList()<\/code> is correct and keeps the order.","from":null},{"q":"Pick the tool for each job: (1) total the fees over 20 million ledger rows already in memory; (2) make 300 calls to a card-issuer API.","options":["(1) virtual threads; (2) a parallel stream","Both in one parallel stream","(1) a single-thread executor; (2) <code>supplyAsync<\/code> without an executor","(1) a parallel stream or a <code>RecursiveTask<\/code>; (2) an IO executor or virtual threads, combined with <code>CompletableFuture<\/code>"],"answer":3,"why":"In-memory CPU work splits well and wants about one thread per core, which is what the common pool gives you. Waiting on an API wants many threads that are cheap to block, and they must not be the common pool's. <code>supplyAsync<\/code> without an executor would put those calls right back on the common pool.","from":null},{"q":"From \"CompletableFuture: composing async steps\": one part of a service calls <code>supplyAsync(task)<\/code> with no executor, another uses <code>parallelStream()<\/code>. Do they compete for threads?","options":["No: <code>CompletableFuture<\/code> has its own default pool","Yes: both use <code>ForkJoinPool.commonPool()<\/code> (on JDK 25 always, on JDK 21 whenever its parallelism is at least 2)","Only when both run on virtual threads","No: every parallel stream creates its own pool"],"answer":1,"why":"The default async executor is the common pool, and so is the pool behind parallel streams. Before JDK 25 the one exception was a common pool with parallelism below 2, where <code>CompletableFuture<\/code> used a thread per task instead. Either way, a blocking task in one slows down the other.","from":"exec-06"}],"cards":[{"front":"In <code>compute()<\/code>, what is the right order of fork, compute and join?","back":"<p>Fork one half, compute the other half on this thread, then join the forked half. Joining first runs the halves one after the other.<\/p>"},{"front":"Where does a ForkJoinPool worker take its own tasks from, and where does a thief steal from?","back":"<p>The owner pushes and pops at the top of its deque (newest first). A thief takes from the bottom (oldest, biggest task).<\/p>"},{"front":"Default parallelism of <code>ForkJoinPool.commonPool()<\/code>?","back":"<p><code>availableProcessors() - 1<\/code> (at least 1). Change it with <code>-Djava.util.concurrent.ForkJoinPool.common.parallelism<\/code>.<\/p>"},{"front":"Which threads run a parallel stream?","back":"<p>Common pool workers plus the thread that started the stream.<\/p>"},{"front":"Why is a blocking call inside a parallel stream a problem for the whole JVM?","back":"<p>It holds a common pool worker, and that pool is shared by every parallel stream and every executor-less CompletableFuture.<\/p>"},{"front":"What does <code>ForkJoinPool.managedBlock<\/code> do?","back":"<p>Tells the pool that a worker is about to block, so the pool can start a spare thread to keep its parallelism up.<\/p>"},{"front":"How big should a fork/join leaf be, by the ForkJoinTask Javadoc's rough rule?","back":"<p>More than about 100 and fewer than about 10,000 basic computational steps. Then measure.<\/p>"}],"terms":[{"term":"ForkJoinPool","plain":"A pool where each worker has its own deque and idle workers steal tasks from busy ones."},{"term":"RecursiveTask","plain":"A fork/join task that returns a value; RecursiveAction returns nothing."},{"term":"Work stealing","plain":"An idle worker takes a task from the far end of another worker's deque."},{"term":"Deque","plain":"A double-ended queue: the owner uses one end, thieves the other."},{"term":"Threshold","plain":"The size below which a task stops splitting and just loops."},{"term":"Common pool","plain":"The JVM-wide ForkJoinPool behind parallel streams and default async tasks."},{"term":"ManagedBlocker","plain":"A way to tell a ForkJoinPool a worker will block, so it can add a spare thread."}],"remote":true},"exec-09":{"id":"exec-09","track":"exec","n":9,"title":"Pools in production: names, errors, context, shutdown","ready":true,"minutes":38,"goal":"By the end you can set up a pool you can debug at 3 a.m.: named threads, every failure reported with its request id, context carried to the worker, the right metrics, a clean shutdown, and no task waiting on another task in the same pool.","quiz":[{"q":"A report service uses a fixed pool of 4. Each report task submits two sub-queries to the same pool and calls <code>get()<\/code> on both. It passes every test and hangs at month-end with the CPU near zero. What happened?","options":["The sub-queries got slow, so the reports need more time","Four report tasks hold all four threads, and each waits for sub-queries queued behind other reports, so nothing can ever finish","Two report tasks locked each other's monitors","The queue overflowed and the sub-queries were rejected"],"answer":1,"why":"This is pool-induced deadlock. The awaited tasks need a free thread, and all the threads are busy waiting for them. Slowness wouldn't drop the CPU to zero forever, no monitors are involved, and a fixed pool's queue is unbounded, so nothing is rejected.","from":null},{"q":"A request thread puts <code>requestId=req-42<\/code> in the MDC and submits a task to a fixed pool. The task logs a line. With no context propagation in place, which request id is on that line?","options":["<code>req-42<\/code>, because pool threads inherit the MDC","None, every time, because pool threads clear their MDC between tasks","Whatever that pool thread last had: often none, sometimes a stale id from an earlier task","The logging call throws, because the MDC isn't thread-safe"],"answer":2,"why":"The MDC is a <code>ThreadLocal<\/code> on the worker thread. That thread was created long ago and is reused, so it holds nothing, or whatever an earlier task put there and didn't clean up. Nothing clears it between tasks unless your wrapper does.","from":null},{"q":"Which number warns you first that a bounded <code>ThreadPoolExecutor<\/code> is falling behind, before it starts rejecting?","options":["<code>getPoolSize()<\/code>","<code>getCompletedTaskCount()<\/code>","<code>getLargestPoolSize()<\/code>","<code>getQueue().size()<\/code> climbing, or the time tasks spend in the queue"],"answer":3,"why":"A queue that keeps growing means arrivals outpace completions, and every queued task's wait grows with it. Pool size is fixed in a fixed pool, the completed count only rises, and the largest pool size is history. When the queue is full, rejections start.","from":null},{"q":"Intake hands work to <code>enrichPool<\/code>, whose tasks submit to <code>ledgerPool<\/code>. The pod gets <code>SIGTERM<\/code>. In what order do you shut down?","options":["Stop intake, shut down <code>enrichPool<\/code> and wait for it, then shut down <code>ledgerPool<\/code> and wait for it","Shut down <code>ledgerPool<\/code>, then <code>enrichPool<\/code>, then stop intake","Call <code>shutdownNow()<\/code> on both pools at once to be quick","Stop intake, then shut down <code>ledgerPool<\/code> first because it holds the money"],"answer":0,"why":"Upstream first. While <code>enrichPool<\/code> drains, its tasks still submit to <code>ledgerPool<\/code>, so <code>ledgerPool<\/code> must keep accepting work until then. Shutting it down first makes those submissions fail with <code>RejectedExecutionException<\/code>, and <code>shutdownNow<\/code> on both interrupts work that could have finished.","from":null},{"q":"From \"Inside ThreadPoolExecutor\": a <code>ProductionPool<\/code> has 4 threads and a queue of 100, with the default <code>AbortPolicy<\/code>. 200 slow tasks arrive at once. How many are rejected?","options":["0","96","100","196"],"answer":1,"why":"Four tasks start the four threads, the next 100 fill the queue, and core equals max, so the pool can't grow. The remaining 96 are rejected with <code>RejectedExecutionException<\/code>, which is what a bounded queue is for: the caller hears about the overload at once.","from":"exec-02"}],"cards":[{"front":"How do you name pool threads on JDK 21+?","back":"<p>Pass <code>Thread.ofPlatform().name(\"ledger-\", 0).factory()<\/code> to the executor. Threads are named ledger-0, ledger-1, ...<\/p>"},{"front":"Which pool failures reach an <code>UncaughtExceptionHandler<\/code>?","back":"<p>Only tasks run with <code>execute()<\/code>. With <code>submit()<\/code> the exception is stored in the Future and nothing is printed.<\/p>"},{"front":"Why does an MDC value disappear when you hand a task to a pool?","back":"<p>The MDC is a ThreadLocal, and the task runs on another thread. Capture it at submission and install it in the worker.<\/p>"},{"front":"Why must a context wrapper restore the worker's value in <code>finally<\/code>?","back":"<p>Pool threads are reused. Whatever one task leaves behind is the next task's context.<\/p>"},{"front":"What is pool-induced deadlock?","back":"<p>Tasks in a bounded pool block waiting for other tasks queued in the same pool; every thread waits and the awaited tasks never start.<\/p>"},{"front":"Name two fixes for pool-induced deadlock.","back":"<p>Compose instead of blocking (<code>supplyAsync(...).thenApply(...)<\/code>), or give each stage its own pool so waits never point back into the same pool.<\/p>"},{"front":"In what order do you shut down chained pools?","back":"<p>Stop intake, then shut down the upstream pool and wait, then the downstream one, all within one deadline.<\/p>"}],"terms":[{"term":"Thread factory","plain":"The object a pool asks for new threads; it sets their names, daemon flag and exception handler."},{"term":"UncaughtExceptionHandler","plain":"Code that runs when an exception escapes a thread's run method."},{"term":"MDC","plain":"Mapped Diagnostic Context: per-thread key-value pairs that SLF4J adds to every log line."},{"term":"Context propagation","plain":"Copying thread-local state such as a request id from the submitting thread to the worker."},{"term":"Pool-induced deadlock","plain":"Every thread in a pool waits for a task that is queued in that same pool. Also called thread starvation deadlock."},{"term":"Graceful shutdown","plain":"Stopping intake, letting in-flight work finish within a deadline, and recording what didn't."}],"remote":true},"vt-01":{"id":"vt-01","track":"vt","n":1,"title":"The thread-per-request wall","ready":true,"minutes":35,"goal":"By the end you can use Little's law to say how many threads a blocking service needs, explain why platform threads cap its throughput, and say what virtual threads change and what they don't.","quiz":[{"q":"A service receives 3,000 requests per second and each one takes 50 ms. How many requests are in flight on average?","options":["60","150","600","3,000"],"answer":1,"why":"L = λ × W = 3,000/s × 0.05 s = 150. Dividing instead of multiplying gives 60, a common slip. The 3,000 figure is a rate per second, not a count of requests in flight at one moment.","from":null},{"q":"A 200-thread pool serves 1,000 requests per second at 200 ms each. The card issuer slows down and each request now takes 2 s. CPU drops to 3%. What is the most the service can finish per second now?","options":["Still 1,000, since the CPU is idle","500","100","20"],"answer":2,"why":"λ max = threads / W = 200 / 2 s = 100 requests per second. Idle CPU doesn't help: the limit is threads held while waiting, not computation. That is why one slow dependency can take down a thread-per-request service.","from":null},{"q":"You move a blocking handler from a 200-thread pool to one virtual thread per request. At low traffic, how does one request's latency change? It spends 120 ms waiting on the issuer.","options":["About the same: it still waits 120 ms for the issuer","It drops to a few milliseconds, because virtual threads don't really block","It halves, because virtual threads switch faster","It doubles, because of the scheduling overhead"],"answer":0,"why":"Virtual threads give scale, not speed. The request still waits for the issuer. What changes is how many requests can wait at once without running out of threads, so at high traffic the queueing delay disappears.","from":null},{"q":"Which workload gains the most from virtual threads?","options":["A batch job that computes HMACs over 50 million ledger rows on 8 cores","A low-traffic admin API that serves 5 requests per second","A report that is slow because one SQL query takes 30 s","A payments API that waits on HTTP and database calls for 190 ms of every 200 ms request"],"answer":3,"why":"Virtual threads help when many tasks are in flight and most of their time is spent blocked. The HMAC batch job is CPU-bound, so 8 cores is the limit either way. The admin API never runs out of threads. The slow query is one request that is still slow on any thread.","from":null},{"q":"From the executors track: <code>Executors.newFixedThreadPool(200)<\/code> receives 1,500 tasks per second that each block for 200 ms. What happens to the tasks it can't start right away?","options":["They are rejected with RejectedExecutionException","The pool adds threads up to its maximum","They wait in an unbounded queue, so the queue and the latency keep growing","They run on the submitting thread"],"answer":2,"why":"<code>newFixedThreadPool<\/code> uses an unbounded <code>LinkedBlockingQueue<\/code>, and core and maximum size are both 200. Nothing is rejected and no thread is added. Tasks queue without limit, which is exactly the growing latency Little's law predicts.","from":"exec-02"}],"cards":[{"front":"State Little's law.","back":"<p>L = λ × W: the number of requests in flight equals the arrival rate times the time each request spends in the system.<\/p>"},{"front":"1,500 requests per second, 200 ms each. How many threads does thread-per-request need?","back":"<p>300 (1,500 × 0.2).<\/p>"},{"front":"200 threads, each request holds one for 200 ms. What is the maximum throughput?","back":"<p>1,000 requests per second (200 / 0.2 s). Above that the queue grows, even with idle CPU.<\/p>"},{"front":"What is a platform thread?","back":"<p>A <code>java.lang.Thread<\/code> backed one to one by an OS thread, with its own stack (1 MB reserved by default on 64-bit Linux).<\/p>"},{"front":"Do virtual threads make a single request faster?","back":"<p>No. They give scale (more requests in flight at once), not speed. Each request waits just as long.<\/p>"},{"front":"In which JDK did virtual threads become final, and under which JEP?","back":"<p>JDK 21, JEP 444.<\/p>"},{"front":"What happens when a handler on an event-loop thread makes a blocking JDBC call?","back":"<p>It blocks the event-loop thread, so every other request on that loop stalls until the call returns.<\/p>"}],"terms":[{"term":"Platform thread","plain":"A Java thread that is one OS thread. Expensive, so you get thousands."},{"term":"Virtual thread","plain":"A Java thread scheduled by the JDK on a few OS threads. Cheap, so you can have millions."},{"term":"Thread-per-request","plain":"A server style where each request gets one thread for its whole life."},{"term":"Little's law","plain":"In flight = arrival rate × time inside. L = λ × W."},{"term":"Throughput","plain":"How many requests finish per second."},{"term":"Latency","plain":"How long one request takes from start to end."},{"term":"Event loop","plain":"A thread that runs many requests' callbacks in turn and must never block."}],"remote":true},"vt-02":{"id":"vt-02","track":"vt","n":2,"title":"How virtual threads work: carriers and continuations","ready":true,"minutes":35,"goal":"By the end you can explain what happens to a virtual thread when it blocks: how it unmounts from its carrier, where its stack goes, and how the scheduler brings it back.","quiz":[{"q":"Inside a virtual thread that is mounted on <code>ForkJoinPool-1-worker-3<\/code>, what does <code>Thread.currentThread()<\/code> return?","options":["The carrier thread <code>ForkJoinPool-1-worker-3<\/code>","The virtual thread","<code>null<\/code>, because virtual threads aren't registered with the JVM","The scheduler's <code>ForkJoinPool<\/code>"],"answer":1,"why":"The JDK hides the carrier on purpose. Code in a virtual thread always sees the virtual thread as the current thread, so <code>ThreadLocal<\/code>s and <code>interrupt()<\/code> behave per virtual thread. The carrier only shows up in <code>toString()<\/code>, as debugging help.","from":null},{"q":"On an 8-core machine with default settings, you start 100,000 virtual threads that each sleep for 10 seconds. About how many carrier threads exist while they sleep?","options":["100,000, one per virtual thread","256, the scheduler's maximum","About 8","One, because the scheduler is single-threaded"],"answer":2,"why":"The scheduler's parallelism defaults to the number of cores. Sleeping virtual threads are unmounted and don't need a carrier at all. The pool only grows toward 256 for a while when something captures a carrier, such as file I/O.","from":null},{"q":"A service has 4 carriers. Four virtual threads each run a 2-second loop that hashes data without ever blocking. A fifth virtual thread should log a heartbeat every 100 ms. What happens to the heartbeat?","options":["It logs on time, because the JVM time-slices virtual threads","It stalls for about 2 seconds, until a hashing thread finishes and frees a carrier","The JVM moves the heartbeat to a new platform thread automatically","The hashing threads are suspended every 10 ms so others can run"],"answer":1,"why":"Virtual threads have no time slicing. A virtual thread gives up its carrier only when it blocks or ends. Four CPU-bound virtual threads hold all four carriers, so the heartbeat waits in the queue. Keep long CPU work off the virtual thread scheduler.","from":null},{"q":"A virtual thread is parked inside <code>queue.take()<\/code>, 120 frames deep in your framework. Where are those 120 frames right now?","options":["On the carrier thread's stack, which stays reserved for it","In a 1 MB native stack reserved when the virtual thread started","On the Java heap, in stack chunk objects","Nowhere: the JDK will rerun the method from the start when it wakes"],"answer":2,"why":"When a virtual thread unmounts, the JDK copies its frames into stack chunk objects on the heap and frees the carrier. Nothing is reserved up front; the chunks are as big as the real stack. On remount, the top frames are copied back first and the rest on demand.","from":null},{"q":"From the lesson \"A thread's life: start, join, sleep, interrupt\": you call <code>t.interrupt()<\/code> on a virtual thread that is inside <code>Thread.sleep(10_000)<\/code>. What happens?","options":["<code>sleep<\/code> throws <code>InterruptedException<\/code> right away, and the interrupt flag is cleared","Nothing until the 10 seconds are up, because the virtual thread is unmounted","The virtual thread is killed","The carrier thread gets the interrupt instead"],"answer":0,"why":"Interruption works on virtual threads exactly as on platform threads. The JDK unparks the sleeping virtual thread, <code>sleep<\/code> throws <code>InterruptedException<\/code> and clears the flag. Being unmounted doesn't matter: the interrupt is delivered to the virtual thread, not the carrier.","from":"conc-02"}],"cards":[{"front":"What is a carrier thread?","back":"<p>A platform thread (a worker of the virtual thread scheduler's <code>ForkJoinPool<\/code>) that runs a virtual thread while it is mounted.<\/p>"},{"front":"What happens when a virtual thread unmounts?","back":"<p>At a blocking call its continuation yields: the frames are copied to the heap and the carrier goes back to run other virtual threads.<\/p>"},{"front":"How many carrier threads does the default scheduler use?","back":"<p>One per core (<code>availableProcessors()<\/code>), set by <code>jdk.virtualThreadScheduler.parallelism<\/code>. It can add carriers temporarily, up to 256 by default.<\/p>"},{"front":"Does the JVM time-slice virtual threads?","back":"<p>No. A virtual thread keeps its carrier until it blocks or ends.<\/p>"},{"front":"Where are a parked virtual thread's stack frames?","back":"<p>On the Java heap, in stack chunk objects sized to the real stack depth.<\/p>"},{"front":"Is the virtual thread scheduler <code>ForkJoinPool.commonPool()<\/code>?","back":"<p>No. It is a separate <code>ForkJoinPool<\/code> in FIFO mode. Parallel streams and default <code>CompletableFuture<\/code> async methods use the common pool.<\/p>"},{"front":"Name two operations that unmount a virtual thread and one that captures the carrier instead.","back":"<p>Unmount: <code>Thread.sleep<\/code>, socket reads, <code>ReentrantLock.lock<\/code>, <code>BlockingQueue.take<\/code>. Capture: most file I/O.<\/p>"}],"terms":[{"term":"Continuation","plain":"Code that can pause at a point and resume later with its stack intact."},{"term":"Carrier thread","plain":"A platform thread that runs virtual threads, one at a time."},{"term":"Mount / unmount","plain":"Start running a virtual thread on a carrier / take it off the carrier at a blocking call."},{"term":"Scheduler","plain":"The ForkJoinPool that decides which ready virtual thread a free carrier runs next."},{"term":"Stack chunk","plain":"A heap object holding the saved frames of an unmounted virtual thread."},{"term":"Stackful vs stackless","plain":"Saving the real call stack (virtual threads) vs saving only compiler-chosen locals (Kotlin coroutines)."},{"term":"Time slicing","plain":"Forcing a running thread off the CPU after a time slot. The OS does it to platform threads; nobody does it to virtual threads."}],"remote":true},"vt-03":{"id":"vt-03","track":"vt","n":3,"title":"Using virtual threads: one per task, limits with semaphores","ready":true,"minutes":35,"goal":"By the end you can start virtual threads the right way, fan out thousands of blocking calls with one virtual thread per task, and cap what a downstream system sees with a shared Semaphore instead of a pool.","quiz":[{"q":"10,000 concurrent requests each call a fraud API that allows 50 concurrent calls. Which design is right?","options":["<code>newFixedThreadPool(50)<\/code> of platform threads for all request handling","<code>newFixedThreadPool(50, Thread.ofVirtual().factory())<\/code>","A virtual thread per request, and one shared <code>Semaphore(50)<\/code> around the fraud call","A virtual thread per request, and a <code>new Semaphore(50)<\/code> created inside each request handler"],"answer":2,"why":"The limit belongs to the fraud API, so put one semaphore on the client and share it. Both pools limit all request handling, not just the fraud call. A semaphore created per request gives every request its own 50 permits, which limits nothing at all.","from":null},{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kd\">var<\/span><span class=\"w\"> <\/span><span class=\"n\">perTask<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Executors<\/span><span class=\"p\">.<\/span><span class=\"na\">newVirtualThreadPerTaskExecutor<\/span><span class=\"p\">())<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">3<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"o\">++<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">perTask<\/span><span class=\"p\">.<\/span><span class=\"na\">submit<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"n\">Thread<\/span><span class=\"p\">.<\/span><span class=\"na\">currentThread<\/span><span class=\"p\">().<\/span><span class=\"na\">getName<\/span><span class=\"p\">().<\/span><span class=\"na\">isEmpty<\/span><span class=\"p\">()));<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"done\"<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre>","options":["<code>true<\/code> three times, then <code>done<\/code>","<code>done<\/code> first, then <code>true<\/code> three times","<code>false<\/code> three times, then <code>done<\/code>, because each thread is named <code>pool-1-thread-N<\/code>","Nothing: the tasks are cancelled when the block ends"],"answer":0,"why":"Virtual threads have no name by default, so <code>getName()<\/code> is empty. <code>close()<\/code> at the end of the try block waits for all three tasks before <code>done<\/code> runs. The <code>pool-1-thread-N<\/code> names belong to the platform threads of <code>newFixedThreadPool<\/code>.","from":null},{"q":"A <code>Semaphore(20)<\/code> guards a 50 ms call. 1,000 virtual threads reach <code>acquire()<\/code> at the same moment. About how long until the last one gets a permit?","options":["About 50 ms","About 2.5 s","About 50 s","Never: 980 threads fail with an exception"],"answer":1,"why":"Twenty permits on a 50 ms call serve 400 calls per second, so 1,000 calls need about 2.5 s, and the last thread waits for nearly all of it. Nothing fails: <code>acquire()<\/code> waits as long as it takes. Use <code>tryAcquire<\/code> with a timeout if that wait is too long.","from":null},{"q":"You submit 1 million tasks to <code>Executors.newVirtualThreadPerTaskExecutor()<\/code>. How many threads can it create?","options":["As many as there are cores","256, the scheduler's maximum","A pool the JVM sizes from the workload","Up to 1 million: one new virtual thread per task, with no limit"],"answer":3,"why":"The Javadoc says the number of threads it creates is unbounded. The core count and the 256 cap describe carrier threads, which run the virtual threads. They don't limit how many virtual threads exist.","from":null},{"q":"From the lesson \"Synchronizers: latch, barrier, semaphore, phaser\": a developer writes <code>try { sem.acquire(); call(); } finally { sem.release(); }<\/code>. A thread is interrupted while it waits inside <code>acquire()<\/code>. What happens to the semaphore?","options":["Nothing: <code>release()<\/code> ignores threads that hold no permit","<code>acquire()<\/code> retries automatically after the interrupt","It gains a permit it never handed out, so the limit quietly grows by one","<code>release()<\/code> throws <code>IllegalMonitorStateException<\/code>"],"answer":2,"why":"A <code>Semaphore<\/code> doesn't track who holds permits. <code>release()<\/code> always adds one, even from a thread that never acquired. Every interrupted waiter raises the limit by one. Put <code>acquire()<\/code> before the <code>try<\/code> so <code>finally<\/code> only runs after a permit was really taken.","from":"conc-10"}],"cards":[{"front":"Which executor gives every task its own new virtual thread?","back":"<p><code>Executors.newVirtualThreadPerTaskExecutor()<\/code>. It has no pool, no queue and no limit.<\/p>"},{"front":"What does <code>close()<\/code> on an <code>ExecutorService<\/code> do (JDK 19+)?","back":"<p>It calls <code>shutdown()<\/code> and then waits until every submitted task has finished.<\/p>"},{"front":"Should you pool virtual threads?","back":"<p>No. Create one per task, and limit the scarce resource with a shared <code>Semaphore<\/code>.<\/p>"},{"front":"Where does the <code>Semaphore<\/code> for a downstream API belong?","back":"<p>One per resource, shared by all callers, for example a field on the API client. One per request limits nothing.<\/p>"},{"front":"<code>Semaphore(20)<\/code> guards a call that takes 100 ms. Maximum calls per second?","back":"<p>200 (20 / 0.1 s).<\/p>"},{"front":"Why put <code>acquire()<\/code> before the <code>try<\/code> and <code>release()<\/code> in <code>finally<\/code>?","back":"<p>So a thread that fails to acquire never releases a permit it didn't get, and a thread whose call throws always gives its permit back.<\/p>"},{"front":"How do you make a semaphore wait fail fast?","back":"<p><code>tryAcquire(timeout, unit)<\/code> returns <code>false<\/code> if no permit arrives in time, so you can reject the request.<\/p>"}],"terms":[{"term":"Thread.Builder","plain":"The JDK 21 API for creating threads: <code>Thread.ofVirtual()<\/code> and <code>Thread.ofPlatform()<\/code>."},{"term":"Thread-per-task executor","plain":"An executor that starts a new thread for every task and never reuses one."},{"term":"Fan-out","plain":"Starting many calls at once and then collecting all their results."},{"term":"Semaphore","plain":"A counter of permits. <code>acquire<\/code> takes one or waits, <code>release<\/code> gives one back."},{"term":"Bulkhead","plain":"A limit on how many calls may be inside one downstream at once, so one slow dependency can't use up everything."},{"term":"Load shedding","plain":"Rejecting work quickly when you're over capacity, instead of letting it queue."}],"remote":true},"vt-04":{"id":"vt-04","track":"vt","n":4,"title":"Pinning, ThreadLocals and other traps","ready":true,"minutes":35,"goal":"By the end you can say what pins a virtual thread on JDK 21 and on JDK 25, find pinning with JFR, and fix the two classic migration traps: a monitor held around I/O and a ThreadLocal used as a cache.","quiz":[{"q":"A service on JDK 25 has <code>synchronized<\/code> blocks around JDBC calls in an old DAO. You are moving request handling to virtual threads. What should you do about those blocks?","options":["Replace every one with <code>ReentrantLock<\/code> before the switch, or the service will pin","Nothing for pinning: on JDK 24+ they don't pin. Keep a JFR recording to catch the pins that remain","Run with <code>-Djdk.tracePinnedThreads=full<\/code> and fix what it prints","Wrap each JDBC call in <code>Thread.ofPlatform().start(...)<\/code>"],"answer":1,"why":"JEP 491 (JDK 24) lets virtual threads hold monitors without pinning, so on JDK 25 these blocks are fine. Rewriting them is the JDK 21 advice. <code>-Djdk.tracePinnedThreads<\/code> no longer exists on JDK 24+, so it would print nothing and prove nothing.","from":null},{"q":"Which tool shows you, on JDK 25, that a virtual thread pinned its carrier for 180 ms and why?","options":["<code>jstack &lt;pid&gt;<\/code>","<code>Thread.getAllStackTraces()<\/code> from a debug endpoint","The JFR event <code>jdk.VirtualThreadPinned<\/code>, printed with <code>jfr print<\/code>","<code>-Djdk.tracePinnedThreads=short<\/code>"],"answer":2,"why":"<code>jdk.VirtualThreadPinned<\/code> is recorded for pins over 20 ms by default and carries the stack, and on JDK 25 also the pinned reason and carrier. <code>jstack<\/code> and <code>getAllStackTraces()<\/code> show platform threads, not parked virtual threads, and the trace property was removed in JDK 24.","from":null},{"q":"A payment service hashes request bodies with a <code>ThreadLocal&lt;MessageDigest&gt;<\/code> cache. It moves from a 200-thread pool to one virtual thread per request and serves 1 million requests. About how many <code>MessageDigest<\/code> objects does it create?","options":["200, the same as before","One per carrier thread, so about the number of cores","About 1 million, one per request","One, because ThreadLocal values are shared between virtual threads"],"answer":2,"why":"Each virtual thread has its own thread-local map, and each request runs on a new virtual thread, so <code>withInitial<\/code> runs once per request. Carriers don't matter: the JDK keeps a virtual thread's thread locals separate from its carrier's. Share a thread-safe object, or create one per call on purpose.","from":null},{"q":"An 8-core batch job resizes 10,000 images, each taking about 50 ms of pure CPU. It runs on <code>newFixedThreadPool(8)<\/code>. What happens if you switch it to <code>newVirtualThreadPerTaskExecutor()<\/code>?","options":["It finishes in about the same time, about 62 s, because only 8 can compute at once either way","It finishes in about 50 ms, because all 10,000 run at once","It finishes about 8 times faster","It deadlocks, because virtual threads can't run CPU work"],"answer":0,"why":"There are 8 carriers, so at most 8 virtual threads compute at once: 10,000 × 50 ms / 8 = 62.5 s, the same as the pool. Virtual threads only help when tasks spend their time waiting. With no time slicing, they can also delay other virtual threads in the same JVM.","from":null},{"q":"From the lesson \"Don't share: immutability, confinement, ThreadLocal\": <code>SimpleDateFormat<\/code> is not thread-safe. Which fix works equally well on a platform pool and on one virtual thread per task, with no per-thread state at all?","options":["Wrap every <code>format<\/code> call in <code>synchronized<\/code>","One shared, immutable <code>DateTimeFormatter<\/code>","A <code>ThreadLocal&lt;SimpleDateFormat&gt;<\/code>","A <code>volatile SimpleDateFormat<\/code> field"],"answer":1,"why":"An immutable object is safe to share with any number of threads, so it needs no per-thread copies and no locking. The <code>ThreadLocal<\/code> works on a pool but becomes one formatter per task on virtual threads. <code>synchronized<\/code> is correct but makes every caller wait in line. <code>volatile<\/code> makes the reference visible but leaves the formatter's internal state racy.","from":"conc-11"}],"cards":[{"front":"What does it mean that a virtual thread is pinned?","back":"<p>It reaches a blocking call but can't unmount, so it stays on its carrier and the carrier blocks with it.<\/p>"},{"front":"Does blocking inside <code>synchronized<\/code> pin a virtual thread on JDK 25?","back":"<p>No. Since JDK 24 (JEP 491) monitors don't pin. On JDK 21 to 23 they do.<\/p>"},{"front":"What still pins a virtual thread on JDK 25?","back":"<p>Blocking while a class initializer or a native frame (JNI, or an FFM downcall that calls back into Java) is on its stack.<\/p>"},{"front":"How do you detect pinning on JDK 24 and later?","back":"<p>The JFR event <code>jdk.VirtualThreadPinned<\/code> (on by default, 20 ms threshold). <code>-Djdk.tracePinnedThreads<\/code> was removed in JDK 24.<\/p>"},{"front":"Why does a <code>ThreadLocal<\/code> cache stop working with one virtual thread per task?","back":"<p>Each task runs on a new virtual thread with an empty thread-local map, so the cached object is built once per task and thrown away.<\/p>"},{"front":"Do virtual threads speed up CPU-bound work?","back":"<p>No. At most one virtual thread per carrier (per core) computes at once, and there is no time slicing.<\/p>"},{"front":"Kotlin replacement for <code>@Synchronized<\/code> around I/O on JDK 21?","back":"<p><code>private val lock = ReentrantLock()<\/code> and <code>lock.withLock { ... }<\/code> from <code>kotlin.concurrent<\/code>.<\/p>"}],"terms":[{"term":"Pinning","plain":"A virtual thread stuck on its carrier during a blocking call, so the carrier blocks too."},{"term":"Monitor","plain":"The lock behind <code>synchronized<\/code> and <code>@Synchronized<\/code>, built into every Java object."},{"term":"JEP 491","plain":"The JDK 24 change that lets virtual threads hold monitors without pinning."},{"term":"JFR","plain":"Java Flight Recorder: the JVM's built-in, low-overhead event recorder."},{"term":"jdk.VirtualThreadPinned","plain":"The JFR event recorded when a virtual thread blocks while pinned for longer than the threshold."},{"term":"Carrier capture","plain":"A blocking call, such as a file read, that keeps the carrier; the scheduler adds a temporary carrier."},{"term":"ThreadLocal cache","plain":"Keeping one copy of an object per thread to reuse it. Useless when every task gets a new thread."}],"remote":true},"vt-05":{"id":"vt-05","track":"vt","n":5,"title":"Structured concurrency and scoped values","ready":true,"minutes":35,"goal":"By the end you can say what structured concurrency guarantees, build fail-fast fork and join on a plain executor, read the JDK 25 <code>StructuredTaskScope<\/code> API and what changes after it, and use scoped values instead of request-context ThreadLocals.","quiz":[{"q":"You compile on JDK 25 with <code>--enable-preview<\/code>. Which fan-out compiles and fails fast?","options":["<code>try (var scope = new StructuredTaskScope.ShutdownOnFailure()) { ...; scope.join().throwIfFailed(); }<\/code>","<code>try (var scope = StructuredTaskScope.open()) { ...; scope.join(); }<\/code>, with callers catching <code>StructuredTaskScope.FailedException<\/code>","<code>try (var scope = StructuredTaskScope.open()) { ...; scope.join(); } catch (ExecutionException e) { ... }<\/code>","<code>try (var scope = Executors.newStructuredTaskScope()) { ...; scope.join(); }<\/code>"],"answer":1,"why":"JDK 25 (JEP 505) uses the static <code>open()<\/code> factory, and its default joiner makes <code>join()<\/code> throw the unchecked <code>FailedException<\/code>. <code>ShutdownOnFailure<\/code> is the JDK 21 to 24 API and no longer exists. Catching the checked <code>ExecutionException<\/code> is the JDK 27 shape; on JDK 25 nothing in the try block throws it, so javac rejects the catch. There is no <code>Executors.newStructuredTaskScope()<\/code>.","from":null},{"q":"<p>What does this print on JDK 25?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">ScopedValue<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">ID<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">ScopedValue<\/span><span class=\"p\">.<\/span><span class=\"na\">newInstance<\/span><span class=\"p\">();<\/span>\n\n<span class=\"n\">ScopedValue<\/span><span class=\"p\">.<\/span><span class=\"na\">where<\/span><span class=\"p\">(<\/span><span class=\"n\">ID<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"a\"<\/span><span class=\"p\">).<\/span><span class=\"na\">run<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">ScopedValue<\/span><span class=\"p\">.<\/span><span class=\"na\">where<\/span><span class=\"p\">(<\/span><span class=\"n\">ID<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"b\"<\/span><span class=\"p\">).<\/span><span class=\"na\">run<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">ID<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">()));<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">ID<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">());<\/span>\n<span class=\"p\">});<\/span>\n<span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">ID<\/span><span class=\"p\">.<\/span><span class=\"na\">orElse<\/span><span class=\"p\">(<\/span><span class=\"s\">\"-\"<\/span><span class=\"p\">));<\/span>\n<\/code><\/pre>","options":["<code>bb-<\/code>","<code>ab-<\/code>","<code>ba-<\/code>","<code>bab<\/code>"],"answer":2,"why":"The inner <code>where<\/code> rebinds <code>ID<\/code> to <code>b<\/code> for the nested call only. When it returns, the outer binding <code>a<\/code> is back, and after the outer <code>run()<\/code> nothing is bound, so <code>orElse<\/code> gives <code>-<\/code>. There is no <code>set()<\/code> that could leave <code>b<\/code> behind, which is the difference from a <code>ThreadLocal<\/code>.","from":null},{"q":"Inside <code>ScopedValue.where(TENANT, \"bank-a\").run(...)<\/code>, a handler submits a task to <code>Executors.newVirtualThreadPerTaskExecutor()<\/code>. What does <code>TENANT.isBound()<\/code> return inside that task?","options":["<code>false<\/code>: only subtasks forked in a <code>StructuredTaskScope<\/code> see the parent's binding","<code>true<\/code>: every virtual thread inherits its creator's scoped values","<code>true<\/code>, but only if the task starts before <code>run()<\/code> returns","It throws <code>IllegalStateException<\/code>, because scoped values can't be read on virtual threads"],"answer":0,"why":"Scoped value bindings flow only into threads forked by a <code>StructuredTaskScope<\/code>, whose lifetime is guaranteed to fit inside the binding. A thread started by an executor could outlive the <code>run()<\/code> call, so it gets nothing. Pass the value as an argument there. The second option describes <code>InheritableThreadLocal<\/code>, which copies values into every new thread.","from":null},{"q":"You want an FX rate from whichever of two providers answers first, and the slower call cancelled. Which tool fits?","options":["<code>CompletableFuture.anyOf(primary, backup)<\/code>","<code>StructuredTaskScope.open()<\/code> with the default joiner","<code>StructuredTaskScope.open(Joiner.allSuccessfulOrThrow())<\/code>","<code>StructuredTaskScope.open(Joiner.anySuccessfulResultOrThrow())<\/code> (JDK 25 name)"],"answer":3,"why":"<code>anySuccessfulResultOrThrow<\/code> (renamed <code>anySuccessfulOrThrow<\/code> in JDK 26) returns the first successful result and cancels the rest. <code>CompletableFuture.anyOf<\/code> completes with the first result but cancels nothing, so the slower call runs to the end. The default joiner and <code>allSuccessfulOrThrow<\/code> both wait for every subtask to succeed.","from":null},{"q":"From the lesson \"Callable, Future, cancellation and interruption\": a fail-fast scope cancels a sibling that runs <code>while (true) { total = total.add(nextChunk(buffer)); }<\/code>, pure computation that never blocks and never checks the interrupt flag. What happens to that sibling?","options":["It stops at once, because cancelling a subtask kills its thread","It keeps running: cancellation only interrupts, and this loop never looks","It stops at its next loop iteration, because virtual threads check the flag automatically","The JVM throws <code>InterruptedException<\/code> inside <code>add<\/code>"],"answer":1,"why":"Cancellation in Java is cooperative. <code>cancel(true)<\/code>, <code>shutdownNow()<\/code> and a scope's cancel all just set the interrupt flag. Blocking calls react by throwing <code>InterruptedException<\/code>; a loop that never blocks must check <code>Thread.currentThread().isInterrupted()<\/code> itself. A scope's <code>close()<\/code> would wait for this loop forever.","from":"exec-04"}],"cards":[{"front":"What does structured concurrency guarantee when the block that opened a scope ends?","back":"<p>Every subtask forked in the scope has finished. None is still running, whether the block returned, threw or was interrupted.<\/p>"},{"front":"In a fail-fast scope, what happens to the other subtasks when one fails?","back":"<p>They are cancelled, which means interrupted. <code>join()<\/code> throws the first failure.<\/p>"},{"front":"What does <code>join()<\/code> throw on JDK 25 when a subtask fails in <code>StructuredTaskScope.open()<\/code>?","back":"<p><code>StructuredTaskScope.FailedException<\/code> (unchecked), with the subtask's exception as its cause. From JDK 27 the built-in joiners throw <code>ExecutionException<\/code>.<\/p>"},{"front":"Is <code>StructuredTaskScope<\/code> final in JDK 25?","back":"<p>No. It is a preview API in JDK 25, 26 and 27 and needs <code>--enable-preview<\/code>. JEP 543 makes it final in JDK 28.<\/p>"},{"front":"Are scoped values final in JDK 25?","back":"<p>Yes, since JDK 25 (JEP 506). They need no flag.<\/p>"},{"front":"Which threads can read a scoped value's binding?","back":"<p>Code running inside <code>where(...).run(...)<\/code> or <code>call(...)<\/code>, and subtasks forked in a <code>StructuredTaskScope<\/code> opened there. Not threads you start yourself and not executor tasks.<\/p>"},{"front":"Why can't a hand-built scope cancel with <code>future.cancel(true)<\/code> and rely on <code>executor.close()<\/code> to wait?","back":"<p>A cancelled future is done at once, so on JDK 21 the executor stops waiting for that thread while it still runs its <code>finally<\/code>. Use <code>shutdownNow()<\/code>, which interrupts without completing the futures.<\/p>"}],"terms":[{"term":"Structured concurrency","plain":"Concurrent subtasks are tied to the block that started them and can't outlive it."},{"term":"Scope","plain":"The object that forks subtasks, joins them, and on close guarantees they have all ended."},{"term":"Fail fast","plain":"The first failure cancels the remaining subtasks and is reported at once."},{"term":"Joiner","plain":"The policy you pass to <code>StructuredTaskScope.open<\/code>: when <code>join()<\/code> returns and what it returns or throws."},{"term":"Scoped value","plain":"A read-only value bound for the length of one call and visible to all the code that call runs."},{"term":"Preview API","plain":"A complete JDK API that is not final yet. It needs <code>--enable-preview<\/code> and can change in the next release."}],"remote":true},"vt-06":{"id":"vt-06","track":"vt","n":6,"title":"Moving a blocking service to virtual threads","ready":true,"minutes":35,"goal":"By the end you can migrate a pool-based blocking service to one virtual thread per request without overloading what sits behind it, switch it on in Quarkus or Spring Boot, and use Little's law to check that it worked.","quiz":[{"q":"After the switch to virtual threads, p99 latency doubles at peak while throughput stays flat. Which metric tells you whether the database is the bottleneck?","options":["The number of live virtual threads","The queue length on the database semaphore (or the pool's pending count), climbing at peak","CPU usage of the carrier threads","The number of <code>ForkJoinPool<\/code> worker threads"],"answer":1,"why":"A saturated downstream shows up as a queue that grows while throughput stays flat. Virtual thread counts grow with any slowdown and don't say where the time goes. Carrier CPU is low when everybody waits, and the scheduler's worker count stays near the core count.","from":null},{"q":"A pod handles 300 requests per second, and each request holds a database connection for 25 ms. On average, about how many connections are busy?","options":["About 8","About 25","About 75","About 300"],"answer":0,"why":"Little's law: busy connections = arrival rate × holding time = 300/s × 0.025 s = 7.5. A pool of 10 is close to its limit at this rate, and 10 / 0.025 s = 400 requests per second is where it saturates. The other options mix up the holding time with a count, or assume every request holds a connection the whole time.","from":null},{"q":"In a Quarkus service, how do you run one blocking REST endpoint on virtual threads?","options":["Raise <code>quarkus.thread-pool.max-threads<\/code> to 10,000","Set <code>spring.threads.virtual.enabled=true<\/code>","Annotate the endpoint method with <code>@RunOnVirtualThread<\/code>","Return a <code>Uni<\/code> from the method"],"answer":2,"why":"Quarkus opts in per method or class with <code>@RunOnVirtualThread<\/code>, and each call then runs on a new virtual thread. The thread pool setting sizes platform worker threads. The <code>spring.threads<\/code> property is Spring Boot's global switch. Returning a <code>Uni<\/code> makes the endpoint reactive and runs it on the event loop, which must never block.","from":null},{"q":"After the migration, the connection pool reports timeouts at every peak. Which fix is right?","options":["Raise the pool's maximum size to 1,000 connections","Go back to a fixed pool of 20 platform threads for all request handling","Raise the pool's connection timeout to 5 minutes","Put a shared <code>Semaphore<\/code> sized to the pool around the database work, and use <code>tryAcquire<\/code> with a deadline that fits the request's budget"],"answer":3,"why":"The semaphore restores the limit the old pool gave you, only around the database work, with a queue you can see and a deadline you choose. A huge pool overloads the database for every service that shares it. A fixed pool brings back the cap on everything, including calls that never needed it. A 5-minute timeout hides overload as very slow requests.","from":null},{"q":"From the lesson \"Pinning, ThreadLocals and other traps\": your service runs on JDK 21, and its JDBC driver holds a <code>synchronized<\/code> lock while it reads from the socket. You move request handling to virtual threads. What is the main risk, and the simplest fix?","options":["Pinning: queries block their carriers, and a few slow ones can stall every virtual thread. Upgrade to JDK 25, or to a driver version that uses <code>ReentrantLock<\/code>","Data races inside the driver, because virtual threads don't respect <code>synchronized<\/code>. Wrap every call in your own lock","A <code>ThreadLocal<\/code> leak in the driver. Call <code>remove()<\/code> after each query","No risk: a JDBC driver never blocks while it holds a lock"],"answer":0,"why":"On JDK 21 to 23, blocking while holding a monitor pins the carrier, and with as many carriers as cores, a few slow queries can hold all of them. JEP 491 fixed this in JDK 24, so JDK 25 is the cleanest fix. <code>synchronized<\/code> still gives mutual exclusion on virtual threads, so there is no new race.","from":"vt-04"}],"cards":[{"front":"What limit does a fixed thread pool give you without saying so?","back":"<p>No more than N requests can reach any downstream at once. Moving to virtual threads removes it.<\/p>"},{"front":"Where does the semaphore go when you migrate to virtual threads?","back":"<p>Around the one downstream call that needs the limit, as one object shared by all requests, sized from that downstream.<\/p>"},{"front":"Should you grow the connection pool to match the number of virtual threads?","back":"<p>No. The database decides how many connections help, roughly a few per database CPU core, and every pod multiplies the pool. Queue in front of the pool instead.<\/p>"},{"front":"How do you run a Quarkus REST endpoint on virtual threads?","back":"<p>Annotate the method or class with <code>@RunOnVirtualThread<\/code>. Quarkus has no global switch.<\/p>"},{"front":"How do you switch a Spring Boot 3.2+ application to virtual threads?","back":"<p><code>spring.threads.virtual.enabled=true<\/code><\/p>"},{"front":"Little's law in one line?","back":"<p>Requests in flight = throughput × time in the system (L = λW).<\/p>"},{"front":"Which gauge shows a saturated downstream after the move?","back":"<p>The queue on its semaphore (or the pool's pending count) growing while throughput stays flat.<\/p>"}],"terms":[{"term":"Implicit limit","plain":"A cap on concurrency that nobody configured on purpose, such as a thread pool's size protecting a database."},{"term":"Bulkhead","plain":"An explicit limit on calls to one downstream, usually a shared Semaphore, so it can't be overloaded."},{"term":"Connection pool","plain":"A fixed set of open database connections that callers borrow and return. Callers wait, or time out, when all are in use."},{"term":"Little's law","plain":"In a stable system, requests in flight = throughput × average time in the system."},{"term":"@RunOnVirtualThread","plain":"The annotation that makes Quarkus run an endpoint or message handler on a new virtual thread per call."},{"term":"Load shedding","plain":"Rejecting work quickly, for example with a 503, when a limit is full, instead of letting it wait without end."}],"remote":true},"gen-01":{"id":"gen-01","track":"gen","n":1,"title":"Generics from zero: type parameters","ready":true,"minutes":35,"goal":"By the end you can write generic classes and functions in Kotlin and Java, read <code>&lt;T&gt;<\/code> as a blank the caller fills in, and explain why a type parameter moves a ClassCastException from the read to a compile error at the write.","quiz":[{"q":"Payment metadata is a <code>MutableMap&lt;String, Any&gt;<\/code>. A retry handler stores <code>meta[\"retries\"] = \"3\"<\/code>. A report later runs <code>val n = meta[\"retries\"] as Int<\/code>. What happens?","options":["A compile error on the line that stores \"3\"","A ClassCastException on the line that stores \"3\"","A ClassCastException on the <code>as Int<\/code> line, when the report runs","<code>n<\/code> is 3, because Kotlin converts the string"],"answer":2,"why":"A <code>String<\/code> is an <code>Any<\/code>, so the store compiles and runs. The cast in the report is the first check, and it fails there. Casts never convert values. A typed field such as <code>retries: Int<\/code> would have made the store a compile error.","from":null},{"q":"Given <code>fun &lt;T&gt; firstOrNull(items: List&lt;T&gt;): T?<\/code>, what does the compiler say about <code>val id: String? = firstOrNull(listOf(1, 2))<\/code>?","options":["Initializer type mismatch: expected 'String?', actual 'Int?'","It compiles, and <code>id<\/code> is null","It compiles, and <code>id<\/code> is \"1\"","It compiles, then throws ClassCastException"],"answer":0,"why":"<code>T<\/code> is inferred from the argument as <code>Int<\/code>, so the call returns <code>Int?<\/code>. That does not fit in a <code>String?<\/code>. The type parameter ties the input and the output together, which is the whole point. Nothing is converted at run time.","from":null},{"q":"<code>val none = emptyList()<\/code> does not compile. Which line fixes it?","options":["<code>val none = emptyList&lt;String&gt;()<\/code>","<code>val none: List&lt;String&gt; = emptyList()<\/code>","Either of the two above","Neither: <code>emptyList<\/code> needs an argument"],"answer":2,"why":"The compiler needs to know <code>T<\/code>. You can give the type argument at the call, or give the variable a type and let inference work backwards from it. Both produce a <code>List&lt;String&gt;<\/code>.","from":null},{"q":"Java: <code>List raw = new ArrayList(); raw.add(7); List&lt;String&gt; names = raw; String s = names.get(0);<\/code> What happens?","options":["A compile error on <code>raw.add(7)<\/code>","It compiles with unchecked warnings, then throws ClassCastException on the <code>names.get(0)<\/code> line","It compiles, and <code>s<\/code> is \"7\"","ArrayStoreException on <code>raw.add(7)<\/code>"],"answer":1,"why":"Raw types turn the checks off, so javac only warns. The <code>Integer<\/code> sits in the list until the read, where javac inserted a cast to <code>String<\/code>. The failure appears far from the line that caused it, the same as with <code>Any<\/code>.","from":null},{"q":"From the race conditions lesson: a Kafka consumer does <code>if (!seen.contains(key)) { charge(m); seen.add(key) }<\/code>, where <code>seen<\/code> is <code>ConcurrentHashMap.newKeySet&lt;String&gt;()<\/code>. Two copies of one message arrive on two threads. What is the smallest fix?","options":["Make the field <code>seen<\/code> volatile","Replace <code>seen<\/code> with a <code>Collections.synchronizedSet<\/code>","Call <code>charge<\/code> only after <code>seen.add(key)<\/code> returned true: <code>if (seen.add(key)) charge(m)<\/code>","Make <code>seen<\/code> a <code>MutableSet&lt;Any&gt;<\/code> so both copies fit"],"answer":2,"why":"This is check-then-act. Each set call is atomic, but two calls in a row are not. <code>add<\/code> checks and inserts in one step and returns false for the second copy, so only one thread charges. <code>volatile<\/code> and a synchronized wrapper leave the gap between the two calls.","from":"conc-03"}],"cards":[{"front":"In <code>class Box&lt;T&gt;<\/code>, what is <code>T<\/code>?","back":"<p>A type parameter: a blank that each user of <code>Box<\/code> fills with a real type, such as <code>Box&lt;String&gt;<\/code>.<\/p>"},{"front":"Where does a bad value stored in an <code>Any<\/code> field get caught?","back":"<p>At the cast in the code that reads it, at run time. The stack trace points at the reader, not at the writer with the bug.<\/p>"},{"front":"<code>val e = emptyList()<\/code> gives what error?","back":"<p><code>cannot infer type for type parameter 'T'. Specify it explicitly.<\/code> Fix: <code>emptyList&lt;String&gt;()<\/code> or <code>val e: List&lt;String&gt; = emptyList()<\/code>.<\/p>"},{"front":"Where does <code>&lt;T&gt;<\/code> go in a Kotlin generic function, and in a Java one?","back":"<p>Kotlin: before the name, <code>fun &lt;T&gt; first(xs: List&lt;T&gt;): T<\/code>. Java: before the return type, <code>static &lt;T&gt; T first(List&lt;T&gt; xs)<\/code>.<\/p>"},{"front":"What does Java's diamond in <code>new ArrayList&lt;&gt;()<\/code> do?","back":"<p>It tells javac to infer the type argument from the target type. Without it, <code>new ArrayList()<\/code> is a raw type.<\/p>"},{"front":"What does <code>listOf(1, 2.5)<\/code> infer to?","back":"<p><code>List&lt;Number &amp; Comparable&lt;*&gt;&gt;<\/code>, an intersection type: the closest type that both <code>Int<\/code> and <code>Double<\/code> share.<\/p>"},{"front":"How do you see the type Kotlin inferred for <code>x<\/code>?","back":"<p>Write <code>val probe: Int = x<\/code>. The compile error prints the actual type.<\/p>"}],"terms":[{"term":"Type parameter","plain":"The placeholder in a declaration, like <code>T<\/code> in <code>class Box&lt;T&gt;<\/code>."},{"term":"Type argument","plain":"The real type that fills a type parameter, like <code>String<\/code> in <code>Box&lt;String&gt;<\/code>."},{"term":"Generic function","plain":"A function with its own type parameters, such as <code>fun &lt;T&gt; firstOrNull(items: List&lt;T&gt;): T?<\/code>."},{"term":"Type inference","plain":"The compiler working out type arguments from the values and the expected type."},{"term":"Intersection type","plain":"A type that is two types at once, like <code>Number &amp; Comparable&lt;*&gt;<\/code>. Inferred by the compiler; you cannot write it yourself."},{"term":"Diamond","plain":"Java's <code>&lt;&gt;<\/code> on <code>new<\/code>, asking javac to infer the type arguments."},{"term":"Raw type","plain":"A Java generic type used without type arguments, like plain <code>List<\/code>. The compiler stops checking it."}],"remote":true},"gen-02":{"id":"gen-02","track":"gen","n":2,"title":"Bounds and constraints: upper bounds, where, T : Any","ready":true,"minutes":35,"goal":"By the end you can add an upper bound, a <code>where<\/code> clause or <code>T : Any<\/code> to a type parameter, say what each one lets your code do and which callers it shuts out, and read the matching Java <code>extends<\/code> and <code>&amp;<\/code> syntax.","quiz":[{"q":"<code>fun &lt;T : Comparable&lt;T&gt;&gt; maxOf2(a: T, b: T): T<\/code>. Which call does NOT compile?","options":["<code>maxOf2(3, 7)<\/code>","<code>maxOf2(\"EUR\", \"USD\")<\/code>","<code>maxOf2(LocalDate.now(), LocalDate.MIN)<\/code>","<code>maxOf2(Payment(\"a\", 5), Payment(\"b\", 9))<\/code> where <code>Payment<\/code> is a plain data class"],"answer":3,"why":"<code>Int<\/code>, <code>String<\/code> and <code>LocalDate<\/code> are all comparable. A plain data class is not, so the compiler reports <code>actual type is 'Payment', but 'Comparable&lt;uninferred T ...&gt;' was expected<\/code>. Data classes get <code>equals<\/code> and <code>hashCode<\/code>, not an order.","from":null},{"q":"Which signature lets a function call both <code>x.length<\/code> and <code>x &lt; y<\/code> on two <code>T<\/code> values?","options":["<code>fun &lt;T : CharSequence, Comparable&lt;T&gt;&gt; f(x: T, y: T)<\/code>","<code>fun &lt;T&gt; f(x: T, y: T) where T : CharSequence, T : Comparable&lt;T&gt;<\/code>","<code>fun &lt;T : CharSequence &amp; Comparable&lt;T&gt;&gt; f(x: T, y: T)<\/code>","<code>fun &lt;T : Any&gt; f(x: T, y: T)<\/code>"],"answer":1,"why":"Kotlin allows one bound inside the angle brackets. A second bound for the same <code>T<\/code> goes into a <code>where<\/code> clause. The first option declares a second type parameter called <code>Comparable<\/code>, which is not what you meant, and <code>&amp;<\/code> is Java's spelling, not Kotlin's.","from":null},{"q":"A teammate writes <code>class Cache&lt;K, V&gt; { fun get(key: K): V? }<\/code>. Another teammate creates <code>Cache&lt;String, Instant?&gt;<\/code>. What problem appears?","options":["It does not compile: <code>V?<\/code> is not allowed when <code>V<\/code> is nullable","<code>get<\/code> returns <code>null<\/code> both for a missing key and for a stored null, so callers can't tell them apart","Every <code>get<\/code> throws a NullPointerException","None: <code>V?<\/code> and <code>Instant?<\/code> cancel out"],"answer":1,"why":"With the default bound <code>Any?<\/code>, <code>V<\/code> may itself be nullable, and <code>V?<\/code> adds nothing. Declaring <code>class Cache&lt;K : Any, V : Any&gt;<\/code> makes <code>Cache&lt;String, Instant?&gt;<\/code> a compile error, so <code>null<\/code> from <code>get<\/code> always means \"missing\".","from":null},{"q":"Java: which bound declaration compiles?","options":["<code>&lt;T extends Comparable&lt;T&gt; &amp; Number&gt;<\/code>","<code>&lt;T extends Number &amp; Comparable&lt;T&gt;&gt;<\/code>","<code>&lt;T extends Number, Comparable&lt;T&gt;&gt;<\/code> with the same meaning","<code>&lt;T : Number &amp; Comparable&lt;T&gt;&gt;<\/code>"],"answer":1,"why":"In Java the class bound must come first and the interfaces follow after <code>&amp;<\/code>. Putting <code>Number<\/code> second gives <code>interface expected here<\/code>. The comma form declares a second type parameter, and the colon is Kotlin syntax.","from":null},{"q":"From \"Generics from zero\": what does <code>val probe: Int = mapOf(\"EUR\" to 100, \"USD\" to 250L)<\/code> make the compiler print?","options":["expected 'Int', actual 'Map<String, Int>'","expected 'Int', actual 'Map<String, Long>'","expected 'Int', actual 'Map<String, Number>'","expected 'Int', actual 'Map<String, Any>'"],"answer":1,"why":"The assignment to a wrong type is the trick for printing an inferred type. Here the compiler makes the literal <code>100<\/code> a <code>Long<\/code> so that both values share one type. With two values that really differ, such as <code>1<\/code> and <code>2.5<\/code>, you would get an intersection type instead.","from":"gen-01"}],"cards":[{"front":"What is the default upper bound of a Kotlin type parameter?","back":"<p><code>Any?<\/code>. So an unbounded <code>T<\/code> accepts nullable types, and <code>fun &lt;T&gt; f(x: T)<\/code> can be called with <code>null<\/code>.<\/p>"},{"front":"<code>fun &lt;T&gt; lengthOf(x: T) = x.length<\/code> gives what error?","back":"<p><code>unresolved reference 'length'.<\/code> An unbounded <code>T<\/code> only has the members of <code>Any?<\/code>.<\/p>"},{"front":"How do you say \"T can be compared with another T\"?","back":"<p><code>&lt;T : Comparable&lt;T&gt;&gt;<\/code> in Kotlin, <code>&lt;T extends Comparable&lt;T&gt;&gt;<\/code> in Java.<\/p>"},{"front":"How do you give one type parameter two bounds in Kotlin?","back":"<p>A <code>where<\/code> clause: <code>fun &lt;T&gt; f(x: T) where T : CharSequence, T : Comparable&lt;T&gt;<\/code>.<\/p>"},{"front":"Why does <code>where T : Number, T : Exception<\/code> fail?","back":"<p><code>only one of the upper bounds can be a class.<\/code> A JVM type has one superclass; the other bounds must be interfaces.<\/p>"},{"front":"What does <code>class Cache&lt;K : Any, V : Any&gt;<\/code> buy you?","back":"<p>Neither type argument can be nullable, so <code>get(): V?<\/code> returning null always means \"no entry\".<\/p>"},{"front":"In Java's <code>&lt;T extends A &amp; B&gt;<\/code>, which must come first?","back":"<p>The class, if there is one. Interfaces follow after <code>&amp;<\/code>. Otherwise javac says <code>interface expected here<\/code>.<\/p>"}],"terms":[{"term":"Upper bound","plain":"A limit on a type parameter: \"T must be this type or a subtype of it\", written <code>T : Comparable&lt;T&gt;<\/code>."},{"term":"Default bound","plain":"<code>Any?<\/code>, the bound a Kotlin type parameter has when you write none."},{"term":"where clause","plain":"The place for extra bounds on a type parameter: <code>where T : CharSequence, T : Comparable&lt;T&gt;<\/code>."},{"term":"Recursive bound","plain":"A bound that mentions the parameter itself, like <code>T : Comparable&lt;T&gt;<\/code>: T can be compared with another T."},{"term":"T : Any","plain":"A bound that rules out nullable type arguments."},{"term":"Multiple bounds (Java)","plain":"Java's <code>&lt;T extends A &amp; B&gt;<\/code>; the class, if any, must come first."}],"remote":true},"gen-03":{"id":"gen-03","track":"gen","n":3,"title":"Subtyping, and why List<String> is not List<Object>","ready":true,"minutes":35,"goal":"By the end you can tell subclassing from subtyping, use the substitution test to explain why <code>MutableList&lt;String&gt;<\/code> is not a <code>MutableList&lt;Any&gt;<\/code>, and explain why Java arrays throw <code>ArrayStoreException<\/code> while Kotlin's <code>List&lt;String&gt;<\/code> safely is a <code>List&lt;Any&gt;<\/code>.","quiz":[{"q":"<code>fun audit(events: MutableList&lt;PaymentEvent&gt;)<\/code> only logs each event. A caller has a <code>MutableList&lt;CardAuthorized&gt;<\/code> (a subtype of <code>PaymentEvent<\/code>). What is the best fix for the compile error?","options":["Cast at the call: <code>audit(cards as MutableList&lt;PaymentEvent&gt;)<\/code>","Change the parameter to <code>events: List&lt;PaymentEvent&gt;<\/code>","Copy into an <code>ArrayList&lt;Any&gt;<\/code> first","Make <code>CardAuthorized<\/code> extend <code>MutableList<\/code>"],"answer":1,"why":"The function only reads, so a read-only <code>List&lt;PaymentEvent&gt;<\/code> describes it honestly, and <code>List<\/code> is covariant. The cast compiles with a warning but would let a future version of <code>audit<\/code> add the wrong event type into the caller's list.","from":null},{"q":"Java: <code>Number[] nums = new Integer[2]; nums[0] = 2.5;<\/code> What happens?","options":["Compile error: incompatible types","It compiles and stores 2.5","It compiles, then throws ArrayStoreException at <code>nums[0] = 2.5<\/code>","It compiles, then throws ClassCastException when you read <code>nums[0]<\/code>"],"answer":2,"why":"Arrays are covariant, so <code>Integer[]<\/code> is a <code>Number[]<\/code> and a <code>Double<\/code> is a <code>Number<\/code>: both lines compile. The array still knows its element type is <code>Integer<\/code>, and the JVM checks the store. The failure is immediate, at the store, not later at a read.","from":null},{"q":"Which statement about <code>String<\/code> and <code>String?<\/code> is true?","options":["They are two classes, and <code>String<\/code> is a subclass of <code>String?<\/code>","They are one class and two types, and <code>String<\/code> is a subtype of <code>String?<\/code>","They are one type; <code>?<\/code> only affects the compiler's warnings","<code>String?<\/code> is a subtype of <code>String<\/code>, because it can hold more values"],"answer":1,"why":"There is one class, <code>String<\/code>. Nullability belongs to the type. A <code>String<\/code> can always stand in for a <code>String?<\/code>, but not the other way round, because a <code>String?<\/code> might be null. That is why <code>String?::class<\/code> is an error: a class literal names a class, not a type.","from":null},{"q":"<code>val ml: MutableList&lt;List&lt;String&gt;&gt; = mutableListOf()<\/code>. Does <code>val x: MutableList&lt;List&lt;Any&gt;&gt; = ml<\/code> compile?","options":["Yes, because <code>List&lt;String&gt;<\/code> is a <code>List&lt;Any&gt;<\/code>","No, because the outer <code>MutableList<\/code> is invariant: its argument must match exactly","Yes, but only with <code>@Suppress<\/code>","No, because nested generics are not allowed in Kotlin"],"answer":1,"why":"The inner <code>List&lt;String&gt;<\/code> is a subtype of <code>List&lt;Any&gt;<\/code>, but <code>MutableList<\/code> needs equal arguments, not subtypes. Through <code>x<\/code> you could add a <code>List&lt;Int&gt;<\/code> to <code>ml<\/code>. A read-only <code>List&lt;List&lt;String&gt;&gt;<\/code> would be a <code>List&lt;List&lt;Any&gt;&gt;<\/code>, because covariance composes.","from":null},{"q":"From \"Bounds and constraints\": <code>class Cache&lt;K, V&gt; { fun get(key: K): V? }<\/code>. Which change guarantees that <code>get<\/code> returning <code>null<\/code> means \"no entry\"?","options":["Make the return type <code>V<\/code> instead of <code>V?<\/code>","Declare <code>class Cache&lt;K, V : Any&gt;<\/code>","Declare <code>class Cache&lt;K : Comparable&lt;K&gt;, V&gt;<\/code>","Use a <code>where V : Any?<\/code> clause"],"answer":1,"why":"With the default bound <code>Any?<\/code>, <code>V<\/code> can be <code>Instant?<\/code>, and then a stored null and a missing key look the same. <code>V : Any<\/code> makes nullable type arguments a compile error, so a null from <code>get<\/code> can only mean absent.","from":"gen-02"}],"cards":[{"front":"What is the difference between subclassing and subtyping?","back":"<p>Subclassing is about classes: one declaration inherits from another. Subtyping is about types: an <code>A<\/code> can be used wherever a <code>B<\/code> is expected.<\/p>"},{"front":"Is <code>String<\/code> a subtype of <code>String?<\/code>, or the reverse?","back":"<p><code>String<\/code> is a subtype of <code>String?<\/code>. A <code>String?<\/code> might be null, so it can't stand in for a <code>String<\/code>.<\/p>"},{"front":"Why can't a <code>MutableList&lt;String&gt;<\/code> be used as a <code>MutableList&lt;Any&gt;<\/code>?","back":"<p>Through the <code>MutableList&lt;Any&gt;<\/code> reference you could add an <code>Int<\/code>, and a reader of the original list would get a <code>ClassCastException<\/code>.<\/p>"},{"front":"What does <code>Object[] o = new String[1]; o[0] = 1;<\/code> do?","back":"<p>Compiles (arrays are covariant), then throws <code>ArrayStoreException: java.lang.Integer<\/code> at the store.<\/p>"},{"front":"Is a Kotlin <code>Array&lt;Int&gt;<\/code> an <code>Array&lt;Any&gt;<\/code>?","back":"<p>No. Kotlin arrays are invariant: <code>initializer type mismatch: expected 'Array&lt;Any&gt;', actual 'Array&lt;Int&gt;'.<\/code><\/p>"},{"front":"Why is a Kotlin <code>List&lt;String&gt;<\/code> a <code>List&lt;Any&gt;<\/code>?","back":"<p>Read-only <code>List<\/code> has no <code>add<\/code> or <code>set<\/code>, so reading strings as <code>Any<\/code> can never go wrong. It is declared <code>List&lt;out E&gt;<\/code>.<\/p>"},{"front":"<code>MutableList::class == List::class<\/code>?","back":"<p><code>true<\/code>. Both are the JVM interface <code>java.util.List<\/code>; the read-only/mutable split exists only at compile time.<\/p>"}],"terms":[{"term":"Class","plain":"A declaration that exists at run time, such as <code>String<\/code> or <code>ArrayList<\/code>."},{"term":"Type","plain":"What the compiler checks: a class plus its type arguments and nullability, such as <code>List&lt;String&gt;?<\/code>."},{"term":"Subtype","plain":"<code>A<\/code> is a subtype of <code>B<\/code> when an <code>A<\/code> can be used anywhere a <code>B<\/code> is expected."},{"term":"Substitution test","plain":"Ask: if I secretly hand over a <code>C&lt;A&gt;<\/code> where a <code>C&lt;B&gt;<\/code> is expected, can any allowed call go wrong?"},{"term":"Invariant","plain":"<code>C&lt;A&gt;<\/code> is a subtype of <code>C&lt;B&gt;<\/code> only when <code>A<\/code> and <code>B<\/code> are the same. <code>MutableList<\/code> and all Java generics."},{"term":"Covariant","plain":"<code>C&lt;A&gt;<\/code> is a subtype of <code>C&lt;B&gt;<\/code> whenever <code>A<\/code> is a subtype of <code>B<\/code>. Kotlin's <code>List<\/code>, Java arrays."},{"term":"ArrayStoreException","plain":"What the JVM throws when you store a value into an array whose real element type doesn't accept it."}],"remote":true},"gen-04":{"id":"gen-04","track":"gen","n":4,"title":"Covariance with out: producers","ready":true,"minutes":35,"goal":"By the end you can decide when a generic type is a producer, declare it <code>out<\/code> in Kotlin (or write <code>? extends<\/code> in Java), predict which members the compiler will reject, and fix them without breaking callers.","quiz":[{"q":"Which member compiles inside <code>class Feed&lt;out T&gt;<\/code>?","options":["<code>fun push(item: T)<\/code>","<code>var current: T? = null<\/code> with <code>private set<\/code>","<code>fun peek(): T?<\/code>","<code>protected fun replay(item: T)<\/code>"],"answer":2,"why":"A return type is an out-position, so <code>peek(): T?<\/code> is fine. <code>push<\/code> takes a <code>T<\/code> (in-position), and so does the protected <code>replay<\/code>: only private members are exempt. A <code>var<\/code> is an invariant position even when its setter is private.","from":null},{"q":"Kotlin: <code>interface Source&lt;out T&gt; { fun next(): T }<\/code>, <code>interface Payment<\/code>, and <code>fun total(s: Source&lt;Payment&gt;)<\/code>. What does Java see as the parameter type of <code>total<\/code>?","options":["<code>Source&lt;Payment&gt;<\/code>","<code>Source&lt;? extends Payment&gt;<\/code>","<code>Source&lt;? super Payment&gt;<\/code>","The raw type <code>Source<\/code>"],"answer":1,"why":"Kotlin turns a parameter of an <code>out<\/code>-declared type into <code>? extends<\/code>, so Java callers can pass a <code>Source&lt;CardPayment&gt;<\/code> as well. It would skip the wildcard if <code>Payment<\/code> were a final class, and it never adds one to a return type.","from":null},{"q":"<code>class Shelf&lt;out T&gt;(private val items: MutableList&lt;T&gt;) { fun clear() = items.clear() }<\/code>. Does it compile, and what does it say about <code>out<\/code>?","options":["No: an <code>out<\/code> class can't hold a <code>MutableList&lt;T&gt;<\/code>","No: <code>clear()<\/code> changes state, and <code>out<\/code> means immutable","Yes: private members are exempt, and <code>out<\/code> restricts types, not state changes","Yes, but only with <code>@UnsafeVariance<\/code> on <code>items<\/code>"],"answer":2,"why":"The <code>MutableList&lt;T&gt;<\/code> is private, so the variance check skips it, and <code>clear()<\/code> does not mention <code>T<\/code> at all. <code>out<\/code> guarantees that no wrongly-typed value gets in through the public API. It says nothing about whether the object can change.","from":null},{"q":"Java: <code>static long sum(List&lt;? extends Number&gt; xs)<\/code> and <code>List&lt;Integer&gt; ints<\/code>. Which line compiles inside <code>sum<\/code>?","options":["<code>xs.add(5);<\/code>","<code>Number first = xs.get(0);<\/code>","<code>xs.add(null);<\/code> is the only thing that fails","<code>Integer first = xs.get(0);<\/code>"],"answer":1,"why":"Through <code>? extends Number<\/code> you can read elements as <code>Number<\/code>. You can't add an <code>Integer<\/code>, because the list might really be a <code>List&lt;Double&gt;<\/code> (javac: <code>cannot be converted to CAP#1<\/code>). Reading as <code>Integer<\/code> fails for the same reason. <code>add(null)<\/code> actually compiles, since null fits any type.","from":null},{"q":"From \"Subtyping, and why List<String> is not List<Object>\": why does <code>val x: MutableList&lt;Any&gt; = mutableListOf&lt;String&gt;()<\/code> fail while <code>val y: List&lt;Any&gt; = mutableListOf&lt;String&gt;()<\/code> compiles?","options":["<code>MutableList<\/code> is a different class from <code>List<\/code> at run time","Through <code>x<\/code> you could add an <code>Int<\/code> to a list of strings; <code>List<\/code> has no add, so <code>y<\/code> can only read","Kotlin forbids <code>Any<\/code> as a type argument of mutable types","<code>mutableListOf<\/code> returns a Java type that Kotlin can't widen"],"answer":1,"why":"That is the substitution test. A mutable view of the wider type could write a wrong value into the narrower list. A read-only view can't, which is exactly what <code>List&lt;out E&gt;<\/code> declares. At run time both are the same <code>java.util.List<\/code>.","from":"gen-03"}],"cards":[{"front":"What makes a generic type safe to declare <code>out T<\/code>?","back":"<p>It only hands values of <code>T<\/code> out (return types, <code>val<\/code>s). It never takes a <code>T<\/code> in through a public member.<\/p>"},{"front":"With <code>Source&lt;out T&gt;<\/code>, is <code>Source&lt;CardPayment&gt;<\/code> a subtype of <code>Source&lt;Payment&gt;<\/code>?","back":"<p>Yes. Covariance keeps the direction of the subtype arrow.<\/p>"},{"front":"Kotlin's <code>out T<\/code> on a declaration corresponds to what in Java?","back":"<p><code>? extends T<\/code>, written at each use site, e.g. <code>List&lt;? extends Payment&gt;<\/code>.<\/p>"},{"front":"Why does <code>var x: T<\/code> fail in a class declared <code>out T<\/code>?","back":"<p>A <code>var<\/code> has a setter, so <code>T<\/code> is in an invariant position. Even <code>private set<\/code> doesn't help; split it into a private <code>var<\/code> and a public <code>val<\/code>.<\/p>"},{"front":"Are constructor parameters allowed in a class declared <code>out T<\/code>?","back":"<p>Plain parameters and <code>val<\/code> properties: yes. A <code>var<\/code> constructor property: no (invariant position).<\/p>"},{"front":"Does <code>out<\/code> make a type immutable?","back":"<p>No. It only blocks <code>T<\/code> from flowing in. <code>MutableList&lt;out T&gt;<\/code> still has <code>clear()<\/code> and <code>removeAt()<\/code>.<\/p>"},{"front":"How do you keep a method like <code>getOrElse(default: T)<\/code> on a covariant type?","back":"<p>Make it an extension function with its own type parameter: <code>fun &lt;T&gt; Feed&lt;T&gt;.nextOr(fallback: T): T<\/code>.<\/p>"}],"terms":[{"term":"Producer","plain":"A type whose <code>T<\/code> values only come out: iterators, sources, pages, read-only lists."},{"term":"Covariant","plain":"<code>C&lt;Sub&gt;<\/code> is a subtype of <code>C&lt;Super&gt;<\/code>: the arrow keeps its direction."},{"term":"out","plain":"Kotlin's keyword on a type parameter: \"T only comes out of this type\"."},{"term":"Out-position","plain":"A place where a value of <code>T<\/code> flows out: return types and <code>val<\/code> types."},{"term":"In-position","plain":"A place where a value of <code>T<\/code> flows in: parameter types."},{"term":"Declaration-site variance","plain":"Variance written once on the class (<code>in
