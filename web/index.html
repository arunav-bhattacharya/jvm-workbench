ock","It halves, because virtual threads switch faster","It doubles, because of the scheduling overhead"],"answer":0,"why":"Virtual threads give scale, not speed. The request still waits for the issuer. What changes is how many requests can wait at once without running out of threads, so at high traffic the queueing delay disappears.","from":null},{"q":"Which workload gains the most from virtual threads?","options":["A batch job that computes HMACs over 50 million ledger rows on 8 cores","A low-traffic admin API that serves 5 requests per second","A report that is slow because one SQL query takes 30 s","A payments API that waits on HTTP and database calls for 190 ms of every 200 ms request"],"answer":3,"why":"Virtual threads help when many tasks are in flight and most of their time is spent blocked. The HMAC batch job is CPU-bound, so 8 cores is the limit either way. The admin API never runs out of threads. The slow query is one request that is still slow on any thread.","from":null},{"q":"From the executors track: <code>Executors.newFixedThreadPool(200)<\/code> receives 1,500 tasks per second that each block for 200 ms. What happens to the tasks it can't start right away?","options":["They are rejected with RejectedExecutionException","The pool adds threads up to its maximum","They wait in an unbounded queue, so the queue and the latency keep growing","They run on the submitting thread"],"answer":2,"why":"<code>newFixedThreadPool<\/code> uses an unbounded <code>LinkedBlockingQueue<\/code>, and core and maximum size are both 200. Nothing is rejected and no thread is added. Tasks queue without limit, which is exactly the growing latency Little's law predicts.","from":"exec-02"}],"cards":[{"front":"State Little's law.","back":"<p>L = λ × W: the number of requests in flight equals the arrival rate times the time each request spends in the system.<\/p>"},{"front":"1,500 requests per second, 200 ms each. How many threads does thread-per-request need?","back":"<p>300 (1,500 × 0.2).<\/p>"},{"front":"200 threads, each request holds one for 200 ms. What is the maximum throughput?","back":"<p>1,000 requests per second (200 / 0.2 s). Above that the queue grows, even with idle CPU.<\/p>"},{"front":"What is a platform thread?","back":"<p>A <code>java.lang.Thread<\/code> backed one to one by an OS thread, with its own stack (1 MB reserved by default on 64-bit Linux).<\/p>"},{"front":"Do virtual threads make a single request faster?","back":"<p>No. They give scale (more requests in flight at once), not speed. Each request waits just as long.<\/p>"},{"front":"In which JDK did virtual threads become final, and under which JEP?","back":"<p>JDK 21, JEP 444.<\/p>"},{"front":"What happens when a handler on an event-loop thread makes a blocking JDBC call?","back":"<p>It blocks the event-loop thread, so every other request on that loop stalls until the call returns.<\/p>"}],"terms":[{"term":"Platform thread","plain":"A Java thread that is one OS thread. Expensive, so you get thousands."},{"term":"Virtual thread","plain":"A Java thread scheduled by the JDK on a few OS threads. Cheap, so you can have millions."},{"term":"Thread-per-request","plain":"A server style where each request gets one thread for its whole life."},{"term":"Little's law","plain":"In flight = arrival rate × time inside. L = λ × W."},{"term":"Throughput","plain":"How many requests finish per second."},{"term":"Latency","plain":"How long one request takes from start to end."},{"term":"Event loop","plain":"A thread that runs many requests' callbacks in turn and must never block."}],"remote":true},"vt-02":{"id":"vt-02","track":"vt","n":2,"title":"How virtual threads work: carriers and continuations","ready":true,"minutes":35,"goal":"By the end you can explain what happens to a virtual thread when it blocks: how it unmounts from its carrier, where its stack goes, and how the scheduler brings it back.","quiz":[{"q":"Inside a virtual thread that is mounted on <code>ForkJoinPool-1-worker-3<\/code>, what does <code>Thread.currentThread()<\/code> return?","options":["The carrier thread <code>ForkJoinPool-1-worker-3<\/code>","The virtual thread","<code>null<\/code>, because virtual threads aren't registered with the JVM","The scheduler's <code>ForkJoinPool<\/code>"],"answer":1,"why":"The JDK hides the carrier on purpose. Code in a virtual thread always sees the virtual thread as the current thread, so <code>ThreadLocal<\/code>s and <code>interrupt()<\/code> behave per virtual thread. The carrier only shows up in <code>toString()<\/code>, as debugging help.","from":null},{"q":"On an 8-core machine with default settings, you start 100,000 virtual threads that each sleep for 10 seconds. About how many carrier threads exist while they sleep?","options":["100,000, one per virtual thread","256, the scheduler's maximum","About 8","One, because the scheduler is single-threaded"],"answer":2,"why":"The scheduler's parallelism defaults to the number of cores. Sleeping virtual threads are unmounted and don't need a carrier at all. The pool only grows toward 256 for a while when something captures a carrier, such as file I/O.","from":null},{"q":"A service has 4 carriers. Four virtual threads each run a 2-second loop that hashes data without ever blocking. A fifth virtual thread should log a heartbeat every 100 ms. What happens to the heartbeat?","options":["It logs on time, because the JVM time-slices virtual threads","It stalls for about 2 seconds, until a hashing thread finishes and frees a carrier","The JVM moves the heartbeat to a new platform thread automatically","The hashing threads are suspended every 10 ms so others can run"],"answer":1,"why":"Virtual threads have no time slicing. A virtual thread gives up its carrier only when it blocks or ends. Four CPU-bound virtual threads hold all four carriers, so the heartbeat waits in the queue. Keep long CPU work off the virtual thread scheduler.","from":null},{"q":"A virtual thread is parked inside <code>queue.take()<\/code>, 120 frames deep in your framework. Where are those 120 frames right now?","options":["On the carrier thread's stack, which stays reserved for it","In a 1 MB native stack reserved when the virtual thread started","On the Java heap, in stack chunk objects","Nowhere: the JDK will rerun the method from the start when it wakes"],"answer":2,"why":"When a virtual thread unmounts, the JDK copies its frames into stack chunk objects on the heap and frees the carrier. Nothing is reserved up front; the chunks are as big as the real stack. On remount, the top frames are copied back first and the rest on demand.","from":null},{"q":"From the lesson \"A thread's life: start, join, sleep, interrupt\": you call <code>t.interrupt()<\/code> on a virtual thread that is inside <code>Thread.sleep(10_000)<\/code>. What happens?","options":["<code>sleep<\/code> throws <code>InterruptedException<\/code> right away, and the interrupt flag is cleared","Nothing until the 10 seconds are up, because the virtual thread is unmounted","The virtual thread is killed","The carrier thread gets the interrupt instead"],"answer":0,"why":"Interruption works on virtual threads exactly as on platform threads. The JDK unparks the sleeping virtual thread, <code>sleep<\/code> throws <code>InterruptedException<\/code> and clears the flag. Being unmounted doesn't matter: the interrupt is delivered to the virtual thread, not the carrier.","from":"conc-02"}],"cards":[{"front":"What is a carrier thread?","back":"<p>A platform thread (a worker of the virtual thread scheduler's <code>ForkJoinPool<\/code>) that runs a virtual thread while it is mounted.<\/p>"},{"front":"What happens when a virtual thread unmounts?","back":"<p>At a blocking call its continuation yields: the frames are copied to the heap and the carrier goes back to run other virtual threads.<\/p>"},{"front":"How many carrier threads does the default scheduler use?","back":"<p>One per core (<code>availableProcessors()<\/code>), set by <code>jdk.virtualThreadScheduler.parallelism<\/code>. It can add carriers temporarily, up to 256 by default.<\/p>"},{"front":"Does the JVM time-slice virtual threads?","back":"<p>No. A virtual thread keeps its carrier until it blocks or ends.<\/p>"},{"front":"Where are a parked virtual thread's stack frames?","back":"<p>On the Java heap, in stack chunk objects sized to the real stack depth.<\/p>"},{"front":"Is the virtual thread scheduler <code>ForkJoinPool.commonPool()<\/code>?","back":"<p>No. It is a separate <code>ForkJoinPool<\/code> in FIFO mode. Parallel streams and default <code>CompletableFuture<\/code> async methods use the common pool.<\/p>"},{"front":"Name two operations that unmount a virtual thread and one that captures the carrier instead.","back":"<p>Unmount: <code>Thread.sleep<\/code>, socket reads, <code>ReentrantLock.lock<\/code>, <code>BlockingQueue.take<\/code>. Capture: most file I/O.<\/p>"}],"terms":[{"term":"Continuation","plain":"Code that can pause at a point and resume later with its stack intact."},{"term":"Carrier thread","plain":"A platform thread that runs virtual threads, one at a time."},{"term":"Mount / unmount","plain":"Start running a virtual thread on a carrier / take it off the carrier at a blocking call."},{"term":"Scheduler","plain":"The ForkJoinPool that decides which ready virtual thread a free carrier runs next."},{"term":"Stack chunk","plain":"A heap object holding the saved frames of an unmounted virtual thread."},{"term":"Stackful vs stackless","plain":"Saving the real call stack (virtual threads) vs saving only compiler-chosen locals (Kotlin coroutines)."},{"term":"Time slicing","plain":"Forcing a running thread off the CPU after a time slot. The OS does it to platform threads; nobody does it to virtual threads."}],"remote":true},"vt-03":{"id":"vt-03","track":"vt","n":3,"title":"Using virtual threads: one per task, limits with semaphores","ready":true,"minutes":35,"goal":"By the end you can start virtual threads the right way, fan out thousands of blocking calls with one virtual thread per task, and cap what a downstream system sees with a shared Semaphore instead of a pool.","quiz":[{"q":"10,000 concurrent requests each call a fraud API that allows 50 concurrent calls. Which design is right?","options":["<code>newFixedThreadPool(50)<\/code> of platform threads for all request handling","<code>newFixedThreadPool(50, Thread.ofVirtual().factory())<\/code>","A virtual thread per request, and one shared <code>Semaphore(50)<\/code> around the fraud call","A virtual thread per request, and a <code>new Semaphore(50)<\/code> created inside each request handler"],"answer":2,"why":"The limit belongs to the fraud API, so put one semaphore on the client and share it. Both pools limit all request handling, not just the fraud call. A semaphore created per request gives every request its own 50 permits, which limits nothing at all.","from":null},{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kd\">var<\/span><span class=\"w\"> <\/span><span class=\"n\">perTask<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Executors<\/span><span class=\"p\">.<\/span><span class=\"na\">newVirtualThreadPerTaskExecutor<\/span><span class=\"p\">())<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">3<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"o\">++<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">perTask<\/span><span class=\"p\">.<\/span><span class=\"na\">submit<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"n\">Thread<\/span><span class=\"p\">.<\/span><span class=\"na\">currentThread<\/span><span class=\"p\">().<\/span><span class=\"na\">getName<\/span><span class=\"p\">().<\/span><span class=\"na\">isEmpty<\/span><span class=\"p\">()));<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"done\"<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre>","options":["<code>true<\/code> three times, then <code>done<\/code>","<code>done<\/code> first, then <code>true<\/code> three times","<code>false<\/code> three times, then <code>done<\/code>, because each thread is named <code>pool-1-thread-N<\/code>","Nothing: the tasks are cancelled when the block ends"],"answer":0,"why":"Virtual threads have no name by default, so <code>getName()<\/code> is empty. <code>close()<\/code> at the end of the try block waits for all three tasks before <code>done<\/code> runs. The <code>pool-1-thread-N<\/code> names belong to the platform threads of <code>newFixedThreadPool<\/code>.","from":null},{"q":"A <code>Semaphore(20)<\/code> guards a 50 ms call. 1,000 virtual threads reach <code>acquire()<\/code> at the same moment. About how long until the last one gets a permit?","options":["About 50 ms","About 2.5 s","About 50 s","Never: 980 threads fail with an exception"],"answer":1,"why":"Twenty permits on a 50 ms call serve 400 calls per second, so 1,000 calls need about 2.5 s, and the last thread waits for nearly all of it. Nothing fails: <code>acquire()<\/code> waits as long as it takes. Use <code>tryAcquire<\/code> with a timeout if that wait is too long.","from":null},{"q":"You submit 1 million tasks to <code>Executors.newVirtualThreadPerTaskExecutor()<\/code>. How many threads can it create?","options":["As many as there are cores","256, the scheduler's maximum","A pool the JVM sizes from the workload","Up to 1 million: one new virtual thread per task, with no limit"],"answer":3,"why":"The Javadoc says the number of threads it creates is unbounded. The core count and the 256 cap describe carrier threads, which run the virtual threads. They don't limit how many virtual threads exist.","from":null},{"q":"From the lesson \"Synchronizers: latch, barrier, semaphore, phaser\": a developer writes <code>try { sem.acquire(); call(); } finally { sem.release(); }<\/code>. A thread is interrupted while it waits inside <code>acquire()<\/code>. What happens to the semaphore?","options":["Nothing: <code>release()<\/code> ignores threads that hold no permit","<code>acquire()<\/code> retries automatically after the interrupt","It gains a permit it never handed out, so the limit quietly grows by one","<code>release()<\/code> throws <code>IllegalMonitorStateException<\/code>"],"answer":2,"why":"A <code>Semaphore<\/code> doesn't track who holds permits. <code>release()<\/code> always adds one, even from a thread that never acquired. Every interrupted waiter raises the limit by one. Put <code>acquire()<\/code> before the <code>try<\/code> so <code>finally<\/code> only runs after a permit was really taken.","from":"conc-10"}],"cards":[{"front":"Which executor gives every task its own new virtual thread?","back":"<p><code>Executors.newVirtualThreadPerTaskExecutor()<\/code>. It has no pool, no queue and no limit.<\/p>"},{"front":"What does <code>close()<\/code> on an <code>ExecutorService<\/code> do (JDK 19+)?","back":"<p>It calls <code>shutdown()<\/code> and then waits until every submitted task has finished.<\/p>"},{"front":"Should you pool virtual threads?","back":"<p>No. Create one per task, and limit the scarce resource with a shared <code>Semaphore<\/code>.<\/p>"},{"front":"Where does the <code>Semaphore<\/code> for a downstream API belong?","back":"<p>One per resource, shared by all callers, for example a field on the API client. One per request limits nothing.<\/p>"},{"front":"<code>Semaphore(20)<\/code> guards a call that takes 100 ms. Maximum calls per second?","back":"<p>200 (20 / 0.1 s).<\/p>"},{"front":"Why put <code>acquire()<\/code> before the <code>try<\/code> and <code>release()<\/code> in <code>finally<\/code>?","back":"<p>So a thread that fails to acquire never releases a permit it didn't get, and a thread whose call throws always gives its permit back.<\/p>"},{"front":"How do you make a semaphore wait fail fast?","back":"<p><code>tryAcquire(timeout, unit)<\/code> returns <code>false<\/code> if no permit arrives in time, so you can reject the request.<\/p>"}],"terms":[{"term":"Thread.Builder","plain":"The JDK 21 API for creating threads: <code>Thread.ofVirtual()<\/code> and <code>Thread.ofPlatform()<\/code>."},{"term":"Thread-per-task executor","plain":"An executor that starts a new thread for every task and never reuses one."},{"term":"Fan-out","plain":"Starting many calls at once and then collecting all their results."},{"term":"Semaphore","plain":"A counter of permits. <code>acquire<\/code> takes one or waits, <code>release<\/code> gives one back."},{"term":"Bulkhead","plain":"A limit on how many calls may be inside one downstream at once, so one slow dependency can't use up everything."},{"term":"Load shedding","plain":"Rejecting work quickly when you're over capacity, instead of letting it queue."}],"remote":true},"vt-04":{"id":"vt-04","track":"vt","n":4,"title":"Pinning, ThreadLocals and other traps","ready":true,"minutes":35,"goal":"By the end you can say what pins a virtual thread on JDK 21 and on JDK 25, find pinning with JFR, and fix the two classic migration traps: a monitor held around I/O and a ThreadLocal used as a cache.","quiz":[{"q":"A service on JDK 25 has <code>synchronized<\/code> blocks around JDBC calls in an old DAO. You are moving request handling to virtual threads. What should you do about those blocks?","options":["Replace every one with <code>ReentrantLock<\/code> before the switch, or the service will pin","Nothing for pinning: on JDK 24+ they don't pin. Keep a JFR recording to catch the pins that remain","Run with <code>-Djdk.tracePinnedThreads=full<\/code> and fix what it prints","Wrap each JDBC call in <code>Thread.ofPlatform().start(...)<\/code>"],"answer":1,"why":"JEP 491 (JDK 24) lets virtual threads hold monitors without pinning, so on JDK 25 these blocks are fine. Rewriting them is the JDK 21 advice. <code>-Djdk.tracePinnedThreads<\/code> no longer exists on JDK 24+, so it would print nothing and prove nothing.","from":null},{"q":"Which tool shows you, on JDK 25, that a virtual thread pinned its carrier for 180 ms and why?","options":["<code>jstack &lt;pid&gt;<\/code>","<code>Thread.getAllStackTraces()<\/code> from a debug endpoint","The JFR event <code>jdk.VirtualThreadPinned<\/code>, printed with <code>jfr print<\/code>","<code>-Djdk.tracePinnedThreads=short<\/code>"],"answer":2,"why":"<code>jdk.VirtualThreadPinned<\/code> is recorded for pins over 20 ms by default and carries the stack, and on JDK 25 also the pinned reason and carrier. <code>jstack<\/code> and <code>getAllStackTraces()<\/code> show platform threads, not parked virtual threads, and the trace property was removed in JDK 24.","from":null},{"q":"A payment service hashes request bodies with a <code>ThreadLocal&lt;MessageDigest&gt;<\/code> cache. It moves from a 200-thread pool to one virtual thread per request and serves 1 million requests. About how many <code>MessageDigest<\/code> objects does it create?","options":["200, the same as before","One per carrier thread, so about the number of cores","About 1 million, one per request","One, because ThreadLocal values are shared between virtual threads"],"answer":2,"why":"Each virtual thread has its own thread-local map, and each request runs on a new virtual thread, so <code>withInitial<\/code> runs once per request. Carriers don't matter: the JDK keeps a virtual thread's thread locals separate from its carrier's. Share a thread-safe object, or create one per call on purpose.","from":null},{"q":"An 8-core batch job resizes 10,000 images, each taking about 50 ms of pure CPU. It runs on <code>newFixedThreadPool(8)<\/code>. What happens if you switch it to <code>newVirtualThreadPerTaskExecutor()<\/code>?","options":["It finishes in about the same time, about 62 s, because only 8 can compute at once either way","It finishes in about 50 ms, because all 10,000 run at once","It finishes about 8 times faster","It deadlocks, because virtual threads can't run CPU work"],"answer":0,"why":"There are 8 carriers, so at most 8 virtual threads compute at once: 10,000 × 50 ms / 8 = 62.5 s, the same as the pool. Virtual threads only help when tasks spend their time waiting. With no time slicing, they can also delay other virtual threads in the same JVM.","from":null},{"q":"From the lesson \"Don't share: immutability, confinement, ThreadLocal\": <code>SimpleDateFormat<\/code> is not thread-safe. Which fix works equally well on a platform pool and on one virtual thread per task, with no per-thread state at all?","options":["Wrap every <code>format<\/code> call in <code>synchronized<\/code>","One shared, immutable <code>DateTimeFormatter<\/code>","A <code>ThreadLocal&lt;SimpleDateFormat&gt;<\/code>","A <code>volatile SimpleDateFormat<\/code> field"],"answer":1,"why":"An immutable object is safe to share with any number of threads, so it needs no per-thread copies and no locking. The <code>ThreadLocal<\/code> works on a pool but becomes one formatter per task on virtual threads. <code>synchronized<\/code> is correct but makes every caller wait in line. <code>volatile<\/code> makes the reference visible but leaves the formatter's internal state racy.","from":"conc-11"}],"cards":[{"front":"What does it mean that a virtual thread is pinned?","back":"<p>It reaches a blocking call but can't unmount, so it stays on its carrier and the carrier blocks with it.<\/p>"},{"front":"Does blocking inside <code>synchronized<\/code> pin a virtual thread on JDK 25?","back":"<p>No. Since JDK 24 (JEP 491) monitors don't pin. On JDK 21 to 23 they do.<\/p>"},{"front":"What still pins a virtual thread on JDK 25?","back":"<p>Blocking while a class initializer or a native frame (JNI, or an FFM downcall that calls back into Java) is on its stack.<\/p>"},{"front":"How do you detect pinning on JDK 24 and later?","back":"<p>The JFR event <code>jdk.VirtualThreadPinned<\/code> (on by default, 20 ms threshold). <code>-Djdk.tracePinnedThreads<\/code> was removed in JDK 24.<\/p>"},{"front":"Why does a <code>ThreadLocal<\/code> cache stop working with one virtual thread per task?","back":"<p>Each task runs on a new virtual thread with an empty thread-local map, so the cached object is built once per task and thrown away.<\/p>"},{"front":"Do virtual threads speed up CPU-bound work?","back":"<p>No. At most one virtual thread per carrier (per core) computes at once, and there is no time slicing.<\/p>"},{"front":"Kotlin replacement for <code>@Synchronized<\/code> around I/O on JDK 21?","back":"<p><code>private val lock = ReentrantLock()<\/code> and <code>lock.withLock { ... }<\/code> from <code>kotlin.concurrent<\/code>.<\/p>"}],"terms":[{"term":"Pinning","plain":"A virtual thread stuck on its carrier during a blocking call, so the carrier blocks too."},{"term":"Monitor","plain":"The lock behind <code>synchronized<\/code> and <code>@Synchronized<\/code>, built into every Java object."},{"term":"JEP 491","plain":"The JDK 24 change that lets virtual threads hold monitors without pinning."},{"term":"JFR","plain":"Java Flight Recorder: the JVM's built-in, low-overhead event recorder."},{"term":"jdk.VirtualThreadPinned","plain":"The JFR event recorded when a virtual thread blocks while pinned for longer than the threshold."},{"term":"Carrier capture","plain":"A blocking call, such as a file read, that keeps the carrier; the scheduler adds a temporary carrier."},{"term":"ThreadLocal cache","plain":"Keeping one copy of an object per thread to reuse it. Useless when every task gets a new thread."}],"remote":true},"vt-05":{"id":"vt-05","track":"vt","n":5,"title":"Structured concurrency and scoped values","ready":false},"vt-06":{"id":"vt-06","track":"vt","n":6,"title":"Moving a blocking service to virtual threads","ready":false},"gen-01":{"id":"gen-01","track":"gen","n":1,"title":"Generics from zero: type parameters","ready":true,"minutes":35,"goal":"By the end you can write generic classes and functions in Kotlin and Java, read <code>&lt;T&gt;<\/code> as a blank the caller fills in, and explain why a type parameter moves a ClassCastException from the read to a compile error at the write.","quiz":[{"q":"Payment metadata is a <code>MutableMap&lt;String, Any&gt;<\/code>. A retry handler stores <code>meta[\"retries\"] = \"3\"<\/code>. A report later runs <code>val n = meta[\"retries\"] as Int<\/code>. What happens?","options":["A compile error on the line that stores \"3\"","A ClassCastException on the line that stores \"3\"","A ClassCastException on the <code>as Int<\/code> line, when the report runs","<code>n<\/code> is 3, because Kotlin converts the string"],"answer":2,"why":"A <code>String<\/code> is an <code>Any<\/code>, so the store compiles and runs. The cast in the report is the first check, and it fails there. Casts never convert values. A typed field such as <code>retries: Int<\/code> would have made the store a compile error.","from":null},{"q":"Given <code>fun &lt;T&gt; firstOrNull(items: List&lt;T&gt;): T?<\/code>, what does the compiler say about <code>val id: String? = firstOrNull(listOf(1, 2))<\/code>?","options":["Initializer type mismatch: expected 'String?', actual 'Int?'","It compiles, and <code>id<\/code> is null","It compiles, and <code>id<\/code> is \"1\"","It compiles, then throws ClassCastException"],"answer":0,"why":"<code>T<\/code> is inferred from the argument as <code>Int<\/code>, so the call returns <code>Int?<\/code>. That does not fit in a <code>String?<\/code>. The type parameter ties the input and the output together, which is the whole point. Nothing is converted at run time.","from":null},{"q":"<code>val none = emptyList()<\/code> does not compile. Which line fixes it?","options":["<code>val none = emptyList&lt;String&gt;()<\/code>","<code>val none: List&lt;String&gt; = emptyList()<\/code>","Either of the two above","Neither: <code>emptyList<\/code> needs an argument"],"answer":2,"why":"The compiler needs to know <code>T<\/code>. You can give the type argument at the call, or give the variable a type and let inference work backwards from it. Both produce a <code>List&lt;String&gt;<\/code>.","from":null},{"q":"Java: <code>List raw = new ArrayList(); raw.add(7); List&lt;String&gt; names = raw; String s = names.get(0);<\/code> What happens?","options":["A compile error on <code>raw.add(7)<\/code>","It compiles with unchecked warnings, then throws ClassCastException on the <code>names.get(0)<\/code> line","It compiles, and <code>s<\/code> is \"7\"","ArrayStoreException on <code>raw.add(7)<\/code>"],"answer":1,"why":"Raw types turn the checks off, so javac only warns. The <code>Integer<\/code> sits in the list until the read, where javac inserted a cast to <code>String<\/code>. The failure appears far from the line that caused it, the same as with <code>Any<\/code>.","from":null},{"q":"From the race conditions lesson: a Kafka consumer does <code>if (!seen.contains(key)) { charge(m); seen.add(key) }<\/code>, where <code>seen<\/code> is <code>ConcurrentHashMap.newKeySet&lt;String&gt;()<\/code>. Two copies of one message arrive on two threads. What is the smallest fix?","options":["Make the field <code>seen<\/code> volatile","Replace <code>seen<\/code> with a <code>Collections.synchronizedSet<\/code>","Call <code>charge<\/code> only after <code>seen.add(key)<\/code> returned true: <code>if (seen.add(key)) charge(m)<\/code>","Make <code>seen<\/code> a <code>MutableSet&lt;Any&gt;<\/code> so both copies fit"],"answer":2,"why":"This is check-then-act. Each set call is atomic, but two calls in a row are not. <code>add<\/code> checks and inserts in one step and returns false for the second copy, so only one thread charges. <code>volatile<\/code> and a synchronized wrapper leave the gap between the two calls.","from":"conc-03"}],"cards":[{"front":"In <code>class Box&lt;T&gt;<\/code>, what is <code>T<\/code>?","back":"<p>A type parameter: a blank that each user of <code>Box<\/code> fills with a real type, such as <code>Box&lt;String&gt;<\/code>.<\/p>"},{"front":"Where does a bad value stored in an <code>Any<\/code> field get caught?","back":"<p>At the cast in the code that reads it, at run time. The stack trace points at the reader, not at the writer with the bug.<\/p>"},{"front":"<code>val e = emptyList()<\/code> gives what error?","back":"<p><code>cannot infer type for type parameter 'T'. Specify it explicitly.<\/code> Fix: <code>emptyList&lt;String&gt;()<\/code> or <code>val e: List&lt;String&gt; = emptyList()<\/code>.<\/p>"},{"front":"Where does <code>&lt;T&gt;<\/code> go in a Kotlin generic function, and in a Java one?","back":"<p>Kotlin: before the name, <code>fun &lt;T&gt; first(xs: List&lt;T&gt;): T<\/code>. Java: before the return type, <code>static &lt;T&gt; T first(List&lt;T&gt; xs)<\/code>.<\/p>"},{"front":"What does Java's diamond in <code>new ArrayList&lt;&gt;()<\/code> do?","back":"<p>It tells javac to infer the type argument from the target type. Without it, <code>new ArrayList()<\/code> is a raw type.<\/p>"},{"front":"What does <code>listOf(1, 2.5)<\/code> infer to?","back":"<p><code>List&lt;Number &amp; Comparable&lt;*&gt;&gt;<\/code>, an intersection type: the closest type that both <code>Int<\/code> and <code>Double<\/code> share.<\/p>"},{"front":"How do you see the type Kotlin inferred for <code>x<\/code>?","back":"<p>Write <code>val probe: Int = x<\/code>. The compile error prints the actual type.<\/p>"}],"terms":[{"term":"Type parameter","plain":"The placeholder in a declaration, like <code>T<\/code> in <code>class Box&lt;T&gt;<\/code>."},{"term":"Type argument","plain":"The real type that fills a type parameter, like <code>String<\/code> in <code>Box&lt;String&gt;<\/code>."},{"term":"Generic function","plain":"A function with its own type parameters, such as <code>fun &lt;T&gt; firstOrNull(items: List&lt;T&gt;): T?<\/code>."},{"term":"Type inference","plain":"The compiler working out type arguments from the values and the expected type."},{"term":"Intersection type","plain":"A type that is two types at once, like <code>Number &amp; Comparable&lt;*&gt;<\/code>. Inferred by the compiler; you cannot write it yourself."},{"term":"Diamond","plain":"Java's <code>&lt;&gt;<\/code> on <code>new<\/code>, asking javac to infer the type arguments."},{"term":"Raw type","plain":"A Java generic type used without type arguments, like plain <code>List<\/code>. The compiler stops checking it."}],"remote":true},"gen-02":{"id":"gen-02","track":"gen","n":2,"title":"Bounds and constraints: upper bounds, where, T : Any","ready":true,"minutes":35,"goal":"By the end you can add an upper bound, a <code>where<\/code> clause or <code>T : Any<\/code> to a type parameter, say what each one lets your code do and which callers it shuts out, and read the matching Java <code>extends<\/code> and <code>&amp;<\/code> syntax.","quiz":[{"q":"<code>fun &lt;T : Comparable&lt;T&gt;&gt; maxOf2(a: T, b: T): T<\/code>. Which call does NOT compile?","options":["<code>maxOf2(3, 7)<\/code>","<code>maxOf2(\"EUR\", \"USD\")<\/code>","<code>maxOf2(LocalDate.now(), LocalDate.MIN)<\/code>","<code>maxOf2(Payment(\"a\", 5), Payment(\"b\", 9))<\/code> where <code>Payment<\/code> is a plain data class"],"answer":3,"why":"<code>Int<\/code>, <code>String<\/code> and <code>LocalDate<\/code> are all comparable. A plain data class is not, so the compiler reports <code>actual type is 'Payment', but 'Comparable&lt;uninferred T ...&gt;' was expected<\/code>. Data classes get <code>equals<\/code> and <code>hashCode<\/code>, not an order.","from":null},{"q":"Which signature lets a function call both <code>x.length<\/code> and <code>x &lt; y<\/code> on two <code>T<\/code> values?","options":["<code>fun &lt;T : CharSequence, Comparable&lt;T&gt;&gt; f(x: T, y: T)<\/code>","<code>fun &lt;T&gt; f(x: T, y: T) where T : CharSequence, T : Comparable&lt;T&gt;<\/code>","<code>fun &lt;T : CharSequence &amp; Comparable&lt;T&gt;&gt; f(x: T, y: T)<\/code>","<code>fun &lt;T : Any&gt; f(x: T, y: T)<\/code>"],"answer":1,"why":"Kotlin allows one bound inside the angle brackets. A second bound for the same <code>T<\/code> goes into a <code>where<\/code> clause. The first option declares a second type parameter called <code>Comparable<\/code>, which is not what you meant, and <code>&amp;<\/code> is Java's spelling, not Kotlin's.","from":null},{"q":"A teammate writes <code>class Cache&lt;K, V&gt; { fun get(key: K): V? }<\/code>. Another teammate creates <code>Cache&lt;String, Instant?&gt;<\/code>. What problem appears?","options":["It does not compile: <code>V?<\/code> is not allowed when <code>V<\/code> is nullable","<code>get<\/code> returns <code>null<\/code> both for a missing key and for a stored null, so callers can't tell them apart","Every <code>get<\/code> throws a NullPointerException","None: <code>V?<\/code> and <code>Instant?<\/code> cancel out"],"answer":1,"why":"With the default bound <code>Any?<\/code>, <code>V<\/code> may itself be nullable, and <code>V?<\/code> adds nothing. Declaring <code>class Cache&lt;K : Any, V : Any&gt;<\/code> makes <code>Cache&lt;String, Instant?&gt;<\/code> a compile error, so <code>null<\/code> from <code>get<\/code> always means \"missing\".","from":null},{"q":"Java: which bound declaration compiles?","options":["<code>&lt;T extends Comparable&lt;T&gt; &amp; Number&gt;<\/code>","<code>&lt;T extends Number &amp; Comparable&lt;T&gt;&gt;<\/code>","<code>&lt;T extends Number, Comparable&lt;T&gt;&gt;<\/code> with the same meaning","<code>&lt;T : Number &amp; Comparable&lt;T&gt;&gt;<\/code>"],"answer":1,"why":"In Java the class bound must come first and the interfaces follow after <code>&amp;<\/code>. Putting <code>Number<\/code> second gives <code>interface expected here<\/code>. The comma form declares a second type parameter, and the colon is Kotlin syntax.","from":null},{"q":"From \"Generics from zero\": what does <code>val probe: Int = mapOf(\"EUR\" to 100, \"USD\" to 250L)<\/code> make the compiler print?","options":["expected 'Int', actual 'Map<String, Int>'","expected 'Int', actual 'Map<String, Long>'","expected 'Int', actual 'Map<String, Number>'","expected 'Int', actual 'Map<String, Any>'"],"answer":1,"why":"The assignment to a wrong type is the trick for printing an inferred type. Here the compiler makes the literal <code>100<\/code> a <code>Long<\/code> so that both values share one type. With two values that really differ, such as <code>1<\/code> and <code>2.5<\/code>, you would get an intersection type instead.","from":"gen-01"}],"cards":[{"front":"What is the default upper bound of a Kotlin type parameter?","back":"<p><code>Any?<\/code>. So an unbounded <code>T<\/code> accepts nullable types, and <code>fun &lt;T&gt; f(x: T)<\/code> can be called with <code>null<\/code>.<\/p>"},{"front":"<code>fun &lt;T&gt; lengthOf(x: T) = x.length<\/code> gives what error?","back":"<p><code>unresolved reference 'length'.<\/code> An unbounded <code>T<\/code> only has the members of <code>Any?<\/code>.<\/p>"},{"front":"How do you say \"T can be compared with another T\"?","back":"<p><code>&lt;T : Comparable&lt;T&gt;&gt;<\/code> in Kotlin, <code>&lt;T extends Comparable&lt;T&gt;&gt;<\/code> in Java.<\/p>"},{"front":"How do you give one type parameter two bounds in Kotlin?","back":"<p>A <code>where<\/code> clause: <code>fun &lt;T&gt; f(x: T) where T : CharSequence, T : Comparable&lt;T&gt;<\/code>.<\/p>"},{"front":"Why does <code>where T : Number, T : Exception<\/code> fail?","back":"<p><code>only one of the upper bounds can be a class.<\/code> A JVM type has one superclass; the other bounds must be interfaces.<\/p>"},{"front":"What does <code>class Cache&lt;K : Any, V : Any&gt;<\/code> buy you?","back":"<p>Neither type argument can be nullable, so <code>get(): V?<\/code> returning null always means \"no entry\".<\/p>"},{"front":"In Java's <code>&lt;T extends A &amp; B&gt;<\/code>, which must come first?","back":"<p>The class, if there is one. Interfaces follow after <code>&amp;<\/code>. Otherwise javac says <code>interface expected here<\/code>.<\/p>"}],"terms":[{"term":"Upper bound","plain":"A limit on a type parameter: \"T must be this type or a subtype of it\", written <code>T : Comparable&lt;T&gt;<\/code>."},{"term":"Default bound","plain":"<code>Any?<\/code>, the bound a Kotlin type parameter has when you write none."},{"term":"where clause","plain":"The place for extra bounds on a type parameter: <code>where T : CharSequence, T : Comparable&lt;T&gt;<\/code>."},{"term":"Recursive bound","plain":"A bound that mentions the parameter itself, like <code>T : Comparable&lt;T&gt;<\/code>: T can be compared with another T."},{"term":"T : Any","plain":"A bound that rules out nullable type arguments."},{"term":"Multiple bounds (Java)","plain":"Java's <code>&lt;T extends A &amp; B&gt;<\/code>; the class, if any, must come first."}],"remote":true},"gen-03":{"id":"gen-03","track":"gen","n":3,"title":"Subtyping, and why List<String> is not List<Object>","ready":true,"minutes":35,"goal":"By the end you can tell subclassing from subtyping, use the substitution test to explain why <code>MutableList&lt;String&gt;<\/code> is not a <code>MutableList&lt;Any&gt;<\/code>, and explain why Java arrays throw <code>ArrayStoreException<\/code> while Kotlin's <code>List&lt;String&gt;<\/code> safely is a <code>List&lt;Any&gt;<\/code>.","quiz":[{"q":"<code>fun audit(events: MutableList&lt;PaymentEvent&gt;)<\/code> only logs each event. A caller has a <code>MutableList&lt;CardAuthorized&gt;<\/code> (a subtype of <code>PaymentEvent<\/code>). What is the best fix for the compile error?","options":["Cast at the call: <code>audit(cards as MutableList&lt;PaymentEvent&gt;)<\/code>","Change the parameter to <code>events: List&lt;PaymentEvent&gt;<\/code>","Copy into an <code>ArrayList&lt;Any&gt;<\/code> first","Make <code>CardAuthorized<\/code> extend <code>MutableList<\/code>"],"answer":1,"why":"The function only reads, so a read-only <code>List&lt;PaymentEvent&gt;<\/code> describes it honestly, and <code>List<\/code> is covariant. The cast compiles with a warning but would let a future version of <code>audit<\/code> add the wrong event type into the caller's list.","from":null},{"q":"Java: <code>Number[] nums = new Integer[2]; nums[0] = 2.5;<\/code> What happens?","options":["Compile error: incompatible types","It compiles and stores 2.5","It compiles, then throws ArrayStoreException at <code>nums[0] = 2.5<\/code>","It compiles, then throws ClassCastException when you read <code>nums[0]<\/code>"],"answer":2,"why":"Arrays are covariant, so <code>Integer[]<\/code> is a <code>Number[]<\/code> and a <code>Double<\/code> is a <code>Number<\/code>: both lines compile. The array still knows its element type is <code>Integer<\/code>, and the JVM checks the store. The failure is immediate, at the store, not later at a read.","from":null},{"q":"Which statement about <code>String<\/code> and <code>String?<\/code> is true?","options":["They are two classes, and <code>String<\/code> is a subclass of <code>String?<\/code>","They are one class and two types, and <code>String<\/code> is a subtype of <code>String?<\/code>","They are one type; <code>?<\/code> only affects the compiler's warnings","<code>String?<\/code> is a subtype of <code>String<\/code>, because it can hold more values"],"answer":1,"why":"There is one class, <code>String<\/code>. Nullability belongs to the type. A <code>String<\/code> can always stand in for a <code>String?<\/code>, but not the other way round, because a <code>String?<\/code> might be null. That is why <code>String?::class<\/code> is an error: a class literal names a class, not a type.","from":null},{"q":"<code>val ml: MutableList&lt;List&lt;String&gt;&gt; = mutableListOf()<\/code>. Does <code>val x: MutableList&lt;List&lt;Any&gt;&gt; = ml<\/code> compile?","options":["Yes, because <code>List&lt;String&gt;<\/code> is a <code>List&lt;Any&gt;<\/code>","No, because the outer <code>MutableList<\/code> is invariant: its argument must match exactly","Yes, but only with <code>@Suppress<\/code>","No, because nested generics are not allowed in Kotlin"],"answer":1,"why":"The inner <code>List&lt;String&gt;<\/code> is a subtype of <code>List&lt;Any&gt;<\/code>, but <code>MutableList<\/code> needs equal arguments, not subtypes. Through <code>x<\/code> you could add a <code>List&lt;Int&gt;<\/code> to <code>ml<\/code>. A read-only <code>List&lt;List&lt;String&gt;&gt;<\/code> would be a <code>List&lt;List&lt;Any&gt;&gt;<\/code>, because covariance composes.","from":null},{"q":"From \"Bounds and constraints\": <code>class Cache&lt;K, V&gt; { fun get(key: K): V? }<\/code>. Which change guarantees that <code>get<\/code> returning <code>null<\/code> means \"no entry\"?","options":["Make the return type <code>V<\/code> instead of <code>V?<\/code>","Declare <code>class Cache&lt;K, V : Any&gt;<\/code>","Declare <code>class Cache&lt;K : Comparable&lt;K&gt;, V&gt;<\/code>","Use a <code>where V : Any?<\/code> clause"],"answer":1,"why":"With the default bound <code>Any?<\/code>, <code>V<\/code> can be <code>Instant?<\/code>, and then a stored null and a missing key look the same. <code>V : Any<\/code> makes nullable type arguments a compile error, so a null from <code>get<\/code> can only mean absent.","from":"gen-02"}],"cards":[{"front":"What is the difference between subclassing and subtyping?","back":"<p>Subclassing is about classes: one declaration inherits from another. Subtyping is about types: an <code>A<\/code> can be used wherever a <code>B<\/code> is expected.<\/p>"},{"front":"Is <code>String<\/code> a subtype of <code>String?<\/code>, or the reverse?","back":"<p><code>String<\/code> is a subtype of <code>String?<\/code>. A <code>String?<\/code> might be null, so it can't stand in for a <code>String<\/code>.<\/p>"},{"front":"Why can't a <code>MutableList&lt;String&gt;<\/code> be used as a <code>MutableList&lt;Any&gt;<\/code>?","back":"<p>Through the <code>MutableList&lt;Any&gt;<\/code> reference you could add an <code>Int<\/code>, and a reader of the original list would get a <code>ClassCastException<\/code>.<\/p>"},{"front":"What does <code>Object[] o = new String[1]; o[0] = 1;<\/code> do?","back":"<p>Compiles (arrays are covariant), then throws <code>ArrayStoreException: java.lang.Integer<\/code> at the store.<\/p>"},{"front":"Is a Kotlin <code>Array&lt;Int&gt;<\/code> an <code>Array&lt;Any&gt;<\/code>?","back":"<p>No. Kotlin arrays are invariant: <code>initializer type mismatch: expected 'Array&lt;Any&gt;', actual 'Array&lt;Int&gt;'.<\/code><\/p>"},{"front":"Why is a Kotlin <code>List&lt;String&gt;<\/code> a <code>List&lt;Any&gt;<\/code>?","back":"<p>Read-only <code>List<\/code> has no <code>add<\/code> or <code>set<\/code>, so reading strings as <code>Any<\/code> can never go wrong. It is declared <code>List&lt;out E&gt;<\/code>.<\/p>"},{"front":"<code>MutableList::class == List::class<\/code>?","back":"<p><code>true<\/code>. Both are the JVM interface <code>java.util.List<\/code>; the read-only/mutable split exists only at compile time.<\/p>"}],"terms":[{"term":"Class","plain":"A declaration that exists at run time, such as <code>String<\/code> or <code>ArrayList<\/code>."},{"term":"Type","plain":"What the compiler checks: a class plus its type arguments and nullability, such as <code>List&lt;String&gt;?<\/code>."},{"term":"Subtype","plain":"<code>A<\/code> is a subtype of <code>B<\/code> when an <code>A<\/code> can be used anywhere a <code>B<\/code> is expected."},{"term":"Substitution test","plain":"Ask: if I secretly hand over a <code>C&lt;A&gt;<\/code> where a <code>C&lt;B&gt;<\/code> is expected, can any allowed call go wrong?"},{"term":"Invariant","plain":"<code>C&lt;A&gt;<\/code> is a subtype of <code>C&lt;B&gt;<\/code> only when <code>A<\/code> and <code>B<\/code> are the same. <code>MutableList<\/code> and all Java generics."},{"term":"Covariant","plain":"<code>C&lt;A&gt;<\/code> is a subtype of <code>C&lt;B&gt;<\/code> whenever <code>A<\/code> is a subtype of <code>B<\/code>. Kotlin's <code>List<\/code>, Java arrays."},{"term":"ArrayStoreException","plain":"What the JVM throws when you store a value into an array whose real element type doesn't accept it."}],"remote":true},"gen-04":{"id":"gen-04","track":"gen","n":4,"title":"Covariance with out: producers","ready":true,"minutes":35,"goal":"By the end you can decide when a generic type is a producer, declare it <code>out<\/code> in Kotlin (or write <code>? extends<\/code> in Java), predict which members the compiler will reject, and fix them without breaking callers.","quiz":[{"q":"Which member compiles inside <code>class Feed&lt;out T&gt;<\/code>?","options":["<code>fun push(item: T)<\/code>","<code>var current: T? = null<\/code> with <code>private set<\/code>","<code>fun peek(): T?<\/code>","<code>protected fun replay(item: T)<\/code>"],"answer":2,"why":"A return type is an out-position, so <code>peek(): T?<\/code> is fine. <code>push<\/code> takes a <code>T<\/code> (in-position), and so does the protected <code>replay<\/code>: only private members are exempt. A <code>var<\/code> is an invariant position even when its setter is private.","from":null},{"q":"Kotlin: <code>interface Source&lt;out T&gt; { fun next(): T }<\/code>, <code>interface Payment<\/code>, and <code>fun total(s: Source&lt;Payment&gt;)<\/code>. What does Java see as the parameter type of <code>total<\/code>?","options":["<code>Source&lt;Payment&gt;<\/code>","<code>Source&lt;? extends Payment&gt;<\/code>","<code>Source&lt;? super Payment&gt;<\/code>","The raw type <code>Source<\/code>"],"answer":1,"why":"Kotlin turns a parameter of an <code>out<\/code>-declared type into <code>? extends<\/code>, so Java callers can pass a <code>Source&lt;CardPayment&gt;<\/code> as well. It would skip the wildcard if <code>Payment<\/code> were a final class, and it never adds one to a return type.","from":null},{"q":"<code>class Shelf&lt;out T&gt;(private val items: MutableList&lt;T&gt;) { fun clear() = items.clear() }<\/code>. Does it compile, and what does it say about <code>out<\/code>?","options":["No: an <code>out<\/code> class can't hold a <code>MutableList&lt;T&gt;<\/code>","No: <code>clear()<\/code> changes state, and <code>out<\/code> means immutable","Yes: private members are exempt, and <code>out<\/code> restricts types, not state changes","Yes, but only with <code>@UnsafeVariance<\/code> on <code>items<\/code>"],"answer":2,"why":"The <code>MutableList&lt;T&gt;<\/code> is private, so the variance check skips it, and <code>clear()<\/code> does not mention <code>T<\/code> at all. <code>out<\/code> guarantees that no wrongly-typed value gets in through the public API. It says nothing about whether the object can change.","from":null},{"q":"Java: <code>static long sum(List&lt;? extends Number&gt; xs)<\/code> and <code>List&lt;Integer&gt; ints<\/code>. Which line compiles inside <code>sum<\/code>?","options":["<code>xs.add(5);<\/code>","<code>Number first = xs.get(0);<\/code>","<code>xs.add(null);<\/code> is the only thing that fails","<code>Integer first = xs.get(0);<\/code>"],"answer":1,"why":"Through <code>? extends Number<\/code> you can read elements as <code>Number<\/code>. You can't add an <code>Integer<\/code>, because the list might really be a <code>List&lt;Double&gt;<\/code> (javac: <code>cannot be converted to CAP#1<\/code>). Reading as <code>Integer<\/code> fails for the same reason. <code>add(null)<\/code> actually compiles, since null fits any type.","from":null},{"q":"From \"Subtyping, and why List<String> is not List<Object>\": why does <code>val x: MutableList&lt;Any&gt; = mutableListOf&lt;String&gt;()<\/code> fail while <code>val y: List&lt;Any&gt; = mutableListOf&lt;String&gt;()<\/code> compiles?","options":["<code>MutableList<\/code> is a different class from <code>List<\/code> at run time","Through <code>x<\/code> you could add an <code>Int<\/code> to a list of strings; <code>List<\/code> has no add, so <code>y<\/code> can only read","Kotlin forbids <code>Any<\/code> as a type argument of mutable types","<code>mutableListOf<\/code> returns a Java type that Kotlin can't widen"],"answer":1,"why":"That is the substitution test. A mutable view of the wider type could write a wrong value into the narrower list. A read-only view can't, which is exactly what <code>List&lt;out E&gt;<\/code> declares. At run time both are the same <code>java.util.List<\/code>.","from":"gen-03"}],"cards":[{"front":"What makes a generic type safe to declare <code>out T<\/code>?","back":"<p>It only hands values of <code>T<\/code> out (return types, <code>val<\/code>s). It never takes a <code>T<\/code> in through a public member.<\/p>"},{"front":"With <code>Source&lt;out T&gt;<\/code>, is <code>Source&lt;CardPayment&gt;<\/code> a subtype of <code>Source&lt;Payment&gt;<\/code>?","back":"<p>Yes. Covariance keeps the direction of the subtype arrow.<\/p>"},{"front":"Kotlin's <code>out T<\/code> on a declaration corresponds to what in Java?","back":"<p><code>? extends T<\/code>, written at each use site, e.g. <code>List&lt;? extends Payment&gt;<\/code>.<\/p>"},{"front":"Why does <code>var x: T<\/code> fail in a class declared <code>out T<\/code>?","back":"<p>A <code>var<\/code> has a setter, so <code>T<\/code> is in an invariant position. Even <code>private set<\/code> doesn't help; split it into a private <code>var<\/code> and a public <code>val<\/code>.<\/p>"},{"front":"Are constructor parameters allowed in a class declared <code>out T<\/code>?","back":"<p>Plain parameters and <code>val<\/code> properties: yes. A <code>var<\/code> constructor property: no (invariant position).<\/p>"},{"front":"Does <code>out<\/code> make a type immutable?","back":"<p>No. It only blocks <code>T<\/code> from flowing in. <code>MutableList&lt;out T&gt;<\/code> still has <code>clear()<\/code> and <code>removeAt()<\/code>.<\/p>"},{"front":"How do you keep a method like <code>getOrElse(default: T)<\/code> on a covariant type?","back":"<p>Make it an extension function with its own type parameter: <code>fun &lt;T&gt; Feed&lt;T&gt;.nextOr(fallback: T): T<\/code>.<\/p>"}],"terms":[{"term":"Producer","plain":"A type whose <code>T<\/code> values only come out: iterators, sources, pages, read-only lists."},{"term":"Covariant","plain":"<code>C&lt;Sub&gt;<\/code> is a subtype of <code>C&lt;Super&gt;<\/code>: the arrow keeps its direction."},{"term":"out","plain":"Kotlin's keyword on a type parameter: \"T only comes out of this type\"."},{"term":"Out-position","plain":"A place where a value of <code>T<\/code> flows out: return types and <code>val<\/code> types."},{"term":"In-position","plain":"A place where a value of <code>T<\/code> flows in: parameter types."},{"term":"Declaration-site variance","plain":"Variance written once on the class (<code>interface Source&lt;out T&gt;<\/code>), as Kotlin does."},{"term":"Use-site variance","plain":"Variance written where the type is used (<code>Source&lt;? extends Payment&gt;<\/code>), as Java does."}],"remote":true},"gen-05":{"id":"gen-05","track":"gen","n":5,"title":"Contravariance with in: consumers","ready":true,"minutes":35,"goal":"By the end you can recognise a consumer, declare it <code>in<\/code> in Kotlin (or write <code>? super<\/code> in Java), explain why a <code>Sink&lt;PaymentEvent&gt;<\/code> can stand in for a <code>Sink&lt;CardAuthorized&gt;<\/code>, and choose <code>out<\/code> or <code>in<\/code> for any parameter with the PECS question.","quiz":[{"q":"<code>interface Sink&lt;in T&gt; { fun accept(item: T) }<\/code>. Which assignment compiles?","options":["<code>val a: Sink&lt;PaymentEvent&gt; = cardSink<\/code> where <code>cardSink: Sink&lt;CardAuthorized&gt;<\/code>","<code>val b: Sink&lt;CardAuthorized&gt; = auditSink<\/code> where <code>auditSink: Sink&lt;PaymentEvent&gt;<\/code>","Both","Neither, unless <code>Sink<\/code> is declared <code>out<\/code>"],"answer":1,"why":"With <code>in<\/code>, the arrow flips: a sink of the supertype is a sink of the subtype. The reverse is unsafe: a card-only sink seen as a <code>Sink&lt;PaymentEvent&gt;<\/code> could be handed a refund.","from":null},{"q":"Which member can you add to <code>interface Sink&lt;in T&gt;<\/code>?","options":["<code>fun last(): T<\/code>","<code>val pending: List&lt;T&gt;<\/code>","<code>fun acceptAll(items: List&lt;T&gt;)<\/code>","<code>fun forEachPending(f: (T) -&gt; Unit)<\/code>"],"answer":2,"why":"<code>acceptAll<\/code> takes the items in: <code>List&lt;out E&gt;<\/code> inside a parameter is − × + = −, an in-position. <code>last()<\/code> and <code>pending<\/code> hand <code>T<\/code> out. In <code>forEachPending<\/code>, the <code>T<\/code> is the parameter of a parameter (− × − = +), so it is an out-position too.","from":null},{"q":"Kotlin: <code>val byId: Comparator&lt;PaymentEvent&gt; = compareBy { it.paymentId }<\/code>. Why does <code>val c: Comparator&lt;CardAuthorized&gt; = byId<\/code> fail?","options":["Comparators are covariant, so the arrow goes the other way","<code>Comparator<\/code> is <code>java.util.Comparator<\/code>, a Java interface with no declared variance, so Kotlin treats it as invariant","<code>compareBy<\/code> returns a raw type","It doesn't fail; it compiles"],"answer":1,"why":"Kotlin can't add variance to a Java interface, so <code>Comparator&lt;A&gt;<\/code> and <code>Comparator&lt;B&gt;<\/code> are unrelated unless you project: <code>Comparator&lt;in CardAuthorized&gt;<\/code>. The standard library does that in <code>sortedWith(comparator: Comparator&lt;in T&gt;)<\/code>. Kotlin's own <code>Comparable<\/code> is declared <code>in T<\/code> and behaves differently.","from":null},{"q":"Java: you write <code>static void register(Consumer&lt;CardAuthorized&gt; handler)<\/code>. A teammate has a <code>Consumer&lt;PaymentEvent&gt;<\/code>. What is the right fix?","options":["Change the parameter to <code>Consumer&lt;? super CardAuthorized&gt;<\/code>","Change the parameter to <code>Consumer&lt;? extends CardAuthorized&gt;<\/code>","Ask the teammate to cast their handler","Change the parameter to raw <code>Consumer<\/code>"],"answer":0,"why":"The handler consumes the events you pass it, so Consumer Super. <code>? extends<\/code> would let you pass a consumer of some unknown subtype, which you could never call safely. A raw type turns off checking altogether.","from":null},{"q":"From \"Covariance with out: producers\": why is <code>fun &lt;R&gt; map(f: (T) -&gt; R): Page&lt;R&gt;<\/code> allowed inside <code>data class Page&lt;out T&gt;<\/code>?","options":["Because <code>map<\/code> has its own type parameter, which exempts the whole method","Because <code>T<\/code> is the parameter of <code>f<\/code>, which is itself a parameter: two in-positions make an out-position","Because data classes skip the variance check","It isn't allowed; it needs <code>@UnsafeVariance<\/code>"],"answer":1,"why":"The page calls <code>f<\/code> and passes it a <code>T<\/code>, so values of <code>T<\/code> flow out of the page. By the sign rule, − × − = +. A new type parameter <code>R<\/code> doesn't exempt anything: <code>fun &lt;R&gt; bad(t: T): R<\/code> would still fail.","from":"gen-04"}],"cards":[{"front":"What makes a generic type safe to declare <code>in T<\/code>?","back":"<p>It only takes values of <code>T<\/code> in (parameters). No public member returns a <code>T<\/code>.<\/p>"},{"front":"With <code>Sink&lt;in T&gt;<\/code>, which way does the arrow go between <code>Sink&lt;PaymentEvent&gt;<\/code> and <code>Sink&lt;CardAuthorized&gt;<\/code>?","back":"<p><code>Sink&lt;PaymentEvent&gt;<\/code> is a subtype of <code>Sink&lt;CardAuthorized&gt;<\/code>: the arrow flips.<\/p>"},{"front":"Kotlin's <code>in T<\/code> corresponds to what in Java?","back":"<p><code>? super T<\/code>, written at the use site, e.g. <code>Consumer&lt;? super CardAuthorized&gt;<\/code>.<\/p>"},{"front":"Is <code>(PaymentEvent) -&gt; Unit<\/code> a subtype of <code>(CardAuthorized) -&gt; Unit<\/code>?","back":"<p>Yes. Function types are <code>Function1&lt;in P, out R&gt;<\/code>, so a handler of the general type fits where a specific one is expected.<\/p>"},{"front":"Why must Kotlin code write <code>Comparator&lt;in T&gt;<\/code> instead of plain <code>Comparator&lt;T&gt;<\/code>?","back":"<p>On the JVM, <code>Comparator<\/code> is the Java interface <code>java.util.Comparator<\/code>, which has no declared variance, so Kotlin treats it as invariant.<\/p>"},{"front":"What does PECS stand for?","back":"<p>Producer Extends, Consumer Super (Effective Java, Item 31). In Kotlin: producer <code>out<\/code>, consumer <code>in<\/code>.<\/p>"},{"front":"Sign rule: where does <code>T<\/code> sit in <code>fun each(f: (T) -&gt; Unit)<\/code>?","back":"<p>Parameter of a parameter: − × − = +, an out-position. Legal under <code>out T<\/code>, illegal under <code>in T<\/code>.<\/p>"}],"terms":[{"term":"Consumer","plain":"A type whose <code>T<\/code> values only go in: sinks, comparators, handlers."},{"term":"Contravariant","plain":"<code>C&lt;Super&gt;<\/code> is a subtype of <code>C&lt;Sub&gt;<\/code>: the arrow flips."},{"term":"in","plain":"Kotlin's keyword on a type parameter: \"T only goes into this type\"."},{"term":"? super T","plain":"Java's use-site wildcard for a consumer: \"T or any supertype of T\"."},{"term":"PECS","plain":"Producer Extends, Consumer Super: the Java rule for choosing wildcards."},{"term":"Function1<in P, out R>","plain":"The type behind <code>(P) -&gt; R<\/code>: contravariant in the parameter, covariant in the result."},{"term":"Sign rule","plain":"Out-positions are +, in-positions are −; multiply through nesting to find where <code>T<\/code> really sits."}],"remote":true},"gen-06":{"id":"gen-06","track":"gen","n":6,"title":"Use-site variance and type projections","ready":true,"minutes":35,"goal":"By the end you can add <code>out<\/code> or <code>in<\/code> to a single use of an invariant type such as <code>MutableList<\/code> or <code>Array<\/code>, say exactly which calls each projection allows, map it to Java's <code>? extends<\/code> and <code>? super<\/code>, and decide between declaration-site and use-site variance.","quiz":[{"q":"Inside <code>fun audit(events: MutableList&lt;out PaymentEvent&gt;)<\/code>, which line compiles?","options":["<code>events.add(CardAuthorized(\"pay_9\", 100))<\/code>","<code>val e: PaymentEvent = events[0]<\/code>","<code>events[0] = RefundIssued(\"pay_9\", 100)<\/code>","<code>val c: CardAuthorized = events[0]<\/code>"],"answer":1,"why":"Reads through an out-projection come out as the bound, <code>PaymentEvent<\/code>. Both writes are forbidden, because the real list might be a <code>MutableList&lt;RefundIssued&gt;<\/code> or a <code>MutableList&lt;CardAuthorized&gt;<\/code>, and the compiler doesn't know which. Reading into <code>CardAuthorized<\/code> fails for the same reason: the element is only known to be some <code>PaymentEvent<\/code>.","from":null},{"q":"<code>fun pad(target: MutableList&lt;in Int&gt;)<\/code>. What is the type of <code>target[0]<\/code> inside <code>pad<\/code>?","options":["<code>Int<\/code>","<code>Number<\/code>","<code>Any?<\/code>","It doesn't compile: you can't read through an in-projection"],"answer":2,"why":"The list could be a <code>MutableList&lt;Int&gt;<\/code>, <code>MutableList&lt;Number&gt;<\/code> or <code>MutableList&lt;Any?&gt;<\/code>, so the only safe promise is <code>Any?<\/code>. Reading is allowed, it just tells you little. <code>Int<\/code> is the tempting answer, but the list might hold the <code>\"EUR\"<\/code> someone put there before.","from":null},{"q":"You own <code>interface Cache&lt;K, V&gt; { fun get(key: K): V?; fun put(key: K, value: V) }<\/code>. A report wants to accept a <code>Cache&lt;String, CardFee&gt;<\/code> where it expects fees of any kind (<code>Fee<\/code>), and it only calls <code>get<\/code>. Which change is right?","options":["Declare <code>interface Cache&lt;K, out V&gt;<\/code>","Give the report's parameter the type <code>Cache&lt;String, out Fee&gt;<\/code>","Give the report's parameter the type <code>Cache&lt;String, in Fee&gt;<\/code>","Make the report take a raw <code>Cache<\/code>"],"answer":1,"why":"<code>Cache<\/code> both returns and takes <code>V<\/code>, so it must stay invariant: <code>out V<\/code> on the interface fails with <code>type parameter 'V' is declared as 'out' but occurs in 'in' position<\/code>, because of <code>put<\/code>. The report only reads, so it projects at the use site: <code>Cache&lt;String, out Fee&gt;<\/code> accepts a <code>Cache&lt;String, CardFee&gt;<\/code>, and <code>put<\/code> is unavailable through that view. <code>in Fee<\/code> would make <code>get<\/code> return <code>Any?<\/code>. Kotlin has no raw types.","from":null},{"q":"Java's <code>Collections.copy<\/code> is <code>&lt;T&gt; void copy(List&lt;? super T&gt; dest, List&lt;? extends T&gt; src)<\/code>. How does Kotlin show the <code>dest<\/code> parameter in an error message?","options":["<code>MutableList&lt;in T!&gt;!<\/code>","<code>List&lt;out T&gt;<\/code>","<code>MutableList&lt;T&gt;<\/code>","<code>List&lt;*&gt;<\/code>"],"answer":0,"why":"Java wildcards become projections: <code>? super T<\/code> becomes <code>in T<\/code>, and <code>? extends T<\/code> becomes <code>out T<\/code>. The <code>!<\/code> marks platform types, because Kotlin can't know Java's nullability. <code>List&lt;*&gt;<\/code> is how Kotlin shows a Java raw <code>List<\/code>, which is a different thing.","from":null},{"q":"From \"Contravariance with in: consumers\": the lab's <code>highest(items: List&lt;T&gt;, comparator: Comparator&lt;in T&gt;)<\/code> needs a projection on the comparator but not on the list. Why?","options":["Because <code>in<\/code> projections are always required on the last parameter","Because <code>Comparator<\/code> is a Kotlin interface declared <code>out T<\/code>","Because the list is only read, and read-only parameters never need variance","Because Kotlin's <code>List<\/code> is declared <code>out E<\/code>, while <code>java.util.Comparator<\/code> is a Java interface that Kotlin must treat as invariant"],"answer":3,"why":"Declaration-site variance does the work for <code>List<\/code>. <code>Comparator<\/code> has no declared variance on the JVM, so its flexibility has to be written at the use site, exactly like a projection on <code>MutableList<\/code>. Option three is half right: reading is why <code>out<\/code> fits, but a <code>MutableList<\/code> parameter that is only read still needs <code>out<\/code>.","from":"gen-05"}],"cards":[{"front":"What is a type projection?","back":"<p>Variance written where a type is used, such as <code>MutableList&lt;out Number&gt;<\/code> in a parameter. It narrows that one use to reading or to writing; the class itself stays invariant.<\/p>"},{"front":"Through <code>MutableList&lt;out Number&gt;<\/code>, what do <code>get<\/code> and <code>add<\/code> do?","back":"<p><code>get<\/code> returns <code>Number<\/code>. <code>add<\/code> is forbidden: the real list might be a <code>MutableList&lt;Int&gt;<\/code>.<\/p>"},{"front":"Through <code>MutableList&lt;in Int&gt;<\/code>, what type does <code>get<\/code> return?","back":"<p><code>Any?<\/code>. The list may be a <code>MutableList&lt;Number&gt;<\/code> or <code>MutableList&lt;Any?&gt;<\/code>, so nothing more specific is safe.<\/p>"},{"front":"Does <code>clear()<\/code> compile on a <code>MutableList&lt;out Payment&gt;<\/code>?","back":"<p>Yes. <code>clear()<\/code> takes no element, so a projection doesn't block it. Projections limit types, not mutation.<\/p>"},{"front":"How does Kotlin show Java's <code>List&lt;? extends Integer&gt;<\/code> and <code>List&lt;? super Integer&gt;<\/code>?","back":"<p>As <code>(Mutable)List&lt;out Int!&gt;!<\/code> and <code>MutableList&lt;in Int!&gt;!<\/code>: <code>? extends<\/code> becomes <code>out<\/code>, <code>? super<\/code> becomes <code>in<\/code>.<\/p>"},{"front":"Declaration-site or use-site variance: how do you choose?","back":"<p>If every member only produces <code>T<\/code> (or only consumes it), declare <code>out<\/code> (or <code>in<\/code>) on the class. If the class both reads and writes <code>T<\/code>, keep it invariant and project in each function that uses one side.<\/p>"},{"front":"What does <code>fun f(l: List&lt;in String&gt;)<\/code> give?","back":"<p>An error: the projection conflicts with <code>List<\/code>'s declared <code>out E<\/code>. (<code>List&lt;out String&gt;<\/code> gives only a warning: the projection is redundant.)<\/p>"}],"terms":[{"term":"Type projection","plain":"<code>out<\/code> or <code>in<\/code> written on one use of a type, giving a read-only or write-only view of it."},{"term":"Use-site variance","plain":"Variance written where a type is used (a parameter, a variable). Java's wildcards and Kotlin's projections."},{"term":"Declaration-site variance","plain":"Variance written once on the class (<code>interface List&lt;out E&gt;<\/code>), so every use gets it."},{"term":"Out-projection","plain":"<code>C&lt;out T&gt;<\/code>: you can read <code>T<\/code> values; calls that take a <code>T<\/code> are forbidden."},{"term":"In-projection","plain":"<code>C&lt;in T&gt;<\/code>: you can pass <code>T<\/code> values in; reads come back as <code>Any?<\/code>."},{"term":"Captured type","plain":"The compiler's placeholder for the one unknown real type behind a projection or wildcard (<code>CAP#1<\/code>, <code>CapturedType(out Number)<\/code>)."},{"term":"Platform type","plain":"A type from Java whose nullability Kotlin doesn't know, shown as <code>T!<\/code> (and <code>(Mutable)List<\/code> for Java lists)."}],"remote":true},"gen-07":{"id":"gen-07","track":"gen","n":7,"title":"Star projection: when you don't know the type","ready":false},"gen-08":{"id":"gen-08","track":"gen","n":8,"title":"Type erasure and reified type parameters","ready":false},"gen-09":{"id":"gen-09","track":"gen","n":9,"title":"KClass, Class and type tokens","ready":false},"gen-10":{"id":"gen-10","track":"gen","n":10,"title":"Advanced generics: recursive bounds, T & Any, @UnsafeVariance","ready":false},"gen-11":{"id":"gen-11","track":"gen","n":11,"title":"Generics workshop: a type-safe container and event bus","ready":false},"rx-01":{"id":"rx-01","track":"rx","n":1,"title":"Why reactive: push, pull and backpressure","ready":true,"minutes":35,"goal":"By the end you can explain how Reactive Streams demand (<code>request(n)<\/code>) stops a fast producer from drowning a slow consumer, name the rules a subscriber must follow, and write a <code>Flow.Subscriber<\/code> that asks for items in batches.","quiz":[{"q":"A subscriber calls <code>request(3)<\/code> in <code>onSubscribe<\/code> and never calls <code>request<\/code> again. The publisher has 10 items ready. What does the subscriber receive?","options":["All 10 items, because the publisher has them ready","3 items, then <code>onComplete<\/code>","3 items, and then nothing until it requests more","1 item, because each <code>onNext<\/code> needs its own request"],"answer":2,"why":"Rule 1.1 caps <code>onNext<\/code> signals at the total requested. The publisher has more to send, so it may not complete either. It waits for more demand. Having items ready doesn't let a publisher exceed demand.","from":null},{"q":"Inside <code>onNext<\/code>, your handler fails to parse a row. What should the subscriber do?","options":["Throw the exception so the publisher can call <code>onError<\/code>","Call <code>subscription.cancel()<\/code>, record the error, and return normally","Call <code>request(0)<\/code> to signal a problem","Ignore it and call <code>request(1)<\/code> to get the next row"],"answer":1,"why":"Rule 2.13 says subscriber methods must return normally. Cancelling is the only legal way for a subscriber to stop the stream. Throwing leaves the reaction up to the publisher (<code>SubmissionPublisher<\/code> cancels; other publishers may just log), and <code>request(0)<\/code> is itself a rule violation.","from":null},{"q":"A producer thread calls <code>SubmissionPublisher.submit(event)<\/code> in a loop. One subscriber is slow and its buffer of 256 is full. What happens?","options":["<code>submit<\/code> blocks until that subscriber has room","<code>submit<\/code> drops the event and returns -1","<code>submit<\/code> throws <code>IllegalStateException<\/code>","The event goes to the other subscribers only"],"answer":0,"why":"<code>submit<\/code> blocks while any subscriber's buffer is full, which slows the producer to the slowest subscriber's pace. <code>offer<\/code> is the method that drops instead (and returns a negative number). Pick <code>offer<\/code> with a drop handler if the producer must never wait.","from":null},{"q":"Which of these is the strongest reason to choose a non-blocking, reactive design for a service?","options":["Each request will finish faster","It is easier to debug than blocking code","It can keep thousands of slow calls in flight with a few threads and little memory","It removes the need for timeouts"],"answer":2,"why":"The Spring docs say reactive code generally doesn't run faster. The gain is scale with a small, fixed number of threads, and it only shows when calls have real latency. Debugging is harder, not easier, and slow calls still need timeouts.","from":null},{"q":"From \"How virtual threads work: carriers and continuations\": a virtual thread calls a blocking card-issuer API over a socket and waits 120 ms. What does its carrier thread do during the wait?","options":["It blocks for 120 ms, like a platform thread","The JVM creates a new carrier thread for the other virtual threads","It unmounts the waiting virtual thread and runs other virtual threads","The call throws, because virtual threads cannot block"],"answer":2,"why":"Blocking socket IO parks the virtual thread and frees the carrier to run other virtual threads. That is why blocking code on virtual threads scales without a reactive rewrite. The carrier pool doesn't grow to compensate for normal IO waits.","from":"vt-02"}],"cards":[{"front":"What does <code>request(n)<\/code> promise the subscriber?","back":"<p>That the publisher will send at most <code>n<\/code> more <code>onNext<\/code> signals (rule 1.1). It may send fewer and then complete or fail.<\/p>"},{"front":"In what order can a Reactive Streams subscriber see signals?","back":"<p><code>onSubscribe onNext* (onError | onComplete)?<\/code>: one <code>onSubscribe<\/code>, any number of <code>onNext<\/code>, then at most one terminal signal.<\/p>"},{"front":"How does a subscriber stop a stream when its handler fails?","back":"<p>It calls <code>subscription.cancel()<\/code> and returns normally. Throwing from <code>onNext<\/code> breaks rule 2.13.<\/p>"},{"front":"What does <code>SubmissionPublisher.submit<\/code> do when a subscriber's buffer is full?","back":"<p>It blocks the calling thread until there is room. <code>offer<\/code> drops instead and calls your drop handler.<\/p>"},{"front":"What happens if you call <code>request(0)<\/code> on a Reactor <code>Flux.range<\/code> subscription?","back":"<p>Nothing at all. Reactor only logs it at DEBUG and the stream stalls. Spec rule 3.9 (and the JDK's <code>SubmissionPublisher<\/code>) say it must signal <code>onError(IllegalArgumentException)<\/code>.<\/p>"},{"front":"What does <code>request(Long.MAX_VALUE)<\/code> mean?","back":"<p>Unbounded demand: \"send everything, no backpressure\" (rule 3.17).<\/p>"},{"front":"Is <code>kotlinx.coroutines.flow.Flow<\/code> the same as <code>java.util.concurrent.Flow<\/code>?","back":"<p>No. The JDK one is the Reactive Streams protocol with <code>request(n)<\/code>. Kotlin's is a coroutine stream whose backpressure is suspension of <code>emit<\/code>.<\/p>"}],"terms":[{"term":"Backpressure","plain":"A way for a slow consumer to tell a fast producer how much it can take, so the producer never sends more."},{"term":"Demand","plain":"The number of items a subscriber has asked for with <code>request(n)<\/code> and not yet received."},{"term":"Publisher","plain":"The source of a stream. It sends items to a subscriber, never more than the subscriber asked for."},{"term":"Subscriber","plain":"The receiver of a stream. It gets <code>onSubscribe<\/code>, then <code>onNext<\/code> items, then <code>onError<\/code> or <code>onComplete<\/code>."},{"term":"Subscription","plain":"The link between one publisher and one subscriber. It carries <code>request(n)<\/code> and <code>cancel()<\/code> upstream."},{"term":"Terminal signal","plain":"<code>onError<\/code> or <code>onComplete<\/code>. After one of them the stream is over and nothing else arrives."},{"term":"Non-blocking IO","plain":"IO where the thread hands the request to the OS and moves on, and a callback runs when the answer arrives."}],"remote":true},"rx-02":{"id":"rx-02","track":"rx","n":2,"title":"Mono and Flux: nothing happens until you subscribe","ready":true,"minutes":35,"goal":"By the end you can tell assembly time from subscription time, predict how many times a cold <code>Mono<\/code> or <code>Flux<\/code> does its work, and choose between <code>Mono.just<\/code>, <code>fromCallable<\/code> and <code>defer<\/code>.","quiz":[{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"n\">Flux<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">f<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Flux<\/span><span class=\"p\">.<\/span><span class=\"na\">just<\/span><span class=\"p\">(<\/span><span class=\"s\">\"a\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"b\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">map<\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"map \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">toUpperCase<\/span><span class=\"p\">();<\/span><span class=\"w\"> <\/span><span class=\"p\">});<\/span>\n<span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"built\"<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre>","options":["<code>map a<\/code>, <code>map b<\/code>, <code>built<\/code>","<code>built<\/code> only","<code>built<\/code>, <code>map a<\/code>, <code>map b<\/code>","Nothing"],"answer":1,"why":"Building the chain stores the lambda without calling it. Nobody subscribes to <code>f<\/code>, so <code>map<\/code> never runs and only <code>built<\/code> prints. The tempting first option is how <code>Stream<\/code> works with an eager terminal step; here there is no subscribe at all.","from":null},{"q":"<code>issuer.charge(req)<\/code> returns a cold <code>Mono&lt;Receipt&gt;<\/code> built with <code>fromCallable<\/code>. A handler does <code>Mono&lt;Receipt&gt; r = issuer.charge(req); r.subscribe(audit::record); return r.block();<\/code>. How many charges reach the issuer?","options":["One, because both use the same <code>Mono<\/code> object","Two, one per subscription","Zero, because <code>subscribe<\/code> and <code>block<\/code> cancel each other","It depends on which thread runs first"],"answer":1,"why":"A cold publisher runs once per subscriber. <code>subscribe<\/code> and <code>block<\/code> are two subscriptions, so the callable runs twice. Sharing a <code>Mono<\/code> object shares the recipe, not the result. Put the audit in the chain with <code>doOnNext<\/code>, or use <code>cache()<\/code> if you really need to share a result.","from":null},{"q":"<code>repo.find(id)<\/code> is a blocking call that may return <code>null<\/code>. Which line gives a lazy <code>Mono<\/code> that runs the call per subscription and is empty on <code>null<\/code>?","options":["<code>Mono.just(repo.find(id))<\/code>","<code>Mono.justOrEmpty(repo.find(id))<\/code>","<code>Flux.just(repo.find(id)).next()<\/code>","<code>Mono.fromCallable(() -&gt; repo.find(id))<\/code>"],"answer":3,"why":"<code>fromCallable<\/code> calls the lambda on each subscription and maps <code>null<\/code> to empty and exceptions to <code>onError<\/code>. <code>justOrEmpty<\/code> handles <code>null<\/code> too, but <code>repo.find(id)<\/code> is still an eager argument evaluated at assembly. <code>Mono.just(null)<\/code> would throw.","from":null},{"q":"You subscribe to <code>Mono.error(new IllegalStateException(\"declined\"))<\/code> with only an <code>onNext<\/code> lambda. What happens?","options":["The exception is thrown out of <code>subscribe<\/code> to your code","Reactor logs <code>ErrorCallbackNotImplemented<\/code> at ERROR level, and your code carries on","Nothing at all: errors without a handler are ignored silently","The JVM prints a stack trace and exits"],"answer":1,"why":"Without an error callback, Reactor routes the error to its <code>onErrorDropped<\/code> hook, which logs it at ERROR level. Your thread is not interrupted. That is why a test with no assertion on the error can pass even though the stream failed.","from":null},{"q":"From \"Why reactive: push, pull and backpressure\": you call <code>flux.subscribe(item -&gt; process(item))<\/code> with just the one lambda. What demand does that subscriber signal to the source?","options":["<code>request(1)<\/code> before each item","<code>request(256)<\/code>, then more in batches","<code>request(Long.MAX_VALUE)<\/code>: unbounded","No request until the first item arrives"],"answer":2,"why":"The lambda form of <code>subscribe<\/code> requests everything, which the <code>log()<\/code> output shows as <code>request(unbounded)<\/code>. That is rule 3.17's \"effectively unbounded\" demand: no backpressure from this subscriber. Lesson 7 of this track shows how operators like <code>limitRate<\/code> turn it back into bounded requests.","from":"rx-01"}],"cards":[{"front":"When does the lambda inside <code>flux.map(...)<\/code> run?","back":"<p>At subscription time, once per item for each subscriber. Never at assembly, and never if nobody subscribes.<\/p>"},{"front":"<code>Mono.just(fetch())<\/code> is subscribed three times. How many times does <code>fetch()<\/code> run?","back":"<p>Once, at assembly, before <code>just<\/code> is even cal
