led. All three subscribers get the same value.<\/p>"},{"front":"What does <code>Mono.fromCallable<\/code> do with a thrown exception and with a <code>null<\/code> result?","back":"<p>The exception becomes <code>onError<\/code>. <code>null<\/code> becomes an empty <code>Mono<\/code> (just <code>onComplete<\/code>).<\/p>"},{"front":"What is a cold publisher?","back":"<p>One that does its work again, from the start, for every subscriber. Most Reactor sources are cold.<\/p>"},{"front":"<code>amounts.filter(a -&gt; a &gt; 10);<\/code> on its own line, then <code>amounts.subscribe(...)<\/code>. Is anything filtered?","back":"<p>No. Operators return a new <code>Flux<\/code>. The filtered one was thrown away, so <code>amounts<\/code> is unchanged.<\/p>"},{"front":"When do you pick <code>Mono.defer<\/code> over <code>Mono.fromCallable<\/code>?","back":"<p>When the code returns a <code>Mono<\/code> (or other publisher), or must read state at subscription time, such as a nonce or <code>Instant.now()<\/code>.<\/p>"}],"terms":[{"term":"Flux","plain":"A Reactor publisher of 0 to N items, optionally ending with complete or error."},{"term":"Mono","plain":"A Reactor publisher of at most one item. <code>Mono&lt;Void&gt;<\/code> only signals completion or error."},{"term":"Assembly time","plain":"When you call operators to build the chain. Only wrapper objects are created; none of your lambdas run."},{"term":"Subscription time","plain":"When <code>subscribe<\/code> (or <code>block<\/code>) is called. The chain is linked up, demand goes up, and the source starts."},{"term":"Cold publisher","plain":"A publisher that does its work again for each subscriber."},{"term":"Hot publisher","plain":"A publisher that runs once and shares its items with whoever is subscribed. Lesson 8 of this track."},{"term":"Operator","plain":"A method like <code>map<\/code> or <code>filter<\/code> that wraps a publisher and returns a new one."}],"remote":true},"rx-03":{"id":"rx-03","track":"rx","n":3,"title":"Transforming streams: map, flatMap, concatMap","ready":true,"minutes":35,"goal":"By the end you can choose between <code>map<\/code>, <code>flatMap<\/code>, <code>concatMap<\/code>, <code>flatMapSequential<\/code> and <code>switchMap<\/code> from the requirements (order, one at a time, a concurrency limit, latest wins), and prove the choice with a virtual-time test.","quiz":[{"q":"You need to enrich 10,000 transactions with merchant data. The merchant service allows 20 concurrent calls, and the output order doesn't matter. Which line fits?","options":["<code>tx.map(t -&gt; merchants.lookup(t))<\/code>","<code>tx.concatMap(t -&gt; merchants.lookup(t))<\/code>","<code>tx.flatMap(t -&gt; merchants.lookup(t), 20)<\/code>","<code>tx.switchMap(t -&gt; merchants.lookup(t))<\/code>"],"answer":2,"why":"flatMap with concurrency 20 keeps exactly as many calls in flight as the service allows. <code>map<\/code> would produce a <code>Flux&lt;Mono&lt;...&gt;&gt;<\/code> and make no calls. <code>concatMap<\/code> is correct but makes one call at a time, and <code>switchMap<\/code> would cancel all but the last lookup.","from":null},{"q":"<code>issuer.fetchStatus(id)<\/code> returns <code>Mono&lt;String&gt;<\/code>. What happens when you subscribe to <code>ids.map(id -&gt; issuer.fetchStatus(id))<\/code>?","options":["Each status is fetched, one at a time","You receive one <code>Mono&lt;String&gt;<\/code> per id, and no issuer call is made unless something subscribes to those Monos","It doesn't compile","All statuses are fetched in parallel"],"answer":1,"why":"<code>map<\/code> wraps each returned <code>Mono<\/code> as an item, giving <code>Flux&lt;Mono&lt;String&gt;&gt;<\/code>. A <code>Mono<\/code> is a recipe; nobody subscribes to these, so nothing runs. <code>flatMap<\/code> (or <code>concatMap<\/code>) is what subscribes to the inner publishers.","from":null},{"q":"Postings for one account must reach the ledger one at a time, each after the previous one is acknowledged. A teammate proposes <code>flatMapSequential<\/code> because \"it keeps the order\". What is wrong with that?","options":["Nothing, it is the right choice","It sends all postings concurrently and only reorders the results","It drops postings that finish out of order","It cannot handle errors"],"answer":1,"why":"flatMapSequential subscribes to inners eagerly, so the ledger sees all postings at once. Only the output is reordered. <code>concatMap<\/code> is the operator that waits for each inner to complete before subscribing to the next.","from":null},{"q":"A <code>switchMap<\/code> inner is still running when the source emits a new item. What happens to that inner?","options":["It is cancelled, and its results never reach the output","It finishes, and its results are emitted after the new inner's","It is paused until the new inner completes","switchMap waits for it before starting the new inner"],"answer":0,"why":"switchMap cancels the current inner and switches to a new one for each source item. That prevents a stale slow result from overwriting a newer one, which is what can happen with flatMap.","from":null},{"q":"From \"CompletableFuture: composing async steps\": which <code>CompletableFuture<\/code> method plays the same role as Reactor's <code>flatMap<\/code> for one async step?","options":["<code>thenApply<\/code>","<code>thenAccept<\/code>","<code>thenCombine<\/code>","<code>thenCompose<\/code>"],"answer":3,"why":"<code>thenCompose<\/code> takes a function that returns another <code>CompletableFuture<\/code> and flattens it, just as flatMap subscribes to the publisher your function returns. <code>thenApply<\/code> is like <code>map<\/code>: given a function that returns a future, it produces a <code>CompletableFuture&lt;CompletableFuture&lt;T&gt;&gt;<\/code>.","from":"exec-06"}],"cards":[{"front":"What is flatMap's default concurrency in Reactor?","back":"<p>256 inners at once (and a prefetch of 32 per inner). Its first request to the source is also 256.<\/p>"},{"front":"<code>flatMap(f, 4)<\/code>: what does it request from the source?","back":"<p>4 at first, then 1 more each time an inner completes. So at most 4 inners are in flight.<\/p>"},{"front":"Does flatMap run inners on several threads?","back":"<p>No. It only subscribes to several at once. Parallelism comes from inners that are themselves asynchronous (non-blocking IO, <code>Mono.delay<\/code>, <code>subscribeOn<\/code>).<\/p>"},{"front":"Source 3, 1, 2; item i takes i x 100 ms. Output of <code>concatMap<\/code>, and when does it finish?","back":"<p><code>[3, 1, 2]<\/code> at 600 ms: one at a time, in order.<\/p>"},{"front":"What does <code>flatMapSequential<\/code> trade for ordered output at flatMap speed?","back":"<p>Memory: results that finish early are buffered until all earlier inners are done (and a slow first item holds back the rest).<\/p>"},{"front":"When does <code>switchMap<\/code> cancel an inner?","back":"<p>As soon as the source emits a new item. Only the latest item's inner is kept.<\/p>"},{"front":"Kotlin Flow equivalent of Reactor's <code>switchMap<\/code>?","back":"<p><code>flatMapLatest<\/code>, or <code>mapLatest<\/code> when the block returns one value.<\/p>"}],"terms":[{"term":"Inner publisher","plain":"The <code>Mono<\/code> or <code>Flux<\/code> your function returns inside flatMap, concatMap or switchMap."},{"term":"Flattening","plain":"Subscribing to inner publishers and merging their items into one output stream."},{"term":"Concurrency (flatMap)","plain":"The maximum number of inners flatMap keeps subscribed at once, and its first request upstream."},{"term":"Prefetch","plain":"How many items an operator requests ahead from a source so they are ready when needed."},{"term":"Head-of-line blocking","plain":"One slow item at the front holds back items behind it that are already done."},{"term":"Virtual time","plain":"A fake clock in tests (<code>StepVerifier.withVirtualTime<\/code>) that you move forward by hand, so delays take no real time."}],"remote":true},"rx-04":{"id":"rx-04","track":"rx","n":4,"title":"Combining streams: zip, merge, concat, combineLatest","ready":true,"minutes":35,"goal":"By the end you can fan out independent calls with <code>Mono.zip<\/code> without losing empty results, and choose between <code>merge<\/code>, <code>concat<\/code>, <code>zip<\/code> and <code>combineLatest<\/code> from when each source is subscribed and when output is produced.","quiz":[{"q":"<code>Mono.zip(fraudScore, fxRate)<\/code>: the fraud call fails after 50 ms; the FX call would take 2 seconds. What happens?","options":["The zip waits 2 seconds, then fails","The zip fails at about 50 ms and cancels the FX call","The zip emits the FX rate with a null fraud score","The zip retries the fraud call"],"answer":1,"why":"Combinators fail fast: the first error ends the zip and cancels the other sources. Waiting for the others is what <code>Mono.zipDelayError<\/code> does. Nothing is retried unless you add <code>retry<\/code> (lesson 5 of this track).","from":null},{"q":"A statement must show settled entries, then pending ones. The pending query is expensive and must not start until the settled list is complete. Which line fits?","options":["<code>Flux.merge(settled, pending)<\/code>","<code>Flux.mergeSequential(settled, pending)<\/code>","<code>Flux.concat(settled, pending)<\/code>","<code>Flux.zip(settled, pending)<\/code>"],"answer":2,"why":"<code>concat<\/code> subscribes to <code>pending<\/code> only after <code>settled<\/code> completes. <code>mergeSequential<\/code> produces the same output order but subscribes to both at once, so the expensive query starts early. <code>merge<\/code> interleaves, and <code>zip<\/code> pairs entries that have nothing to do with each other.","from":null},{"q":"Card events and bank events are two endless Kafka streams. A dashboard uses <code>Flux.concat(cardEvents, bankEvents)<\/code>. What does it show?","options":["Card and bank events, interleaved","Only card events, forever","Nothing until both streams complete","Bank events first, because they are smaller"],"answer":1,"why":"<code>concat<\/code> waits for the first source to complete before subscribing to the second, and an endless stream never completes. The bank stream is never subscribed. <code>merge<\/code> is the combinator for live feeds.","from":null},{"q":"Limits: 1000 at 0 ms, 2000 at 300 ms. Rates: 1.10 at 100 ms, 1.20 at 200 ms. What does <code>Flux.combineLatest(limits, rates, BigDecimal::multiply)<\/code> emit?","options":["<code>1100, 2400<\/code>","<code>1100, 1200, 2400<\/code>","<code>1100, 1200<\/code>","<code>2200, 2400<\/code>"],"answer":1,"why":"Nothing until both have emitted (100 ms: 1000 x 1.10). Then every change from either side re-emits with the latest of the other: the rate change at 200 ms gives 1200, and the limit change at 300 ms gives 2000 x 1.20 = 2400. <code>zip<\/code> would give only <code>1100, 2400<\/code>.","from":null},{"q":"From \"CompletableFuture: errors, timeouts and fan-out\": you fan out three calls with <code>CompletableFuture.allOf(a, b, c)<\/code>, and <code>a<\/code> fails at once. When does the <code>allOf<\/code> future complete?","options":["At once, exceptionally, and it cancels <code>b<\/code> and <code>c<\/code>","Exceptionally, but only after <code>b<\/code> and <code>c<\/code> have also completed","Normally, and you have to check each future yourself","Never, because one future failed"],"answer":1,"why":"<code>allOf<\/code> completes when all of the given futures complete, and exceptionally if any of them did. It does not cancel the others. That is the opposite of <code>Mono.zip<\/code>, which fails at the first error and cancels the remaining sources.","from":"exec-07"}],"cards":[{"front":"What does <code>Mono.zip<\/code> do when one of its sources completes empty?","back":"<p>It completes empty right away (no value, no error) and cancels the other sources.<\/p>"},{"front":"How do you make an empty source fail inside a <code>Mono.zip<\/code>?","back":"<p>Put <code>.switchIfEmpty(Mono.error(...))<\/code> on that source before zipping it (or <code>defaultIfEmpty(x)<\/code> if there is a sensible default).<\/p>"},{"front":"<code>merge<\/code> vs <code>concat<\/code>: when is the second source subscribed?","back":"<p><code>merge<\/code>: immediately, together with the first. <code>concat<\/code>: only after the first source completes.<\/p>"},{"front":"<code>Flux.concat(endless, other)<\/code>: what happens to <code>other<\/code>?","back":"<p>It is never subscribed, because <code>endless<\/code> never completes.<\/p>"},{"front":"When does <code>combineLatest<\/code> emit?","back":"<p>Once every source has emitted at least once, and then on every new item from any source, combined with the latest of the others.<\/p>"},{"front":"Why can't you <code>Mono.zip<\/code> a <code>Mono&lt;Void&gt;<\/code>?","back":"<p>It always completes empty, so the zip completes empty. Use <code>Mono.when(...)<\/code> to wait for side effects, then <code>.then(...)<\/code>.<\/p>"}],"terms":[{"term":"Fan-out","plain":"Starting several independent calls at once and combining their results."},{"term":"zip","plain":"Combines one item from each source, position by position; completes when any source completes."},{"term":"merge","plain":"Subscribes to all sources at once and emits their items in arrival order."},{"term":"concat","plain":"Subscribes to each source only after the previous one has completed."},{"term":"combineLatest","plain":"Emits a new combination whenever any source emits, using the latest item of each."},{"term":"DelayError variant","plain":"A version of a combinator that lets the other sources finish before reporting an error."}],"remote":true},"rx-05":{"id":"rx-05","track":"rx","n":5,"title":"Errors, retries and timeouts","ready":true,"minutes":35,"goal":"By the end you can recover from errors without pretending a stream continues, skip bad items safely, and wrap a flaky remote call in a per-attempt timeout, a filtered exponential backoff and a fallback, then prove the timing with virtual time.","quiz":[{"q":"What does <code>Flux.just(5, 10, 0, 20).map(i -&gt; 100 / i).onErrorReturn(-1).collectList().block()<\/code> return?","options":["<code>[20, 10, -1, 5]<\/code>","<code>[20, 10, -1]<\/code>","<code>[20, 10, 5]<\/code>","It throws <code>ArithmeticException<\/code>"],"answer":1,"why":"The division by zero ends the source, so 20 is never divided. <code>onErrorReturn<\/code> replaces the rest of the stream with one value and completes. The first option assumes the stream continues after the fallback, and the third is what per-item handling would give.","from":null},{"q":"An exchange-rate call sometimes hangs. Which chain retries a hanging attempt? (<code>ofMillis<\/code> and <code>ofSeconds<\/code> are <code>Duration<\/code> factories.)","options":["<code>Mono.defer(this::rate).retryWhen(Retry.backoff(3, ofMillis(100))).timeout(ofSeconds(2))<\/code>","<code>Mono.defer(this::rate).timeout(ofMillis(500)).retryWhen(Retry.backoff(3, ofMillis(100)))<\/code>","<code>Mono.defer(this::rate).retryWhen(Retry.backoff(3, ofMillis(100)))<\/code>","<code>Mono.defer(this::rate).retry(3)<\/code>"],"answer":1,"why":"Only a timeout above <code>retryWhen<\/code> turns each hanging attempt into an error that the retry can see. In the first option the timeout is a total budget: the first attempt hangs for 2 seconds and is never retried. The last two have no timeout, so a hang produces no error at all and nothing is retried.","from":null},{"q":"A Kafka consumer must log and skip messages whose amount fails to parse, and keep consuming. Which is the right shape?","options":["<code>messages.map(this::parse).onErrorResume(e -&gt; Mono.empty())<\/code>","<code>messages.map(this::parse).onErrorContinue((e, m) -&gt; log(m))<\/code>","<code>messages.concatMap(m -&gt; Mono.fromCallable(() -&gt; parse(m)).onErrorResume(e -&gt; logAndSkip(m, e)))<\/code>","<code>messages.map(this::parse).retry()<\/code>"],"answer":2,"why":"Handling the error inside each message's own <code>Mono<\/code> ends only that inner Mono, so the outer stream keeps going. The first option ends the whole stream at the first bad message. <code>onErrorContinue<\/code> happens to work here, but it acts on operators upstream of it and can leak into library code; its Javadoc recommends the inner-publisher shape. <code>retry()<\/code> re-subscribes to the consumer forever and hits the same bad message again.","from":null},{"q":"<code>issuer.authorize(id)<\/code> always fails with <code>IssuerUnavailableException<\/code>. What does <code>Mono.defer(() -&gt; issuer.authorize(id)).retry(2).block()<\/code> do?","options":["Calls the issuer 2 times, then throws <code>RetryExhaustedException<\/code>","Calls the issuer 3 times, 100 ms apart, then throws <code>IssuerUnavailableException<\/code>","Calls the issuer 3 times with no pause, then throws <code>IssuerUnavailableException<\/code>","Calls the issuer once, because <code>retry<\/code> re-uses the first result"],"answer":2,"why":"<code>retry(n)<\/code> means n retries, so 3 attempts, all back to back, and it rethrows the original error. Pauses and <code>RetryExhaustedException<\/code> come from <code>retryWhen(Retry.backoff(...))<\/code>. Because of <code>Mono.defer<\/code>, each attempt really calls the issuer; without it, a client that does the work on call would be called once.","from":null},{"q":"From \"Mono and Flux: nothing happens until you subscribe\": a teammate writes <code>Mono.just(issuerClient.authorizeBlocking(id)).retry(3)<\/code>. The call fails on the first try. How many times does the issuer receive a request?","options":["Once, and the exception is thrown before <code>retry<\/code> exists","Four times","Three times","Zero times, because nothing is subscribed"],"answer":0,"why":"<code>Mono.just<\/code> takes a value, so Java evaluates <code>authorizeBlocking(id)<\/code> first, at assembly time. It throws right there, out of the line that builds the pipeline, and <code>retry(3)<\/code> is never even created. Even if it had returned a value, <code>Mono.just<\/code> would replay that same value to every subscriber. Use <code>Mono.fromCallable<\/code> or <code>Mono.defer<\/code> so each subscription makes the call.","from":"rx-02"}],"cards":[{"front":"<code>Flux.just(1, 2, 0, 4).map(i -&gt; 8 / i).onErrorReturn(-1)<\/code>: what is emitted?","back":"<p><code>8, 4, -1<\/code>, then complete. The error ended the source, so 4 is never processed.<\/p>"},{"front":"How do you skip one bad item in a Flux without ending the stream?","back":"<p>Process each item in its own <code>Mono<\/code> inside <code>concatMap<\/code>/<code>flatMap<\/code>, and put <code>onErrorResume<\/code> on that inner Mono.<\/p>"},{"front":"Why is <code>onErrorContinue<\/code> discouraged?","back":"<p>It acts on operators upstream of it (not downstream), only works with operators that support it, and can leak into library code. Its own Javadoc says so.<\/p>"},{"front":"<code>retry(2)<\/code> on a source that always fails: how many attempts, and which error?","back":"<p>3 attempts with no pause, then the original error.<\/p>"},{"front":"<code>Retry.backoff(3, 100ms).jitter(0)<\/code> on a source that always fails: attempts, timing, error?","back":"<p>4 attempts at 0, 100, 300 and 700 ms, then <code>RetryExhaustedException<\/code> (\"Retries exhausted: 3/3\") with the last error as its cause.<\/p>"},{"front":"Why can <code>retry<\/code> fail to call the server again?","back":"<p>It re-subscribes. If the Mono was built from a call made at assembly (<code>Mono.just(call())<\/code> or a client that calls eagerly), it replays the stored answer. Wrap it in <code>Mono.defer<\/code>.<\/p>"},{"front":"<code>timeout<\/code> above vs below <code>retryWhen<\/code>?","back":"<p>Above: each attempt gets the time, and a timeout is retried. Below: one budget for the whole operation, waits included.<\/p>"}],"terms":[{"term":"Fallback","plain":"What a stream switches to when an error arrives: a value, another publisher, or a different error."},{"term":"Retry","plain":"Subscribing to the source again after an error, so a cold source does its work again."},{"term":"Exponential backoff","plain":"Waiting longer before each retry, usually doubling: 100 ms, 200 ms, 400 ms."},{"term":"Jitter","plain":"A random change to each backoff wait, so many clients that failed together don't retry at the same instant."},{"term":"RetryExhaustedException","plain":"The error <code>Retry.backoff<\/code> and <code>Retry.max<\/code> signal when the retries run out; the cause is the last real error."},{"term":"Transient error","plain":"A failure that a later attempt may not repeat: a timeout, a 503, a connection reset."},{"term":"Idempotency key","plain":"A unique id sent with a request, so the server can tell a retry from a new request and do the work once."}],"remote":true},"rx-06":{"id":"rx-06","track":"rx","n":6,"title":"Schedulers: publishOn, subscribeOn and blocking calls","ready":false},"rx-07":{"id":"rx-07","track":"rx","n":7,"title":"Backpressure in practice","ready":false},"rx-08":{"id":"rx-08","track":"rx","n":8,"title":"Hot and cold publishers, Sinks, and StepVerifier","ready":false},"co-01":{"id":"co-01","track":"co","n":1,"title":"Suspend functions from zero","ready":true,"minutes":35,"goal":"By the end you can say what <code>suspend<\/code> really does (and what it does not), read the state machine the compiler builds from a suspend function, and wrap a callback API in a cancellable suspend function.","quiz":[{"q":"This runs on one thread: <code>runBlocking { repeat(3) { launch { Thread.sleep(100) } } }<\/code>. About how long does it take?","options":["About 100 ms, because the three coroutines run concurrently","About 300 ms, because each sleep blocks the only thread","About 0 ms, because launch returns at once","It does not compile: Thread.sleep is not allowed in a coroutine"],"answer":1,"why":"<code>Thread.sleep<\/code> blocks the thread, and <code>runBlocking<\/code> gives all three coroutines one thread, so they sleep one after another. With <code>delay(100)<\/code> they would overlap and finish in about 100 ms. The compiler happily accepts <code>Thread.sleep<\/code> here, which is why the bug survives code review.","from":null},{"q":"<code>suspend fun parseStatement(json: String): Statement<\/code> is pure CPU work with no suspending calls. A request coroutine on thread <code>worker-2<\/code> calls it. Which thread runs the parsing?","options":["<code>worker-2<\/code>, the caller's thread","A thread from <code>Dispatchers.IO<\/code>","A new background thread for each call","The thread is chosen at random by the JVM"],"answer":0,"why":"A suspend function that never suspends is ordinary code on the caller's thread. <code>suspend<\/code> does not move work anywhere. To run CPU work elsewhere you'd switch dispatcher explicitly with <code>withContext(Dispatchers.Default)<\/code>, which lesson 4 of this track covers.","from":null},{"q":"How does <code>suspend fun balance(accountId: String): Long<\/code> look to a Java caller?","options":["<code>long balance(String accountId)<\/code>","<code>CompletableFuture&lt;Long&gt; balance(String accountId)<\/code>","<code>Object balance(String accountId, Continuation&lt;? super Long&gt; continuation)<\/code>","<code>void balance(String accountId, Consumer&lt;Long&gt; callback)<\/code>"],"answer":2,"why":"The compiler adds a <code>Continuation<\/code> as the last parameter and changes the return type to <code>Object<\/code>, which holds either the result (boxed) or <code>COROUTINE_SUSPENDED<\/code>. That is why Java code can't simply call suspend functions; lesson 11 of this track shows the bridges (<code>future {}<\/code>).","from":null},{"q":"A callback SDK is wrapped with <code>suspendCoroutine<\/code> (not the cancellable version). The caller runs <code>withTimeout(200) { sdk.callAwait() }<\/code> and the SDK answers after 3 seconds. What happens?","options":["<code>TimeoutCancellationException<\/code> at 200 ms, and the SDK call is cancelled","The call returns the SDK's value after 3 seconds; the timeout is ignored","<code>IllegalStateException<\/code>, because the continuation was resumed twice","The coroutine stays suspended until the SDK answers at 3 s, then throws <code>TimeoutCancellationException<\/code>; the SDK is never told"],"answer":3,"why":"The timeout cancels the coroutine at 200 ms, but a non-cancellable continuation cannot wake up until it is resumed. When the SDK answers at 3 s, the coroutine finds itself cancelled and throws. <code>suspendCancellableCoroutine<\/code> would resume at 200 ms and run <code>invokeOnCancellation<\/code>, where you cancel the SDK call.","from":null},{"q":"From the virtual threads track: a virtual thread calls <code>Thread.sleep(200)<\/code>. What happens to its carrier thread?","options":["The carrier is blocked for the full 200 ms","The virtual thread unmounts, and the carrier is free to run other virtual threads","The JVM creates a new carrier to replace it","<code>sleep<\/code> throws, because virtual threads cannot sleep"],"answer":1,"why":"When a virtual thread blocks in <code>sleep<\/code>, the JVM saves its stack and unmounts it, so the carrier runs other virtual threads. It is the same idea as a coroutine suspending, done by the JVM for any blocking call instead of by the Kotlin compiler for <code>suspend<\/code> calls.","from":"vt-02"}],"cards":[{"front":"Does <code>suspend<\/code> run a function on a background thread?","back":"<p>No. It only lets the function pause without blocking. The dispatcher decides the thread, and a suspend function that never suspends runs on its caller's thread.<\/p>"},{"front":"Inside a coroutine, what is the difference between <code>delay(200)<\/code> and <code>Thread.sleep(200)<\/code>?","back":"<p><code>delay<\/code> suspends the coroutine and frees the thread for others. <code>Thread.sleep<\/code> blocks the thread, so every coroutine waiting for that thread waits too.<\/p>"},{"front":"What does the compiler add to a suspend function's signature?","back":"<p>A <code>Continuation&lt;T&gt;<\/code> as the last parameter. The return type becomes <code>Any?<\/code> (<code>Object<\/code> in Java).<\/p>"},{"front":"What does a compiled suspend function return when it pauses?","back":"<p>The marker <code>COROUTINE_SUSPENDED<\/code>. The real result arrives later through <code>continuation.resumeWith(...)<\/code>.<\/p>"},{"front":"Where does a suspended coroutine keep its local variables?","back":"<p>In fields (<code>L$0<\/code>, <code>L$1<\/code>, ...) of a small state-machine object on the heap, next to an <code>int label<\/code> that says which state runs next.<\/p>"},{"front":"Why wrap a callback with <code>suspendCancellableCoroutine<\/code> and not <code>suspendCoroutine<\/code>?","back":"<p>Only the cancellable one reacts to cancellation: it resumes the caller at once with <code>CancellationException<\/code> and runs <code>invokeOnCancellation<\/code>, where you cancel the underlying call.<\/p>"},{"front":"A callback fires after its coroutine was cancelled. What happens to <code>cont.resume(value)<\/code>?","back":"<p>It is ignored (prompt cancellation guarantee). If the value is a resource, pass a cleanup lambda: <code>cont.resume(value) { _, v, _ -&gt; v.close() }<\/code>.<\/p>"}],"terms":[{"term":"Coroutine","plain":"One running piece of work that can pause and resume later, without holding a thread while paused."},{"term":"Suspend function","plain":"A function marked <code>suspend<\/code>. It may pause at suspending calls and can only be called from a coroutine or another suspend function."},{"term":"Suspension point","plain":"A call to a suspend function, where the caller may pause. It does not always pause, for example on a cache hit."},{"term":"Continuation","plain":"The object that knows how to resume a paused coroutine: its context plus <code>resumeWith(result)<\/code>."},{"term":"COROUTINE_SUSPENDED","plain":"The marker a compiled suspend function returns to say it paused and will resume through the continuation."},{"term":"Continuation-passing style","plain":"Compiling a function so it receives \"what to do next\" as an extra parameter, instead of returning to a waiting caller."},{"term":"Dispatcher","plain":"The scheduler that decides which thread runs a coroutine, and which thread it resumes on."}],"remote":true},"co-02":{"id":"co-02","track":"co","n":2,"title":"Builders: launch, async, runBlocking, coroutineScope","ready":true,"minutes":35,"goal":"By the end you can pick the right builder for a job (launch, async, coroutineScope or runBlocking), and split one request into concurrent calls that take as long as the slowest call.","quiz":[{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">runBlocking<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">launch<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"X\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Y\"<\/span><span class=\"p\">)<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>","options":["X then Y","Y then X","Either order, it changes from run to run","Only Y; the launched coroutine never runs"],"answer":1,"why":"<code>launch<\/code> schedules its block on <code>runBlocking<\/code>'s single thread and returns. That thread is still running the outer block, so <code>Y<\/code> prints first. The child runs when the outer block finishes, and <code>runBlocking<\/code> waits for it before returning. Order is deterministic here because there is only one thread.","from":null},{"q":"<p>About how long does this take?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">coroutineScope<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">async<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">300<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"m\">1<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">b<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">async<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">200<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"m\">2<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">a<\/span><span class=\"p\">.<\/span><span class=\"na\">await<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">b<\/span><span class=\"p\">.<\/span><span class=\"na\">await<\/span><span class=\"p\">()<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>","options":["About 200 ms","About 500 ms","About 300 ms","About 0 ms, because async returns at once"],"answer":2,"why":"Both children start before the first <code>await<\/code>, so the delays overlap and the total is the longer one. 500 ms would be the sequential version. <code>async<\/code> does return at once, but <code>await<\/code> and the scope both wait for the children.","from":null},{"q":"<p><code>fetchA<\/code> takes 300 ms and <code>fetchB<\/code> 200 ms. How long does this take?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">async<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">fetchA<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">}.<\/span><span class=\"na\">await<\/span><span class=\"p\">()<\/span>\n<span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">b<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">async<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">fetchB<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">}.<\/span><span class=\"na\">await<\/span><span class=\"p\">()<\/span>\n<\/code><\/pre>","options":["About 500 ms: each await finishes before the next async starts","About 300 ms: async runs them in parallel","About 200 ms","It does not compile, because await must be called later"],"answer":0,"why":"Calling <code>await()<\/code> right after <code>async<\/code> waits for that child before the next line runs, so nothing overlaps. Keep the <code>Deferred<\/code> values and await them after starting both.","from":null},{"q":"A suspend handler must publish a <code>PaymentCaptured<\/code> event and write an audit row, at the same time. It needs neither result, but it must not return until both are done. Which fits?","options":["<code>GlobalScope.launch { publish() }; GlobalScope.launch { audit() }<\/code>","<code>runBlocking { launch { publish() }; launch { audit() } }<\/code>","<code>publish(); audit()<\/code>","<code>coroutineScope { launch { publish() }; launch { audit() } }<\/code>"],"answer":3,"why":"<code>coroutineScope<\/code> with two <code>launch<\/code> children runs them concurrently and returns only when both finish. <code>GlobalScope<\/code> returns at once and leaks the work. <code>runBlocking<\/code> blocks the handler's thread. Two plain calls are correct but sequential.","from":null},{"q":"From the executors track: <code>CompletableFuture.allOf(a, b, c)<\/code>. <code>b<\/code> fails after 10 ms, while <code>a<\/code> and <code>c<\/code> take one second. When does the <code>allOf<\/code> future complete?","options":["As soon as <code>b<\/code> fails, after about 10 ms","When all three have completed, after about one second, exceptionally","After about one second, normally, with <code>b<\/code>'s result left out","Never: <code>allOf<\/code> hangs when one future fails"],"answer":1,"why":"<code>allOf<\/code> completes when all of its futures complete, and it completes exceptionally if any of them did. It does not cancel <code>a<\/code> and <code>c<\/code> when <code>b<\/code> fails. Compare <code>coroutineScope<\/code> with <code>awaitAll()<\/code>, which fails at 10 ms and cancels the two remaining children.","from":"exec-07"}],"cards":[{"front":"What does <code>launch<\/code> return, and where does its exception go?","back":"<p>A <code>Job<\/code>, with no result. If the coroutine fails, the exception goes to its parent, not to whoever holds the Job.<\/p>"},{"front":"What does <code>async<\/code> return?","back":"<p>A <code>Deferred&lt;T&gt;<\/code>: a Job that will hold a value. <code>await()<\/code> suspends until it is ready, then returns it or rethrows the failure.<\/p>"},{"front":"<code>val a = async { f() }.await(); val b = async { g() }.await()<\/code>: concurrent or sequential?","back":"<p>Sequential. Each <code>await<\/code> finishes before the next <code>async<\/code> starts. Start both, then await.<\/p>"},{"front":"<code>awaitAll()<\/code> vs <code>map { it.await() }<\/code>?","back":"<p>Same results in the same order, but <code>awaitAll<\/code> fails as soon as any deferred fails. The <code>map<\/code> version notices only when it reaches the failed one.<\/p>"},{"front":"When does <code>coroutineScope { ... }<\/code> return?","back":"<p>After its block and every child started inside it have finished. If a child fails, it cancels the others and rethrows.<\/p>"},{"front":"Where is <code>runBlocking<\/code> allowed?","back":"<p>At blocking edges: <code>main<\/code>, tests and blocking framework callbacks. Never inside suspend code, where it holds the thread and ignores the caller's context.<\/p>"}],"terms":[{"term":"Coroutine builder","plain":"A function that starts a coroutine, such as <code>launch<\/code>, <code>async<\/code>, <code>runBlocking<\/code> or <code>coroutineScope<\/code>."},{"term":"Job","plain":"A handle to a coroutine's lifecycle: check it, join it, cancel it. It holds no value."},{"term":"Deferred","plain":"A Job that will also hold a result. <code>await()<\/code> returns it or rethrows the failure."},{"term":"CoroutineScope","plain":"The thing you call <code>launch<\/code> and <code>async<\/code> on. It supplies the parent Job and context for new coroutines."},{"term":"Concurrent decomposition","plain":"Splitting one task into independent calls, starting them together, and combining their results."},{"term":"Event loop","plain":"The queue of coroutines that <code>runBlocking<\/code> runs one at a time on the thread it blocks."}],"remote":true},"co-03":{"id":"co-03","track":"co","n":3,"title":"Structured concurrency: scopes, jobs and the tree","ready":true,"minutes":35,"goal":"By the end you can draw the job tree for a piece of coroutine code, predict what a failure or a cancel does to it, spot leaked work, and give a class that starts background work a scope it owns and closes.","quiz":[{"q":"<p>What happens here?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">coroutineScope<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">launch<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">100<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"n\">IOException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"down\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">launch<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">1<\/span><span class=\"n\">_000<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"done\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>","options":["<code>done<\/code> prints at 1 s, then the scope throws <code>IOException<\/code>","The <code>IOException<\/code> is printed by the uncaught handler and the scope returns normally","At about 100 ms the second child is cancelled, <code>done<\/code> never prints, and the scope throws <code>IOException<\/code>","The scope returns normally at 1 s, because <code>launch<\/code> swallows exceptions"],"answer":2,"why":"The failed child cancels the scope's job, which cancels its sibling. The scope waits for the sibling to stop, then rethrows the original exception to its caller. Nothing waits for the full second.","from":null},{"q":"A child coroutine ends by throwing <code>CancellationException<\/code>. What happens to its parent and its siblings?","options":["Nothing: the child counts as cancelled, and the parent is not notified","The parent is cancelled, and so are the siblings","The parent rethrows the <code>CancellationException<\/code> to its caller","The siblings are cancelled, but the parent keeps running"],"answer":0,"why":"A <code>CancellationException<\/code> means \"I was cancelled\", not \"I failed\". The child cancels its own children, but the parent keeps going. Only other exceptions travel up. Lesson 5 of this track shows why that makes swallowing it dangerous.","from":null},{"q":"A request handler calls <code>GlobalScope.launch { reconcile(batch) }<\/code> and returns. A minute later the service shuts down while the reconciliation is still running. What stops the reconciliation?","options":["The request's scope, which cancels it when the response is sent","Quarkus, which cancels all coroutines on shutdown","<code>runBlocking<\/code> at the top of the call stack","Nothing in coroutines: it runs until it finishes or the JVM exits"],"answer":3,"why":"A <code>GlobalScope<\/code> coroutine has no parent, so no lifecycle reaches it. It stops when it finishes, or when the JVM dies, possibly halfway through. If it must be stopped cleanly, it needs an owner with a scope that is cancelled on shutdown.","from":null},{"q":"A Kafka partition worker starts a background flush loop when its partition is assigned. Where should the loop's coroutine live?","options":["In <code>GlobalScope<\/code>, because it outlives any single record","In a scope owned by the partition worker, cancelled and joined in <code>onPartitionsRevoked<\/code>","In <code>runBlocking<\/code> on the consumer's poll thread","In a new <code>CoroutineScope(Dispatchers.IO)<\/code> created inside the assignment callback"],"answer":1,"why":"The loop lives exactly as long as the partition assignment, so the worker for that partition should own the scope and cancel it when the partition is revoked. A new scope created in the callback has no owner and leaks like <code>GlobalScope<\/code>. <code>runBlocking<\/code> would block the poll thread.","from":null},{"q":"<p>From lesson 2 of this track: what does this return, and when?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">coroutineScope<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">launch<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">200<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"m\">42<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>","options":["42, at once, because <code>launch<\/code> returns immediately","42, after about 200 ms, when the child finishes","Unit, because the last expression is <code>launch<\/code>","It never returns, because nobody joins the child"],"answer":1,"why":"The block's value is 42, but <code>coroutineScope<\/code> returns only after every child has completed. You don't need <code>join<\/code>: waiting for children is the scope's job.","from":"co-02"}],"cards":[{"front":"When does a parent coroutine complete?","back":"<p>Only after its own block and all of its children have completed.<\/p>"},{"front":"In a regular <code>coroutineScope<\/code>, one child throws <code>IOException<\/code>. What happens?","back":"<p>The scope is cancelled, which cancels the other children. The scope waits for them to stop, then rethrows the <code>IOException<\/code> to its caller.<\/p>"},{"front":"A child ends with <code>CancellationException<\/code>. Is its parent cancelled?","back":"<p>No. It counts as cancelled, not failed, so the parent is not notified.<\/p>"},{"front":"Which direction does cancellation travel in the job tree?","back":"<p>Down only. Cancelling a parent cancels all of its children; cancelling a child leaves the parent alone.<\/p>"},{"front":"Why is <code>GlobalScope.launch<\/code> in a request handler a leak?","back":"<p>The coroutine has no parent: nothing waits for it, nothing cancels it when the request ends, and its failure goes to the uncaught exception handler.<\/p>"},{"front":"How should a class that starts background coroutines be structured?","back":"<p>Own one <code>CoroutineScope(context + Job())<\/code> as a field, launch into it, and cancel it (or <code>cancelAndJoin<\/code>) when the owner's lifecycle ends.<\/p>"}],"terms":[{"term":"Structured concurrency","plain":"Concurrent work forms a tree that matches the code: children can't outlive their parent, and failures and cancels follow the tree."},{"term":"Parent job","plain":"The job a new coroutine attaches to. It waits for its children and cancels them when it is cancelled."},{"term":"Child coroutine","plain":"A coroutine started in a scope. Its failure cancels its parent unless the parent is a supervisor."},{"term":"Scope","plain":"A coroutine context that holds a job. New coroutines started in it become that job's children."},{"term":"GlobalScope","plain":"A scope with no job. Coroutines started there have no parent and are not structured."},{"term":"Leaked coroutine","plain":"A coroutine that keeps running after everything that cared about it has gone."}],"remote":true},"co-04":{"id":"co-04","track":"co","n":4,"title":"Dispatchers and the coroutine context","ready":true,"minutes":35,"goal":"By the end you can say which thread a coroutine runs on and why, move blocking and CPU work to the right dispatcher with withContext, give a slow resource its own budget with limitedParallelism, and read and extend a coroutine context with +.","quiz":[{"q":"A Quarkus endpoint handles 10 concurrent requests on a 4-core pod. Each one runs <code>launch { repo.findPayment(id) }<\/code> (a blocking 300 ms JDBC call) in a scope whose dispatcher is Default. At that moment a coroutine on Default needs 1 ms of CPU to check a signature. When does it run?","options":["At once, because Default and IO are separate thread pools","Only once a Default thread finishes its blocking call, roughly 300 ms later","At once, because kotlinx.coroutines moves blocking calls to IO for you","Never: Default throws <code>IllegalStateException<\/code> when a thread blocks for too long"],"answer":1,"why":"All 4 Default threads are blocked inside JDBC calls, so the signature check waits in the queue until one returns. Nothing moves a blocking call for you, and nothing throws. Wrapping the query in <code>withContext(Dispatchers.IO)<\/code> keeps Default free.","from":null},{"q":"A nightly export makes 300 blocking calls to a reporting database whose pool has 100 connections. It must not slow down the service's other blocking calls. Which dispatcher fits?","options":["<code>Dispatchers.IO<\/code>","<code>Dispatchers.Default.limitedParallelism(100)<\/code>","<code>Dispatchers.IO.limitedParallelism(100, \"reports\")<\/code>","<code>Dispatchers.Unconfined<\/code>"],"answer":2,"why":"A view over IO caps the export at 100, and because IO views are elastic it adds to IO's 64 instead of using them up. Plain IO would let the export take all 64 threads. A view over Default can't exceed the core count, and Default must never block anyway.","from":null},{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">ctx<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">CoroutineName<\/span><span class=\"p\">(<\/span><span class=\"s\">\"a\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">Dispatchers<\/span><span class=\"p\">.<\/span><span class=\"na\">IO<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">CoroutineName<\/span><span class=\"p\">(<\/span><span class=\"s\">\"b\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"n\">ctx<\/span><span class=\"o\">[<\/span><span class=\"n\">CoroutineName<\/span><span class=\"o\">]?.<\/span><span class=\"na\">name<\/span><span class=\"p\">)<\/span>\n<\/code><\/pre>","options":["<code>b<\/code>","<code>a<\/code>","<code>a, b<\/code>","<code>null<\/code>, because the dispatcher replaced the name"],"answer":0,"why":"A context holds at most one element per key, and <code>+<\/code> lets the right side win. <code>CoroutineName(\"b\")<\/code> replaces <code>a<\/code>. The dispatcher has a different key, so it sits beside the name without touching it.","from":null},{"q":"Inside <code>withContext(Dispatchers.IO + CoroutineName(\"capture\")) { ... }<\/code> you call <code>launch(CoroutineName(\"refund\")) { ... }<\/code>. What does the child coroutine's context contain?","options":["Default and <code>refund<\/code>, because <code>launch<\/code> uses Default unless told otherwise","IO and <code>capture<\/code>, because the parent's context always wins","IO and <code>refund<\/code>, and the same <code>Job<\/code> as the <code>withContext<\/code> block","IO and <code>refund<\/code>, and a new <code>Job<\/code> that is a child of the block's job"],"answer":3,"why":"A child starts from its scope's context (IO and <code>capture<\/code>), then the builder's argument overrides it (<code>refund<\/code>), then it gets a fresh <code>Job<\/code> that is a child of the scope's job. The \"Default unless told\" rule only applies when the context has no dispatcher at all.","from":null},{"q":"From the executors track: each issuer call holds one of the issuer SDK's 20 connections. You give issuer calls their own pool of 64 threads. How many issuer calls can really make progress at once?","options":["64","20","84","One per core"],"answer":1,"why":"The smallest limit on the path is the real ceiling. The other 44 threads sit waiting for a connection. That is why the issuer's dispatcher in this lesson is a view of exactly 20.","from":"exec-03"}],"cards":[{"front":"How many threads does <code>Dispatchers.Default<\/code> have?","back":"<p>One per CPU core, and at least two.<\/p>"},{"front":"What is <code>Dispatchers.IO<\/code>'s default limit?","back":"<p>64 parallel blocking tasks, or the core count if that is larger. The <code>kotlinx.coroutines.io.parallelism<\/code> property changes it.<\/p>"},{"front":"Does <code>Dispatchers.IO.limitedParallelism(100)<\/code> take 100 of IO's 64 threads?","back":"<p>No. Views over IO are elastic and add to IO's budget: IO and the view together can run 64 + 100 blocking tasks.<\/p>"},{"front":"What does <code>withContext(Dispatchers.IO) { load() }<\/code> do to the calling coroutine?","back":"<p>It suspends the caller, runs <code>load()<\/code> on IO, then resumes the caller on its own dispatcher with the result.<\/p>"},{"front":"<code>ctx<\/code> holds <code>CoroutineName(\"a\")<\/code>. What name does <code>ctx + CoroutineName(\"b\")<\/code> hold?","back":"<p><code>b<\/code>. One element per key, and the right side of <code>+<\/code> wins.<\/p>"},{"front":"Why does a <code>ThreadLocal<\/code> read <code>null<\/code> after <code>withContext(Dispatchers.Default)<\/code>?","back":"<p>The block runs on another thread, which has its own value. Pass <code>threadLocal.asContextElement()<\/code> in the context to carry it along.<\/p>"},{"front":"In kotlinx.coroutines 1.11, which key looks up the dispatcher in a context?","back":"<p><code>ContinuationInterceptor<\/code>. Using <code>CoroutineDispatcher<\/code> as the key is deprecated.<\/p>"}],"terms":[{"term":"Dispatcher","plain":"The context element that decides which thread runs a coroutine each time it starts or resumes."},{"term":"Dispatchers.Default","plain":"The shared pool for CPU work: one thread per core, at least two."},{"term":"Dispatchers.IO","plain":"The shared pool for blocking calls: up to 64 at once by default, using the same threads as Default."},{"term":"limitedParallelism view","plain":"A dispatcher in front of another one that lets at most n of its tasks run at the same time. It owns no threads."},{"term":"withContext","plain":"Runs a block with a changed context (often another dispatcher) and returns its result to the caller."},{"term":"Coroutine context","plain":"The immutable set of elements a coroutine carries: job, dispatcher, name, exception handler, your own elements."},{"term":"Context element","plain":"One entry in a context, found by its key, usually the class's companion object."}],"remote":true},"co-05":{"id":"co-05","track":"co","n":5,"title":"Cancellation and timeouts","ready":false},"co-06":{"id":"co-06","track":"co","n":6,"title":"Exceptions: launch vs async, SupervisorJob, handlers","ready":false},"co-07":{"id":"co-07","track":"co","n":7,"title":"Flow basics: cold streams and operators","ready":false},"co-08":{"id":"co-08","track":"co","n":8,"title":"StateFlow, SharedFlow and hot streams","ready":false},"co-09":{"id":"co-09","track":"co","n":9,"title":"Channels, select and pipelines","ready":false},"co-10":{"id":"co-10","track":"co","n":10,"title":"Shared state and testing coroutines","ready":false},"co-11":{"id":"co-11","track":"co","n":11,"title":"Coroutines meet Java: futures, Reactor, virtual threads","ready":false},"pat-01":{"id":"pat-01","track":"pat","n":1,"title":"Patterns in a modern language, and Singleton","ready":true,"minutes":35,"goal":"By the end you can say what a design pattern is and which ones modern Java and Kotlin absorbed, pick the right singleton form in each language, and prove a lazy instance is built once under contention.","quiz":[{"q":"A Kotlin class has <code>val pool by lazy(LazyThreadSafetyMode.PUBLICATION) { HikariDataSource(config) }<\/code>. What can go wrong when traffic starts?","options":["Nothing, because the property is lazy","Several threads can each open a pool; one is kept and the others are never closed","Threads can see a half-built pool","The first caller deadlocks"],"answer":1,"why":"<code>PUBLICATION<\/code> lets every racing thread run the initializer and keeps the first stored result. A pool opens connections when it is built, so the discarded pools leak them. Drop the mode argument: the default <code>SYNCHRONIZED<\/code> runs the initializer once. A half-built value is not the risk here; the store itself is safe, only the side effects repeat.","from":null},{"q":"You need a stateless, process-wide ID formatter in Java, and it's fine to build it at startup. Which form is simplest and still correct?","options":["An <code>enum<\/code> with one constant, <code>INSTANCE<\/code>","Double-checked locking on a <code>volatile<\/code> static field","A static field set inside <code>getInstance()<\/code> behind <code>if (instance == null)<\/code>","A <code>synchronized static getInstance()<\/code> method"],"answer":0,"why":"An enum gives you exactly one instance, created when the class initializes, and serialization or reflection can't make another. DCL is for lazy instance fields and is overkill here. The plain <code>if<\/code> version races, and a <code>synchronized<\/code> getter is correct but takes a lock on every call for no benefit.","from":null},{"q":"Java code calls a Kotlin factory declared as <code>class Money { companion object { fun of(minor: Long) = Money() } }<\/code>. What does the Java caller write?","options":["<code>Money.of(100)<\/code>","<code>Money.INSTANCE.of(100)<\/code>","<code>Money.Companion.of(100)<\/code>","<code>new Money().of(100)<\/code>"],"answer":2,"why":"Companion members are instance members of the companion object, which Java sees as a static field called <code>Companion<\/code>. Mark <code>of<\/code> with <code>@JvmStatic<\/code> if you want <code>Money.of(100)<\/code> to work from Java. <code>INSTANCE<\/code> is the field for an <code>object<\/code> declaration, not for a companion.","from":null},{"q":"A test passes alone and fails in the full suite. The class under test reads <code>MetricsRegistry.INSTANCE.count(\"declines\")<\/code>. What is the likely cause and fix?","options":["JUnit runs tests in parallel, so add <code>synchronized<\/code>","The enum gets created twice, so switch to the holder idiom","The JIT caches the count, so make the field <code>volatile<\/code>","The singleton keeps counts from earlier tests, so inject the registry and give each test its own"],"answer":3,"why":"A global singleton lives as long as the JVM, so one test's counts leak into the next and the result depends on order. Passing the registry through the constructor lets each test build a fresh one. An enum is never created twice, and visibility is not the problem when the tests run on one thread.","from":null},{"q":"From <em>Lazy init done right<\/em> in the memory model track: in double-checked locking, what goes wrong if the <code>instance<\/code> field is not <code>volatile<\/code>?","options":["Two instances can be created","The <code>synchronized<\/code> block can deadlock","Another thread can see a non-null reference to an object whose fields it can't see yet","Nothing on x86, so it is safe in practice"],"answer":2,"why":"The re-check under the lock still prevents a second instance. The problem is the fast path, which reads the field without a lock. Without <code>volatile<\/code> there is no happens-before edge from the constructor's writes to that read, so a thread can see the reference before the fields. The JIT may reorder those writes on any CPU, x86 included, and the memory model allows it.","from":"jmm-05"}],"cards":[{"front":"What is a design pattern, in one sentence?","back":"<p>A name for a recurring design: the problem, the shape of the solution and its trade-offs. Vocabulary, not a class template.<\/p>"},{"front":"Which Java singleton form does Effective Java call the preferred approach?","back":"<p>A single-element <code>enum<\/code>: <code>enum IdGenerator { INSTANCE; ... }<\/code>. The JVM guarantees one instance, even across serialization and reflection.<\/p>"},{"front":"Why is the holder idiom lazy and thread-safe without a lock in your code?","back":"<p>The JVM initializes the nested <code>Holder<\/code> class on the first read of <code>Holder.INSTANCE<\/code>, exactly once, under its own class-initialization lock.<\/p>"},{"front":"When do you need double-checked locking instead of the holder idiom?","back":"<p>When the lazy value is an instance field (one per object, such as a per-merchant cache). The holder idiom only works for statics.<\/p>"},{"front":"<code>by lazy(LazyThreadSafetyMode.PUBLICATION) { init() }<\/code>: how many times can <code>init()<\/code> run?","back":"<p>Once per racing thread. The first stored value wins and every caller sees it, but the side effects repeat.<\/p>"},{"front":"Are Kotlin companion object members static on the JVM?","back":"<p>No. They are instance members of the companion (<code>Money.Companion.of()<\/code> from Java) unless you mark them <code>@JvmStatic<\/code>.<\/p>"},{"front":"Why does an injected bean usually beat <code>getInstance()<\/code>?","back":"<p>The dependency shows in the constructor, a test can pass a fake, and no global state leaks between tests. The container still makes only one.<\/p>"}],"terms":[{"term":"Design pattern","plain":"A named, reusable shape for solving a design problem that keeps coming back."},{"term":"Singleton","plain":"A class with exactly one instance and one way to get it."},{"term":"Holder idiom","plain":"A nested static class whose static field holds the instance. The JVM creates it once, on first access."},{"term":"Double-checked locking","plain":"Read a volatile field without a lock, and only lock (and check again) when it is still null."},{"term":"Object declaration","plain":"Kotlin's built-in singleton: a class and its one instance, created thread-safely on first access."},{"term":"Lazy thread-safety mode","plain":"How <code>by lazy<\/code> handles racing first reads: SYNCHRONIZED runs once, PUBLICATION may run many times, NONE promises nothing."}],"remote":true},"pat-02":{"id":"pat-02","track":"pat","n":2,"title":"Factory Method and Abstract Factory","ready":true,"minutes":35,"goal":"By the end you can replace constructor calls with named static or companion factories that validate and return sealed results, pass factories around as functions, and group matching products behind an abstract factory.","quiz":[{"q":"Which of these can a static factory do that a constructor can never do?","options":["Return an instance of a subtype chosen from its arguments","Validate its arguments","Be called from another package","Throw a checked exception"],"answer":0,"why":"Constructors can validate, be public and throw checked exceptions too. Only a factory can return a cached object or a different class, like <code>List.of<\/code> returning <code>List12<\/code> or <code>ListN<\/code> depending on how many elements you pass.","from":null},{"q":"A factory has <code>switch (provider) { case ADYEN -&gt; ...; case STRIPE -&gt; ...; default -&gt; new FakeGateway(); }<\/code>. A teammate adds <code>KLARNA<\/code> to the enum. What happens?","options":["A compile error in the factory","A <code>MatchException<\/code> at runtime","Klarna payments silently go to the fake gateway","The switch throws <code>NullPointerException<\/code>"],"answer":2,"why":"The <code>default<\/code> branch catches every new constant, so the build stays green and Klarna gets the fake gateway. Without <code>default<\/code>, a switch expression over an enum must cover every constant, and adding <code>KLARNA<\/code> would be a compile error at exactly this line.","from":null},{"q":"Which Kotlin shape lets callers write <code>Fee(290)<\/code> while you return a cached instance?","options":["A secondary constructor","<code>operator fun invoke<\/code> in the companion object","An <code>init<\/code> block","A <code>data class<\/code> with a default argument"],"answer":1,"why":"A constructor always makes a new object, whether primary or secondary. <code>operator fun invoke(bps: Int): Fee<\/code> on the companion turns <code>Fee(290)<\/code> into a function call that can return anything, including a cached instance. Readers expect a new object from that syntax, so use it with care.","from":null},{"q":"You have <code>interface MessagingFactory { Publisher publisher(); Subscriber subscriber(); }<\/code> with a Kafka family and an in-memory family. Now you need a <code>DeadLetterQueue<\/code> product too. What does that cost?","options":["Nothing: add one new class","Only the Kafka family changes","You have to switch to Factory Method","The interface and every existing family change"],"answer":3,"why":"Abstract Factory makes new families cheap and new products expensive: every family must now produce a dead-letter queue, including the in-memory one used in tests. Weigh that before you add a product to the interface.","from":null},{"q":"From lesson 1 of this track: a Kotlin <code>companion object<\/code> holds a factory <code>of(...)<\/code> and <code>val cache = loadCache()<\/code>. When does <code>loadCache()<\/code> run?","options":["When the outer class is loaded, like a Java static initializer","Lazily, the first time <code>cache<\/code> is read, under a lock","Every time <code>of<\/code> is called","At application startup, for every class on the classpath"],"answer":0,"why":"A companion object is initialized when its outer class is loaded, which matches a Java static initializer, so <code>loadCache()<\/code> runs then even if nobody reads <code>cache<\/code>. If you want it on first read, write <code>val cache by lazy { loadCache() }<\/code>.","from":"pat-01"}],"cards":[{"front":"Name two things a static factory can do that a constructor can't.","back":"<p>Return a cached instance, and return a subtype chosen from its arguments (<code>List.of<\/code> gives <code>List12<\/code> or <code>ListN<\/code>). It also has a name.<\/p>"},{"front":"Why leave out <code>default<\/code> in a factory's switch over a sealed type or enum?","back":"<p>So adding a new case is a compile error at the factory. With <code>default<\/code>, the new case silently takes the default branch.<\/p>"},{"front":"What replaced the GoF Factory Method's creator subclass in modern Java?","back":"<p>A function: a <code>Supplier&lt;PaymentGateway&gt;<\/code>, usually written as a constructor reference such as <code>AdyenGateway::new<\/code>.<\/p>"},{"front":"Kotlin has no <code>static<\/code>. Where does a class's named factory usually live?","back":"<p>In its <code>companion object<\/code>: <code>companion object { fun parse(raw: String): CardResult }<\/code>.<\/p>"},{"front":"What name may a Kotlin factory function have, by the coding conventions?","back":"<p>The same name as the abstract type it returns, like <code>fun Job(): Job<\/code> or <code>MutableStateFlow(0)<\/code>.<\/p>"},{"front":"When should a factory return a sealed result instead of throwing?","back":"<p>When the failure is an outcome the caller is expected to handle, like a mistyped card number. Keep exceptions for bugs and broken infrastructure.<\/p>"},{"front":"Abstract Factory: what is cheap to add, and what is expensive?","back":"<p>A new family is cheap (one implementation). A new product is expensive (the interface and every family change).<\/p>"}],"terms":[{"term":"Static factory method","plain":"A static method that returns an instance, used instead of a public constructor."},{"term":"Factory Method (GoF)","plain":"A creation hook that lets something other than the caller pick the concrete class. Now often a <code>Supplier&lt;T&gt;<\/code> or <code>() -&gt; T<\/code>."},{"term":"Abstract Factory","plain":"An interface that creates a whole family of matching objects, with one implementation per family."},{"term":"Product family","plain":"Objects that must be used together, such as one network's authorizer and refunder."},{"term":"Sealed result","plain":"A sealed set of outcomes (<code>Valid<\/code>, <code>Invalid<\/code>) returned instead of throwing. A <code>switch<\/code> or <code>when<\/code> must handle every case."},{"term":"Companion object","plain":"A Kotlin object tied to a class, and the usual home for that class's factories."}],"remote":true},"pat-03":{"id":"pat-03","track":"pat","n":3,"title":"Builder and Prototype","ready":true,"minutes":38,"goal":"By the end you can choose between named arguments, a Java record plus builder, and a Kotlin DSL builder, and make copies of templates that never share mutable state with the original.","quiz":[{"q":"<code>data class Fee(val bps: Int) { init { require(bps in 0..1_000) } }<\/code>. What does <code>Fee(290).copy(bps = 5_000)<\/code> do?","options":["Returns <code>Fee(5000)<\/code>, because <code>copy()<\/code> skips <code>init<\/code>","Throws <code>IllegalArgumentException<\/code>, because <code>copy()<\/code> runs <code>init<\/code>","Doesn't compile","Returns <code>Fee(290)<\/code> unchanged"],"answer":1,"why":"<code>copy()<\/code> calls the primary constructor with the new values, so every <code>init<\/code> block runs again and <code>require<\/code> throws. That's why <code>init<\/code> is the safest place for a data class's rules. What <code>copy()<\/code> does skip is a validating factory, when the constructor is private.","from":null},{"q":"A Java team will call your Kotlin <code>ChargeRequest(amountMinor, currency, token, descriptor = null, capture = true, maxRetries = 0)<\/code> constructor from many places. What helps them most?","options":["Nothing; Java 21 supports named arguments","Mark the class <code>data<\/code>","Put <code>@JvmStatic<\/code> on the constructor","Add <code>@JvmOverloads<\/code>, or give them a builder"],"answer":3,"why":"Java has no named or default arguments, so it sees one six-parameter constructor. <code>@JvmOverloads<\/code> generates overloads that drop trailing defaults, and a builder lets them set any subset by name. <code>@JvmStatic<\/code> applies to companion members, not constructors, and <code>data<\/code> changes nothing for Java callers here.","from":null},{"q":"A DSL has no <code>@DslMarker<\/code>. Inside <code>lineItems { }<\/code>, someone writes <code>currency = \"USD\"<\/code>. <code>LineItemsBuilder<\/code> has no <code>currency<\/code>, but the outer <code>PaymentRequestBuilder<\/code> does. What happens?","options":["It sets the outer builder's <code>currency<\/code>","Compile error: unresolved reference","A runtime exception","It declares a local variable"],"answer":0,"why":"Both receivers are in scope inside the inner lambda, so the compiler resolves <code>currency<\/code> on the outer builder and sets it. Nothing fails. With <code>@DslMarker<\/code> on both builders, that line becomes a compile error unless you write <code>this@paymentRequest.currency<\/code>.","from":null},{"q":"<code>record Cart(String id, List&lt;String&gt; skus) {}<\/code>. <code>c1<\/code> was built with <code>new ArrayList&lt;&gt;(List.of(\"a\"))<\/code>. Then <code>Cart c2 = new Cart(\"c2\", c1.skus()); c2.skus().add(\"b\");<\/code>. What happens?","options":["<code>c1<\/code> is unchanged, because records are immutable","The <code>add<\/code> throws <code>UnsupportedOperationException<\/code>","<code>c1.skus()<\/code> now contains <code>b<\/code> too","It doesn't compile"],"answer":2,"why":"Records are only shallowly immutable: the field can't point elsewhere, but the <code>ArrayList<\/code> it points to can change, and <code>c2<\/code> shares it. A compact constructor with <code>skus = List.copyOf(skus);<\/code> would give each record its own unmodifiable list, and the <code>add<\/code> would then throw.","from":null},{"q":"From <em>Factory Method and Abstract Factory<\/em>: you hide a data class's constructor (<code>data class Email private constructor(val value: String)<\/code>) and offer a validating <code>Email.of(raw)<\/code>. In Kotlin 2.4, which line still creates an unvalidated <code>Email<\/code>?","options":["<code>Email(\"x\")<\/code> in another file","<code>Email.of(\"a@b.example\").copy(value = \"x\")<\/code>","<code>Email.of(\"x\")<\/code>","None: a private constructor covers every path"],"answer":1,"why":"The generated <code>copy()<\/code> stays public even when the constructor is private; Kotlin 2.4 only warns about it. So <code>copy<\/code> creates an <code>Email<\/code> your factory never saw. <code>@ConsistentCopyVisibility<\/code> makes <code>copy()<\/code> private, and an <code>init<\/code> check would run on <code>copy()<\/code> too. A direct constructor call from outside does not compile.","from":"pat-02"}],"cards":[{"front":"Does a Kotlin data class's <code>init<\/code> block run on <code>copy()<\/code>?","back":"<p>Yes. <code>copy()<\/code> calls the primary constructor, so <code>require<\/code> checks in <code>init<\/code> run again.<\/p>"},{"front":"What is a lambda with receiver?","back":"<p>A function type like <code>Builder.() -&gt; Unit<\/code>. Inside the lambda, <code>this<\/code> is the Builder, so you call its members without a prefix.<\/p>"},{"front":"What does <code>@DslMarker<\/code> prevent?","back":"<p>Calling a member of an outer DSL receiver implicitly from inside an inner block. Reaching it then needs an explicit <code>this@label<\/code>.<\/p>"},{"front":"Why is <code>Cloneable<\/code> considered broken?","back":"<p>It declares no <code>clone<\/code> method, and <code>Object.clone()<\/code> is protected, shallow and throws a checked exception. Use copy constructors or withers.<\/p>"},{"front":"Is a Kotlin data class <code>copy()<\/code> deep or shallow?","back":"<p>Shallow. A property that holds a mutable object, such as a <code>MutableList<\/code>, is shared by the original and the copy.<\/p>"},{"front":"Where does validation go for a Java record that has a builder?","back":"<p>In the record's compact constructor, so <code>build()<\/code>, withers and direct <code>new<\/code> calls all run it.<\/p>"},{"front":"<code>data class Email private constructor(...)<\/code>: is its <code>copy()<\/code> private in Kotlin 2.4?","back":"<p>No. It stays public, with a warning. Add <code>@ConsistentCopyVisibility<\/code> to make it private.<\/p>"}],"terms":[{"term":"Telescoping constructor","plain":"A chain of constructors, each adding one more optional parameter."},{"term":"Builder","plain":"A helper that collects values step by step and makes the finished object in <code>build()<\/code>."},{"term":"Lambda with receiver","plain":"A lambda whose <code>this<\/code> is a given object, written <code>T.() -&gt; R<\/code>."},{"term":"DslMarker","plain":"A meta-annotation for DSL marker annotations that limits implicit calls to the nearest receiver."},{"term":"Prototype","plain":"Making a new object by copying an existing one and changing a few fields."},{"term":"Wither","plain":"A method like <code>withTimeout(t)<\/code> that returns a copy with one field changed."},{"term":"Shallow copy","plain":"A copy that shares the objects its fields point to, instead of copying them too."}],"remote":true},"pat-04":{"id":"pat-04","track":"pat","n":4,"title":"Adapter and Facade","ready":true,"minutes":36,"goal":"By the end you can wrap a vendor SDK in an adapter that keeps its types, codes and exceptions to itself, use Kotlin extension functions for light data adapters, and put a multi-step checkout behind a facade that owns the order and the failure rules.","quiz":[{"q":"Your issuer adapter catches <code>SdkException<\/code> and rethrows it wrapped in a <code>RuntimeException<\/code>. The checkout service catches that and checks <code>getCause() instanceof SdkException<\/code> to decide whether to retry. What's wrong?","options":["Nothing, since the exception is unchecked now","The vendor type still leaks: the service depends on the SDK, so switching issuers breaks it","A <code>RuntimeException<\/code> can't wrap a checked exception","Retry decisions belong inside the vendor SDK"],"answer":1,"why":"Wrapping changed the exception's type, not who depends on it. The service still imports <code>SdkException<\/code>, so it's coupled to this vendor. Translate inside the adapter into your own result (<code>Unavailable<\/code>) or your own exception type that says retryable or not. A <code>RuntimeException<\/code> can wrap anything, so that option is simply false.","from":null},{"q":"Which statement about an adapter written in Kotlin is true?","options":["A vendor <code>IOException<\/code> thrown inside it can pass through your port without any compile error","The compiler forces you to catch the vendor's checked exceptions","Extension functions can implement your port interface","<code>fun interface<\/code> ports can't be implemented with a lambda"],"answer":0,"why":"Kotlin has no checked exceptions, so nothing stops the vendor's <code>IOException<\/code> from reaching callers of your port. Java would refuse to compile the same adapter. Extensions can't implement interfaces, and a <code>fun interface<\/code> exists precisely so a lambda can implement it.","from":null},{"q":"Three call sites (a REST resource, a Kafka consumer and an admin tool) each reserve stock, charge the card, post to the ledger and send an email, each with slightly different failure handling. Which pattern fits?","options":["Adapter","Decorator","Facade","Singleton"],"answer":2,"why":"A facade puts the sequence and its failure rules in one place, and each caller makes one call. An adapter changes one object's interface, a decorator adds behavior behind the same interface, and a singleton is about instance count, not about orchestrating steps.","from":null},{"q":"Which is the best use of a Kotlin extension function as an adapter?","options":["<code>fun LegacyIssuerSdk.authorize(...)<\/code>, which callers use instead of a <code>CardAuthorizer<\/code> port","A global <code>fun Any.toJson()<\/code> in a shared utils file","An extension that caches vendor results in a top-level map","<code>fun VendorTxn.toReceipt(): Receipt<\/code>, kept in the issuer-adapter package"],"answer":3,"why":"Mapping a vendor DTO to your own type is pure data translation, which is what extensions are good at, and keeping it in the adapter package keeps the vendor model contained. An extension on the SDK makes callers depend on the SDK and can't be swapped in a test. A global utils extension spreads everywhere, and caching in a top-level map is hidden shared state.","from":null},{"q":"From <em>Factory Method and Abstract Factory<\/em>: you now have one <code>IssuerSdkAdapter<\/code> for Visa's SDK and one for Mastercard's. Where should the choice between them live?","options":["In each REST resource, with an <code>if<\/code> on the card's BIN","In one factory, a <code>switch<\/code> or <code>when<\/code> over the network with no default, injected into the facade","Inside the facade's <code>checkout<\/code>, as string checks on the PAN","In the adapters: each checks whether the card belongs to it"],"answer":1,"why":"Choosing which product to build is a factory's job: one exhaustive <code>switch<\/code> or <code>when<\/code> over a sealed or enum network, so adding a network is a compile error in one place. Spreading BIN checks over resources or the facade copies the rule, and adapters checking ownership turns every call into a guessing game.","from":"pat-02"}],"cards":[{"front":"What does an adapter do?","back":"<p>Makes an object you can't change fit the interface (port) your code expects, translating arguments, results and errors.<\/p>"},{"front":"What is a leaky adapter?","back":"<p>One that lets the vendor's types, codes or exceptions (an <code>SdkException<\/code>, response code \"51\") reach your service code.<\/p>"},{"front":"A Kotlin adapter calls a method that throws <code>IOException<\/code> and has no catch. Does it compile?","back":"<p>Yes. Kotlin has no checked exceptions, so the vendor's <code>IOException<\/code> passes through your port silently. Java would refuse.<\/p>"},{"front":"What does a Kotlin extension function compile to?","back":"<p>A static method whose first parameter is the receiver. <code>txn.toReceipt()<\/code> is <code>toReceipt(txn)<\/code> in bytecode.<\/p>"},{"front":"What does a facade own?","back":"<p>The order of the steps in a multi-step job, and what a failure at each step means. Not maths, vendor codes or SQL.<\/p>"},{"front":"Can a Java record component be named <code>notify<\/code>?","back":"<p>No: \"illegal record component name\". Its accessor would clash with <code>Object.notify()<\/code>. The same goes for <code>wait<\/code>, <code>hashCode<\/code>, <code>toString<\/code> and the other no-arg <code>Object<\/code> methods.<\/p>"},{"front":"Adapter vs Facade, one line each?","back":"<p>Adapter: one object, given a different interface (yours). Facade: several objects behind one new, simpler interface.<\/p>"}],"terms":[{"term":"Adapter","plain":"A wrapper that makes an existing object fit the interface your code expects."},{"term":"Port","plain":"An interface in your own words that your core code depends on, such as <code>CardAuthorizer<\/code>."},{"term":"Anti-corruption layer","plain":"The adapters where a vendor's model is translated into yours, so it never spreads into your code."},{"term":"Facade","plain":"One simple entry point that runs a multi-step job across several subsystems."},{"term":"Extension function","plain":"A Kotlin function called like a method on a type it doesn't belong to; a static method underneath."},{"term":"Hexagonal architecture","plain":"Core logic talks only to ports, and adapters on the edge connect each port to one technology."}],"remote":true},"pat-05":{"id":"pat-05","track":"pat","n":5,"title":"Decorator and Proxy","ready":true,"minutes":37,"goal":"By the end you can stack decorators and predict what their order does, use Kotlin <code>by<\/code> without falling into its forwarding trap, write a dynamic proxy that unwraps exceptions, and explain why a Spring <code>@Transactional<\/code> method called from the same bean runs without a transaction.","quiz":[{"q":"<code>FeeCalculator.percent(290).plusFixed(30).cappedAt(500).crossBorder(\"DE\", 100)<\/code> prices a 1,
