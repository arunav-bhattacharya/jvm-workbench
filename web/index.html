span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">Thread<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Thread<\/span><span class=\"p\">(<\/span><span class=\"n\">job<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">t<\/span><span class=\"p\">.<\/span><span class=\"na\">start<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">t<\/span><span class=\"p\">.<\/span><span class=\"na\">join<\/span><span class=\"p\">();<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>","options":["Nothing. It runs the jobs in parallel","It runs the jobs one at a time, because each join waits before the next thread starts","It deadlocks on the second job","<code>join()<\/code> must be called before <code>start()<\/code>"],"answer":1,"why":"Each <code>join()<\/code> blocks until that thread ends, so the next thread starts only after the previous one is done. You pay for threads and get sequential execution. Start all threads in one loop, then join them in a second loop.","from":null},{"q":"A Kafka consumer service handles 12 partitions with 12 threads on a 2-core pod. Each record waits about 50 ms on Oracle. Which statement is true?","options":["It is concurrent: 12 records are in progress, at most 2 threads run at any instant, and most are waiting anyway","It is parallel: all 12 threads run at the same instant","It cannot work, because threads must not outnumber cores","It is neither concurrent nor parallel"],"answer":0,"why":"Twelve tasks in progress at once is concurrency. With 2 cores, at most 2 threads run at the same instant, which is the parallel part. Because each thread spends most of its time waiting on the database, 12 threads on 2 cores is a sensible setup. The rule of one thread per core is for CPU-bound work.","from":null}],"cards":[{"front":"What do threads in one process share, and what does each thread have of its own?","back":"<p>They share the heap: objects and static fields. Each thread has its own stack: local variables, parameters and the calls in progress.<\/p>"},{"front":"What happens if you call <code>t.run()<\/code> instead of <code>t.start()<\/code>?","back":"<p>The code runs on the current thread, like any method call. No new thread is created, and nothing warns you.<\/p>"},{"front":"Concurrency vs parallelism, in one line each.","back":"<p>Concurrency: several tasks in progress at the same time (works on one core). Parallelism: several tasks running at the same instant on different cores.<\/p>"},{"front":"When does the JVM exit?","back":"<p>When the last non-daemon thread ends, or when something calls <code>System.exit<\/code>. Returning from <code>main<\/code> ends only the main thread.<\/p>"},{"front":"How much stack does the JVM reserve for a platform thread on 64-bit Linux by default?","back":"<p>1 MB (<code>ThreadStackSize = 1024<\/code> KB). It is reserved address space, committed as the stack grows. Change it with <code>-Xss<\/code>.<\/p>"},{"front":"What happens when you call <code>start()<\/code> twice on the same Thread?","back":"<p>The second call throws <code>IllegalThreadStateException<\/code>. A thread runs at most once.<\/p>"},{"front":"A worker thread throws an uncaught exception. Who finds out?","back":"<p>Only that thread dies. The default handler prints the stack trace to standard error. The starting thread is not told.<\/p>"}],"terms":[{"term":"Process","plain":"A running program with its own memory, such as one JVM."},{"term":"Thread","plain":"One path of execution inside a process, with its own stack, sharing the process heap."},{"term":"Heap","plain":"The memory where objects and static fields live. Every thread can reach it."},{"term":"Core","plain":"A piece of the CPU that runs one thread at a time."},{"term":"Context switch","plain":"The OS pausing one thread and resuming another on the same core."},{"term":"Concurrency","plain":"Several tasks in progress at once, taking turns or not."},{"term":"Parallelism","plain":"Several tasks running at the same instant on different cores."},{"term":"Platform thread","plain":"A Java thread backed one-to-one by an operating system thread."}],"remote":true},"conc-02":{"id":"conc-02","track":"conc","n":2,"title":"A thread's life: start, join, sleep, interrupt","ready":true,"minutes":35,"goal":"By the end you can read a thread's state, wait for a thread with <code>join()<\/code> instead of <code>sleep()<\/code>, and write a worker that stops cleanly when interrupted without losing the interrupt.","quiz":[{"q":"A thread is stuck inside <code>ReentrantLock.lock()<\/code>, waiting for another thread to release it. What does <code>getState()<\/code> return?","options":["BLOCKED","WAITING","RUNNABLE","TIMED_WAITING"],"answer":1,"why":"<code>ReentrantLock<\/code> makes waiting threads park with <code>LockSupport.park()<\/code>, and a parked thread is WAITING. BLOCKED is reserved for threads trying to enter a <code>synchronized<\/code> block or method. That difference matters when you scan a thread dump for contention.","from":null},{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"n\">Thread<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Thread<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">Thread<\/span><span class=\"p\">.<\/span><span class=\"na\">sleep<\/span><span class=\"p\">(<\/span><span class=\"mi\">5_000<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">catch<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">InterruptedException<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"n\">Thread<\/span><span class=\"p\">.<\/span><span class=\"na\">currentThread<\/span><span class=\"p\">().<\/span><span class=\"na\">isInterrupted<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">});<\/span>\n<span class=\"n\">t<\/span><span class=\"p\">.<\/span><span class=\"na\">start<\/span><span class=\"p\">();<\/span>\n<span class=\"n\">t<\/span><span class=\"p\">.<\/span><span class=\"na\">interrupt<\/span><span class=\"p\">();<\/span>\n<\/code><\/pre>","options":["true","Nothing: the thread sleeps for 5 s and ends","false","It depends on whether interrupt() runs before sleep() starts"],"answer":2,"why":"If the interrupt arrives during the sleep, <code>sleep<\/code> throws and clears the flag. If it arrives before the sleep starts, <code>sleep<\/code> sees the flag, clears it and throws at once. Either way the catch block sees <code>false<\/code>. Timing changes when the exception comes, not what the flag says.","from":null},{"q":"A Kafka consumer loop wraps its back-off in <code>try { Thread.sleep(500); } catch (InterruptedException e) { log.warn(\"interrupted\"); }<\/code> and keeps looping. What goes wrong at shutdown?","options":["Nothing, because the exception was logged","The consumer stops, but its last batch is processed twice","The JVM throws IllegalMonitorStateException","<code>shutdownNow()<\/code> interrupts it, the catch clears the request, and the loop keeps running until the process is killed"],"answer":3,"why":"<code>shutdownNow()<\/code> stops tasks by interrupting them. The <code>InterruptedException<\/code> cleared the flag, and the catch block didn't restore it, so the loop never learns it should stop. Logging doesn't count as handling. Restore the flag and leave the loop.","from":null},{"q":"A daemon thread writes audit lines to a file and closes the file in a <code>finally<\/code> block. The last non-daemon thread ends. What happens to the daemon thread?","options":["The JVM waits for it to finish the current line","The JVM exits, the daemon stops where it is, and its finally block does not run","The JVM interrupts it and waits for the finally block","It becomes a non-daemon thread and keeps the JVM alive"],"answer":1,"why":"The JVM does not wait for daemon threads and does not unwind their stacks when it exits, so <code>finally<\/code> blocks don't run. Audit output can be lost or truncated. Work that must complete belongs on a non-daemon thread that you stop with an interrupt and join.","from":null},{"q":"From Threads from zero: a loop starts each thread and joins it in the same iteration, <code>t.start(); t.join();<\/code>, for four threads. While the loop runs, how many of those four threads are alive at the same time?","options":["At most one","All four","Two: the current one and the next","None, because join() stops them"],"answer":0,"why":"Each <code>join()<\/code> blocks the loop until that thread is TERMINATED, and only then does the next iteration start a new thread. So at most one of the four is ever alive. The fix is to start all four first and join them in a second loop.","from":"conc-01"}],"cards":[{"front":"A thread waits to enter a <code>synchronized<\/code> block another thread holds. What state is it in?","back":"<p>BLOCKED.<\/p>"},{"front":"A thread waits in <code>ReentrantLock.lock()<\/code>. What state is it in?","back":"<p>WAITING (or TIMED_WAITING for a timed tryLock). Explicit locks park the thread; BLOCKED is only for monitors.<\/p>"},{"front":"Besides waiting, what does <code>t.join()<\/code> guarantee?","back":"<p>Everything <code>t<\/code> wrote before it ended is visible to the thread whose <code>join()<\/code> returned. <code>sleep()<\/code> gives no such guarantee.<\/p>"},{"front":"What happens to the interrupt flag when <code>sleep()<\/code> throws <code>InterruptedException<\/code>?","back":"<p>It is cleared before the exception is thrown. Inside the catch block, <code>isInterrupted()<\/code> returns false.<\/p>"},{"front":"What are the two correct ways to handle a caught <code>InterruptedException<\/code>?","back":"<p>Rethrow it (declare <code>throws InterruptedException<\/code>), or restore the flag with <code>Thread.currentThread().interrupt()<\/code> and stop what you're doing.<\/p>"},{"front":"<code>isInterrupted()<\/code> vs <code>Thread.interrupted()<\/code>?","back":"<p><code>isInterrupted()<\/code> only reads the flag. The static <code>Thread.interrupted()<\/code> reads it and clears it.<\/p>"},{"front":"What is the status of <code>Thread.stop()<\/code> on JDK 26?","back":"<p>Removed. It always threw <code>UnsupportedOperationException<\/code> from JDK 20, and old binaries that call it get <code>NoSuchMethodError<\/code> on 26+.<\/p>"}],"terms":[{"term":"Thread state","plain":"What a thread is doing right now, one of the six values of <code>Thread.State<\/code>."},{"term":"join","plain":"Wait for a thread to end. Afterwards you see everything it wrote."},{"term":"Interrupt flag","plain":"A per-thread boolean that <code>interrupt()<\/code> sets to ask the thread to stop."},{"term":"InterruptedException","plain":"Thrown by blocking calls when the thread is interrupted. The flag is cleared when it is thrown."},{"term":"Daemon thread","plain":"A thread the JVM does not wait for at exit. It can stop mid-work."},{"term":"Cooperative cancellation","plain":"Stopping a thread by asking it, and letting it check and clean up itself."}],"remote":true},"conc-03":{"id":"conc-03","track":"conc","n":3,"title":"Race conditions: why count++ lies","ready":true,"minutes":35,"goal":"By the end you can spot the two shapes of race condition (read-modify-write and check-then-act) in real code, and fix each with one atomic step.","quiz":[{"q":"Two request threads run <code>account.balance = account.balance - amount;<\/code> on the same account at the same time. What can go wrong?","options":["Nothing, because one Java statement runs atomically","One of the two debits can be lost, because both read the same starting balance","The JVM throws an IllegalStateException","The balance always goes negative"],"answer":1,"why":"It's read-modify-write. If both threads read 100 and debit 10, both write 90. One debit vanished. Java statements are not atomic just because they fit on one line.","from":null},{"q":"<code>counts<\/code> is a <code>ConcurrentHashMap&lt;String, Integer&gt;<\/code>. Many threads run <code>counts.put(k, counts.getOrDefault(k, 0) + 1)<\/code>. What is the smallest correct fix?","options":["Make the map field <code>volatile<\/code>","Wrap the map with <code>Collections.synchronizedMap<\/code>","Use <code>counts.merge(k, 1, Integer::sum)<\/code>","Switch to a <code>HashMap<\/code>"],"answer":2,"why":"<code>merge<\/code> reads, computes and writes in one atomic operation on that key. <code>volatile<\/code> on the field only affects the reference to the map, and a synchronized wrapper still makes each call atomic on its own, leaving the gap between <code>get<\/code> and <code>put<\/code>.","from":null},{"q":"A test runs 2 threads that each call <code>hit()<\/code> 1,000 times, and checks the total is 2,000. It passed 100 runs in a row. What does that tell you?","options":["The counter is thread-safe","Very little: the threads probably never overlapped","The JIT fixed the race","The test should use 1 thread instead"],"answer":1,"why":"A thread can finish 1,000 increments before the second thread starts. With no overlap, a racy counter gives the right answer. Use more threads, more iterations and a start latch so they run at the same time.","from":null},{"q":"A cache does <code>if (cache.get(id) == null) cache.put(id, loadFromDb(id));<\/code> on a <code>ConcurrentHashMap<\/code>. Two threads ask for the same missing <code>id<\/code> together. What happens?","options":["Both may call <code>loadFromDb<\/code>, and the second <code>put<\/code> replaces the first value","The second thread blocks until the first one finishes","The map throws ConcurrentModificationException","Only one thread can call <code>get<\/code> at a time, so it is safe"],"answer":0,"why":"It's check-then-act. Both see <code>null<\/code>, both load, both put. You pay for two database calls and callers may hold different objects. <code>computeIfAbsent(id, this::loadFromDb)<\/code> runs the loader at most once per key.","from":null},{"q":"From the last lesson: <code>main<\/code> starts thread <code>t<\/code>, which sets <code>result = 42<\/code>. When can <code>main<\/code> safely read <code>result<\/code>?","options":["Right after <code>t.start()<\/code> returns","After <code>t.join()<\/code> returns","After <code>Thread.sleep(100)<\/code>","Any time, because <code>int<\/code> writes are atomic"],"answer":1,"why":"<code>join<\/code> waits for <code>t<\/code> to finish, and everything <code>t<\/code> wrote before it ended is visible to the thread whose <code>join<\/code> returned. <code>sleep<\/code> only makes it likely, not guaranteed. An atomic write still says nothing about when another thread sees it.","from":"conc-02"}],"cards":[{"front":"What is a race condition?","back":"<p>A bug where the result depends on the timing or interleaving of threads. It usually gives wrong results silently, not an exception.<\/p>"},{"front":"Why is <code>count++<\/code> not atomic?","back":"<p>It runs as three steps: read <code>count<\/code>, add one, write it back. Another thread can run between them, so two increments can produce one.<\/p>"},{"front":"Name the two shapes of race condition.","back":"<p>Read-modify-write (<code>count++<\/code>, <code>balance -= x<\/code>) and check-then-act (<code>if (!map.containsKey(k)) map.put(k, v)<\/code>).<\/p>"},{"front":"Is <code>if (!chm.containsKey(k)) chm.put(k, v)<\/code> safe on a ConcurrentHashMap?","back":"<p>No. Each call is atomic, but another thread can put between them. Use <code>chm.putIfAbsent(k, v)<\/code>.<\/p>"},{"front":"Atomic fix for <code>map.put(k, map.get(k) + 1)<\/code> on a ConcurrentHashMap?","back":"<p><code>map.merge(k, 1, Integer::sum)<\/code><\/p>"},{"front":"Why does a 2-thread x 1,000-iteration race test usually pass on broken code?","back":"<p>The first thread often finishes before the second starts, so they never overlap. Use a start latch and many iterations.<\/p>"}],"terms":[{"term":"Race condition","plain":"A bug where the result depends on which thread runs when."},{"term":"Lost update","plain":"Two threads read the same old value and both write, so one change disappears."},{"term":"Read-modify-write","plain":"Read a value, compute a new one from it, write it back. Unsafe on shared data unless done atomically."},{"term":"Check-then-act","plain":"Test a condition, then act on it, assuming it still holds. Unsafe if another thread can act in between."},{"term":"Atomic","plain":"Happens as one indivisible step. Other threads see it either not started or fully done."},{"term":"Critical section","plain":"A piece of code that only one thread at a time may run, because it touches shared state."}],"remote":true},"conc-04":{"id":"conc-04","track":"conc","n":4,"title":"synchronized and intrinsic locks","ready":true,"minutes":35,"goal":"By the end you can protect shared state with <code>synchronized<\/code>, choose a safe lock object, and keep slow or foreign code out of your critical sections.","quiz":[{"q":"<p>Which line is the bug?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"kd\">class<\/span> <span class=\"nc\">FeeCounter<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">feesCents<\/span><span class=\"p\">;<\/span><span class=\"w\">                    <\/span><span class=\"c1\">// line 2<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">synchronized<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">add<\/span><span class=\"p\">(<\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">cents<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">        <\/span><span class=\"c1\">// line 3<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">feesCents<\/span><span class=\"w\"> <\/span><span class=\"o\">+=<\/span><span class=\"w\"> <\/span><span class=\"n\">cents<\/span><span class=\"p\">;<\/span><span class=\"w\">                           <\/span><span class=\"c1\">// line 4<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>\n<p>The service creates one <code>FeeCounter<\/code> per Kafka partition.<\/p>","options":["Line 2: static fields cannot be locked","Line 4: <code>+=<\/code> is not allowed inside synchronized","Line 3: it locks <code>this<\/code>, but the state is static, so different instances don't exclude each other","There is no bug, because the method is synchronized"],"answer":2,"why":"Each instance locks its own monitor, while all instances share <code>feesCents<\/code>. Two partitions' counters run <code>+=<\/code> at the same time and lose updates. Static state needs one static lock: <code>private static final Object LOCK<\/code>, or a <code>static synchronized<\/code> method.","from":null},{"q":"A thread inside <code>synchronized void withdraw()<\/code> calls <code>canCover()<\/code>, which is also <code>synchronized<\/code> on the same object. What happens?","options":["It enters at once, because the monitor is reentrant","It deadlocks waiting for itself","It throws IllegalMonitorStateException","It waits until withdraw() returns"],"answer":0,"why":"Java monitors are reentrant. The JVM sees that the current thread already owns the monitor and increments the hold count. Without reentrancy every synchronized method that calls another one on the same object would hang.","from":null},{"q":"Which of these is the safest object to lock on for a class's internal state?","options":["<code>\"ledger-lock\"<\/code>, a string literal","<code>Integer.valueOf(1)<\/code>","<code>this<\/code>, on a public class that callers also hold references to","<code>private final Object lock = new Object()<\/code>"],"answer":3,"why":"A private final object can't be locked by anyone else and can't change. String literals are interned and shared JVM-wide. Small <code>Integer<\/code> values are cached and shared, and javac warns about locking on them. <code>this<\/code> works, but any caller can lock it too and stall your methods.","from":null},{"q":"<code>publish()<\/code> is <code>synchronized<\/code> and calls each listener inside the lock. One listener makes a 2-second HTTP call. What do other threads notice?","options":["Nothing, since each listener runs on its own thread","Every thread that needs the same lock, even just to read a rate, waits up to 2 seconds","The HTTP call is cancelled because of the lock","The JVM detects the slow call and releases the lock"],"answer":1,"why":"Listeners run on the publishing thread, inside its critical section. Anyone who needs that monitor queues behind the HTTP call. Copy the listener list under the lock, release it, then notify.","from":null},{"q":"From Race conditions: why count++ lies: <code>setBalance()<\/code> is <code>synchronized<\/code>, but <code>getBalance()<\/code> is a plain getter with no lock. Is the class thread-safe?","options":["Yes: only writes need a lock","Yes, if the field is a <code>long<\/code>","No: a reader that skips the lock gets no visibility promise and can see a stale value","No, but only on 32-bit JVMs"],"answer":2,"why":"Visibility comes from unlocking and locking the same monitor. A reader that never takes the lock has no happens-before edge to the writer, so it may keep seeing an old balance. Guard reads with the same lock, or use a <code>volatile<\/code> field or an atomic for a single value.","from":"conc-03"}],"cards":[{"front":"What two guarantees does <code>synchronized<\/code> give?","back":"<p>Mutual exclusion (one thread at a time per monitor) and visibility (writes made before releasing a monitor are seen by the next thread that locks it).<\/p>"},{"front":"What does a <code>synchronized<\/code> instance method lock? A <code>static synchronized<\/code> method?","back":"<p>The instance, <code>this<\/code>. The static one locks the class object, for example <code>Ledger.class<\/code>.<\/p>"},{"front":"What does it mean that Java monitors are reentrant?","back":"<p>A thread that already holds a monitor can enter it again without waiting. The JVM counts the holds and frees the monitor when the count is back to zero.<\/p>"},{"front":"Why is <code>synchronized (count)<\/code> on an <code>Integer<\/code> field broken?","back":"<p><code>count++<\/code> replaces the field with a new <code>Integer<\/code>, so threads lock different objects. Small values are also cached and shared JVM-wide. javac warns <code>[synchronization]<\/code>.<\/p>"},{"front":"Why never lock on a string literal?","back":"<p>Literals are interned: every <code>\"lock\"<\/code> in the JVM is the same object, so unrelated code shares your lock.<\/p>"},{"front":"What does <code>synchronized (new Object()) { ... }<\/code> protect?","back":"<p>Nothing. Each call locks a fresh object no other thread can see, so there is no exclusion and no visibility.<\/p>"},{"front":"What should you do before calling listeners or callbacks from a locked method?","back":"<p>Update your state and copy what you need (for example <code>List.copyOf(listeners)<\/code>) under the lock, release it, then call them.<\/p>"}],"terms":[{"term":"Monitor (intrinsic lock)","plain":"The lock every Java object has, taken and released by <code>synchronized<\/code>."},{"term":"Mutual exclusion","plain":"Only one thread at a time can run the code guarded by a lock."},{"term":"Visibility","plain":"Whether one thread is guaranteed to see what another thread wrote."},{"term":"Reentrant","plain":"A thread can take a lock it already holds without waiting for itself."},{"term":"Critical section","plain":"The code that runs while a lock is held."},{"term":"Alien method","plain":"Code you don't control, such as a listener or callback, which can block or call back in."},{"term":"Value-based class","plain":"A class like <code>Integer<\/code> whose instances may be shared or cached, so its identity is not yours to lock on."}],"remote":true},"conc-05":{"id":"conc-05","track":"conc","n":5,"title":"wait, notify and guarded blocks","ready":true,"minutes":35,"goal":"By the end you can write a guarded block with <code>wait()<\/code> in a <code>while<\/code> loop, choose between <code>notify()<\/code> and <code>notifyAll()<\/code>, and build a bounded buffer from scratch.","quiz":[{"q":"<p>What happens when this runs on its own?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"n\">Object<\/span><span class=\"w\"> <\/span><span class=\"n\">lock<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Object<\/span><span class=\"p\">();<\/span>\n<span class=\"n\">lock<\/span><span class=\"p\">.<\/span><span class=\"na\">notifyAll<\/span><span class=\"p\">();<\/span>\n<\/code><\/pre>","options":["Nothing, since nobody is waiting","It wakes every thread in the JVM that is waiting on any lock","It throws IllegalMonitorStateException, because the thread doesn't hold lock's monitor","It blocks until some thread waits on lock"],"answer":2,"why":"<code>wait<\/code>, <code>notify<\/code> and <code>notifyAll<\/code> require the caller to own the object's monitor, so they must run inside <code>synchronized (lock)<\/code>. It doesn't matter that nobody is waiting. The check comes first.","from":null},{"q":"A thread wakes up from <code>lock.wait()<\/code> because another thread called <code>notifyAll()<\/code>. When does it run the line after <code>wait()<\/code>?","options":["Immediately, in parallel with the notifier","After it gets the monitor back, which is at the earliest when the notifier leaves its synchronized block","Only after every other woken thread has finished","Never: it has to call wait() again"],"answer":1,"why":"<code>notifyAll()<\/code> doesn't release the lock. The woken threads move back to competing for the monitor, and <code>wait()<\/code> returns only once this thread owns it again. Other woken threads may get it first and change the state, which is why the condition must be re-checked.","from":null},{"q":"A one-slot buffer has 2 producers and 2 consumers, and both <code>put<\/code> and <code>take<\/code> call <code>notify()<\/code>. Each <code>wait()<\/code> is correctly inside a <code>while<\/code>. What can happen?","options":["Nothing bad, because the while loops make it safe","Two consumers take the same item","IllegalMonitorStateException","All four threads end up waiting with nobody left to notify them"],"answer":3,"why":"The <code>while<\/code> loops protect against acting on a false condition, not against lost signals. If a consumer's <code>notify()<\/code> wakes the other consumer instead of a producer, that wake-up is wasted, and soon every thread waits. <code>notifyAll()<\/code>, or one <code>Condition<\/code> per kind of waiter, fixes it.","from":null},{"q":"A worker calls <code>lock.wait()<\/code> with no condition, \"until the report is done\". The reporting thread calls <code>lock.notifyAll()<\/code> when it finishes. Sometimes the worker waits forever. Why?","options":["notifyAll() only wakes threads that started waiting before it was called, so an early report is a lost wake-up","wait() without a timeout is not allowed","notifyAll() needs a second call to wake a thread","The worker must call notify() itself"],"answer":0,"why":"A notification wakes only threads that are already waiting. If the report finishes first, the signal goes nowhere, and the worker then waits for a signal that already happened. Wait for a state: <code>while (!done) lock.wait();<\/code>, with <code>done = true<\/code> set before <code>notifyAll()<\/code>.","from":null},{"q":"From A thread's life: a consumer is parked inside <code>lock.wait()<\/code> and another thread interrupts it. Which is true?","options":["wait() returns normally and the interrupt flag stays set","wait() throws InterruptedException at once, without retaking the monitor","Nothing happens until someone calls notify()","wait() retakes the monitor, then throws InterruptedException with the interrupt flag cleared"],"answer":3,"why":"Like <code>sleep<\/code>, <code>wait<\/code> reacts to an interrupt by throwing <code>InterruptedException<\/code> and clearing the flag. It retakes the monitor first, so your catch or finally block still runs inside the synchronized block. Restore the flag or let the exception propagate.","from":"conc-02"}],"cards":[{"front":"What three things does <code>lock.wait()<\/code> do?","back":"<p>It releases lock's monitor, parks the thread in the wait set (WAITING), and retakes the monitor before it returns.<\/p>"},{"front":"Why must <code>wait()<\/code> always sit inside <code>while (!condition)<\/code>?","back":"<p>Spurious wakeups are allowed, and another thread may change the state between the notify and the moment you get the lock back.<\/p>"},{"front":"What happens if you call <code>wait()<\/code> or <code>notify()<\/code> without holding that object's monitor?","back":"<p><code>IllegalMonitorStateException<\/code>, at once.<\/p>"},{"front":"Does <code>notifyAll()<\/code> release the lock?","back":"<p>No. The woken threads compete for the monitor after the notifier leaves its synchronized block.<\/p>"},{"front":"When is <code>notify()<\/code> safe to use instead of <code>notifyAll()<\/code>?","back":"<p>Only when every waiter waits for the same condition and each change lets at most one waiter proceed.<\/p>"},{"front":"What is a lost wake-up?","back":"<p>A notify that happens before anyone waits. If the waiter has no condition to check, it then waits forever. Fix: wait for a state field, set before notifying.<\/p>"}],"terms":[{"term":"Guarded block","plain":"Code that waits, under a lock, until a condition holds: <code>while (!cond) lock.wait();<\/code>."},{"term":"Wait set","plain":"The threads parked in <code>wait()<\/code> on one monitor, waiting to be notified."},{"term":"Spurious wakeup","plain":"A return from <code>wait()<\/code> with no notify, interrupt or timeout. Allowed by the spec."},{"term":"notifyAll","plain":"Wake every thread in the monitor's wait set. They then compete for the lock."},{"term":"Lost wake-up","plain":"A signal sent before anyone waits for it, so the waiter never hears it."},{"term":"Backpressure","plain":"Making a fast producer wait when the consumer can't keep up, instead of buffering without limit."}],"remote":true},"conc-06":{"id":"conc-06","track":"conc","n":6,"title":"Deadlock, livelock and starvation","ready":true,"minutes":38,"goal":"By the end you can explain the four conditions for deadlock, remove one with lock ordering or timed <code>tryLock<\/code>, tell deadlock from livelock and starvation, and find a deadlock in a thread dump.","quiz":[{"q":"Which change makes <code>transfer(from, to)<\/code> safe from deadlock when transfers run in both directions?","options":["Mark the field that holds each balance <code>volatile<\/code>","Always lock the account with the lower id first, then the other","Add <code>Thread.sleep(1)<\/code> between the two locks","Make <code>transfer<\/code> a <code>synchronized<\/code> instance method on each account"],"answer":1,"why":"One global order means no thread can hold the second lock while waiting for the first, so circular wait can't happen. <code>volatile<\/code> doesn't affect locking. A sleep just changes the odds. A <code>synchronized<\/code> method on the source account is still \"lock <code>from<\/code>, then <code>to<\/code>\", the same broken order.","from":null},{"q":"Two threads use <code>tryLock<\/code> with a fixed 5 ms sleep between attempts. A thread dump shows both RUNNABLE or TIMED_WAITING, their stacks change between dumps, and no deadlock is reported. Nothing has completed in a minute. What is this?","options":["A deadlock that the JVM failed to detect","Starvation of one thread","Livelock: they keep retrying in lockstep and both keep failing","A GC pause"],"answer":2,"why":"The threads are active, they release and retake locks, and neither makes progress. That is livelock. With fixed sleeps they stay in step. A random back-off breaks the symmetry. It isn't deadlock, because nobody waits forever on a held lock, and it isn't starvation, because nobody else is progressing either.","from":null},{"q":"A service stops answering. You suspect a lock cycle. Which tool tells you for sure?","options":["A JFR recording, filtered on the jdk.Deadlock event","The GC log","Restarting the pod and watching whether it happens again","<code>jcmd &lt;pid&gt; Thread.print<\/code>, which prints \"Found one Java-level deadlock\" with the threads and locks involved"],"answer":3,"why":"The thread dump's deadlock detector finds cycles on monitors and on <code>ReentrantLock<\/code>, and names who holds what. JFR has no deadlock event. Restarting destroys the evidence. Take the dump first.","from":null},{"q":"A report thread needs a <code>ReentrantLock<\/code> for 50 ms once a minute. Request threads take the same lock thousands of times a second and grab it again the moment they release it. The report sometimes waits for minutes. What is this, and what is one fix?","options":["Starvation; a fair lock, <code>new ReentrantLock(true)<\/code>, gives the longest waiter the next turn","Deadlock; order the locks","Livelock; add random back-off","A race condition; make the field volatile"],"answer":0,"why":"Everyone else makes progress and one thread never gets its turn: that is starvation. A non-fair lock lets a running thread barge back in ahead of waiters. A fair lock queues them in order, at some cost in throughput. Making the request path hold the lock for less time also helps.","from":null},{"q":"From wait, notify and guarded blocks: a one-slot buffer using <code>notify()<\/code> stalls with all four threads WAITING. Will <code>jcmd Thread.print<\/code> report a Java-level deadlock?","options":["Yes, every stall is reported as a deadlock","No: no thread holds the monitor, they are all waiting for a notification that will never come","Yes, but only with the -l flag","No, because jcmd can't see WAITING threads"],"answer":1,"why":"The deadlock detector looks for threads blocked on locks held by each other. Threads in <code>wait()<\/code> hold nothing, and the monitor is free. They are stuck because a signal was lost, not because of a lock cycle, so the dump shows four WAITING threads and no deadlock section.","from":"conc-05"}],"cards":[{"front":"Deadlock condition 1: what is mutual exclusion?","back":"<p>A resource can be held by only one thread at a time. Every lock has it.<\/p>"},{"front":"Deadlock condition 2: what is hold and wait?","back":"<p>A thread holds one resource while waiting for another.<\/p>"},{"front":"Deadlock condition 3: what is no preemption?","back":"<p>Nobody can take a resource away from the thread that holds it; only the holder can release it.<\/p>"},{"front":"Deadlock condition 4: what is circular wait?","back":"<p>A cycle of threads, each waiting for a resource the next one holds: T1 waits for T2, T2 waits for T1.<\/p>"},{"front":"How does a global lock order prevent deadlock?","back":"<p>Every thread takes locks in the same order (for example lower id first), so no cycle can form. It breaks circular wait.<\/p>"},{"front":"Deadlock vs livelock vs starvation, in one line each.","back":"<p>Deadlock: threads wait forever for each other. Livelock: threads stay busy reacting to each other and make no progress. Starvation: others progress, one thread never gets a turn.<\/p>"},{"front":"What does <code>jcmd &lt;pid&gt; Thread.print<\/code> print when it finds a lock cycle?","back":"<p><code>Found one Java-level deadlock:<\/code>, then each thread, the lock it waits for and who holds it, then their stacks, ending with <code>Found 1 deadlock.<\/code><\/p>"}],"terms":[{"term":"Deadlock","plain":"Threads that each wait for a resource another one holds, so none can ever proceed."},{"term":"Livelock","plain":"Threads that keep reacting to each other, busy but making no progress."},{"term":"Starvation","plain":"One thread never gets the resource it needs while others keep getting it."},{"term":"Lock ordering","plain":"A rule that every thread takes locks in the same global order."},{"term":"Wait-for graph","plain":"A picture of which thread waits for which. A cycle in it is a deadlock."},{"term":"Thread dump","plain":"A snapshot of every thread's state and stack, from <code>jcmd Thread.print<\/code> or <code>jstack<\/code>."}],"remote":true},"conc-07":{"id":"conc-07","track":"conc","n":7,"title":"Explicit locks: ReentrantLock, Condition, ReadWriteLock","ready":true,"minutes":38,"goal":"By the end you can use <code>ReentrantLock<\/code> safely (try/finally, <code>tryLock<\/code>, <code>lockInterruptibly<\/code>), give each kind of waiter its own <code>Condition<\/code>, and use a read-write lock without the upgrade deadlock.","quiz":[{"q":"A request handler needs the ledger lock, but must answer 503 if it can't get the lock within 50 ms. Which tool fits?","options":["<code>synchronized (ledger)<\/code>","<code>ledger.lockInterruptibly()<\/code>","<code>ledger.tryLock(50, TimeUnit.MILLISECONDS)<\/code>","A <code>volatile boolean busy<\/code> flag checked before <code>lock()<\/code>"],"answer":2,"why":"<code>tryLock<\/code> with a timeout waits at most 50 ms and returns <code>false<\/code> if the lock is still taken. <code>lockInterruptibly<\/code> waits without a limit unless someone interrupts the thread. <code>synchronized<\/code> can't time out at all. A <code>volatile<\/code> flag checked before locking is check-then-act: the lock can be taken between the check and the <code>lock()<\/code> call.","from":null},{"q":"Kotlin code: <code>rw.read { if (cache[k] == null) rw.write { cache[k] = load(k) } }<\/code>. Two threads ask for the same missing key. What can happen?","options":["Both hang, because a read lock can't be upgraded","<code>load(k)<\/code> can run twice, because <code>write { }<\/code> releases the read lock before it takes the write lock","Nothing bad: <code>write { }<\/code> upgrades atomically","It throws <code>IllegalMonitorStateException<\/code>"],"answer":1,"why":"Kotlin's <code>write<\/code> releases this thread's read locks, takes the write lock, and restores the read locks after. Both threads can see <code>null<\/code>, both release, and each then loads in turn. It doesn't hang, but it isn't atomic. Re-check inside <code>write<\/code>, for example with <code>getOrPut<\/code>.","from":null},{"q":"From wait, notify and guarded blocks: a teammate merges <code>notFull<\/code> and <code>notEmpty<\/code> into one <code>Condition changed<\/code>, but keeps <code>changed.signal()<\/code> in both <code>put<\/code> and <code>take<\/code>. With several producers and consumers, what can happen?","options":["Nothing changes: <code>signal()<\/code> always wakes the right kind of thread","Items are lost","It throws, because two methods can't share one Condition","Everything can stall: a <code>signal()<\/code> meant for a consumer can wake a producer, which waits again, and no one signals the consumers"],"answer":3,"why":"With one queue for both kinds of waiter, <code>signal()<\/code> may pick the wrong kind. That thread re-checks, waits again, and the signal is gone. It is the same lost wake-up that made the one-monitor buffer need <code>notifyAll()<\/code>. With one condition, use <code>signalAll()<\/code>; with two, <code>signal()<\/code> is fine.","from":"conc-05"},{"q":"With <code>StampedLock<\/code>, you call <code>tryOptimisticRead()<\/code> and copy <code>bid<\/code> and <code>ask<\/code> into locals. What must happen before you use them?","options":["Call <code>validate(stamp)<\/code>; if it returns false, read them again under <code>readLock()<\/code>","Nothing: the stamp guarantees a consistent read","Call <code>unlockRead(stamp)<\/code>","Call <code>tryConvertToWriteLock(stamp)<\/code>"],"answer":0,"why":"An optimistic read takes no lock, so a writer can change the fields while you copy them. <code>validate<\/code> tells you whether a writer got in since the stamp. Only after it returns <code>true<\/code> are the copies known to be consistent. There is nothing to release, because nothing was locked.","from":null},{"q":"A dump shows 40 worker threads <code>WAITING (parking)<\/code> in <code>ReentrantLock.lock()<\/code>. <code>Thread.print -l<\/code> says the lock is owned by <code>kafka-consumer-3<\/code>, whose stack shows it idle inside <code>poll()<\/code>. What is the most likely bug?","options":["A deadlock between the workers","The lock is unfair, so the workers are starving","A code path in the consumer took the lock and left without <code>unlock()<\/code>, for example on an exception with no <code>finally<\/code>","<code>poll()<\/code> holds the lock internally"],"answer":2,"why":"The owner isn't waiting for anything you'd expect, and it isn't in the critical section. It has moved on while still holding the lock, which happens when an exception or an early return skips the release. An unfair lock would still hand over now and then, and a deadlock needs the owner to wait for a lock too.","from":null}],"cards":[{"front":"Where do <code>lock()<\/code> and <code>unlock()<\/code> go relative to <code>try<\/code>/<code>finally<\/code>?","back":"<p><code>lock()<\/code> on the line right before <code>try<\/code>. <code>unlock()<\/code> as the first statement of <code>finally<\/code>. In Kotlin, <code>lock.withLock { }<\/code> does both.<\/p>"},{"front":"What does <code>lock.tryLock(50, MILLISECONDS)<\/code> do when another thread holds the lock?","back":"<p>It waits up to 50 ms. It returns <code>true<\/code> (and you hold the lock) if it got it in time, <code>false<\/code> otherwise. It throws <code>InterruptedException<\/code> if interrupted while waiting.<\/p>"},{"front":"A thread waits in <code>lockInterruptibly()<\/code> and another thread interrupts it. What happens? And for a thread waiting to enter <code>synchronized<\/code>?","back":"<p><code>lockInterruptibly()<\/code> gives up at once with <code>InterruptedException<\/code>. The <code>synchronized<\/code> waiter keeps waiting until it gets the monitor; it only sees its interrupt flag afterwards.<\/p>"},{"front":"Why can a bounded buffer with <code>notFull<\/code> and <code>notEmpty<\/code> conditions use <code>signal()<\/code> instead of <code>signalAll()<\/code>?","back":"<p>Each condition has only one kind of waiter, and one change (one item in, or one slot free) lets exactly one of them proceed.<\/p>"},{"front":"A thread holding the read lock of a <code>ReentrantReadWriteLock<\/code> calls <code>writeLock().lock()<\/code>. What happens?","back":"<p>It waits forever. The write lock waits for every reader to leave, including this thread. Release the read lock first, then re-check under the write lock.<\/p>"},{"front":"After <code>long s = lock.tryOptimisticRead()<\/code> and copying fields into locals, what must you do?","back":"<p>Call <code>lock.validate(s)<\/code>. If it returns false, a writer got in: read the fields again under <code>lock.readLock()<\/code>.<\/p>"},{"front":"In Kotlin, what does <code>rw.write { }<\/code> do when called inside <code>rw.read { }<\/code>?","back":"<p>It releases this thread's read locks, takes the write lock, and restores the read locks afterwards. It doesn't hang, but it isn't atomic: re-check inside the block.<\/p>"}],"terms":[{"term":"ReentrantLock","plain":"An explicit lock with the same rules as <code>synchronized<\/code>, plus <code>tryLock<\/code>, timeouts, interruptible waits, fairness and conditions."},{"term":"Hold count","plain":"How many times the owning thread has taken a reentrant lock. It must release it as many times."},{"term":"Condition","plain":"A wait queue tied to a lock. <code>await()<\/code> releases the lock and waits; <code>signal()<\/code> wakes one waiter."},{"term":"Fair lock","plain":"A lock that hands over to the longest-waiting thread instead of letting new arrivals barge in."},{"term":"Read-write lock","plain":"A pair of locks: many threads may hold the read lock together; the write lock is exclusive."},{"term":"Lock upgrade","plain":"Going from a read lock to a write lock while still holding the read lock. <code>ReentrantReadWriteLock<\/code> hangs if you try."},{"term":"Optimistic read","plain":"A <code>StampedLock<\/code> read that takes no lock and checks afterwards, with <code>validate<\/code>, that no writer got in."}],"remote":true},"conc-08":{"id":"conc-08","track":"conc","n":8,"title":"Atomics and compare-and-set","ready":true,"minutes":37,"goal":"By the end you can write a compare-and-set retry loop, choose between <code>AtomicLong<\/code>, <code>LongAdder<\/code> and <code>AtomicReference<\/code>, and explain why two atomic calls in a row are not atomic.","quiz":[{"q":"Sixteen Kafka consumer threads count processed records. A metrics scraper reads the count once a minute. Which is the best fit?","options":["A <code>volatile long<\/code> with <code>count++<\/code>","A <code>synchronized<\/code> increment method","An <code>AtomicLong<\/code> with <code>incrementAndGet()<\/code>","A <code>LongAdder<\/code> with <code>increment()<\/code> and <code>sum()<\/code>"],"answer":3,"why":"Many writers and a rare, approximate read is exactly what <code>LongAdder<\/code> is for: threads mostly update different cells, so they don't fight over one cache line. <code>AtomicLong<\/code> is correct but slower under this contention. <code>synchronized<\/code> is correct and slower still. <code>volatile<\/code> with <code>++<\/code> loses updates.","from":null},{"q":"<p>What does this print?<\/p>\n<div class=\"pair\"><div class=\"pairbar\" role=\"group\" aria-label=\"Code language\"><button data-act=\"lang\" data-lang=\"java\">Java<\/button><button data-act=\"lang\" data-lang=\"kotlin\">Kotlin<\/button><button data-act=\"lang\" data-lang=\"both\">Both<\/button><\/div><div class=\"pi\" data-lang=\"java\"><span class=\"lg\">Java<\/span><pre class=\"code\" data-lang=\"java\"><code><span class=\"n\">AtomicInteger<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">AtomicInteger<\/span><span class=\"p\">(<\/span><span class=\"mi\">5<\/span><span class=\"p\">);<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"p\">.<\/span><span class=\"na\">getAndIncrement<\/span><span class=\"p\">();<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">b<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"p\">.<\/span><span class=\"na\">incrementAndGet<\/span><span class=\"p\">();<\/span>\n<span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"n\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"s\">\" \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">b<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"s\">\" \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">());<\/span>\n<\/code><\/pre><\/div><div class=\"pi\" data-lang=\"kotlin\"><span class=\"lg\">Kotlin<\/span><pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">n<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">AtomicInteger<\/span><span class=\"p\">(<\/span><span class=\"m\">5<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"p\">.<\/span><span class=\"na\">getAndIncrement<\/span><span class=\"p\">()<\/span>\n<span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">b<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"p\">.<\/span><span class=\"na\">incrementAndGet<\/span><span class=\"p\">()<\/span>\n<span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"<\/span><span class=\"si\">$<\/span><span class=\"n\">a<\/span><span class=\"s\"> <\/span><span class=\"si\">$<\/span><span class=\"n\">b<\/span><span class=\"s\"> <\/span><span class=\"si\">${<\/span><span class=\"n\">n<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">()<\/span><span class=\"si\">}<\/span><span class=\"s\">\"<\/span><span class=\"p\">)<\/span>\n<\/code><\/pre><\/div><\/div>","options":["5 7 7","6 7 7","5 6 7","6 6 6"],"answer":0,"why":"<code>getAndIncrement<\/code> returns the old value (5) and leaves 6. <code>incrementAndGet<\/code> makes it 7 and returns the new value (7). The final <code>get()<\/code> is 7. The name says the order: get then increment, or increment then get.","from":null},{"q":"<code>balance.updateAndGet(b -&gt; { audit.log(\"balance \" + b); return b - cents; })<\/code> runs on many threads. What can go wrong?","options":["Nothing: <code>updateAndGet<\/code> runs the function exactly once per call","The balance can lose a debit","The audit log can contain balances that never became the real balance, because the function reruns when its CAS fails","It throws <code>IllegalStateException<\/code> on contention"],"answer":2,"why":"On a failed CAS, <code>updateAndGet<\/code> calls the function again with the fresh value. Each failed attempt still ran <code>audit.log<\/code>. The balance itself is correct. Keep the function pure and log the returned value after the call.","from":null},{"q":"From synchronized and intrinsic locks: a class keeps <code>count<\/code> and <code>totalCents<\/code> for an average, and both must always change together. Which is a correct choice?","options":["Two <code>AtomicLong<\/code> fields, each updated with <code>addAndGet<\/code>","One <code>AtomicReference<\/code> to an immutable record holding both values, or a <code>synchronized<\/code> method that updates both","Two <code>volatile long<\/code> fields","Two <code>LongAdder<\/code> fields"],"answer":1,"why":"Each atomic protects one variable. With two of them, a reader can see the new count with the old total. One lock around both updates, or one CAS on a reference to an immutable pair, makes the two fields change as one step.","from":"conc-04"},{"q":"When is ABA a real risk for a compare-and-set in Java?","options":["On every <code>AtomicReference<\/code> CAS, even with freshly allocated nodes","Only on ARM processors","Never: the JVM prevents it","When the same value can come back after changes: recycled nodes, object pools, array indices, plain counters"],"answer":3,"why":"CAS only checks that the value equals what you read. That is fooled only if the value can return to an earlier one. With new nodes, the garbage collector won't reuse a node's memory while any thread still references it, so it can't come back. Pools, indices and numbers can, and <code>AtomicStampedReference<\/code> adds a version to catch it.","from":null}],"cards":[{"front":"What does <code>ref.compareAndSet(expected, next)<\/code> do?","back":"<p>As one indivisible step: if the current value equals <code>expected<\/code>, it stores <code>next<\/code> and returns <code>true<\/code>. Otherwise it changes nothing and returns <code>false<\/code>.<\/p>"},{"front":"<code>incrementAndGet()<\/code> vs <code>getAndIncrement()<\/code>: what does each return?","back":"<p><code>incrementAndGet()<\/code> returns the new value. <code>getAndIncrement()<\/code> returns the old value. Both add one atomically.<\/p>"},{"front":"Why must the function passed to <code>updateAndGet<\/code> have no side effects?","back":"<p>When its compare-and-set loses a race, <code>updateAndGet<\/code> calls the function again with the new value. It can run several times for one update.<\/p>"},{"front":"Hot counter, read rarely: <code>AtomicLong<\/code> or <code>LongAdder<\/code>?","back":"<p><code>LongAdder<\/code>: threads update separate cells, so there is far less contention. Use <code>AtomicLong<\/code> when the exact value drives a decision.<\/p>"},{"front":"Is <code>LongAdder.sum()<\/code> an exact snapshot while other threads add?","back":"<p>No. It reads the cells one at a time, so increments made during the sum may be missed.<\/p>"},{"front":"What is the ABA problem?","back":"<p>A CAS succeeds because the value is back to what you read (A to B to A), though it changed in between. Fix it with a version stamp: <code>AtomicStampedReference<\/code>.<\/p>"},{"front":"<code>if (n.get() &lt; limit) n.incrementAndGet();<\/code> on an <code>AtomicInteger<\/code>: safe?","back":"<p>No. Two atomic calls with a gap between them is check-then-act. Do the check inside a CAS loop or <code>updateAndGet<\/code>.<\/p>"}],"terms":[{"term":"Atomic variable","plain":"A variable whose read-modify-write operations happen as one indivisible step."},{"term":"Compare-and-set (CAS)","plain":"Write a new value only if the current value is still the one you expected; report whether it worked."},{"term":"CAS loop","plain":"Read, compute, try CAS, and start over if another thread changed the value first."},{"term":"Lock-free","plain":"Some thread always makes progress, even if others are paused, because nobody holds a lock."},{"term":"Contention","plain":"Many threads trying to update the same thing at the same moment."},{"term":"LongAdder","plain":"A counter spread over several cells so threads rarely collide; its sum is not a snapshot."},{"term":"ABA problem","plain":"A CAS that succeeds because a value changed and then changed back."}],"remote":true},"conc-09":{"id":"conc-09","track":"conc","n":9,"title":"Concurrent collections","ready":true,"minutes":37,"goal":"By the end you can pick the right concurrent collection for a job, use <code>ConcurrentHashMap<\/code>'s atomic per-key methods correctly, and explain what weakly consistent iteration and <code>ConcurrentModificationException<\/code> really mean.","quiz":[{"q":"From atomics and compare-and-set: 16 threads count events for about 200 hot merchant keys. Which is the best fit?","options":["<code>HashMap&lt;String, Long&gt;<\/code> with <code>merge<\/code>","<code>ConcurrentHashMap&lt;String, LongAdder&gt;<\/code> with <code>computeIfAbsent(k, x -&gt; new LongAdder()).increment()<\/code>","<code>ConcurrentHashMap&lt;String, Long&gt;<\/code> with <code>put(k, get(k) + 1)<\/code>","<code>Collections.synchronizedMap(new HashMap&lt;&gt;())<\/code> with <code>merge<\/code>"],"answer":1,"why":"<code>computeIfAbsent<\/code> creates each adder once, and after that every increment goes to a <code>LongAdder<\/code>, which spreads hot keys over cells. <code>merge<\/code> on a <code>ConcurrentHashMap&lt;String, Long&gt;<\/code> would also be correct, just with more contention on hot keys. A plain <code>HashMap<\/code> breaks, get-then-put loses updates, and a synchronized map serializes every thread on one lock.","from":"conc-08"},{"q":"Why does <code>ConcurrentHashMap<\/code> throw <code>NullPointerException<\/code> for <code>put(k, null)<\/code>?","options":["So that <code>get(k) == null<\/code> always means the key is absent, with no second call needed","Because nulls would corrupt its bins","It doesn't: only null keys are rejected","To save memory"],"answer":0,"why":"If null values were allowed, <code>get<\/code> returning null would be ambiguous, and telling \"absent\" from \"mapped to null\" would need <code>containsKey<\/code> too. Two calls is check-then-act, which another thread can break. Banning null removes the ambiguity.","from":null},{"q":"A cache uses <code>map.computeIfAbsent(id, k -&gt; loadAccount(k))<\/code>, and <code>loadAccount<\/code> calls <code>map.computeIfAbsent(parentId, ...)<\/code> on the same map. What should you expect?","options":["It works, because the two keys differ","A deadlock every time","It breaks the documented contract; <code>ConcurrentHashMap<\/code> may throw <code>IllegalStateException: Recursive update<\/code> or misbehave","A <code>ConcurrentModificationException<\/code> from the iterator"],"answer":2,"why":"The Javadoc says the mapping function must not modify the map. Whether the JDK detects it depends on where the keys land, so sometimes it throws <code>Recursive update<\/code> and sometimes it seems to work. Don't rely on either. Load the parent first, outside the compute call.","from":null},{"q":"A list of five fraud-rule listeners changes only at deploy time and is iterated on every one of 3,000 payments a second, from many threads. Which collection fits?","options":["<code>ArrayList<\/code> guarded by <code>synchronized<\/code> around every loop","<code>Collections.synchronizedList(new ArrayList&lt;&gt;())<\/code>","<code>ConcurrentLinkedQueue<\/code>","<code>CopyOnWriteArrayList<\/code>"],"answer":3,"why":"Reads vastly outnumber writes and the list is tiny, so copying the array on each rare write is cheap, and every iteration runs lock-free over a stable snapshot. The synchronized options make every payment take a lock for the whole loop. A queue would work for iteration, but it doesn't model a list you add to and remove from by identity as cleanly.","from":null},{"q":"A Kafka consumer thread puts records into <code>new LinkedBlockingQueue&lt;&gt;()<\/code> and a single writer thread inserts them into Oracle. During a slow-database incident, what happens?","options":["<code>put<\/code> blocks the consumer once the queue holds 10,000 records","The queue grows without limit, because the default capacity is <code>Integer.MAX_VALUE<\/code>, until memory runs out","<code>put<\/code> throws <code>IllegalStateException<\/code> when the queue is full","The writer thread speeds up to match"],"answer":1,"why":"With no capacity, the queue never fills, so nothing pushes back on the consumer. Memory grows until the pod dies. Give the queue a capacity so <code>put<\/code> blocks the consumer (or <code>offer<\/code> fails), and pause the Kafka consumer when it does.","from":null}],"cards":[{"front":"What does <code>ConcurrentHashMap.computeIfAbsent(k, f)<\/code> guarantee?","back":"<p>The whole call is atomic for that key: if <code>k<\/code> is absent, <code>f<\/code> runs at most once and its result is stored. Other updates to the same bin wait while <code>f<\/code> runs.<\/p>"},{"front":"Can a <code>ConcurrentHashMap<\/code> hold null keys or null values?","back":"<p>No. Both throw <code>NullPointerException<\/code>, so <code>get(k) == null<\/code> always means \"absent\".<\/p>"},{"front":"What happens if the function passed to <code>computeIfAbsent<\/code> modifies the same map?","back":"<p>It breaks the contract. <code>ConcurrentHashMap<\/code> may throw <code>IllegalStateException: Recursive update<\/code>; <code>HashMap<\/code> may throw <code>ConcurrentModificationException<\/code>; sometimes nothing is caught.<\/p>"},{"front":"Is <code>ConcurrentHashMap.size()<\/code> exact while other threads update it?","back":"<p>No. It is an estimate of a moving target: fine for monitoring, wrong for decisions.<\/p>"},{"front":"What does a <code>ConcurrentHashMap<\/code> iterator do if the map changes during the loop?","back":"<p>It never throws. It is weakly consistent: changes made during the loop may or may not appear.<\/p>"},{"front":"On a full <code>ArrayBlockingQueue<\/code>, what do <code>offer(e)<\/code> and <code>put(e)<\/code> do?","back":"<p><code>offer(e)<\/code> returns <code>false<\/code> at once. <code>put(e)<\/code> waits until there is space (and throws <code>InterruptedException<\/code> if interrupted).<\/p>"},{"front":"What is the capacity of <code>new LinkedBlockingQueue&lt;&gt;()<\/code>?","back":"<p><code>Integer.MAX_VALUE<\/code>: unbounded in practice. Pass a capacity to get back-pressure.<\/p>"}],"terms":[{"term":"ConcurrentHashMap","plain":"A thread-safe hash map that locks per bin for writes and never locks for reads."},{"term":"Bin","plain":"One slot of a hash table; keys whose hashes land in the same slot share it."},{"term":"Fail-fast iterator","plain":"An iterator that throws <code>ConcurrentModificationException<\/code> when it notices its collection changed; best effort only."},{"term":"Weakly consistent iterator","plain":"An iterator that never throws and may or may not show changes made while it runs."},{"term":"CopyOnWriteArrayList","plain":"A list that copies its whole array on every write so readers can iterate a stable snapshot without locks."},{"term":"BlockingQueue","plain":"A queue whose <code>put<\/code> and <code>take<\/code> wait when it is full or empty, used to hand work between threads."},{"term":"Back-pressure","plain":"Slowing or rejecting producers when consumers fall behind, instead of buffering without limit."}],"remote":true},"conc-10":{"id":"conc-10","track":"conc","n":10,"title":"Synchronizers: latch, barrier, semaphore, phaser","ready":true,"minutes":36,"goal":"By the end you can pick the right synchronizer for a coordination problem (wait for events, meet at a line, limit concurrency, phases that change size) and use each without the classic bugs.","quiz":[{"q":"A service must not accept traffic until four independent caches have loaded, each on its own thread. Which tool fits best?","options":["<code>CountDownLatch(4)<\/code>, counted down by each loader, awaited by the startup code","<code>CyclicBarrier(4)<\/code>","<code>Semaphore(4)<\/code>","<code>Exchanger<\/code>"],"answer":0,"why":"You are waiting for four events, once. That is a latch. A barrier would make the four loader threads wait for each other, which they don't need to, and it is built for repeated rounds. A semaphore limits concurrency; it doesn't wait for completion.","from":null},{"q":"<code>try { sem.acquire(); callIssuer(); } finally { sem.release(); }<\/code> with <code>new Semaphore(10)<\/code>. A thread is interrupted while it waits in <code>acquire()<\/code>. What happens?","options":["Nothing: <code>acquire()<\/code> gives up cleanly","The thread gets the permit anyway","<code>acquire()<\/code> throws, the <code>finally<\/code> releases a permit that was never taken, and the semaphore now allows 11","The semaphore throws <code>IllegalMonitorStateException<\/code> in <code>release()<\/code>"],"answer":2,"why":"<code>acquire()<\/code> throws <code>InterruptedException<\/code>, which still runs the <code>finally<\/code>. Permits have no owner, so <code>release()<\/code> simply adds one. Move <code>acquire()<\/code> above the <code>try<\/code>.","from":null},{"q":"Three workers use a <code>CyclicBarrier(3)<\/code> with plain <code>await()<\/code>. One worker throws an exception before it reaches <code>await()<\/code> in round 5. What do the other two do?","options":["They get <code>BrokenBarrierException<\/code> at once","The barrier notices the dead thread and lets them through","They get <code>TimeoutException<\/code> after a default timeout","They wait forever"],"answer":3,"why":"The barrier only breaks when a waiting thread is interrupted or times out, or the action fails. A thread that never arrives is invisible to it, and plain <code>await()<\/code> has no timeout. Use <code>await(timeout, unit)<\/code> so the round fails instead of hanging.","from":null},{"q":"From deadlock, livelock and starvation: 20 request threads each take 1 permit from a <code>Semaphore(20)<\/code> that guards DB connections, then call a helper that takes another permit from the same semaphore. Under full load everything stops. What will <code>jcmd Thread.print<\/code> say?","options":["<code>Found one Java-level deadlock<\/code> naming the semaphore","No deadlock report: semaphore permits have no owner, so the detector can't see the cycle; you see 20 threads <code>WAITING<\/code> in <code>Semaphore.acquire<\/code>","It reports a livelock","The threads show as <code>BLOCKED<\/code>"],"answer":1,"why":"This is hold-and-wait: every thread holds one permit and waits for a second. It is a real deadlock, but the JVM's detector only follows owned locks (monitors and <code>ReentrantLock<\/code>-style synchronizers). Parked threads show as <code>WAITING<\/code>, not <code>BLOCKED<\/code>. Acquire both permits at once with <code>acquire(2)<\/code>, or don't take a second one while holding the first.","from":"conc-06"},{"q":"A batch job processes files in rounds and the number of worker threads changes between rounds as files are discovered. Which tool fits?","options":["One <code>CountDownLatch<\/code> per round, created up front","A <code>CyclicBarrier<\/code> with the maximum number of workers","A <code>Phaser<\/code>, with workers registering when they start and deregistering when they finish","A <code>Semaphore<\/code>"],"answer":2,"why":"A phaser's group can grow and shrink between phases, and each phase waits only for the parties registered then. A barrier's party count is fixed, so missing workers would hang it. Latches are one-shot and need their count known in advance.","from":null}],"cards":[{"front":"A <code>CountDownLatch<\/code> has reached zero. What do later <code>await()<\/code> and <code>countDown()<\/code> calls do?","back":"<p><code>await()<\/code> returns at once. <code>countDown()<\/code> does nothing. A latch can't be reset.<\/p>"},{"front":"When does a <code>CyclicBarrier<\/code>'s barrier action run, and on which thread?","back":"<p>Once per round, on the last thread to arrive, before any waiting thread is released.<\/p>"},{"front":"What breaks a <code>CyclicBarrier<\/code>?","back":"<p>A waiting thread being interrupted or timing out, the barrier action throwing, or <code>reset()<\/code>. Then every waiter gets <code>BrokenBarrierException<\/code>.<\/p>"},{"front":"What does <code>release()<\/code> do on a <code>Semaphore<\/code> when the caller never acquired a permit?","back":"<p>It adds a permit anyway. Permits have no owner, so stray releases silently raise the limit.<\/p>"},{"front":"Where do <code>acquire()<\/code> and <code>release()<\/code> go relative to <code>try<\/code>/<code>finally<\/code>?","back":"<p><code>acquire()<\/code> on the line before <code>try<\/code>; <code>release()<\/code> in <code>finally<\/code>. With <code>tryAcquire<\/code>, check its result before entering the <code>try<\/code>.<\/p>"},{"front":"Latch or barrier: \"start serving after 3 caches load\" vs \"4 workers finish day N before any starts day N+1\"?","back":"<p>The first is a latch (waiting for events, once). The second is a barrier (a fixed group meeting every round).<\/p>"},{"front":"What can a <code>Phaser<\/code> do that a <code>CyclicBarrier<\/code> can't?","back":"<p>Change its number of parties between phases: <code>register()<\/code> to join, <code>arriveAndDeregister()<\/code> to leave.<\/p>"}],"terms":[{"term":"Synchronizer","plain":"An object that makes threads wait for each other or for events, such as a latch, barrier or semaphore."},{"term":"CountDownLatch","plain":"A one-shot gate that opens when a count reaches zero."},{"term":"CyclicBarrier","plain":"A meeting point for a fixed number of threads that resets itself after each round."},{"term":"Barrier action","plain":"Code a <code>CyclicBarrier<\/code> runs once per round, before releasing the threads."},{"term":"Semaphore","plain":"A counter of permits that limits how many threads can do something at once."},{"term":"Permit","plain":"One unit of a semaphore's count. It belongs to nobody."},{"term":"Phaser","plain":"A reusable barrier whose set of parties can change between phases."}],"remote":true},"conc-11":{"id":"conc-11","track":"conc","n":11,"title":"Don't share: immutability, confinement, ThreadLocal","ready":true,"minutes":36,"goal":"By the end you can remove shared mutable state instead of locking it: build deeply immutable objects, publish snapshots, keep state confined to one thread, hand objects over through a queue, and use <code>ThreadLocal<\/code> without leaking between requests.","quiz":[{"q":"Which of these can be shared between threads with no synchronization at all?","options":["A record whose <code>List&lt;String&gt;<\/code> component is the caller's <code>ArrayList<\/code>","A class with <code>volatile<\/code> fields and setters","A final class whose <code>private final<\/code> fields are a <code>String<\/code>, an <code>Instant<\/code> and a <code>BigDecimal<\/code>, with no setters","A record with an <code>int[]<\/code> component and the default accessor"],"answer":2,"why":"All three field types are immutable and the fields are final, so the object can never change and the final-field rule makes it visible correctly. The record with the caller's list and the record with an array can be changed from outside. <code>volatile<\/code> fields with setters make each write visible, but the object still changes under readers.","from":null},{"q":"A constructor stores <code>this.items = Collections.unmodifiableList(items);<\/code>. The caller later adds an item to its own <code>items<\/code> list. What does the object's list show?","options":["The original items only","It throws <code>UnsupportedOperationException<\/code> in the caller","The caller's add is ignored","The new item too, because <code>unmodifiableList<\/code> is a view of the caller's list"],"answer":3,"why":"<code>unmodifiableList<\/code> only stops <em>you<\/em> from changing the list through that reference. It still reads the caller's list, so the caller's changes show through. <code>List.copyOf<\/code> makes a copy that nobody can change.","from":null},{"q":"From explicit locks: an FX rate table is replaced as a whole every 5 seconds and read 5,000 times a second. What is the simplest correct design?","options":["A <code>ReentrantReadWriteLock<\/code> around a <code>HashMap<\/code>","A <code>volatile<\/code> field holding an immutable map, replaced with a freshly built <code>Map.copyOf(...)<\/code> on each refresh","A <code>ConcurrentHashMap<\/code> refreshed with <code>clear()<\/code> and <code>putAll()<\/code>","A <code>synchronized<\/code> getter and setter on a <code>HashMap<\/code>"],"answer":1,"why":"Readers never block, and each one sees one complete version, because the new map is built fully before one <code>volatile<\/code> write publishes it. The read-write lock also works, with more code and some cost on every read. <code>clear<\/code> plus <code>putAll<\/code> on a concurrent map lets readers see an empty or half-filled table.","from":"conc-07"},{"q":"A Quarkus request handler does <code>USER.set(request.user())<\/code> on a <code>ThreadLocal<\/code> when the request is authenticated, and never removes it. What does a later anonymous request on the same worker thread see?","options":["The previous request's user","<code>null<\/code>, because each request gets a fresh thread","An <code>IllegalStateException<\/code>","A random user from another thread"],"answer":0,"why":"Worker threads come from a pool and are reused. The value stays on the thread until someone removes it, so the anonymous request runs as whoever that thread served last. Pair every <code>set<\/code> with <code>remove()<\/code> in <code>finally<\/code>.","from":null},{"q":"A producer puts an <code>ArrayList<\/code> of entries into a <code>BlockingQueue<\/code>, then calls <code>clear()<\/code> on the same list and refills it for the next batch. What does that do to the consumer?","options":["Nothing: <code>take()<\/code> returns a copy of the list","Nothing: <code>put<\/code> made the list thread-safe","The consumer can see a partly cleared or refilled batch, because the producer kept changing an object it had handed over","<code>put<\/code> throws, because the list is already in the queue"],"answer":2,"why":"The queue hands over a reference, not a copy. <code>put<\/code> happens-before <code>take<\/code> only for what the producer did before the <code>put<\/code>. After that, the producer and consumer share one mutable list with no synchronization. Hand over a new list each time.","from":null}],"cards":[{"front":"What does a class need to be immutable?","back":"<p>All fields <code>final<\/code> and set in the constructor, no setters, mutable components copied in and never handed out, and <code>this<\/code> doesn't escape during construction.<\/p>"},{"front":"What does the memory model guarantee for <code>final<\/code> fields?","back":"<p>A thread that gets a reference to the object after its constructor finished sees the correct values of its final fields, even without synchronization.<\/p>"},{"front":"Is a record with a <code>List<\/code> component immutable?","back":"<p>Only shallowly. Copy it in the compact constructor: <code>items = List.copyOf(items);<\/code>.<\/p>"},{"front":"<code>Collections.unmodifiableList(list)<\/code> vs <code>List.copyOf(list)<\/code>?","back":"<p><code>unmodifiableList<\/code> is a read-only view: the owner's later changes show through. <code>List.copyOf<\/code> is an unmodifiable copy that nobody can change.<\/p>"},{"front":"How do you share data that changes rarely, without locks?","back":"<p>Build a new immutable snapshot, then publish it with one write to a <code>volatile<\/code> field (or an <code>AtomicReference<\/code>). Readers read the reference once.<\/p>"},{"front":"A pool thread runs a task that calls <code>ThreadLocal.set<\/code> and never <code>remove()<\/code>. What happens next?","back":"<p>The value stays on the thread. The next task on that thread sees it if it doesn't set its own.<\/p>"},{"front":"What makes passing a mutable object through a <code>BlockingQueue<\/code> safe?","back":"<p><code>put<\/code> happens-before <code>take<\/code>, so the consumer sees everything done before the put, as long as the producer never touches the object again.<\/p>"}],"terms":[{"term":"Immutable object","plain":"An object whose state can't change after construction; safe to share without locks."},{"term":"Defensive copy","plain":"Copying a mutable argument or return value so no one else can change your object through it."},{"term":"Shallow immutability","plain":"Final references to objects that can still change, as in a record holding an <code>ArrayList<\/code>."},{"term":"Snapshot publication","plain":"Replacing a whole immutable object through one <code>volatile<\/code> write, so readers see one complete version."},{"term":"Thread confinement","plain":"Keeping mutable state reachable by only one thread."},{"term":"Ownership hand-off","plain":"Passing an object to another thread, through a queue, and never touching it again."},{"term":"ThreadLocal","plain":"A variable with a separate value per thread; values live as long as the thread unless removed."},{"term":"Scoped value","plain":"A JDK 25 value bound for one call and its callees, gone when the call returns (JEP 506)."}],"remote":true},"conc-12":{"id":"conc-12","track":"conc","n":12,"title":"Classic problems: producer-consumer, philosophers, readers-writers","ready":false},"conc-13":{"id":"conc-13","track":"conc","n":13,"title":"Testing and debugging concurrent code","ready":false},"jmm-01":{"id":"jmm-01","track":"jmm","n":1,"title":"Why your loop never stops: caches and reordering","ready":true,"minutes":35,"goal":"By the end you can explain why a plain stop flag can hang a loop forever, tell a compiler effect from a CPU effect, and fix the bug with volatile.","quiz":[{"q":"A health checker runs <code>while (!done) { Thread.sleep(10); }<\/code> on a plain <code>boolean done<\/code>. It has worked in production for two years. Is it correct?","options":["Yes, because <code>Thread.sleep<\/code> flushes the CPU caches","Yes, because the loop body is not empty","No. The JMM lets the read of <code>done<\/code> happen once; HotSpot re-reads after <code>sleep<\/code> today, but nothing promises it","No, because <code>Thread.sleep<\/code> inside a loop always throws InterruptedException"],"answer":2,"why":"<code>sleep<\/code> has no synchronization effect in the JMM. HotSpot happens to re-read the field after a call it can't see into, which is why the loop works today. Caches don't need flushing (they are coherent), and the body being non-empty is not a rule anywhere. Make <code>done<\/code> volatile.","from":null},{"q":"<code>ReorderDemo<\/code> still shows both threads reading 0 when you run it with <code>-Xint<\/code>. What causes those outcomes?","options":["The JIT reordering the write and the read","Each core's store buffer: the read runs before the core's own write is visible to the other core","<code>javac<\/code> reordering the two statements","The garbage collector moving the objects between the write and the read"],"answer":1,"why":"<code>-Xint<\/code> disables the JIT, so compiler reordering is ruled out, and <code>javac<\/code> keeps statement order. What's left is the hardware: a write waits in the store buffer while the next read goes ahead. A volatile write drains the buffer first, which is why the volatile count is 0.","from":null},{"q":"A stop-flag loop hangs with the JIT on and stops under <code>-Xint<\/code>. What is the best explanation?","options":["The worker's CPU cache never receives the new value","The compiled loop read the field once and keeps using a register copy","The interpreter runs on a single core, so there is no second cache","The main thread's write is still sitting in its store buffer"],"answer":1,"why":"Caches and store buffers are identical in both runs, so they can't explain the difference. Only the JIT changes. C2 hoisted the read out of the loop, which as-if-serial allows for a plain field. A store buffer drains in nanoseconds, so it can't cause a hang.","from":null},{"q":"<code>FxRateBoard<\/code> writes <code>rates = map; ready = true;<\/code> and readers spin <code>while (!ready) {}<\/code> and then return <code>rates<\/code>. Which change makes it correct?","options":["Make <code>rates<\/code> volatile and leave <code>ready<\/code> plain","Make <code>ready<\/code> volatile and leave <code>rates<\/code> plain","Add <code>Thread.onSpinWait()<\/code> inside the loop","Swap the two lines in <code>pu
