tform thread","The read throws <code>IllegalStateException<\/code> because boundedElastic is non-blocking"],"answer":1,"why":"On JDK 21 to 23, a virtual thread that blocks while holding a monitor can't unmount, so it holds its carrier (JDK 24 removed that limit, JEP 491). Reactor doesn't intervene. boundedElastic threads, virtual or not, are allowed to block, so there is no <code>IllegalStateException<\/code> either.","from":"vt-04"}],"cards":[{"front":"With no scheduler anywhere, which thread runs a Reactor chain?","back":"<p>The thread that called <code>subscribe()<\/code>. After a timer or an async client, the thread that delivered the item.<\/p>"},{"front":"What does <code>publishOn(s)<\/code> change?","back":"<p>The thread of every operator after it (until the next <code>publishOn<\/code>), using one worker of <code>s<\/code>.<\/p>"},{"front":"What does <code>subscribeOn(s)<\/code> change?","back":"<p>The thread of the subscription and request calls on their way up, so the source runs on <code>s<\/code>, wherever <code>subscribeOn<\/code> is written.<\/p>"},{"front":"Two <code>subscribeOn<\/code> calls in one chain: which one decides where the source runs?","back":"<p>The one nearest the source. The other only adds a thread hop.<\/p>"},{"front":"How do you wrap a blocking call in Reactor?","back":"<p><code>Mono.fromCallable(() -&gt; blockingCall()).subscribeOn(Schedulers.boundedElastic())<\/code><\/p>"},{"front":"<code>flatMap(x -&gt; Mono.fromCallable(...))<\/code> followed by <code>.subscribeOn(boundedElastic())<\/code>: do the calls run concurrently?","back":"<p>No. They run in turn on one boundedElastic thread. Put <code>subscribeOn<\/code> on each inner Mono.<\/p>"},{"front":"<code>Mono.delay(d).map(x -&gt; other.block())<\/code>: what happens?","back":"<p><code>IllegalStateException<\/code>: <code>block()<\/code> is not supported on the parallel thread where the timer fired. Use <code>flatMap<\/code>.<\/p>"}],"terms":[{"term":"Scheduler","plain":"Reactor's source of threads, like an ExecutorService that is also a clock."},{"term":"publishOn","plain":"Moves the operators after it onto a scheduler's thread."},{"term":"subscribeOn","plain":"Moves the subscription, and so the source, onto a scheduler's thread."},{"term":"boundedElastic","plain":"The shared scheduler for blocking calls: up to 10 threads per core, then a bounded queue."},{"term":"parallel scheduler","plain":"The shared scheduler with one thread per core, for CPU work and timers. Never block on it."},{"term":"Non-blocking thread","plain":"A thread marked with Reactor's <code>NonBlocking<\/code> interface; <code>block()<\/code> throws on it."},{"term":"BlockHound","plain":"A Java agent from the Reactor team that detects blocking calls on non-blocking threads."}],"remote":true},"rx-07":{"id":"rx-07","track":"rx","n":7,"title":"Backpressure in practice","ready":true,"minutes":35,"goal":"By the end you can read the demand an operator sends upstream, cap it with limitRate, pick an explicit loss policy (buffer, drop, latest or error) for a source that can't slow down, and use flatMap's concurrency to protect the services you call.","quiz":[{"q":"A nightly export does <code>cursor.rows().limitRate(100).concatMap(upload)<\/code>. What requests does the cursor receive?","options":["One request for <code>Long.MAX_VALUE<\/code>","100, then 75 at a time","100, then nothing: <code>limitRate<\/code> stops after 100 rows","1 at a time, because of <code>concatMap<\/code>"],"answer":1,"why":"<code>limitRate(100)<\/code> requests 100 and tops up by 75 each time 75 have been delivered, however much the downstream asks for. Unlike <code>take(100)<\/code>, it never ends the stream early. <code>concatMap<\/code> asks <code>limitRate<\/code> for one item at a time, but <code>limitRate<\/code> decides what reaches the cursor.","from":null},{"q":"A pricing screen shows the live EUR/USD rate from a feed that ticks 200 times a second. The screen redraws 10 times a second. Which policy fits?","options":["<code>onBackpressureBuffer()<\/code>","<code>onBackpressureBuffer(1_000)<\/code>","<code>onBackpressureDrop()<\/code>","<code>onBackpressureLatest()<\/code>"],"answer":3,"why":"A rate is a value where newer replaces older: when the screen asks, it wants the newest tick. <code>onBackpressureDrop<\/code> would show whichever tick arrives after the screen asks, which is fresh too, but it may wait for the next tick and it throws away the newest one on hand. Both buffers would show stale rates, in order, getting further behind.","from":null},{"q":"Audit events arrive from a source that can't slow down. None may be lost silently, and bursts of a few hundred are normal. Which line fits best?","options":["<code>events.onBackpressureBuffer()<\/code>","<code>events.onBackpressureBuffer(1_000, e -&gt; log.error(\"audit overflow at {}\", e.id()))<\/code>","<code>events.onBackpressureLatest()<\/code>","<code>events.limitRate(100)<\/code>"],"answer":1,"why":"A bounded buffer absorbs the normal bursts, and if the subscriber falls further behind, it cancels the source, logs the overflowing event and ends with an overflow error, so the gap is visible. The unbounded buffer never reports anything until memory runs out. <code>onBackpressureLatest<\/code> loses events silently. <code>limitRate<\/code> changes requests, which a source that ignores demand doesn't read.","from":null},{"q":"<code>Flux.fromIterable(payments).flatMap(bank::settle)<\/code> runs 300 settlements. The bank allows 20 open requests per client and answers the rest with 429. What happens, and what is the fix?","options":["All 300 settle, just more slowly; no fix needed","<code>flatMap<\/code> opens up to 256 calls at once, most get a 429, and the first error can end the stream; use <code>flatMap(bank::settle, 20)<\/code>","<code>flatMap<\/code> opens one call at a time; use <code>flatMap(bank::settle, 20)<\/code> to speed it up","Add <code>limitRate(20)<\/code> before <code>flatMap<\/code>"],"answer":1,"why":"The default concurrency is 256, so far more than 20 requests are open at once, and an unhandled 429 is a terminal error. Capping <code>flatMap<\/code> at 20 matches the bank. <code>limitRate(20)<\/code> only changes how many payments are requested from the list at a time; <code>flatMap<\/code> would still subscribe to as many calls as it has payments, up to 256.","from":null},{"q":"From \"Sizing a pool: CPU-bound, IO-bound and Little's law\": <code>flatMap(bank::settle, 20)<\/code> and each call takes 50 ms. What is the most this can settle per second?","options":["20","50","400","1,000"],"answer":2,"why":"Little's law: in flight = rate x time, so rate = 20 / 0.05 s = 400 per second. To go faster you need more open requests (if the bank allows them) or faster calls. A per-second quota from the bank is a separate limit that a concurrency cap doesn't enforce.","from":"exec-03"}],"cards":[{"front":"What does <code>subscribe(consumer)<\/code> request from the source?","back":"<p><code>Long.MAX_VALUE<\/code>: unbounded demand, unless an operator in between reshapes it.<\/p>"},{"front":"<code>Flux.range(1, 40).limitRate(10)<\/code>: what does the range see?","back":"<p><code>request(10)<\/code>, then <code>request(8)<\/code> five times: it tops up by 75% of the batch.<\/p>"},{"front":"<code>limitRate(100)<\/code> vs <code>take(100)<\/code>?","back":"<p><code>limitRate<\/code> caps each request and still delivers every item. <code>take<\/code> caps the request and ends the stream after 100.<\/p>"},{"front":"Does <code>onBackpressureDrop<\/code> (or <code>Buffer<\/code>, <code>Latest<\/code>) slow the source down?","back":"<p>No. They all request unbounded upstream and decide what to do with items nobody asked for.<\/p>"},{"front":"A slow subscriber finally requests 1. What does it get from <code>onBackpressureLatest<\/code> vs <code>onBackpressureDrop<\/code>?","back":"<p>Latest: the newest item that arrived while it wasn't asking. Drop: nothing until the next item arrives after the request.<\/p>"},{"front":"What happens when <code>onBackpressureBuffer(1000)<\/code> overflows?","back":"<p>It cancels the source, and after the subscriber drains the 1,000 held items, it ends with an overflow error.<\/p>"},{"front":"What is <code>Flux.create<\/code>'s default overflow strategy?","back":"<p><code>BUFFER<\/code>: unbounded. Pass a <code>FluxSink.OverflowStrategy<\/code> (DROP, LATEST, ERROR) to choose.<\/p>"}],"terms":[{"term":"Demand","plain":"How many more items a subscriber has asked for with <code>request(n)<\/code> and not yet received."},{"term":"Unbounded demand","plain":"A request of <code>Long.MAX_VALUE<\/code>: send everything, as fast as you can."},{"term":"limitRate","plain":"An operator that splits downstream demand into batches of n requested from upstream."},{"term":"Loss policy","plain":"Buffer, drop, keep the latest, or fail: what to do with items a source pushes without demand."},{"term":"OverflowException","plain":"Reactor's error for more items than were requested, from a source or a full bounded buffer."},{"term":"Concurrency cap","plain":"The most inner publishers <code>flatMap<\/code> subscribes at once; 256 by default."}],"remote":true},"rx-08":{"id":"rx-08","track":"rx","n":8,"title":"Hot and cold publishers, Sinks, and StepVerifier","ready":true,"minutes":40,"goal":"By the end you can share one source between many subscribers with the right late-subscriber behaviour, push values in from many threads with Sinks without losing any, test timing with StepVerifier and virtual time, find a failing operator with checkpoint and log, and say when Reactor is still the right tool.","quiz":[{"q":"Two Kafka listener threads call <code>sink.tryEmitNext(event)<\/code> on the same <code>Sinks.many().multicast()<\/code> sink at the same moment, and ignore the return value. What can happen?","options":["Both events are emitted, in some order","One call returns <code>FAIL_NON_SERIALIZED<\/code> and its event is never emitted","The sink buffers the second event and emits it later","The sink throws <code>ConcurrentModificationException<\/code>"],"answer":1,"why":"Reactor sinks detect concurrent emission and refuse it instead of blocking or queueing, so one of the two calls gets <code>FAIL_NON_SERIALIZED<\/code>. Ignoring the result loses that event silently. Use <code>emitNext(event, EmitFailureHandler.busyLooping(...))<\/code>, which retries, or serialize the calls.","from":null},{"q":"A test reads <code>StepVerifier.create(service.refund(\"p-1\")).expectNext(\"REFUNDED\").expectComplete();<\/code> and passes. The refund code is in fact broken. Why does the test pass?","options":["<code>expectComplete()<\/code> ignores the value","Nothing subscribes until <code>verify()<\/code> is called, so no expectation is ever checked","StepVerifier only fails on errors, not on wrong values","The refund runs on another thread, so its result arrives after the test ends"],"answer":1,"why":"<code>expectComplete()<\/code> only adds a step to the script. <code>verify()<\/code>, or a shortcut like <code>verifyComplete()<\/code>, is what subscribes and runs it. Add <code>.verify(Duration.ofSeconds(1))<\/code> and the test checks the value and fails if it hangs.","from":null},{"q":"Dashboards share one FX provider connection. A dashboard that opens late must show the current rate at once, and the connection must close when nobody watches. Which operator fits?","options":["<code>rates.share()<\/code>","<code>rates.cache()<\/code>","<code>rates.replay(1).refCount()<\/code>","<code>rates.publish().autoConnect(1)<\/code>"],"answer":2,"why":"<code>replay(1)<\/code> gives a late subscriber the latest rate, and <code>refCount()<\/code> connects on the first subscriber and cancels upstream when the last one leaves. <code>share()<\/code> gives late subscribers nothing until the next tick. <code>cache()<\/code> and <code>autoConnect<\/code> never disconnect, and <code>cache()<\/code> also keeps every rate forever.","from":null},{"q":"A team runs a Spring MVC service on JDBC that meets its latency targets. Someone proposes rewriting it with WebFlux \"to make it faster\". What do Spring's own docs say?","options":["Rewrite it: reactive code is faster for every workload","If an MVC application works fine there is no need to change; reactive doesn't generally make applications faster","Rewrite only the JDBC calls with Reactor and keep the controllers","Switch to WebFlux but keep JDBC on the event loop"],"answer":1,"why":"The Spring reference says a working MVC application has no need to change, that blocking persistence APIs like JDBC point to MVC, and that reactive and non-blocking generally don't make applications run faster. With virtual threads, the thread-count argument for this kind of service is mostly gone too. The last option is the worst of both: JDBC on an event loop blocks every request it serves.","from":null},{"q":"From \"Errors, retries and timeouts\": a retry uses <code>Retry.backoff(3, Duration.ofMillis(200))<\/code> with the default jitter. How should its virtual-time test check the slow path?","options":["<code>expectNoEvent<\/code> for exactly 1,400 ms, then expect the fallback","Advance the clock well past the longest possible total wait, then check the result and the number of attempts","Use real time with <code>Thread.sleep(2_000)<\/code> so the jitter is realistic","It can't be tested while jitter is on"],"answer":1,"why":"With jitter each wait moves by up to half its length, so exact times are not fixed. Advancing well past the maximum (the worked example used 10 seconds) and then asserting the outcome and the count is stable. Exact-time assertions need <code>jitter(0)<\/code>. Real sleeps make the test slow and still flaky.","from":"rx-05"}],"cards":[{"front":"What is <code>share()<\/code> the same as, and what does a late subscriber get?","back":"<p><code>publish().refCount()<\/code>. A late subscriber gets only items emitted after it subscribed.<\/p>"},{"front":"Late subscriber on <code>replay(1).refCount()<\/code>: what does it get?","back":"<p>The most recent item at once, then the live ones. The upstream is cancelled when the last subscriber leaves.<\/p>"},{"front":"Two threads call <code>tryEmitNext<\/code> on one sink at the same moment. What can happen?","back":"<p>One gets <code>EmitResult.FAIL_NON_SERIALIZED<\/code> and its item is not emitted. Check the result or use <code>emitNext(item, busyLooping(...))<\/code>.<\/p>"},{"front":"What happens to <code>Sinks.many().multicast().onBackpressureBuffer()<\/code> when its last subscriber leaves?","back":"<p>By default it shuts down: a later subscriber just receives <code>onComplete<\/code>. <code>directBestEffort()<\/code> keeps working.<\/p>"},{"front":"A <code>StepVerifier<\/code> chain without <code>verify()<\/code>: what runs?","back":"<p>Nothing. <code>verify()<\/code> (or <code>verifyComplete()<\/code> etc.) is what subscribes and checks the steps.<\/p>"},{"front":"Why must the publisher be built inside the <code>withVirtualTime<\/code> supplier?","back":"<p>Operators like <code>delay<\/code>, <code>interval<\/code> and <code>timeout<\/code> pick their scheduler at assembly. Built earlier, they use the real clock and the test hangs.<\/p>"},{"front":"What does <code>checkpoint(\"fee-row\")<\/code> add to an error?","back":"<p>A suppressed exception saying the error was observed at the checkpoint named <code>fee-row<\/code>. Cheap; <code>checkpoint(name, true)<\/code> also captures the assembly stack trace.<\/p>"}],"terms":[{"term":"Hot publisher","plain":"A publisher that produces whether or not anyone subscribes; subscribers see what is produced while they listen."},{"term":"ConnectableFlux","plain":"What <code>publish()<\/code> and <code>replay()<\/code> return: a shared Flux that subscribes to its source when it is connected."},{"term":"refCount","plain":"Connect on the first subscriber, disconnect when the last one leaves (optionally after a grace period)."},{"term":"Sink","plain":"Reactor's thread-aware way to push values from ordinary code into a Flux or Mono."},{"term":"StepVerifier","plain":"reactor-test's tool that subscribes to a publisher and checks its signals step by step."},{"term":"Virtual time","plain":"A fake clock that replaces Reactor's schedulers in a test, so delays pass instantly."},{"term":"checkpoint","plain":"An operator that labels a place in a chain so errors passing through it say where they came from."}],"remote":true},"co-01":{"id":"co-01","track":"co","n":1,"title":"Suspend functions from zero","ready":true,"minutes":35,"goal":"By the end you can say what <code>suspend<\/code> really does (and what it does not), read the state machine the compiler builds from a suspend function, and wrap a callback API in a cancellable suspend function.","quiz":[{"q":"This runs on one thread: <code>runBlocking { repeat(3) { launch { Thread.sleep(100) } } }<\/code>. About how long does it take?","options":["About 100 ms, because the three coroutines run concurrently","About 300 ms, because each sleep blocks the only thread","About 0 ms, because launch returns at once","It does not compile: Thread.sleep is not allowed in a coroutine"],"answer":1,"why":"<code>Thread.sleep<\/code> blocks the thread, and <code>runBlocking<\/code> gives all three coroutines one thread, so they sleep one after another. With <code>delay(100)<\/code> they would overlap and finish in about 100 ms. The compiler happily accepts <code>Thread.sleep<\/code> here, which is why the bug survives code review.","from":null},{"q":"<code>suspend fun parseStatement(json: String): Statement<\/code> is pure CPU work with no suspending calls. A request coroutine on thread <code>worker-2<\/code> calls it. Which thread runs the parsing?","options":["<code>worker-2<\/code>, the caller's thread","A thread from <code>Dispatchers.IO<\/code>","A new background thread for each call","The thread is chosen at random by the JVM"],"answer":0,"why":"A suspend function that never suspends is ordinary code on the caller's thread. <code>suspend<\/code> does not move work anywhere. To run CPU work elsewhere you'd switch dispatcher explicitly with <code>withContext(Dispatchers.Default)<\/code>, which lesson 4 of this track covers.","from":null},{"q":"How does <code>suspend fun balance(accountId: String): Long<\/code> look to a Java caller?","options":["<code>long balance(String accountId)<\/code>","<code>CompletableFuture&lt;Long&gt; balance(String accountId)<\/code>","<code>Object balance(String accountId, Continuation&lt;? super Long&gt; continuation)<\/code>","<code>void balance(String accountId, Consumer&lt;Long&gt; callback)<\/code>"],"answer":2,"why":"The compiler adds a <code>Continuation<\/code> as the last parameter and changes the return type to <code>Object<\/code>, which holds either the result (boxed) or <code>COROUTINE_SUSPENDED<\/code>. That is why Java code can't simply call suspend functions; lesson 11 of this track shows the bridges (<code>future {}<\/code>).","from":null},{"q":"A callback SDK is wrapped with <code>suspendCoroutine<\/code> (not the cancellable version). The caller runs <code>withTimeout(200) { sdk.callAwait() }<\/code> and the SDK answers after 3 seconds. What happens?","options":["<code>TimeoutCancellationException<\/code> at 200 ms, and the SDK call is cancelled","The call returns the SDK's value after 3 seconds; the timeout is ignored","<code>IllegalStateException<\/code>, because the continuation was resumed twice","The coroutine stays suspended until the SDK answers at 3 s, then throws <code>TimeoutCancellationException<\/code>; the SDK is never told"],"answer":3,"why":"The timeout cancels the coroutine at 200 ms, but a non-cancellable continuation cannot wake up until it is resumed. When the SDK answers at 3 s, the coroutine finds itself cancelled and throws. <code>suspendCancellableCoroutine<\/code> would resume at 200 ms and run <code>invokeOnCancellation<\/code>, where you cancel the SDK call.","from":null},{"q":"From the virtual threads track: a virtual thread calls <code>Thread.sleep(200)<\/code>. What happens to its carrier thread?","options":["The carrier is blocked for the full 200 ms","The virtual thread unmounts, and the carrier is free to run other virtual threads","The JVM creates a new carrier to replace it","<code>sleep<\/code> throws, because virtual threads cannot sleep"],"answer":1,"why":"When a virtual thread blocks in <code>sleep<\/code>, the JVM saves its stack and unmounts it, so the carrier runs other virtual threads. It is the same idea as a coroutine suspending, done by the JVM for any blocking call instead of by the Kotlin compiler for <code>suspend<\/code> calls.","from":"vt-02"}],"cards":[{"front":"Does <code>suspend<\/code> run a function on a background thread?","back":"<p>No. It only lets the function pause without blocking. The dispatcher decides the thread, and a suspend function that never suspends runs on its caller's thread.<\/p>"},{"front":"Inside a coroutine, what is the difference between <code>delay(200)<\/code> and <code>Thread.sleep(200)<\/code>?","back":"<p><code>delay<\/code> suspends the coroutine and frees the thread for others. <code>Thread.sleep<\/code> blocks the thread, so every coroutine waiting for that thread waits too.<\/p>"},{"front":"What does the compiler add to a suspend function's signature?","back":"<p>A <code>Continuation&lt;T&gt;<\/code> as the last parameter. The return type becomes <code>Any?<\/code> (<code>Object<\/code> in Java).<\/p>"},{"front":"What does a compiled suspend function return when it pauses?","back":"<p>The marker <code>COROUTINE_SUSPENDED<\/code>. The real result arrives later through <code>continuation.resumeWith(...)<\/code>.<\/p>"},{"front":"Where does a suspended coroutine keep its local variables?","back":"<p>In fields (<code>L$0<\/code>, <code>L$1<\/code>, ...) of a small state-machine object on the heap, next to an <code>int label<\/code> that says which state runs next.<\/p>"},{"front":"Why wrap a callback with <code>suspendCancellableCoroutine<\/code> and not <code>suspendCoroutine<\/code>?","back":"<p>Only the cancellable one reacts to cancellation: it resumes the caller at once with <code>CancellationException<\/code> and runs <code>invokeOnCancellation<\/code>, where you cancel the underlying call.<\/p>"},{"front":"A callback fires after its coroutine was cancelled. What happens to <code>cont.resume(value)<\/code>?","back":"<p>It is ignored (prompt cancellation guarantee). If the value is a resource, pass a cleanup lambda: <code>cont.resume(value) { _, v, _ -&gt; v.close() }<\/code>.<\/p>"}],"terms":[{"term":"Coroutine","plain":"One running piece of work that can pause and resume later, without holding a thread while paused."},{"term":"Suspend function","plain":"A function marked <code>suspend<\/code>. It may pause at suspending calls and can only be called from a coroutine or another suspend function."},{"term":"Suspension point","plain":"A call to a suspend function, where the caller may pause. It does not always pause, for example on a cache hit."},{"term":"Continuation","plain":"The object that knows how to resume a paused coroutine: its context plus <code>resumeWith(result)<\/code>."},{"term":"COROUTINE_SUSPENDED","plain":"The marker a compiled suspend function returns to say it paused and will resume through the continuation."},{"term":"Continuation-passing style","plain":"Compiling a function so it receives \"what to do next\" as an extra parameter, instead of returning to a waiting caller."},{"term":"Dispatcher","plain":"The scheduler that decides which thread runs a coroutine, and which thread it resumes on."}],"remote":true},"co-02":{"id":"co-02","track":"co","n":2,"title":"Builders: launch, async, runBlocking, coroutineScope","ready":true,"minutes":35,"goal":"By the end you can pick the right builder for a job (launch, async, coroutineScope or runBlocking), and split one request into concurrent calls that take as long as the slowest call.","quiz":[{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">runBlocking<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">launch<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"X\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Y\"<\/span><span class=\"p\">)<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>","options":["X then Y","Y then X","Either order, it changes from run to run","Only Y; the launched coroutine never runs"],"answer":1,"why":"<code>launch<\/code> schedules its block on <code>runBlocking<\/code>'s single thread and returns. That thread is still running the outer block, so <code>Y<\/code> prints first. The child runs when the outer block finishes, and <code>runBlocking<\/code> waits for it before returning. Order is deterministic here because there is only one thread.","from":null},{"q":"<p>About how long does this take?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">coroutineScope<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">async<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">300<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"m\">1<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">b<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">async<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">200<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"m\">2<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">a<\/span><span class=\"p\">.<\/span><span class=\"na\">await<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">b<\/span><span class=\"p\">.<\/span><span class=\"na\">await<\/span><span class=\"p\">()<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>","options":["About 200 ms","About 500 ms","About 300 ms","About 0 ms, because async returns at once"],"answer":2,"why":"Both children start before the first <code>await<\/code>, so the delays overlap and the total is the longer one. 500 ms would be the sequential version. <code>async<\/code> does return at once, but <code>await<\/code> and the scope both wait for the children.","from":null},{"q":"<p><code>fetchA<\/code> takes 300 ms and <code>fetchB<\/code> 200 ms. How long does this take?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">async<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">fetchA<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">}.<\/span><span class=\"na\">await<\/span><span class=\"p\">()<\/span>\n<span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">b<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">async<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">fetchB<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">}.<\/span><span class=\"na\">await<\/span><span class=\"p\">()<\/span>\n<\/code><\/pre>","options":["About 500 ms: each await finishes before the next async starts","About 300 ms: async runs them in parallel","About 200 ms","It does not compile, because await must be called later"],"answer":0,"why":"Calling <code>await()<\/code> right after <code>async<\/code> waits for that child before the next line runs, so nothing overlaps. Keep the <code>Deferred<\/code> values and await them after starting both.","from":null},{"q":"A suspend handler must publish a <code>PaymentCaptured<\/code> event and write an audit row, at the same time. It needs neither result, but it must not return until both are done. Which fits?","options":["<code>GlobalScope.launch { publish() }; GlobalScope.launch { audit() }<\/code>","<code>runBlocking { launch { publish() }; launch { audit() } }<\/code>","<code>publish(); audit()<\/code>","<code>coroutineScope { launch { publish() }; launch { audit() } }<\/code>"],"answer":3,"why":"<code>coroutineScope<\/code> with two <code>launch<\/code> children runs them concurrently and returns only when both finish. <code>GlobalScope<\/code> returns at once and leaks the work. <code>runBlocking<\/code> blocks the handler's thread. Two plain calls are correct but sequential.","from":null},{"q":"From the executors track: <code>CompletableFuture.allOf(a, b, c)<\/code>. <code>b<\/code> fails after 10 ms, while <code>a<\/code> and <code>c<\/code> take one second. When does the <code>allOf<\/code> future complete?","options":["As soon as <code>b<\/code> fails, after about 10 ms","When all three have completed, after about one second, exceptionally","After about one second, normally, with <code>b<\/code>'s result left out","Never: <code>allOf<\/code> hangs when one future fails"],"answer":1,"why":"<code>allOf<\/code> completes when all of its futures complete, and it completes exceptionally if any of them did. It does not cancel <code>a<\/code> and <code>c<\/code> when <code>b<\/code> fails. Compare <code>coroutineScope<\/code> with <code>awaitAll()<\/code>, which fails at 10 ms and cancels the two remaining children.","from":"exec-07"}],"cards":[{"front":"What does <code>launch<\/code> return, and where does its exception go?","back":"<p>A <code>Job<\/code>, with no result. If the coroutine fails, the exception goes to its parent, not to whoever holds the Job.<\/p>"},{"front":"What does <code>async<\/code> return?","back":"<p>A <code>Deferred&lt;T&gt;<\/code>: a Job that will hold a value. <code>await()<\/code> suspends until it is ready, then returns it or rethrows the failure.<\/p>"},{"front":"<code>val a = async { f() }.await(); val b = async { g() }.await()<\/code>: concurrent or sequential?","back":"<p>Sequential. Each <code>await<\/code> finishes before the next <code>async<\/code> starts. Start both, then await.<\/p>"},{"front":"<code>awaitAll()<\/code> vs <code>map { it.await() }<\/code>?","back":"<p>Same results in the same order, but <code>awaitAll<\/code> fails as soon as any deferred fails. The <code>map<\/code> version notices only when it reaches the failed one.<\/p>"},{"front":"When does <code>coroutineScope { ... }<\/code> return?","back":"<p>After its block and every child started inside it have finished. If a child fails, it cancels the others and rethrows.<\/p>"},{"front":"Where is <code>runBlocking<\/code> allowed?","back":"<p>At blocking edges: <code>main<\/code>, tests and blocking framework callbacks. Never inside suspend code, where it holds the thread and ignores the caller's context.<\/p>"}],"terms":[{"term":"Coroutine builder","plain":"A function that starts a coroutine, such as <code>launch<\/code>, <code>async<\/code>, <code>runBlocking<\/code> or <code>coroutineScope<\/code>."},{"term":"Job","plain":"A handle to a coroutine's lifecycle: check it, join it, cancel it. It holds no value."},{"term":"Deferred","plain":"A Job that will also hold a result. <code>await()<\/code> returns it or rethrows the failure."},{"term":"CoroutineScope","plain":"The thing you call <code>launch<\/code> and <code>async<\/code> on. It supplies the parent Job and context for new coroutines."},{"term":"Concurrent decomposition","plain":"Splitting one task into independent calls, starting them together, and combining their results."},{"term":"Event loop","plain":"The queue of coroutines that <code>runBlocking<\/code> runs one at a time on the thread it blocks."}],"remote":true},"co-03":{"id":"co-03","track":"co","n":3,"title":"Structured concurrency: scopes, jobs and the tree","ready":true,"minutes":35,"goal":"By the end you can draw the job tree for a piece of coroutine code, predict what a failure or a cancel does to it, spot leaked work, and give a class that starts background work a scope it owns and closes.","quiz":[{"q":"<p>What happens here?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">coroutineScope<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">launch<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">100<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"n\">IOException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"down\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">launch<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">1<\/span><span class=\"n\">_000<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"done\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>","options":["<code>done<\/code> prints at 1 s, then the scope throws <code>IOException<\/code>","The <code>IOException<\/code> is printed by the uncaught handler and the scope returns normally","At about 100 ms the second child is cancelled, <code>done<\/code> never prints, and the scope throws <code>IOException<\/code>","The scope returns normally at 1 s, because <code>launch<\/code> swallows exceptions"],"answer":2,"why":"The failed child cancels the scope's job, which cancels its sibling. The scope waits for the sibling to stop, then rethrows the original exception to its caller. Nothing waits for the full second.","from":null},{"q":"A child coroutine ends by throwing <code>CancellationException<\/code>. What happens to its parent and its siblings?","options":["Nothing: the child counts as cancelled, and the parent is not notified","The parent is cancelled, and so are the siblings","The parent rethrows the <code>CancellationException<\/code> to its caller","The siblings are cancelled, but the parent keeps running"],"answer":0,"why":"A <code>CancellationException<\/code> means \"I was cancelled\", not \"I failed\". The child cancels its own children, but the parent keeps going. Only other exceptions travel up. Lesson 5 of this track shows why that makes swallowing it dangerous.","from":null},{"q":"A request handler calls <code>GlobalScope.launch { reconcile(batch) }<\/code> and returns. A minute later the service shuts down while the reconciliation is still running. What stops the reconciliation?","options":["The request's scope, which cancels it when the response is sent","Quarkus, which cancels all coroutines on shutdown","<code>runBlocking<\/code> at the top of the call stack","Nothing in coroutines: it runs until it finishes or the JVM exits"],"answer":3,"why":"A <code>GlobalScope<\/code> coroutine has no parent, so no lifecycle reaches it. It stops when it finishes, or when the JVM dies, possibly halfway through. If it must be stopped cleanly, it needs an owner with a scope that is cancelled on shutdown.","from":null},{"q":"A Kafka partition worker starts a background flush loop when its partition is assigned. Where should the loop's coroutine live?","options":["In <code>GlobalScope<\/code>, because it outlives any single record","In a scope owned by the partition worker, cancelled and joined in <code>onPartitionsRevoked<\/code>","In <code>runBlocking<\/code> on the consumer's poll thread","In a new <code>CoroutineScope(Dispatchers.IO)<\/code> created inside the assignment callback"],"answer":1,"why":"The loop lives exactly as long as the partition assignment, so the worker for that partition should own the scope and cancel it when the partition is revoked. A new scope created in the callback has no owner and leaks like <code>GlobalScope<\/code>. <code>runBlocking<\/code> would block the poll thread.","from":null},{"q":"<p>From lesson 2 of this track: what does this return, and when?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">coroutineScope<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">launch<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">200<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"m\">42<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>","options":["42, at once, because <code>launch<\/code> returns immediately","42, after about 200 ms, when the child finishes","Unit, because the last expression is <code>launch<\/code>","It never returns, because nobody joins the child"],"answer":1,"why":"The block's value is 42, but <code>coroutineScope<\/code> returns only after every child has completed. You don't need <code>join<\/code>: waiting for children is the scope's job.","from":"co-02"}],"cards":[{"front":"When does a parent coroutine complete?","back":"<p>Only after its own block and all of its children have completed.<\/p>"},{"front":"In a regular <code>coroutineScope<\/code>, one child throws <code>IOException<\/code>. What happens?","back":"<p>The scope is cancelled, which cancels the other children. The scope waits for them to stop, then rethrows the <code>IOException<\/code> to its caller.<\/p>"},{"front":"A child ends with <code>CancellationException<\/code>. Is its parent cancelled?","back":"<p>No. It counts as cancelled, not failed, so the parent is not notified.<\/p>"},{"front":"Which direction does cancellation travel in the job tree?","back":"<p>Down only. Cancelling a parent cancels all of its children; cancelling a child leaves the parent alone.<\/p>"},{"front":"Why is <code>GlobalScope.launch<\/code> in a request handler a leak?","back":"<p>The coroutine has no parent: nothing waits for it, nothing cancels it when the request ends, and its failure goes to the uncaught exception handler.<\/p>"},{"front":"How should a class that starts background coroutines be structured?","back":"<p>Own one <code>CoroutineScope(context + Job())<\/code> as a field, launch into it, and cancel it (or <code>cancelAndJoin<\/code>) when the owner's lifecycle ends.<\/p>"}],"terms":[{"term":"Structured concurrency","plain":"Concurrent work forms a tree that matches the code: children can't outlive their parent, and failures and cancels follow the tree."},{"term":"Parent job","plain":"The job a new coroutine attaches to. It waits for its children and cancels them when it is cancelled."},{"term":"Child coroutine","plain":"A coroutine started in a scope. Its failure cancels its parent unless the parent is a supervisor."},{"term":"Scope","plain":"A coroutine context that holds a job. New coroutines started in it become that job's children."},{"term":"GlobalScope","plain":"A scope with no job. Coroutines started there have no parent and are not structured."},{"term":"Leaked coroutine","plain":"A coroutine that keeps running after everything that cared about it has gone."}],"remote":true},"co-04":{"id":"co-04","track":"co","n":4,"title":"Dispatchers and the coroutine context","ready":true,"minutes":35,"goal":"By the end you can say which thread a coroutine runs on and why, move blocking and CPU work to the right dispatcher with withContext, give a slow resource its own budget with limitedParallelism, and read and extend a coroutine context with +.","quiz":[{"q":"A Quarkus endpoint handles 10 concurrent requests on a 4-core pod. Each one runs <code>launch { repo.findPayment(id) }<\/code> (a blocking 300 ms JDBC call) in a scope whose dispatcher is Default. At that moment a coroutine on Default needs 1 ms of CPU to check a signature. When does it run?","options":["At once, because Default and IO are separate thread pools","Only once a Default thread finishes its blocking call, roughly 300 ms later","At once, because kotlinx.coroutines moves blocking calls to IO for you","Never: Default throws <code>IllegalStateException<\/code> when a thread blocks for too long"],"answer":1,"why":"All 4 Default threads are blocked inside JDBC calls, so the signature check waits in the queue until one returns. Nothing moves a blocking call for you, and nothing throws. Wrapping the query in <code>withContext(Dispatchers.IO)<\/code> keeps Default free.","from":null},{"q":"A nightly export makes 300 blocking calls to a reporting database whose pool has 100 connections. It must not slow down the service's other blocking calls. Which dispatcher fits?","options":["<code>Dispatchers.IO<\/code>","<code>Dispatchers.Default.limitedParallelism(100)<\/code>","<code>Dispatchers.IO.limitedParallelism(100, \"reports\")<\/code>","<code>Dispatchers.Unconfined<\/code>"],"answer":2,"why":"A view over IO caps the export at 100, and because IO views are elastic it adds to IO's 64 instead of using them up. Plain IO would let the export take all 64 threads. A view over Default can't exceed the core count, and Default must never block anyway.","from":null},{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">ctx<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">CoroutineName<\/span><span class=\"p\">(<\/span><span class=\"s\">\"a\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">Dispatchers<\/span><span class=\"p\">.<\/span><span class=\"na\">IO<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">CoroutineName<\/span><span class=\"p\">(<\/span><span class=\"s\">\"b\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"n\">ctx<\/span><span class=\"o\">[<\/span><span class=\"n\">CoroutineName<\/span><span class=\"o\">]?.<\/span><span class=\"na\">name<\/span><span class=\"p\">)<\/span>\n<\/code><\/pre>","options":["<code>b<\/code>","<code>a<\/code>","<code>a, b<\/code>","<code>null<\/code>, because the dispatcher replaced the name"],"answer":0,"why":"A context holds at most one element per key, and <code>+<\/code> lets the right side win. <code>CoroutineName(\"b\")<\/code> replaces <code>a<\/code>. The dispatcher has a different key, so it sits beside the name without touching it.","from":null},{"q":"Inside <code>withContext(Dispatchers.IO + CoroutineName(\"capture\")) { ... }<\/code> you call <code>launch(CoroutineName(\"refund\")) { ... }<\/code>. What does the child coroutine's context contain?","options":["Default and <code>refund<\/code>, because <code>launch<\/code> uses Default unless told otherwise","IO and <code>capture<\/code>, because the parent's context always wins","IO and <code>refund<\/code>, and the same <code>Job<\/code> as the <code>withContext<\/code> block","IO and <code>refund<\/code>, and a new <code>Job<\/code> that is a child of the block's job"],"answer":3,"why":"A child starts from its scope's context (IO and <code>capture<\/code>), then the builder's argument overrides it (<code>refund<\/code>), then it gets a fresh <code>Job<\/code> that is a child of the scope's job. The \"Default unless told\" rule only applies when the context has no dispatcher at all.","from":null},{"q":"From the executors track: each issuer call holds one of the issuer SDK's 20 connections. You give issuer calls their own pool of 64 threads. How many issuer calls can really make progress at once?","options":["64","20","84","One per core"],"answer":1,"why":"The smallest limit on the path is the real ceiling. The other 44 threads sit waiting for a connection. That is why the issuer's dispatcher in this lesson is a view of exactly 20.","from":"exec-03"}],"cards":[{"front":"How many threads does <code>Dispatchers.Default<\/code> have?","back":"<p>One per CPU core, and at least two.<\/p>"},{"front":"What is <code>Dispatchers.IO<\/code>'s default limit?","back":"<p>64 parallel blocking tasks, or the core count if that is larger. The <code>kotlinx.coroutines.io.parallelism<\/code> property changes it.<\/p>"},{"front":"Does <code>Dispatchers.IO.limitedParallelism(100)<\/code> take 100 of IO's 64 threads?","back":"<p>No. Views over IO are elastic and add to IO's budget: IO and the view together can run 64 + 100 blocking tasks.<\/p>"},{"front":"What does <code>withContext(Dispatchers.IO) { load() }<\/code> do to the calling coroutine?","back":"<p>It suspends the caller, runs <code>load()<\/code> on IO, then resumes the caller on its own dispatcher with the result.<\/p>"},{"front":"<code>ctx<\/code> holds <code>CoroutineName(\"a\")<\/code>. What name does <code>ctx + CoroutineName(\"b\")<\/code> hold?","back":"<p><code>b<\/code>. One element per key, and the right side of <code>+<\/code> wins.<\/p>"},{"front":"Why does a <code>ThreadLocal<\/code> read <code>null<\/code> after <code>withContext(Dispatchers.Default)<\/code>?","back":"<p>The block runs on another thread, which has its own value. Pass <code>threadLocal.asContextElement()<\/code> in the context to carry it along.<\/p>"},{"front":"In kotlinx.coroutines 1.11, which key looks up the dispatcher in a context?","back":"<p><code>ContinuationInterceptor<\/code>. Using <code>CoroutineDispatcher<\/code> as the key is deprecated.<\/p>"}],"terms":[{"term":"Dispatcher","plain":"The context element that decides which thread runs a coroutine each time it starts or resumes."},{"term":"Dispatchers.Default","plain":"The shared pool for CPU work: one thread per core, at least two."},{"term":"Dispatchers.IO","plain":"The shared pool for blocking calls: up to 64 at once by default, using the same threads as Default."},{"term":"limitedParallelism view","plain":"A dispatcher in front of another one that lets at most n of its tasks run at the same time. It owns no threads."},{"term":"withContext","plain":"Runs a block with a changed context (often another dispatcher) and returns its result to the caller."},{"term":"Coroutine context","plain":"The immutable set of elements a coroutine carries: job, dispatcher, name, exception handler, your own elements."},{"term":"Context element","plain":"One entry in a context, found by its key, usually the class's companion object."}],"remote":true},"co-05":{"id":"co-05","track":"co","n":5,"title":"Cancellation and timeouts","ready":true,"minutes":35,"goal":"By the end you can make CPU loops and blocking calls respond to cancellation, keep CancellationException flowing instead of swallowing it, run suspending cleanup after a cancel, and choose between withTimeout and withTimeoutOrNull.","quiz":[{"q":"<code>val job = scope.launch(Dispatchers.Default) { while (true) { digest.update(nextBlock()) } }<\/code>, where <code>nextBlock()<\/code> is a plain function. You call <code>job.cancelAndJoin()<\/code>. What happens?","options":["It returns at once, because <code>cancel<\/code> stops the coroutine","It returns after the current loop iteration","It never returns: the loop has no suspension point and never checks","The caller gets a <code>CancellationException<\/code> thrown from <code>cancelAndJoin<\/code>"],"answer":2,"why":"Nothing in the loop looks at the job, so the cancel request is never noticed, and <code>cancelAndJoin<\/code> waits forever. Add <code>ensureActive()<\/code> or <code>yield()<\/code> to the loop, or loop on <code>while (isActive)<\/code>.","from":null},{"q":"A coroutine was cancelled while it waited in <code>delay<\/code>. Its <code>finally<\/code> block must call the suspending <code>lease.release()<\/code>. Which line does that correctly?","options":["<code>try { lease.release() } catch (e: CancellationException) { }<\/code>","<code>withContext(NonCancellable) { lease.release() }<\/code>","<code>launch(NonCancellable) { lease.release() }<\/code>","<code>GlobalScope.launch { lease.release() }<\/code>"],"answer":1,"why":"Inside <code>withContext(NonCancellable)<\/code> suspension points don't throw, so the release runs to the end, and the cancel carries on afterwards. Catching the exception just loses the release. <code>launch(NonCancellable)<\/code> and <code>GlobalScope<\/code> both start a coroutine outside the tree that nothing waits for, so shutdown can finish before the release does.","from":null},{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">coroutineScope<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">launch<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">withTimeout<\/span><span class=\"p\">(<\/span><span class=\"m\">100<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">1<\/span><span class=\"n\">_000<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"done\"<\/span><span class=\"p\">)<\/span>\n<\/code><\/pre>","options":["<code>done<\/code>, after about 100 ms","Nothing: <code>coroutineScope<\/code> throws <code>TimeoutCancellationException<\/code>","<code>done<\/code>, after about 1,000 ms","Nothing: the program hangs"],"answer":0,"why":"<code>TimeoutCancellationException<\/code> is a <code>CancellationException<\/code>, so the child counts as cancelled, not failed, and the scope completes normally. If a timeout must fail the caller, write <code>withTimeoutOrNull(100) { ... } ?: error(\"timed out\")<\/code>.","from":null},{"q":"<code>withTimeout(500) { withContext(Dispatchers.IO) { Thread.sleep(3_000) } }<\/code>. How long does the caller wait, and what does it get?","options":["About 500 ms, then <code>TimeoutCancellationException<\/code>","About 500 ms, then <code>null<\/code>","About 3 s, then <code>TimeoutCancellationException<\/code>","About 3 s, then the block's result"],"answer":2,"why":"The timer fires at 500 ms and cancels the coroutine, but <code>Thread.sleep<\/code> doesn't see it. When the sleep ends, <code>withContext<\/code> checks, finds the job cancelled, and the timeout surfaces as the exception. <code>runInterruptible(Dispatchers.IO)<\/code> would interrupt the sleep at 500 ms.","from":null},{"q":"From the executors track: a task is blocked in <code>Thread.sleep(5_000)<\/code> when someone calls <code>future.cancel(true)<\/code> on it. What happens to the task?","options":["Nothing until the sleep ends, then it carries on","The thread is stopped and the task's <code>finally<\/code> blocks are skipped","The future completes normally with <code>null<\/code>","<code>sleep<\/code> throws <code>InterruptedException<\/code> at once, and the task can clean up and stop"],"answer":3,"why":"<code>cancel(true)<\/code> interrupts the worker thread, and <code>sleep<\/code> responds to interrupts by throwing. What the task does next is up to its code: restore the flag and stop, or swallow it and carry on. That is the Java version of <code>runInterruptible<\/code>.","from":"exec-04"}],"cards":[{"front":"Does <code>job.cancel()<\/code> stop a CPU loop with no suspend calls?","back":"<p>No. Cancellation is cooperative: the loop must call <code>ensureActive()<\/code> or <code>yield()<\/code>, or check <code>isActive<\/code>.<\/p>"},{"front":"What does a suspension point such as <code>delay<\/code> do in a cancelled coroutine?","back":"<p>It throws <code>CancellationException<\/code> at once, without suspending.<\/p>"},{"front":"Why is <code>runCatching { suspendCall() }<\/code> risky inside a coroutine?","back":"<p>It catches every <code>Throwable<\/code>, <code>CancellationException<\/code> included, so the coroutine carries on after it was cancelled. Rethrow <code>CancellationException<\/code>.<\/p>"},{"front":"How do you call a suspending cleanup function in <code>finally<\/code> after a cancel?","back":"<p><code>withContext(NonCancellable) { release() }<\/code><\/p>"},{"front":"On timeout, what do <code>withTimeout<\/code> and <code>withTimeoutOrNull<\/code> do?","back":"<p><code>withTimeout<\/code> throws <code>TimeoutCancellationException<\/code>, a subclass of <code>CancellationException<\/code>. <code>withTimeoutOrNull<\/code> returns <code>null<\/code>.<\/p>"},{"front":"Can <code>withTimeout<\/code> stop a <code>Thread.sleep(10_000)<\/code> inside it?","back":"<p>No. Blocking calls ignore cancellation. Wrap them in <code>runInterruptible(Dispatchers.IO) { ... }<\/code> so the thread is interrupted.<\/p>"},{"front":"<code>(1..1_000).asFlow().collect { ... }<\/code>: does each element check for cancellation?","back":"<p>No. <code>asFlow()<\/code> doesn't check. Add <code>.cancellable()<\/code>. A <code>flow { }<\/code> builder checks on every <code>emit<\/code>.<\/p>"}],"terms":[{"term":"Cooperative cancellation","plain":"Cancelling only asks; the code stops when it next checks or reaches a suspension point."},{"term":"Suspension point","plain":"A call to a suspend function such as <code>delay<\/code>, <code>await<\/code> or <code>withContext<\/code>. Library ones check for cancellation."},{"term":"CancellationException","plain":"The exception that carries a cancel through the coroutine's code. Catching it without rethrowing breaks cancellation."},{"term":"NonCancellable","plain":"A job that is always active. <code>withContext(NonCancellable)<\/code> lets cleanup suspend after a cancel."},{"term":"TimeoutCancellationException","plain":"What <code>withTimeout<\/code> throws. It is a <code>CancellationException<\/code>, so a parent treats it as a cancel, not a failure."},{"term":"runInterruptible","plain":"Runs blocking code on a dispatcher and interrupts its thread if the coroutine is cancelled."}],"remote":true},"co-06":{"id":"co-06","track":"co","n":6,"title":"Exceptions: launch vs async, SupervisorJob, handlers","ready":true,"minutes":35,"goal":"By the end you can predict where a coroutine's exception goes (parent, await or handler), let independent work fail alone with a supervisor, put a CoroutineExceptionHandler where it actually runs, and spot the launch(SupervisorJob()) trap.","quiz":[{"q":"<p>What happens here?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">coroutineScope<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">async<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">100<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"n\">IOException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"risk down\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">1<\/span><span class=\"n\">_000<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"after\"<\/span><span class=\"p\">)<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>","options":["<code>after<\/code> prints at 1 s, and the exception is lost because nobody awaited the <code>Deferred<\/code>","<code>after<\/code> never prints; at about 100 ms <code>coroutineScope<\/code> throws the <code>IOException<\/code>","<code>after<\/code> prints at 1 s, then <code>coroutineScope<\/code> throws the <code>IOException<\/code>","The uncaught exception handler prints the error, and <code>after<\/code> prints at 1 s"],"answer":1,"why":"A failed <code>async<\/code> child cancels its parent immediately, exactly like <code>launch<\/code>. The scope's own <code>delay<\/code> is cancelled, <code>after<\/code> never prints, and the scope rethrows the child's exception. The \"waits in the Deferred\" behavior is only for supervisors and roots.","from":null},{"q":"<p>What does this do?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">handler<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">CoroutineExceptionHandler<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">_<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">log<\/span><span class=\"p\">.<\/span><span class=\"na\">warn<\/span><span class=\"p\">(<\/span><span class=\"s\">\"failed\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"n\">coroutineScope<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">launch<\/span><span class=\"p\">(<\/span><span class=\"n\">handler<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"n\">IOException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"webhook 503\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre>","options":["The handler logs the error and <code>coroutineScope<\/code> returns normally","The handler logs the error, then <code>coroutineScope<\/code> throws it too","The handler is ignored and <code>coroutineScope<\/code> throws the <code>IOException<\/code>","Nothing happens: the exception is swallowed by <code>launch<\/code>"],"answer":2,"why":"The <code>launch<\/code> is a child, and a child hands its exception to its parent. Only roots consult a handler, so this one is never called. The scope fails and rethrows the exception to its caller.","from":null},{"q":"A component sends merchant webhooks in the background for the whole life of the service. One failed webhook must not affect the others, failures must be logged, and shutdown must stop them. Which scope fits?","options":["<code>CoroutineScope(SupervisorJob() + Dispatchers.IO + handler)<\/code>, created once and cancelled on shutdown","<code>GlobalScope<\/code>, with <code>launch(handler)<\/code> for every webhook","<code>CoroutineScope(Job() + Dispatchers.IO)<\/code>, with <code>launch(SupervisorJob())<\/code> for every webhook","<code>supervisorScope { }<\/code> around each webhook, called from the request"],"answer":0,"why":"A supervisor scope you own lets each webhook fail alone, routes failures to the handler, and still reaches every child on shutdown. <code>GlobalScope<\/code> and <code>launch(SupervisorJob())<\/code> detach the webhooks so nothing can cancel them, and <code>supervisorScope<\/code> in the request makes the request wait for the merchant.","from":null},{"q":"<p>No handler is installed anywhere. What happens?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">supervisorScope<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">launch<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"n\">IOException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"sms down\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">launch<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">delay<\/span><span class=\"p\">(<\/span><span class=\"m\">100<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"push sent\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"done\"<\/span><span class=\"p\">)<\/span>\n<\/code><\/pre>","options":["<code>push sent<\/code> never prints; <code>supervisorScope<\/code> throws the <code>IOException<\/code>","<code>push sent<\/code> prints, then <code>supervisorScope<\/code> throws the <code>IOException<\/code>","Nothing prints: without a handler, the scope hangs","The uncaught exception handler prints the <code>IOException<\/code>, then <code>push sent<\/code> and <code>done<\/code> print"],"answer":3,"why":"In a supervisor, a failed child doesn't cancel its sibling or the scope. A failed <code>launch<\/code> child has no <code>await<\/code>, so its exception goes to a handler, and with none installed it reaches the thread's uncaught exception handler, which prints it. The scope then returns normally after the slowest child.","from":null},{"q":"From lesson 5 of this track: a notifier loops over channels with <code>try { sender.send(id) } catch (e: Exception) { log.warn(\"send failed\", e) }<\/code>. During shutdown its scope is cancelled while SMS is being sent. What happens?","options":["The loop stops at SMS, because <code>CancellationException<\/code> is not an <code>Exception<\/code>","The cancel is logged as a failed send, and each remaining channel is attempted and \"fails\" at once","The JVM interrupts the thread and the loop exits","The scope's handler receives the <code>CancellationException<\/code>"],"answer":1,"why":"<code>CancellationException<\/code> extends <code>IllegalStateException<\/code>, so <code>catch (e: Exception)<\/code> catches it. The coroutine stays cancelled, so every later send throws at its first suspension point and is logged too. Rethrow <code>CancellationException<\/code> or catch narrower types. Handlers ignore cancellations.","from":"co-05"}],"cards":[{"front":"In a plain <code>coroutineScope<\/code>, an <code>async<\/code> child fails and nobody has called <code>await<\/code>. What happens?","back":"<p>The scope is cancelled at once, its other children are cancelled, and the scope rethrows the child's exception.<\/p>"},{"front":"Where does a <code>CoroutineExceptionHandler<\/code> take effect?","back":"<p>On root coroutines and direct children of a supervisor. Never on ordinary children, never on <code>async<\/code>.<\/p>"},{"front":"What does <code>supervisorScope<\/code> change compared with <code>coroutineScope<\/code>?","back":"<p>A failed child doesn't cancel its siblings or the scope. Cancelling the scope still cancels every child.<\/p>"},{"front":"A <code>launch<\/code> child of <code>supervisorScope<\/code> fails. Where does its exception go?","back":"<p>To the <code>CoroutineExceptionHandler<\/code> in its context, or to the thread's uncaught exception handler if there is none.<\/p>"},{"front":"What does <code>launch(SupervisorJob()) { }<\/code> inside a scope really do?","back":"<p>The new <code>SupervisorJob<\/code> becomes the parent, so the coroutine leaves the scope's tree: the scope doesn't wait for it or cancel it.<\/p>"},{"front":"Where does <code>SupervisorJob()<\/code> belong?","back":"<p>In the constructor of a scope you own: <code>CoroutineScope(SupervisorJob() + dispatcher + handler)<\/code>. Inside a function, use <code>supervisorScope { }<\/code>.<\/p>"},{"front":"Three children fail at once. Which exception does the parent rethrow?","back":"<p>The first one. The other two are attached to it as suppressed exceptions.<\/p>"}],"terms":[{"term":"Failed coroutine","plain":"A coroutine that ended with an exception other than CancellationException. It cancels its parent unless the parent is a supervisor."},{"term":"Root coroutine","plain":"A coroutine with no parent coroutine above it, such as one launched straight into a scope you created."},{"term":"CoroutineExceptionHandler","plain":"A context element that receives uncaught exceptions from root coroutines, for logging and metrics."},{"term":"Supervisor","plain":"A job whose children fail independently. Cancellation still flows down to all of them."},{"term":"supervisorScope","plain":"The supervisor version of coroutineScope, for a block of work the caller waits for."},{"term":"Suppressed exception","plain":"An extra failure attached to the first one, when several children fail together."}],"remote":true},"co-07":{"id":"co-07","track":"co","n":7,"title":"Flow basics: cold streams and operators","ready":true,"minutes":35,"goal":"By the end you can build a cold Flow with flow { }, tell intermediate operators from terminal ones, move blocking upstream work with flowOn, and handle errors with catch and onCompletion without breaking exception transparency.","quiz":[{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"kd\">val<\/span><span class=\"w\"> <\/span><span class=\"nv\">f<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">flow<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"start\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">emit<\/span><span class=\"p\">(<\/span><span class=\"m\">1<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">emit<\/span><span class=\"p\">(<\/span><span class=\"m\">2<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"built\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">f<\/span><span class=\"p\">.<\/span><span class=\"na\">collect<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"nb\">it<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"n\">f<\/span><span class=\"p\">.<\/span><span class=\"na\">take<\/span><span class=\"p\">(<\/span><span class=\"m\">1<\/span><span class=\"p\">).<\/span><span class=\"na\">collect<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">println<\/span><span class=\"p\">(<\/span><span class=\"nb\">it<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<\/code><\/pre>","options":["<code>built<\/code>, <code>start<\/code>, <code>1<\/code>, <code>2<\/code>, <code>start<\/code>, <code>1<\/code>","<code>start<\/code>, <code>built<\/code>, <code>1<\/code>, <code>2<\/code>, <code>1<\/code>","<code>built<\/code>, <code>start<\/code>, <code>1<\/code>, <code>2<\/code>, <code>1<\/code>","<code>start<\/code>, <code>1<\/code>, <code>2<\/code>, <code>built<\/code>, <code>start<\/code>, <code>1<\/code>"],"answer":0,"why":"Building the flow runs nothing, so <code>built<\/code> comes first. Each <code>collect<\/code> runs the body from the top, so <code>start<\/code> prints twice. <code>take(1)<\/code> cancels the flow after the first value, so the second run never emits 2.","from":null},{"q":"<code>records.map { parse(it) }.catch { emit(FALLBACK) }.collect { ledger.save(it) }<\/code>, and <code>ledger.save<\/code> throws <code>SQLException<\/code> on the third record. What happens?","options":["<code>catch<\/code> emits <code>FALLBACK<\/code> and the import carries on","The <code>SQLException<\/code> reaches the caller of <code>collect<\/code>, and <code>catch<\/code> never sees it","The flow retries the third record","The exception is swallowed and <code>collect<\/code> returns normally"],"answer":1,"why":"<code>catch<\/code> only handles exceptions from the flow above it. <code>save<\/code> runs in the collector, below <code>catch<\/code>, so its exception passes through to the caller. Move the save into <code>onEach<\/code> above <code>catch<\/code> if the fallback should cover it.","from":null},{"q":"In <code>runBlocking<\/code> on the main thread: <code>flow { A }.map { B }.flowOn(Dispatchers.IO).filter { C }.collect { D }<\/code>. Where do A, B, C and D run?","options":["All four on IO","A on IO; B, C and D on main","A and B on IO; C and D on main","A, B and C on IO; D on main"],"answer":2,"why":"<code>flowOn<\/code> changes the context of everything above it, the builder and the first <code>map<\/code>. Operators below it and the collector stay in the collector's context, which here is <code>main<\/code>.","from":null},{"q":"You collect <code>flow { withContext(Dispatchers.IO) { emit(loadRates()) } }<\/code>. What happens?","options":["It works, and the collector runs on IO too","It deadlocks, because <code>emit<\/code> waits for the IO thread","It works, and the collector stays on its own thread","It throws <code>IllegalStateException<\/code>: the flow invariant is violated"],"answer":3,"why":"A flow must emit in its collector's context, and the builder checks every <code>emit<\/code>. Move the work with <code>flow { emit(loadRates()) }.flowOn(Dispatchers.IO)<\/code> instead.","from":null},{"q":"From the reactive track: <code>Flux&lt;String&gt; f = Flux.just(\"pay-1\").map(id -&gt; { log(id); return id; });<\/code> runs, and nobody ever subscribes to <code>f<\/code>. What is logged?","options":["<code>pay-1<\/code>, once, when <code>map<\/code> is called","Nothing","<code>pay-1<\/code>, once per operator in the chain","An error, because a Flux must be subscribed"],"answer":1,"why":"A Flux is cold, like a Flow: assembling operators runs nothing, and the work starts only on subscribe. A Kotlin flow built the same way logs nothing until a terminal operator collects it.","from":"rx-02"}],"cards":[{"front":"When does the body of a <code>flow { }<\/code> run?","back":"<p>Each time a terminal operator collects it, from the top. Building the flow runs nothing.<\/p>"},{"front":"Intermediate vs terminal flow operator: what's the difference?","back":"<p>Intermediate ones (<code>map<\/code>, <code>filter<\/code>, <code>take<\/code>) return a new flow and run nothing. Terminal ones (<code>collect<\/code>, <code>toList<\/code>, <code>first<\/code>) are suspend functions that run the flow.<\/p>"},{"front":"How does a flow get backpressure without <code>request(n)<\/code>?","back":"<p><code>emit<\/code> suspends until the collector has finished with the value, so the producer can't run ahead.<\/p>"},{"front":"What does <code>.flowOn(Dispatchers.IO)<\/code> move?","back":"<p>Everything above it in the chain. Operators below it and the collector stay in the collector's context.<\/p>"},{"front":"What happens if you call <code>emit<\/code> inside <code>withContext(Dispatchers.IO)<\/code> in a <code>flow { }<\/code>?","back":"<p>The flow throws <code>IllegalStateException<\/code>: \"Flow invariant is violated\". Use <code>flowOn<\/code> instead.<\/p>"},{"front":"Does <code>.catch { }<\/code> handle an exception thrown inside <code>collect { }<\/code>?","back":"<p>No. It only handles exceptions from upstream; the collector's exceptions pass through to the caller.<\/p>"},{"front":"What <code>cause<\/code> does <code>onCompletion<\/code> get when the collector uses <code>take(1)<\/code>?","back":"<p>A <code>CancellationException<\/code>: the flow was stopped early. It gets <code>null<\/code> only after a normal end.<\/p>"}],"terms":[{"term":"Cold flow","plain":"A flow whose code runs only when collected, from the start, once per collector."},{"term":"Flow builder","plain":"A function that creates a flow, such as <code>flow { }<\/code>, <code>flowOf<\/code> or <code>asFlow<\/code>."},{"term":"Intermediate operator","plain":"An operator that returns a new flow without running anything, such as <code>map<\/code> or <code>filter<\/code>."},{"term":"Terminal operator","plain":"A suspend function that runs the flow and consumes its values, such as <code>collect<\/code> or <code>toList<\/code>."},{"term":"Context preservation","plain":"A flow runs in the collector's context; only <code>flowOn<\/code> changes the context of the part above it."},{"term":"Exception transparency","plain":"A flow never catches and hides exceptions thrown by the code downstream of it."},{"term":"Upstream","plain":"The part of a flow chain above a given operator, closer to the source."}],"remote":true},"co-08":{"id":"co-08","track":"co","n":8,"title":"StateFlow, SharedFlow and hot streams","ready":false},"co-09":{"id":"co-09","track":"co","n":9,"title":"Channels, select and pipelines","ready":false},"co-10":{"id":"co-10","track":"co","n":10,"title":"Shared state and testing coroutines","ready":false},"co-11":{"id":"co-11","track":"co","n":11,"title":"Coroutines meet Java: futures, Reactor, virtual threads","ready":false},"pat-01":{"id":"pat-01","track":"pat","n":1,"title":"Patterns in a modern language, and Singleton","ready":true,"minutes":35,"goal":"By the end you can say what a design pattern is and which ones modern Java and Kotlin absorbed, pick the right singleton form in each language, and prove a lazy instance is built once under contention.","quiz":[{"q":"A Kotlin class has <code>val pool by lazy(LazyThreadSafetyMode.PUBLICATION) { HikariDataSource(config) }<\/code>. What can go wrong when traffic starts?","options":["Nothing, because the property is lazy","Several threads can each open a pool; one is kept and the others are never closed","Threads can see a half-built pool","The first caller deadlocks"],"answer":1,"why":"<code>PUBLICATION<\/code> lets every racing thread run the initializer and keeps the first stored result. A pool opens connections when it is built, so the discarded pools leak them. Drop the mode argument: the default <code>SYNCHRONIZED<\/code> runs the initializer once. A half-built value is not the risk here; the store itself is safe, only the side effects repeat.","from":null},{"q":"You need a stateless, process-wide ID formatter in Java, and it's fine to build it at startup. Which form is simplest and still correct?","options":["An <code>enum<\/code> with one constant, <code>INSTANCE<\/code>","Double-checked locking on a <code>volatile<\/code> static field","A static field set inside <code>getInstance()<\/code> behind <code>if (instance == null)<\/code>","A <code>synchronized static getInstance()<\/code> method"],"answer":0,"why":"An enum gives you exactly one instance, created when the class initializes, and serialization or reflection can't make another. DCL is for lazy instance fields and is overkill here. The plain <code>if<\/code> version races, and a <code>synchronized<\/code> getter is correct but takes a lock on every call for no benefit.","from":null},{"q":"Java code calls a Kotlin factory declared as <code>class Money { companion object { fun of(minor: Long) = Money() } }<\/code>. What does the Java caller write?","options":["<code>Money.of(100)<\/code>","<code>Money.INSTANCE.of(100)<\/code>","<code>Money.Companion.of(100)<\/code>","<code>new Money().of(100)<\/code>"],"answer":2,"why":"Companion members are instance members of the companion object, which Java sees as a static field called <code>Companion<\/code>. Mark <code>of<\/code> with <code>@JvmStatic<\/code> if you want <code>Money.of(100)<\/code> to work from Java. <code>INSTANCE<\/code> is the field for an <code>object<\/code> declaration, not for a companion.","from":null},{"q":"A test passes alone and fails in the full suite. The class under test reads <code>MetricsRegistry.INSTANCE.count(\"declines\")<\/code>. What is the likely cause and fix?","options":["JUnit runs tests in parallel, so add <code>synchronized<\/code>","The enum gets created twice, so switch to the holder idiom","The JIT caches the count, so make the field <code>volatile<\/code>","The singleton keeps counts from earlier tests, so inject the registry and give each test its own"],"answer":3,"why":"A global singleton lives as long as the JVM, so one test's counts leak into the next and the result depends on order. Passing the registry through the constructor lets each test build a fresh one. An enum is never created twice, and visibility is not the problem when the tests run on one thread.","from":null},{"q":"From <em>Lazy init done right<\/em> in the memory model track: in double-checked locking, what goes wrong if the <code>instance<\/code> field is not <code>volatile<\/code>?","options":["Two instances can be created","The <code>synchronized<\/code> block can deadlock","Another thread can see a non-null reference to an object whose fields it can't see yet","Nothing on x86, so it is safe in practice"],"answer":2,"why":"The re-check under the lock still prevents a second instance. The problem is the fast path, which reads the field without a lock. Without <code>volatile<\/code> there is no happens-before edge from the constructor's writes to that read, so a thread can see the reference before the fields. The JIT may reorder those writes on any CPU, x86 included, and the memory model allows it.","from":"jmm-05"}],"cards":[{"front":"What is a design pattern, in one sentence?","back":"<p>A name for a recurring design: the problem, the shape of the solution and its trade-offs. Vocabulary, not a class template.<\/p>"},{"front":"Which Java singleton form does Effective Java call the preferred approach?","back":"<p>A single-element <code>enum<\/code>: <code>enum IdGenerator { INSTANCE; ... }<\/code>. The JVM guarantees one instance, even across serialization and reflection.<\/p>"},{"front":"Why is the holder idiom lazy and thread-safe without a lock in your code?","back":"<p>The JVM initializes the nested <code>Holder<\/code> class on the first read of <code>Holder.INSTANCE<\/code>, exactly once, under its own class-initialization lock.<\/p>"},{"front":"When do you need double-checked locking instead of the holder idiom?","back":"<p>When the lazy value is an instance field (one per object, such as a per-merchant cache). The holder idiom only works for statics.<\/p>"},{"front":"<code>by lazy(LazyThreadSafetyMode.PUBLICATION) { init() }<\/code>: how many times can <code>init()<\/code> run?","back":"<p>Once per racing thread. The first stored value wins and every caller sees it, but the side effects repeat.<\/p>"},{"front":"Are Kotlin compan
