ion object members static on the JVM?","back":"<p>No. They are instance members of the companion (<code>Money.Companion.of()<\/code> from Java) unless you mark them <code>@JvmStatic<\/code>.<\/p>"},{"front":"Why does an injected bean usually beat <code>getInstance()<\/code>?","back":"<p>The dependency shows in the constructor, a test can pass a fake, and no global state leaks between tests. The container still makes only one.<\/p>"}],"terms":[{"term":"Design pattern","plain":"A named, reusable shape for solving a design problem that keeps coming back."},{"term":"Singleton","plain":"A class with exactly one instance and one way to get it."},{"term":"Holder idiom","plain":"A nested static class whose static field holds the instance. The JVM creates it once, on first access."},{"term":"Double-checked locking","plain":"Read a volatile field without a lock, and only lock (and check again) when it is still null."},{"term":"Object declaration","plain":"Kotlin's built-in singleton: a class and its one instance, created thread-safely on first access."},{"term":"Lazy thread-safety mode","plain":"How <code>by lazy<\/code> handles racing first reads: SYNCHRONIZED runs once, PUBLICATION may run many times, NONE promises nothing."}],"remote":true},"pat-02":{"id":"pat-02","track":"pat","n":2,"title":"Factory Method and Abstract Factory","ready":true,"minutes":35,"goal":"By the end you can replace constructor calls with named static or companion factories that validate and return sealed results, pass factories around as functions, and group matching products behind an abstract factory.","quiz":[{"q":"Which of these can a static factory do that a constructor can never do?","options":["Return an instance of a subtype chosen from its arguments","Validate its arguments","Be called from another package","Throw a checked exception"],"answer":0,"why":"Constructors can validate, be public and throw checked exceptions too. Only a factory can return a cached object or a different class, like <code>List.of<\/code> returning <code>List12<\/code> or <code>ListN<\/code> depending on how many elements you pass.","from":null},{"q":"A factory has <code>switch (provider) { case ADYEN -&gt; ...; case STRIPE -&gt; ...; default -&gt; new FakeGateway(); }<\/code>. A teammate adds <code>KLARNA<\/code> to the enum. What happens?","options":["A compile error in the factory","A <code>MatchException<\/code> at runtime","Klarna payments silently go to the fake gateway","The switch throws <code>NullPointerException<\/code>"],"answer":2,"why":"The <code>default<\/code> branch catches every new constant, so the build stays green and Klarna gets the fake gateway. Without <code>default<\/code>, a switch expression over an enum must cover every constant, and adding <code>KLARNA<\/code> would be a compile error at exactly this line.","from":null},{"q":"Which Kotlin shape lets callers write <code>Fee(290)<\/code> while you return a cached instance?","options":["A secondary constructor","<code>operator fun invoke<\/code> in the companion object","An <code>init<\/code> block","A <code>data class<\/code> with a default argument"],"answer":1,"why":"A constructor always makes a new object, whether primary or secondary. <code>operator fun invoke(bps: Int): Fee<\/code> on the companion turns <code>Fee(290)<\/code> into a function call that can return anything, including a cached instance. Readers expect a new object from that syntax, so use it with care.","from":null},{"q":"You have <code>interface MessagingFactory { Publisher publisher(); Subscriber subscriber(); }<\/code> with a Kafka family and an in-memory family. Now you need a <code>DeadLetterQueue<\/code> product too. What does that cost?","options":["Nothing: add one new class","Only the Kafka family changes","You have to switch to Factory Method","The interface and every existing family change"],"answer":3,"why":"Abstract Factory makes new families cheap and new products expensive: every family must now produce a dead-letter queue, including the in-memory one used in tests. Weigh that before you add a product to the interface.","from":null},{"q":"From lesson 1 of this track: a Kotlin <code>companion object<\/code> holds a factory <code>of(...)<\/code> and <code>val cache = loadCache()<\/code>. When does <code>loadCache()<\/code> run?","options":["When the outer class is loaded, like a Java static initializer","Lazily, the first time <code>cache<\/code> is read, under a lock","Every time <code>of<\/code> is called","At application startup, for every class on the classpath"],"answer":0,"why":"A companion object is initialized when its outer class is loaded, which matches a Java static initializer, so <code>loadCache()<\/code> runs then even if nobody reads <code>cache<\/code>. If you want it on first read, write <code>val cache by lazy { loadCache() }<\/code>.","from":"pat-01"}],"cards":[{"front":"Name two things a static factory can do that a constructor can't.","back":"<p>Return a cached instance, and return a subtype chosen from its arguments (<code>List.of<\/code> gives <code>List12<\/code> or <code>ListN<\/code>). It also has a name.<\/p>"},{"front":"Why leave out <code>default<\/code> in a factory's switch over a sealed type or enum?","back":"<p>So adding a new case is a compile error at the factory. With <code>default<\/code>, the new case silently takes the default branch.<\/p>"},{"front":"What replaced the GoF Factory Method's creator subclass in modern Java?","back":"<p>A function: a <code>Supplier&lt;PaymentGateway&gt;<\/code>, usually written as a constructor reference such as <code>AdyenGateway::new<\/code>.<\/p>"},{"front":"Kotlin has no <code>static<\/code>. Where does a class's named factory usually live?","back":"<p>In its <code>companion object<\/code>: <code>companion object { fun parse(raw: String): CardResult }<\/code>.<\/p>"},{"front":"What name may a Kotlin factory function have, by the coding conventions?","back":"<p>The same name as the abstract type it returns, like <code>fun Job(): Job<\/code> or <code>MutableStateFlow(0)<\/code>.<\/p>"},{"front":"When should a factory return a sealed result instead of throwing?","back":"<p>When the failure is an outcome the caller is expected to handle, like a mistyped card number. Keep exceptions for bugs and broken infrastructure.<\/p>"},{"front":"Abstract Factory: what is cheap to add, and what is expensive?","back":"<p>A new family is cheap (one implementation). A new product is expensive (the interface and every family change).<\/p>"}],"terms":[{"term":"Static factory method","plain":"A static method that returns an instance, used instead of a public constructor."},{"term":"Factory Method (GoF)","plain":"A creation hook that lets something other than the caller pick the concrete class. Now often a <code>Supplier&lt;T&gt;<\/code> or <code>() -&gt; T<\/code>."},{"term":"Abstract Factory","plain":"An interface that creates a whole family of matching objects, with one implementation per family."},{"term":"Product family","plain":"Objects that must be used together, such as one network's authorizer and refunder."},{"term":"Sealed result","plain":"A sealed set of outcomes (<code>Valid<\/code>, <code>Invalid<\/code>) returned instead of throwing. A <code>switch<\/code> or <code>when<\/code> must handle every case."},{"term":"Companion object","plain":"A Kotlin object tied to a class, and the usual home for that class's factories."}],"remote":true},"pat-03":{"id":"pat-03","track":"pat","n":3,"title":"Builder and Prototype","ready":true,"minutes":38,"goal":"By the end you can choose between named arguments, a Java record plus builder, and a Kotlin DSL builder, and make copies of templates that never share mutable state with the original.","quiz":[{"q":"<code>data class Fee(val bps: Int) { init { require(bps in 0..1_000) } }<\/code>. What does <code>Fee(290).copy(bps = 5_000)<\/code> do?","options":["Returns <code>Fee(5000)<\/code>, because <code>copy()<\/code> skips <code>init<\/code>","Throws <code>IllegalArgumentException<\/code>, because <code>copy()<\/code> runs <code>init<\/code>","Doesn't compile","Returns <code>Fee(290)<\/code> unchanged"],"answer":1,"why":"<code>copy()<\/code> calls the primary constructor with the new values, so every <code>init<\/code> block runs again and <code>require<\/code> throws. That's why <code>init<\/code> is the safest place for a data class's rules. What <code>copy()<\/code> does skip is a validating factory, when the constructor is private.","from":null},{"q":"A Java team will call your Kotlin <code>ChargeRequest(amountMinor, currency, token, descriptor = null, capture = true, maxRetries = 0)<\/code> constructor from many places. What helps them most?","options":["Nothing; Java 21 supports named arguments","Mark the class <code>data<\/code>","Put <code>@JvmStatic<\/code> on the constructor","Add <code>@JvmOverloads<\/code>, or give them a builder"],"answer":3,"why":"Java has no named or default arguments, so it sees one six-parameter constructor. <code>@JvmOverloads<\/code> generates overloads that drop trailing defaults, and a builder lets them set any subset by name. <code>@JvmStatic<\/code> applies to companion members, not constructors, and <code>data<\/code> changes nothing for Java callers here.","from":null},{"q":"A DSL has no <code>@DslMarker<\/code>. Inside <code>lineItems { }<\/code>, someone writes <code>currency = \"USD\"<\/code>. <code>LineItemsBuilder<\/code> has no <code>currency<\/code>, but the outer <code>PaymentRequestBuilder<\/code> does. What happens?","options":["It sets the outer builder's <code>currency<\/code>","Compile error: unresolved reference","A runtime exception","It declares a local variable"],"answer":0,"why":"Both receivers are in scope inside the inner lambda, so the compiler resolves <code>currency<\/code> on the outer builder and sets it. Nothing fails. With <code>@DslMarker<\/code> on both builders, that line becomes a compile error unless you write <code>this@paymentRequest.currency<\/code>.","from":null},{"q":"<code>record Cart(String id, List&lt;String&gt; skus) {}<\/code>. <code>c1<\/code> was built with <code>new ArrayList&lt;&gt;(List.of(\"a\"))<\/code>. Then <code>Cart c2 = new Cart(\"c2\", c1.skus()); c2.skus().add(\"b\");<\/code>. What happens?","options":["<code>c1<\/code> is unchanged, because records are immutable","The <code>add<\/code> throws <code>UnsupportedOperationException<\/code>","<code>c1.skus()<\/code> now contains <code>b<\/code> too","It doesn't compile"],"answer":2,"why":"Records are only shallowly immutable: the field can't point elsewhere, but the <code>ArrayList<\/code> it points to can change, and <code>c2<\/code> shares it. A compact constructor with <code>skus = List.copyOf(skus);<\/code> would give each record its own unmodifiable list, and the <code>add<\/code> would then throw.","from":null},{"q":"From <em>Factory Method and Abstract Factory<\/em>: you hide a data class's constructor (<code>data class Email private constructor(val value: String)<\/code>) and offer a validating <code>Email.of(raw)<\/code>. In Kotlin 2.4, which line still creates an unvalidated <code>Email<\/code>?","options":["<code>Email(\"x\")<\/code> in another file","<code>Email.of(\"a@b.example\").copy(value = \"x\")<\/code>","<code>Email.of(\"x\")<\/code>","None: a private constructor covers every path"],"answer":1,"why":"The generated <code>copy()<\/code> stays public even when the constructor is private; Kotlin 2.4 only warns about it. So <code>copy<\/code> creates an <code>Email<\/code> your factory never saw. <code>@ConsistentCopyVisibility<\/code> makes <code>copy()<\/code> private, and an <code>init<\/code> check would run on <code>copy()<\/code> too. A direct constructor call from outside does not compile.","from":"pat-02"}],"cards":[{"front":"Does a Kotlin data class's <code>init<\/code> block run on <code>copy()<\/code>?","back":"<p>Yes. <code>copy()<\/code> calls the primary constructor, so <code>require<\/code> checks in <code>init<\/code> run again.<\/p>"},{"front":"What is a lambda with receiver?","back":"<p>A function type like <code>Builder.() -&gt; Unit<\/code>. Inside the lambda, <code>this<\/code> is the Builder, so you call its members without a prefix.<\/p>"},{"front":"What does <code>@DslMarker<\/code> prevent?","back":"<p>Calling a member of an outer DSL receiver implicitly from inside an inner block. Reaching it then needs an explicit <code>this@label<\/code>.<\/p>"},{"front":"Why is <code>Cloneable<\/code> considered broken?","back":"<p>It declares no <code>clone<\/code> method, and <code>Object.clone()<\/code> is protected, shallow and throws a checked exception. Use copy constructors or withers.<\/p>"},{"front":"Is a Kotlin data class <code>copy()<\/code> deep or shallow?","back":"<p>Shallow. A property that holds a mutable object, such as a <code>MutableList<\/code>, is shared by the original and the copy.<\/p>"},{"front":"Where does validation go for a Java record that has a builder?","back":"<p>In the record's compact constructor, so <code>build()<\/code>, withers and direct <code>new<\/code> calls all run it.<\/p>"},{"front":"<code>data class Email private constructor(...)<\/code>: is its <code>copy()<\/code> private in Kotlin 2.4?","back":"<p>No. It stays public, with a warning. Add <code>@ConsistentCopyVisibility<\/code> to make it private.<\/p>"}],"terms":[{"term":"Telescoping constructor","plain":"A chain of constructors, each adding one more optional parameter."},{"term":"Builder","plain":"A helper that collects values step by step and makes the finished object in <code>build()<\/code>."},{"term":"Lambda with receiver","plain":"A lambda whose <code>this<\/code> is a given object, written <code>T.() -&gt; R<\/code>."},{"term":"DslMarker","plain":"A meta-annotation for DSL marker annotations that limits implicit calls to the nearest receiver."},{"term":"Prototype","plain":"Making a new object by copying an existing one and changing a few fields."},{"term":"Wither","plain":"A method like <code>withTimeout(t)<\/code> that returns a copy with one field changed."},{"term":"Shallow copy","plain":"A copy that shares the objects its fields point to, instead of copying them too."}],"remote":true},"pat-04":{"id":"pat-04","track":"pat","n":4,"title":"Adapter and Facade","ready":true,"minutes":36,"goal":"By the end you can wrap a vendor SDK in an adapter that keeps its types, codes and exceptions to itself, use Kotlin extension functions for light data adapters, and put a multi-step checkout behind a facade that owns the order and the failure rules.","quiz":[{"q":"Your issuer adapter catches <code>SdkException<\/code> and rethrows it wrapped in a <code>RuntimeException<\/code>. The checkout service catches that and checks <code>getCause() instanceof SdkException<\/code> to decide whether to retry. What's wrong?","options":["Nothing, since the exception is unchecked now","The vendor type still leaks: the service depends on the SDK, so switching issuers breaks it","A <code>RuntimeException<\/code> can't wrap a checked exception","Retry decisions belong inside the vendor SDK"],"answer":1,"why":"Wrapping changed the exception's type, not who depends on it. The service still imports <code>SdkException<\/code>, so it's coupled to this vendor. Translate inside the adapter into your own result (<code>Unavailable<\/code>) or your own exception type that says retryable or not. A <code>RuntimeException<\/code> can wrap anything, so that option is simply false.","from":null},{"q":"Which statement about an adapter written in Kotlin is true?","options":["A vendor <code>IOException<\/code> thrown inside it can pass through your port without any compile error","The compiler forces you to catch the vendor's checked exceptions","Extension functions can implement your port interface","<code>fun interface<\/code> ports can't be implemented with a lambda"],"answer":0,"why":"Kotlin has no checked exceptions, so nothing stops the vendor's <code>IOException<\/code> from reaching callers of your port. Java would refuse to compile the same adapter. Extensions can't implement interfaces, and a <code>fun interface<\/code> exists precisely so a lambda can implement it.","from":null},{"q":"Three call sites (a REST resource, a Kafka consumer and an admin tool) each reserve stock, charge the card, post to the ledger and send an email, each with slightly different failure handling. Which pattern fits?","options":["Adapter","Decorator","Facade","Singleton"],"answer":2,"why":"A facade puts the sequence and its failure rules in one place, and each caller makes one call. An adapter changes one object's interface, a decorator adds behavior behind the same interface, and a singleton is about instance count, not about orchestrating steps.","from":null},{"q":"Which is the best use of a Kotlin extension function as an adapter?","options":["<code>fun LegacyIssuerSdk.authorize(...)<\/code>, which callers use instead of a <code>CardAuthorizer<\/code> port","A global <code>fun Any.toJson()<\/code> in a shared utils file","An extension that caches vendor results in a top-level map","<code>fun VendorTxn.toReceipt(): Receipt<\/code>, kept in the issuer-adapter package"],"answer":3,"why":"Mapping a vendor DTO to your own type is pure data translation, which is what extensions are good at, and keeping it in the adapter package keeps the vendor model contained. An extension on the SDK makes callers depend on the SDK and can't be swapped in a test. A global utils extension spreads everywhere, and caching in a top-level map is hidden shared state.","from":null},{"q":"From <em>Factory Method and Abstract Factory<\/em>: you now have one <code>IssuerSdkAdapter<\/code> for Visa's SDK and one for Mastercard's. Where should the choice between them live?","options":["In each REST resource, with an <code>if<\/code> on the card's BIN","In one factory, a <code>switch<\/code> or <code>when<\/code> over the network with no default, injected into the facade","Inside the facade's <code>checkout<\/code>, as string checks on the PAN","In the adapters: each checks whether the card belongs to it"],"answer":1,"why":"Choosing which product to build is a factory's job: one exhaustive <code>switch<\/code> or <code>when<\/code> over a sealed or enum network, so adding a network is a compile error in one place. Spreading BIN checks over resources or the facade copies the rule, and adapters checking ownership turns every call into a guessing game.","from":"pat-02"}],"cards":[{"front":"What does an adapter do?","back":"<p>Makes an object you can't change fit the interface (port) your code expects, translating arguments, results and errors.<\/p>"},{"front":"What is a leaky adapter?","back":"<p>One that lets the vendor's types, codes or exceptions (an <code>SdkException<\/code>, response code \"51\") reach your service code.<\/p>"},{"front":"A Kotlin adapter calls a method that throws <code>IOException<\/code> and has no catch. Does it compile?","back":"<p>Yes. Kotlin has no checked exceptions, so the vendor's <code>IOException<\/code> passes through your port silently. Java would refuse.<\/p>"},{"front":"What does a Kotlin extension function compile to?","back":"<p>A static method whose first parameter is the receiver. <code>txn.toReceipt()<\/code> is <code>toReceipt(txn)<\/code> in bytecode.<\/p>"},{"front":"What does a facade own?","back":"<p>The order of the steps in a multi-step job, and what a failure at each step means. Not maths, vendor codes or SQL.<\/p>"},{"front":"Can a Java record component be named <code>notify<\/code>?","back":"<p>No: \"illegal record component name\". Its accessor would clash with <code>Object.notify()<\/code>. The same goes for <code>wait<\/code>, <code>hashCode<\/code>, <code>toString<\/code> and the other no-arg <code>Object<\/code> methods.<\/p>"},{"front":"Adapter vs Facade, one line each?","back":"<p>Adapter: one object, given a different interface (yours). Facade: several objects behind one new, simpler interface.<\/p>"}],"terms":[{"term":"Adapter","plain":"A wrapper that makes an existing object fit the interface your code expects."},{"term":"Port","plain":"An interface in your own words that your core code depends on, such as <code>CardAuthorizer<\/code>."},{"term":"Anti-corruption layer","plain":"The adapters where a vendor's model is translated into yours, so it never spreads into your code."},{"term":"Facade","plain":"One simple entry point that runs a multi-step job across several subsystems."},{"term":"Extension function","plain":"A Kotlin function called like a method on a type it doesn't belong to; a static method underneath."},{"term":"Hexagonal architecture","plain":"Core logic talks only to ports, and adapters on the edge connect each port to one technology."}],"remote":true},"pat-05":{"id":"pat-05","track":"pat","n":5,"title":"Decorator and Proxy","ready":true,"minutes":37,"goal":"By the end you can stack decorators and predict what their order does, use Kotlin <code>by<\/code> without falling into its forwarding trap, write a dynamic proxy that unwraps exceptions, and explain why a Spring <code>@Transactional<\/code> method called from the same bean runs without a transaction.","quiz":[{"q":"<code>FeeCalculator.percent(290).plusFixed(30).cappedAt(500).crossBorder(\"DE\", 100)<\/code> prices a 1,000.00 EUR payment from France (amount 100,000 minor units). What fee does it return?","options":["500","1,500","3,930","2,930"],"answer":1,"why":"Work from the inside out: 2.9% of 100,000 is 2,900, plus 30 is 2,930, capped at 500, then the cross-border decorator adds 1% of the amount, 1,000, after the cap. Total 1,500. The tempting 500 is what you get with the cap outermost.","from":null},{"q":"<code>class AuditedLedger(private val inner: Ledger) : Ledger by inner<\/code> overrides only <code>post(entry)<\/code> to write an audit line. The real ledger's <code>postAll(entries)<\/code> calls its own <code>post<\/code> for each entry. You call <code>audited.postAll(listOf(a, b, c))<\/code>. How many audit lines are written?","options":["3","1","0","It depends on the JVM"],"answer":2,"why":"<code>postAll<\/code> is forwarded to <code>inner.postAll<\/code>, and <code>inner<\/code> calls its own <code>post<\/code>, never the override in <code>AuditedLedger<\/code>. Kotlin delegation has no open recursion. To audit bulk posts, override <code>postAll<\/code> too.","from":null},{"q":"An <code>InvocationHandler<\/code> does <code>return method.invoke(target, args);<\/code> with no try/catch. The target throws <code>IllegalArgumentException<\/code>. What does the caller of the proxy catch?","options":["<code>IllegalArgumentException<\/code>","<code>InvocationTargetException<\/code>","<code>UndeclaredThrowableException<\/code>","Nothing: the proxy swallows it"],"answer":2,"why":"<code>method.invoke<\/code> wraps the target's exception in <code>InvocationTargetException<\/code>, a checked exception. The interface method doesn't declare it, so the proxy wraps it again in <code>UndeclaredThrowableException<\/code>. Catch the <code>InvocationTargetException<\/code> in the handler and rethrow <code>getCause()<\/code>.","from":null},{"q":"You need to record the latency of every method on six different client interfaces (about forty methods in all), with one rule for all of them. Which tool fits best?","options":["A dynamic proxy, or your framework's interceptor","A hand-written decorator class per interface","Kotlin <code>by<\/code> with one override per method","An adapter per client"],"answer":0,"why":"One rule applied to every method of many interfaces is what a proxy or interceptor is for: one handler, written once. Hand-written decorators and <code>by<\/code> overrides mean forty copies of the same timing code, and an adapter changes the interface, which you don't want here.","from":null},{"q":"From <em>Adapter and Facade<\/em>: which of these wrappers is an adapter rather than a decorator?","options":["<code>MeteredGateway implements PaymentGateway<\/code>, wrapping a <code>PaymentGateway<\/code>","<code>BufferedInputStream<\/code>, wrapping an <code>InputStream<\/code>","<code>SoapGatewayAdapter implements PaymentGateway<\/code>, wrapping a <code>LegacySoapClient<\/code>","<code>Collections.unmodifiableList(list)<\/code>"],"answer":2,"why":"An adapter gives the wrapped object a different interface: your port instead of the vendor's SOAP API. The other three keep the interface of the object they wrap and add or restrict behavior, which is what a decorator does.","from":"pat-04"}],"cards":[{"front":"What makes a wrapper a decorator?","back":"<p>It implements the same interface as the object it wraps, adds one behavior, and forwards the call. Callers can't tell it's there.<\/p>"},{"front":"Retry decorator outside a logging decorator, issuer fails twice then succeeds: how many log lines?","back":"<p>Three. The inner decorator sees every attempt; the outer one sees one logical call.<\/p>"},{"front":"<code>CountingMap : MutableMap by inner<\/code> overrides <code>put<\/code>. After <code>put<\/code> once and <code>putAll<\/code> of two entries, what is <code>puts<\/code>?","back":"<ol>\n<li><code>putAll<\/code> is forwarded to <code>inner<\/code>, which never calls your override.<\/li>\n<\/ol>"},{"front":"What does <code>Collections.unmodifiableList(list)<\/code> give you?","back":"<p>A read-through view: writes throw, but later changes to <code>list<\/code> show up. Use <code>List.copyOf<\/code> for a snapshot.<\/p>"},{"front":"In an <code>InvocationHandler<\/code>, why rethrow <code>e.getCause()<\/code> from <code>InvocationTargetException<\/code>?","back":"<p><code>method.invoke<\/code> wraps the target's exception. If the wrapper escapes, callers get <code>UndeclaredThrowableException<\/code> instead of the real error.<\/p>"},{"front":"Spring: <code>@Transactional settle()<\/code> called as <code>this.settle()<\/code> from the same bean. Transaction?","back":"<p>No. Self-invocation goes to the target, not the proxy. (Quarkus ArC does intercept it.)<\/p>"},{"front":"Why does a Kotlin Spring project need the <code>kotlin-spring<\/code> plugin?","back":"<p>Kotlin classes and members are final by default, and Spring's CGLIB subclass proxies can't override final members. The plugin opens Spring-annotated classes.<\/p>"}],"terms":[{"term":"Decorator","plain":"A wrapper with the same interface as the object inside it, adding one behavior."},{"term":"Proxy","plain":"A stand-in with the same interface that controls access to the real object: lazy, remote, transactional, retrying."},{"term":"Dynamic proxy","plain":"A class generated at runtime by <code>java.lang.reflect.Proxy<\/code> that implements interfaces and routes every call to one handler."},{"term":"InvocationHandler","plain":"The one method, <code>invoke(proxy, method, args)<\/code>, that a dynamic proxy calls for every interface method."},{"term":"Class delegation (<code>by<\/code>)","plain":"Kotlin syntax that generates forwarding methods for an interface to a delegate object."},{"term":"Self-invocation","plain":"A bean calling its own method through <code>this<\/code>, which bypasses the framework's proxy."},{"term":"CGLIB proxy","plain":"A runtime-generated subclass Spring uses to proxy a class without an interface; it can't override final methods."}],"remote":true},"pat-06":{"id":"pat-06","track":"pat","n":6,"title":"Composite, Bridge and Flyweight","ready":true,"minutes":36,"goal":"By the end you can model a fee plan as an immutable sealed tree priced by one exhaustive switch, split two independent dimensions with a bridge, and share immutable values through a thread-safe flyweight factory without falling for boxed <code>==<\/code>.","quiz":[{"q":"In Java, two totals are read from two maps: <code>Long settled = ledger.get(\"EUR\"); Long expected = report.get(\"EUR\");<\/code>. Each holds 25,000, boxed separately. What does <code>settled == expected<\/code> return on a standard JVM?","options":["true, because the values are equal","false, because they are two different <code>Long<\/code> objects","It doesn't compile","It throws <code>NullPointerException<\/code>"],"answer":1,"why":"<code>==<\/code> on objects compares references. <code>Long.valueOf<\/code> shares instances only for -128 to 127, so two separately boxed 25,000s are different objects. With a test value of 100 the cache makes it pass, which is how this bug reaches production. Use <code>equals<\/code>, or primitive <code>long<\/code>.","from":null},{"q":"What fee does <code>AllOf(Flat(30), CheapestOf(Percent(290), Flat(250)))<\/code> charge on 10,000 minor units?","options":["570","320","280","250"],"answer":2,"why":"<code>Percent(290)<\/code> on 10,000 is 290 and <code>Flat(250)<\/code> is 250, so <code>CheapestOf<\/code> returns 250. <code>AllOf<\/code> adds the flat 30: 280. The tempting 320 prices the percentage and forgets that <code>CheapestOf<\/code> picks the minimum.","from":null},{"q":"You're designing payment notifications: four alert types today, three channels (SMS, email, Slack), and both lists will grow. Which structure fits?","options":["Alerts that hold a <code>Channel<\/code> interface, with one class or lambda per channel","Twelve classes, one per alert and channel pair","An adapter per alert type","A singleton per channel that every alert extends"],"answer":0,"why":"Two dimensions that vary on their own are the case for Bridge: 4 + 3 pieces, and a new channel works with every alert. Twelve classes become fifteen with the next alert. An adapter fixes one mismatched interface, and extending a singleton puts the channel back into the class hierarchy.","from":null},{"q":"To save memory, a service puts every merchant name it receives in webhook payloads into a static <code>ConcurrentHashMap<\/code> pool and reuses the pooled string. What goes wrong over time?","options":["Two threads can get different instances for the same name","Nothing: <code>ConcurrentHashMap<\/code> is thread-safe","The pool grows with every new name and never shrinks: a slow memory leak","Pooled strings can't be compared with <code>equals<\/code> any more"],"answer":2,"why":"A flyweight pool must be bounded. Merchant names from outside are an open set, so the map keeps every name ever seen for the life of the JVM. Pool a known set (currencies, category codes from a reference table) or use a cache with eviction. Thread safety isn't the issue here; <code>computeIfAbsent<\/code> handles that.","from":null},{"q":"From <em>Don't share: immutability, confinement, ThreadLocal<\/em>: a fee plan tree is built once at startup from records whose lists go through <code>List.copyOf<\/code>, kept in a <code>static final<\/code> field, and read by 200 request threads. What do the reads need?","options":["A <code>synchronized<\/code> block around each <code>fee<\/code> call","The read side of a <code>ReadWriteLock<\/code>","<code>volatile<\/code> on every record field","Nothing: the tree is immutable and safely published"],"answer":3,"why":"Record fields are final, <code>List.copyOf<\/code> returns an unmodifiable list, and a <code>static final<\/code> field is published safely by class initialization. Nothing ever writes after that, so there is nothing to race on, and locks would only add contention.","from":"conc-11"}],"cards":[{"front":"What does Composite let you do?","back":"<p>Treat a single item and a group of items through one interface. A group answers by asking its children, so callers never check which one they hold.<\/p>"},{"front":"Why leave <code>default<\/code> out of the switch that walks a sealed composite?","back":"<p>So adding a node type is a compile error at every operation that handles the tree, instead of a silent fallback.<\/p>"},{"front":"What problem does Bridge solve?","back":"<p>Two dimensions that vary on their own (alert type and channel) without N x M classes: the abstraction holds an implementor and calls it.<\/p>"},{"front":"Bridge or Adapter: which one is designed up front?","back":"<p>Bridge. An adapter is retrofitted, to make a class you can't change fit your interface.<\/p>"},{"front":"Java: <code>Integer a = 128, b = 128;<\/code> What is <code>a == b<\/code>?","back":"<p>false with default settings. <code>Integer.valueOf<\/code> caches only -128 to 127; 128 gives two different objects.<\/p>"},{"front":"Why must a flyweight be immutable?","back":"<p>Every holder shares the same instance, so a change made by one would show up for all of them, on every thread.<\/p>"},{"front":"Why does a flyweight factory use <code>computeIfAbsent<\/code> instead of <code>get<\/code> then <code>put<\/code>?","back":"<p><code>computeIfAbsent<\/code> checks and inserts in one atomic step, so concurrent callers get one instance. <code>get<\/code> then <code>put<\/code> is check-then-act and can build duplicates.<\/p>"}],"terms":[{"term":"Composite","plain":"A tree where groups and single items share one interface, so you handle both the same way."},{"term":"Leaf","plain":"A node in a composite with no children, such as <code>Flat(30)<\/code>."},{"term":"Bridge","plain":"Splitting two independent dimensions so one side holds the other through an interface."},{"term":"Implementor","plain":"In a bridge, the side that does the low-level work, such as a <code>Channel<\/code> that delivers messages."},{"term":"Flyweight","plain":"A small immutable object shared by many users instead of copied for each."},{"term":"Intrinsic and extrinsic state","plain":"Intrinsic state lives in the shared flyweight; extrinsic state comes from the caller with each use."},{"term":"Canonicalizing factory","plain":"A factory that returns the one pooled instance for a key, such as <code>Currency.getInstance(\"EUR\")<\/code>."}],"remote":true},"pat-07":{"id":"pat-07","track":"pat","n":7,"title":"Strategy and Template Method","ready":true,"minutes":37,"goal":"By the end you can pass algorithms as lambdas and comparators, refactor an if/else router into a strategy map or an exhaustive switch behind a characterization test, and replace a Template Method base class with an execute-around function.","quiz":[{"q":"A team prices with <code>Map&lt;Method, FeeStrategy&gt;<\/code> built from config, and also has a <code>switch<\/code> over <code>Method<\/code> with no default in the invoicing code. Someone adds <code>CRYPTO<\/code> to <code>Method<\/code>. Which statement is true?","options":["The map fails to compile; the switch throws at runtime","The switch fails to compile; the map compiles and fails on the first crypto payment","Both fail to compile","Both compile, and crypto payments cost 0"],"answer":1,"why":"Only the switch tells the compiler which constants must be handled, so only the switch breaks the build. The map has no idea <code>CRYPTO<\/code> should be a key, so <code>get<\/code> returns null in production. With a map over a closed set, add a startup check that every constant has an entry.","from":null},{"q":"Quotes: Atlas (fee 30, p95 200 ms), Bluefin (fee 25, p95 900 ms), Cobalt (fee 30, p95 120 ms). In what order does <code>Comparator.comparingLong(Quote::feeMinor).thenComparingLong(Quote::p95Millis)<\/code> sort them?","options":["Bluefin, Cobalt, Atlas","Bluefin, Atlas, Cobalt","Cobalt, Atlas, Bluefin","Atlas, Cobalt, Bluefin"],"answer":0,"why":"The first comparator puts the 25 fee first: Bluefin. Atlas and Cobalt tie on fee, so the second comparator breaks the tie by latency: Cobalt (120 ms) before Atlas (200 ms). The tempting \"Bluefin, Atlas, Cobalt\" ignores the tie-breaker and keeps the original order.","from":null},{"q":"A base class sets <code>label = \"outbound \" + name();<\/code> in its constructor. The subclass <code>ChargeCall(String psp)<\/code> assigns <code>this.psp = psp<\/code> and implements <code>name()<\/code> as <code>\"charge via \" + psp<\/code>. What is the label of <code>new ChargeCall(\"northpay\")<\/code>?","options":["It throws <code>NullPointerException<\/code>","<code>outbound charge via northpay<\/code>","<code>outbound charge via null<\/code>","It doesn't compile"],"answer":2,"why":"The base constructor runs first and calls the overridden <code>name()<\/code> before <code>ChargeCall<\/code> has assigned <code>psp<\/code>, so <code>psp<\/code> is still null, and string concatenation turns null into \"null\". Nothing throws, which makes the bug easy to miss. Kotlin behaves the same even for a non-null <code>val psp: String<\/code>.","from":null},{"q":"At 30 call sites, code calls different PSP endpoints, and every call must be timed and logged in the same way. Which shape fits best?","options":["An abstract base class with a final <code>execute()<\/code> and one subclass per call site","A <code>Map&lt;String, Runnable&gt;<\/code> holding all 30 calls","A singleton that every call registers with","A higher-order function, <code>timed(\"psp.capture\") { ... }<\/code>, <code>inline<\/code> in Kotlin, wrapped around each call"],"answer":3,"why":"The skeleton is fixed and the middle varies per call site, which is execute around: one function, and each call site passes its own block. Thirty subclasses is Template Method's ceremony with its inheritance problems, and a map or a singleton doesn't wrap anything.","from":null},{"q":"From <em>Decorator and Proxy<\/em>: each method's base rule is a <code>FeeCalculator<\/code> stored in a <code>Map&lt;Method, FeeCalculator&gt;<\/code>. Ops now wants every fee capped at 5.00. Where does the cap go with the least code?","options":["Edit every lambda in the map to call <code>Math.min(..., 500)<\/code>","Decorate each calculator once when you build the map: <code>calculators.replaceAll((m, c) -&gt; c.cappedAt(500))<\/code>","Add a <code>default -&gt; 500<\/code> branch to the switch","Make each strategy extend a <code>CappedCalculator<\/code> base class"],"answer":1,"why":"Strategies and decorators combine: the map picks the rule, and wrapping each rule in <code>cappedAt(500)<\/code> adds the cap once, in one place. Editing every lambda copies the rule into each strategy, a <code>default<\/code> branch changes nothing for known methods, and a base class brings back the inheritance this lesson moves away from.","from":"pat-05"}],"cards":[{"front":"In modern Java or Kotlin, what is a strategy usually written as?","back":"<p>A lambda or method reference for a functional interface (<code>Comparator<\/code>, <code>FeeStrategy<\/code>), or a Kotlin function type such as <code>(Payment) -&gt; Long<\/code>.<\/p>"},{"front":"You add a constant to an enum. What happens to a <code>switch<\/code> over it with no default, and to an <code>EnumMap<\/code> of strategies?","back":"<p>The switch fails to compile. The map compiles, and <code>get<\/code> returns null for the new key at runtime.<\/p>"},{"front":"Map of strategies or exhaustive switch: which for a closed set you own?","back":"<p>The switch (or <code>when<\/code>) with no default, so a new case is a compile error. Use the map for open sets: config, plug-ins.<\/p>"},{"front":"What is a characterization test?","back":"<p>A test that records what existing code does today, bugs included, so a refactor can prove it changed nothing.<\/p>"},{"front":"What is Template Method?","back":"<p>A final skeleton method in a base class that calls hook methods subclasses override.<\/p>"},{"front":"A base-class constructor calls an overridden method that reads a subclass field. What does it see?","back":"<p>The field's default: null or 0, because the subclass constructor hasn't run yet. In Kotlin even a non-null <code>val<\/code> reads as null.<\/p>"},{"front":"What is execute around?","back":"<p>A function that does the setup and teardown and takes the varying step as a lambda: try-with-resources, <code>use {}<\/code>, <code>synchronized(lock) {}<\/code>.<\/p>"}],"terms":[{"term":"Strategy","plain":"One interchangeable algorithm, passed in by the caller and used by the code that needs a decision."},{"term":"Characterization test","plain":"A test that pins down what legacy code does now, so a refactor can't change it unnoticed."},{"term":"Template Method","plain":"A base-class method that fixes the steps and lets subclasses fill in some of them."},{"term":"Hook","plain":"An overridable method a template calls at a fixed point in its skeleton."},{"term":"Fragile base class","plain":"When a change inside a parent class breaks subclasses that relied on how it worked."},{"term":"Execute around","plain":"A function that wraps the caller's code with setup and teardown, taking that code as a lambda."},{"term":"Inline function","plain":"A Kotlin function whose body, with its lambda arguments, is copied into each call site."}],"remote":true},"pat-08":{"id":"pat-08","track":"pat","n":8,"title":"Observer and Command","ready":true,"minutes":37,"goal":"By the end you can write an observer list that can't leak or be broken by one listener, choose SharedFlow for events and StateFlow for state, and model ledger operations as command records with a correct undo, knowing what changes when commands are queued or stored.","quiz":[{"q":"A Kotlin service publishes payment events through a <code>MutableStateFlow<\/code>. The fraud model needs every <code>Captured<\/code> event. What will it miss?","options":["Nothing: StateFlow delivers every value","An event equal to the previous one, and events a slow collector didn't get to in time","Only events emitted before it started collecting, like any hot flow","Events emitted from another thread"],"answer":1,"why":"StateFlow conflates by <code>equals<\/code>, so an event equal to the current value is never delivered, and a collector that falls behind only sees the latest value. Missing events from before you started collecting is true of a replay-0 SharedFlow too, but it isn't what makes StateFlow wrong here. StateFlow is thread-safe, so threads don't matter.","from":null},{"q":"A <code>CommandLog.run<\/code> pushes the command onto the history first and then applies it. The balance is 70. <code>Withdraw(1000)<\/code> fails with \"insufficient funds\". The user presses undo once. What is the balance?","options":["70","40","1,070","1,000"],"answer":2,"why":"The failed withdrawal was recorded before it threw, so it's on top of the history. Undoing it adds 1,000 that never left: 70 + 1,000 = 1,070. Recording only after <code>apply<\/code> succeeds keeps undo honest.","from":null},{"q":"A request-scoped object subscribes a listener to a singleton <code>EventBus<\/code> in its constructor and never closes the handle. What happens over a day of traffic?","options":["Memory grows, and every old request object keeps reacting to events","Nothing: listeners are removed when the request ends","The bus throws once it has too many listeners","The listeners stop receiving events after a garbage collection"],"answer":0,"why":"The singleton's list holds a strong reference to each listener, and each listener's lambda captures its request object, so none of them can be collected, and all of them keep running on every event. That is the lapsed-listener leak. Return a handle from <code>subscribe<\/code> and close it when the owner's life ends.","from":null},{"q":"Fraud scoring must see every ledger posting, even if the pod crashes a millisecond after the posting commits. Which design fits?","options":["An in-process <code>EventBus<\/code> listener","A <code>StateFlow<\/code> the scorer collects","A <code>MutableSharedFlow<\/code> with <code>replay = 1<\/code>","An outbox row written in the posting's transaction and relayed to Kafka"],"answer":3,"why":"Anything in memory dies with the pod, so the in-process bus and both flows lose events written just before a crash. An outbox row commits with the posting or not at all, and the relay delivers it at least once, so the scorer must be idempotent.","from":null},{"q":"From <em>StateFlow, SharedFlow and hot streams<\/em>: a <code>MutableSharedFlow&lt;Posted&gt;()<\/code> (no replay, no buffer) emits three postings, and only then does a new collector start. What does the new collector see?","options":["All three postings","None of the three; only postings emitted after it starts","Only the last posting","The first posting, then it waits"],"answer":1,"why":"A SharedFlow with <code>replay = 0<\/code> keeps nothing for late subscribers: each emission goes to the collectors present at that moment. A StateFlow would hand the newcomer the latest value, and <code>replay = 1<\/code> would replay the last posting.","from":"co-08"}],"cards":[{"front":"Why should <code>subscribe<\/code> return an <code>AutoCloseable<\/code> (or similar handle)?","back":"<p>So the subscriber can leave. A forgotten listener stays referenced by the subject forever: the lapsed-listener leak.<\/p>"},{"front":"Why use <code>CopyOnWriteArrayList<\/code> for a listener list?","back":"<p>It iterates over a snapshot, so a listener can unsubscribe during delivery without a <code>ConcurrentModificationException<\/code>. Writes are rare, reads are constant.<\/p>"},{"front":"What does a <code>publish<\/code> loop need around each listener call?","back":"<p>A try/catch, so one throwing listener doesn't stop delivery to the others or fail the publisher.<\/p>"},{"front":"StateFlow or SharedFlow for payment events?","back":"<p>SharedFlow (or a Channel). StateFlow drops values equal to the current one, and slow collectors skip updates.<\/p>"},{"front":"When does a command go on the undo history?","back":"<p>Only after <code>apply<\/code> succeeds. Recorded earlier, a failed command gets \"undone\" and corrupts the state.<\/p>"},{"front":"Is a refund the undo of a charge?","back":"<p>No. Money that moved can't be un-sent; a refund is a new compensating command with its own record and fees.<\/p>"},{"front":"Why must a command stored in an outbox or Temporal be idempotent?","back":"<p>Delivery is at least once: a crash or a lost result can make it run twice.<\/p>"}],"terms":[{"term":"Observer","plain":"A subject keeps a list of listeners and notifies each one when something happens."},{"term":"Lapsed listener","plain":"A listener nobody removed: it leaks memory and keeps reacting after its owner is gone."},{"term":"Hot flow","plain":"A flow that exists and emits whether or not anyone collects, such as SharedFlow and StateFlow."},{"term":"Conflation","plain":"Keeping only the latest value and dropping ones a collector didn't get to, or equal repeats."},{"term":"Command","plain":"A request turned into a value: what to do, with which arguments, ready to store or queue."},{"term":"Compensation","plain":"A new action that reverses the effect of an earlier one, such as a refund for a capture."},{"term":"Transactional outbox","plain":"A table of outgoing messages written in the same transaction as the state change, then relayed."}],"remote":true},"pat-09":{"id":"pat-09","track":"pat","n":9,"title":"State and Chain of Responsibility","ready":true,"minutes":37,"goal":"By the end you can model a payment lifecycle as sealed states, sealed events and one pure transition function, use the compiler's exhaustiveness errors as a to-do list, and build an interceptor chain whose order, short-circuits and exceptions you control.","quiz":[{"q":"In <code>transition<\/code>, the outer <code>switch (s)<\/code> lists <code>Created<\/code>, <code>Authorized<\/code> and <code>Captured<\/code>, then ends with <code>default -&gt; throw illegal(s, e)<\/code> instead of listing <code>Refunded<\/code> and <code>Failed<\/code>. Someone adds <code>Disputed<\/code>. What happens?","options":["The build fails at that switch","It compiles, and every event on a disputed payment throws at runtime","Disputed payments throw <code>NullPointerException<\/code>","Disputed payments throw <code>MatchException<\/code>"],"answer":1,"why":"The <code>default<\/code> covers every state not listed, including ones that don't exist yet, so the compiler has nothing to report. <code>Disputed<\/code> falls into the default and rejects every event, which looks like a stuck payment in production. <code>MatchException<\/code> is only for subtypes the compiler couldn't know about; this one it could have flagged.","from":null},{"q":"The rule is <code>case Refund(var r) when r &gt; 0 &amp;&amp; r &lt;= captured -&gt; new Refunded(id, r);<\/code> followed by <code>default -&gt; throw illegal(s, e);<\/code>. A <code>Refund(6_000)<\/code> arrives for <code>Captured(\"p1\", 5_000)<\/code>. What happens?","options":["It returns <code>Refunded(\"p1\", 6_000)<\/code>","It returns <code>Refunded(\"p1\", 5_000)<\/code>","It throws <code>IllegalStateException(\"Refund not allowed in Captured\")<\/code>","It doesn't compile, because the guard can be false"],"answer":2,"why":"When a guard is false, that case doesn't match, and the switch tries the next case: here the <code>default<\/code>, which throws. Guards are part of the pattern, so an over-refund is just one more illegal move. Nothing clamps the amount.","from":null},{"q":"A chain is <code>[logging, idempotency, auth]<\/code>. A request with idempotency key K and no token arrives, then the client fixes its token and retries with the same key K. What does the retry get?","options":["200 charged","401 no token","500 server error","409 duplicate"],"answer":3,"why":"Idempotency runs before auth, so the first request records K and only then gets 401. The retry finds K already used and is stopped with 409, so the customer is never charged. With auth first, the rejected request never reaches the idempotency check, and the retry goes through.","from":null},{"q":"Someone adds a retry interceptor at the front of the chain that calls <code>next.proceed(r)<\/code> again when the response is a 5xx. What is the risk?","options":["Every later step runs again on each retry, including the fraud check and the charge","Nothing: retries are always safe in a chain","The retry can't reach the terminal step","Only the logging step runs twice"],"answer":0,"why":"<code>next<\/code> is the whole rest of the chain, so retrying it repeats every step after the retry interceptor, the charge included. If the PSP took the money and then timed out, the retry charges again (or, with an idempotency check in the chain, returns a confusing 409). Retry around the PSP client call, with an idempotency key.","from":null},{"q":"From <em>Strategy and Template Method<\/em>: a <code>PaymentState<\/code> and a <code>FeeStrategy<\/code> both hold behavior behind an interface. What actually differs?","options":["Only strategies can be lambdas","The client chooses a strategy and it stays; a state machine chooses its own next state as events arrive","States must be classes, strategies must be functions","A strategy can't depend on data"],"answer":1,"why":"Structurally they're the same: an object holds a value and behavior depends on it. The difference is control. You pick a fee strategy once per payment method and it doesn't change itself. A payment's state moves on its own, from <code>Authorized<\/code> to <code>Captured<\/code>, as the transition function processes events.","from":"pat-07"}],"cards":[{"front":"What replaces the GoF State pattern's class-per-state in Java 21 and Kotlin?","back":"<p>Sealed states and events as records or data classes, plus one pure <code>transition(state, event)<\/code> function with an exhaustive switch or <code>when<\/code>.<\/p>"},{"front":"Why leave <code>default<\/code> off the switch over a sealed state type?","back":"<p>So a new state fails to compile at every switch that needs a rule. A default would silently absorb it.<\/p>"},{"front":"When is <code>default<\/code> fine inside a state machine?","back":"<p>On the inner switch over events, where most (state, event) pairs are illegal. Never on the dimension you expect to grow.<\/p>"},{"front":"An exhaustive Java switch meets a sealed subtype compiled after it. What happens? And in Kotlin?","back":"<p>Java throws <code>MatchException<\/code>; Kotlin throws <code>NoWhenBranchMatchedException<\/code>. A null state throws <code>NullPointerException<\/code>.<\/p>"},{"front":"Why keep the transition function pure?","back":"<p>It's tested without mocks, and history becomes a fold: replaying events rebuilds the state. Side effects run outside it.<\/p>"},{"front":"In a chain of responsibility, what are a handler's two choices?","back":"<p>Answer now (return a response or verdict), or pass the request on by calling <code>next<\/code>.<\/p>"},{"front":"Interceptors <code>[a, b, c]<\/code>: order on the way in, and on the way out?","back":"<p>In: a, b, c, then the terminal step. Out: c, b, a.<\/p>"}],"terms":[{"term":"State machine","plain":"A set of states and the events that move between them; anything not listed is illegal."},{"term":"Transition function","plain":"A pure function from the current state and an event to the next state."},{"term":"Guard","plain":"An extra condition on a pattern case, such as <code>when amt &gt; 0<\/code>; if false, the case doesn't match."},{"term":"Exhaustive switch","plain":"A switch the compiler has checked covers every possible subtype or constant."},{"term":"Remainder","plain":"The values an exhaustive switch can still meet at run time: null and subtypes compiled later."},{"term":"Chain of Responsibility","plain":"A request passes along a list of handlers; each answers it or passes it on."},{"term":"Interceptor","plain":"One link in a chain: it gets the request and the rest of the chain, and can act on the way in and out."}],"remote":true},"pat-10":{"id":"pat-10","track":"pat","n":10,"title":"Visitor, Iterator, Mediator and Memento","ready":false},"pat-11":{"id":"pat-11","track":"pat","n":11,"title":"Concurrency patterns that tie it all together","ready":false},"mem-01":{"id":"mem-01","track":"mem","n":1,"title":"Where objects live: heap, stacks, metaspace and object headers","ready":false},"mem-02":{"id":"mem-02","track":"mem","n":2,"title":"Allocation, TLABs and escape analysis","ready":false},"mem-03":{"id":"mem-03", <script>/* JVM Workbench: a single-page course reader. No framework, no build step for the script.
   State lives in localStorage under one key; every read and write is guarded. */
(function () {
  "use strict";
  const C = JSON.parse(document.getElementById("course").textContent);
  const L = C.lessons;
  const T = Object.fromEntries(C.tracks.map((t, i) => [t.id, Object.assign(t, { idx: i + 1 })]));
  const ORDER = C.order;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");

  /* ---------------- storage ---------------- */
  const KEY = "jvmwb-v1";
  const blank = () => ({ v: 1, theme: null, code: "both", done: {}, undone: {}, paceAt: "", quiz: {}, tquiz: {}, cards: {}, explain: {}, days: {}, pace: 5, open: {}, timer: null, seenSetup: false });

  try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { /* private window or blocked storage */ }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } };

  /* ---------------- moving progress between devices ----------------
     Progress lives in this browser. The Plan page copies it out as text and imports it on another
     device; importing merges, so nothing done on either device is lost. */
  const SYNC = ["done", "undone", "quiz", "tquiz", "cards", "days", "explain", "pace", "paceAt"];
  const syncDoc = () => Object.fromEntries(SYNC.map((k) => [k, S[k]]));
  const later = (a, b) => (!a ? b : !b ? a : a > b ? a : b);
  function mergeInto(x) {
    if (!x || typeof x !== "object") return;
    const done = {}, undone = {};
    const ids = new Set([...Object.keys(S.done), ...Object.keys(S.undone || {}), ...Object.keys(x.done || {}), ...Object.keys(x.undone || {})]);
    for (const id of ids) {
      const d = later(S.done[id], (x.done || {})[id]), u = later((S.undone || {})[id], (x.undone || {})[id]);
      if (d && (!u || d > u)) done[id] = d;
      if (u) undone[id] = u;
    }
    S.done = done; S.undone = undone;
    for (const k of ["quiz", "tquiz"]) for (const [id, v] of Object.entries(x[k] || {})) S[k][id] = Math.max(S[k][id] || 0, +v || 0);
    for (const [id, c] of Object.entries(x.cards || {})) {
      const cur = S.cards[id];
      if (!cur || (c.reps || 0) > (cur.reps || 0) || ((c.reps || 0) === (cur.reps || 0) && (c.last || 0) > (cur.last || 0))) S.cards[id] = c;
    }
    for (const [d, e] of Object.entries(x.days || {})) { const cur = S.days[d] || { l: 0, r: 0 }; S.days[d] = { l: Math.max(cur.l || 0, e.l || 0), r: Math.max(cur.r || 0, e.r || 0) }; }
    for (const [id, t] of Object.entries(x.explain || {})) if (t && !S.explain[id]) S.explain[id] = t;
    if (x.pace && (x.paceAt || "") > (S.paceAt || "")) { S.pace = x.pace; S.paceAt = x.paceAt; }
  }

  /* ---------------- dates ---------------- */
  const DAY = 864e5;
  const dayNum = (d = new Date()) => Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / DAY);
  const today = () => dayNum();
  const ymdOf = (n) => new Date(n * DAY).toISOString().slice(0, 10);
  const inDays = (n) => (n <= 0 ? "today" : n === 1 ? "tomorrow" : `in ${n} days`);
  function logDay(kind, k = 1) {
    const d = ymdOf(today());
    const e = S.days[d] || { l: 0, r: 0 };
    e[kind] = (e[kind] || 0) + k;
    S.days[d] = e;
  }

  /* ---------------- spaced repetition: FSRS-4.5, default weights, target retention 0.9 ---------------- */
  const W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];
  const DECAY = -0.5, FACTOR = 19 / 81, TARGET = 0.9;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const recall = (t, s) => Math.pow(1 + FACTOR * t / s, DECAY);
  const ivlOf = (s) => Math.max(1, Math.round((s / FACTOR) * (Math.pow(TARGET, 1 / DECAY) - 1)));
  const D0 = (g) => clamp(W[4] - (g - 3) * W[5], 1, 10);
  const nextD = (d, g) => clamp(W[7] * D0(3) + (1 - W[7]) * (d - W[6] * (g - 3)), 1, 10);
  const sUp = (d, s, r, g) => s * (Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp(W[10] * (1 - r)) - 1) * (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1) + 1);
  const sLapse = (d, s, r) => W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp(W[14] * (1 - r));
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
  function schedule(c, g, id, dry) {
    const now = today();
    const x = Object.assign({}, c);
    if (x.s == null) { x.s = W[g - 1]; x.d = D0(g); }
    else {
      const r = recall(Math.max(0, now - x.last), x.s);
      const s = g === 1 ? Math.min(x.s, sLapse(x.d, x.s, r)) : sUp(x.d, x.s, r, g);
      x.d = nextD(x.d, g); x.s = s;
      if (g === 1) x.lapses = (x.lapses || 0) + 1;
    }
    let ivl = g === 1 ? 1 : ivlOf(x.s);
    if (ivl > 2) ivl = Math.max(2, Math.round(ivl * (0.95 + 0.1 * hash(id + ":" + now)))); // small fuzz spreads siblings apart
    x.reps = (x.reps || 0) + 1; x.last = now; x.due = now + ivl; x.ivl = ivl;
    if ((x.lapses || 0) >= 8) x.leech = true;
    if (!dry) S.cards[id] = x;
    return x;
  }
  const ivlLabel = (n) => (n < 30 ? `${n}d` : n < 365 ? `${Math.round(n / 30)}mo` : `${(n / 365).toFixed(1)}y`);
  function addCards(lid) {
    const l = L[lid]; if (!l || !l.ready) return 0;
    let n = 0;
    l.cards.forEach((_, i) => { const id = `${lid}:c${i}`; if (!S.cards[id]) { S.cards[id] = { due: today() + 1, added: today() }; n++; } });
    return n;
  }
  function addMissed(key, qi) {
    const id = `${key}:q${qi}`;
    if (!S.cards[id]) S.cards[id] = { due: today() + 1, added: today() };
  }
  function cardData(id) {
    const [key, k] = id.split(":");
    const i = +k.slice(1);
    if (k[0] === "c") { const l = L[key]; return l && l.cards && l.cards[i] ? { kind: "flash", lid: key, front: l.cards[i].front, back: l.cards[i].back } : null; }
    if (k[0] === "q") {
      if (L[key]) { const q = L[key].quiz && L[key].quiz[i]; return q ? { kind: "mcq", lid: key, q } : null; }
      const t = T[key]; const q = t && t.quiz[i]; return q ? { kind: "mcq", tid: key, q } : null;
    }
    return null;
  }
  const dueIds = () => Object.entries(S.cards).filter(([id, c]) => c.due <= today() && cardData(id)).sort((a, b) => a[1].due - b[1].due || hash(a[0]) - hash(b[0])).map(([id]) => id);
  const DAILY_CAP = 40;

  /* ---------------- progress helpers ---------------- */
  const isDone = (id) => !!S.done[id];
  const nextUp = () => ORDER.find((id) => !S.done[id]) || null;
  const doneCount = () => ORDER.filter((id) => S.done[id]).length;
  const trackDone = (t) => t.lessons.filter((id) => S.done[id]).length;
  function setDone(id, on) {
    if (on && !S.done[id]) { S.done[id] = new Date().toISOString(); const n = addCards(id); logDay("l"); save(); toast(n ? `Done. ${n} cards join your review from tomorrow.` : "Marked done."); }
    else if (!on && S.done[id]) { delete S.done[id]; S.undone[id] = new Date().toISOString(); for (const k of Object.keys(S.cards)) if (k.startsWith(id + ":c") && !S.cards[k].reps) delete S.cards[k]; save(); toast("Marked not done."); }
    render();
  }
  // the plan is counted in course weeks and days, never calendar dates: lesson k sits at
  // week floor(k / pace) + 1, day k % pace + 1, where pace is the study days per week
  const pace = () => S.pace || 5;
  const wd = (id) => { const k = ORDER.indexOf(id); return { w: Math.floor(k / pace()) + 1, d: (k % pace()) + 1 }; };
  const wdLabel = (id) => { const x = wd(id); return `Week ${x.w} · Day ${x.d}`; };
  const wdShort = (id) => { const x = wd(id); return `W${x.w} · D${x.d}`; };
  const totalWeeks = () => Math.ceil(ORDER.length / pace());
  function studiedLast7() {
    let n = 0; for (let d = today() - 6; d <= today(); d++) { const e = S.days[ymdOf(d)]; if (e && (e.l || e.r)) n++; }
    return n;
  }
  const cellState = (id) => (S.done[id] ? "done" : id === nextUp() ? "here" : "");

  /* ---------------- tiny UI helpers ---------------- */
  let toastTimer;
  function toast(msg) {
    let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 3200);
  }
  async function copyText(text, btn) {

    catch (e) { toast("Copy is blocked here. Select the text and copy it by hand."); }
  }
  const icon = {
    menu: '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    sun: '<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 1.8v2.2M10 16v2.2M1.8 10H4M16 10h2.2M4.2 4.2l1.6 1.6M14.2 14.2l1.6 1.6M4.2 15.8l1.6-1.6M14.2 5.8l1.6-1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    moon: '<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.4A7 7 0 0 1 7.6 3.5a7 7 0 1 0 8.9 8.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    timer: '<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 7.5V11l2.4 1.6M8 2.2h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  };
  const brandMark = '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">' + [0, 1, 2].map((r) => ["var(--ember)", "color-mix(in srgb, var(--ember) 65%, var(--ink))", "color-mix(in srgb, var(--ember) 35%, var(--ink))"].map((c, k) => `<circle cx="${4 + k * 7}" cy="${4 + r * 7}" r="${r === 1 && k === 1 ? 2.1 : 1.35}" fill="${c}"/>`).join("")).join("") + '<circle cx="11" cy="11" r="6" fill="none" stroke="var(--ember)" stroke-opacity=".7" stroke-width=".9"/></svg>';
  const cells = (ids, big) => `<span class="draft" aria-hidden="true">${ids.map((id) => `<i class="cell${big ? " lg" : ""} ${cellState(id)}"></i>`).join("")}</span>`;
  function codeBox(c, title) {
    if (!c) return "";
    return `<div class="codebox"><div class="bar"><span class="nm">${esc(title || c.title || c.lang)}</span><span class="label">${esc(c.lang || "")}</span><button class="copy" data-act="copy-code">Copy</button></div>
      <pre><code>${c.html}</code></pre>${c.run ? `<div class="run"><span>$</span><code>${esc(c.run)}</code><button class="copy" data-act="copy" data-text="${esc(c.run)}">Copy</button></div>` : ""}</div>`;
  }

  // Java and Kotlin versions of one sample; html[data-code] decides which shows
  const LANGS = { java: "Java", kotlin: "Kotlin" };
  const pairBar = () => `<div class="pairbar" role="group" aria-label="Code language">${[["java", "Java"], ["kotlin", "Kotlin"], ["both", "Both"]].map(([k, v]) => `<button data-act="lang" data-lang="${k}">${v}</button>`).join("")}</div>`;
  function codePair(c, title, side) {
    if (!c) return "";
    if (!c.alt || !LANGS[c.lang] || !LANGS[c.alt.lang]) return codeBox(c, title);
    const items = [c, c.alt].sort((a) => (a.lang === "java" ? -1 : 1));
    return `<div class="pair${side ? " cols2" : ""}">${pairBar()}${items.map((x) => `<div class="pi" data-lang="${x.lang}">${codeBox(x, x === c ? title || x.title : x.title || LANGS[x.lang])}</div>`).join("")}</div>`;
  }
  function prePair(a, b) {
    if (!b || !b.html || !LANGS[a.lang] || !LANGS[b.lang]) return a.html ? `<pre class="code"><code>${a.html}</code></pre>` : "";
    const items = [a, b].sort((x) => (x.lang === "java" ? -1 : 1));
    return `<div class="pair">${pairBar()}${items.map((x) => `<div class="pi" data-lang="${x.lang}"><span class="lg">${LANGS[x.lang]}</span><pre class="code"><code>${x.html}</code></pre></div>`).join("")}</div>`;
  }
  const setCodePref = (v) => { S.code = v; document.documentElement.setAttribute("data-code", v); save(); };

  /* ---------------- frame ---------------- */
  const app = $("#app");
  let mobileOpen = false, deskOpen = true;
  const effectiveTheme = () => S.theme || "light"; // light unless the learner picks dark
  function frame() {
    const due = dueIds().length;
    app.innerHTML = `
    <header class="top">
      <button class="iconbtn" data-act="menu" aria-label="Show or hide contents">${icon.menu}</button>
      <button class="brand" data-go="home" aria-label="JVM Workbench home">${brandMark}<b>JVM <i>Workbench</i></b></button>
      <span class="spacer"></span>

      <button class="iconbtn" data-act="timer" aria-label="Focus timer" title="35-minute focus timer">${icon.timer}</button>
      <button class="switch" data-act="theme" role="switch" aria-checked="${effectiveTheme() === "dark"}" aria-label="Dark mode" title="Dark mode"><span class="tr"></span><span class="kn"></span></button>
    </header>

  }
  const isDesk = () => matchMedia("(min-width: 1024px)").matches;

  function sidebar(cur) {

    const nx = nextUp();
    const nxTrack = nx ? L[nx].track : null;
    const due = dueIds().length;
    const item = (go, label, extra = "") => `<button data-go="${go}" class="${cur === go ? "on" : ""}">${label}${extra}</button>`;
    let h = `<div class="nav">
      ${item("home", "Today")}
      ${item("review", "Review", `<span class="count tnum">${due} due</span>`)}
      ${item("practice", "Mixed practice")}
      ${item("plan", "Plan and progress")}
      ${item("sheets", "Cheat sheets")}
      ${item("glossary", "Glossary")}
      ${item("setup", "Set up the labs")}
    </div>
    <div class="navsec"><span class="label">Tracks · ${doneCount()} of ${ORDER.length} lessons done</span>
    <input class="field filter" id="lesson-filter" type="search" placeholder="Find a lesson" aria-label="Find a lesson" value="${esc(filterText)}"></div>`;
    for (const t of C.tracks) {
      const open = filterText ? true : S.open[t.id] ?? (t.id === curTrack || (!curTrack && t.id === nxTrack));
      const shown = t.lessons.filter((id) => !filterText || L[id].title.toLowerCase().includes(filterText.toLowerCase()));
      if (filterText && !shown.length) continue;
      h += `<div class="trk"><button data-act="toggle-track" data-id="${t.id}" aria-expanded="${open}">
          <span class="tn">${pad(t.idx)}</span><span class="tt">${esc(t.title)}</span><span></span>${cells(t.lessons)}</button>
        ${open ? `<ul><li><button data-go="track-${t.id}" class="${cur === "track-" + t.id ? "on" : ""}"><span class="cell" style="visibility:hidden"></span>Track overview</button></li>
          ${shown.map((id) => `<li><button data-go="${id}" class="${cur === id ? "on" : ""}"><i class="cell ${cellState(id)}"></i><span>${esc(L[id].title)}</span></button></li>`).join("")}</ul>` : ""}
      </div>`;
    }
    h += `<p class="label" style="padding:18px 20px 0;line-height:1.6">Progress is saved in this browser. Move it between devices from Plan and progress.</p>`;
    $("#side").innerHTML = h;
  }
  let filterText = "";

  /* ---------------- router ---------------- */
  const route = () => (location.hash.slice(1) || "home");
  function render(keepScroll) {
    const cur = route();
    const y = scrollY;
    frame();
    sidebar(cur);
    const page = $("#page");
    let html;
    if (L[cur]) html = lessonPage(L[cur]);
    else if (cur.startsWith("track-") && T[cur.slice(6)]) html = trackPage(T[cur.slice(6)]);
    else if (cur === "review") html = reviewPage();
    else if (cur === "practice") html = practicePage();
    else if (cur === "plan") html = planPage();
    else if (cur === "sheets") html = sheetsPage();
    else if (cur === "glossary") html = glossaryPage();
    else if (cur === "setup") html = setupPage();
    else html = homePage();
    page.innerHTML = html;
    page.classList.toggle("is-lesson", !!L[cur]);
    $$(".sim[data-sim]").forEach((el) => simRender(el));
    timerRender();
    if (L[cur]) watchToc();
    if (keepScroll) scrollTo(0, y);
    document.title = L[cur] ? `${L[cur].title} · JVM Workbench` : cur.startsWith("track-") && T[cur.slice(6)] ? `${T[cur.slice(6)].title} · JVM Workbench` : "JVM Workbench";
  }
  addEventListener("hashchange", () => { mobileOpen = false; resetPageState(); render(); scrollTo(0, 0); });
  const go = (id) => { if (route() === id) { render(); scrollTo(0, 0); } else location.hash = id; };

  /* ---------------- home ---------------- */
  function homePage() {
    const nx = nextUp();
    const due = dueIds().length;
    const l = nx ? L[nx] : null;
    const started = doneCount() > 0;
    return `
    <section class="hero">
      <div class="row" style="justify-content:space-between"><span class="label">${ORDER.length} lessons · 8 tracks · about 35 minutes a day</span><span class="label">${totalWeeks()} weeks at ${pace()} days a week</span></div>
      <h1>JVM <i>Workbench</i></h1>

    <section class="today">
      <div class="panel step ${due ? "now" : ""}">
        <span class="n">1 · Review · about 10 min</span>
        <h3>${due ? `${due} card${due === 1 ? "" : "s"} due` : started ? "Nothing due" : "Your deck starts here"}</h3>
        <p class="mute" style="margin:0;font-size:15.5px">${due ? "Answer from memory first, then check. This is the part that makes lessons stick. Short on time? Do only this." : started ? "Cards come back just before you would forget them. Check again tomorrow." : "Each finished lesson adds 5 to 7 cards. They come back on a schedule, just before you would forget them."}</p>
        <div class="row">${due ? `<button class="btn hold" data-go="review">Start review</button>` : `<button class="btn ghost" data-go="practice" ${started ? "" : "disabled"}>Mixed practice</button>`}</div>
      </div>
      <div class="panel step ${!due && l ? "now" : ""}">

          <span class="label">${wdLabel(l.id)} · ${esc(T[l.track].title)} · lesson ${l.n} of ${T[l.track].lessons.length}${l.minutes ? ` · ${l.minutes} min` : ""}</span>
          ${l.ready ? `<p style="margin:0;font-size:16px">${l.goal}</p>` : `<p class="mute" style="margin:0;font-size:15.5px">This lesson is still being written.</p>`}
          <div class="row"><button class="btn" data-go="${l.id}">${started ? "Open lesson" : "Start the first lesson"}</button>${!S.seenSetup ? `<button class="btn ghost" data-go="setup">Set up the labs first</button>` : ""}</div>`
        : `<h3>Every lesson is done</h3><p class="mute" style="margin:0">Keep your reviews going. Five minutes a day keeps all of it.</p>`}

    <section class="tracks">

        <span class="label">Track ${pad(t.idx)} · ${t.lessons.length} lessons · labs/${esc(t.lab)}</span>
