terface Source&lt;out T&gt;<\/code>), as Kotlin does."},{"term":"Use-site variance","plain":"Variance written where the type is used (<code>Source&lt;? extends Payment&gt;<\/code>), as Java does."}],"remote":true},"gen-05":{"id":"gen-05","track":"gen","n":5,"title":"Contravariance with in: consumers","ready":true,"minutes":35,"goal":"By the end you can recognise a consumer, declare it <code>in<\/code> in Kotlin (or write <code>? super<\/code> in Java), explain why a <code>Sink&lt;PaymentEvent&gt;<\/code> can stand in for a <code>Sink&lt;CardAuthorized&gt;<\/code>, and choose <code>out<\/code> or <code>in<\/code> for any parameter with the PECS question.","quiz":[{"q":"<code>interface Sink&lt;in T&gt; { fun accept(item: T) }<\/code>. Which assignment compiles?","options":["<code>val a: Sink&lt;PaymentEvent&gt; = cardSink<\/code> where <code>cardSink: Sink&lt;CardAuthorized&gt;<\/code>","<code>val b: Sink&lt;CardAuthorized&gt; = auditSink<\/code> where <code>auditSink: Sink&lt;PaymentEvent&gt;<\/code>","Both","Neither, unless <code>Sink<\/code> is declared <code>out<\/code>"],"answer":1,"why":"With <code>in<\/code>, the arrow flips: a sink of the supertype is a sink of the subtype. The reverse is unsafe: a card-only sink seen as a <code>Sink&lt;PaymentEvent&gt;<\/code> could be handed a refund.","from":null},{"q":"Which member can you add to <code>interface Sink&lt;in T&gt;<\/code>?","options":["<code>fun last(): T<\/code>","<code>val pending: List&lt;T&gt;<\/code>","<code>fun acceptAll(items: List&lt;T&gt;)<\/code>","<code>fun forEachPending(f: (T) -&gt; Unit)<\/code>"],"answer":2,"why":"<code>acceptAll<\/code> takes the items in: <code>List&lt;out E&gt;<\/code> inside a parameter is − × + = −, an in-position. <code>last()<\/code> and <code>pending<\/code> hand <code>T<\/code> out. In <code>forEachPending<\/code>, the <code>T<\/code> is the parameter of a parameter (− × − = +), so it is an out-position too.","from":null},{"q":"Kotlin: <code>val byId: Comparator&lt;PaymentEvent&gt; = compareBy { it.paymentId }<\/code>. Why does <code>val c: Comparator&lt;CardAuthorized&gt; = byId<\/code> fail?","options":["Comparators are covariant, so the arrow goes the other way","<code>Comparator<\/code> is <code>java.util.Comparator<\/code>, a Java interface with no declared variance, so Kotlin treats it as invariant","<code>compareBy<\/code> returns a raw type","It doesn't fail; it compiles"],"answer":1,"why":"Kotlin can't add variance to a Java interface, so <code>Comparator&lt;A&gt;<\/code> and <code>Comparator&lt;B&gt;<\/code> are unrelated unless you project: <code>Comparator&lt;in CardAuthorized&gt;<\/code>. The standard library does that in <code>sortedWith(comparator: Comparator&lt;in T&gt;)<\/code>. Kotlin's own <code>Comparable<\/code> is declared <code>in T<\/code> and behaves differently.","from":null},{"q":"Java: you write <code>static void register(Consumer&lt;CardAuthorized&gt; handler)<\/code>. A teammate has a <code>Consumer&lt;PaymentEvent&gt;<\/code>. What is the right fix?","options":["Change the parameter to <code>Consumer&lt;? super CardAuthorized&gt;<\/code>","Change the parameter to <code>Consumer&lt;? extends CardAuthorized&gt;<\/code>","Ask the teammate to cast their handler","Change the parameter to raw <code>Consumer<\/code>"],"answer":0,"why":"The handler consumes the events you pass it, so Consumer Super. <code>? extends<\/code> would let you pass a consumer of some unknown subtype, which you could never call safely. A raw type turns off checking altogether.","from":null},{"q":"From \"Covariance with out: producers\": why is <code>fun &lt;R&gt; map(f: (T) -&gt; R): Page&lt;R&gt;<\/code> allowed inside <code>data class Page&lt;out T&gt;<\/code>?","options":["Because <code>map<\/code> has its own type parameter, which exempts the whole method","Because <code>T<\/code> is the parameter of <code>f<\/code>, which is itself a parameter: two in-positions make an out-position","Because data classes skip the variance check","It isn't allowed; it needs <code>@UnsafeVariance<\/code>"],"answer":1,"why":"The page calls <code>f<\/code> and passes it a <code>T<\/code>, so values of <code>T<\/code> flow out of the page. By the sign rule, − × − = +. A new type parameter <code>R<\/code> doesn't exempt anything: <code>fun &lt;R&gt; bad(t: T): R<\/code> would still fail.","from":"gen-04"}],"cards":[{"front":"What makes a generic type safe to declare <code>in T<\/code>?","back":"<p>It only takes values of <code>T<\/code> in (parameters). No public member returns a <code>T<\/code>.<\/p>"},{"front":"With <code>Sink&lt;in T&gt;<\/code>, which way does the arrow go between <code>Sink&lt;PaymentEvent&gt;<\/code> and <code>Sink&lt;CardAuthorized&gt;<\/code>?","back":"<p><code>Sink&lt;PaymentEvent&gt;<\/code> is a subtype of <code>Sink&lt;CardAuthorized&gt;<\/code>: the arrow flips.<\/p>"},{"front":"Kotlin's <code>in T<\/code> corresponds to what in Java?","back":"<p><code>? super T<\/code>, written at the use site, e.g. <code>Consumer&lt;? super CardAuthorized&gt;<\/code>.<\/p>"},{"front":"Is <code>(PaymentEvent) -&gt; Unit<\/code> a subtype of <code>(CardAuthorized) -&gt; Unit<\/code>?","back":"<p>Yes. Function types are <code>Function1&lt;in P, out R&gt;<\/code>, so a handler of the general type fits where a specific one is expected.<\/p>"},{"front":"Why must Kotlin code write <code>Comparator&lt;in T&gt;<\/code> instead of plain <code>Comparator&lt;T&gt;<\/code>?","back":"<p>On the JVM, <code>Comparator<\/code> is the Java interface <code>java.util.Comparator<\/code>, which has no declared variance, so Kotlin treats it as invariant.<\/p>"},{"front":"What does PECS stand for?","back":"<p>Producer Extends, Consumer Super (Effective Java, Item 31). In Kotlin: producer <code>out<\/code>, consumer <code>in<\/code>.<\/p>"},{"front":"Sign rule: where does <code>T<\/code> sit in <code>fun each(f: (T) -&gt; Unit)<\/code>?","back":"<p>Parameter of a parameter: − × − = +, an out-position. Legal under <code>out T<\/code>, illegal under <code>in T<\/code>.<\/p>"}],"terms":[{"term":"Consumer","plain":"A type whose <code>T<\/code> values only go in: sinks, comparators, handlers."},{"term":"Contravariant","plain":"<code>C&lt;Super&gt;<\/code> is a subtype of <code>C&lt;Sub&gt;<\/code>: the arrow flips."},{"term":"in","plain":"Kotlin's keyword on a type parameter: \"T only goes into this type\"."},{"term":"? super T","plain":"Java's use-site wildcard for a consumer: \"T or any supertype of T\"."},{"term":"PECS","plain":"Producer Extends, Consumer Super: the Java rule for choosing wildcards."},{"term":"Function1<in P, out R>","plain":"The type behind <code>(P) -&gt; R<\/code>: contravariant in the parameter, covariant in the result."},{"term":"Sign rule","plain":"Out-positions are +, in-positions are −; multiply through nesting to find where <code>T<\/code> really sits."}],"remote":true},"gen-06":{"id":"gen-06","track":"gen","n":6,"title":"Use-site variance and type projections","ready":true,"minutes":35,"goal":"By the end you can add <code>out<\/code> or <code>in<\/code> to a single use of an invariant type such as <code>MutableList<\/code> or <code>Array<\/code>, say exactly which calls each projection allows, map it to Java's <code>? extends<\/code> and <code>? super<\/code>, and decide between declaration-site and use-site variance.","quiz":[{"q":"Inside <code>fun audit(events: MutableList&lt;out PaymentEvent&gt;)<\/code>, which line compiles?","options":["<code>events.add(CardAuthorized(\"pay_9\", 100))<\/code>","<code>val e: PaymentEvent = events[0]<\/code>","<code>events[0] = RefundIssued(\"pay_9\", 100)<\/code>","<code>val c: CardAuthorized = events[0]<\/code>"],"answer":1,"why":"Reads through an out-projection come out as the bound, <code>PaymentEvent<\/code>. Both writes are forbidden, because the real list might be a <code>MutableList&lt;RefundIssued&gt;<\/code> or a <code>MutableList&lt;CardAuthorized&gt;<\/code>, and the compiler doesn't know which. Reading into <code>CardAuthorized<\/code> fails for the same reason: the element is only known to be some <code>PaymentEvent<\/code>.","from":null},{"q":"<code>fun pad(target: MutableList&lt;in Int&gt;)<\/code>. What is the type of <code>target[0]<\/code> inside <code>pad<\/code>?","options":["<code>Int<\/code>","<code>Number<\/code>","<code>Any?<\/code>","It doesn't compile: you can't read through an in-projection"],"answer":2,"why":"The list could be a <code>MutableList&lt;Int&gt;<\/code>, <code>MutableList&lt;Number&gt;<\/code> or <code>MutableList&lt;Any?&gt;<\/code>, so the only safe promise is <code>Any?<\/code>. Reading is allowed, it just tells you little. <code>Int<\/code> is the tempting answer, but the list might hold the <code>\"EUR\"<\/code> someone put there before.","from":null},{"q":"You own <code>interface Cache&lt;K, V&gt; { fun get(key: K): V?; fun put(key: K, value: V) }<\/code>. A report wants to accept a <code>Cache&lt;String, CardFee&gt;<\/code> where it expects fees of any kind (<code>Fee<\/code>), and it only calls <code>get<\/code>. Which change is right?","options":["Declare <code>interface Cache&lt;K, out V&gt;<\/code>","Give the report's parameter the type <code>Cache&lt;String, out Fee&gt;<\/code>","Give the report's parameter the type <code>Cache&lt;String, in Fee&gt;<\/code>","Make the report take a raw <code>Cache<\/code>"],"answer":1,"why":"<code>Cache<\/code> both returns and takes <code>V<\/code>, so it must stay invariant: <code>out V<\/code> on the interface fails with <code>type parameter 'V' is declared as 'out' but occurs in 'in' position<\/code>, because of <code>put<\/code>. The report only reads, so it projects at the use site: <code>Cache&lt;String, out Fee&gt;<\/code> accepts a <code>Cache&lt;String, CardFee&gt;<\/code>, and <code>put<\/code> is unavailable through that view. <code>in Fee<\/code> would make <code>get<\/code> return <code>Any?<\/code>. Kotlin has no raw types.","from":null},{"q":"Java's <code>Collections.copy<\/code> is <code>&lt;T&gt; void copy(List&lt;? super T&gt; dest, List&lt;? extends T&gt; src)<\/code>. How does Kotlin show the <code>dest<\/code> parameter in an error message?","options":["<code>MutableList&lt;in T!&gt;!<\/code>","<code>List&lt;out T&gt;<\/code>","<code>MutableList&lt;T&gt;<\/code>","<code>List&lt;*&gt;<\/code>"],"answer":0,"why":"Java wildcards become projections: <code>? super T<\/code> becomes <code>in T<\/code>, and <code>? extends T<\/code> becomes <code>out T<\/code>. The <code>!<\/code> marks platform types, because Kotlin can't know Java's nullability. <code>List&lt;*&gt;<\/code> is how Kotlin shows a Java raw <code>List<\/code>, which is a different thing.","from":null},{"q":"From \"Contravariance with in: consumers\": the lab's <code>highest(items: List&lt;T&gt;, comparator: Comparator&lt;in T&gt;)<\/code> needs a projection on the comparator but not on the list. Why?","options":["Because <code>in<\/code> projections are always required on the last parameter","Because <code>Comparator<\/code> is a Kotlin interface declared <code>out T<\/code>","Because the list is only read, and read-only parameters never need variance","Because Kotlin's <code>List<\/code> is declared <code>out E<\/code>, while <code>java.util.Comparator<\/code> is a Java interface that Kotlin must treat as invariant"],"answer":3,"why":"Declaration-site variance does the work for <code>List<\/code>. <code>Comparator<\/code> has no declared variance on the JVM, so its flexibility has to be written at the use site, exactly like a projection on <code>MutableList<\/code>. Option three is half right: reading is why <code>out<\/code> fits, but a <code>MutableList<\/code> parameter that is only read still needs <code>out<\/code>.","from":"gen-05"}],"cards":[{"front":"What is a type projection?","back":"<p>Variance written where a type is used, such as <code>MutableList&lt;out Number&gt;<\/code> in a parameter. It narrows that one use to reading or to writing; the class itself stays invariant.<\/p>"},{"front":"Through <code>MutableList&lt;out Number&gt;<\/code>, what do <code>get<\/code> and <code>add<\/code> do?","back":"<p><code>get<\/code> returns <code>Number<\/code>. <code>add<\/code> is forbidden: the real list might be a <code>MutableList&lt;Int&gt;<\/code>.<\/p>"},{"front":"Through <code>MutableList&lt;in Int&gt;<\/code>, what type does <code>get<\/code> return?","back":"<p><code>Any?<\/code>. The list may be a <code>MutableList&lt;Number&gt;<\/code> or <code>MutableList&lt;Any?&gt;<\/code>, so nothing more specific is safe.<\/p>"},{"front":"Does <code>clear()<\/code> compile on a <code>MutableList&lt;out Payment&gt;<\/code>?","back":"<p>Yes. <code>clear()<\/code> takes no element, so a projection doesn't block it. Projections limit types, not mutation.<\/p>"},{"front":"How does Kotlin show Java's <code>List&lt;? extends Integer&gt;<\/code> and <code>List&lt;? super Integer&gt;<\/code>?","back":"<p>As <code>(Mutable)List&lt;out Int!&gt;!<\/code> and <code>MutableList&lt;in Int!&gt;!<\/code>: <code>? extends<\/code> becomes <code>out<\/code>, <code>? super<\/code> becomes <code>in<\/code>.<\/p>"},{"front":"Declaration-site or use-site variance: how do you choose?","back":"<p>If every member only produces <code>T<\/code> (or only consumes it), declare <code>out<\/code> (or <code>in<\/code>) on the class. If the class both reads and writes <code>T<\/code>, keep it invariant and project in each function that uses one side.<\/p>"},{"front":"What does <code>fun f(l: List&lt;in String&gt;)<\/code> give?","back":"<p>An error: the projection conflicts with <code>List<\/code>'s declared <code>out E<\/code>. (<code>List&lt;out String&gt;<\/code> gives only a warning: the projection is redundant.)<\/p>"}],"terms":[{"term":"Type projection","plain":"<code>out<\/code> or <code>in<\/code> written on one use of a type, giving a read-only or write-only view of it."},{"term":"Use-site variance","plain":"Variance written where a type is used (a parameter, a variable). Java's wildcards and Kotlin's projections."},{"term":"Declaration-site variance","plain":"Variance written once on the class (<code>interface List&lt;out E&gt;<\/code>), so every use gets it."},{"term":"Out-projection","plain":"<code>C&lt;out T&gt;<\/code>: you can read <code>T<\/code> values; calls that take a <code>T<\/code> are forbidden."},{"term":"In-projection","plain":"<code>C&lt;in T&gt;<\/code>: you can pass <code>T<\/code> values in; reads come back as <code>Any?<\/code>."},{"term":"Captured type","plain":"The compiler's placeholder for the one unknown real type behind a projection or wildcard (<code>CAP#1<\/code>, <code>CapturedType(out Number)<\/code>)."},{"term":"Platform type","plain":"A type from Java whose nullability Kotlin doesn't know, shown as <code>T!<\/code> (and <code>(Mutable)List<\/code> for Java lists)."}],"remote":true},"gen-07":{"id":"gen-07","track":"gen","n":7,"title":"Star projection: when you don't know the type","ready":true,"minutes":35,"goal":"By the end you can use <code>List&lt;*&gt;<\/code>, <code>MutableList&lt;*&gt;<\/code> and <code>Map&lt;*, *&gt;<\/code> for values whose type argument you don't know, predict what <code>*<\/code> allows for out, in and invariant parameters, tell it apart from <code>Any?<\/code> and from Java's raw types, and write safe <code>is<\/code> checks.","quiz":[{"q":"<code>val star: MutableList&lt;*&gt; = mutableListOf(\"pay_1\")<\/code>. Which line compiles?","options":["<code>star.add(\"pay_2\")<\/code>","<code>star.add(null)<\/code>","<code>star.removeAt(0)<\/code>","<code>val s: String = star[0]<\/code>"],"answer":2,"why":"<code>removeAt<\/code> takes an index, not an element, so the star doesn't block it. Both <code>add<\/code> calls pass an element of the unknown type, which Kotlin refuses (even <code>null<\/code>, since the type might be non-nullable). A read gives only <code>CapturedType(*)<\/code>, which is not known to be a <code>String<\/code>.","from":null},{"q":"<code>interface Source&lt;out T : Number&gt; { fun next(): T }<\/code> and <code>fun f(s: Source&lt;*&gt;)<\/code>. What is the static type of <code>s.next()<\/code> inside <code>f<\/code>?","options":["<code>Any?<\/code>","<code>Number<\/code>","<code>Nothing<\/code>","It doesn't compile: you can't call anything on a star projection"],"answer":1,"why":"For an <code>out<\/code> parameter with a bound, <code>Source&lt;*&gt;<\/code> means <code>Source&lt;out Number&gt;<\/code>, so reads keep the bound. <code>Any?<\/code> is what you'd get with no bound. <code>Nothing<\/code> is what a star gives on the <em>writing<\/em> side of an in or invariant parameter.","from":null},{"q":"You need a function that appends an audit marker string to whatever list a caller passes: a <code>MutableList&lt;String&gt;<\/code>, a <code>MutableList&lt;Any&gt;<\/code> or a <code>MutableList&lt;CharSequence&gt;<\/code>. Which parameter type fits?","options":["<code>MutableList&lt;*&gt;<\/code>","<code>MutableList&lt;Any?&gt;<\/code>","<code>List&lt;Any?&gt;<\/code>","<code>MutableList&lt;in String&gt;<\/code>"],"answer":3,"why":"The function writes <code>String<\/code>s and never reads, so it is a consumer: <code>MutableList&lt;in String&gt;<\/code> accepts lists of <code>String<\/code> or any supertype. A star forbids <code>add<\/code>. <code>MutableList&lt;Any?&gt;<\/code> accepts only lists of exactly <code>Any?<\/code>. <code>List<\/code> has no <code>add<\/code> at all. This is the \"pick the right tool\" contrast: <code>*<\/code> when you neither read typed values nor write, <code>in<\/code> when you write.","from":null},{"q":"Java: <code>List&lt;String&gt; ids = new ArrayList&lt;&gt;(List.of(\"pay_1\")); List raw = ids; raw.add(42);<\/code> Then <code>String s = ids.get(1);<\/code>. What happens?","options":["A compile error at <code>raw.add(42)<\/code>","It compiles (with an unchecked warning) and throws <code>ClassCastException<\/code> at <code>ids.get(1)<\/code>","It throws <code>ArrayStoreException<\/code> at <code>raw.add(42)<\/code>","It runs fine and <code>s<\/code> is <code>\"42\"<\/code>"],"answer":1,"why":"A raw type turns generic checking off, so the <code>Integer<\/code> goes in. Erasure means the <code>ArrayList<\/code> can't notice. The cast that javac inserted at <code>ids.get(1)<\/code> fails, far from the bad write. <code>ArrayStoreException<\/code> is the array version of this check, which lists don't have. In Kotlin the same write fails to compile, because a raw <code>List<\/code> is seen as <code>List&lt;*&gt;<\/code>.","from":null},{"q":"From \"Use-site variance and type projections\": which signature lets <code>copyAll<\/code> copy a <code>MutableList&lt;Int&gt;<\/code> into a <code>MutableList&lt;Number&gt;<\/code>?","options":["<code>fun &lt;T&gt; copyAll(from: MutableList&lt;out T&gt;, to: MutableList&lt;in T&gt;)<\/code>","<code>fun copyAll(from: MutableList&lt;*&gt;, to: MutableList&lt;*&gt;)<\/code>","<code>fun &lt;T&gt; copyAll(from: MutableList&lt;T&gt;, to: MutableList&lt;T&gt;)<\/code>","<code>fun copyAll(from: MutableList&lt;Any?&gt;, to: MutableList&lt;Any?&gt;)<\/code>"],"answer":0,"why":"<code>from<\/code> only gives values (<code>out T<\/code>) and <code>to<\/code> only takes them (<code>in T<\/code>), so <code>T = Int<\/code> works with a <code>MutableList&lt;Number&gt;<\/code> target. With stars, <code>to.add(x)<\/code> is forbidden. Plain <code>T<\/code> forces both lists to the same element type, and <code>MutableList&lt;Any?&gt;<\/code> rejects both arguments.","from":"gen-06"}],"cards":[{"front":"What does <code>List&lt;*&gt;<\/code> mean?","back":"<p>A list of one specific element type that you don't know or don't care about. Reads come out as <code>Any?<\/code>. Java's spelling is <code>List&lt;?&gt;<\/code>.<\/p>"},{"front":"Can you call <code>add(null)<\/code> on a <code>MutableList&lt;*&gt;<\/code>?","back":"<p>Not in Kotlin: <code>Null cannot be a value of a non-null type 'CapturedType(*)'.<\/code> Java's <code>List&lt;?&gt;<\/code> does allow <code>add(null)<\/code>.<\/p>"},{"front":"For <code>interface Sink&lt;in T&gt;<\/code>, what does <code>Sink&lt;*&gt;<\/code> mean?","back":"<p><code>Sink&lt;in Nothing&gt;<\/code>: no value fits, so you can't call <code>accept<\/code> at all.<\/p>"},{"front":"For <code>interface Source&lt;out T : Number&gt;<\/code>, what does <code>Source&lt;*&gt;<\/code> mean?","back":"<p><code>Source&lt;out Number&gt;<\/code>: reads give <code>Number<\/code>, because the bound survives the star.<\/p>"},{"front":"Why does <code>fun f(l: MutableList&lt;Any?&gt;)<\/code> reject a <code>MutableList&lt;String&gt;<\/code>?","back":"<p><code>MutableList<\/code> is invariant and <code>Any?<\/code> is a specific type argument. Use <code>MutableList&lt;*&gt;<\/code> if <code>f<\/code> doesn't need to add.<\/p>"},{"front":"How does Kotlin see a Java parameter of raw type <code>List<\/code>?","back":"<p>As a star projection, <code>List&lt;*&gt;<\/code>, so Kotlin code can't write unchecked elements into it.<\/p>"},{"front":"<code>payload: Any?<\/code>. Why <code>payload is List&lt;*&gt;<\/code> and not <code>payload is List&lt;String&gt;<\/code>?","back":"<p>Type arguments are erased at run time, so the JVM can only check the class. Check with a star, then check each element.<\/p>"}],"terms":[{"term":"Star projection","plain":"<code>C&lt;*&gt;<\/code>: a <code>C<\/code> of some type argument you don't know. Kotlin picks the safest projection for it."},{"term":"Unbounded wildcard","plain":"Java's <code>?<\/code> with no bound, as in <code>List&lt;?&gt;<\/code>: the Java twin of <code>*<\/code>."},{"term":"Raw type","plain":"A Java generic type used with no type arguments at all (<code>List<\/code>). Generic checks are off for it."},{"term":"in Nothing","plain":"What a star means on the writing side: only a <code>Nothing<\/code> could be passed, and no such value exists."},{"term":"Smart cast","plain":"After <code>if (x is List&lt;*&gt;)<\/code>, the compiler treats <code>x<\/code> as a <code>List&lt;*&gt;<\/code> without an explicit cast."},{"term":"Erased type","plain":"A type argument that exists only at compile time. At run time a <code>List&lt;String&gt;<\/code> is just a <code>List<\/code>."}],"remote":true},"gen-08":{"id":"gen-08","track":"gen","n":8,"title":"Type erasure and reified type parameters","ready":true,"minutes":35,"goal":"By the end you can say what the JVM erases and what survives, predict where an unchecked cast really fails, write <code>inline<\/code> functions with <code>reified<\/code> type parameters for <code>is T<\/code>, <code>as? T<\/code> and <code>T::class<\/code>, and give Java callers a <code>Class&lt;T&gt;<\/code> overload they can actually call.","quiz":[{"q":"<code>fun &lt;T&gt; isType(x: Any): Boolean = x is T<\/code>. What happens?","options":["It compiles and checks against whatever <code>T<\/code> the caller used","It doesn't compile: <code>Cannot check for instance of erased type 'T'<\/code>","It compiles with a warning and always returns <code>true<\/code>","It compiles and throws at run time"],"answer":1,"why":"Inside an ordinary generic function <code>T<\/code> is erased, so there is no class to check against. Kotlin refuses the check outright, rather than warning like it does for casts. Making the function <code>inline<\/code> with a <code>reified T<\/code> fixes it.","from":null},{"q":"<code>@Suppress(\"UNCHECKED_CAST\") val ids = loadAny() as List&lt;String&gt;<\/code>, where <code>loadAny()<\/code> really returns <code>listOf(1, 2)<\/code>. Then <code>println(ids.size)<\/code>, then <code>val first: String = ids[0]<\/code>. Which line throws?","options":["The cast","<code>println(ids.size)<\/code>","<code>val first: String = ids[0]<\/code>","None of them"],"answer":2,"why":"The cast checks only that the object is a <code>List<\/code>. <code>size<\/code> doesn't touch an element. The read is where the compiler inserted a cast to <code>String<\/code>, and that cast fails with <code>ClassCastException<\/code>. The bug is at the first line; the crash is at the third.","from":null},{"q":"Java services in your monorepo will call your new Kotlin <code>parse<\/code> API. Which shape do you publish?","options":["Only <code>inline fun &lt;reified T : Any&gt; parse(text: String): T<\/code>","<code>fun &lt;T&gt; parse(text: String): T<\/code> with an unchecked cast inside","A raw <code>Class<\/code> parameter, so any class works","<code>fun &lt;T : Any&gt; parse(text: String, type: Class&lt;T&gt;): T<\/code>, plus a one-line reified wrapper for Kotlin callers"],"answer":3,"why":"javac can't call a reified function: it is a synthetic method, and Java can't inline it. A <code>Class&lt;T&gt;<\/code> core works for both languages and does a checked <code>type.cast<\/code>, and the reified wrapper keeps Kotlin call sites short. The unchecked cast checks nothing, and a raw <code>Class<\/code> loses the link between the argument and the return type.","from":null},{"q":"<code>listOf(listOf(1), listOf(\"a\"), \"b\").filterIsInstance&lt;List&lt;String&gt;&gt;()<\/code>. What does it return?","options":["<code>[[1], [a]]<\/code>: after inlining, the check is just <code>instanceof List<\/code>","<code>[[a]]<\/code>","A compile error: <code>List&lt;String&gt;<\/code> can't be a reified type argument","An unchecked-cast warning, then <code>[[a]]<\/code>"],"answer":0,"why":"Reified fills in the outer class only. The element type <code>String<\/code> is still erased, so both lists pass the check, and there isn't even a warning. Checking elements yourself, or using a <code>KType<\/code>, is the only way to know more.","from":null},{"q":"From \"Star projection: when you don't know the type\": <code>payload: Any?<\/code> came from a JSON parser. Which code safely gets the <code>Long<\/code>s out of it?","options":["<code>(payload as List&lt;Long&gt;)<\/code>","<code>if (payload is List&lt;Long&gt;) payload else emptyList()<\/code>","<code>if (payload is List&lt;*&gt;) payload.filterIsInstance&lt;Long&gt;() else emptyList()<\/code>","<code>payload as? List&lt;Long&gt; ?: emptyList()<\/code>"],"answer":2,"why":"Check the shape with a star, then check each element: <code>filterIsInstance&lt;Long&gt;()<\/code> is reified on <code>Long<\/code>, a plain class, so each check is real. <code>is List&lt;Long&gt;<\/code> doesn't compile, and both casts check only that it's a list, so a stray string would blow up later.","from":"gen-07"}],"cards":[{"front":"What is type erasure?","back":"<p>The compiler checks type arguments and then removes them. At run time a <code>List&lt;String&gt;<\/code> is just a <code>List<\/code>, with no record of <code>String<\/code>.<\/p>"},{"front":"Where does <code>val l = listOf(1) as Any as List&lt;String&gt;<\/code> fail?","back":"<p>Not at the cast. It fails at the first read that needs a <code>String<\/code>, such as <code>val s: String = l[0]<\/code>.<\/p>"},{"front":"What do <code>inline<\/code> and <code>reified<\/code> do together?","back":"<p><code>inline<\/code> copies the function body into each call site. <code>reified<\/code> writes the caller's real class for <code>T<\/code> into that copy, so <code>is T<\/code>, <code>as? T<\/code> and <code>T::class<\/code> work.<\/p>"},{"front":"Can Java call <code>inline fun &lt;reified T : Any&gt; parse(text: String): T<\/code>?","back":"<p>No. It is a synthetic method and javac can't inline it. Provide <code>parse(text, type: Class&lt;T&gt;)<\/code> as well.<\/p>"},{"front":"Does <code>filterIsInstance&lt;List&lt;String&gt;&gt;()<\/code> check the elements?","back":"<p>No. Reified covers only the outer class; after inlining it is <code>instanceof List<\/code>, so a list of ints passes.<\/p>"},{"front":"Why is <code>inline fun &lt;reified T&gt; klassOf(x: T) = x::class<\/code> an error in Kotlin 2.4?","back":"<p><code>T<\/code> may be nullable, and <code>null<\/code> has no class. Write <code>&lt;reified T : Any&gt;<\/code>.<\/p>"},{"front":"<code>Int::class.java<\/code> vs <code>T::class.java<\/code> with a reified <code>T = Int<\/code>?","back":"<p>The first is the primitive <code>int<\/code>; the second is <code>java.lang.Integer<\/code>. Use <code>Int::class.javaObjectType<\/code> for the boxed class.<\/p>"}],"terms":[{"term":"Type erasure","plain":"Removing type arguments after compile-time checking, so objects carry no <code>&lt;String&gt;<\/code> at run time."},{"term":"Unchecked cast","plain":"A cast to a generic type that can check only the class. The compiler warns; the failure comes later."},{"term":"Heap pollution","plain":"A variable of a generic type that refers to an object of the wrong type, such as a <code>List&lt;String&gt;<\/code> holding ints."},{"term":"inline function","plain":"A function whose body the compiler copies into each call site."},{"term":"Reified type parameter","plain":"A type parameter of an inline function whose real class is available in the copied body."},{"term":"Class token","plain":"A <code>Class&lt;T&gt;<\/code> passed as an argument so code can check and cast to <code>T<\/code> at run time."},{"term":"Synthetic method","plain":"A method the compiler writes into the class file but hides from javac, as Kotlin does with reified functions."}],"remote":true},"gen-09":{"id":"gen-09","track":"gen","n":9,"title":"KClass, Class and type tokens","ready":true,"minutes":40,"goal":"By the end you can tell a <code>KClass<\/code>, a Java <code>Class<\/code> and a <code>KType<\/code> apart, explain why <code>x::class<\/code> is a <code>KClass&lt;out T&gt;<\/code>, convert between Kotlin and Java class objects, predict what fails without kotlin-reflect, and choose a <code>KClass<\/code> key or a <code>KType<\/code> key (or a super type token in Java) for a type-safe registry.","quiz":[{"q":"<code>val event: PaymentEvent = loadEvent()<\/code>. Which line compiles?","options":["<code>val k: KClass&lt;PaymentEvent&gt; = event::class<\/code>","<code>val k: KClass&lt;CardAuthorized&gt; = event::class<\/code>","<code>val k: KClass&lt;out PaymentEvent&gt; = event::class<\/code>","<code>val k: KClass&lt;PaymentEvent?&gt; = event::class<\/code>"],"answer":2,"why":"A bound class reference gives the class of some subtype of the static type: <code>KClass&lt;out PaymentEvent&gt;<\/code>. The exact <code>KClass&lt;PaymentEvent&gt;<\/code> is what a class literal <code>PaymentEvent::class<\/code> gives. <code>KClass&lt;CardAuthorized&gt;<\/code> would need the compiler to know the run-time class, and <code>KClass&lt;PaymentEvent?&gt;<\/code> breaks the <code>T : Any<\/code> bound.","from":null},{"q":"A Gradle project without kotlin-reflect runs four lines. Which one throws?","options":["<code>CardAuthorized::class.simpleName<\/code>","<code>CardAuthorized::class.isInstance(event)<\/code>","<code>typeOf&lt;List&lt;String&gt;&gt;().arguments<\/code>","<code>Origin::class.objectInstance<\/code>"],"answer":3,"why":"<code>objectInstance<\/code> describes a declaration, so it needs kotlin-reflect and throws <code>KotlinReflectionNotSupportedError<\/code>. Names, instance checks and <code>typeOf<\/code> are handled by the standard library. Printing a <code>KClass<\/code> or <code>KType<\/code> also works, just with the <code>(Kotlin reflection is not available)<\/code> suffix.","from":null},{"q":"A registry must hold a <code>Repository&lt;Payment&gt;<\/code> and a <code>Repository&lt;Refund&gt;<\/code> at the same time. Which key type do you use?","options":["<code>KClass&lt;*&gt;<\/code>, from <code>Repository::class<\/code>","<code>KType<\/code>, from <code>typeOf&lt;Repository&lt;Payment&gt;&gt;()<\/code>","<code>Class&lt;*&gt;<\/code>, from <code>Repository::class.java<\/code>","The class's <code>simpleName<\/code>"],"answer":1,"why":"Both repositories have the same class, so every class-based key (KClass, Class, or a name) collides and the second registration overwrites the first. A <code>KType<\/code> includes the type argument, so the two keys differ. In Java, a super type token's <code>Type<\/code> plays the same role.","from":null},{"q":"Java: <code>static &lt;T&gt; Type listOf() { return new TypeRef&lt;List&lt;T&gt;&gt;() {}.type; }<\/code> with the usual <code>TypeRef<\/code> super type token. What does <code>Tokens.&lt;String&gt;listOf()<\/code> return?","options":["<code>java.util.List&lt;T&gt;<\/code>: the token records the type variable, not <code>String<\/code>","<code>java.util.List&lt;java.lang.String&gt;<\/code>","The raw <code>java.util.List<\/code>","It throws <code>ClassCastException<\/code>, because <code>T<\/code> is not a <code>ParameterizedType<\/code>"],"answer":0,"why":"The anonymous subclass is compiled once, inside the generic method, and its declared superclass is literally <code>TypeRef&lt;List&lt;T&gt;&gt;<\/code>. The caller's <code>String<\/code> never reaches it. Kotlin's <code>typeOf&lt;T&gt;()<\/code> with a reified <code>T<\/code> doesn't have this hole, because the compiler writes the real type at each call site.","from":null},{"q":"From \"Type erasure and reified type parameters\": <code>fun &lt;T : Any&gt; lookup(registry: ServiceRegistry): T = registry.get&lt;T&gt;()<\/code>, where <code>get&lt;T&gt;()<\/code> is <code>inline<\/code> with <code>reified T<\/code>. What happens?","options":["It compiles and returns the service for whatever <code>T<\/code> the caller picks","It compiles, but always returns the first service registered","It doesn't compile: <code>Cannot use 'T' as reified type parameter. Use a class instead.<\/code>","It compiles and throws <code>ClassCastException<\/code> at run time"],"answer":2,"why":"<code>lookup<\/code>'s own <code>T<\/code> is an ordinary, erased type parameter, so there's no class to copy into the inlined <code>get<\/code>. Make <code>lookup<\/code> itself <code>inline<\/code> with a <code>reified T<\/code>, or give it a <code>type: KClass&lt;T&gt;<\/code> parameter and call <code>registry.get(type)<\/code>.","from":"gen-08"}],"cards":[{"front":"KClass or KType: which one knows that a value is a <code>List&lt;String&gt;?<\/code> and not just a <code>List<\/code>?","back":"<p><code>KType<\/code> (from <code>typeOf&lt;List&lt;String&gt;?&gt;()<\/code>). A <code>KClass<\/code> describes only the class: no type arguments, never nullable.<\/p>"},{"front":"Why is <code>event::class<\/code> a <code>KClass&lt;out PaymentEvent&gt;<\/code> when <code>event: PaymentEvent<\/code>?","back":"<p>The real class is some unknown subtype of <code>PaymentEvent<\/code>, and <code>out<\/code> means exactly that. Java's <code>getClass()<\/code> returns <code>Class&lt;? extends PaymentEvent&gt;<\/code> for the same reason.<\/p>"},{"front":"Why is <code>KClass<\/code> declared <code>KClass&lt;T : Any&gt;<\/code>?","back":"<p>There is no class for a nullable type: <code>String?<\/code> is backed by the class <code>String<\/code>. So <code>KClass&lt;String?&gt;<\/code> and <code>nullableValue::class<\/code> don't compile.<\/p>"},{"front":"How do you convert between <code>KClass<\/code> and Java's <code>Class<\/code>?","back":"<p><code>k.java<\/code> gives the <code>Class<\/code>; <code>c.kotlin<\/code> gives the <code>KClass<\/code>. A value's <code>Class<\/code> is <code>x.javaClass<\/code>.<\/p>"},{"front":"Without kotlin-reflect, what does <code>Origin::class.objectInstance<\/code> do?","back":"<p>Throws <code>KotlinReflectionNotSupportedError<\/code>. Anything that describes declarations needs kotlin-reflect; names, checks, casts and <code>typeOf<\/code> don't.<\/p>"},{"front":"How do you get a runtime object for the full type <code>List&lt;String&gt;<\/code> in Kotlin?","back":"<p><code>typeOf&lt;List&lt;String&gt;&gt;()<\/code>, a <code>KType<\/code>. <code>List&lt;String&gt;::class<\/code> doesn't compile: only classes are allowed on the left of <code>::class<\/code>.<\/p>"},{"front":"What is a super type token?","back":"<p>An anonymous subclass, <code>new TypeRef&lt;List&lt;String&gt;&gt;() {}<\/code>, whose generic superclass is read back by reflection. It's how Jackson's <code>TypeReference<\/code> works.<\/p>"}],"terms":[{"term":"KClass","plain":"Kotlin's run-time object for a class: <code>CardAuthorized::class<\/code>. No type arguments, never nullable."},{"term":"Class","plain":"Java's run-time object for a class: <code>CardAuthorized.class<\/code>, or <code>CardAuthorized::class.java<\/code> from Kotlin."},{"term":"KType","plain":"A full type at run time: class, type arguments and nullability. Made by <code>typeOf&lt;T&gt;()<\/code>."},{"term":"Class literal","plain":"<code>Name::class<\/code>: the class you name in code. Its type is exact, <code>KClass&lt;Name&gt;<\/code>."},{"term":"Bound class reference","plain":"<code>value::class<\/code>: the run-time class of a value, typed <code>KClass&lt;out DeclaredType&gt;<\/code>."},{"term":"kotlin-reflect","plain":"The separate jar that answers questions about declarations: members, sealed subclasses, data classes."},{"term":"Super type token","plain":"A Java trick that captures a full generic type through an anonymous subclass's superclass signature."},{"term":"Typesafe heterogeneous container","plain":"One map holding values of many types, with the type as the key, so <code>get<\/code> can return a <code>T<\/code> safely."}],"remote":true},"gen-10":{"id":"gen-10","track":"gen","n":10,"title":"Advanced generics: recursive bounds, T & Any, @UnsafeVariance","ready":false},"gen-11":{"id":"gen-11","track":"gen","n":11,"title":"Generics workshop: a type-safe container and event bus","ready":false},"rx-01":{"id":"rx-01","track":"rx","n":1,"title":"Why reactive: push, pull and backpressure","ready":true,"minutes":35,"goal":"By the end you can explain how Reactive Streams demand (<code>request(n)<\/code>) stops a fast producer from drowning a slow consumer, name the rules a subscriber must follow, and write a <code>Flow.Subscriber<\/code> that asks for items in batches.","quiz":[{"q":"A subscriber calls <code>request(3)<\/code> in <code>onSubscribe<\/code> and never calls <code>request<\/code> again. The publisher has 10 items ready. What does the subscriber receive?","options":["All 10 items, because the publisher has them ready","3 items, then <code>onComplete<\/code>","3 items, and then nothing until it requests more","1 item, because each <code>onNext<\/code> needs its own request"],"answer":2,"why":"Rule 1.1 caps <code>onNext<\/code> signals at the total requested. The publisher has more to send, so it may not complete either. It waits for more demand. Having items ready doesn't let a publisher exceed demand.","from":null},{"q":"Inside <code>onNext<\/code>, your handler fails to parse a row. What should the subscriber do?","options":["Throw the exception so the publisher can call <code>onError<\/code>","Call <code>subscription.cancel()<\/code>, record the error, and return normally","Call <code>request(0)<\/code> to signal a problem","Ignore it and call <code>request(1)<\/code> to get the next row"],"answer":1,"why":"Rule 2.13 says subscriber methods must return normally. Cancelling is the only legal way for a subscriber to stop the stream. Throwing leaves the reaction up to the publisher (<code>SubmissionPublisher<\/code> cancels; other publishers may just log), and <code>request(0)<\/code> is itself a rule violation.","from":null},{"q":"A producer thread calls <code>SubmissionPublisher.submit(event)<\/code> in a loop. One subscriber is slow and its buffer of 256 is full. What happens?","options":["<code>submit<\/code> blocks until that subscriber has room","<code>submit<\/code> drops the event and returns -1","<code>submit<\/code> throws <code>IllegalStateException<\/code>","The event goes to the other subscribers only"],"answer":0,"why":"<code>submit<\/code> blocks while any subscriber's buffer is full, which slows the producer to the slowest subscriber's pace. <code>offer<\/code> is the method that drops instead (and returns a negative number). Pick <code>offer<\/code> with a drop handler if the producer must never wait.","from":null},{"q":"Which of these is the strongest reason to choose a non-blocking, reactive design for a service?","options":["Each request will finish faster","It is easier to debug than blocking code","It can keep thousands of slow calls in flight with a few threads and little memory","It removes the need for timeouts"],"answer":2,"why":"The Spring docs say reactive code generally doesn't run faster. The gain is scale with a small, fixed number of threads, and it only shows when calls have real latency. Debugging is harder, not easier, and slow calls still need timeouts.","from":null},{"q":"From \"How virtual threads work: carriers and continuations\": a virtual thread calls a blocking card-issuer API over a socket and waits 120 ms. What does its carrier thread do during the wait?","options":["It blocks for 120 ms, like a platform thread","The JVM creates a new carrier thread for the other virtual threads","It unmounts the waiting virtual thread and runs other virtual threads","The call throws, because virtual threads cannot block"],"answer":2,"why":"Blocking socket IO parks the virtual thread and frees the carrier to run other virtual threads. That is why blocking code on virtual threads scales without a reactive rewrite. The carrier pool doesn't grow to compensate for normal IO waits.","from":"vt-02"}],"cards":[{"front":"What does <code>request(n)<\/code> promise the subscriber?","back":"<p>That the publisher will send at most <code>n<\/code> more <code>onNext<\/code> signals (rule 1.1). It may send fewer and then complete or fail.<\/p>"},{"front":"In what order can a Reactive Streams subscriber see signals?","back":"<p><code>onSubscribe onNext* (onError | onComplete)?<\/code>: one <code>onSubscribe<\/code>, any number of <code>onNext<\/code>, then at most one terminal signal.<\/p>"},{"front":"How does a subscriber stop a stream when its handler fails?","back":"<p>It calls <code>subscription.cancel()<\/code> and returns normally. Throwing from <code>onNext<\/code> breaks rule 2.13.<\/p>"},{"front":"What does <code>SubmissionPublisher.submit<\/code> do when a subscriber's buffer is full?","back":"<p>It blocks the calling thread until there is room. <code>offer<\/code> drops instead and calls your drop handler.<\/p>"},{"front":"What happens if you call <code>request(0)<\/code> on a Reactor <code>Flux.range<\/code> subscription?","back":"<p>Nothing at all. Reactor only logs it at DEBUG and the stream stalls. Spec rule 3.9 (and the JDK's <code>SubmissionPublisher<\/code>) say it must signal <code>onError(IllegalArgumentException)<\/code>.<\/p>"},{"front":"What does <code>request(Long.MAX_VALUE)<\/code> mean?","back":"<p>Unbounded demand: \"send everything, no backpressure\" (rule 3.17).<\/p>"},{"front":"Is <code>kotlinx.coroutines.flow.Flow<\/code> the same as <code>java.util.concurrent.Flow<\/code>?","back":"<p>No. The JDK one is the Reactive Streams protocol with <code>request(n)<\/code>. Kotlin's is a coroutine stream whose backpressure is suspension of <code>emit<\/code>.<\/p>"}],"terms":[{"term":"Backpressure","plain":"A way for a slow consumer to tell a fast producer how much it can take, so the producer never sends more."},{"term":"Demand","plain":"The number of items a subscriber has asked for with <code>request(n)<\/code> and not yet received."},{"term":"Publisher","plain":"The source of a stream. It sends items to a subscriber, never more than the subscriber asked for."},{"term":"Subscriber","plain":"The receiver of a stream. It gets <code>onSubscribe<\/code>, then <code>onNext<\/code> items, then <code>onError<\/code> or <code>onComplete<\/code>."},{"term":"Subscription","plain":"The link between one publisher and one subscriber. It carries <code>request(n)<\/code> and <code>cancel()<\/code> upstream."},{"term":"Terminal signal","plain":"<code>onError<\/code> or <code>onComplete<\/code>. After one of them the stream is over and nothing else arrives."},{"term":"Non-blocking IO","plain":"IO where the thread hands the request to the OS and moves on, and a callback runs when the answer arrives."}],"remote":true},"rx-02":{"id":"rx-02","track":"rx","n":2,"title":"Mono and Flux: nothing happens until you subscribe","ready":true,"minutes":35,"goal":"By the end you can tell assembly time from subscription time, predict how many times a cold <code>Mono<\/code> or <code>Flux<\/code> does its work, and choose between <code>Mono.just<\/code>, <code>fromCallable<\/code> and <code>defer<\/code>.","quiz":[{"q":"<p>What does this print?<\/p>\n<pre class=\"code\" data-lang=\"java\"><code><span class=\"n\">Flux<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">f<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Flux<\/span><span class=\"p\">.<\/span><span class=\"na\">just<\/span><span class=\"p\">(<\/span><span class=\"s\">\"a\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"b\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">map<\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"map \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">toUpperCase<\/span><span class=\"p\">();<\/span><span class=\"w\"> <\/span><span class=\"p\">});<\/span>\n<span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"built\"<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre>","options":["<code>map a<\/code>, <code>map b<\/code>, <code>built<\/code>","<code>built<\/code> only","<code>built<\/code>, <code>map a<\/code>, <code>map b<\/code>","Nothing"],"answer":1,"why":"Building the chain stores the lambda without calling it. Nobody subscribes to <code>f<\/code>, so <code>map<\/code> never runs and only <code>built<\/code> prints. The tempting first option is how <code>Stream<\/code> works with an eager terminal step; here there is no subscribe at all.","from":null},{"q":"<code>issuer.charge(req)<\/code> returns a cold <code>Mono&lt;Receipt&gt;<\/code> built with <code>fromCallable<\/code>. A handler does <code>Mono&lt;Receipt&gt; r = issuer.charge(req); r.subscribe(audit::record); return r.block();<\/code>. How many charges reach the issuer?","options":["One, because both use the same <code>Mono<\/code> object","Two, one per subscription","Zero, because <code>subscribe<\/code> and <code>block<\/code> cancel each other","It depends on which thread runs first"],"answer":1,"why":"A cold publisher runs once per subscriber. <code>subscribe<\/code> and <code>block<\/code> are two subscriptions, so the callable runs twice. Sharing a <code>Mono<\/code> object shares the recipe, not the result. Put the audit in the chain with <code>doOnNext<\/code>, or use <code>cache()<\/code> if you really need to share a result.","from":null},{"q":"<code>repo.find(id)<\/code> is a blocking call that may return <code>null<\/code>. Which line gives a lazy <code>Mono<\/code> that runs the call per subscription and is empty on <code>null<\/code>?","options":["<code>Mono.just(repo.find(id))<\/code>","<code>Mono.justOrEmpty(repo.find(id))<\/code>","<code>Flux.just(repo.find(id)).next()<\/code>","<code>Mono.fromCallable(() -&gt; repo.find(id))<\/code>"],"answer":3,"why":"<code>fromCallable<\/code> calls the lambda on each subscription and maps <code>null<\/code> to empty and exceptions to <code>onError<\/code>. <code>justOrEmpty<\/code> handles <code>null<\/code> too, but <code>repo.find(id)<\/code> is still an eager argument evaluated at assembly. <code>Mono.just(null)<\/code> would throw.","from":null},{"q":"You subscribe to <code>Mono.error(new IllegalStateException(\"declined\"))<\/code> with only an <code>onNext<\/code> lambda. What happens?","options":["The exception is thrown out of <code>subscribe<\/code> to your code","Reactor logs <code>ErrorCallbackNotImplemented<\/code> at ERROR level, and your code carries on","Nothing at all: errors without a handler are ignored silently","The JVM prints a stack trace and exits"],"answer":1,"why":"Without an error callback, Reactor routes the error to its <code>onErrorDropped<\/code> hook, which logs it at ERROR level. Your thread is not interrupted. That is why a test with no assertion on the error can pass even though the stream failed.","from":null},{"q":"From \"Why reactive: push, pull and backpressure\": you call <code>flux.subscribe(item -&gt; process(item))<\/code> with just the one lambda. What demand does that subscriber signal to the source?","options":["<code>request(1)<\/code> before each item","<code>request(256)<\/code>, then more in batches","<code>request(Long.MAX_VALUE)<\/code>: unbounded","No request until the first item arrives"],"answer":2,"why":"The lambda form of <code>subscribe<\/code> requests everything, which the <code>log()<\/code> output shows as <code>request(unbounded)<\/code>. That is rule 3.17's \"effectively unbounded\" demand: no backpressure from this subscriber. Lesson 7 of this track shows how operators like <code>limitRate<\/code> turn it back into bounded requests.","from":"rx-01"}],"cards":[{"front":"When does the lambda inside <code>flux.map(...)<\/code> run?","back":"<p>At subscription time, once per item for each subscriber. Never at assembly, and never if nobody subscribes.<\/p>"},{"front":"<code>Mono.just(fetch())<\/code> is subscribed three times. How many times does <code>fetch()<\/code> run?","back":"<p>Once, at assembly, before <code>just<\/code> is even called. All three subscribers get the same value.<\/p>"},{"front":"What does <code>Mono.fromCallable<\/code> do with a thrown exception and with a <code>null<\/code> result?","back":"<p>The exception becomes <code>onError<\/code>. <code>null<\/code> becomes an empty <code>Mono<\/code> (just <code>onComplete<\/code>).<\/p>"},{"front":"What is a cold publisher?","back":"<p>One that does its work again, from the start, for every subscriber. Most Reactor sources are cold.<\/p>"},{"front":"<code>amounts.filter(a -&gt; a &gt; 10);<\/code> on its own line, then <code>amounts.subscribe(...)<\/code>. Is anything filtered?","back":"<p>No. Operators return a new <code>Flux<\/code>. The filtered one was thrown away, so <code>amounts<\/code> is unchanged.<\/p>"},{"front":"When do you pick <code>Mono.defer<\/code> over <code>Mono.fromCallable<\/code>?","back":"<p>When the code returns a <code>Mono<\/code> (or other publisher), or must read state at subscription time, such as a nonce or <code>Instant.now()<\/code>.<\/p>"}],"terms":[{"term":"Flux","plain":"A Reactor publisher of 0 to N items, optionally ending with complete or error."},{"term":"Mono","plain":"A Reactor publisher of at most one item. <code>Mono&lt;Void&gt;<\/code> only signals completion or error."},{"term":"Assembly time","plain":"When you call operators to build the chain. Only wrapper objects are created; none of your lambdas run."},{"term":"Subscription time","plain":"When <code>subscribe<\/code> (or <code>block<\/code>) is called. The chain is linked up, demand goes up, and the source starts."},{"term":"Cold publisher","plain":"A publisher that does its work again for each subscriber."},{"term":"Hot publisher","plain":"A publisher that runs once and shares its items with whoever is subscribed. Lesson 8 of this track."},{"term":"Operator","plain":"A method like <code>map<\/code> or <code>filter<\/code> that wraps a publisher and returns a new one."}],"remote":true},"rx-03":{"id":"rx-03","track":"rx","n":3,"title":"Transforming streams: map, flatMap, concatMap","ready":true,"minutes":35,"goal":"By the end you can choose between <code>map<\/code>, <code>flatMap<\/code>, <code>concatMap<\/code>, <code>flatMapSequential<\/code> and <code>switchMap<\/code> from the requirements (order, one at a time, a concurrency limit, latest wins), and prove the choice with a virtual-time test.","quiz":[{"q":"You need to enrich 10,000 transactions with merchant data. The merchant service allows 20 concurrent calls, and the output order doesn't matter. Which line fits?","options":["<code>tx.map(t -&gt; merchants.lookup(t))<\/code>","<code>tx.concatMap(t -&gt; merchants.lookup(t))<\/code>","<code>tx.flatMap(t -&gt; merchants.lookup(t), 20)<\/code>","<code>tx.switchMap(t -&gt; merchants.lookup(t))<\/code>"],"answer":2,"why":"flatMap with concurrency 20 keeps exactly as many calls in flight as the service allows. <code>map<\/code> would produce a <code>Flux&lt;Mono&lt;...&gt;&gt;<\/code> and make no calls. <code>concatMap<\/code> is correct but makes one call at a time, and <code>switchMap<\/code> would cancel all but the last lookup.","from":null},{"q":"<code>issuer.fetchStatus(id)<\/code> returns <code>Mono&lt;String&gt;<\/code>. What happens when you subscribe to <code>ids.map(id -&gt; issuer.fetchStatus(id))<\/code>?","options":["Each status is fetched, one at a time","You receive one <code>Mono&lt;String&gt;<\/code> per id, and no issuer call is made unless something subscribes to those Monos","It doesn't compile","All statuses are fetched in parallel"],"answer":1,"why":"<code>map<\/code> wraps each returned <code>Mono<\/code> as an item, giving <code>Flux&lt;Mono&lt;String&gt;&gt;<\/code>. A <code>Mono<\/code> is a recipe; nobody subscribes to these, so nothing runs. <code>flatMap<\/code> (or <code>concatMap<\/code>) is what subscribes to the inner publishers.","from":null},{"q":"Postings for one account must reach the ledger one at a time, each after the previous one is acknowledged. A teammate proposes <code>flatMapSequential<\/code> because \"it keeps the order\". What is wrong with that?","options":["Nothing, it is the right choice","It sends all postings concurrently and only reorders the results","It drops postings that finish out of order","It cannot handle errors"],"answer":1,"why":"flatMapSequential subscribes to inners eagerly, so the ledger sees all postings at once. Only the output is reordered. <code>concatMap<\/code> is the operator that waits for each inner to complete before subscribing to the next.","from":null},{"q":"A <code>switchMap<\/code> inner is still running when the source emits a new item. What happens to that inner?","options":["It is cancelled, and its results never reach the output","It finishes, and its results are emitted after the new inner's","It is paused until the new inner completes","switchMap waits for it before starting the new inner"],"answer":0,"why":"switchMap cancels the current inner and switches to a new one for each source item. That prevents a stale slow result from overwriting a newer one, which is what can happen with flatMap.","from":null},{"q":"From \"CompletableFuture: composing async steps\": which <code>CompletableFuture<\/code> method plays the same role as Reactor's <code>flatMap<\/code> for one async step?","options":["<code>thenApply<\/code>","<code>thenAccept<\/code>","<code>thenCombine<\/code>","<code>thenCompose<\/code>"],"answer":3,"why":"<code>thenCompose<\/code> takes a function that returns another <code>CompletableFuture<\/code> and flattens it, just as flatMap subscribes to the publisher your function returns. <code>thenApply<\/code> is like <code>map<\/code>: given a function that returns a future, it produces a <code>CompletableFuture&lt;CompletableFuture&lt;T&gt;&gt;<\/code>.","from":"exec-06"}],"cards":[{"front":"What is flatMap's default concurrency in Reactor?","back":"<p>256 inners at once (and a prefetch of 32 per inner). Its first request to the source is also 256.<\/p>"},{"front":"<code>flatMap(f, 4)<\/code>: what does it request from the source?","back":"<p>4 at first, then 1 more each time an inner completes. So at most 4 inners are in flight.<\/p>"},{"front":"Does flatMap run inners on several threads?","back":"<p>No. It only subscribes to several at once. Parallelism comes from inners that are themselves asynchronous (non-blocking IO, <code>Mono.delay<\/code>, <code>subscribeOn<\/code>).<\/p>"},{"front":"Source 3, 1, 2; item i takes i x 100 ms. Output of <code>concatMap<\/code>, and when does it finish?","back":"<p><code>[3, 1, 2]<\/code> at 600 ms: one at a time, in order.<\/p>"},{"front":"What does <code>flatMapSequential<\/code> trade for ordered output at flatMap speed?","back":"<p>Memory: results that finish early are buffered until all earlier inners are done (and a slow first item holds back the rest).<\/p>"},{"front":"When does <code>switchMap<\/code> cancel an inner?","back":"<p>As soon as the source emits a new item. Only the latest item's inner is kept.<\/p>"},{"front":"Kotlin Flow equivalent of Reactor's <code>switchMap<\/code>?","back":"<p><code>flatMapLatest<\/code>, or <code>mapLatest<\/code> when the block returns one value.<\/p>"}],"terms":[{"term":"Inner publisher","plain":"The <code>Mono<\/code> or <code>Flux<\/code> your function returns inside flatMap, concatMap or switchMap."},{"term":"Flattening","plain":"Subscribing to inner publishers and merging their items into one output stream."},{"term":"Concurrency (flatMap)","plain":"The maximum number of inners flatMap keeps subscribed at once, and its first request upstream."},{"term":"Prefetch","plain":"How many items an operator requests ahead from a source so they are ready when needed."},{"term":"Head-of-line blocking","plain":"One slow item at the front holds back items behind it that are already done."},{"term":"Virtual time","plain":"A fake clock in tests (<code>StepVerifier.withVirtualTime<\/code>) that you move forward by hand, so delays take no real time."}],"remote":true},"rx-04":{"id":"rx-04","track":"rx","n":4,"title":"Combining streams: zip, merge, concat, combineLatest","ready":true,"minutes":35,"goal":"By the end you can fan out independent calls with <code>Mono.zip<\/code> without losing empty results, and choose between <code>merge<\/code>, <code>concat<\/code>, <code>zip<\/code> and <code>combineLatest<\/code> from when each source is subscribed and when output is produced.","quiz":[{"q":"<code>Mono.zip(fraudScore, fxRate)<\/code>: the fraud call fails after 50 ms; the FX call would take 2 seconds. What happens?","options":["The zip waits 2 seconds, then fails","The zip fails at about 50 ms and cancels the FX call","The zip emits the FX rate with a null fraud score","The zip retries the fraud call"],"answer":1,"why":"Combinators fail fast: the first error ends the zip and cancels the other sources. Waiting for the others is what <code>Mono.zipDelayError<\/code> does. Nothing is retried unless you add <code>retry<\/code> (lesson 5 of this track).","from":null},{"q":"A statement must show settled entries, then pending ones. The pending query is expensive and must not start until the settled list is complete. Which line fits?","options":["<code>Flux.merge(settled, pending)<\/code>","<code>Flux.mergeSequential(settled, pending)<\/code>","<code>Flux.concat(settled, pending)<\/code>","<code>Flux.zip(settled, pending)<\/code>"],"answer":2,"why":"<code>concat<\/code> subscribes to <code>pending<\/code> only after <code>settled<\/code> completes. <code>mergeSequential<\/code> produces the same output order but subscribes to both at once, so the expensive query starts early. <code>merge<\/code> interleaves, and <code>zip<\/code> pairs entries that have nothing to do with each other.","from":null},{"q":"Card events and bank events are two endless Kafka streams. A dashboard uses <code>Flux.concat(cardEvents, bankEvents)<\/code>. What does it show?","options":["Card and bank events, interleaved","Only card events, forever","Nothing until both streams complete","Bank events first, because they are smaller"],"answer":1,"why":"<code>concat<\/code> waits for the first source to complete before subscribing to the second, and an endless stream never completes. The bank stream is never subscribed. <code>merge<\/code> is the combinator for live feeds.","from":null},{"q":"Limits: 1000 at 0 ms, 2000 at 300 ms. Rates: 1.10 at 100 ms, 1.20 at 200 ms. What does <code>Flux.combineLatest(limits, rates, BigDecimal::multiply)<\/code> emit?","options":["<code>1100, 2400<\/code>","<code>1100, 1200, 2400<\/code>","<code>1100, 1200<\/code>","<code>2200, 2400<\/code>"],"answer":1,"why":"Nothing until both have emitted (100 ms: 1000 x 1.10). Then every change from either side re-emits with the latest of the other: the rate change at 200 ms gives 1200, and the limit change at 300 ms gives 2000 x 1.20 = 2400. <code>zip<\/code> would give only <code>1100, 2400<\/code>.","from":null},{"q":"From \"CompletableFuture: errors, timeouts and fan-out\": you fan out three calls with <code>CompletableFuture.allOf(a, b, c)<\/code>, and <code>a<\/code> fails at once. When does the <code>allOf<\/code> future complete?","options":["At once, exceptionally, and it cancels <code>b<\/code> and <code>c<\/code>","Exceptionally, but only after <code>b<\/code> and <code>c<\/code> have also completed","Normally, and you have to check each future yourself","Never, because one future failed"],"answer":1,"why":"<code>allOf<\/code> completes when all of the given futures complete, and exceptionally if any of them did. It does not cancel the others. That is the opposite of <code>Mono.zip<\/code>, which fails at the first error and cancels the remaining sources.","from":"exec-07"}],"cards":[{"front":"What does <code>Mono.zip<\/code> do when one of its sources completes empty?","back":"<p>It completes empty right away (no value, no error) and cancels the other sources.<\/p>"},{"front":"How do you make an empty source fail inside a <code>Mono.zip<\/code>?","back":"<p>Put <code>.switchIfEmpty(Mono.error(...))<\/code> on that source before zipping it (or <code>defaultIfEmpty(x)<\/code> if there is a sensible default).<\/p>"},{"front":"<code>merge<\/code> vs <code>concat<\/code>: when is the second source subscribed?","back":"<p><code>merge<\/code>: immediately, together with the first. <code>concat<\/code>: only after the first source completes.<\/p>"},{"front":"<code>Flux.concat(endless, other)<\/code>: what happens to <code>other<\/code>?","back":"<p>It is never subscribed, because <code>endless<\/code> never completes.<\/p>"},{"front":"When does <code>combineLatest<\/code> emit?","back":"<p>Once every source has emitted at least once, and then on every new item from any source, combined with the latest of the others.<\/p>"},{"front":"Why can't you <code>Mono.zip<\/code> a <code>Mono&lt;Void&gt;<\/code>?","back":"<p>It always completes empty, so the zip completes empty. Use <code>Mono.when(...)<\/code> to wait for side effects, then <code>.then(...)<\/code>.<\/p>"}],"terms":[{"term":"Fan-out","plain":"Starting several independent calls at once and combining their results."},{"term":"zip","plain":"Combines one item from each source, position by position; completes when any source completes."},{"term":"merge","plain":"Subscribes to all sources at once and emits their items in arrival order."},{"term":"concat","plain":"Subscribes to each source only after the previous one has completed."},{"term":"combineLatest","plain":"Emits a new combination whenever any source emits, using the latest item of each."},{"term":"DelayError variant","plain":"A version of a combinator that lets the other sources finish before reporting an error."}],"remote":true},"rx-05":{"id":"rx-05","track":"rx","n":5,"title":"Errors, retries and timeouts","ready":true,"minutes":35,"goal":"By the end you can recover from errors without pretending a stream continues, skip bad items safely, and wrap a flaky remote call in a per-attempt timeout, a filtered exponential backoff and a fallback, then prove the timing with virtual time.","quiz":[{"q":"What does <code>Flux.just(5, 10, 0, 20).map(i -&gt; 100 / i).onErrorReturn(-1).collectList().block()<\/code> return?","options":["<code>[20, 10, -1, 5]<\/code>","<code>[20, 10, -1]<\/code>","<code>[20, 10, 5]<\/code>","It throws <code>ArithmeticException<\/code>"],"answer":1,"why":"The division by zero ends the source, so 20 is never divided. <code>onErrorReturn<\/code> replaces the rest of the stream with one value and completes. The first option assumes the stream continues after the fallback, and the third is what per-item handling would give.","from":null},{"q":"An exchange-rate call sometimes hangs. Which chain retries a hanging attempt? (<code>ofMillis<\/code> and <code>ofSeconds<\/code> are <code>Duration<\/code> factories.)","options":["<code>Mono.defer(this::rate).retryWhen(Retry.backoff(3, ofMillis(100))).timeout(ofSeconds(2))<\/code>","<code>Mono.defer(this::rate).timeout(ofMillis(500)).retryWhen(Retry.backoff(3, ofMillis(100)))<\/code>","<code>Mono.defer(this::rate).retryWhen(Retry.backoff(3, ofMillis(100)))<\/code>","<code>Mono.defer(this::rate).retry(3)<\/code>"],"answer":1,"why":"Only a timeout above <code>retryWhen<\/code> turns each hanging attempt into an error that the retry can see. In the first option the timeout is a total budget: the first attempt hangs for 2 seconds and is never retried. The last two have no timeout, so a hang produces no error at all and nothing is retried.","from":null},{"q":"A Kafka consumer must log and skip messages whose amount fails to parse, and keep consuming. Which is the right shape?","options":["<code>messages.map(this::parse).onErrorResume(e -&gt; Mono.empty())<\/code>","<code>messages.map(this::parse).onErrorContinue((e, m) -&gt; log(m))<\/code>","<code>messages.concatMap(m -&gt; Mono.fromCallable(() -&gt; parse(m)).onErrorResume(e -&gt; logAndSkip(m, e)))<\/code>","<code>messages.map(this::parse).retry()<\/code>"],"answer":2,"why":"Handling the error inside each message's own <code>Mono<\/code> ends only that inner Mono, so the outer stream keeps going. The first option ends the whole stream at the first bad message. <code>onErrorContinue<\/code> happens to work here, but it acts on operators upstream of it and can leak into library code; its Javadoc recommends the inner-publisher shape. <code>retry()<\/code> re-subscribes to the consumer forever and hits the same bad message again.","from":null},{"q":"<code>issuer.authorize(id)<\/code> always fails with <code>IssuerUnavailableException<\/code>. What does <code>Mono.defer(() -&gt; issuer.authorize(id)).retry(2).block()<\/code> do?","options":["Calls the issuer 2 times, then throws <code>RetryExhaustedException<\/code>","Calls the issuer 3 times, 100 ms apart, then throws <code>IssuerUnavailableException<\/code>","Calls the issuer 3 times with no pause, then throws <code>IssuerUnavailableException<\/code>","Calls the issuer once, because <code>retry<\/code> re-uses the first result"],"answer":2,"why":"<code>retry(n)<\/code> means n retries, so 3 attempts, all back to back, and it rethrows the original error. Pauses and <code>RetryExhaustedException<\/code> come from <code>retryWhen(Retry.backoff(...))<\/code>. Because of <code>Mono.defer<\/code>, each attempt really calls the issuer; without it, a client that does the work on call would be called once.","from":null},{"q":"From \"Mono and Flux: nothing happens until you subscribe\": a teammate writes <code>Mono.just(issuerClient.authorizeBlocking(id)).retry(3)<\/code>. The call fails on the first try. How many times does the issuer receive a request?","options":["Once, and the exception is thrown before <code>retry<\/code> exists","Four times","Three times","Zero times, because nothing is subscribed"],"answer":0,"why":"<code>Mono.just<\/code> takes a value, so Java evaluates <code>authorizeBlocking(id)<\/code> first, at assembly time. It throws right there, out of the line that builds the pipeline, and <code>retry(3)<\/code> is never even created. Even if it had returned a value, <code>Mono.just<\/code> would replay that same value to every subscriber. Use <code>Mono.fromCallable<\/code> or <code>Mono.defer<\/code> so each subscription makes the call.","from":"rx-02"}],"cards":[{"front":"<code>Flux.just(1, 2, 0, 4).map(i -&gt; 8 / i).onErrorReturn(-1)<\/code>: what is emitted?","back":"<p><code>8, 4, -1<\/code>, then complete. The error ended the source, so 4 is never processed.<\/p>"},{"front":"How do you skip one bad item in a Flux without ending the stream?","back":"<p>Process each item in its own <code>Mono<\/code> inside <code>concatMap<\/code>/<code>flatMap<\/code>, and put <code>onErrorResume<\/code> on that inner Mono.<\/p>"},{"front":"Why is <code>onErrorContinue<\/code> discouraged?","back":"<p>It acts on operators upstream of it (not downstream), only works with operators that support it, and can leak into library code. Its own Javadoc says so.<\/p>"},{"front":"<code>retry(2)<\/code> on a source that always fails: how many attempts, and which error?","back":"<p>3 attempts with no pause, then the original error.<\/p>"},{"front":"<code>Retry.backoff(3, 100ms).jitter(0)<\/code> on a source that always fails: attempts, timing, error?","back":"<p>4 attempts at 0, 100, 300 and 700 ms, then <code>RetryExhaustedException<\/code> (\"Retries exhausted: 3/3\") with the last error as its cause.<\/p>"},{"front":"Why can <code>retry<\/code> fail to call the server again?","back":"<p>It re-subscribes. If the Mono was built from a call made at assembly (<code>Mono.just(call())<\/code> or a client that calls eagerly), it replays the stored answer. Wrap it in <code>Mono.defer<\/code>.<\/p>"},{"front":"<code>timeout<\/code> above vs below <code>retryWhen<\/code>?","back":"<p>Above: each attempt gets the time, and a timeout is retried. Below: one budget for the whole operation, waits included.<\/p>"}],"terms":[{"term":"Fallback","plain":"What a stream switches to when an error arrives: a value, another publisher, or a different error."},{"term":"Retry","plain":"Subscribing to the source again after an error, so a cold source does its work again."},{"term":"Exponential backoff","plain":"Waiting longer before each retry, usually doubling: 100 ms, 200 ms, 400 ms."},{"term":"Jitter","plain":"A random change to each backoff wait, so many clients that failed together don't retry at the same instant."},{"term":"RetryExhaustedException","plain":"The error <code>Retry.backoff<\/code> and <code>Retry.max<\/code> signal when the retries run out; the cause is the last real error."},{"term":"Transient error","plain":"A failure that a later attempt may not repeat: a timeout, a 503, a connection reset."},{"term":"Idempotency key","plain":"A unique id sent with a request, so the server can tell a retry from a new request and do the work once."}],"remote":true},"rx-06":{"id":"rx-06","track":"rx","n":6,"title":"Schedulers: publishOn, subscribeOn and blocking calls","ready":true,"minutes":35,"goal":"By the end you can predict which thread runs each step of a Reactor chain, move work with publishOn and subscribeOn on purpose, wrap blocking calls so they really run concurrently on boundedElastic, and replace block() inside a pipeline with composition.","quiz":[{"q":"<p>Where do A and B run?<\/p>\n<div class=\"pair\"><div class=\"pairbar\" role=\"group\" aria-label=\"Code language\"><button data-act=\"lang\" data-lang=\"java\">Java<\/button><button data-act=\"lang\" data-lang=\"kotlin\">Kotlin<\/button><button data-act=\"lang\" data-lang=\"both\">Both<\/button><\/div><div class=\"pi\" data-lang=\"java\"><span class=\"lg\">Java<\/span><pre class=\"code\" data-lang=\"java\"><code><span class=\"n\">Flux<\/span><span class=\"p\">.<\/span><span class=\"na\">range<\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">3<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">map<\/span><span class=\"p\">(<\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"w\"> <\/span><span class=\"mi\">2<\/span><span class=\"p\">)<\/span><span class=\"w\">                    <\/span><span class=\"c1\">// A<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">publishOn<\/span><span class=\"p\">(<\/span><span class=\"n\">Schedulers<\/span><span class=\"p\">.<\/span><span class=\"na\">parallel<\/span><span class=\"p\">())<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">map<\/span><span class=\"p\">(<\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">)<\/span><span class=\"w\">                    <\/span><span class=\"c1\">// B<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">subscribeOn<\/span><span class=\"p\">(<\/span><span class=\"n\">Schedulers<\/span><span class=\"p\">.<\/span><span class=\"na\">single<\/span><span class=\"p\">())<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">blockLast<\/span><span class=\"p\">();<\/span>\n<\/code><\/pre><\/div><div class=\"pi\" data-lang=\"kotlin\"><span class=\"lg\">Kotlin<\/span><pre class=\"code\" data-lang=\"kotlin\"><code><span class=\"n\">Flux<\/span><span class=\"p\">.<\/span><span class=\"na\">range<\/span><span class=\"p\">(<\/span><span class=\"m\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"m\">3<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">.<\/span><span class=\"na\">map<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"w\"> <\/span><span class=\"m\">2<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">                     <\/span><span class=\"c1\">// A<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">.<\/span><span class=\"na\">publishOn<\/span><span class=\"p\">(<\/span><span class=\"n\">Schedulers<\/span><span class=\"p\">.<\/span><span class=\"na\">parallel<\/span><span class=\"p\">())<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">.<\/span><span class=\"na\">map<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"m\">1<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">                     <\/span><span class=\"c1\">// B<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">.<\/span><span class=\"na\">subscribeOn<\/span><span class=\"p\">(<\/span><span class=\"n\">Schedulers<\/span><span class=\"p\">.<\/span><span class=\"na\">single<\/span><span class=\"p\">())<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">.<\/span><span class=\"na\">blockLast<\/span><span class=\"p\">()<\/span>\n<\/code><\/pre><\/div><\/div>","options":["A on <code>single-1<\/code>, B on a parallel thread","A on <code>main<\/code>, B on a parallel thread","Both on <code>single-1<\/code>","A on a parallel thread, B on <code>single-1<\/code>"],"answer":0,"why":"<code>subscribeOn<\/code> moves the subscription, so the synchronous <code>range<\/code> and the <code>map<\/code> right after it run on <code>single-1<\/code>, even though <code>subscribeOn<\/code> is written last. <code>publishOn<\/code> then moves everything below it to a parallel worker. The second option ignores <code>subscribeOn<\/code>; the last one mixes up which operator affects which direction.","from":null},{"q":"<code>Mono.fromCallable(dao::load).subscribeOn(Schedulers.parallel()).subscribeOn(Schedulers.boundedElastic())<\/code>. Where does <code>dao.load<\/code> run, and is that a problem?","options":["On boundedElastic, the last <code>subscribeOn<\/code>; fine","On a parallel thread, the <code>subscribeOn<\/code> nearest the source; a problem if <code>load<\/code> blocks","On both, one after the other","On the calling thread, because two <code>subscribeOn<\/code> calls cancel out"],"answer":1,"why":"Only the <code>subscribeOn<\/code> nearest the source decides where the subscription reaches the source. The outer one adds a hop on the way up and nothing else. So a blocking <code>load<\/code> would run on one of the few parallel threads, which is the pool you must never block.","from":null},{"q":"A handler calls <code>rates.current().block()<\/code> inside a <code>map<\/code>. Its unit tests, which stub <code>rates.current()<\/code> with <code>Mono.just(...)<\/code>, pass. In staging, where the item comes from a non-blocking HTTP client, it throws <code>IllegalStateException<\/code>. Why the difference?","options":["Staging runs a newer Reactor that bans <code>block()<\/code> everywhere","In staging the <code>map<\/code> runs on a non-blocking thread, which Reactor checks; <code>Mono.just(...).block()<\/code> takes a shortcut and is never checked","<code>Mono.just<\/code> is cold and the HTTP client is hot","The unit tests forgot to call <code>verify()<\/code>"],"answer":1,"why":"In the tests everything runs on the test thread, and <code>block()<\/code> on a <code>Mono.just<\/code> returns the stored value without any check. In staging the item arrives on a thread marked non-blocking, so the real <code>block()<\/code> call is refused. Replace the <code>block()<\/code> with <code>flatMap<\/code>, and make test stubs emit on a non-blocking thread (for example via <code>Mono.delay<\/code>).","from":null},{"q":"You need the balances of 200 accounts from a blocking DAO, and the database pool has 20 connections. Which line fits?","options":["<code>Flux.fromIterable(ids).flatMap(id -&gt; Mono.fromCallable(() -&gt; dao.balance(id))).subscribeOn(boundedElastic())<\/code>","<code>Flux.fromIterable(ids).flatMap(id -&gt; Mono.fromCallable(() -&gt; dao.balance(id)).subscribeOn(boundedElastic()), 20)<\/code>","<code>Flux.fromIterable(ids).publishOn(boundedElastic()).map(dao::balance)<\/code>","<code>Flux.fromIterable(ids).flatMap(id -&gt; Mono.just(dao.balance(id)), 20)<\/code>"],"answer":1,"why":"Each inner call carries its own <code>subscribeOn<\/code>, so up to 20 run at once on boundedElastic threads, matching the pool. The first option runs all 200 in turn on one thread. The third also runs them one by one, on one publishOn worker. The last calls the DAO while building each inner, on the caller's thread, so it blocks there.","from":null},{"q":"From \"Pinning, ThreadLocals and other traps\": you turn on the virtual-thread boundedElastic on JDK 21, and your JDBC driver blocks on socket reads inside <code>synchronized<\/code> methods. What happens during those reads?","options":["Nothing special: virtual threads always unmount when they block","Each blocked virtual thread pins its carrier thread until the read returns, so carriers can run out","Reactor detects it and moves the call to a pla
